# Registro curado de casos (spec 038) — la definición editorial de cada "caso"
# que agrega la ficha pública /caso/<slug>. NO es un hecho documental: es
# curación de agregación (como los briefings), por eso vive aquí y NO en Neo4j.
#
# Reglas:
#  · slug: kebab ASCII estable (es la URL pública).
#  · dek: OBLIGATORIO — 1-2 frases neutras; es el fallback del resumen cuando el
#    briefing (vault, gitignored) no está montado, y la meta description.
#  · estado / estado_kind: mantenimiento MANUAL (actualizar `updated` al tocar).
#    estado_kind ∈ instruccion | juicio | sentencia | archivado.
#  · entidades[].id: entity_id EXACTO del grafo (verificar con /search);
#    `core: true` = protagonista (va primero en la galería). `papel` es el rol
#    EN ESTE CASO (neutral, sin adjetivos acusatorios); si falta, se usa el rol
#    curado del nodo.
#  · documentos: Document.doc_id EXACTOS (con .pdf). Alimentan la sección de
#    documentos Y el filtro de la cronología (r.source_doc IN docs). Un typo =
#    cronología corta EN SILENCIO → load_cases() avisa si alguno no existe.
#    Si la lista queda vacía, la cronología se filtra por entidades.
#  · ultima_hora_tags: caseTag del feed web (web/lib/ultimaHora.ts); la ficha
#    también matchea ítems del feed por entidad.
#  · Presunción de inocencia: los estados procesales por persona NO se escriben
#    aquí — salen del grafo en vivo (accusations layer) y siempre citados.

