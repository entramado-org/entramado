  - slug: caso-leire
    titulo: "Caso Leire · las cloacas y la pieza SEPI"
    dek: >-
      La causa que instruye el juez Santiago Pedraz (Juzgado Central de Instrucción n.º 5 de
      la Audiencia Nacional) sobre una supuesta trama que buscaba desestabilizar los
      procedimientos judiciales que afectaban al PSOE y al Gobierno, según Moncloa.com
      (10-07-2026), en la que Leire Díez habría coordinado distintas actuaciones, según el
      auto de Pedraz recogido por Infobae (27-05-2026). Según El Debate (27-05-2026), Pedraz
      instruye además una pieza separada que afecta a Leire Díez y al expresidente de la
      SEPI Vicente Fernández.
    estado: >-
      Instrucción abierta en la Audiencia Nacional (seguía en curso el 2-sep-2026, según
      Libertad Digital). Leire Díez figura como investigada: la investigación se dirige,
      entre otros, contra ella, según Infobae/agencias (26-07-2026). Juan Manuel Serrano
      (expresidente de Correos) es investigado: Pedraz acordó tenerle como investigado,
      según Moncloa.com y Vozpópuli (10-07-2026). Leticia de la Hoz (abogada de Koldo
      García) declaró como investigada ante Pedraz el 14-jul-2026 y negó haber intentado
      sobornar a la empresaria Carmen Pano, según Libertad Digital (14-07-2026). Rige la
      presunción de inocencia.
    estado_kind: instruccion
    causa: "Audiencia Nacional, Juzgado Central de Instrucción nº 5 (juez Pedraz)"
