  - slug: causa-fiscal-general
    titulo: "Causa del fiscal general · la filtración del correo de González Amador"
    dek: >-
      La causa especial 20557/2024 del Tribunal Supremo contra el fiscal general del Estado,
      Álvaro García Ortiz, por la revelación del correo de 2 de febrero de 2024 en que la
      defensa de Alberto González Amador —pareja de la presidenta de la Comunidad de Madrid,
      Isabel Díaz Ayuso— comunicaba su voluntad de alcanzar una conformidad reconociendo que
      «se han cometido dos delitos contra la Hacienda Pública» (sentencia TS 1000/2025,
      p.17-18).
    estado: >-
      Sentencia 1000/2025 de la Sala Segunda del Tribunal Supremo (9-dic-2025): condena a
      García Ortiz como autor de un delito de revelación de datos reservados del art. 417.1
      CP (multa de 12 meses a 20 €/día, 2 años de inhabilitación especial para el cargo de
      fiscal general y 10.000 € de indemnización a González Amador por daños morales) y le
      absuelve «del resto de los delitos objeto de la acusación» (p.184). Las magistradas
      Susana Polo García y Ana María Ferrer García formularon un voto particular discrepante
      (p.16 y p.185).
    estado_kind: sentencia
    causa: "Causa Especial 20557/2024, Tribunal Supremo (Sala Segunda)"
    updated: "2026-10-02"
