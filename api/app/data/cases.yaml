  - slug: caso-begona-gomez
    titulo: "Caso Begoña Gómez"
    dek: >-
      El procedimiento contra la esposa del presidente del Gobierno por su actividad al
      frente de una cátedra extraordinaria de la Complutense y sus relaciones con
      empresarios adjudicatarios: de la incoación en 2024 al juicio oral ante el Tribunal
      del Jurado.
    estado: >-
      Auto de apertura de juicio oral ante el Tribunal del Jurado de 21-sep-2026 (Juzgado de
      Instrucción nº 41 de Madrid), dictado tras el auto 655/2026, de 13-jul-2026, de la
      Sección 23.ª de la AP de Madrid: Begoña Gómez acusada de tráfico de influencias y
      malversación; Cristina Álvarez solo de malversación, como cooperadora necesaria; no ha
      lugar a juicio por corrupción en los negocios (sobreseído) ni por apropiación indebida
      y administración desleal (descartados por la AP). Barrabés quedó separado del
      procedimiento del Jurado y la investigación sobre él sigue en unas diligencias previas
      aparte. Solo se mantiene la obligación de las acusadas de comparecer y estar a
      disposición del tribunal, sin otras medidas cautelares personales. El Ministerio
      Fiscal pide el sobreseimiento; acusa la acusación popular. No se ha celebrado el
      juicio ni hay sentencia: rige la presunción de inocencia.
    estado_kind: juicio
    causa: "Juzgado de Instrucción nº 41 de Madrid (Tribunal de Instancia de Madrid)"
    updated: "2026-10-02"
