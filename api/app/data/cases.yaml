  - slug: caso-david-sanchez
    titulo: "Caso David Sánchez · Diputación de Badajoz"
    dek: >-
      El procedimiento sobre la contratación del hermano del presidente del Gobierno en la
      Diputación de Badajoz, donde llegó a ocupar la jefatura de la Oficina de Artes
      Escénicas, y sobre el desempeño del puesto.
    estado: >-
      Sentencia 152/2026 de la Audiencia Provincial de Badajoz, Sección Primera
      (14-jul-2026): condena no firme a los once acusados por prevaricación administrativa a
      nueve años de inhabilitación especial para empleo o cargo público y para el derecho de
      sufragio pasivo cada uno (Gallardo, por dos delitos, a dos penas de nueve años) y
      absolución del resto de las infracciones que se les imputaban, entre ellas el tráfico
      de influencias (sentencia, pp. 373-375); el delito de aceptación de nombramiento
      ilegal que se imputaba a David Sánchez se declaró prescrito (p. 69). Cabe recurso de
      apelación ante la Sala Civil y Penal del TSJ de Extremadura (p. 376). El Ministerio
      Fiscal no formuló acusación: la acción penal la ejercieron las acusaciones populares
      (p. 369). Según EFE (vía Infobae, 14-07-2026), la defensa de David Sánchez anunció
      recurso, y según The Objective (30-07-2026), Vox recurrió en apelación para pedir
      también la condena por tráfico de influencias.
    estado_kind: sentencia
    causa: "Juzgado de Instrucción nº 3 de Badajoz → AP de Badajoz (Sección 1ª)"
