<!doctype html>
<!--
  Fuente de web/app/opengraph-image.png (tarjeta OG 1200×630).
  La original (spec 035) se generó ad hoc; este HTML existe para que la próxima
  edición no vuelva a serlo. Regenerar con:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --screenshot=web/app/opengraph-image.png \
      --window-size=1200,630 --hide-scrollbars --default-background-color=00000000 \
      "file://$PWD/web/scripts/opengraph-image.html"

  Mantener el texto en sintonía con title/DESCRIPTION de web/app/layout.tsx y con
  web/app/opengraph-image.alt.txt.
-->
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #070a12;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: #e2e8f0;
  }
  .vignette {
    position: absolute; inset: 0;
    background:
      radial-gradient(700px 420px at 74% 42%, rgba(245, 158, 11, 0.07), transparent 70%),
      radial-gradient(900px 600px at 15% 20%, rgba(30, 41, 59, 0.35), transparent 70%);
  }
  svg.graph { position: absolute; inset: 0; }
  .copy { position: absolute; left: 88px; top: 148px; width: 640px; }
  .badge {
    color: #f59e0b;
    font-size: 27px;
    font-weight: 600;
    letter-spacing: 3px;
  }
  h1 {
    margin-top: 26px;
    font-size: 92px;
    font-weight: 700;
    letter-spacing: -2px;
    color: #eef2f8;
    line-height: 1;
  }
  .tagline {
    margin-top: 34px;
    font-size: 33px;
    line-height: 1.42;
    color: #a9b6c9;
  }
  .rule {
    margin-top: 30px;
    width: 490px;
    height: 2px;
    background: #f59e0b;
    opacity: 0.85;
  }
  .cases {
    margin-top: 24px;
    font-size: 25px;
    color: #93a1b5;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="vignette"></div>
  <svg class="graph" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
