# Overlay MERCANTIL — Fase 2, TANDA 2: nodos + aristas NUEVOS (BORME).
# Cargado por `make mercantil` (load_network en mercantil_loader.py). Gate ≤1 salto:
# cada nodo nuevo cuelga de un `anchor` que YA existe (verificado 1:1 vs grafo vivo 2026-07-06).
# source_kind='mercantil'; datos oficiales BORME citados por hoja/borme_id; estructura ≠
# culpabilidad — presunción de inocencia. BORME capta admins registrales, no al dueño en la sombra.
# Fuente: findings/nearius-mercantil-recon.md + matches.candidate.yaml. Excluidos: co-admins masivos
# (Triguero 3323 / Cerdá Sanjuan 4863 / Durán Mesas 3774 = ruido) y 2º orden (Corredera et al. = 2 saltos).
# Regla durable (auditoría 2026-07-08): toda arista mercantil nueva lleva vigencia (prop `desde`
# y/o fechas en la note) o el marcador "(histórico, cesado)".

