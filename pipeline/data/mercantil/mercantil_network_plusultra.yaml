    edge: { rol: "administrador solidario registral", desde: "2023-12-11", note: "Administrador solidario con Domingo desde la constitución (según BORME, hoja M809560; nombramiento Adm. Solid. en BORME-A-2023-238-28). Figura en BORME bajo la variante tipográfica 'AMARO CHACON GUILEROMO ALFREDO'. Verificado en Nearius 2026-07-08. Estructura societaria, no imputación." }
  - anchor: "Person:guillermo-alfredo-amaro-chacon"
