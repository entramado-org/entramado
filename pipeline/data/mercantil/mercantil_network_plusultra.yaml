  # propio BORME) es Adm. Solidario con Domingo en los 4 — verificado acto por acto vía
  # historial_empresa. Aristas both-exist (los 4 Company ya son nodos, creados arriba en esta tanda).
  - anchor: "Person:guillermo-alfredo-amaro-chacon"
    rel: ADMINISTRA
