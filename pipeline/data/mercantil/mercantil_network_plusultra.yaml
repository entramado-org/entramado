  # Hojas verificadas en BORME 2026-07-08. Ex-stock SEEGMAN los 3 primeros; 3 mineras = const. 2023-24.

  # --- Recursos Iberoamericanos SL (ex Ainur Europe, reconvertida 20-05-2020) ---
  - anchor: "Person:domingo-arnaldo-amaro-chacon"
    rel: ADMINISTRA
    source: { id: "Person:domingo-arnaldo-amaro-chacon", exists: true }
    target: { type: Company, name: "Recursos Iberoamericanos SL", hoja: "M709779", provincia: "MADRID", capital_social: 3000 }
    edge: { rol: "administrador registral", note: "Administrador (según BORME, hoja M709779). Ex Ainur Europe (stock SEEGMAN), reconvertida 20-05-2020. Verificado en Nearius 2026-07-08. Estructura societaria, no imputación." }

  # --- Activos Iberoamericanos SL (BORME: LUFIEN EUROPE SL; ex stock SEEGMAN, reconvertida 20-05-2020) ---
