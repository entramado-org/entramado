# Overlay MERCANTIL — Fase 2, TANDA 4: constelación societaria Plus Ultra / Zapatero.
# spec 029. Cargado por `make mercantil` (mercantil_loader.py; claves `network:` + `companies:`).
#
# Fuente: informe de inteligencia corporativa de Nearius (BORME + CENDOJ), `Informe_inteligencia_
# corporativa.pdf`, 28-05-2026 + VERIFICACIÓN VIVA 1:1 contra Nearius/BORME (2026-07-08).
# Datos oficiales públicos (BORME) citados por hoja/borme_id. BORME capta ADMINISTRADORES
# REGISTRALES, no la titularidad real ni conducta delictiva alguna → estructura societaria, NO
# imputación. Presunción de inocencia (materia sub iudice, caso Plus Ultra).
#
# ✅ VERIFICADO EN BORME (2026-07-08) — el borrador del PDF se recortó a lo confirmado:
#   - Domingo Amaro Chacón administra los 6 satélites + Inteligencia Prospectiva + Prospectiva Tec.
#   - Guillermo Amaro Chacón administra Prospectiva Tec. + Inteligencia Prospectiva bajo la grafía
#     canónica "GUILLERMO", y ADEMÁS 4 satélites bajo la variante tipográfica del propio BORME
#     "AMARO CHACON GUILEROMO ALFREDO" (Critical Metals, Green Energy Metals, Minerales Críticos,
#     Recursos Iberoamericanos) — detectado en la auditoría independiente (mercantil_validation_
#     20260708.md, M2) y verificado acto por acto (Adm. Solid. con Domingo) el 2026-07-08.
#     Lección durable: buscar personas BORME también por variantes (CONTAINS apellidos), no solo
#     la grafía canónica. (El nodo GUILEROMO figura además en Orama Olozaga M669390 y Ramalta
#     Olozaga M669389 — sin anclaje al caso, NO cargadas.)
#   - Voli Analítica SL e Hispano Alaska SL NO existen en el BORME de Nearius → DESCARTADAS.
#   - Idella Consulenza Strategica YA es nodo (Company:idella-consulenza-strategica, tanda 2) →
#     se ENRIQUECE (companies:) y se le cuelga la arista Julio→Idella; NO se recrea (evita duplicado
#     idella-consulenza-strategica-sl).
#
# Regla durable (auditoría 2026-07-08): toda arista mercantil nueva lleva vigencia (prop `desde`
# y/o fechas en la note) o el marcador "(histórico, cesado)".
#
# Gate anti-homónimo (verificado 2026-07-08 contra entramado.org/api):
#   - Los 6 Company nuevos NO existen como nodo (slugs libres: recursos-iberoamericanos-sl, etc.).
#   - Domingo/Guillermo Amaro Chacón, Inteligencia Prospectiva, Julio/Manuel MM, Afitta SL/Capital,
#     Idella YA son nodos → se usan como ancla existente, NO se recrean.
#   - Julio Martínez Martínez (clan) ≠ Julio Martínez Sola (presidente Plus Ultra): nodos distintos, OK.

