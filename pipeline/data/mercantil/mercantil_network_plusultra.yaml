    rel: ADMINISTRA
    source: { id: "Person:domingo-arnaldo-amaro-chacon", exists: true }
    target: { type: Company, name: "Activos Iberoamericanos SL", hoja: "M714268", provincia: "MADRID", capital_social: 3000 }
    edge: { rol: "administrador registral", note: "Administrador (según BORME, hoja M714268; el BORME de Nearius la lista como LUFIEN EUROPE SL). Ex stock SEEGMAN, reconvertida 20-05-2020. Verificado en Nearius 2026-07-08. Estructura societaria, no imputación." }

