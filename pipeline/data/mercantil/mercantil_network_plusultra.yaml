companies:
  # ======================= Enriquecer nodos existentes (props-only, MATCH fill-only) =======================
  # NO tocan source_kind/summary/name. Solo rellenan props registrales BORME + is_mercantil.

  # --- Inteligencia Prospectiva (nodo del caso) ---
  # Cronología de capital (según BORME / historial_empresa M713721, verificado 2026-07-08):
  #   2020-01 Beren Europe const. 3.000 → (Alaska Ilimitada) → 2020-12 10.000 → 2022-05 264.500 →
  #   2022-12-15 701.500 € (resultante vigente). El campo capital_social del nodo Nearius mostraba
  #   437.000 (=capital APORTADO de la última ronda); el vigente es el RESULTANTE 701.500.
  - entity_id: "Company:inteligencia-prospectiva"
    type: Company
    hoja: "M713721"
    provincia: "MADRID"
    capital_social: 701500
    fecha_constitucion: "2020-01-13"
    domicilio: "Madrid"

  # --- Afitta SL / Afitta Capital SL (nodos del caso; 061 T1b 2026-09-16) ---
  # Hojas registrales verificadas en Nearius (buscar_empresa_por_nombre_exacto, borme-etl-2026.08):
  # ambas constituidas en Elda (Alicante) en 2011 (BORME-A-2011-23-03 / BORME-A-2011-68-03, sector
  # inmobiliaria) y con nombramiento+cese publicados en 2021 (BORME-A-2021-86-03), coherente con el
  # cambio de manos de 2021 que recoge la prensa. Props-only: no crean nodos ni aristas.
  - entity_id: "Company:afitta-sl"
    type: Company
    hoja: "A124034"
    provincia: "ALICANTE"
    fecha_constitucion: "2011"
    domicilio: "Elda (Alicante)"
    borme_id: "BORME-A-2011-23-03"
  - entity_id: "Company:afitta-capital-sl"
    type: Company
    hoja: "A124910"
    provincia: "ALICANTE"
    fecha_constitucion: "2011"
    borme_id: "BORME-A-2011-68-03"

  # --- Idella Consulenza Strategica (nodo existente; NO recrear) ---
  - entity_id: "Company:idella-consulenza-strategica"
    type: Company
    hoja: "A160780"
    provincia: "ALICANTE"
    capital_social: 50000
