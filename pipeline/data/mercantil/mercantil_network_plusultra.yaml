    edge: { rol: "administrador registral", note: "Administrador (según BORME, hoja M768324; el BORME de Nearius la lista como PROSPECTIVA TECNOLOGICA SL). Verificado en Nearius 2026-07-08. Estructura societaria, no imputación." }
  - anchor: "Person:guillermo-alfredo-amaro-chacon"
    rel: ADMINISTRA
    source: { id: "Person:guillermo-alfredo-amaro-chacon", exists: true }
    target: { type: Company, name: "Prospectivus Technologia SL", hoja: "M768324", provincia: "MADRID", capital_social: 9000, fecha_constitucion: "2022-07-18" }
