# Overlay MERCANTIL — Fase 2, TANDA 3 (2º ORDEN): co-administradores/testaferros de la red Aldama.
# spec 028. Cargado por `make mercantil` (load_network en mercantil_loader.py, mismo `network:` key).
#
# Cada co-admin es una Person NUEVA que cuelga por ADMINISTRA de un vehículo de Aldama que YA es nodo
# (creado en tanda 2). El gate ≤1 salto del loader sigue valiendo literal: el vehículo (target,
# exists:true) es el ancla MATCHeada; ausente → fila descartada, nunca crea huérfanos. La Person nueva
# es el `source` (rama new_is_source del loader). Idempotente. `anchor:` es documental (el loader lo ignora).
#
# source_kind='mercantil'; datos oficiales BORME citados por hoja/borme_id. BORME capta ADMINISTRADORES
# REGISTRALES, no la titularidad real ni conducta delictiva alguna → estructura societaria, NO imputación.
# Presunción de inocencia. Fuente: findings/nearius-mercantil-recon.md + matches.candidate.yaml:187-214.
#
# NÚCLEO HUMANO REAL de la red Aldama (normalizado por tamaño de cartera; cartera pequeña = señal genuina):
#   Corredera (~40, solapan 10) · Ramos García (4/3) · De Castro (26/3) · Sánchez Aguilar (16/3) · Ruiz Plaza (43/4).
# EXCLUIDOS (mass admins = ruido): Triguero 3323 / Cerdá Sanjuan 4863 / Durán Mesas 3774.
# EXCLUIDO también: el negocio propio de Corredera (urbanismo Leganés con Ángel González) = actividad ordinaria.
# Anti-homónimo verificado (2026-07-06): ninguno de los 5 existe ya como Person en el grafo vivo.
# Regla durable (auditoría 2026-07-08): toda arista mercantil nueva lleva vigencia (prop `desde`
# y/o fechas en la note) o el marcador "(histórico, cesado)".

