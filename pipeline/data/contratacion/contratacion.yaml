# Overlay CONTRATACION (PLACSP contratos menores) — data file CURADO (spec 046, Fase 2).
# Cargado por `make contratacion` (contratacion_loader.py). NO confundir con
# matches.candidate.yaml (semilla del recon 045, no se carga) ni con la capa judicial
# de contratos reificados (source_kind='contrato', contracts_loader).
#
# Reglas (spec/plan 046 + decisiones dueño 2026-07-14):
#   * AGREGADOS, nunca contrato a contrato: una arista MINOR_CONTRACTOR_OF por
#     (adjudicataria, órgano destacado curado), clave de MERGE
#     {source_kind:'contratacion', placsp_key:"agg|<organo_entity_id>"} — el NIF es
#     ATRIBUTO, nunca clave. El total global de la empresa va como props del nodo
#     (is_contratacion + placsp_*); el menudeo sin órgano destacado es solo props.
#   * total_eur NUNCA se llama amount y rango NUNCA date_* → la capa queda FUERA de
#     /flujos y de la cronología por construcción.
#   * `adjudicataria` SIEMPRE debe existir (MATCH = gate ≤1 salto); los stubs de
#     `organos:` solo se crean si faltan Y los referencia una arista con adjudicataria viva.
#   * sin_menores: negativos informativos (0 contratos menores en el barrido) — solo props.
#   * La adjudicación de un contrato menor es LEGAL: la señal editorial es el cruce con el
#     reparto del caso (y la consecuencia), nunca el contrato en sí. Presunción de inocencia.
#
# Fuente: dumps oficiales PLACSP 2018-01..2026-07 (3.568.541 adjudicaciones tras dedup;
# findings/placsp-recon.md). Totales del BARRIDO REFINADO de Fase 2 (decisión dueño
# 2026-07-14): NIF-exacto (con erratas del publicador consolidadas) + denominación exacta
# normalizada sin formas jurídicas para filas sin NIF + UTEs por NIF de UTE; dedup por
# (entry-id, adjudicatario); AwardDate corruptas (0001-01-01…) ignoradas en los rangos.
# Importes = suma de PayableAmount (EUR, en general sin IVA). Reproducible:
# scripts de sesión spec046_{aggregate,pairs}.py sobre _index/ (gitignored, re-generable
# con _placsp_recon_sweep.py). El dump 2018 incluye adjudicaciones fechadas en 2017.

