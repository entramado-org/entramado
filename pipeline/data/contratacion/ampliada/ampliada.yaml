# Overlay CONTRATACIÓN AMPLIADA (spec 055) — data file CURADO.
# Cargado por `make contratacion-ampliada` (contratacion_ampliada_loader.py). Claves
# top-level con namespace PROPIO (ampliada_*): ningún loader puede parsear el fichero
# del otro (el 046 colecciona adjudicatarias:/organos:/sin_menores:). Vive además en
# su SUBDIRECTORIO (ampliada/) y el loader aborta si se le apunta fuera — cinturón y
# tirantes.
#
# SEMÁNTICA DE CARGA: curated-overwrite sobre el namespace amp_* (este YAML MANDA:
# una corrección curada propaga en el siguiente run/Path A; lección BOE 050 — con
# fill-only las enmiendas jamás llegaban al vivo). Borrar una clave del YAML NO la
# borra del grafo (strip manual). name/summary/role/source_kind y los placsp_* del
# 046 no se tocan jamás.
#
# Reglas (spec/plan 055 + decisiones dueño 2026-07-20, gate en decisions.md):
#   * AGREGADOS, nunca contrato a contrato: una arista CONTRACTOR_OF por
#     (adjudicataria, órgano destacado curado por el dueño — 34 pares aprobados), clave de
#     MERGE {source_kind:'contratacion', placsp_key:"<ambito>|<organo_entity_id>"} con
#     ambito ∈ {lic, agr, ccaa_andalucia, ccaa_euskadi, ccaa_galicia}. El NIF es ATRIBUTO.
#   * Señales de licitación como props (n_emergencia, n_negociado_sp, via_ute,
#     presupuesto_total_eur); total_eur NUNCA se llama amount y rango NUNCA date_* → la
#     capa queda FUERA de /flujos y de la cronología por construcción.
#   * Totales por ámbito de la adjudicataria → props del nodo (amp_<ambito>_*, curated-overwrite).
#   * `adjudicataria` SIEMPRE debe existir (gate ≤1 salto); stubs de `organos:` solo si
#     faltan y los referencia una arista con adjudicataria viva.
#   * sin_adjudicaciones: negativos informativos (0 adjudicaciones DIRECTAS en el barrido
#     2012→2026-07) — solo props (amp_sin_adjudicaciones + amp_nota).
#   * ⚠️ IVA: importes de contratosdegalicia.gal vienen C/IVA en la fuente → aquí van
#     NORMALIZADOS s/IVA (/1,21) y anotados. Euskadi (awardAmount) y Andalucía s/IVA;
#     PLACSP PayableAmount en general s/IVA.
#   * Los totales de adjudicatarias too_generic (cap 200 hits/dataset del recon) son
#     SUELO, no total — anotado en su nota.
#   * Adjudicarse una licitación o un menor es LEGAL: la señal editorial es el cruce con
#     el reparto del caso y las señales de procedimiento (emergencia, negociado sin
#     publicidad, vía UTE, % del tope), nunca la adjudicación en sí. Presunción de
#     inocencia.
#
# Fuentes: PLACSP sindicaciones 643 (licitaciones 2012→2026-07, 3.965.649 resultados) y
# 1044 (plataformas agregadas 2016→2026-07, 1.636.035), datos abiertos de menores de la
# Junta de Andalucía (CKAN 2018→2026Q1), api.euskadi.eus (menores) y
# contratosdegalicia.gal (menores, barrido de alta señal 25 organismos, SERGAS excluido).
# Agregados por par recomputados desde _cruce_lic|_agr|_ccaa_* (gitignored,
# re-derivables con _placsp_recon_sweep.py y los adaptadores _ccaa_*_fetch.py; dedup por
# (entry-id, adjudicatario) con NIF de la semilla, gotcha «NIF con ; final» corregido).
# Semillas matches*.candidate.yaml = registro del recon, JAMÁS se cargan.

