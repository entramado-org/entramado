- slug: servinabar-nunca-sola
  titulo: 'Servinabar: la constructora local que concurría en UTE con Acciona'
  tesis: 'Servinabar 2000, sociedad navarra que aparece en la causa del Tribunal Supremo sobre Santos
    Cerdán, ha concurrido a obra pública en unión temporal de empresas (UTE) con Acciona. Según el auto
    del Tribunal Supremo de 30 de junio de 2025 que acordó la prisión provisional de Cerdán (p.11), en
    un registro se intervino un contrato privado de compraventa por el que el administrador único de
    Servinabar cedía a Santos Cerdán 1.350 de las 3.000 participaciones sociales de la mercantil (el 45
    %). Cerdán reconoció su firma y explicó en su declaración que el documento no llegó a elevarse a
    público y que lo suscribió cuando, tras unos malos resultados electorales del PSOE en Navarra, valoró
    dejar la política, posibilidad que dice haber descartado el fin de semana siguiente. El instructor
    considera que la falta de elevación a público no le privaría de eficacia entre las partes y contrapone
    esa explicación al hecho de que el administrador conservara el documento y a los vínculos de Cerdán
    con Servinabar años después (p.11). Según un oficio de la UCO citado por OKDiario (24-06-2025), el
    contrato está fechado el 1 de junio de 2016. Un auto del Tribunal Supremo (ATS
    8611/2025, p.6) recoge que Servinabar «concurrió, precisamente en U.T.E. con Acciona, a la ejecución
    de ciertas obras». Según un informe de la UCO (p.34), la UTE Pabellón Navarra Arena, formada por
    Acciona Construcción y Servinabar 2000, resultó adjudicataria en octubre de 2017 de las obras de
    adecuación de ese pabellón por 3,7 millones de euros. Según OKDiario (24-06-2025), la sociedad
    pública Nasuvinsa adjudicó a la UTE Acciona-Servinabar 46 viviendas de protección oficial; según El
    Español (30-07-2025), Servinabar participó en la rehabilitación del antiguo Archivo General de
    Navarra, y según Libertad Digital (29-07-2026), las obras de los túneles de Belate se adjudicaron a
    una UTE formada por Acciona, Excavaciones Fermín Osés y Servinabar. Son hechos en investigación;
    rige la presunción de inocencia.'
