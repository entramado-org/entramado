  - fecha: '2017-10-10'
    hecho: 'Según el informe de la UCO, la mesa de contratación del Instituto Navarro de Deporte y
      Juventud propone a la UTE formada por Acciona y Servinabar para las obras de los lotes 4 y 5 de
      adecuación del pabellón Navarra Arena, en Pamplona, por 3,7 millones de euros; días después se
      constituye formalmente la UTE Pabellón Navarra Arena entre Acciona Construcción y Servinabar
      2000.'
    fuentes:
    - uco-navarra-arena
  - fecha: '2025-06-30'
    hecho: 'El Tribunal Supremo acuerda la prisión provisional de Santos Cerdán. El auto señala su
      vinculación con Servinabar, «empresa que resultó adjudicataria de ciertas obras públicas,
      precisamente actuando en U.T.E., pese a sus mínimas dimensiones y nula experiencia en el negocio
      de la construcción, con ACCIONA CONSTRUCCIONES» (p. 10), y recoge que en el registro del domicilio
      del administrador único de Servinabar se intervino un contrato privado por el que este cedía a
      Cerdán 1.350 de las 3.000 participaciones de la sociedad (el 45 %); el documento, como explicó
      Cerdán en su declaración, no llegó a elevarse a público (p. 11). El auto describe indicios de una
      organización orientada a obtener «premios económicos por la ilícita adjudicación de obra pública»
      (p. 15). Son indicios de la fase de instrucción; rige la presunción de inocencia.'
    fuentes:
    - auto-prision-vinculacion
    - auto-prision-participaciones
    - auto-prision-organizacion
  - fecha: '2025-09-18'
    hecho: 'Un nuevo auto del Tribunal Supremo recoge que Servinabar «concurrió, precisamente en U.T.E.
      con Acciona, a la ejecución de ciertas obras» y que, según declaró un empleado de Acciona, no
      aportaba a la UTE más valor añadido que el de tratarse de una empresa local.'
    fuentes:
    - ats-ute
  - fecha: '2025-11-19'
    hecho: 'Según Infobae (19-11-2025), el magistrado del Tribunal Supremo Leopoldo Puente decreta la
      libertad provisional de Santos Cerdán al considerar «seriamente mitigado» el riesgo de destrucción
      de pruebas que motivó su ingreso en prisión el 30 de junio; Cerdán sale ese día de la prisión de
      Soto del Real tras cinco meses en prisión provisional.'
    fuentes:
    - infobae-libertad-cerdan
