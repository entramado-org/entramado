# Curated DOCUMENT-TYPE metadata — loaded by `make documents`
# (pipeline/src/documents_loader.py). Pure metadata: SETs d.doc_type on the
# existing Document nodes so evidence weight is queryable (a Tribunal Supremo
# auto is not a parliamentary debate phrase). Idempotent; MATCH-only.
#
# doc_type ∈ { auto_judicial | informe_uco | transcripcion_parlamentaria |
#              escrito_acusacion | auditoria | otros }
#
# date: AAAA-MM-DD — la fecha CURADA del documento (la que ordena /documentos y
# documentos_recientes). Si se omite, el loader la deriva del nombre de fichero
# cuando éste contiene una fecha completa. Las fechas explícitas de abajo se han
# tomado de la cabecera/disposición del propio documento ("Fecha:", "En Madrid, a…",
# "Sesión celebrada el…"); ver el log de la sesión 2026-06-26.

