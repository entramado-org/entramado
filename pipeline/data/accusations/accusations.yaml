# Curated, document-grounded ACCUSED_OF overlay (Person -> Crime).
# Loaded by `make accusations` (src/accusations_loader.py) as source_kind='acusacion'.
# Additive + idempotent: guarantees each defendant's REAL charge set is present
# (creating any Crime node that cleanup's allowlist dropped), without deleting or
# overwriting document-sourced edges.
#
# PRESUMPTION OF INNOCENCE: these are charges/imputaciones in OPEN procedures, each
# cited to a corpus document + penal article + verbatim quote, exactly as the source
# frames them — never presented as proven.
#
# To extend/correct: edit this file, then `make accusations`. Crime `name` must match
# the canonical short form (slugged into the Crime entity_id), so it coincides with
# any already-extracted Crime of the same name. Optional `page:` (per crime) is the page
# of the doc that holds the quote; it loads as the edge's `source_page` ([doc, p.N]).
#
# `status:` (per defendant, overridable per crime) records the PROCEDURAL STAGE —
# investigado | imputado | procesado | acusado | condenado | absuelto | archivado —
# so the UI/chat never blur an alleged charge with a proven one. A crime with
# status: condenado (or explicit `type: CONVICTED_OF`) loads as CONVICTED_OF;
# everything else stays ACCUSED_OF. Default status: acusado.
#
# `estado:` (por defendant, spec 061) es el REGISTRO DE ESTADO PROCESAL y manda
# sobre `status:`. Forma:
#   estado:
#     status: investigado|imputado|procesado|acusado|condenado|absuelto|archivado
#     fecha: 'YYYY-MM-DD'          # fecha del acto procesal que fija el estado
#     fuente: {doc: <pdf del corpus> | url: <https://…>, tipo: <tipo de acto>}
#     revisado: 'YYYY-MM-DD'       # última revisión humana de la fila
#     nota: <opcional>
# `fuente.tipo` ∈ escrito_acusacion | auto_apertura_juicio_oral | auto_procesamiento |
# sentencia | auto | providencia | prensa. `acusado`/`procesado` EXIGEN uno de los
# tres primeros (un acto acusatorio formal); `prensa` solo sostiene
# investigado/imputado y la API lo presenta como «según prensa». El loader propaga
# ese estado (+ fecha, fuente y tipo) a las ACCUSED_OF de la persona — incluidas
# las extraídas de documentos —, nunca a CONVICTED_OF (firmeza = documents.yaml,
# spec 059) ni a las de prensa/última hora. Sin fila `estado`, la API muestra
# «investigado», nunca «acusado».
# ⚠️ Un `status:` puesto EN LA FILA DE UN DELITO manda sobre el `estado` de la
# persona y la propagación no lo pisa (así convive «investigado» por un cargo con
# «absuelto» de otro); una arista ya absuelta/archivada tampoco se reabre.
#
# ⚠️ Removing a crime from this file does NOT delete its previously loaded
# 'acusacion' edge (prune only touches extracted edges). Graph updates of this
# layer = Path A rebuild: DELETE all source_kind='acusacion' edges on the
# ephemeral, then `make accusations` (QA pase 3, 2026-08-15).

accusations:
  # Diligencias Previas 77/2024-S (Tribunal Central de Instancia, Plaza nº 2, Madrid;
  # auto de 18-05-2026 de entradas y registros). Caso Plus Ultra / Venezuela / Análisis
  # Relevante. (Es el EX-PRESIDENTE, no un homónimo — ver _memory findings/accusation-
  # cleanup.) QA pase 3 (2026-08-15): la portada del auto solo enumera los delitos DE LA
  # CAUSA; los únicos que el auto atribuye a Zapatero EN PERSONA (p.29) son la dirección
  # de la trama (organización criminal) y el tráfico de influencias → borrados
  # apropiación indebida, falsedad documental y blanqueo de capitales (doctrina
  # protectora: menos datos y correctos).
  - person: José Luis Rodríguez Zapatero
    entity_id: Person:jose-luis-rodriguez-zapatero
    doc: auto-zapatero.pdf
    status: investigado   # Diligencias Previas 77/2024-S, fase de instrucción
    estado:
      status: investigado
      fecha: '2026-05-18'
      fuente: {doc: auto-zapatero.pdf, tipo: auto}
      revisado: '2026-09-09'
      nota: auto de entradas y registros de 18-05-2026 (DP 77/2024-S)
    # 063 (24-09-2026): fuera «organización criminal» — el auto solo la nombra como delito de la causa (p.1)
    # y en la proporcionalidad de los registros; ninguna frase se la atribuye personalmente (árbitro a4699ae4).
    crimes:
      - name: tráfico de influencias
        article: art. 428 CP
        page: 29
        quote: "José Luis Rodríguez Zapatero dirige la trama organizada para el ejercicio de una ilícita actividad de tráfico de influencias"

  # Caso Cátedra TSC (Tribunal del Jurado 1146/2024, JI nº 41 Madrid) — auto de APERTURA
  # DE JUICIO ORAL de 20-06-2026 (en corpus). La AP de Madrid (auto de 16-07-2026, aún
  # NO en corpus — candidata a ingesta) mantuvo el juicio con jurado SOLO por tráfico de
  # influencias y malversación, sobreseyendo corrupción en los negocios y apropiación
  # indebida, y levantó las cautelares. El Ministerio Fiscal pidió el sobreseimiento;
  # la acusación es popular. QA pase 3: entrada reescrita (antes: imputada, 4 delitos
  # con 2 quotes misatribuidas del auto de 11-04-2026).
  - person: Begoña Gómez
    entity_id: Person:begona-gomez
    doc: auto-peinado-juicio-oral-begona-2026-09-21.pdf
    status: acusado   # auto de apertura de juicio oral con jurado de 21-09-2026 (en corpus, p.65)
    estado:
      status: acusado
      fecha: '2026-09-21'
      fuente: {doc: auto-peinado-juicio-oral-begona-2026-09-21.pdf, tipo: auto_apertura_juicio_oral}
      revisado: '2026-09-30'
      nota: >-
        063 (30-09-2026): auto de apertura de juicio oral ante el Tribunal del Jurado de 21-09-2026 (Tribunal del Jurado
        1146/2024, 67 págs., CSV 1296335874013465898025), ingerido al corpus; p.65: apertura contra ella por tráfico de
        influencias y malversación. No es firme ni hay juicio; la Fiscalía pide el sobreseimiento y acusa solo la
        acusación popular unificada. Historia anterior:
        Retro-fix 061 T0c (11-09-2026). El auto de 11-04-2026 (en corpus) es el de imputación y continuación del
        procedimiento por los trámites del Tribunal del Jurado (p.38: «SE ACUERDA LA CONTINUACIÓN DEL PROCEDIMIENTO»),
        no un auto de procesamiento (revisión Codex F1). El auto de apertura de juicio oral de 20-06-2026 (en corpus)
        quedó sin recorrido: según Infobae (16-07-2026), la Sección 23 de la AP de Madrid limitó ese día
        el juicio con jurado a tráfico de influencias y malversación, y según EFE (vía Infobae, 06-09-2026)
        ese auto «reordenó» el procedimiento y lo retrotrajo a abril, de modo que las partes volvieron a
        presentar sus escritos; la audiencia preliminar se repitió el 08-09-2026 (Infobae, The Objective) y
        Peinado prevé dictar un nuevo auto de apertura antes de su jubilación el 27-09-2026 (EFE). La
        acusación la sostiene la acusación popular (13 años, según Libertad Digital 27-07-2026); la
        Fiscalía anunció conclusiones absolutorias (LD/Vozpópuli 28-07-2026). Cuando se dicte el auto
        definitivo: status acusado, fuente auto_apertura_juicio_oral.
    # 063 (30-09-2026): delitos re-citados al auto de apertura de 21-09-2026 (p.65). Antes (24-09): auto de 11-04-2026 (p.38; el tramo sobre Barrabés,
    # limitado a tráfico de influencias y corrupción en los negocios, se omite con «...»); antes citaban el auto de
    # apertura de 20-06-2026, que quedó sin efecto (tanda del dueño 2d5a9fa0/eac1f4e5). Solo los dos delitos que
    # la AP de Madrid mantuvo (16-07-2026).
    crimes:
      - name: tráfico de influencias
        article: art. 428 CP
        doc: auto-peinado-juicio-oral-begona-2026-09-21.pdf
        quote: "CONTRA LA ACUSADA MARÍA BEGOÑA GÓMEZ FERNÁNDEZ, EN CONCEPTO DE AUTORA, POR LOS DELITOS DE TRÁFICO DE INFLUENCIAS Y MALVERSACIÓN DE CAUDALES PÚBLICOS"
      - name: malversación
        article: art. 432 CP
        doc: auto-peinado-juicio-oral-begona-2026-09-21.pdf
        quote: "CONTRA LA ACUSADA MARÍA BEGOÑA GÓMEZ FERNÁNDEZ, EN CONCEPTO DE AUTORA, POR LOS DELITOS DE TRÁFICO DE INFLUENCIAS Y MALVERSACIÓN DE CAUDALES PÚBLICOS"

