- id: Organization:cnmc
  name: Comisión Nacional de los Mercados y la Competencia
  role: Autoridad independiente de competencia y regulación de mercados desde 2013.
- id: Organization:comision-nacional-de-la-competencia
  name: Comisión Nacional de la Competencia
  role: Autoridad de competencia 2007-2013 (precedente de la actual CNMC).
- id: Organization:consejo-general-del-poder-judicial
  name: Consejo General del Poder Judicial
  role: Órgano de gobierno de los jueces; sus acuerdos y reales decretos de nombramiento de la carrera judicial
    se publican en la sección II.A del BOE.
- id: Organization:delegacion-del-gobierno-en-la-comunidad-de-madrid
  name: Delegación del Gobierno en la Comunidad de Madrid
  role: Representación del Gobierno de España en la Comunidad de Madrid.
- id: Organization:direccion-general-de-la-policia
  name: Dirección General de la Policía
  role: Órgano del Ministerio del Interior del que depende la Policía Nacional.
- id: Organization:generalitat-de-cataluna
  name: Generalitat de Cataluña
  role: Gobierno de la comunidad autónoma de Cataluña.
- id: Organization:gobierno-de-canarias
  name: Gobierno de Canarias
  role: Gobierno de la comunidad autónoma de Canarias.
- id: Organization:gobierno-de-las-illes-balears
  name: Govern de les Illes Balears
  role: Gobierno de la comunidad autónoma de las Illes Balears.
- id: Organization:ministerio-de-asuntos-exteriores
  name: Ministerio de Asuntos Exteriores
  role: Departamento de la acción exterior del Estado (denominaciones variables por legislatura); los nombramientos
    de embajadores se publican en la sección II.A del BOE.
- id: Organization:ministerio-de-ciencia
  name: Ministerio de Ciencia
  role: Departamento de la política de I+D+i y universidades (denominaciones variables por legislatura).
- id: Organization:ministerio-de-economia
  name: Ministerio de Economía
  role: 'Departamento de política económica (denominaciones variables por legislatura: Economía y Hacienda, Asuntos
    Económicos y Transformación Digital…).'
- id: Organization:ministerio-de-educacion
  name: Ministerio de Educación
  role: Departamento de la política educativa (denominaciones variables por legislatura).
- id: Organization:ministerio-de-medio-ambiente
  name: Ministerio de Medio Ambiente
  role: Departamento de la política ambiental 2004-2011 (luego Medio Ambiente y Medio Rural y Marino; precedente
    del actual MITECO).
- id: Organization:ministerio-de-politica-territorial
  name: Ministerio de Política Territorial
  role: Departamento de la organización territorial del Estado (denominaciones variables por legislatura); de él
    dependen delegaciones y subdelegaciones del Gobierno.
- id: Organization:ministerio-de-sanidad
  name: Ministerio de Sanidad
  role: Departamento de la política sanitaria del Gobierno de España (denominaciones variables por legislatura).
- id: Organization:ministerio-de-vivienda
  name: Ministerio de Vivienda
  role: Departamento de la política de vivienda y agenda urbana (denominaciones variables por legislatura).
- id: Organization:ministerio-para-la-transformacion-digital
  name: Ministerio para la Transformación Digital y de la Función Pública
  role: Departamento de la agenda digital y la función pública (2023+).
- id: Organization:museo-reina-sofia
  name: Museo Nacional Centro de Arte Reina Sofía
  role: Museo público estatal de arte contemporáneo, adscrito al Ministerio de Cultura.
- id: Organization:patrimonio-nacional
  name: Patrimonio Nacional
  role: Organismo público que administra los bienes del Estado de origen real; su consejo de administración se nombra
    por real decreto.
- id: Organization:tribunal-de-defensa-de-la-competencia
  name: Tribunal de Defensa de la Competencia
  role: Autoridad de competencia 1963-2007 (precedente de la CNC y de la actual CNMC).
- id: Organization:tribunal-economico-administrativo-central
  name: Tribunal Económico-Administrativo Central
  role: Órgano administrativo de revisión en materia tributaria, adscrito al Ministerio de Hacienda.
