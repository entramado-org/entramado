# Overlay BOE (spec 049, Fase 2) — data file CURADO. Este fichero SÍ se carga
# (`make boe`); la semilla del recon (matches.candidate.yaml) NUNCA se carga.
#
# Reglas editoriales:
# - Un nombramiento o cese es un acto administrativo LEGAL y público (sección II.A
#   del BOE): la capa registra trayectoria institucional, no hechos ni indicios del
#   caso. Presunción de inocencia. Atribución «(según BOE — nombramiento/cese
#   oficial…)»; se cita el id BOE-A-… con su enlace, nunca [doc, p.N].
# - Una etapa = un cargo con su disposición de nombramiento y (si consta en la
#   semilla) la de cese. fecha_cese null = sin cese registrado EN ESTA CAPA (cargo
#   vigente o cese fuera de la semilla del recon: RD colectivos jun-2018, ventana).
# - `incidencias` (acuerdos CGPJ de servicios especiales/adscripción, excedencias,
#   reingresos) se documentan aquí pero NO crean aristas.
# - Los organismos listados en `organismos:` son stubs onCreate-only; el resto de
#   los targets son nodos vivos verificados (2026-07-16). Curación: sesión 72
#   (decisiones 2026-07-16c), pares duplicados fusionados via merges.yaml.
organismos:
# (dedup 2026-08-03) Fiscalías separadas del nodo genérico Organization:fiscalia:
- id: Organization:fiscalia-anticorrupcion
  name: Fiscalía Anticorrupción
  label: Organization
  role: Fiscalía Especial contra la Corrupción y la Criminalidad Organizada («Fiscalía Anticorrupción»), órgano del Ministerio Fiscal especializado en delitos económicos y corrupción de especial trascendencia. Denominación anterior (1995-2007) «Fiscalía Especial para la Represión de los Delitos Económicos relacionados con la Corrupción».
- id: Organization:fiscalia-general-del-estado
  name: Fiscalía General del Estado
  label: Organization
  role: Órgano que dirige el Ministerio Fiscal en toda España; a su frente está el/la Fiscal General del Estado.
- id: Organization:fiscalia-de-la-audiencia-nacional
