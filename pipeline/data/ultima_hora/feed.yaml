  headline: >-
    Pedraz prorroga seis meses, hasta el 10 de junio de 2027, la instrucción del caso Leire Díez: siguen
    pendientes las declaraciones como investigados de Santos Cerdán, Leire Díez, Gaspar Zarrías y Javier
    Pérez Dolset
  dek: >-
    Según Europa Press (3 de noviembre de 2026), que ha tenido acceso al auto, el juez de la Audiencia
    Nacional Santiago Pedraz ha acordado, siguiendo el criterio de la Fiscalía Anticorrupción, prorrogar
    seis meses la instrucción del caso Leire Díez, desde el 10 de diciembre de 2026 hasta el 10 de junio
    de 2027. El juez alude a la complejidad y exhaustividad de la instrucción y a la gravedad de los hechos,
    afirma que «son múltiples las diligencias de investigación aún pendientes de practicar» y no descarta
    que surjan «nuevos elementos sobre los que deberán practicarse nuevas diligencias». Entre lo pendiente
    figuran las declaraciones como investigados de Santos Cerdán, Leire Díez, Gaspar Zarrías y Javier
    Pérez Dolset, a expensas del análisis de la documentación hallada en las entradas y registros practicados.
    Son diligencias de instrucción en curso. Rige la presunción de inocencia.
