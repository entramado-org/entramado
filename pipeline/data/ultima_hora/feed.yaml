  headline: >-
    La UCO atribuye al PSOE el origen de 43.225 euros recibidos por Leire Díez mediante
    intermediarios, según Qué.es (15-07-2026)
  dek: >-
    Según Qué.es (15-07-2026), un informe de la UCO describe cuatro transferencias de
    4.000 euros cada una, por un total de 16.000 euros, recibidas por Leire Díez de Zaño
    Sociedad Consultora, vinculada a Gaspar Zarrías, entre junio y septiembre de 2024, y
    una quinta transferencia de 27.225 euros procedente de Oliver Gruppe, relacionada
    con el abogado Ismael Oliver. Según el periódico, los investigadores atribuyen al
    PSOE el origen de esos fondos. La misma información cifra en 7.505,17 euros el coste
    soportado por Zaño por cada nómina de 4.000 euros y señala que ese importe coincidía
    con lo abonado por el partido a la sociedad. Respecto de la vía de Oliver, el diario
    recoge que se habrían interpuesto dos despachos profesionales y que la UCO no podía
    afirmar con total rotundidad la cuenta concreta de origen. Son indicios de una
    investigación en curso; rige la presunción de inocencia.
