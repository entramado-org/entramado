  headline: >-
    El juez Moreno pide a la UCO que informe sobre el estado y la custodia del teléfono
    intervenido a Joseba García, hermano de Koldo, tras denunciar este una incidencia
    con la tarjeta SIM
  dek: >-
    Según Europa Press (vía El Debate, 4 de septiembre de 2026), el juez de la Audiencia
    Nacional Ismael Moreno, instructor del caso Koldo, ha pedido en una providencia a la
    Unidad Central Operativa (UCO) de la Guardia Civil que informe «sobre el estado y
    custodia» de un teléfono intervenido a Joseba García Izaguirre, hermano del exasesor
    Koldo García. Según Infobae (3 de julio de 2026), Moreno había citado a Joseba
    García como investigado, junto a Jésica Rodríguez e Ignacio Zaldívar, por presuntos
    delitos de malversación y tráfico de influencias en relación con la contratación de
    Rodríguez en empresas públicas; según el escrito de la Fiscalía recogido por
    Libertad Digital (3 de julio de 2026), en su caso únicamente por la contratación en
    Ineco. Según la información de Europa Press, el juez accede así a una petición del
    propio Joseba, después de que la Fiscalía Anticorrupción diera el visto bueno «con
    el fin de alejar cualquier sombra de duda sobre la custodia y conservación de los
    efectos intervenidos». Según un escrito de Anticorrupción, Joseba denunció «una
    incidencia relativa a la tarjeta SIM de su teléfono intervenido judicialmente a la
    vista de la cual considera que se ha podido producir una violación en la cadena de
    custodia». En la misma providencia, Moreno rechaza devolver los dispositivos
    incautados al exdirector general de Carreteras Javier Herrero, también investigado
    en la causa, aunque señala que se le puede facilitar una copia completa del volcado.
    Son diligencias de una instrucción en curso; rige la presunción de inocencia.
  quote: >-
    con el fin de alejar cualquier sombra de duda sobre la custodia y
    conservación de los efectos intervenidos
