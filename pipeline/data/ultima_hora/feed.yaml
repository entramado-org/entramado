  headline: >-
    El juez del caso Montoro prorroga seis meses una instrucción «sumamente compleja»
    con 17 investigados aún por citar, entre ellos el exministro
  dek: >-
    Según EFE (vía Infobae, 27 de julio de 2026), el titular del Juzgado de Instrucción
    nº 2 de Tarragona, Rubén Rus, acordó en un auto prorrogar otros seis meses la
    instrucción del caso Montoro, abierta en 2018 y mantenida en secreto hasta el 19 de
    junio de 2025. Según el auto citado por EFE, la causa investiga «la existencia de
    una presunta trama» en torno al despacho Equipo Económico, fundado por el exministro
    de Hacienda Cristóbal Montoro cuando no estaba en el Gobierno y del que, según Europa
    Press (vía Infobae, 27 de julio de 2026), se desvinculó al entrar en él, que
    «mediando precio, se dedicaría a intervenir en el proceso legislativo, moldeando
    reformas legales a las necesidades de sus clientes»;
    se instruye por presuntos delitos de cohecho, fraude, prevaricación, tráfico de
    influencias, negociaciones prohibidas, corrupción en los negocios y falsedad
    documental. El juez justifica la prórroga en que la investigación es «sumamente
    compleja»: de los quince investigados ya citados solo uno declaró —el resto se
    acogió a su derecho a no responder a la espera de que la Audiencia de Tarragona
    resuelva recursos de apelación sobre la nulidad de pruebas—, quedan 17 por citar,
    entre ellos el propio Montoro, y faltan informes policiales, incluido el análisis
    del Fichero de Titularidades Financieras autorizado a los Mossos d'Esquadra. Los
    hechos no están probados judicialmente. Rige la presunción de inocencia.
  quote: >-
    sumamente compleja
  outlet: EFE (vía Infobae)
  url: https://www.infobae.com/espana/agencias/2026/07/27/el-juez-prorroga-seis-meses-mas-la-causa-sumamente-compleja-en-que-investiga-a-montoro/
