  headline: >-
    La exdirectora de la Agencia Tributaria, ante la comisión SEPI del Senado, sobre la
    falta de alertas en el caso de Julio Martínez: «Si ha ocurrido, es un lamentable
    error»
  dek: >-
    Soledad Fernández Doctor, exdirectora general de la Agencia Estatal de
    Administración Tributaria (AEAT), compareció el 13 de julio de 2026 ante la comisión
    de investigación del Senado sobre la gestión de la SEPI. Según el Diario de
    Sesiones, el senador De Foronda Vaquero le expuso, citando un informe de la ONIF de
    25 de febrero, que Julio Martínez Martínez cobraba como consejero y administrador de
    ASP Rentas con retenciones que constaban en el modelo 190 y que no hizo
    declaraciones de la renta de 2020 a 2023. Le preguntó cómo era posible que no
    saltara la alerta. El auto del juez Calama de 18 de mayo de 2026 describe a Martínez
    Martínez como «lugarteniente principal y figura visible» de la presunta red del caso
    Plus Ultra. Fernández Doctor respondió: «si lo hubiéramos visto, indudablemente
    habría que haberlo iniciado en ese momento», y después: «Si ha ocurrido, es un
    lamentable error». Según El Español (13 de julio de 2026), desligó su dimisión en la
    AEAT de las investigaciones relativas al expresidente Zapatero; ante la comisión
    dijo que quería cesar «hace bastante tiempo» por su «cansancio». Son preguntas y
    respuestas parlamentarias, no hallazgos judiciales; rige la presunción de inocencia.
