  dek: >-
    Según El Español (19 de agosto de 2026), las conversaciones conocidas entre Juan
    Manuel Serrano y Leire Díez superan los 10.800 mensajes. Serrano es exjefe de
    gabinete de Pedro Sánchez, expresidente de Correos e investigado en el caso Leire
    (Audiencia Nacional, juez Santiago Pedraz). Del teléfono de Díez ya emergió una
    conversación de WhatsApp con Serrano de 9.355 mensajes, intercambiados entre el 5 de
    noviembre de 2020 y el 24 de diciembre de 2024, a la que se suman otros 1.487
    mensajes por Signal desde el 28 de abril de 2024. El diario presenta el nuevo
    volcado del iPhone de Serrano como una «extracción decisiva» para la UCO, cuyo
    contenido está por analizar. Son diligencias de instrucción en curso; ningún hecho
    está probado judicialmente. Rige la presunción de inocencia.
