  headline: >-
    La Audiencia de Madrid limita el procedimiento de jurado contra Begoña Gómez a
    tráfico de influencias y malversación y ordena repetir la fase intermedia
  dek: >-
    Según Infobae (16 de julio de 2026, noticia actualizada el 10 de septiembre), la
    Sección 23 de la Audiencia Provincial de Madrid acordó continuar el procedimiento de
    jurado contra Begoña Gómez únicamente por presuntos delitos de tráfico de
    influencias y malversación, y contra María Cristina Álvarez Rodríguez por presunta
    malversación. La sala descartó del proceso principal la corrupción en los negocios y
    la apropiación indebida, excluyó de él a Juan Carlos Barrabés y ordenó repetir la
    fase intermedia para ajustarla a los hechos que permanecían en la causa. Según el
    mismo medio, levantó las medidas cautelares personales de Gómez y Álvarez:
    prohibición de salir del país, retirada de pasaporte y obligación de comparecer
    periódicamente ante el juzgado. Rige la presunción de inocencia.
  outlet: Infobae
  url: https://www.infobae.com/espana/2026/07/16/la-audiencia-de-madrid-mantiene-el-juicio-contra-begona-gomez-por-trafico-de-influencias-y-malversacion-pero-le-devuelve-el-pasaporte/
