  url: https://www.infobae.com/espana/2026/07/15/la-presidenta-del-psoe-cristina-narbona-admite-ante-el-juez-que-hablo-con-leire-y-que-la-remitio-a-santos-cerdan-me-dijo-que-era-intrascendente/
