  headline: >-
    Carmen Pano ratifica ante Pedraz su relato sobre las entregas en Ferraz y un
    presunto intento de soborno, según Europa Press
  dek: >-
    Según Europa Press (vía The Objective, 29 de junio de 2026), Carmen Pano y su
    chófer, Álvaro Gallego, declararon como testigos ante Santiago Pedraz en el caso
    Leire Díez. Según fuentes jurídicas citadas por la agencia, Pano ratificó que la
    abogada Leticia de la Hoz les habría ofrecido dinero para negar las entregas de
    90.000 euros en efectivo que ella sostiene haber realizado en Ferraz. Pano cifró la
    oferta conjunta en unos 250.000 euros y mencionó peticiones de 25.000 euros para la
    boda de su hija, entre 2.500 y 2.800 euros para el alquiler mensual de su casa y
    15.000 euros para un coche de Gallego. Según esas fuentes, Gallego señaló que
    llegaron a contemplar aceptar la oferta, aunque terminaron rechazándola; ambos
    ratificaron lo que declararon ante los agentes de la UCO. Son testimonios en una
    instrucción en curso, no hechos probados; rige la presunción de inocencia.
