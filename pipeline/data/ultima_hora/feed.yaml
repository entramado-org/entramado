  dek: >-
    Según Vozpópuli, Demócrata (Europa Press) y Moncloa.com (6 de noviembre de 2026), el juez de
    la Audiencia Nacional Santiago Pedraz ha acordado en una providencia citar como testigo, el
    24 de noviembre a las 10.15 horas, a Cintia Rocho, a petición de la representación de la
    magistrada Beatriz Biedma, instructora del caso David Sánchez. Rocho declaró ante la UCO
    que el exmagistrado Luis José Sáenz de Tejada, investigado en el caso Leire Díez, le había
    trasladado la necesidad de actuar contra Biedma y le dijo que había que «eliminarla», y que
    ella rechazó la propuesta. Sáenz de Tejada sostiene que con «eliminarla» se refería a
    apartarla por vías judiciales y rechaza haber planteado una agresión física. La providencia
    no atribuye ninguna imputación a Rocho. Pedraz también ordena pedir a la Policía Nacional de
    Badajoz el atestado que identifica al titular de un perfil de internet y recabar testimonio
    de las actuaciones de Badajoz sobre la personación y la recusación de Sáenz de Tejada. Son
    diligencias de instrucción en curso. Rige la presunción de inocencia.
