  headline: >-
    Pedraz abre una «pieza separada económica» y ordena rastrear hasta 81 cuentas del
    PSOE, Zarrías, dos abogados y Crónica Libre en el caso Leire
  dek: >-
    Según El Independiente (31 de julio de 2026), el juez Santiago Pedraz (Audiencia
    Nacional) acordó en un auto, a petición de la Fiscalía Anticorrupción y de la UCO,
    abrir una pieza separada económica y reclamar a una docena de entidades bancarias
    —entre ellas Santander, BBVA, CaixaBank, Sabadell, Deutsche Bank, Unicaja o Abanca—
    los movimientos, saldos, transferencias, titulares y personas autorizadas de cuentas
    del PSOE, de los abogados Ismael Oliver y Jacobo Teijelo, del exdirigente socialista
    Gaspar Zarrías y de las sociedades Oliver Gruppe S.L., Estudio Jurídico Oliver &
    Partners S.L., Zaño Sociedad Consultores S.L. y Grupo Crónica Libre S.L. Según el
    diario, el magistrado expone que la diligencia pretende esclarecer el origen y el
    destino de una serie de pagos que «aparecen sólo parcialmente justificados». Según
    EFE (vía Infobae, 31 de julio y 1 de septiembre de 2026), el rastreo alcanza hasta
    81 cuentas: entre ellas, seis del PSOE, y ocho de Zarrías y tres de su empresa Zaño
    Consultores desde 2022. Según EFE (1 de septiembre de 2026), los investigadores
    sospechan que con fondos del partido se habrían abonado a Leire Díez al menos 43.225
    euros a través de intermediarios como Zarrías u Oliver. Según Qué! (15 de julio de
    2026), el oficio de la UCO desglosa esa cifra en cuatro transferencias de 4.000
    euros de Zaño Sociedad Consultora entre junio y septiembre de 2024 y una de 27.225
    euros de Oliver Gruppe, y recoge además que Leire Díez habría promovido el pago de
    125.000 euros en tres facturas, desde una cuenta del partido, al abogado Jacobo
    Teijelo. Son diligencias de instrucción en curso; los hechos no están probados
    judicialmente. Rige la presunción de inocencia.
  quote: >-
    pieza separada económica
  outlet: El Independiente
  url: https://www.elindependiente.com/espana/2026/07/31/pedraz-abre-una-pieza-para-rastrear-el-dinero-de-las-cloacas-en-cuentas-vinculadas-al-psoe-y-al-entorno-de-leire-diez/
