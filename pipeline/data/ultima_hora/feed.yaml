  headline: >-
    El CGPJ remite al promotor de acción disciplinaria un auto de Peinado con el voto de
    calidad de Perelló
  dek: >-
    Según Libertad Digital (22 de junio de 2026), el Consejo General del Poder Judicial
    acordó remitir al promotor de acción disciplinaria un auto del juez Juan Carlos
    Peinado que planteaba que los escoltas de Begoña Gómez podrían ayudarla a fugarse,
    para que estudiase si el magistrado había cometido alguna falta. La votación terminó
    con un empate a cuatro, resuelto por el voto de calidad de su presidenta, Isabel
    Perelló. Los cuatro vocales contrarios a la remisión emitieron un voto particular en
    el que sostuvieron que la decisión judicial debía revisarse mediante los recursos
    ante la Audiencia Provincial de Madrid. Rige la presunción de inocencia.
