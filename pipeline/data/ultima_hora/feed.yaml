  headline: >-
    Peinado celebra la audiencia preliminar de la Ley del Jurado: las defensas de Begoña
    Gómez y Cristina Álvarez y la Fiscalía piden la absolución, Hazte Oír mantiene los 13
    años y el juez debe decidir sobre la apertura del juicio oral antes de jubilarse
  dek: >-
    Según Infobae y The Objective (8 de septiembre de 2026), el juez Juan Carlos Peinado
    (Sección de Instrucción 41 del Tribunal de Instancia de Madrid, causa 1146/2024)
    celebró ese martes la audiencia preliminar del procedimiento del jurado contra Begoña
    Gómez y su asesora Cristina Álvarez, una vista de apenas media hora que empezó con más
    de una hora de retraso por la llegada tardía del abogado de Gómez, Jaime Campaner;
    ninguna de las dos compareció personalmente, al no estar obligadas. Los letrados
    pidieron la absolución al entender que «los hechos investigados no son constitutivos
    de delito», posición que también sostuvo la Fiscalía; la acusación popular dirigida
    por Hazte Oír mantuvo su petición de apertura de juicio y las penas ya anunciadas:
    «13 años de cárcel» para Gómez por presuntos tráfico de influencias y malversación y
    seis para Álvarez por presunta malversación, tras dejar la Audiencia Provincial fuera
    de la causa en julio los delitos de apropiación indebida y corrupción en los
    negocios. Según The Objective, Peinado rechazó además la petición de la defensa de
    citar como testigo al profesor José Manuel Ruano. La Ley del Jurado da al instructor
    tres días para decidir si abre juicio oral —en cuyo caso la causa se elevaría a la
    Audiencia Provincial de Madrid— o archiva; Peinado inicia el miércoles diez días de
    vacaciones y se jubila el 27 de septiembre, cuando cumple 72 años. Ningún hecho está
    judicialmente probado. Rige la presunción de inocencia.
  quote: >-
    los hechos investigados no son constitutivos de delito
  outlet: Infobae
  url: https://www.infobae.com/espana/2026/09/08/la-audiencia-preliminar-de-begona-gomez-antes-de-las-vacaciones-de-peinado-las-defensas-piden-el-archivo-y-queda-cerrada-la-instruccion/
