  headline: >-
    Simon Leendert Verhoeven niega el blanqueo ante Calama y dice que prestó 2,1 millones a
    Plus Ultra sin saber que la aerolínea recibiría un rescate público de 53 millones
  dek: >-
    Según El Español y Europa Press (16 de octubre de 2026), el financiero neerlandés Simon
    Leendert Verhoeven, a quien la UDEF señala como presunto cerebro financiero del caso
    Plus Ultra, declaró como investigado ante el juez de la Audiencia Nacional José Luis
    Calama. Negó el delito de blanqueo de capitales y, según fuentes jurídicas citadas por
    Europa Press, dijo que sus empresas se dedican al «trading» y a los metales preciosos y
    que los relojes, joyas y lingotes intervenidos en su domicilio proceden de actividades
    legales. Explicó que prestó 2,1 millones de euros a la aerolínea atraído por los
    intereses, tras la oferta de otro de los investigados, y que desconocía el rescate de 53
    millones que concedería el Gobierno; afirmó que la firma que figura en la versión del
    contrato que menciona esa ayuda, aportada por directivos de la aerolínea, no es la suya.
    Rige la presunción de inocencia.
  outlet: El Español
  url: https://www.elespanol.com/espana/tribunales/20261016/cerebro-financiero-plus-ultra-niega-blanqueo-declara-presto-millones-sin-saber-rescate/1003744422557_0.html
