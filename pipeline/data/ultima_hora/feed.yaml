  headline: >-
    El 'hombre de Zapatero en Venezuela' se niega a contestar en la comisión de
    investigación del Senado sobre la SEPI
  dek: >-
    Según EFE (vía Infobae, 22-06-2026), Manuel Aarón Fajardo García, residente en
    Caracas, a quien el auto del juez José Luis Calama describe como «el hombre de
    Zapatero en Venezuela» y considera el «enlace» entre el expresidente José Luis
    Rodríguez Zapatero y Venezuela, compareció el 22 de junio ante la comisión de
    investigación del Senado sobre la gestión de la SEPI. En una declaración inicial
    negó haber realizado «acciones sobre ayudas públicas» o haber obtenido beneficio de
    ellas, sostuvo que el papel que se le atribuye «parece más bien una película de
    Netflix» y rehusó contestar a las preguntas de los senadores, alegando que no
    conocía de antemano los hechos sobre los que se le iba a preguntar. La información
    no precisa su situación procesal; rige la presunción de inocencia.
