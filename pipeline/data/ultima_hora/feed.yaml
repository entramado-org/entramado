  headline: >-
    La defensa de Begoña Gómez recurre ante la Audiencia Provincial y pide a Peinado
    paralizar la causa, la declaración del codirector de la cátedra y la ratificación de
    tres periciales
  dek: >-
    Según El Debate (27 de junio de 2026), que cita fuentes jurídicas de Europa Press,
    el abogado de Begoña Gómez, Antonio Camacho, ha presentado un recurso de apelación
    ante la Audiencia Provincial de Madrid contra el auto del juez Juan Carlos Peinado
    que rechazó la práctica de varias pruebas solicitadas antes de decidir la apertura
    del juicio oral, y ha reiterado su petición de que la causa quede paralizada hasta
    que la Audiencia resuelva los recursos pendientes «para evitar situaciones de
    indefensión y garantizar un proceso con todas las garantías». La defensa ha
    solicitado además la declaración de José Manuel Ruano, codirector de la cátedra
    extraordinaria junto a Gómez, que según la defensa nunca ha sido llamado a declarar,
    y la ratificación de los tres informes periciales que presenta sobre el presunto
    daño económico a la Universidad Complutense de Madrid, el personal de apoyo de Gómez
    y la interpretación de la cátedra. Camacho había recurrido también ante la Audiencia
    las medidas cautelares de retirada de pasaporte, prohibición de salir de España y
    firmas quincenales. La Audiencia Provincial tiene previsto analizar el 13 de julio
    varios recursos de la causa, entre ellos los relativos a la decisión de Peinado de
    dirigir la causa hacia un jurado popular. La Fiscalía ha pedido el archivo de la
    causa. Rige la presunción de inocencia.
