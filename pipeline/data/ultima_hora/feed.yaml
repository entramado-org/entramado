  headline: >-
    Un informe de la UCO sostiene que Ábalos «habría recurrido» a Cristian Corvillo para financiar la
    compra de dos inmuebles de su pareja en Vallecas
  dek: >-
    Según Confilegal (13 de noviembre de 2026), que cita un informe al que ha tenido acceso Europa
    Press, y The Objective (14 de noviembre de 2026), un informe de la UCO remitido al juez de la Audiencia Nacional Ismael Moreno sostiene, en
    condicional, que José Luis Ábalos «habría recurrido» a Cristian Corvillo, uno de los detenidos y
    puestos en libertad en el operativo de principios de noviembre, para financiar la compra de dos
    inmuebles en el distrito madrileño de Vallecas que su pareja, Andrea de la Torre, adquirió el 19 de
    abril de 2024 por 125.000 euros y sin hipoteca. Según ambos medios, De la Torre había recibido el 12
    de febrero de 2024 una transferencia de 65.000 euros en concepto de «préstamo» de una sociedad
    portuguesa. Según Confilegal, los agentes deducen que Corvillo «tendría cierta ascendencia» sobre
    esa sociedad sin figurar en ella, y el informe recoge la hipótesis de los investigadores, no hechos
    acreditados judicialmente, y sus conclusiones deberá valorarlas el instructor; a Corvillo se le
    atribuyen presuntos delitos de tráfico de influencias, cohecho, blanqueo de capitales y pertenencia
    a organización criminal, y a De la Torre, presunto blanqueo. Son diligencias de instrucción en
    curso. Rige la presunción de inocencia.
  outlet: Confilegal
  url: https://confilegal.com/20261113-uco-corvillo-abalos-financiacion-inmuebles-andrea-de-la-torre/
