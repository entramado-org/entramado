    la totalidad» de sus ingresos y apunta a una posible fuente de efectivo vinculada a
    Servinabar y a las adjudicaciones de obra pública a Acciona (El Independiente). Son
    diligencias de instrucción en curso. Rige la presunción de inocencia.
