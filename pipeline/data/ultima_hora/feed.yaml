    El exviceministro venezolano Nervis Villalobos se acoge a su derecho a no declarar ante el juez Pedraz
    en el caso Leire Díez
  dek: >-
    Según Europa Press (vía Demócrata) y EFE (vía Infobae) (30 de octubre de 2026), el exviceministro
    venezolano Nervis Villalobos, investigado por el juez de la Audiencia Nacional Santiago Pedraz por
    una presunta falsedad documental en su expediente de nacionalidad española, se acogió este viernes
    a su derecho a no declarar. Según Europa Press, su defensa había pedido suspender la declaración hasta
    que se recabara la documentación que dice haber presentado en papel ante el Registro Civil Central,
    y el juez denegó la suspensión. La defensa manifiesta la voluntad de Villalobos de declarar cuando
    este conozca íntegramente los elementos en los que se fundamenta la investigación. El juez investiga
    si Leire Díez intentó influir en el expediente. Son diligencias de instrucción en curso. Rige la presunción
    de inocencia.
