  headline: >-
    La defensa de Equipo Económico pide al Tribunal Supremo que traslade a Madrid la causa
    del caso Montoro
  dek: >-
    Según EFE (vía Infobae, 28 de septiembre de 2026), la defensa de Equipo Económico, el
    despacho fundado por el exministro de Hacienda Cristóbal Montoro, ha pedido al
    Tribunal Supremo que traslade a los juzgados de Madrid la causa que instruye el juez
    Rubén Rus (Juzgado de Instrucción nº 2 de Tarragona), después de que la Audiencia de
    Tarragona concluyera que ni ella ni el TSJ de Cataluña son competentes para decidirlo.
    Las defensas alegan que Equipo Económico y la asociación de empresas gasistas AFGIM
    tienen su sede en Madrid y que allí se presentaron ante las Cortes Generales las
    propuestas legislativas que se investigan. Rige la presunción de inocencia.
