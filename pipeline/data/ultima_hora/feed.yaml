  headline: >-
    La UCO investiga contactos con el PNV relacionados con el rescate de Tubos Reunidos,
    según The Objective
  dek: >-
    Según The Objective (23 de junio de 2026), un informe de la UCO incorporado a la
    investigación de Santiago Pedraz sostiene que Leire Díez, el expresidente de la SEPI
    Vicente Fernández y el empresario Antxon Alonso utilizaron sus contactos políticos
    para impulsar gestiones a favor de Tubos Reunidos, que recibió un rescate de 112,8
    millones de euros de la SEPI en 2021. El periódico recoge mensajes del chat Hirurok
    sobre contactos con el PNV durante la tramitación de la ayuda y señala que las
    gestiones posteriores también se dirigieron a modificar las condiciones de
    devolución. Asimismo, sitúa el 28 de enero de 2025 un encuentro con Andoni Ortuzar y
    Joseba Aurrekoetxea en el que participó el consejero delegado de Tubos Reunidos,
    Carlos López de las Heras. Son hipótesis de un informe policial descrito por el
    medio, no hechos probados; rige la presunción de inocencia.
