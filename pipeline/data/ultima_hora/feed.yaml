  headline: >-
    Pedraz rechaza limitar las cuentas bancarias que analizará la UCO en el caso Leire:
    hasta 81 del PSOE, Zarrías, Oliver y Teijelo
  dek: >-
    Según EFE (vía Infobae, 17 de septiembre de 2026), el juez de la Audiencia Nacional
    Santiago Pedraz, siguiendo el criterio de la Fiscalía, rechazó en un auto tres
    recursos contra el requerimiento para rastrear hasta 81 cuentas del PSOE, de la
    sociedad Zaño Consultores y de tres investigados —el exvicepresidente andaluz Gaspar
    Zarrías y los abogados Ismael Oliver y Jacobo Teijelo—, que pedían limitar el análisis
    a las cuentas desde las que se pagó a Leire Díez. El objetivo es determinar si el PSOE
    la pagó a través de los abogados y de Zarrías. Zarrías ha recurrido en apelación ante
    la Sala de lo Penal: su defensa califica el rastreo de «diligencia prospectiva» y
    sostiene que solo contrató a Díez en 2024. Rige la presunción de inocencia.
