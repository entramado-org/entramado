  headline: >-
    Según El Periódico (vía que.es), la UDEF rastrea 290.400 euros de Camilo Ibrahim a
    Julio Martínez Martínez mediante un contrato de asesoramiento
  dek: >-
    Según un informe policial de la UDEF fechado el 9 de junio al que tuvo acceso El
    Periódico (recogido por que.es, 16 de agosto de 2026), la Unidad de Delincuencia
    Económica y Fiscal rastrea 290.400 euros abonados entre 2024 y 2025 por el
    empresario venezolano Camilo Ibrahim Issa —al que el auto de 18 de mayo de 2026 del
    juez José Luis Calama describe como «accionista de Plus Ultra a través de Snip
    Aviation» (p.54)— a Julio Martínez Martínez, a quien esa información describe como
    presunto testaferro del expresidente José Luis Rodríguez Zapatero. La causa la
    instruye el juez Calama en la Audiencia Nacional. Según la misma información, el
    rastreo parte de un documento («Detalle cobros 2011-2025») incautado en el ordenador
    de Martínez Martínez, en el que los agentes hallaron un contrato de asesoramiento
    firmado el 1 de diciembre de 2023 entre Análisis Relevante y Thabeh Iberian,
    representada por Ibrahim, con pagos de 12.100 euros mensuales durante 24 meses
    —exactamente 290.400 euros—; las seis primeras facturas aparecen anotadas como
    «Factura ASP Rentas». Según el informe, ASP Rentas SL movió casi dos millones de
    euros entre 2020 y 2025 pese a declarar ingresos de 89.540 euros, y los agentes la
    consideran una vía instrumental para canalizar fondos de contratos de asesoría
    ficticios; la UDEF pide al juez analizar el destino y la trazabilidad de esos
    fondos. Los agentes vinculan esas facturas con el rescate de Plus Ultra. Según el
    auto de 18 de mayo de 2026, el 6 de febrero de 2021 Rodolfo Reyes —«accionista de
    facto de la aerolínea», según el mismo auto (p.53)— escribió a Julio Martínez Sola
    que Camilo había estado con Zapatero y que «le dijo que todo va viento en popa»
    (p.22-23), y el 26 de febrero de 2021, antes de que se reuniera el Consejo Gestor el
    2 de marzo, Julio Martínez Martínez comunicó a Camilo Ibrahim Issa la obtención de
    la ayuda pública (p.23). Según que.es, Zapatero declaró ante el juez Calama que
    conoció a Ibrahim cuando le pidió ayuda para liberar al tío de Juan Guaidó, que su
    relación fue «estrictamente personal» y que no habló de Plus Ultra con él. Ninguno
    de los hechos está probado judicialmente. Rige la presunción de inocencia.
  outlet: El Periódico (vía que.es)
