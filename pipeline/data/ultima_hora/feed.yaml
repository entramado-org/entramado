  headline: >-
    La defensa de Begoña Gómez entrega a Peinado los billetes de avión a Londres y le
    recuerda que el Reino Unido suprimió los sellos físicos en pasaportes
  dek: >-
    Según Infobae (15 de julio de 2026), dos días después de que el juez Juan Carlos
    Peinado (Juzgado de Instrucción nº 41 de Madrid) concediera un plazo improrrogable
    de cinco días para acreditar el uso del pasaporte recuperado entre el 8 y el 10 de
    julio, la defensa de Begoña Gómez presentó los billetes de avión de ida a Londres y
    de regreso desde Bristol del viaje autorizado por el juez sustituto para asistir a
    la graduación universitaria de su hija. El abogado Antonio Camacho explicó al
    juzgado que el Reino Unido ha suprimido la estampación de sellos físicos en los
    pasaportes como práctica ordinaria en su sistema digital de control fronterizo, por
    lo que la ausencia de sello «carece, por sí sola, de valor acreditativo negativo».
    La defensa recurrió además la providencia del juez al entender que le exigía
    acreditar un hecho que, sostiene, corresponde probar a la acusación: «La carga de la
    prueba corresponde a la acusación, nunca a la defensa». Según Infobae (16 de julio
    de 2026), la Audiencia Provincial de Madrid devolvió después el pasaporte a Gómez.
    Rige la presunción de inocencia.
