  headline: >-
    La defensa de Leire Díez pide anular actuaciones y cuestiona la competencia de la
    Audiencia Nacional
  dek: >-
    Según EFE (vía Infobae, 11 de junio de 2026), la defensa de Leire Díez presentó en
    las últimas semanas varios escritos en los que impugna diligencias de la
    investigación del juez Santiago Pedraz en la Audiencia Nacional para tratar de
    anularla: denuncia una «injerencia desmesurada y desproporcionada» en sus
    comunicaciones, la incautación de agendas que no son suyas o que exceden el periodo
    en el que, según defiende, se centra la causa, y el uso de información personal que
    pidió expurgar. Se opone además a que Pedraz asuma la investigación del juzgado de
    Madrid que empezó a investigarla, al que considera competente, alegando que se
    vulneraría el principio 'non bis in idem', y pide anular el material probatorio
    obtenido tras la ampliación de la investigación, que considera «carente de
    autorización judicial específica». Son pretensiones de la defensa; rige la
    presunción de inocencia.
