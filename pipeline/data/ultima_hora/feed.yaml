  headline: >-
    Calama encarga a la UDEF, a petición de la Fiscalía Anticorrupción, un informe
    «exhaustivo» sobre la historia accionarial de Plus Ultra desde su constitución en
    2011 para analizar la entrada de capital venezolano
  dek: >-
    Según El Independiente (4 de agosto de 2026), el juez José Luis Calama (Audiencia
    Nacional, DP 77/2024) acordó en una providencia, a petición de la Fiscalía
    Anticorrupción y en los términos solicitados por la fiscal, que la UDEF elabore «un
    exhaustivo informe de análisis de la historia registral completa» de Plus Ultra
    «desde su constitución hasta la fecha actual, a fin de conocer los cambios
    accionariales, los desembolsos concretos y efectivos, la evolución de la propiedad y
    cuantos aspectos relativos a su financiación resulten de interés». El escrito fiscal
    pone el foco a partir de 2017, año en que, según un informe previo de la UDEF de
    noviembre de 2025, entraron personas de origen venezolano en el capital social y en
    los órganos de gestión de la aerolínea, constituida el 25 de agosto de 2011. También
    pide analizar el alcance y el «eventual impacto» de ese capital «en la propia
    consideración de la aerolínea al solicitar la ayuda pública». La causa investiga,
    entre otros presuntos delitos, un presunto tráfico de influencias vinculado a la
    ayuda de 53 millones de euros que la SEPI concedió a Plus Ultra y que el Consejo de
    Ministros aprobó en marzo de 2021. Entre los investigados figura el expresidente del
    Gobierno José Luis Rodríguez Zapatero. Son diligencias de instrucción en curso;
    ninguno de los hechos está probado judicialmente. Rige la presunción de inocencia.
  quote: >-
    un exhaustivo informe de análisis de la historia registral completa
  outlet: El Independiente
  url: https://www.elindependiente.com/espana/2026/08/04/el-juez-calama-encarga-a-la-udef-un-exhaustivo-informe-sobre-la-entrada-de-capital-venezolano-en-plus-ultra/
  status: investigado
