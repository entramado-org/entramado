  headline: >-
    El juez Calama rechaza el incidente de nulidad de Zapatero en el caso Plus Ultra al
    no ver vulnerados sus derechos: el auto no admite recurso y la instrucción sigue
    abierta
  dek: >-
    Según EFE (vía Infobae, 4 de septiembre de 2026), el juez José Luis Calama
    (Audiencia Nacional, DP 77/2024) desestimó en un auto que no admite recurso el
    incidente de nulidad de actuaciones planteado por la defensa del expresidente José
    Luis Rodríguez Zapatero, que pretendía anular la investigación que se sigue contra
    él por liderar presuntamente una red de tráfico de influencias en favor de la
    aerolínea Plus Ultra, al entender que no fueron vulnerados sus derechos. Calama, que
    según Europa Press (vía Infobae, 24 de julio de 2026) había inadmitido el incidente
    por extemporáneo y que según Infobae (31 de julio de 2026) rectificó para admitir a
    trámite parte de sus apartados, rechaza ahora las alegaciones de acuerdo con el
    criterio de la Fiscalía. La causa, relativa al rescate de 53 millones de euros que
    la SEPI concedió a Plus Ultra en marzo de 2021, sigue en fase de instrucción, sin
    juicio ni sentencia. Rige la presunción de inocencia.
  quote: >-
    previamente obtenidos con la autorización de un tribunal francés y la
    cooperación de un tribunal español
