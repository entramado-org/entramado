  headline: >-
    La UCO sitúa en más de 181.000 euros lo que Servinabar —la empresa de Antxon Alonso—
    cobró de Cycasa, integrante de la UTE adjudicataria de la cárcel de Zubieta, según
    The Objective
  dek: >-
    Según The Objective (17 de julio de 2026), que se basa en un informe de la UCO sobre
    el patrimonio de Santos Cerdán al que tuvo acceso EFE, Joseba Antxon Alonso Egurrola
    —dueño de Servinabar, empresa de la que la Guardia Civil sospecha que Cerdán era
    socio— remitió el 10 de octubre de 2018 a un directivo de Acciona una noticia de
    prensa sobre la futura construcción de una nueva cárcel en San Sebastián (Zubieta).
    La licitación se publicó el 13 de noviembre de 2020, con un presupuesto de 43,7
    millones de euros, y cinco días después Alonso informó a Juan Sumelzo, presidente de
    Sumelzo S.A., de que un amigo suyo estaba interesado en la adjudicación. A la obra
    se presentó una UTE formada por Acciona (50%), Construcciones Murias (25%) y Cycasa
    (25%). Alonso escribió a Sumelzo en un mensaje citado por la UCO: «De ese 25, ellos
    son el 15% y nosotros el 10%». De ahí la UCO infiere que ese 10% de la UTE
    pertenecía a Alonso y a Sumelzo. La UTE resultó adjudicataria en febrero de 2021 y,
    según el informe, desde ese año Servinabar cobró de Cycasa 30.248 euros en 2021,
    131.078 euros en 2022 y 20.165 euros en 2023, más de 181.000 euros en total. La
    cárcel se inauguró el 15 de junio de 2026. Son indicios de un informe policial
    dentro de una instrucción en curso, no hechos probados; rige la presunción de
    inocencia.
  quote: >-
    De ese 25, ellos son el 15% y nosotros el 10%.
