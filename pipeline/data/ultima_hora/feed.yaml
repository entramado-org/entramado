  headline: >-
    El exjuez Sáenz de Tejada, tras declarar como investigado ante Pedraz, dice a los medios
    que al hablar de «eliminar» a la jueza Biedma se refería a «un proceso judicial», y
    niega haber recibido encargos de Leire Díez
  dek: >-
    Según El Independiente (con información de Europa Press), Deia, COPE y El Español (28 de
    octubre de 2026), el exjuez Luis José Sáenz de Tejada declaró como investigado ante el
    juez de la Audiencia Nacional Santiago Pedraz en el caso Leire Díez. A su salida de la
    Audiencia Nacional explicó a los medios que, cuando habló de «eliminar» a la jueza
    Beatriz Biedma, se refería a «un proceso judicial evidentemente», y negó «rotundamente»
    haber recibido encargos de Leire Díez. Calificó además de «rotundamente falso» haberla
    perseguido y, en un escrito remitido a Pedraz, acusó a los investigadores de la UCO de
    realizarle una «imputación falsa de hechos sin investigación alguna». Son diligencias de
    instrucción en curso. Rige la presunción de inocencia.
  outlet: Europa Press (vía El Independiente)
  url: https://www.elindependiente.com/espana/2026/10/28/saenz-tejada-declara-referia-eliminar-judicialmente-biedma/
