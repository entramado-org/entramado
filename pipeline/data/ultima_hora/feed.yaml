    Zapatero declara como investigado ante el juez Calama en el caso Plus Ultra
  dek: >-
    Según la crónica de agencias publicada por El Progreso (17-06-2026), José Luis
    Rodríguez Zapatero llegó a las 8:49 horas a la Audiencia Nacional para declarar como
    investigado ante el magistrado José Luis Calama en el caso Plus Ultra, causa en la
    que se investigan delitos de tráfico de influencias, organización criminal, blanqueo
    y falsedad documental. El interrogatorio comenzó a las 9:12 y concluyó en torno a
    las 12:28, tras casi tres horas ante el magistrado, por lo que no continuó el 18 de
    junio, día para el que también había sido convocado. Según fuentes jurídicas citadas
    por EFE, negó haber ejercido influencia alguna para favorecer a la aerolínea, que
    recibió una ayuda pública de 53 millones de euros en 2021, y optó por no declarar
    sobre las joyas halladas en una caja fuerte de su oficina y valoradas en 1,3
    millones de euros, objeto de una pieza separada; pidió tiempo y dijo que hablaría en
    una semana o diez días. La crónica lo describe como «el primer expresidente del
    Gobierno que en democracia ha declarado como investigado». Rige la presunción de
    inocencia.
