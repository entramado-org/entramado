  headline: >-
    Marlaska admite ante el Senado que la directora de la Guardia Civil le informó de un
    encuentro con Leire Díez
  dek: >-
    El ministro del Interior, Fernando Grande-Marlaska, compareció el 30 de junio de
    2026 ante la comisión de investigación del caso Koldo en el Senado (The Objective,
    30-06-2026). Según el Diario de Sesiones del Senado (DS 745), explicó que la
    directora de la Guardia Civil, Mercedes González Fernández, le contó que en un
    encuentro Leire Díez le había planteado si era factible que se restableciera el
    estatus del comandante Villalba (p.84), y que en ese momento ella se levantó
    (p.111). Preguntado por la fecha de ese encuentro, respondió «No lo sé»; el senador
    Martínez-Maíllo la situó el 2 de abril de 2025 (p.109). Marlaska defendió a González
    («Por eso la creo firmemente», p.84). Según The Objective, negó que desde la cúpula
    del cuerpo hubiese presiones en los casos de la UCO y se dijo «convencido de que
    nadie dependiente del Ministerio del Interior ha actuado en una forma inadecuada».
    Rige la presunción de inocencia.
