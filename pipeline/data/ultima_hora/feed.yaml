  headline: >-
    La directora de la Guardia Civil declara ante el juez Pedraz como investigada en el
    caso Leire un día después de lo previsto
  dek: >-
    Según The Objective (17 de julio de 2026), Mercedes González Fernández, directora
    general de la Guardia Civil, declaró el viernes 17 de julio en la Audiencia Nacional
    ante el juez Santiago Pedraz, que la había citado como investigada por un presunto
    delito de prevaricación administrativa y otro contra la Administración de Justicia.
    Según Infobae (17 de julio de 2026), estaba citada para el jueves 16, pero el juez
    pospuso su interrogatorio por la extensión de la declaración del director adjunto
    operativo (DAO) Manuel Llamas, que según Público (16 de julio de 2026) compareció
    durante dos horas y media. Según Infobae, González fue imputada después de que la
    UCO apuntara en un informe que mantuvo tres reuniones con Leire Díez; los
    investigadores sostienen que Díez, mediante entrevistas personales con la directora,
    «habría conseguido instigar a que esta última iniciara actuaciones administrativas
    contra la UCO». Según The Objective (17 de julio de 2026), González negó ante el
    juez cualquier vínculo con la trama, aseguró sentirse utilizada por Cerdán y por
    Díez —«Yo estoy en el listado de víctimas de Santos Cerdán», según fuentes
    conocedoras del interrogatorio citadas por el medio— y admitió solo dos reuniones
    con Díez. Es una diligencia de instrucción en curso, no hechos probados; rige la
    presunción de inocencia.
  outlet: Europa Press (vía Infobae)
  url: https://www.infobae.com/america/agencias/2026/07/17/el-juez-del-caso-leire-diez-interroga-este-viernes-a-la-directora-de-la-guardia-civil-como-investigada/
