# Feed editorial «última hora» (spec 044) — servido en runtime por GET /ultima-hora.
#
# Desarrollos recientes de los casos que, por ahora, solo existen en prensa (peticiones de
# condena, nuevos hallazgos de la UCO, imputaciones frescas…) sin documento oficial
# descargable, así que NO entran en el grafo judicial anclado a fuentes. Cada ítem va
# ATRIBUIDO (outlet + url + fecha) y redactado con presunción de inocencia. Es la
# contraparte editorial del overlay de grafo `ultima_hora.yaml` (este mismo directorio,
# OTRA capa: aristas Neo4j); mantener las dos aproximadamente consistentes.
#
# `entities` = entity_ids del grafo que toca el ítem (con prefijo de label
# Person:/Organization:/…) — alimenta la sección del panel de entidad y el deep-link
# `focus` → /explore?focus={id}. `briefing_slug` → /briefings/{slug}.
#
# VIGÍA — instrucciones de edición:
#  · Insertar el ítem nuevo INMEDIATAMENTE debajo de `items:` (más reciente primero).
#  · snake_case: `case_tag`, `briefing_slug`. NO existe case_color: la web deriva el
#    color del `case_tag` (tag nuevo → color neutro hasta añadirlo al mapa de la web).
#  · `headline`/`dek` con block scalar `>-` (evita romper el YAML con «:», comillas…).
#  · `iso` = YYYY-MM-DD; `date` = etiqueta visible («13 jul 2026»). La API reordena por
#    `iso` desc igualmente, pero mantener el fichero ordenado.
#  · Campos obligatorios: iso, date, headline, dek, outlet, url, entities.
#  · ATRIBUCIÓN DE AGENCIA: si la pieza es un teletipo republicado (patrón de URL
#    infobae.com/…/agencias/ o equivalente en otros medios), `outlet` debe nombrar la
#    agencia: «EFE (vía Infobae)» / «Europa Press (vía Infobae)». Verificar la agencia EN
#    la pieza (dateline «(EFE)» en el cuerpo, o tag EuropaPress/EFE del artículo) — Infobae
#    republica AMBAS agencias, no asumir EFE. Regla general: `outlet` = medio de ORIGEN de
#    la información, no medio donde la leímos (una exclusiva con paywall se cita y enlaza
#    a su medio de origen aunque no sea legible gratis).
#  · EXCLUSIVAS VÍA INTERMEDIARIO: si el ítem se basa en la exclusiva/entrevista/informe de
#    un medio pero se leyó en otro, `outlet` = «Origen (vía medio donde se leyó)» y `url` =
#    la pieza ORIGINAL del medio de origen (las agencias mantienen la URL de la
#    republicación porque el teletipo no tiene URL pública propia; una exclusiva sí la
#    tiene). Si alguna cita literal solo es verificable en la republicación, decirlo en el
#    dek. No atribuir la revelación a un medio que la fuente enlazada no nombra.
#  · HITOS PROCESALES → AGENCIA DIRECTA PREFERENTE: en citaciones, autos, declaraciones y
#    agenda judicial, preferir EFE/Europa Press como fuente (las cubren sistemáticamente);
#    si solo se accede vía republicación, aplicar la atribución «Agencia (vía medio)».
#  · ACTO CONSUMADO ≠ CONVOCATORIA (auditoría PR #314, 21-jul): antes de escribir que
#    alguien «declaró», «compareció», «ratificó» o «se acogió al silencio», comprobar el
#    TIEMPO VERBAL del cuerpo de la fuente — los teletipos de agencia y piezas matinales
#    del mismo día suelen ser PREVIOS al acto («declarará», «está citado») y no prueban
#    que ocurriera ni cómo. Preferir SIEMPRE la crónica posterior al acto; si solo existe
#    la pieza de convocatoria, reencuadrar como citación («citados a declarar…») y nunca
#    inventar el desarrollo (duración, qué dijo, a quién respondió, si guardó silencio).

