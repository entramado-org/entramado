    investigaciones». Según el diario, el instructor quiso evitar así que la directora
    general, Mercedes González Fernández, y el director adjunto operativo (DAO), Manuel
    Llamas, conocieran de antemano la entrada de los agentes en la sede del cuerpo.
    Ambos fueron citados como investigados el 2 de julio por presuntos delitos de
