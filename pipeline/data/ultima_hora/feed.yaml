    Supremo ha dictado sendos autos en los que desestima por unanimidad todas las
    alegaciones de los incidentes de nulidad de actuaciones promovidos por las defensas del
    exministro José Luis Ábalos y de su exasesor Koldo García contra la sentencia que los
    condenó por delitos de organización criminal, cohecho, malversación y tráfico de
    influencias a 24 años y tres meses y a 19 años y ocho meses de prisión, respectivamente.
    Según The Objective, el tribunal impone a ambos las costas de los incidentes; la
    Fiscalía Anticorrupción se había opuesto a los incidentes, según Europa Press. Con esta
    resolución se agota la vía de la jurisdicción ordinaria y queda abierta la del recurso
    de amparo ante el Tribunal Constitucional.
