  headline: >-
    Vozpópuli informa de que la UDEF atribuye a Zapatero un cobro de 200.000 euros por
    una presunta mediación en Bolivia
  dek: >-
    Según Vozpópuli (24-06-2026), un informe de la UDEF atribuye a José Luis Rodríguez
    Zapatero una contraprestación de 200.000 euros por presuntas gestiones ante
    autoridades bolivianas para evitar que una empresa del Grupo Gloria fuera sancionada
    con 107 millones de dólares. Según las conclusiones policiales reproducidas por el
    medio, el pago se habría justificado mediante un «contrato simulado» con la sociedad
    peruana Focus Social Research. La noticia sitúa las presuntas reuniones, entre ellas
    una con el entonces presidente Luis Arce, durante un viaje a La Paz y Sucre en
    septiembre de 2024. Son indicios atribuidos a un informe policial por una fuente
    periodística, no hechos probados; rige la presunción de inocencia.
