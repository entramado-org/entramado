  headline: >-
    Una jueza civil de Madrid fija el 17 de febrero de 2027 el juicio de la demanda de Bolaños contra
    Aldama por afirmar en televisión que el ministro intentó sobornarle
  dek: >-
    Según EFE y Europa Press (vía Infobae, 4 de noviembre de 2026), la jueza de la plaza 8 de la sección
    civil del Tribunal de Instancia de Madrid ha fijado, tras la audiencia previa celebrada este miércoles,
    el 17 de febrero de 2027 para el juicio de la demanda por vulneración del derecho al honor que el
    ministro de la Presidencia, Justicia y Relaciones con las Cortes, Félix Bolaños, interpuso contra
    el empresario Víctor de Aldama por afirmar en televisión que intentó sobornarle. El abogado del Estado
    aportó dos entrevistas en Cuatro y Telemadrid en las que, según EFE, Aldama afirmó que el ministro
    intentó comprar su silencio. Bolaños, que en su demanda sostiene que nunca ha hablado con Aldama ni
    ha tenido relación personal con él, le reclama 70.000 euros por daños y perjuicios. Es un procedimiento
    civil, no penal; no hay sentencia.
