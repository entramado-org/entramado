  headline: >-
    Calama fija el 30 de noviembre la declaración como investigadas de las hijas de
    Zapatero, Laura y Alba Rodríguez Espinosa, en el caso Plus Ultra
  dek: >-
    Según Infobae (21 de septiembre de 2026), el juez de la Audiencia Nacional José Luis
    Calama ha fijado, en una providencia dictada ese lunes tras un informe de la Fiscalía,
    que Laura Rodríguez Espinosa (9:00) y Alba Rodríguez Espinosa (12:00) declaren como
    investigadas el 30 de noviembre en la causa del caso Plus Ultra, en la que se
    investiga un posible delito de blanqueo de capitales y en la que la UDEF ha examinado
    a su empresa, What The Fav, por su relación con sociedades del entramado investigado.
    La condición de investigadas ya se había acordado en junio; ahora se fija la fecha.
    Las valoraciones de la UDEF son hipótesis policiales, no conclusiones judiciales. Rige
    la presunción de inocencia.
