  headline: >-
    Begoña Gómez estaba citada para entregar su pasaporte y había recurrido las medidas
    cautelares ante la Audiencia Provincial
  dek: >-
    Según EFE (vía Infobae, 24 de junio de 2026), Begoña Gómez estaba citada ese
    miércoles 24 de junio a las 18:00 horas en el juzgado que dirige el juez Juan Carlos
    Peinado para entregar su pasaporte. La retirada del pasaporte, la prohibición de
    salir del país y la obligación de comparecer cada quince días en el juzgado eran las
    medidas cautelares que el juez acordó en el auto del 20 de junio por el que la
    enviaba a juicio con jurado popular. Según la agencia, las defensas de Gómez y de su
    asesora Cristina Álvarez habían recurrido esas medidas el martes ante la Audiencia
    Provincial de Madrid, y Álvarez ya había entregado su pasaporte el día anterior.
    Según la misma fuente, las medidas se adoptaron a petición de las acusaciones
    populares que dirige Hazte Oír y el juez adujo para justificarlas un riesgo de fuga.
    Según Infobae (16 de julio de 2026), la Sección 23 de la Audiencia Provincial de
    Madrid revocó después las medidas cautelares y le devolvió el pasaporte. Rige la
    presunción de inocencia.
  outlet: EFE (vía Infobae)
  url: https://www.infobae.com/espana/agencias/2026/06/24/begona-gomez-debe-acudir-esta-tarde-al-juzgado-para-entregar-su-pasaporte/
