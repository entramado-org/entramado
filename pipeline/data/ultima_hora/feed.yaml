    Santos Cerdán, exsecretario de Organización del PSOE, ha presentado un recurso de
    reforma ante el juez de la Audiencia Nacional Santiago Pedraz contra su decisión de
    facilitar al juez Ismael Moreno, que investiga el caso Koldo, copia del material
    intervenido en el domicilio de Cerdán. Alega que el «único punto de conexión» entre
    ambas causas es la persona investigada, que ese material forma parte de su «más estricta
    intimidad domiciliaria» y que la medida equivale a una investigación «general y
    prospectiva». Según EFE, la documentación aún no se ha incorporado a la causa de Pedraz
