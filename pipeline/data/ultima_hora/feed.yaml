  headline: >-
    El juez Zamarriego acepta inhibirse en favor de Pedraz y la investigación del caso
    Leire Díez queda solo en manos de la Audiencia Nacional
  dek: >-
    Según El Español (12 de agosto de 2026), el magistrado Arturo Zamarriego, titular
    del Juzgado de Instrucción nº 9 de Madrid y el primero en interrogar como
    investigada a Leire Díez, aceptó en una resolución fechada el martes 11 de agosto
    que sea la Audiencia Nacional la que instruya la causa, de modo que a partir de
    ahora será únicamente el juez Santiago Pedraz, titular del Juzgado Central de
    Instrucción nº 5 de la Audiencia Nacional, quien se encargue de ese procedimiento.
    Zamarriego investigaba presuntas maniobras de Díez para, supuestamente, tratar de
    boicotear causas judiciales que perjudicaran al Gobierno y al PSOE, asunto que
    también formaba parte de la instrucción de Pedraz, por lo que la Audiencia Nacional
    le había solicitado la inhibición. Según El Debate e Infobae (15 de julio de 2026),
    Zamarriego había supeditado su decisión sobre ese requerimiento de inhibición al
    resultado de un informe pendiente de la Policía Científica sobre las grabaciones
    aportadas a la causa por el fiscal Ignacio Stampa. Según El Español, la Fiscalía
    apoyó la inhibición en un informe del 6 de agosto en el que pidió acordarla sin
    esperar a esa pericial: la fiscal María Rosa Calvo sostuvo que los hechos
    investigados por Zamarriego «guardan identidad» con los analizados por Pedraz y que,
    «dada la íntima conexión entre ambas causas, debe acordarse la inhibición
    interesada». Son diligencias de instrucción en curso; ninguno de los hechos está
    probado judicialmente. Rige la presunción de inocencia.
  quote: >-
    el requerimiento de inhibición promovido por la Sección de Instrucción
    del Tribunal Central de Instancia Plaza número 5
