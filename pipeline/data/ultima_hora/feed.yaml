    a la cumbre de la OTAN en Ankara y asistir después a la graduación de su hija en
    Londres. Había entregado su pasaporte en el juzgado el 24 de junio. Mediante una
    providencia del 30 de junio, cuya notificación a algunas defensas se produjo el 1 de
    julio, Peinado dio tres días a las partes para presentar alegaciones antes de
    resolver. La acusación popular dirigida por Hazte Oír se opuso a ambos
    desplazamientos alegando riesgo de fuga. Posteriormente, según El Independiente
