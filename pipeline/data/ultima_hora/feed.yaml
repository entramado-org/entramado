  headline: >-
    Pedraz cita como investigado a Nervis Villalobos por presunta falsificación documental,
    reclama al PSOE la relación de abogados y consultoras que contrató entre 2021 y 2025 y pide
    a Anticorrupción que informe sobre la petición del PP de imputar al partido
  dek: >-
    Según Estrella Digital y Europa Press (vía Infobae), que recogen dos providencias conocidas
    el 6 de octubre de 2026 (la primera, fechada ese mismo día), el juez de la Audiencia
    Nacional Santiago Pedraz cita a declarar como investigado el 28 de octubre, por un presunto
    delito de falsificación documental, al exviceministro venezolano Nervis Villalobos, al que
    requiere la documentación original que presentó en su expediente de nacionalidad española
    por la Ley de Memoria Histórica (certificados de nacimiento y pasaporte de su abuela). Ese
    mismo día declaran como testigos dos responsables del área de Nacionalidad y Estado Civil
    del Ministerio de Justicia: el subdirector general desde marzo de 2025 y la subdirectora
    adjunta hasta esa fecha. Tras la declaración como investigada de la gerente del PSOE, Ana
    María Fuentes Pacheco, el juez requiere a los servicios jurídicos del partido la relación
    completa de letrados, despachos y consultoras contratados entre 2021 y 2025 por sus órganos
    centrales y territoriales, con las notas de encargo o contratos y la documentación que
    justificó los servicios, sin perjuicio del secreto profesional y del derecho a no
    autoincriminarse (Estrella Digital, Libertad Digital). En otra providencia, cuya fecha no
    precisan las fuentes, según Libertad Digital y Estrella Digital traslada a la Fiscalía
    Anticorrupción, para que informe, el escrito de la acusación popular unificada que lidera el
    PP en el que pide citar al PSOE como investigado; el partido no tiene por ahora esa
    condición procesal. Son diligencias de instrucción en curso. Rige la presunción de
    inocencia.
  outlet: Estrella Digital y Europa Press (vía Infobae)
  url: https://www.estrelladigital.es/articulo/tribunales/pedraz-reclama-psoe-todos-contratos-abogados-consultoras-2021-2025-cita-nervis-villalobos/20261006150011451867.html
