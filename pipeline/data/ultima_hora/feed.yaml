  headline: >-
    Las acusaciones piden al juez Peinado que Begoña Gómez declare como testigo en la
    pieza separada sobre un contrato de Red.es a una UTE de Barrabés y KPMG
  dek: >-
    Según The Objective (6 de julio de 2026), que cita el escrito al que tuvo acceso
    EFE, la acusación popular liderada por Hazte Oír ha pedido al juez Juan Carlos
    Peinado que cite como testigo a Begoña Gómez en la pieza separada abierta el 19 de
    junio. En esa pieza se investiga, por presuntos delitos de prevaricación y fraude a
    los intereses de la Unión Europea, una adjudicación de la entidad pública Red.es
    relacionada con el empresario Juan Carlos Barrabés. Según Infobae (19 de junio de
    2026), el juez aclaró en una providencia posterior que esa pieza afecta únicamente a
    Barrabés y no a Gómez ni a su asesora Cristina Álvarez. Según COPE (19 de junio de
    2026), el contrato, con un presupuesto base de 4.053.500 euros, recayó en una UTE
    formada por Innova Next —empresa de Barrabés— y la consultora KPMG, y estaría
    financiado con fondos FEDER, aunque la Abogacía del Estado discutió este extremo.
    Según The Objective, Red.es niega la existencia de prevaricación o fraude y sostiene
    que el contrato no fue financiado con fondos de la UE. Las acusaciones señalan que
    de Gómez «no consta carta de apoyo o recomendación suscrita» en ese expediente, pero
    sostienen que «no puede excluirse a priori, su participación directa». Piden además
    que se cite como investigados a más de una veintena de personas, principalmente
    técnicos y responsables que participaron en la evaluación y tramitación del
    expediente, así como al propio Barrabés. Eran peticiones de parte: según Europa
    Press (vía The Objective, 4 de agosto de 2026), Peinado acordó después en un auto
    «remitir el conocimiento de los hechos a la Fiscalía Europea» y el archivo de las
    actuaciones «sin más trámite». Rige la presunción de inocencia.
  outlet: The Objective
