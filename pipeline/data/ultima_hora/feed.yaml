  headline: >-
    La Fiscalía comunica a Peinado que no formulará acusación contra Begoña Gómez y
    anuncia un escrito de conclusiones absolutorias
  dek: >-
    Según Libertad Digital (28 de julio de 2026), la Fiscalía comunicó por escrito al
    juez Juan Carlos Peinado (Juzgado de Instrucción nº 41 de Madrid), «a fin de evitar
    equívocos», que «no se formulará escrito de conclusiones provisionales en sentido
    acusatorio». En el mismo escrito interesó un traslado posterior «a fin de formular
    escrito de conclusiones absolutorias a la vista de las pretensiones que puede
    ejercer la acusación popular unificada». Según el mismo medio, la Fiscalía no acusa
    en este proceso. Peinado dio en una providencia cinco días a las defensas de Begoña
    Gómez y de su asesora Cristina Álvarez para presentar su escrito de defensa, y les
    pidió que indicaran si renunciaban a la audiencia preliminar sobre la procedencia de
    la apertura del juicio oral. Según Infobae (13 de septiembre de 2026), en la
    audiencia preliminar celebrada el 8 de septiembre la Fiscalía y las defensas de
    Gómez y Álvarez solicitaron el archivo de la causa, mientras que Hazte Oír, que
    ejerce la acusación popular, mantuvo su petición de apertura de juicio oral. Los
    hechos investigados no están judicialmente probados. Rige la presunción de
    inocencia.
