  headline: >-
    La UCO detiene a seis personas, entre ellas la pareja de Ábalos, y registra la casa del exministro
    en Valencia en una nueva pieza secreta del caso Koldo; todas quedan en libertad el mismo día
  dek: >-
    Según The Objective, elDiario.es, El Español y Europa Press (5 de noviembre de 2026), agentes de la
    UCO detuvieron a seis personas por orden del juez de la Audiencia Nacional Ismael Moreno, que abrió
    una nueva pieza separada y secreta del caso Koldo tras recibir un informe actualizado de la UCO. Entre
    los detenidos figuran Andrea de la Torre, pareja de José Luis Ábalos, detenida en el domicilio del
    exministro en Valencia, que fue registrado, y Cristian Corvillo, detenido en Córdoba, a quien el PP
    identifica como chófer de Pedro Sánchez en las primarias del PSOE de 2017; según elDiario.es, también
    fue detenido su hermano Rubén y los otros tres detenidos son empresarios. Los agentes acudieron además
    a la sede de Adif y a las oficinas de la constructora Azvi en Sevilla con requerimientos de documentación;
    fuentes de Adif citadas por El Español aseguran que allí «no se ha practicado ningún registro», y
    según elDiario.es los responsables de Azvi no están imputados. Según Europa Press, la UCO puso en
    libertad a los seis detenidos ese mismo día; según elDiario.es, quedan a la espera de que el juez
    los cite a declarar como investigados. La pieza aborda el presunto amaño de adjudicaciones en el Ministerio
    de Transportes durante la etapa de Ábalos y el posterior blanqueo de las mordidas. Son diligencias
    de instrucción en curso. Rige la presunción de inocencia.
  quote: quedaran en libertad después a la espera de que él los cite a declarar en calidad de investigados
  outlet: elDiario.es
