  headline: >-
    El juez Moreno mantiene la imputación de Jésica Rodríguez y rechaza que la sentencia
    del Supremo a Ábalos impida investigarla
  dek: >-
    Según Infobae (24 de julio de 2026), que tuvo acceso a la resolución, el juez Ismael
    Moreno (Audiencia Nacional, caso Koldo) rechazó en un auto del 23 de julio el
    recurso de reforma presentado por la defensa de Jésica Rodríguez García —expareja
    del exministro José Luis Ábalos— y confirmó su imputación por indicios de un
    presunto delito de malversación relacionado con los sueldos que percibió de las
    empresas públicas Ineco y Tragsatec entre 2019 y 2021 sin desempeñar función alguna
    —aproximadamente 43.950 euros en total según los datos de la sentencia del Tribunal
    Supremo del 22 de junio de 2026—. La defensa alegó tres motivos: falta de motivación
    de la providencia del 3 de julio que la citaba como investigada, cosa juzgada por
    cuanto los hechos habrían sido ya objeto de la sentencia condenatoria a Ábalos y
    Koldo García, y prescripción de la acción penal. El juez rechazó los tres: la
    citación se apoyaba en el informe del Ministerio Fiscal del 1 de julio, el Supremo
    no juzgó a Rodríguez —declaró solo como testigo— y el delito que se le atribuye es
    la malversación, no la obtención de los contratos. La resolución no es firme: cabe
    recurso de apelación ante la Sala de lo Penal de la Audiencia Nacional. Son
    diligencias de instrucción en curso; los hechos no están probados judicialmente.
    Rige la presunción de inocencia.
