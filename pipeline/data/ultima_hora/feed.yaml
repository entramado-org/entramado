  dek: >-
    Según El Español (25 de junio de 2026), el abogado Jacobo Teijelo, interrogado como
    investigado por el juez Santiago Pedraz en el caso Leire, confirmó haber visitado la
    sede de la Fiscalía General junto a Leire Díez, aunque no quiso aclarar el motivo de
    esas visitas. También declaró que el PSOE le contrató para analizar resoluciones
    judiciales y la viabilidad de procedimientos que afectaban al partido. Según ese
    diario, el PSOE le pagó al menos 75.000 euros y no le abonó otras dos facturas por
    50.000 euros por «incompatibilidad», una vez que pasó a ser defensor de Santos
    Cerdán. Son diligencias de instrucción en curso. Rige la presunción de inocencia.
