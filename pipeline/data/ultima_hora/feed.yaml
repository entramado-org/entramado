  headline: >-
    La Fiscalía suiza responde a Calama que no encuentra cuentas de Kingsfield Consulting
    Corp en UBS ni en Crédit Agricole; la comisión rogatoria se incorpora a la causa Plus
    Ultra sin cerrar la investigación
  dek: >-
    Según Infobae (10 de septiembre de 2026) y Moncloa.com (11 de septiembre), la
    Fiscalía suiza —la de Berna, según Moncloa.com— comunicó al juez José Luis Calama
    (Audiencia Nacional, DP 77/2024) que no ha localizado ninguna cuenta vinculada a
    Kingsfield Consulting Corp en UBS ni en Crédit Agricole Switzerland, y que la sociedad
    no figura como titular económica ni beneficiaria de ninguna cuenta ni consta que
    tuviera poder para operar sobre ellas; la respuesta se incorporó a las diligencias
    mediante una diligencia de ordenación de ese 10 de septiembre. El nombre de la
    sociedad figuraba en la documentación que maneja el juzgado, lo que llevó al juez a
    pedir las comprobaciones. Según Moncloa.com, el juez sospecha y trata de probar que
    parte del rescate de 53 millones de euros que la SEPI concedió a Plus Ultra se
    destinó a saldar deuda de la aerolínea con fondos radicados en Suiza y Panamá, y ya
    en mayo una comisión rogatoria a Zúrich había dado resultado negativo. El resultado
    cierra esta pista de cooperación internacional pero no implica el archivo de la causa,
    que sigue en instrucción. Ningún hecho está probado judicialmente. Rige la presunción
    de inocencia.
  outlet: Infobae
  url: https://www.infobae.com/espana/2026/09/10/suiza-desmonta-una-de-las-pistas-financieras-de-la-causa-de-zapatero-no-encuentra-cuentas-vinculadas-a-la-sociedad-investigada-tras-rastrear-dos-bancos/
