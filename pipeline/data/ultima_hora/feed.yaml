  briefing_slug: caso-koldo-mascarillas
- iso: '2026-11-16'
  date: 16 nov 2026
  headline: >-
    El juzgado del caso Begoña Gómez insta a Google a no eliminar los proyectos del software de la
    cátedra de la Complutense alojados en Google Cloud
  dek: >-
    Según Europa Press (vía Telemadrid) e Infobae (16 de noviembre de 2026), el magistrado Carlos Valle,
    que sustituye al ya jubilado Juan Carlos Peinado en el Juzgado nº 41 de Madrid, ha acordado en una
    providencia oficiar a Google para que no elimine el contenido de los proyectos del software de la
    Universidad Complutense alojados en las consolas de Google Cloud. «Dada la urgencia y para evitar la
    pérdida del contenido de los proyectos citados y por motivos de prudencia», señala la resolución, que
    se dicta al no haber obtenido respuesta de la empresa Devoteam Drago sobre la desconexión de la
    consola. Según Infobae, el juzgado había autorizado esa desconexión el 21 de octubre, la acusación
    popular que encabeza Hazte Oír recurrió y la Fiscalía ha informado a favor de conservar el contenido
    mientras se resuelve, aunque rechaza que se ordene una nueva copia forense. Begoña Gómez está enviada
    a juicio por presuntos delitos de malversación y tráfico de influencias; según Europa Press, el
    juicio no tiene fecha y las defensas y la Fiscalía piden la absolución. Rige la presunción de
    inocencia.
  outlet: Europa Press (vía Telemadrid)
  url: https://www.telemadrid.es/noticias/nacional/juzgado-caso-begona-gomez-insta_1_2816965.html
