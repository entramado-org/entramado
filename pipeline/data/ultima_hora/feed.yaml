    La defensa de Zapatero pide a la Sala de lo Penal que saque de la causa Plus Ultra la
    investigación de sus negocios en Bolivia y acusa al juez de dar a la UDEF una «patente
    de corso»
  dek: >-
    Según El Español (14 de septiembre de 2026), la defensa de José Luis Rodríguez
    Zapatero ha recurrido ante la Sala de lo Penal de la Audiencia Nacional la decisión
    del juez José Luis Calama de investigar sus negocios en Bolivia, recogidos en un
    informe de la UDEF de 22 de abril. Su abogado, Víctor Moreno Catena, sostiene que esos
    ingresos son «ajenos a la organización que la UDEF atribuye al señor Zapatero», que la
    línea de investigación es prospectiva y vulnera el principio de especialidad, y pide
    que el informe se aparte del procedimiento y las pesquisas se limiten al caso Plus
    Ultra. Rige la presunción de inocencia.
