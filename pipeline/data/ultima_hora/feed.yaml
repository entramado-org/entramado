  headline: >-
    El juez Calama rechaza retirar del sumario el informe de la UDEF sobre los 200.000
    euros que Zapatero recibió de Focus Social Research, vinculados por la Policía a
    presuntas gestiones ante el Gobierno de Bolivia
  dek: >-
    Según Infobae (15 de julio de 2026), el juez José Luis Calama (Audiencia Nacional,
    DP 77/2024) rechazó la petición de la defensa de José Luis Rodríguez Zapatero de
    retirar del caso Plus Ultra el informe de la UDEF que analiza tres transferencias
    por un total de 200.000 euros recibidas por el expresidente de la sociedad peruana
    Focus Social Research SAC; la tesis policial (informe UDEF 2910, p.3-5) sostiene que
    esa sociedad habría actuado como interpuesta y que el pago remuneraría una
    influencia ejercida ante autoridades de Bolivia en favor del conglomerado peruano
    Grupo Gloria. La defensa, en un escrito del 25 de junio, alegaba que el informe
    abordaba hechos ajenos al objeto de la investigación y que la UDEF había practicado
    una investigación prospectiva sobre la actividad profesional del expresidente. El
    juez lo rechaza: la aparición de las transferencias «no es el resultado de una
    fiscalización indiscriminada de la vida del investigado», sino «la consecuencia
    natural del análisis de fuentes de prueba válidamente obtenidas», y el objeto del
    procedimiento «se perfila y se amplía conforme la investigación progresa»; considera
    el informe «pertinente» y su incorporación «legítima», y lo mantiene en las
    diligencias. Según Infobae, Zapatero rechaza esa interpretación y mantiene que el
    dinero responde a un contrato de asesoramiento profesional lícito. Ninguno de los
    hechos está probado judicialmente. Rige la presunción de inocencia.
  outlet: Infobae
  url: https://www.infobae.com/espana/2026/07/15/el-juez-rechaza-retirar-de-la-causa-el-informe-de-la-udef-que-vinculaba-los-200000-euros-recibidos-por-zapatero-a-presuntas-gestiones-de-influencia-en-bolivia/
