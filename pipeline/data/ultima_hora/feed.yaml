  headline: >-
    La defensa de David Sánchez anuncia que recurrirá la sentencia de la Audiencia de
    Badajoz ante el TSJ de Extremadura
  dek: >-
    Según EFE (vía Infobae, 14 de julio de 2026), Emilio Cortés, letrado de David
    Sánchez Pérez-Castejón, aseguró que recurrirá la sentencia dictada por la Sección
    Primera de la Audiencia Provincial de Badajoz, que condena al hermano del presidente
    del Gobierno a nueve años de inhabilitación de empleo o cargo público como autor por
    cooperación necesaria de un delito de prevaricación administrativa relacionada con
    el cambio de nomenclatura de su plaza (fallo, p. 374), si bien optó por no analizar
    la resolución de momento ni adelantar los términos en que sustentará el recurso.
    Contra la sentencia cabe recurso de apelación, en un plazo máximo de diez días, ante
    la Sala de lo Civil y Penal del Tribunal Superior de Justicia de Extremadura. La
    sentencia no es firme; rige la presunción de inocencia.
