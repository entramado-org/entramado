  headline: >-
    Pedraz cita al empresario de hidrocarburos que sostuvo ante la Guardia Civil que la
    abogada de Koldo le ofreció, en nombre de Leire Díez, beneficios procesales a cambio
    de información comprometedora sobre la UCO y Repsol
  dek: >-
    Según EFE (vía Infobae, 9 de julio de 2026), el juez Santiago Pedraz (Juzgado
    Central de Instrucción nº 5 de la Audiencia Nacional) citó a declarar ese jueves, 9
    de julio, a tres empresarios de hidrocarburos, testigos que ya acudieron a
    dependencias de la Guardia Civil el 28 de mayo y que están además investigados en
    casos de presunto fraude de IVA en ese sector. Antonio Rodríguez Estepa sostuvo ante
    la Guardia Civil que la abogada de Koldo García, Leticia de la Hoz —investigada en
    el caso Leire—, le propuso, como intermediaria de Leire Díez, beneficios procesales
    con la condición de que aportara información comprometedora sobre Repsol, la UCO y
    el mando de esta unidad Antonio Balas, así como sobre altos cargos de Hacienda;
    según su relato, De la Hoz le dijo que la persona que podía efectuar ese
    ofrecimiento era Leire Díez, y él rechazó la oferta siguiendo el consejo de su
    abogado. Claudio Rivas —socio de Víctor de Aldama en el sector de los hidrocarburos
    e investigado junto a él— negó ante la Guardia Civil conocer a Leire Díez o que le
    hubieran ofrecido algún beneficio por cambiar alguna declaración judicial; sí
    reconoció contactos con el abogado Jacobo Teijelo, investigado en este
    procedimiento, que le habló de coordinar defensas, algo que finalmente no ocurrió.
    Son testimonios prestados ante la Guardia Civil en una instrucción en curso, no
    hechos probados; rige la presunción de inocencia.
