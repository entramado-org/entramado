  headline: >-
    Calama ofrece a la AEAT personarse como 'potencial perjudicada' en la pieza de las
    joyas de Zapatero
  dek: >-
    Según EFE (vía Infobae, 26 de junio de 2026), el juez de la Audiencia Nacional José
    Luis Calama ofreció en un auto a la Agencia Tributaria, a través de la Abogacía del
    Estado, personarse como «potencial perjudicada» en la pieza separada en la que se
    investigan las joyas halladas en la oficina de José Luis Rodríguez Zapatero en la
    calle Ferraz de Madrid, valoradas en 1,3 millones de euros, por hechos relativos a
    un posible delito contra la Hacienda Pública y un delito de contrabando. Según EFE,
    el juez considera que la naturaleza de los hechos investigados «revela un perjuicio
    patrimonial directamente conectado con ingresos de titularidad estatal cuya gestión
    corresponde a la AEAT», lo que la legitima, a su juicio, para «ejercitar las
    acciones penales y civiles que resulten procedentes». Las joyas se hallaron el 19 de
    mayo y su origen, según EFE, aún no estaba justificado. El ofrecimiento de acciones
    no supone por sí mismo que Hacienda se haya personado. Rige la presunción de
    inocencia.
