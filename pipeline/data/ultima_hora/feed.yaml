- iso: '2026-09-08'
  date: 8 sep 2026
  headline: >-
    El ex consejero delegado de Plus Ultra Roberto Roselli ratifica ante Calama que la
    aerolínea pagó 530.000 euros —el 1 % del rescate— a las empresas de Julio Martínez
    Martínez por supuestas gestiones de Zapatero, cuyas gestiones concretas dice
    desconocer
  dek: >-
    Según Europa Press (vía Infobae) y COPE (8 de septiembre de 2026), Roberto Roselli
    Miele, ex consejero delegado de Plus Ultra Líneas Aéreas, declaró el martes 8 de
    septiembre durante unas tres horas como investigado ante el juez José Luis Calama
    (Audiencia Nacional, DP 77/2024) y ratificó el escrito de colaboración que presentó
    en julio: la aerolínea pagó 530.000 euros —el 1 % de los 53 millones del rescate de
    la SEPI— a las empresas de Julio Martínez Martínez, socio del expresidente José Luis
    Rodríguez Zapatero, por supuestas «gestiones» de este; según COPE, afirmó que en la
    compañía «conocían que el destino final de esa comisión era Zapatero», aunque dijo
    desconocer qué gestiones concretas habría hecho el expresidente y que nunca habló
    con él. Según Europa Press, los directivos reconocieron que contrataron con Martínez
    Martínez «como medida desesperada» a sabiendas de su relación con Zapatero; los pagos
    se repartieron entre Análisis Relevante (249.000 euros), Voli Analítica (98.617) y
    Domotic Europe (110.799), con unas cuarenta facturas por «Honorarios mensuales.
    Elaboración de informe» que, según su escrito, correspondían a informes
    «irrelevantes» que servían de «actividad encubridora». Roselli declaró un día después
    que el expresidente de la aerolínea Julio Martínez Sola, con quien coincide en el
    relato de la llamada de Zapatero del 30 de abril de 2020. La causa sigue en
    instrucción; ninguno de los hechos está probado judicialmente y Zapatero niega
    cualquier gestión. Rige la presunción de inocencia.
  quote: >-
    conocían que el destino final de esa comisión era Zapatero
  outlet: Europa Press (vía Infobae)
  url: https://www.infobae.com/espana/agencias/2026/09/08/exceo-de-plus-ultra-mantiene-que-se-pago-medio-millon-al-socio-de-zapatero-por-gestiones-del-expresidente-en-el-rescate/
