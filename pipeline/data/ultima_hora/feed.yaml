  headline: >-
    El Tribunal de Cuentas entrega al juez Moreno un pendrive con los donantes del PSOE de
    2017 a 2024 en la pieza secreta sobre su financiación
  dek: >-
    Según El Mundo (vía Qué!, 14 de septiembre de 2026), el Tribunal de Cuentas ha
    entregado a la Audiencia Nacional, en un sobre lacrado, un pendrive con los nombres de
    los donantes del PSOE entre 2017 y 2024. El juez Ismael Moreno había pedido el listado
    al partido y al Tribunal de Cuentas en una pieza secreta que busca comprobar si las
    comisiones que Víctor de Aldama dice haber entregado se camuflaron como aportaciones
    de apariencia legal. El PSOE sostiene que todas sus donaciones son legales. Son
    diligencias de una instrucción bajo secreto. Rige la presunción de inocencia.
