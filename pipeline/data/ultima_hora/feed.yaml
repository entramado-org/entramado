  headline: >-
    La Agencia Tributaria comunica al juez Calama que realiza una investigación fiscal
    sobre Zapatero, su mujer, sus hijas y Julio Martínez Martínez
  dek: >-
    Según Libertad Digital (03-07-2026), la Agencia Estatal de Administración Tributaria
    (AEAT) informó al juez José Luis Calama, que instruye en la Audiencia Nacional la
    causa sobre el rescate de Plus Ultra, de que realiza una investigación fiscal,
    abierta en junio de 2026, sobre el expresidente José Luis Rodríguez Zapatero, su
    esposa y sus dos hijas, y Julio Martínez Martínez. Según el escrito que recoge ese
    medio, la AEAT pidió al juez que le ordenara paralizar esos procedimientos
    inspectores por «prejudicialidad penal», porque la determinación de las obligaciones
    tributarias «podría depender directamente de los hechos y conductas que están siendo
    investigados» en la vía penal, y para evitar «un riesgo de calificaciones
    contradictorias en vía penal y administrativa». El medio informa también de que la
    AEAT se ha personado en la causa a través de la Abogacía del Estado. Según The
    Objective (30-07-2026), el juez rechazó después frenar esas inspecciones al
    considerar que no existían motivos para suspender las actuaciones de la Agencia
    Tributaria; ese medio precisa que la esposa del expresidente no está imputada. La
    apertura de actuaciones tributarias no prejuzga la existencia de infracción fiscal
    ni condena alguna. Rige la presunción de inocencia.
