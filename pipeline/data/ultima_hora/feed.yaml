  headline: >-
    Peinado abre juicio oral contra Begoña Gómez, le retira el pasaporte y le prohíbe
    salir de España
  dek: >-
    El juez Juan Carlos Peinado dictó el sábado 20 de junio de 2026 un auto de 84
    páginas (en corpus) por el que acordó la apertura de juicio oral con jurado popular
    contra Begoña Gómez y su asesora en Moncloa Cristina Álvarez —por presuntos delitos
    de tráfico de influencias, corrupción en los negocios, malversación de caudales
    públicos y apropiación indebida— y contra el empresario Juan Carlos Barrabés —por
    tráfico de influencias y corrupción en los negocios— (auto de 20 de junio de 2026,
    p.83). El magistrado impuso a Gómez y a Álvarez, y solo a ellas, la retirada de
    cuantos pasaportes dispongan, la prohibición de salida del territorio nacional y la
    obligación de comparecer quincenalmente «durante el tiempo que dure la tramitación
    de esta causa y hasta que sea dictada una resolución firme» (auto de 20 de junio de
    2026, p.83; Infobae, 20 de junio de 2026). La Fiscalía había reiterado su petición
    de sobreseimiento (auto de 20 de junio de 2026, p.1). Según Infobae (16 de julio de
    2026), el auto de la Sección 23 de la Audiencia Provincial de Madrid de esa fecha
    limitó después el juicio con jurado a los presuntos delitos de tráfico de
    influencias y malversación y devolvió el pasaporte a Gómez. Rige la presunción de
    inocencia.
