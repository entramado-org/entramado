  dek: >-
    Según Estrella Digital y El Español (28 de septiembre de 2026), el juez de la
    Audiencia Nacional Santiago Pedraz admitió, en una providencia de ese día y en línea
    con la Fiscalía, la personación como acusación particular de la magistrada Beatriz
    Biedma, titular del Juzgado de Instrucción nº 3 de Badajoz que instruyó el caso David
    Sánchez, al considerarla perjudicada «al menos por el delito de calumnia», y la citó a
    declarar el 8 de octubre a las 10:15 horas. El juez rechazó por ahora abrir una línea
    de investigación sobre una anotación de las agendas de Leire Díez y no acordó
    incorporar los vídeos del canal de YouTube del exjuez Luis José Sáenz de Tejada, al no
    constar datos que los vinculen con indicaciones de Díez, sin perjuicio de lo que
    arrojen las diligencias pendientes. Son diligencias de instrucción en curso. Rige la
    presunción de inocencia.
