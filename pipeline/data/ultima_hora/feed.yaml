  headline: >-
    Pedraz rechaza incorporar el desmentido de Aldama a la pieza sobre la abogada de
    Koldo y requiere al chófer de Carmen Pano los WhatsApp con De la Hoz para fechar sus
    reuniones y conocer su contenido
  dek: >-
    Según Libertad Digital y El Debate (2 de septiembre de 2026), el juez Santiago Pedraz
    (Juzgado Central de Instrucción nº 5 de la Audiencia Nacional, caso Leire, DP
    150/2025) denegó en un auto las diligencias pedidas por la defensa de Leticia de la
    Hoz Calvo —abogada de Koldo García e investigada por un presunto intento de soborno
    a la empresaria Carmen Pano para que cambiara su versión sobre la entrega de 90.000
    euros en la sede del PSOE en Ferraz—, entre ellas incorporar la declaración de Víctor
    de Aldama en el caso Hidrocarburos en la que desmentía a Pano y citar como testigos a
    Jacobo Abad, Manel Sallés y Nuria Sorribas, según El Debate. El auto razona que «los
    hechos investigados respecto de la Sra. DE LA HOZ se ciñen al concreto hecho de si la
    misma ofreció una elevada cantidad de dinero a CARMEN PANO y ALVARO GALLEGO para que
    estos modificaran su testimonio en otros Procedimientos» y que «este juzgado no puede
    convertirse en una vía paralela de discusión o prueba sobre esas cuestiones». A
    petición de la Fiscalía, el juez requirió a Álvaro Gallego, chófer y persona de
    confianza de Pano, que aporte los WhatsApp «o cualquier otro soporte documental» que
    permitan fijar la fecha de sus reuniones con De la Hoz y, en su caso, su contenido.
    Son diligencias de instrucción en curso; ninguno de los hechos está probado
    judicialmente. Rige la presunción de inocencia.
  quote: >-
    este juzgado no puede convertirse en una vía paralela de discusión o prueba sobre
    esas cuestiones
