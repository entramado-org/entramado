    Julio Martínez Sola y Roberto Roselli tras sus escritos sobre Zapatero, según
    Infobae
  dek: >-
    Según Infobae (21 de julio de 2026), durante la declaración como investigado de
    Julio Martínez Martínez ('Julito') en el caso Plus Ultra (DP 77/2024), la fiscal de
    Anticorrupción Elena Lorente expresó en su turno que ve necesario volver a llamar a
    declarar a Julio Martínez Sola y a Roberto Roselli —«director y CEO de Plus Ultra
    durante el rescate», según ese medio— para que profundicen en los escritos
    presentados el lunes 20 de julio. Según El Español (20 de julio de 2026), Martínez
    Sola relata en su escrito que el 30 de abril de 2020 recibió una llamada desde un
    número oculto que resultó ser de José Luis Rodríguez Zapatero, quien le manifestó
    «que su intervención [para conseguir ayuda financiera para Plus Ultra] podría ser de
    ayuda y que haría las gestiones oportunas». Según el mismo medio, el escrito detalla
    que se firmaron contratos de asesoramiento con sociedades vinculadas a Julio
    Martínez Martínez, con pagos que sumaron el 1% del rescate, es decir, 530.000 euros.
    Según El Español, Zapatero había negado de forma vehemente esa llamada en su
    declaración ante Calama. Según Infobae, en la comisión de investigación del Senado
    del 2 de marzo dijo que no había «cobrado ninguna comisión de Plus Ultra,
    absolutamente ninguna». La causa sigue en instrucción y ninguno de los hechos está
    probado judicialmente. Rige la presunción de inocencia.
