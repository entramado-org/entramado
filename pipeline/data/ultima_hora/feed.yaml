  headline: >-
    La acusación popular pide a Pedraz apartar cautelarmente del mando de la UCO a la
    cúpula de la Guardia Civil y reitera la imputación del exdirector Leonardo Marcos
  dek: >-
    Según Libertad Digital (24-07-2026), la acusación popular pidió al juez Santiago
    Pedraz (Audiencia Nacional, DP 150/2025) prohibir cautelarmente a la directora
    general de la Guardia Civil, Mercedes González Fernández, y al director adjunto
    operativo, Manuel Llamas —ambos investigados en la causa desde el 2 de julio—,
    «ejercer cualquier facultad de mando, dirección, supervisión, destino, evaluación o
    régimen disciplinario sobre la UCO». Su argumento es que «quienes presuntamente
    utilizaron sus potestades administrativas como instrumento de presión conservan
    íntegramente esas mismas potestades sobre la unidad afectada». Pidió también imputar
    al exdirector general Leonardo Marcos, cuya imputación el juez había rechazado el 2
    de julio (The Objective, 02-07-2026). Para ello, el escrito invoca el informe de la
    UCO en el que su entonces jefe, Rafael Yuste, denunció presiones de Llamas y de
    Marcos para que la unidad «se pusiera de perfil» en la investigación sobre David
    Sánchez. Según El Debate (29-07-2026), Pedraz rechazó («no ha lugar») la medida
    cautelar porque la UCO, como policía judicial, «solo habrá de dar cuenta a este
    instructor». Según Infobae (29-07-2026), el juez acordó imputar a Marcos, citado a
    declarar como investigado el 10 de septiembre. Son escritos de parte y diligencias
    de instrucción en curso; ninguno de los hechos está probado judicialmente. Rige la
    presunción de inocencia.
