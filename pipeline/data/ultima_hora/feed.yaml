  headline: >-
    Un informe de la UCO remitido a Pedraz sostiene que advirtió a la jueza Biedma de que los correos
    de Begoña Gómez del caso David Sánchez no parecían relevantes y que fue ella quien los requirió y
    acordó trasladarlos a las partes
  dek: >-
    Según Libertad Digital, Europa Press y elDiario.es (29 de octubre de 2026), la UCO ha remitido al
    juez de la Audiencia Nacional Santiago Pedraz, en el caso Leire Díez, un informe en el que sostiene
    que avisó a la jueza Beatriz Biedma, meses antes de que se publicaran, de que el material de la causa
    contra David Sánchez contenía correos de Begoña Gómez —y, según Libertad Digital, de Pedro Sánchez—
    cuyo contenido, a juicio de los agentes y según recoge elDiario.es, «no parecía tener relevancia para
    el objeto de la investigación». Según el informe, recogido por elDiario.es, «la magistrada requirió
    todos los correos para determinar, ella, la relevancia de estos», y, según Libertad Digital, «había
    sido ella quien acordó dar traslado a las partes de dicho documento». Es la versión de la UCO. Por
    otra parte, según El Español, un informe de la Jefatura de Policía Judicial de la Guardia Civil, ya
    en poder de Pedraz, exculpa a la UCO de las filtraciones por las que el DAO Manuel Llamas abrió informaciones
    reservadas; Pedraz analiza si la apertura de esas informaciones reservadas constituyó un método de
    presión. Son diligencias de instrucción en curso. Rige la presunción de inocencia.
  quote: había sido ella quien acordó dar traslado a las partes de dicho documento
  outlet: Libertad Digital
  url: https://www.libertaddigital.com/espana/2026-10-29/la-uco-asegura-a-pedraz-que-informo-a-biedma-de-que-su-informe-contenia-el-correo-de-begona-gomez-7484228/
