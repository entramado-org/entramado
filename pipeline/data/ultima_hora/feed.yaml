  headline: >-
    El juez Zamarriego prorroga seis meses la instrucción sobre Leire Díez y deja su
    decisión sobre la inhibición a favor de Pedraz pendiente de un informe pericial
  dek: >-
    Según un auto al que tuvo acceso EFE, recogido por El Debate (15 de julio de 2026),
    el magistrado Arturo Zamarriego, juez de Plaza de Castilla (Madrid) que investiga a
    Leire Díez por presuntas maniobras contra jueces, fiscales y mandos de la Guardia
    Civil, prorrogó seis meses la instrucción. El 24 de julio se cumplía un año de la
    apertura de la causa y faltaba un informe de la Policía Científica «necesario para
    el esclarecimiento de los hechos». El juez había encargado ese informe para
    determinar si pudieron ser manipuladas las grabaciones aportadas a la causa por el
    fiscal Ignacio Stampa, y señaló que, a la vista de su resultado, resolvería sobre el
    requerimiento de inhibición del juez Santiago Pedraz (Audiencia Nacional). Después,
    según EFE (vía The Objective, 17 de agosto de 2026), Zamarriego aceptó inhibirse en
    favor de la Audiencia Nacional y Pedraz asumió toda la investigación. Rige la
    presunción de inocencia.
  outlet: El Debate
