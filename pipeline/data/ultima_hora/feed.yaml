  headline: >-
    Pedraz cita como investigado el 28 de octubre al exjuez Luis José Sáenz de Tejada por
    organización criminal, calumnias, coacciones y un delito contra la integridad moral
  dek: >-
    Según EFE, elDiario.es y The Objective (13 de octubre de 2026), el juez de la Audiencia
    Nacional Santiago Pedraz, que instruye el caso Leire, ha dictado una resolución en la
    que cita a declarar como investigado, el 28 de octubre a las 10.30 horas, al exjuez Luis
    José Sáenz de Tejada por presuntos delitos de organización criminal, calumnias,
    coacciones y contra la integridad moral. La citación llega horas después de que la
    magistrada Beatriz Biedma, que declaró el 8 de octubre ante Pedraz, pidiera su
    declaración como investigado. Según Europa Press, una testigo declaró a la UCO que el
    exjuez contactó con ella y le habló de «eliminar» a la magistrada; Sáenz de Tejada lo
    niega y, en un escrito a la Audiencia Nacional, lo califica de «rotundamente falso» y de
    «imputación falsa de hechos sin investigación alguna». Son diligencias de instrucción en
    curso. Rige la presunción de inocencia.
