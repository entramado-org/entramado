  headline: >-
    Pedraz inadmite el incidente de nulidad de Leire Díez contra su detención y las
    actuaciones derivadas de la incautación de sus dispositivos
  dek: >-
    Según The Objective (6 de julio de 2026), que se basa en un auto al que tuvo acceso
    EFE, el juez Santiago Pedraz (Juzgado Central de Instrucción nº 5 de la Audiencia
    Nacional) inadmitió a trámite el incidente de nulidad con el que la defensa de Leire
    Díez pretendía anular la causa, al sostener que su detención del 10 de diciembre de
    2025 fue desproporcionada e ilegítima, así como la información obtenida de los
    objetos y dispositivos que se le incautaron y las actuaciones derivadas de esa
    incautación. El magistrado consideró el incidente extemporáneo y contrario a la
    buena fe procesal y a la prohibición de usar ese instrumento para revisar cuestiones
    ya resueltas; subrayó que la cuestión no se suscitó cuando se produjo la detención
    ni se impugnó por los mecanismos previstos, singularmente el habeas corpus, ni
    mediante recurso o alegación en el momento procesal oportuno, y que la nulidad se
    reclamó más de seis meses después del arresto. La Fiscalía Anticorrupción, cuyo
    criterio siguió el juez, recordó que el plazo para pedir la nulidad es de 20 días
    desde la notificación de la resolución o desde que se tuvo conocimiento del defecto
    causante de indefensión. Según la información publicada, contra la decisión no cabe
    recurso. Rige la presunción de inocencia.
