  dek: >-
    Según EFE (vía Infobae, 13 de julio de 2026), cinco magistrados de la Sección 23 de
    la Audiencia Provincial de Madrid, reunidos en sala reforzada (pleno), deliberan
    este lunes 13 de julio sobre los recursos contra la decisión del juez Juan Carlos
    Peinado de enviar a juicio con tribunal del jurado a Begoña Gómez, su asesora María
    Cristina Álvarez Rodríguez y el empresario Juan Carlos Barrabés por presuntos
    delitos de corrupción en los negocios, malversación, tráfico de influencias y
    apropiación indebida. La sala resolverá también un recurso de la acusación popular
    contra el sobreseimiento del delito de intrusismo y otro sobre una posible escisión
    de la acusación popular conjunta que dirige Hazte Oír. El auto puede tardar días en
    publicarse, ya que los magistrados deben motivarlo y redactarlo. Rige la presunción
    de inocencia.
