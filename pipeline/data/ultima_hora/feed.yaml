  headline: >-
    Un informe de la UCO al juez Pedraz recoge correos de 2020 en los que la Dirección
    General de Seguridad Jurídica preguntaba por el expediente de nacionalidad de Nervis
    Villalobos
  dek: >-
    Según El Debate (24 de septiembre de 2026), la UCO ha entregado al juez Santiago
    Pedraz un informe sobre la tramitación del expediente de nacionalidad del
    exviceministro venezolano Nervis Villalobos, cuya solicitud fue denegada, en el que
    constan dos correos de julio de 2020 dirigidos a responsables del Área de Nacionalidad
    con el asunto «Expediente nacionalidad pregunta la Directora: Nervis Villalobos»,
    cuando la directora general de Seguridad Jurídica y Fe Pública era Sofía Puente. Según
    el mismo medio, los investigadores sospechan que Leire Díez pudo intervenir en ese
    expediente. Las informaciones publicadas no atribuyen a Sofía Puente ningún delito ni
    la sitúan como investigada. Son diligencias de instrucción en curso. Rige la
    presunción de inocencia.
