    que investiga sociedades vinculadas a Zapatero, según El Debate
  dek: >-
    José Antonio Marco Sanjuán, expresidente del Tribunal Económico-Administrativo
    Central (TEAC), a quien El Debate describe como el 'tres' de la entonces
    vicepresidenta María Jesús Montero, está destinado como inspector en la Dependencia
    Regional de Inspección de la AEAT en la Comunidad Valenciana, el área que, según ese
    medio, rastrea el entramado societario vinculado a José Luis Rodríguez Zapatero.
    Según publica El Debate (08-07-2026), no se le ha abierto expediente interno ni se
    le ha suspendido de forma cautelar. Marco Sanjuán dimitió del TEAC en junio de 2025.
    Según El Periódico (vía El Correo Gallego, 23-03-2026), en marzo de 2026 el Juzgado
    de Instrucción nº 35 de Madrid admitió a trámite una querella por cohecho de la
    Fiscalía Anticorrupción, por la que está investigado. En una información anterior
    (12-05-2026), El Debate publicó que, según la UDEF, su entorno societario cobró más
    de 1,2 millones de euros de unos empresarios a los que el TEAC que él presidía anuló
    el 19 de mayo de 2023 una derivación de responsabilidad de 16.099.696 euros. Su
    causa no forma parte de los documentos judiciales de este grafo; es información de
    prensa sobre una instrucción en curso, no hechos probados, y rige la presunción de
    inocencia.
