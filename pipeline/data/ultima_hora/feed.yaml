    Jésica Rodríguez, el hermano de Koldo e Ignacio Zaldívar se acogen a su derecho a no
    declarar ante el juez Ismael Moreno
  dek: >-
    Según elDiario.es (20 de julio de 2026), Jésica Rodríguez García —expareja del
    exministro José Luis Ábalos— se acogió ese día a su derecho a no declarar ante el
    juez Ismael Moreno, que instruye el caso Koldo en la Audiencia Nacional. Según el
    mismo medio, también estaban citados como investigados por esos contratos de
    Rodríguez Joseba García —hermano de Koldo García— e Ignacio Zaldívar de la Rica
    —exdirector de Gestión Administrativa de Adif—, y ambos se acogieron igualmente a su
    derecho a no declarar, aunque Joseba García quiso aclarar que no conocía a Rodríguez
    antes de que fuera contratada en Ineco. Según Infobae (3 de julio de 2026), el juez
    los citó por un presunto delito de malversación y tráfico de influencias por la
    contratación de Rodríguez en Ineco y Tragsatec. Según Telemadrid (3 de julio de
    2026), la Fiscalía indica, con base en la sentencia del Tribunal Supremo del 22 de
    junio de 2026 que condenó a Ábalos y a Koldo García, que Rodríguez recibió 34.450
    euros de Ineco y 9.500,54 de Tragsatec. Según elDiario.es, ella misma reconoció ante
    el Supremo, donde declaró como testigo, que estuvo contratada sin realizar tarea
    alguna. Es una instrucción en curso; rige la presunción de inocencia.
