  headline: >-
    Koldo García presenta un incidente de nulidad ante el Supremo y pide suspender su
    condena
  dek: >-
    Según The Objective (24 de junio de 2026), Koldo García fue condenado a 19 años y
    ocho meses de cárcel en la sentencia del Tribunal Supremo del caso mascarillas. Ese
    día presentó ante el alto tribunal un incidente de nulidad, paso previo a acudir al
    Tribunal Constitucional. En él alega la vulneración de derechos fundamentales como
    la presunción de inocencia. También alega una duplicidad entre el juicio de las
    mascarillas y las causas que todavía se investigan en la Audiencia Nacional.
    Sostiene además que no ha podido ejercer plenamente el derecho de defensa al no
    poder acceder a los dispositivos incautados. Pide también que se suspenda la
    ejecución de la sentencia condenatoria mientras el Supremo estudia el incidente.
    Según Europa Press (vía Infobae, 1 de septiembre de 2026), los abogados de José Luis
    Ábalos plantearon también un incidente de nulidad. El fiscal jefe Anticorrupción,
    Alejandro Luzón, ha pedido desestimar los dos por limitarse a «reproducir
    pretensiones ya examinadas y decididas en la sentencia firme cuya nulidad se
    solicita».
