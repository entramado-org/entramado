- iso: '2026-11-18'
  date: 18 nov 2026
  headline: >-
    El juez Moreno rechaza anular el registro de la casa de Ábalos en Valencia
  dek: >-
    Según EFE (vía Infobae), Europa Press y Libertad Digital (18 de noviembre de 2026), el juez de la
    Audiencia Nacional Ismael Moreno ha rechazado admitir a trámite el incidente de nulidad que José Luis Ábalos presentó contra el registro practicado el 5 de noviembre en su vivienda de Valencia. Según la
    resolución, «no hay ninguna diligencia que se haya realizado que afecte a los derechos
    fundamentales» del exministro. Ábalos alegaba, según EFE, que no se le notificó la apertura de la pieza separada, que no presenció el registro y que los agentes entraron sin autorización
    judicial en un local de la planta baja; también pretendía anular la incautación de once
    dispositivos electrónicos. El juez responde que el registro se practicó en presencia de su pareja y que el auto del 4 de noviembre autorizaba la entrada en el
    domicilio y en sus anexos, entre ellos locales, trasteros y garajes. Según EFE, contra la
    resolución no cabe recurso. Son diligencias de instrucción en curso. Rige la presunción de
    inocencia.
  outlet: EFE (vía Infobae)
  url: https://www.infobae.com/espana/agencias/2026/11/18/el-juez-rechaza-anular-el-registro-de-la-casa-de-abalos/
  case_tag: Obra pública
