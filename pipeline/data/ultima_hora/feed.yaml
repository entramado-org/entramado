  headline: >-
    Begoña Gómez sustituye a Antonio Camacho por Jaime Campaner y Peinado le concede
    plazo efectivo hasta septiembre para presentar su defensa
  dek: >-
    Según Libertad Digital (30 de julio de 2026), Begoña Gómez sustituyó al exministro
    Antonio Camacho por el penalista mallorquín Jaime Campaner. El medio informó de que
    Campaner pidió diez días para conocer la causa y presentar el escrito de defensa, y
    de que Peinado le concedió siete, frente a los cinco ordinarios. Según la
    providencia reproducida por Libertad Digital, el plazo se contaba desde el traslado
    inicial y agosto era inhábil a efectos procesales, por lo que la presentación podía
    realizarse en septiembre. La acusación popular unificada había solicitado 13 años de
    prisión para Gómez, según Libertad Digital (27 de julio de 2026). Rige la presunción
    de inocencia.
