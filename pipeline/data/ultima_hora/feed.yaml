  dek: >-
    Según Europa Press (10 de noviembre de 2026), con detalles recogidos también por ABC, el
    juez de la Audiencia Nacional Santiago Pedraz ha citado de nuevo a declarar como investigado
    el 24 de noviembre, mediante providencia, al exviceministro venezolano Nervis Villalobos,
    por una presunta falsedad para obtener la nacionalidad española por la llamada ley de
    nietos. El 30 de octubre Villalobos no respondió y se mostró dispuesto a hacerlo cuando el
    Registro Civil Central entregara la documentación del expediente: alegó que esa
    documentación «fue presentada de forma presencial y en soporte papel ante el Registro Civil
    Central» y que debía aportarla esa administración; en la primera semana de noviembre el
    Registro Civil Central la remitió escaneada, dejó a disposición del juzgado el expediente
    registral original e indicó que no hay documentos originales unidos al expediente: el
    pasaporte original de la abuela «no se encuentra unido al expediente, ni se presentó nunca»
    ante esa oficina, y solo consta una copia en un acta notarial que hace constar que el
    original se exhibió al notario y fue devuelto; en la fotocopia sellada del certificado de
    nacimiento de la abuela no se aprecia la firma de la letrada de la Administración de
    Justicia encargada ni de un funcionario delegado. Según Europa Press, cargos del Ministerio
    de Justicia citados como testigos negaron haber visto irregularidades, y fuentes del entorno
    de Villalobos mantienen que fue un trámite que cumplió la ley. Son diligencias de
    instrucción en curso. Rige la presunción de inocencia.
