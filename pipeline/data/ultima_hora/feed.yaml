  dek: >-
    Según EFE (vía Libertad Digital, 03-07-2026), el juez José Luis Calama acordó en un
    auto de ese día que la UDEF evitase incluir en los anexos de sus informes
    información innecesaria o irrelevante y datos personales ajenos a los hechos
    investigados. La resolución responde a una petición de la defensa de José Luis
    Rodríguez Zapatero del 26 de junio, tras la difusión de agendas y conversaciones de
    WhatsApp incluidas en los anexos de un informe policial del 22 de junio. Según esa
