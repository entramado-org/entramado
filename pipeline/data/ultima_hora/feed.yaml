  headline: >-
    El Supremo inadmite el incidente de nulidad de Pardo de Vera contra la sentencia del
    caso mascarillas por no haber sido parte en la causa
  dek: >-
    Según EFE (vía Infobae, 23 de julio de 2026), la Sala del Tribunal Supremo que
    condenó a José Luis Ábalos rechazó, en una providencia, admitir a trámite el
    incidente de nulidad planteado por la expresidenta de Adif Isabel Pardo de Vera
    —investigada en la Audiencia Nacional y que declaró como testigo en el juicio a
    Ábalos, Koldo García y Aldama—, que alegaba que la sentencia vulneraba su derecho a
    la presunción de inocencia al contener afirmaciones sobre ella que, a su juicio,
    «prejuzgan su intervención». El Supremo responde que «no ha lugar a la admisión a
    trámite del incidente planteado» porque no ha sido parte en esta causa, y que las
    afirmaciones de la sentencia se limitan a valorar su declaración como testigo, junto
    a otras pruebas, «en relación exclusivamente con los hechos enjuiciados en el
    presente procedimiento, con todas las garantías». En la misma providencia la Sala
    rechaza también otras peticiones, entre ellas la del empresario Manuel Contreras,
    dueño de AZVI, que había vuelto a pedir licencia para querellarse contra Víctor de
    Aldama por considerar que mintió al atribuirle el pago de una comisión. La causa que
    afecta a Pardo de Vera sigue en instrucción. Rige la presunción de inocencia.
