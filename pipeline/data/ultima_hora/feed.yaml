    su mujer, sus hijas, su secretaria Gertrudis Alcázar y sociedades investigadas en el
    caso Plus Ultra. El medio, que afirma haber accedido al auto, recoge que el juez,
    apoyándose en un informe policial, describe indicios de «una estructura
    jerarquizada» con Zapatero «como beneficiario principal» y Julio Martínez Martínez
