    La jueza Biedma pide personarse como perjudicada en el caso Leire por las supuestas
    maniobras para apartarla de la causa de David Sánchez
  dek: >-
    Según El Español (16 de septiembre de 2026), la magistrada Beatriz Biedma, que envió a
    juicio a David Sánchez, ha pedido al juez Santiago Pedraz personarse como perjudicada
    en el caso Leire. Su escrito sostiene que fue objeto, «según los indicios actualmente
    existentes», de actuaciones para obtener información sobre ella, desacreditarla y
    apartarla de procedimientos concretos, e invoca una anotación de las agendas de Leire
    Díez fechada el 25 de marzo de 2025 para pedir que se investiguen supuestos contactos
    con personas de un clan de Badajoz. Pedraz dio traslado a la Fiscalía para que se
    pronunciara. Son alegaciones de una parte. Rige la presunción de inocencia.
