    la entregada por el PSOE para determinar el origen de los ingresos del exdirigente
    socialista
  dek: >-
    Según EFE (15 de octubre de 2026), el juez de la Audiencia Nacional Ismael Moreno, que
    investiga la pieza del caso Koldo sobre presuntas mordidas en adjudicaciones de obra
    pública, ha dictado una providencia en la que solicita al juez Santiago Pedraz,
    instructor del caso Leire, copia de las evidencias digitales y la documentación
    intervenida en el domicilio de Santos Cerdán en Milagro (Navarra) y de la entregada por
