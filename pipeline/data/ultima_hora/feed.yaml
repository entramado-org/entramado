  headline: >-
    Según El Independiente (15-07-2026), los fiscales que se reunieron con Leire Díez
    declararon que García Ortiz les citó después y les dijo que lo olvidaran
  dek: >-
    Según fuentes jurídicas citadas por El Independiente (15-07-2026), Diego Villafañe
    —entonces teniente fiscal de la Secretaría Técnica de la Fiscalía General— y Beatriz
    López Pesquera declararon como testigos ante el juez Santiago Pedraz que el entonces
    fiscal general Álvaro García Ortiz les citó en su despacho tras uno de sus
    encuentros con Leire Díez y Jacobo Teijelo para conocer el contenido de la
    conversación, y les dijo que «no se preocuparan» y que «lo olvidaran». El periódico
    sitúa las reuniones con Díez y Teijelo el 6 de marzo de 2025 y a finales de marzo o
    principios de abril de ese año, sin fecha precisa para la segunda. Villafañe restó
    relevancia a las reuniones, que enmarcó en los encuentros habituales del cargo, y
    ambos reafirmaron que no constan registros de visitas en la sede de Fortuny; la
    propia Fiscalía General ya había reconocido ambos encuentros en respuesta a un
    requerimiento del instructor, según el mismo medio. Declararon como testigos, no
    como investigados; rige la presunción de inocencia.
  outlet: El Independiente
  url: https://www.elindependiente.com/espana/2026/07/15/los-fiscales-que-se-citaron-con-leire-admiten-que-garcia-ortiz-les-reunio-despues-en-su-despacho-y-les-dijo-que-lo-olvidasen/
