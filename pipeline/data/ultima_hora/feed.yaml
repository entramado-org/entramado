  headline: >-
    Pedraz descarta por ahora imputar al PSOE como persona jurídica en el caso Leire y
    espera a practicar más diligencias, entre ellas la declaración de Santos Cerdán
  dek: >-
    Según Europa Press (9 de octubre de 2026), el juez de la Audiencia Nacional Santiago
    Pedraz ha descartado por el momento, en un auto, atribuir la condición de investigado al
    PSOE como persona jurídica, como pedía la acusación popular unificada que lidera el PP.
    Argumenta que, aunque los hechos «pudieran presentar en abstracto apariencia delictiva
    por parte del PSOE», no se incorpora aún «un elemento o principio de prueba que avale
    razonablemente su realidad». Sigue así el criterio de la Fiscalía Anticorrupción, que
    consideró prematura la imputación y subrayó la necesidad de completar antes diligencias
    como la declaración de Santos Cerdán; el juez añade que hay que analizar antes la
    documentación requerida al partido. Según Libertad Digital, el auto dice: «Una vez
    practicadas diligencias oportunas se acordará lo oportuno a tal efecto». Rige la
    presunción de inocencia.
  outlet: Europa Press (vía Infobae)
  url: https://www.infobae.com/espana/agencias/2026/10/09/el-juez-descarta-imputar-por-ahora-al-psoe-en-el-caso-leire-diez-y-esperara-a-mas-diligencias-tras-pedirlo-el-pp/
