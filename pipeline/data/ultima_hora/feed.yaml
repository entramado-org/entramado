  headline: >-
    Vozpópuli publica mensajes de Zapatero y su secretaria sobre la rueda de prensa de
    Leire Díez
  dek: >-
    Según Vozpópuli (24-06-2026), los anexos de un informe de la UDEF incorporan
    mensajes entre José Luis Rodríguez Zapatero y su secretaria Gertrudis Alcázar,
    extraídos del teléfono de esta durante la investigación del caso Plus Ultra. Tras la
    rueda de prensa de Leire Díez del 4 de junio de 2025, en la que irrumpió Víctor de
    Aldama, Zapatero escribió «Me ha gustado Leire». Tres horas después, Alcázar
    respondió: «Bien la comparecencia, pero esto no hay quien lo entienda. Y la
    aparición del otro. Enmierda, enmierda que no se sepa la verdad y con el numerito
    del tipo se evita que se preste atención a la declaración de ella». El medio
    identifica a Aldama como el referente de «el otro»; el mensaje expresa la valoración
    de Alcázar sobre su intervención. Son comunicaciones recogidas en una investigación
    en curso y no acreditan por sí mismas una conducta delictiva. Rige la presunción de
    inocencia.
