  headline: >-
    Testigos de la agencia de publicidad del PSOE declaran ante la UCO que el equipo de
    comunicación del partido decidió incluir a Crónica Libre en el plan de medios de las
    europeas de 2024
  dek: >-
    Según El Español y EFE (vía Infobae, 24 de septiembre de 2026), responsables de Grupo
    IKI, la agencia contratada por el PSOE para la campaña de las europeas de 2024,
    declararon ante la UCO que la inclusión de Crónica Libre —el medio vinculado a Leire
    Díez— entre los beneficiarios de publicidad la decidió el equipo de comunicación del
    partido, entonces dirigido por Ion Antolín, y que la agencia no la habría recomendado.
    Una directiva de IKI declaró que esos servicios no estaban justificados por tratarse
    de un medio pequeño con «escaso impacto»; el importe ejecutado fue de 14.980 euros
    netos (18.125 con IVA). La misma testigo dijo no haber recibido presiones de ningún
    alto cargo del PSOE para agilizar el pago. Son testimonios recogidos en un atestado de
    una instrucción en curso. Rige la presunción de inocencia.
  quote: >-
    escaso impacto
  outlet: El Español
  url: https://www.elespanol.com/espana/tribunales/20260924/testigos-relatan-uco-exjefe-prensa-psoe-decidio-pagar-medio-nomina-leire/1003744395731_0.html
