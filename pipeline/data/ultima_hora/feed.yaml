  headline: >-
    La acusación popular reformula su escrito en el caso Begoña Gómez, pide 13 años de
    prisión y la comparecencia como testigo de Pedro Sánchez
  dek: >-
    Según Libertad Digital (27 de julio de 2026), la acusación popular unificada que
    lidera Hazte Oír reformuló su escrito de acusación en el caso Begoña Gómez después
    de que la Audiencia Provincial de Madrid eliminara los tipos delictivos de
    corrupción en los negocios y apropiación indebida. Pide 13 años de prisión para
    Begoña Gómez: dos por un delito de tráfico de influencias, tres por un delito
    continuado de malversación y ocho por un segundo delito de malversación. Para su
    asesora Cristina Álvarez pide seis años, en concepto de cooperadora necesaria de la
    malversación del software. Entre más de cien testificales, solicita que comparezcan
    como testigos el presidente del Gobierno, Pedro Sánchez; el ministro Félix Bolaños;
    el rector de la Complutense, Joaquín Goyache; y el empresario Juan Carlos Barrabés.
    Según el mismo medio, el Ministerio Fiscal no acusa en este proceso. Según EFE (vía
    Infobae, 6 de septiembre de 2026), ese auto de la Audiencia supuso «reordenar» el
    proceso y retrotraerlo hasta abril, por lo que las partes tuvieron que presentar de
    nuevo sus escritos. Según Infobae (13 de septiembre de 2026), en la audiencia
    preliminar del 8 de septiembre la Fiscalía y las defensas de Gómez y Álvarez
    solicitaron el archivo de la causa y Hazte Oír mantuvo su petición de apertura de
    juicio oral, que el juez Peinado debía decidir aún. Los hechos no están probados
    judicialmente. Rige la presunción de inocencia.
