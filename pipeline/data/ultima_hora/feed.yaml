  headline: >-
    La defensa de David Sánchez recurre su condena por prevaricación y pide la absolución al
    denunciar una «investigación prospectiva»
  dek: >-
    Según Europa Press y El Debate (8 de octubre de 2026), la defensa de David Sánchez
    Pérez-Castejón ha presentado un recurso de apelación contra la sentencia de la Audiencia
    Provincial de Badajoz que lo condena, como cooperador necesario de un delito de
    prevaricación administrativa, a nueve años de inhabilitación por su contratación en la
    Diputación de Badajoz; el escrito, dirigido al Tribunal Superior de Justicia de
    Extremadura, tiene 104 páginas. Pide su absolución por vulneración de derechos
    fundamentales, entre ellos la presunción de inocencia, la intimidad y el secreto de las
    comunicaciones, y sostiene que la causa fue una «investigación prospectiva». La
    sentencia no es firme. Son alegaciones de una parte. Rige la presunción de inocencia.
