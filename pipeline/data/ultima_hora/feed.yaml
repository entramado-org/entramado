  headline: >-
    HazteOír recurre ante el TSJ de Extremadura la sentencia del caso David Sánchez, pide
    seis años de prisión por tráfico de influencias en concurso con prevaricación y
    denuncia de nuevo a Gallardo por la plaza de Luis Carrero
  dek: >-
    Según EFE (vía Infobae, 17 de septiembre de 2026), la acusación popular HazteOír ha
    recurrido en apelación ante el Tribunal Superior de Justicia de Extremadura la
    sentencia de la Audiencia Provincial de Badajoz, que condenó por prevaricación y
    absolvió del tráfico de influencias. Sin discutir los hechos probados, sostiene que la
    absolución «no descansa en una valoración de la prueba, sino en un concepto de
    influencia que la ley no contiene», y pide una condena conjunta por tráfico de
    influencias en concurso con prevaricación de seis años de prisión para David Sánchez y
    cuatro para Miguel Ángel Gallardo. Según Europa Press (vía Infobae), reclama también
    la devolución de los salarios percibidos por David Sánchez y Luis Carrero. La
    asociación ha presentado además una denuncia por presunta prevaricación contra
    Gallardo por la creación de la plaza que ocupó Carrero, hecho por el que no fue
    juzgado y sobre el que la Audiencia reservó expresamente la posibilidad de ejercer
    acciones. La sentencia no es firme. Rige la presunción de inocencia.
  quote: >-
    no descansa en una valoración de la prueba, sino en un concepto de influencia que la
    ley no contiene
  outlet: EFE (vía Infobae)
