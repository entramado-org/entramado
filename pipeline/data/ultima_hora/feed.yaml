  headline: >-
    La Audiencia Nacional investiga cientos de mensajes de Threema entre Aldama y Delcy Rodríguez
    sobre operaciones de petróleo venezolano en la pieza secreta de la financiación del PSOE, según
    El Mundo
  dek: >-
    Según El Mundo (26 de septiembre de 2026), el Juzgado de Instrucción nº 2 de la Audiencia
    Nacional, que dirige Ismael Moreno, ha encomendado a la UCO rastrear cientos de mensajes
    intercambiados durante años por la aplicación de mensajería Threema entre Víctor de Aldama y Delcy
    Rodríguez, entonces vicepresidenta de Venezuela y hoy presidenta encargada, dentro de la pieza
    secreta sobre la supuesta financiación irregular del PSOE. Los mensajes forman parte de la
    documentación entregada por Aldama en los últimos meses y recogen negociaciones de compraventa de
    crudo de PDVSA en las que Aldama actuaba en representación de la suiza Pegaso Energy, aliada con
    la rusa Kvarta Ltd, con pagos en cuentas rusas que, según el diario, permitían eludir las
    sanciones internacionales; en un mensaje de junio de 2021 anuncia «una propuesta de Pegaso con la
    carta de los rusos». Aldama sostiene, en dos declaraciones que se mantienen en secreto, que
    entregó dinero en metálico a José Luis Ábalos y Koldo García procedente de esos negocios, al menos
    300.000 euros el 3 de enero de 2020. Son afirmaciones de un colaborador con la Justicia en una
    pieza bajo secreto, no hechos probados; rige la presunción de inocencia.
  outlet: El Mundo
  url: https://www.elmundo.es/espana/2026/09/26/6ab7edb721efa0f1548b45a9.html
