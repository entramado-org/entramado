  headline: >-
    Ábalos admite desde la cárcel por primera vez haberse reunido y discutido «acaloradamente» con
    Leire Díez
  dek: >-
    En una entrevista mediante cuestionario publicada por El País desde la prisión de Soto del Real
    —su primera intervención pública desde la sentencia del Tribunal Supremo del 22 de junio que le
    condena a 24 años; recogida también por El Español, de cuya pieza proceden las citas
    entrecomilladas—, el exministro José Luis Ábalos reconoce por primera vez haber tenido encuentros
    y una discusión acalorada con la investigada Leire Díez, contradiciendo su versión anterior (en
    mayo de 2025 había declarado en televisión que no la veía desde febrero de 2024). Sin concretar
    el número ni el contenido de los encuentros, afirma: «El asunto ha acabado peor de lo que intuía».
