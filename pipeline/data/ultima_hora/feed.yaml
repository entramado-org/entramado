  headline: >-
    Libertad Digital publica un chat de agosto de 2024 entre Leire Díez, Javier Pérez
    Dolset y el exjuez Sáenz de Tejada sobre una estrategia contra altas instituciones
  dek: >-
    Según Libertad Digital (23 de septiembre de 2026), que afirma haber tenido acceso al
    grupo de WhatsApp, Leire Díez, el empresario Javier Pérez Dolset y el exjuez Luis José
    Sáenz de Tejada formaban parte de un chat creado en agosto de 2024. El medio reproduce
    un mensaje atribuido a Sáenz de Tejada que habla de una estrategia y un «relato» y de
    «atacar a gente metida en las más altas instituciones (Consejo, Supremo,
    Constitucional, Fiscalía)», y otro atribuido a Pérez Dolset sobre la «munición»
    disponible. La causa la instruye el juez de la Audiencia Nacional Santiago Pedraz. Son
    mensajes publicados por un medio. Rige la presunción de inocencia.
