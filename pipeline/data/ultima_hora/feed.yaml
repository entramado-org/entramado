  headline: >-
    Cristina Álvarez y Begoña Gómez presentan sus escritos de defensa en la causa del
    juez Peinado y piden la absolución; la asesora sostiene que en lo relativo al
    software y al dominio «actuó siempre siguiendo instrucciones de Begoña Gómez»
  dek: >-
    Según Libertad Digital (3 de septiembre de 2026), la defensa de Cristina Álvarez,
    asesora de Begoña Gómez en Moncloa, ha presentado su escrito de defensa en la causa
    que instruye el juez Juan Carlos Peinado. Según ese medio, el escrito sostiene que
    el papel de Álvarez en las gestiones de Gómez no fue esencial, que se la acusa «por
    unos hechos que, aunque fuesen ciertos, nunca podrían ser constitutivos de delito» y
    que, «en todo lo relacionado con el software y con el dominio, Cristina Álvarez
    actuó siempre siguiendo instrucciones de Begoña Gómez y en el convencimiento de no
    estar realizando nada que sea ilegal o estuviera prohibido». Pide su absolución y
    que se impongan las costas a la acusación popular, cuya acusación califica de «una
    temeridad». Según EFE (vía Infobae, 6 de septiembre de 2026), el abogado de Begoña
    Gómez, Jaime Campaner, presentó el viernes 4 de septiembre su escrito de
    conclusiones provisionales. En él Gómez solicita la absolución y niega que
    aprovechase «su vínculo matrimonial» con el presidente del Gobierno para conseguir
    una cátedra universitaria, que obtuviera beneficio económico en ella y que se
    apropiara de un software de la Universidad Complutense de Madrid. Según la misma
    agencia, la Fiscalía pedirá la absolución de ambas y la acusación popular, liderada
    por Hazte Oír, pide 13 años de cárcel para Gómez y 6 para su asesora. Son
    alegaciones de las partes; ningún hecho está judicialmente probado. Rige la
    presunción de inocencia.
  quote: >-
    actuó siempre siguiendo instrucciones de Begoña Gómez y en el
    convencimiento de no estar realizando nada que sea ilegal
  outlet: Libertad Digital
