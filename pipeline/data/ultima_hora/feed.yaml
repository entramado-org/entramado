    rechazó («no ha lugar») en una providencia las medidas cautelares que pedían las
    acusaciones populares para la directora general de la Guardia Civil, Mercedes
    González Fernández, y el director adjunto operativo (DAO) Manuel Llamas, ambos ya
    investigados. Con esas medidas se pretendía evitar que, mientras sigan imputados,
    puedan dar órdenes desde sus cargos a los mandos y miembros de la UCO. El magistrado
    razona que la UCO, como policía judicial, «solo habrá de dar cuenta a este
    instructor» y que, si «se considera inquietada en sus funciones», habría de ponerlo
    en conocimiento del juzgado. En la misma providencia, Pedraz descartó por el momento
    tomar declaración a Leire Díez hasta recibir la causa de la Sección de Instrucción
    del Tribunal de Instancia de Madrid, plaza número 9. Son diligencias de instrucción
    en curso; los hechos no están probados judicialmente. Rige la presunción de
    inocencia.
