    La Diputación de Badajoz pide al Tribunal de Cuentas archivar las diligencias y no
    reclamará por ahora los 427.000 euros cobrados por David Sánchez y Luis Carrero
  dek: >-
    Según The Objective (16 de septiembre de 2026), la Diputación de Badajoz ha comunicado
    que pidió al Tribunal de Cuentas el archivo de la diligencia abierta tras varias
    denuncias sobre presuntas responsabilidades por alcance derivadas de la sentencia, y
    que no reclamará el reintegro de los unos 427.000 euros cobrados por David Sánchez y
    su colaborador Luis Carrero. La institución alega que la sentencia aún no le ha sido
    formalmente notificada y es recurrible ante el TSJ de Extremadura, por lo que «en el
    actual estado procesal» no procede actuación alguna sobre el reintegro. La sentencia
    no es firme. Rige la presunción de inocencia.
