  headline: >-
    La Audiencia Provincial de Badajoz impone a David Sánchez una condena no firme de
    nueve años de inhabilitación por prevaricación
  dek: >-
    Según EFE (vía Infobae, 14 de julio de 2026), la Sección Primera de la Audiencia
    Provincial de Badajoz impuso a David Sánchez Pérez-Castejón nueve años de
    inhabilitación para empleo o cargo público como autor por cooperación necesaria de
    un delito de prevaricación administrativa relacionado con la transformación de su
    plaza de coordinador de conservatorios en la jefatura de la Oficina de Artes
    Escénicas. Según The Objective (14 de julio de 2026), fue absuelto de tráfico de
    influencias y no se le impuso pena de prisión; Miguel Ángel Gallardo recibió dos
    penas de nueve años de inhabilitación por dos delitos de prevaricación
    administrativa. La sentencia no es firme y cabe recurso de apelación ante el TSJ de
    Extremadura. Rige la presunción de inocencia.
