  headline: >-
    El exjefe de gabinete de Sánchez y expresidente de Correos pide a Pedraz que declare
    nulo el clonado de su móvil
  dek: >-
    Según EFE (vía Infobae, 31 de julio de 2026), la defensa de Juan Manuel Serrano
    pidió al juez Santiago Pedraz que declare nulos la incautación y el clonado de su
    teléfono móvil, y que se le devuelva el terminal sin que se pueda volver a clonar.
    Serrano es expresidente de Correos, fue jefe de gabinete de Pedro Sánchez en el PSOE
    entre 2014 y 2018 y está investigado en el caso Leire (Audiencia Nacional). Según
    EFE, la defensa cuestionaba que la UCO de la Guardia Civil incautase el teléfono el
    27 de mayo «no existiendo autorización judicial» y cuando todavía no estaba
    investigado, y que lo clonase semanas después, ya imputado. Según El Español (19 de
    agosto), el primer clonado se hizo el 14 y 15 de julio sin que Serrano estuviera
    presente, aunque el juez había ordenado que pudiera asistir. La defensa reclamó de
    forma subsidiaria un nuevo volcado en presencia del investigado. Son alegaciones de
    la defensa en una instrucción en curso; ninguno de los hechos está probado
    judicialmente. Rige la presunción de inocencia.
  quote: >-
    una restricción del secreto de las comunicaciones no amparada por
    autorización judicial válida
