  headline: >-
    Dos exjefes de la UCO admitieron ante agentes de la unidad presiones de la cúpula de
    la Guardia Civil para «ponerse de perfil», según The Objective
  dek: >-
    Según The Objective (23 de junio de 2026), un informe de la UCO recoge que los
    generales Rafael Yuste y Alfonso López Malo, exjefes de la Unidad Central Operativa
    (UCO) de la Guardia Civil, revelaron ante agentes de la propia unidad que habrían
    recibido presiones por orden del director adjunto operativo (DAO) del cuerpo, Manuel
    Llamas, para «ponerse de perfil» en investigaciones que afectaban al Gobierno, entre
    ellas la relativa a David Sánchez. Según fuentes jurídicas citadas por Europa Press
    y recogidas por el mismo medio, el secretario del DAO declaró ante el juez Santiago
    Pedraz que ambos mandos habían negado en un primer momento esas presiones y las
    admitieron después, al ser interrogados por agentes de la UCO. Yuste y López Malo
    estaban citados a declarar en la causa el viernes 26 de junio. Son indicios en una
    instrucción en curso, no hechos probados; rige la presunción de inocencia.
