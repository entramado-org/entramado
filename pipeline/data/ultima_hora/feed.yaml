  headline: >-
    La UCO cifra en 323.178 euros los ingresos sin justificar de Santos
    Cerdán y su entorno familiar entre 2015 y 2024
  dek: >-
    Según Euronews (17 de julio de 2026), un nuevo informe de la UCO
    cuantifica en 323.178 euros los ingresos sin justificar que Santos
    Cerdán y su entorno familiar habrían obtenido entre 2015 y 2024. El
    informe recoge además el ingreso de 18.000 euros en efectivo de origen
    desconocido entre 2014 y 2017, y que Servinabar —la empresa navarra en
    la que Cerdán habría tenido el 45% de las participaciones— llegó a
    entregar una señal para la compra de una vivienda valorada en cerca de
    un millón de euros. Cerdán permanece investigado por presuntos delitos
    de organización criminal, tráfico de influencias y cohecho. Rige la
    presunción de inocencia.
