  headline: >-
    El juez Calama ordena en una providencia a la UDEF averiguar quién es el autor del punzón grabado
    en las joyas de más valor halladas en el despacho de Zapatero
  dek: >-
    Según Europa Press (vía Infobae), OKDiario y esdiario (3 de noviembre de 2026), el juez de la Audiencia
    Nacional José Luis Calama, instructor del caso Plus Ultra, ha dictado una providencia en la pieza
    separada de las joyas que encarga a la Unidad de Delincuencia Económica y Fiscal (UDEF) de la Policía
    Nacional investigar «quién puede ser el autor del punzón que figura en las joyas de más valor», halladas
    en el registro del despacho de José Luis Rodríguez Zapatero el 19 de mayo; la UDEF, «si lo considera
    necesario, deberá solicitar» la colaboración de Interpol y Europol. La diligencia llega tras el informe
    pericial de la joyería Yanes, que valoró las piezas en 1.023.320 euros. Zapatero sostiene que las
    joyas fueron un regalo del rey de Arabia Saudí durante una visita oficial a España en junio de 2007.
    Zapatero está investigado; son diligencias de instrucción en curso. Rige la presunción de inocencia.
  outlet: Europa Press (vía Infobae)
  url: https://www.infobae.com/espana/agencias/2026/11/03/el-juez-del-caso-plus-ultra-pide-a-la-policia-que-identifique-al-autor-del-punzon-de-las-joyas-de-zapatero/
