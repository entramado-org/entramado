  headline: >-
    Delcy Rodríguez inicia los trámites para querellarse contra Aldama por atribuirle
    «el sobre» de PDVSA, según Euronews
  dek: >-
    Según Euronews (06-07-2026), la presidenta encargada de Venezuela, Delcy Rodríguez,
    inició los trámites para querellarse por injurias contra Víctor de Aldama, que la
    había señalado como la persona que le entregó un sobre con membrete de PDVSA
    supuestamente vinculado a una financiación irregular del PSOE. Según ese medio, su
    defensa, a cargo de Ilocad, el despacho del exjuez Baltasar Garzón, presentó en los
    juzgados de Madrid una solicitud de conciliación previa a la querella. En ella
    sostiene que son falsas las afirmaciones que Aldama hizo en dos entrevistas
    televisivas los días 4 y 5 de febrero. El acto de conciliación estaba fijado para el
    16 de julio. Según Euronews, el entorno de Aldama calificó la maniobra de
    «temeraria». Es un litigio de parte en fase previa a la querella y las afirmaciones
    de Aldama son su versión, no hechos probados. Rige la presunción de inocencia.
