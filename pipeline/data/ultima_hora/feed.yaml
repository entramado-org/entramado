    Pedraz ha citado a declarar como testigos el día 15 de julio a Diego Villafañe y
    Beatriz López Pesquera, miembros de la Secretaría Técnica del exfiscal general
    Álvaro García Ortiz, sobre las dos reuniones que mantuvieron en marzo y abril de
    2025, en la sede de la Fiscalía General, con Leire Díez y el abogado Jacobo Teijelo.
    Según el diario, Díez y Teijelo están investigados por su presunta participación en
    una operación para desestabilizar investigaciones judiciales y policiales que
