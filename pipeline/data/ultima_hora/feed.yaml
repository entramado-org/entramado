  headline: >-
    El juez Moreno cita a Juan Carlos Cueto e Íñigo Rotaeche como investigados en la
    pieza de las mascarillas del caso Koldo en la Audiencia Nacional; Libertad Digital
    informa de que el instructor ultima esa causa
  dek: >-
    Según Moncloa.com (10 de septiembre de 2026) y Libertad Digital (11 de septiembre),
    el juez Ismael Moreno (Juzgado Central de Instrucción nº 2 de la Audiencia Nacional)
    recibe este viernes 11 de septiembre la declaración como investigados de Íñigo
    Rotaeche —que entró en Soluciones de Gestión y Apoyo a Empresas SL comprando
    participaciones, fue apoderado y es su administrador desde 2021, único accionista
    cuando se adjudicaron los contratos, según Moncloa.com— y de Juan Carlos Cueto, dueño
    del Grupo Cueto, al que el auto del juez atribuye, según ese medio, «control de hecho
    sobre todas las sociedades que conforman el grupo Cueto, y concretamente sobre
    Soluciones de Gestión». La empresa facturó 53 millones de euros en material sanitario
    a varias administraciones del Estado y a las comunidades de Baleares y Canarias
    durante la pandemia; esta pieza se instruye en la Audiencia Nacional para los
    investigados sin condición de aforado. Según Libertad Digital, el juez Moreno ultima
    la instrucción y la Fiscalía prepara ya el escrito de acusación. Son diligencias de
    instrucción en curso; ninguno de los hechos está probado judicialmente. Rige la
    presunción de inocencia.
