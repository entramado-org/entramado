  headline: >-
    El PSOE deja pasar el plazo de 48 horas que le dio Pedraz para entregar la relación de
    abogados y consultoras contratados entre 2021 y 2025 y pide más tiempo, al invocar el
    secreto profesional
  dek: >-
    Según Infobae y The Objective (22 de octubre de 2026), el PSOE no aportó dentro del
    plazo de 48 horas que le dio el juez de la Audiencia Nacional Santiago Pedraz la
    relación de letrados, despachos y consultoras contratados entre 2021 y 2025 por sus
    órganos centrales y territoriales, y remitió en su lugar un escrito, presentado por el
    coordinador de su asesoría jurídica, en el que pide más tiempo. El partido alega el
    secreto profesional y la confidencialidad entre abogados y clientes (ha pedido amparo al
    Consejo General de la Abogacía Española) y que, en periodo electoral, su capacidad de
    respuesta está «mermada»; propone entregar primero información económica agregada y
    anonimizada. Pedraz había acordado el requerimiento el 6 de octubre, según Infobae, y lo
    reiteró el 20 de octubre con un plazo de dos días, al no haber recibido contestación,
    según Europa Press. Son diligencias de instrucción en curso. Rige la presunción de
    inocencia.
