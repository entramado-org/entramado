- iso: '2026-11-18'
  date: 18 nov 2026
  headline: >-
    El Tribunal de Cuentas rechaza archivar las diligencias sobre los sueldos de David Sánchez en la
    Diputación de Badajoz
  dek: >-
    Según Europa Press (vía Infobae), elDiario.es y The Objective (18 de noviembre de 2026), el Tribunal de Cuentas ha rechazado el archivo que pedía la Diputación de Badajoz y ha elevado las
    actuaciones a su Sección de Enjuiciamiento para que se nombre un delegado instructor que
    investigue la posible responsabilidad contable por las retribuciones de David Sánchez y de Luis
    María Carrero. El auto sostiene que las denuncias «se refieren a presuntos pagos carentes de
    justificación cuya sola posibilidad hace necesaria la apertura de una investigación para el
    esclarecimiento de los hechos» y precisa que el paso no supone prejuzgar si existe o
    no responsabilidad contable. La Diputación alegaba que las retribuciones respondieron a servicios
    efectivamente prestados y que no es firme la sentencia de la Audiencia Provincial de Badajoz que
    condenó a David Sánchez a nueve años de inhabilitación por prevaricación administrativa; la
    Fiscalía apoyó el nombramiento de un instructor. Las cifras de los denunciantes difieren: Vox habla de 280.845 euros percibidos por Sánchez entre 2017 y 2024 y el PP hace una estimación provisional de 416.798 euros. Es un procedimiento contable, distinto del penal. Rige la
    presunción de inocencia.
  outlet: Europa Press (vía Infobae)
  url: https://www.infobae.com/espana/agencias/2026/11/18/el-tribunal-de-cuentas-se-abre-a-investigar-el-sueldo-del-hermano-de-pedro-sanchez-en-la-diputacion-de-badajoz/
