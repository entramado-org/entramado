    vivienda por 132.055 euros sin financiación hipotecaria mediante pagos periódicos
    entre 2021 y 2023; también recoge expresamente que no se habían detectado ingresos
    de las sociedades investigadas hacia ella y que el análisis patrimonial se
    justificaba por el papel funcional que le atribuían los investigadores. Estas
    apreciaciones pertenecen a una instrucción en curso y no constituyen una declaración
    de culpabilidad. Rige la presunción de inocencia.
