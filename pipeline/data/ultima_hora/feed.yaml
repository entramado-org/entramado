  headline: >-
    La gerente del PSOE Ana María Fuentes declara ante Pedraz que autorizó los pagos a
    los abogados Teijelo y Oliver después de que Cerdán validara sus servicios; Oliver
    declara que fue Leire Díez quien le contrató en nombre del partido
  dek: >-
    Según EFE (vía Infobae, 9 de septiembre de 2026) y Moncloa.com, Ana María Fuentes
    Pacheco, gerente federal del PSOE y único cargo orgánico del partido imputado en el
    caso Leire (Audiencia Nacional, DP 150/2025), declaró el 9 de septiembre como
    investigada ante el juez Santiago Pedraz. Según fuentes jurídicas citadas por EFE,
    descargó en el exsecretario de Organización Santos Cerdán la responsabilidad de la
    contratación de los dos abogados investigados —Jacobo Teijelo e Ismael Oliver— y
    explicó que autorizó el pago de sus facturas después de que Cerdán validase la
    prestación de sus servicios; dijo no conocer a Leire Díez. Está investigada por un
    presunto delito de falsedad en documento mercantil por haber emitido las notas de
    encargo que justificaban esos pagos, que el juez considera «mendaces» al sospechar
    que eran una fórmula para retribuir a Leire Díez y a terceros. A continuación
    declaró Ismael Oliver, abogado penalista y exdefensor de Koldo García, que señaló que
    fue Leire Díez quien le contrató en nombre del PSOE en concepto de asesoría jurídica
    sobre la comisión parlamentaria de la «operación Cataluña». Según el informe de la
    UCO recogido por Moncloa.com, Cerdán «habría puesto a disposición de la estructura
    criminal la propia estructura del partido». Son diligencias de instrucción en curso;
    ninguno de los hechos está probado judicialmente. Rige la presunción de inocencia.
  quote: >-
    mendaces
  outlet: EFE (vía Infobae)
  url: https://www.infobae.com/espana/agencias/2026/09/09/la-gerente-del-psoe-declara-que-seguia-ordenes-de-cerdan-al-autorizar-pagos-del-caso-leire/
