  headline: >-
    Yuste y López Malo matizan ante Pedraz que el DAO no concretó ningún partido y
    desmienten que la directora de la Guardia Civil les hablara de Leire Díez
  dek: >-
    Según elDiario.es (26 de junio de 2026), Rafael Yuste, jefe de la UCO en el momento
    de los hechos, y Alfonso López Malo, responsable de la especialidad de Policía
    Judicial, introdujeron como testigos ante el juez Santiago Pedraz dos precisiones
    sobre su relato de presiones. Preguntados por la fiscal, aclararon que cuando el
    director adjunto operativo Manuel Llamas les pidió en julio de 2024 que no fueran
    proactivos en investigaciones a políticos no precisó ningún político ni partido.
    También declararon que Mercedes González no mencionó a Leire Díez ni encuentros con
    ella durante la reunión del 29 de mayo de 2025, contradiciendo lo que la directora
    de la Guardia Civil había manifestado en el Senado. Son testimonios en una
    instrucción en curso, no hechos probados; rige la presunción de inocencia.
