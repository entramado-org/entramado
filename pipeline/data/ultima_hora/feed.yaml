  headline: >-
    El PSOE pide a Pedraz que solo la Fiscalía acceda a la pieza separada con sus seis
    cuentas en el caso Leire y que se expurguen los datos ajenos a la investigación
  dek: >-
    Según EFE (vía Infobae, 1 de septiembre de 2026), el PSOE presentó ante el juez
    Santiago Pedraz (Audiencia Nacional, DP 150/2025) un escrito, adelantado por
    elDiario.es, en el que pide que solo la Fiscalía tenga acceso a la pieza separada en
    la que se analizan seis cuentas del partido y que se expurguen los datos no
    relacionados con la causa, al entender que las cuentas «contienen multitud de
    movimientos, que afectan a numerosas personas y entidades no vinculadas con los
    hechos». El escrito se envió después de que el juez ordenara rastrear hasta 81
    cuentas, varias de ellas vinculadas al PSOE, a Gaspar Zarrías y a los abogados
    Jacobo Teijelo e Ismael Oliver, ante la sospecha de los investigadores de que Santos
    Cerdán habría empleado los recursos del partido para costear una supuesta
    organización creada para boicotear causas judiciales y de que con fondos del partido
    se habría abonado a Leire Díez al menos 43.225 euros a través de intermediarios. El
    PSOE recuerda que ya identificó ante la UCO las cuentas desde las que se realizaron
    pagos a los investigados, apunta que posteriormente podrían «haber sido utilizadas
    de manera ilegítima» «al margen de la organización» y afirma que «no tiene nada que
    ocultar». Son diligencias de instrucción en curso; ninguno de los hechos está
    probado judicialmente. Rige la presunción de inocencia.
  quote: Extremar las cautelas para que no se produzca ninguna filtración a la opinión pública de aquellos datos no vinculados a la presente investigación
  outlet: EFE (vía Infobae)
  url: https://www.infobae.com/espana/agencias/2026/09/01/el-psoe-pide-al-juez-del-caso-leire-que-solo-la-fiscalia-acceda-al-analisis-de-sus-cuentas/
