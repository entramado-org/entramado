  headline: >-
    Anticorrupción pide al Supremo desestimar los incidentes de nulidad de Ábalos y
    Koldo contra la sentencia del caso mascarillas: «están abocados al fracaso»; el PP y
    Aldama también se oponen
  dek: >-
    Según Europa Press (vía Infobae, 1 de septiembre de 2026), el fiscal jefe
    Anticorrupción, Alejandro Luzón, presentó ante el Tribunal Supremo un escrito en el
    que pide desestimar los incidentes de nulidad promovidos por las defensas del
    exministro José Luis Ábalos y de su exasesor Koldo García contra la sentencia del
    caso mascarillas de junio de 2026, que los condenó a 24 y 19 años de cárcel,
    respectivamente. Luzón sostiene que los incidentes «necesariamente están abocados al
    fracaso y deben ser desestimados, pues desbordan claramente el objeto de este
    remedio», que se limitan «a reproducir pretensiones ya examinadas y decididas en la
    sentencia firme cuya nulidad se solicita» y que se aprovechan para propugnar «una
    alternativa e improcedente revisión de la valoración de la prueba». Según la misma
    agencia, la acusación popular que encabezó el PP presentó otro escrito en el que
    sostiene que «ninguno de los motivos de nulidad formulados por los condenados puede
    prosperar», y la defensa de Víctor de Aldama, condenado a cuatro años y medio de
    cárcel pero sin ingreso en prisión, también se opone porque considera que su
    «verdadera finalidad» es revisar la valoración de la prueba. Ábalos había pedido la
    nulidad de la sentencia, la suspensión de la condena y su puesta en libertad; según
    Europa Press, él y Koldo llevan en prisión provisional desde noviembre de 2025.
    Según elDiario.es (23 de junio de 2026), las defensas de ambos preparan recursos de
    amparo ante el Tribunal Constitucional. La sentencia es firme; el 1 de septiembre de
    2026 los incidentes seguían pendientes de resolución por la Sala.
  quote: >-
    Necesariamente están abocados al fracaso y deben ser desestimados, pues
    desbordan claramente el objeto de este remedio
  outlet: Europa Press (vía Infobae)
  url: https://www.infobae.com/espana/agencias/2026/09/01/anticorrupcion-pide-al-ts-rechazar-la-peticion-de-abalos-y-koldo-para-anular-la-sentencia-del-caso-mascarillas/
