  date: 29 sep 2026
  headline: >-
    La Fiscalía rechaza que las gestiones de Zapatero en Bolivia queden fuera del caso Plus Ultra y
    pide mantener en la causa el informe de la UDEF sobre los 200.000 euros de Focus Social Research
  dek: >-
    Según El Independiente (29 de septiembre de 2026), que ha tenido acceso al escrito, la fiscal
    Elena Lorente pide al juez José Luis Calama (Audiencia Nacional) que mantenga en la causa el
    informe de la UDEF sobre los 200.000 euros que Rodríguez Zapatero recibió de la empresa peruana
    Focus Social Research. La defensa del expresidente, a cargo de Víctor Moreno Catena, había pedido
    expulsarlo por considerar que la Policía abrió una investigación prospectiva sobre unos pagos
    ajenos al objeto de las diligencias y sin indicios delictivos. La fiscal responde que esas
    transferencias ya figuraban en el informe inicial de la UDEF del 22 de abril, que Zapatero fue
    preguntado por ellas en su declaración del 18 de junio y que la investigación no puede quedar
    limitada a los hechos descritos en el auto que autorizó las entradas y registros. Según la UDEF,
    el contrato de asesoría con Focus canalizaba pagos por gestiones de Zapatero ante autoridades
    bolivianas, entre ellas el entonces presidente Luis Arce, en favor del Grupo Gloria, cuya filial
    cementera SOBOCE litigaba con FANCESA. El escrito fue remitido al juez el 18 de septiembre
    (Moncloa.com, 1 de octubre). Son conclusiones policiales en una instrucción abierta; rige la
    presunción de inocencia.
  quote: >-
    sirve de excusa para encubrir su persistente deseo de limitar la actuación judicial
