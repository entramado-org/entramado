  headline: >-
    La Audiencia Nacional rechaza los recursos de Jéssica Rodríguez y de Ignacio Zaldívar y
    confirma sus imputaciones en la pieza del caso Koldo sobre la contratación de Rodríguez
    en Ineco y Tragsatec
  dek: >-
    Según EFE (9 de octubre de 2026), la Sala de lo Penal de la Audiencia Nacional ha
    dictado sendos autos en los que rechaza los recursos de las defensas de Jéssica
    Rodríguez, expareja del exministro José Luis Ábalos, y de Ignacio Zaldívar, ex alto
    cargo de Adif, contra las imputaciones acordadas por el juez Ismael Moreno en el caso
    Koldo. Respecto de Rodríguez, la Sala considera que el juicio celebrado contra Ábalos,
    en el que declaró como testigo, no implica cosa juzgada y apunta a su eventual
    responsabilidad en los hechos relativos a sus contratos en Ineco y Tragsatec; sostiene
    que «el propósito fundacional del plan criminal era, precisamente, que no trabajara».
    Respecto de Zaldívar, mantiene su imputación conforme a la posición de la Fiscalía
    Anticorrupción, que entiende que pudo participar en un delito de tráfico de influencias
    al trasladar a su subordinada las presiones recibidas para que Rodríguez fuera
    contratada y mantenida en su puesto. El 20 de julio ambos se acogieron a su derecho a no
    declarar. Rige la presunción de inocencia.
  outlet: EFE (vía Infobae)
  url: https://www.infobae.com/espana/agencias/2026/10/09/la-audiencia-nacional-confirma-la-imputacion-de-jessica-y-un-ex-alto-cargo-de-adif/
