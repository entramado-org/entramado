    Pedraz imputa a Juanma Serrano, exjefe de gabinete de Sánchez y expresidente de
    Correos, en el caso Leire
  dek: >-
    Según Vozpópuli y Libertad Digital (10 de julio de 2026), el juez de la Audiencia
    Nacional Santiago Pedraz ha acordado la imputación de Juan Manuel Serrano, exjefe de
    gabinete de Pedro Sánchez y expresidente de Correos, a petición de la Fiscalía
    Anticorrupción. Según Vozpópuli, la Fiscalía había pedido investigarle tras el
    último informe de la UCO. Según Vozpópuli y EFE, ese informe le atribuye una
    participación «preeminente» en la presunta trama de la SEPI por la contratación de
    Leire Díez en Correos y sostiene que colaboró «estrechamente» con Díez para
    desestabilizar causas judiciales que afectaban al PSOE y al Gobierno. Según
    Vozpópuli y Moncloa.com, el juez acordó además el acceso, volcado y análisis en sede
    policial de su teléfono móvil: considera la medida justificada por el tipo de
    delincuencia investigada y relevante para determinar su «ámbito de responsabilidad».
    Según Vozpópuli, Pedraz le citaría a declarar como investigado el 28 de julio; según
    Libertad Digital, la fecha aún no estaba fijada. La imputación permite ejercer el
    derecho de defensa y no implica culpabilidad: rige la presunción de inocencia.
