  headline: >-
    El Tribunal Supremo abre la ejecutoria del caso mascarillas y da 15 días a Ábalos, Koldo García y
    Aldama para abonar unos 647.000 euros en multas, decomiso e indemnizaciones
  dek: >-
    Según la nota de prensa del CGPJ y El Español (4 de noviembre de 2026), la Sala de lo Penal del Tribunal
    Supremo acordó por auto la apertura de la ejecutoria de la sentencia del 22 de junio de 2026 (caso
    mascarillas) y requiere a los tres condenados el pago, en el plazo de 15 días, de las cantidades fijadas.
    Las multas son de 52.500 euros para José Luis Ábalos, 45.750 euros para Koldo García Izaguirre y 75.000
    euros para Víctor de Aldama. Los tres responden solidariamente del decomiso de las ganancias del cohecho,
    que la sentencia cifra en 430.298 euros. Ábalos y García Izaguirre deben además indemnizar conjunta
    y solidariamente a Ineco con 34.450 euros y a Tragsatec con 9.500,54 euros. Si no pagan, el tribunal
    procederá por la vía de apremio en el caso de las multas y las indemnizaciones; los bienes decomisados
    los gestionará la Oficina de Recuperación y Gestión de Activos (ORGA). El auto acuerda también las
    liquidaciones de condena de Ábalos y García Izaguirre y da a Aldama 15 días para ratificar su consentimiento
    a un año de trabajos en beneficio de la comunidad.
  quote: se procederá por la vía de apremio en el caso de las multas y las indemnizaciones
  outlet: CGPJ (nota de prensa)
  url: https://www.poderjudicial.es/cgpj/es/Poder-Judicial/Noticias-Judiciales/El-Tribunal-Supremo-abre-la-ejecutoria-de-la-sentencia-del--caso-mascarillas--y-requiere-a-los-condenados-el-pago-de-647-000-euros-en-multas--decomisos-e-indemnizaciones
