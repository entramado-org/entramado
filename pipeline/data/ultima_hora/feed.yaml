  headline: >-
    Pedraz reserva a la Fiscalía la documentación que el PSOE le ha entregado sobre los abogados que
    contrató entre 2021 y 2025
  dek: >-
    Según Europa Press (vía Infobae), EFE y Libertad Digital (18 de noviembre de 2026), el PSOE ha
    entregado al juez de la Audiencia Nacional Santiago Pedraz, que instruye el caso Leire Díez, la
    relación de abogados y despachos contratados por el partido entre 2021 y 2025 y facturas de esos
    encargos, en un pendrive y tres cajas. Según la providencia, el juez une la documentación a una
    «pieza separada reservada PSOE», «con acceso reservado únicamente al Ministerio Fiscal en tanto no se finalice su análisis»; el partido había pedido que se custodiara en una pieza reservada. Según Europa Press, el PSOE alegó que las
    facturas contienen datos que afectan a la intimidad y que está inmerso en un proceso electoral, y
    precisó que no aporta las de los abogados Ismael Oliver y Jacobo Teijelo, investigados en la
    causa, porque «ya constan en las actuaciones». Libertad Digital sostiene que las facturas se
    entregan sin la descripción del concepto de cada encargo; según Europa Press, el partido afirma
    que constan los «conceptos tal y como fueron emitidos». Son diligencias de instrucción en curso.
    Rige la presunción de inocencia.
  outlet: Europa Press (vía Infobae)
  url: https://www.infobae.com/espana/agencias/2026/11/18/el-psoe-aporta-al-caso-leire-los-abogados-contratados-entre-2021-y-2025-y-facturas-y-pide-que-esten-bajo-secreto/
