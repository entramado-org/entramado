  headline: >-
    Según El Debate, la defensa de Begoña Gómez baraja alegar el vacío legal sobre la
    figura de la «primera dama» en España
  dek: >-
    Según El Debate (23 de agosto de 2026), Jaime Campaner, nuevo abogado de Begoña
    Gómez, baraja articular su defensa en torno a la inexistencia de un marco normativo
    específico que regule la figura del cónyuge o consorte del presidente del Gobierno a
    efectos de incompatibilidades. El diario señala que, según las fuentes que consultó,
    las previsiones de la Ley 50/1997, del Gobierno, y de la Ley 3/2015, reguladora del
    ejercicio del alto cargo, «solo se dirigen al propio alto cargo y no imponen
    restricciones directas a la actividad profesional del consorte», y recoge esta
    afirmación de su entorno jurídico: «No existe precepto alguno que prohíba al cónyuge
    del presidente del Gobierno desempeñar actividades laborales, académicas o
    empresariales, ni que le someta a un control previo de compatibilidad». Según el
    mismo medio, las acusaciones populares unificadas, bajo la dirección letrada de
    Hazte Oír, piden su condena por presuntos delitos de tráfico de influencias y
    malversación de caudales públicos, mientras que la Fiscalía de Madrid ha solicitado
    su absolución al no apreciar que cometiese ninguna infracción penal. Ningún hecho
    está judicialmente probado. Rige la presunción de inocencia.
