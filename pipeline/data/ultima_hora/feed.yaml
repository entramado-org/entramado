  headline: >-
    La editora de OKDiario pagó 242.000 euros al despacho de la abogada de Koldo García por su defensa,
    según las facturas que ella entregó al juez Pedraz
  dek: >-
    Según elDiario.es (29 de octubre de 2026) y ARA, Leticia de la Hoz, abogada de Koldo García en la
    Audiencia Nacional y en el Tribunal Supremo e investigada en el caso Leire Díez, entregó al juez de
    la Audiencia Nacional Santiago Pedraz, que le había pedido justificar quién pagó esa defensa, dos
    facturas de su despacho, IDBO Consultants, a cargo de Dos Mil Palabras S. L., editora de OKDiario.
    Las facturas están fechadas el 27 de noviembre de 2025 (150.000 euros más IVA, 181.500 euros) y el
    23 de enero de 2026 (60.500 euros con IVA): 242.000 euros en total. Van acompañadas de las órdenes
    de transferencia. Según ARA, el primer pago coincide con el día en que OKDiario publicó la primera
    entrega de su entrevista con Koldo García. En su escrito, De la Hoz sostiene que el PSOE no hizo abono
    alguno. Son diligencias de instrucción en curso. Rige la presunción de inocencia.
  quote: el Partido Socialista Obrero Español no hizo abono alguno a mi representada
