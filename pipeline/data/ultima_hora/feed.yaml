    había abierto una investigación sobre su autoría y solicitó un informe técnico sobre
    medidas adicionales de protección documental. La noticia señala que el auto no
    resolvió la solicitud de la defensa de devolver el informe a la Policía y extraerlo
    de las actuaciones. Rige la presunción de inocencia.
