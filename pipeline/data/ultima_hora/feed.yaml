  headline: >-
    'Julito' ratifica ante el juez Calama su escrito sobre Zapatero y admite que
    Análisis Relevante siguió pagando a la sociedad de las hijas del expresidente cuando
    ya no prestaba servicios, según The Objective e Infobae
  dek: >-
    Según The Objective (21 de julio de 2026), Julio Martínez Martínez ('Julito')
    compareció el 21 de julio como investigado ante el juez José Luis Calama en el caso
    Plus Ultra (DP 77/2024), durante más de tres horas. Ratificó el escrito que había
    remitido la víspera, en el que explica que el expresidente José Luis Rodríguez
    Zapatero medió en la ayuda pública de 53 millones de euros a Plus Ultra y que
    pactaron el 1% de comisión, aunque admitió que desconoce con quién habló para su
    concesión. Según Infobae (21 de julio de 2026), en ese escrito señalaba a Zapatero
    como quien «marcaba los pasos a seguir» para encontrar financiación para la
    aerolínea y quien «lideraba» Análisis Relevante, la empresa que Martínez
    administraba. Según The Objective, también reveló que Zapatero le presentó a Delcy
    Rodríguez, que se convirtió en su interlocutora para las gestiones administrativas
    que realizó en Venezuela. Según el mismo medio, dijo que las hijas del expresidente,
    Alba y Laura Rodríguez Espinosa, facturaron unos 240.000 euros a Análisis Relevante
    entre 2020 y 2025 y que Whathefav recibió pagos mensuales de 3.000 euros; la mayor
    parte se cobró entre 2022 y 2025, cuando no desarrollaron trabajo alguno para la
    consultora. Infobae recoge igualmente que Análisis Relevante siguió pagando a las
    hijas de Zapatero aunque su empresa dejó de prestar servicios en 2022. Según
    Infobae, Zapatero dijo en la comisión de investigación del Senado, el 2 de marzo,
    que no había «cobrado ninguna comisión de Plus Ultra, absolutamente ninguna». La
    causa sigue en instrucción; ninguno de los hechos está probado judicialmente. Rige
    la presunción de inocencia.
  quote: >-
