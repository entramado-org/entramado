  headline: >-
    Según Infobae (17-07-2026), la UCO investiga si fondos procedentes de un directivo
    de Acciona contribuyeron a pagar el renting del Toyota que utilizó Cerdán
  dek: >-
    Según Infobae (17-07-2026), el informe patrimonial de la UCO recoge que Santos
    Cerdán pagó 13.455 euros por el renting de un Toyota RAV4 entre mayo de 2017 y abril
    de 2019 y que Koldo García realizó ingresos en efectivo en la cuenta utilizada para
    abonarlo. El medio reproduce la hipótesis de los investigadores de que el origen de
    uno de esos ingresos, de 600 euros en septiembre de 2017, «se podría asociar a una
    entrega de dinero por parte de Fernando Merino, entonces directivo de Acciona
    Construcción». Según la misma información, los agentes apoyan esa hipótesis en una
    conversación intervenida en la que Koldo señala a su exmujer que «el dinero lo tiene
    Fernando en Bilbao» y creen que ese Fernando es Fernando Agustín Merino Vera, que
    fue responsable de la constructora en Navarra y La Rioja. Infobae señala que Acciona
    lo despidió en abril de 2021. Son hipótesis e indicios de una instrucción en curso,
    no hechos probados; rige la presunción de inocencia.
  outlet: Infobae
  url: https://www.infobae.com/espana/2026/07/17/la-uco-halla-pruebas-de-que-acciona-pago-el-renting-de-un-toyota-de-santos-cerdan-a-traves-de-pagos-en-efectivo-que-hacia-un-directivo-de-la-constructora-a-koldo-garcia/
