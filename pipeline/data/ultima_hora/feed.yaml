  dek: >-
    Según Europa Press (vía Infobae y Demócrata) (26 de octubre de 2026), Leticia de la Hoz,
    abogada de Koldo García e investigada en el caso Leire, ha pedido en un escrito a la
    asesoría jurídica del PSOE que, «sin aguardar el pronunciamiento» del Consejo General de
    la Abogacía, ponga de manifiesto al juez Santiago Pedraz «cuanto obre en sus archivos»
    sobre ella entre 2021 y 2025, y que expida una certificación negativa si no consta
    contrato, encargo, factura, pago o dato alguno. En el mismo escrito sostiene que el
    partido no la contrató «ni de forma directa ni indirecta, ni para asuntos generales ni
    particulares», ni para la defensa de Koldo García en la Audiencia Nacional o en el
    Tribunal Supremo. Pedraz ha incorporado el escrito a la causa. Son diligencias de
    instrucción en curso. Rige la presunción de inocencia.
