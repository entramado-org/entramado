- iso: '2026-11-20'
  date: 20 nov 2026
  headline: >-
    El comandante Villalba incorpora a Macarena Olona a su defensa antes de declarar como
    investigado el 23 de noviembre
  dek: >-
    Según The Objective y Servimedia (vía Diario Siglo XXI) (20 de noviembre de 2026), el
    comandante de la Guardia Civil Rubén Villalba, investigado en el caso Koldo, ha incorporado a
    su defensa a Macarena Olona, exdiputada de Vox y abogada del Estado en excedencia. La
    designación se comunicó en un escrito presentado el viernes 20 ante el juez de la Audiencia
    Nacional Ismael Moreno, que lo ha citado a declarar como investigado el lunes 23 de noviembre.
    Según The Objective, la defensa anuncia que ratificará la designación mediante un apoderamiento
    apud acta ante la secretaría del juzgado antes de la comparecencia. La declaración aún no se ha
    celebrado. Rige la presunción de inocencia.
  outlet: The Objective
  url: https://theobjective.com/espana/tribunales/2026-11-20/guardia-civil-caso-koldo-macarena-olona-defensa/
