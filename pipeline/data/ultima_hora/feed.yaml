  headline: >-
    El director adjunto operativo de la Guardia Civil dice por escrito a Pedraz que Marlaska
    y la directora general le llamaron tras filtrarse el correo de Begoña Gómez
  dek: >-
    Según EFE y Europa Press (15 de octubre de 2026), el director adjunto operativo (DAO) de
    la Guardia Civil, Manuel Llamas, ha respondido por escrito a un requerimiento del juez
    de la Audiencia Nacional Santiago Pedraz, instructor del caso Leire, que el ministro del
    Interior, Fernando Grande-Marlaska, y la directora general del cuerpo, Mercedes
    González, le llamaron tras filtrarse el correo electrónico de Begoña Gómez. En el
    escrito sitúa a la directora general en la génesis de una de las informaciones
    reservadas abiertas a agentes de la UCO: «estuvo en la génesis de la misma a través de
    una llamada, así como otra del ministro del Interior». Añade que ninguno de los cuatro
    expedientes disciplinarios abiertos a agentes de la UCO «ha sido motivado directamente
    por hechos que guarden relación directa con investigaciones judiciales». Según EFE,
    Llamas y González figuran entre los investigados de la causa; según Europa Press, el
    juez indaga si la apertura de esas informaciones reservadas tuvo como objetivo presionar
    a los agentes. Rige la presunción de inocencia.
