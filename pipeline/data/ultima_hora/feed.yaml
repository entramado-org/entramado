  headline: >-
    Cristina Narbona admite ante el juez Pedraz haber hablado con Leire Díez y haberla
    remitido a Santos Cerdán, quien le dijo que era «intrascendente»
  dek: >-
    Según Infobae (15-07-2026), la presidenta del PSOE, Cristina Narbona, declaró ese
    día como testigo en el caso Leire ante el juez de la Audiencia Nacional Santiago
    Pedraz. La comparecencia duró media hora. Narbona negó tener «el menor conocimiento
    de la supuesta trama» que, presuntamente, organizó la investigada Leire Díez para
    interferir en causas judiciales que afectan al Gobierno o al entorno del presidente
    Pedro Sánchez. Según el mismo medio, admitió haber hablado con Díez y haber remitido
    el asunto al entonces secretario de Organización del PSOE, Santos Cerdán, quien,
    según su versión, le dijo después que lo hablado era «intrascendente y nada
    relevante». La declaración estaba prevista para el viernes 10 de julio y se aplazó
    al 15, según The Objective (09-07-2026). Narbona
    comparece como testigo, no como investigada; rige la presunción de inocencia.
