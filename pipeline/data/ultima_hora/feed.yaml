  headline: >-
    Aagesen, ante la comisión SEPI del Senado: los informes de la SEPI «indicaban que se
    estaban cumpliendo los 13 criterios de elegibilidad» y «nunca recibí ninguna
    indicación»
  dek: >-
    La vicepresidenta tercera del Gobierno y ministra para la Transición Ecológica, Sara
    Aagesen, compareció el 8 de julio de 2026 ante la comisión de investigación del
    Senado sobre la gestión de la SEPI, en calidad de exvocal del Consejo Gestor del
    Fondo de Apoyo a la Solvencia de Empresas Estratégicas (FASEE), del que formó parte
    cuando era secretaria de Estado de Energía (Diario de Sesiones del Senado
    DS_C_15_754, p.1; Vozpópuli, 08-07-2026). Según el Diario de Sesiones, Aagesen
    afirmó que «los informes que nos llegaron de los departamentos de SEPI, también las
    auditorías internas, indicaban que se estaban cumpliendo los 13 criterios de
    elegibilidad» (p.9) y que «no tuve ningún informe desfavorable» (p.6). El senador
    del Grupo Popular Hernando García le preguntó si había recibido indicaciones de
    Presidencia del Gobierno, de la Oficina Económica de la Moncloa o de ministros sobre
    el sentido de su voto, y ella respondió: «Nunca recibí ninguna indicación» (pp.6-7).
    También sostuvo que «no hubo ninguna presión absolutamente de nadie a la hora de
    tomar las decisiones del consejo gestor» (p.39). Sobre el rescate de Tubos Reunidos
    (112,8 millones de euros), la senadora Gómez Enríquez le reprochó que «solo tres
    semanas después de su firme bloqueo, cambió radicalmente el sentido de su voto».
    Aagesen respondió: «usted está relatando algo que le estoy diciendo que no ocurrió»
    (p.32), y añadió que no pudo estar en esa sesión del Consejo Gestor y que en ella
    delegó en el subsecretario del Ministerio para la Transición Ecológica (p.3).
    Preguntada por el expresidente de la SEPI Vicente Fernández, respondió: «No conozco
    a este señor ni creo nada, puesto que no tenía conocimiento de su existencia»
    (p.23). Según Vozpópuli (08-07-2026), el juez Santiago Pedraz investiga en el
    denominado caso Leire a una veintena de antiguos responsables de la SEPI, entre
    ellos Vicente Fernández, y entre los expedientes que aparecen en esa investigación
    figura el rescate de Tubos Reunidos. Se trata de una comparecencia parlamentaria;
    rige la presunción de inocencia respecto de todos los investigados.
