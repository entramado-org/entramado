  dek: >-
    Según el CGPJ, The Objective y RTVC (27 de octubre de 2026), el juez de la Audiencia
    Nacional José Luis Calama ha rechazado en un auto la solicitud de José Luis Rodríguez
    Zapatero de enviar una comisión rogatoria a Arabia Saudí para acreditar el origen de las
    joyas incautadas en el registro de su despacho el 19 de mayo, que el investigado
    atribuye a un regalo del entonces monarca saudí en 2007. En línea con el informe de la
    Fiscalía Anticorrupción, el juez considera que «la hipótesis fáctica sobre la que
    descansa la diligencia interesada» carece en este momento de «un mínimo elemento
    objetivo de corroboración» y precisa que no se trata de invertir la carga de la prueba.
    Anuncia que resolverá en otra resolución la petición de la Fiscalía Anticorrupción de
    atribuirle un delito de malversación. Son diligencias de instrucción en curso. Rige la
    presunción de inocencia.
