    clonaron los dispositivos de ambas testigos. Según la agencia, el auto de citación
    les había requerido aportar sus comunicaciones de abril de 2024 a junio de 2025 con
    Díez, Cerdán, Serrano y la gerente del PSOE Ana María Fuentes. Son diligencias de
