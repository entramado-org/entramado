  headline: >-
    Calama acepta la personación de la asociación URVEX como acusación popular en el
    caso Plus Ultra con fianza de 5.000 euros y rechaza desbloquear una cuenta de
    Agropecuaria Lucena, vinculada a Julio Martínez Martínez
  dek: >-
    Según EFE (vía Infobae, 4 de septiembre de 2026) y Moncloa.com (5 de septiembre), el
    juez José Luis Calama (Audiencia Nacional, DP 77/2024) ha acordado tener por
    personada como acusación popular a la Unión de la Resistencia Venezolana en el Exilio
    (URVEX), previa fianza de 5.000 euros, la misma cuantía exigida al resto de
    acusaciones populares. La asociación, constituida en 2024, se define como entidad
    española sin ánimo de lucro dedicada a la «denuncia de las estructuras de corrupción
    trasnacional vinculadas al régimen venezolano y la defensa de los derechos de la
    diáspora venezolana en España» y alegó que sus fines conectan con una causa que
    examina el accionariado venezolano de la aerolínea y posibles operaciones de blanqueo
    de fondos de ese origen; según Moncloa.com, anunció «la aportación de documentación y
    la proposición de diligencias relativas a la dimensión venezolana de los hechos
    investigados». En la misma resolución, según EFE, el juez rechazó desbloquear la
    cuenta bancaria de Agropecuaria Lucena SL, vinculada a Julio Martínez Martínez, por
    entender que autorizar pagos anularía la eficacia de la medida cautelar. La causa
    sigue en instrucción, sin juicio ni sentencia. Rige la presunción de inocencia.
  outlet: EFE (vía Infobae)
  url: https://www.infobae.com/espana/agencias/2026/09/04/la-union-de-la-resistencia-venezolana-en-el-exilio-se-persona-en-el-caso-plus-ultra/
