  headline: >-
    El juez Calama rechaza investigar a Zapatero por malversación por las joyas: en 2007 ninguna ley obligaba
    a incorporar al patrimonio público los regalos recibidos por altos cargos
  dek: >-
    Según elDiario.es y The Objective (6 de noviembre de 2026), el juez de la Audiencia Nacional José
    Luis Calama ha rechazado en un auto la petición de la Fiscalía Anticorrupción, formulada el 23 de
    octubre, de investigar también a José Luis Rodríguez Zapatero por malversación de caudales públicos
    por no haber entregado a Patrimonio del Estado las joyas halladas en el registro de su despacho en
    mayo. El instructor razona que en 2007 ninguna norma legal imponía que los regalos recibidos por altos
    cargos quedasen automáticamente incorporados al patrimonio público, obligación que llegó con la Ley
    19/2013 de Transparencia, y que, «aun admitiendo que la apropiación de las joyas pudiera suscitar
    reproches de naturaleza ética o política», falta un elemento esencial del tipo. Según Vozpópuli (23
    de octubre de 2026), Zapatero está investigado en la pieza de las joyas por presuntos delitos fiscal
    y de contrabando. Son diligencias de instrucción en curso. Rige la presunción de inocencia.
  quote: aun admitiendo que la apropiación de las joyas pudiera suscitar reproches de naturaleza ética
    o política
