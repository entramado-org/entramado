  headline: >-
    La defensa de Zapatero recurre la resolución de Calama que autorizó a la UDEF a
    acceder a las cuentas bancarias del expresidente y su entorno
  dek: >-
    Según El Español (3 de agosto de 2026), la defensa de José Luis Rodríguez Zapatero
    recurrió la resolución del 29 de julio del juez José Luis Calama (Audiencia
    Nacional, DP 77/2024) que autorizó a la Unidad de Delincuencia Económica y Fiscal
    (UDEF) de la Policía Nacional el acceso a numerosas cuentas bancarias —más de
    sesenta, según elDiario.es (29 de julio de 2026)— del expresidente, sus hijas, su
    secretaria Gertrudis Alcázar y un conjunto de empresas de Julio Martínez Martínez.
    Según El Español, el letrado Víctor Moreno Catena no discute la potestad del
    instructor de recabar información bancaria, pero sostiene que la resolución «se
    extiende sin razón hasta la fecha presente, desbordando el período temporal objeto
    de la instrucción» y que la habilitación a la UDEF para «ampliar la información que
    se considere pertinente» sobre los productos bancarios «difumina el ámbito objetivo»
    de una medida restrictiva de derechos fundamentales, cuya delimitación «no es
    delegable en el funcionario encargado de ejecutarla»: los agentes «precisan de una
    previa autorización judicial mediante resolución motivada» para obtener
    documentación adicional. El recurso denuncia además una línea de investigación
    «ajena al perímetro de la investigación judicial» y cita como ejemplo el análisis
    del pago del grupo peruano Gloria, que califica de indagación «puramente
    prospectiva». Según El Español, en la resolución recurrida Calama reafirmó los
    indicios de presuntos delitos de tráfico de influencias y blanqueo contra Zapatero y
    Martínez Martínez. La causa investiga el presunto tráfico de influencias en el
    rescate de 53 millones de euros concedido por la SEPI a Plus Ultra en marzo de 2021.
    Ninguno de los hechos está probado judicialmente. Rige la presunción de inocencia.
  quote: >-
    ampliar la información que se considere pertinente
  outlet: El Español
  url: https://www.elespanol.com/espana/tribunales/20260803/defensa-zapatero-recurre-extension-investigacion-economica-acordada-calama/1003744342405_0.html
