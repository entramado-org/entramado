  headline: >-
    La Fiscalía Europea preguntó a la UCO si hay fondos de la UE afectados en el caso
    Leire; Pedraz responde que los hechos ya los investiga su juzgado
  dek: >-
    Según EFE (vía Infobae, 24 de septiembre de 2026), el fiscal europeo delegado Luis
    Miguel Jiménez trasladó a la UCO, en un escrito de 7 de julio, la denuncia de un
    particular que pedía investigar si fondos de la campaña del PSOE a las elecciones
    europeas de 2024 pudieron desviarse a actividades vinculadas a Leire Díez, y preguntó
    si constan fondos europeos afectados en la causa. Informado por la UCO, el juez
    Santiago Pedraz respondió el 23 de septiembre que esos hechos «están siendo conocidos
    e investigados por este órgano» y que cualquier solicitud de información debe
    dirigirse directamente a su juzgado. Rige la presunción de inocencia.
  outlet: EFE (vía Infobae)
  url: https://www.infobae.com/espana/agencias/2026/09/24/la-fiscalia-europea-pregunta-a-la-uco-si-en-el-caso-leire-estan-afectados-fondos-de-la-ue/
  case_tag: Caso Leire
