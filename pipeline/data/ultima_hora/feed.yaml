  headline: >-
    Cueto y Rotaeche declaran voluntariamente como investigados ante el juez Moreno y
    niegan haber pagado o conocido las comisiones por los contratos de mascarillas de
    Soluciones de Gestión
  dek: >-
    Según EFE (vía Infobae) y The Objective (11 de septiembre de 2026), Juan Carlos Cueto
    e Íñigo Rotaeche comparecieron el viernes 11 de septiembre, a petición propia, como
    investigados ante el juez Ismael Moreno (Audiencia Nacional), que instruye la parte
    del caso Koldo que no juzgó el Tribunal Supremo. Según fuentes jurídicas citadas por
    EFE, Rotaeche, administrador único de Soluciones de Gestión, y Cueto, a quien los
    investigadores atribuyen el control real de la empresa, negaron ante la Fiscalía y sus
    defensas haber pagado comisiones o haberlas conocido: sostuvieron que se limitaron a
    aceptar una propuesta de negocio de Víctor de Aldama y a presentar las ofertas que
    resultaron adjudicatarias. La sentencia del Supremo dio por probado que Aldama
    recibió 6,6 millones de euros de Soluciones de Gestión por los contratos de
    mascarillas de Puertos del Estado y Adif (20 y 12,5 millones). Ambos atribuyeron a un
    error de otro investigado, José Ángel Escorial, que los contratos entre Soluciones de
    Gestión y el Grupo Cueto aparezcan fechados el 16 de marzo de 2020, antes de la orden
    ministerial del 20 de marzo; Cueto pidió aportar una pericial sobre las fechas,
    denegada en esta fase, y negó ejercer el control de la sociedad, con la que compartía
    sede como espacio de trabajo. Era la segunda declaración de Cueto y la primera de
    Rotaeche. Según EFE, con estas declaraciones Moreno ultima las pesquisas de esta
    pieza. Los hechos no están probados judicialmente. Rige la presunción de inocencia.
  outlet: EFE (vía Infobae)
  url: https://www.infobae.com/espana/agencias/2026/09/11/dos-socios-de-aldama-niegan-que-conocieran-las-comisiones-por-los-contratos-de-mascarillas/
