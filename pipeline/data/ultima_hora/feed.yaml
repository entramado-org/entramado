  headline: >-
    El juez Peinado prevé dictar el auto de apertura de juicio oral a Begoña Gómez antes
    de jubilarse el 27 de septiembre; el caso pasaría a la Audiencia Provincial de Madrid
    para un juicio con jurado previsiblemente en 2027
  dek: >-
    Según fuentes jurídicas citadas por EFE (vía Infobae y Noticias de Álava, 6 de
    septiembre de 2026), el juez Juan Carlos Peinado (Sección de Instrucción 41 del
    Tribunal de Instancia de Madrid, causa 1146/2024) prevé dictar el auto de apertura de
    juicio oral —que no es recurrible— antes de su jubilación el 27 de septiembre, cuando
    cumple 72 años. El trámite es posible una vez que la defensa de Begoña Gómez presentó
    el viernes 4 su escrito de conclusiones provisionales, el último que faltaba para
    convocar la audiencia preliminar. Según EFE, el auto de la Audiencia Provincial de
    julio «reordenó» el procedimiento y lo retrotrajo a abril, cuando el juez transformó
    la causa en procedimiento de jurado, de modo que las partes tuvieron que presentar de
    nuevo sus escritos y la audiencia preliminar se repite. Gómez se sentaría en el
    banquillo por presuntos tráfico de influencias y malversación y su asesora Cristina
    Álvarez por presunta malversación; la Fiscalía pedirá la absolución de ambas, la
    acusación popular liderada por Hazte Oír pide 13 y 6 años, y la Universidad
    Complutense reclama más de 113.000 euros de responsabilidad civil. El juicio sería
    previsiblemente en 2027. Ningún hecho está judicialmente probado. Rige la presunción
    de inocencia.
  outlet: EFE (vía Infobae)
  url: https://www.infobae.com/espana/agencias/2026/09/06/el-juez-peinado-preve-abrir-juicio-a-begona-gomez-antes-de-jubilarse-a-finales-de-mes/
