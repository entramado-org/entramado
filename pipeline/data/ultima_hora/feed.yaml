- iso: '2026-11-17'
  date: 17 nov 2026
  headline: >-
    El exdirectivo de Adif Ignacio Zaldívar declara como investigado ante el juez Moreno: admite que
    Pardo de Vera le llamó por las quejas de Ábalos sobre el trato a Jéssica Rodríguez y niega haber
    recibido órdenes sobre ella
  dek: >-
    Según Europa Press (vía Infobae), Confilegal y Libertad Digital (17 de noviembre de 2026), Ignacio
    Zaldívar declaró el martes como investigado ante el juez de la Audiencia Nacional Ismael Moreno, en
    una declaración voluntaria en la que respondió a su abogada y a la Fiscalía. Según fuentes jurídicas
    citadas por Europa Press, dijo que la entonces presidenta de Adif, Isabel Pardo de Vera, le llamó
    para comunicarle que José Luis Ábalos le había trasladado que estaban molestando a su expareja,
    Jéssica Rodríguez, contratada en la empresa pública Tragsatec, y que él lo comunicó a la responsable
    directa de Rodríguez; defendió que solo actuó como correa de transmisión. Negó haber remitido el
    perfil de Rodríguez por orden de Pardo de Vera y haber recibido orden o instrucción especial sobre
    ella, y aseguró que reenvió del mismo modo los perfiles del resto de candidatos en su misma
    situación, 122 en total, y que era Tragsatec quien decidía qué candidatos entraban. La Fiscalía
    Anticorrupción aprecia un presunto delito de tráfico de influencias, sostiene que Zaldívar «dio
    instrucciones intimidatorias para que no se la molestara» y quiere que vaya a juicio. Es la versión
    del investigado frente a la tesis de la Fiscalía. Rige la presunción de inocencia.
  outlet: Europa Press (vía Infobae)
  url: https://www.infobae.com/espana/agencias/2026/11/17/un-excargo-de-adif-confirma-que-la-expresidenta-de-la-compania-llamo-porque-estaban-molestando-a-la-expareja-de-abalos/
