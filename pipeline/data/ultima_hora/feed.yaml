  headline: >-
    La defensa de Zapatero pide al juez Calama la nulidad del caso Plus Ultra por
    vulneración de derechos fundamentales
  dek: >-
    Según The Objective (25-06-2026), el abogado de José Luis Rodríguez Zapatero, Víctor
    Moreno Catena, presentó ese día ante el juez José Luis Calama (Audiencia Nacional)
    un incidente de nulidad de actuaciones de 21 páginas en el que sostiene que el
    procedimiento ha lesionado su derecho «a un proceso justo con todas las garantías,
    el derecho a la tutela judicial efectiva sin indefensión y el derecho a la
    presunción de inocencia». La defensa pide que se excluyan las evidencias obtenidas
    en «todas las entradas y registros» acordadas tanto por el Juzgado de Instrucción nº
    15 de Madrid como por la Audiencia Nacional, y apunta a «maniobras dirigidas a
    conducir el proceso hacia los órganos judiciales de mayor conveniencia, soslayando
    al juez ordinario legalmente competente». Son alegaciones de la defensa. Según EFE
    (vía Infobae, 04-09-2026), el juez, que en principio había inadmitido el escrito por
    haber sido presentado fuera de plazo y después rectificó para estudiar algunas de
    sus alegaciones, rechazó finalmente el incidente en un auto que no admite recurso,
    al entender que no se vulneraron los derechos del expresidente. Rige la presunción
    de inocencia.
  outlet: The Objective
  url: https://theobjective.com/espana/tribunales/2026-06-25/zapatero-nulidad-causa-derecho-proceso/
