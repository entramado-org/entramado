  headline: >-
    Peinado remite a la Fiscalía Europea la pieza del contrato de Red.es a la UTE de
    Barrabés y KPMG y acuerda el archivo de las actuaciones «sin más trámite»
  dek: >-
    Según Europa Press (vía The Objective, 4 de agosto de 2026), el juez Juan Carlos
    Peinado (Juzgado de Instrucción nº 41 de Madrid) acordó en un auto remitir a la
    Fiscalía Europea la pieza separada del caso Begoña Gómez sobre supuestas
    irregularidades en un contrato sufragado con fondos europeos y adjudicado por Red.es
    a una Unión Temporal de Empresas formada por Innova Next —empresa de Juan Carlos
    Barrabés— y KPMG, y acordó además el archivo de las actuaciones «sin más trámite».
    Según El Español (19 de junio de 2026), ese contrato estaba valorado en cuatro
    millones de euros y lo financiaban fondos FEDER; según OKDIARIO, la providencia que
    abrió la pieza tiene fecha del 18 de junio de 2026. El magistrado expone que
    «resulta procedente», tras la decisión de la Audiencia Provincial de Madrid que
    apartó a Barrabés del juicio con jurado de la causa principal, «remitir el
    conocimiento de los hechos a la Fiscalía Europea», que según el mismo medio asumió
    en 2024 una investigación sobre una serie de contratos en UTE con participación de
    la sociedad de Barrabés, adjudicados por Red.es y financiados con fondos europeos.
    La pieza se apoyaba en un informe de la UCO según el cual en los informes de
    valoración de la licitación se obvió «deliberadamente la circunstancia de la
    inexistencia de un libro blanco como requisito necesario exigido en los pliegos a
    puntuar». Ninguno de los hechos está probado judicialmente. Rige la presunción de
    inocencia.
  quote: >-
