  headline: >-
    El DAO Llamas dice en el Senado que Marlaska le llamó por el correo de Begoña Gómez,
    critica «una cierta vanidad» en las investigaciones y rechaza dimitir
  dek: >-
    El teniente general Manuel Llamas, director adjunto operativo de la Guardia Civil e
    investigado por el juez de la Audiencia Nacional Santiago Pedraz en el caso Leire,
    compareció el 17 de julio de 2026 ante la comisión de investigación del caso Koldo
    del Senado, un día después de declarar ante el juez (DS_C_15_756, pp.1, 4 y 7).
    Llamas declaró que el ministro del Interior, Fernando Grande-Marlaska, le llamó por
    la publicación de la dirección de correo de Begoña Gómez y le «dimensionó el efecto
    pernicioso» que había tenido. Precisó que antes ya le había informado la directora
    general en otra llamada y que la del ministro «lo único que hizo fue darme una
    dimensión del alcance y del impacto» de ese «desliz» (DS_C_15_756, pp.4-5). Añadió
    que después de su imputación habló con el ministro, al que, según dijo, «le parece
    absolutamente injusta esta situación y, coherentemente con eso, me mantiene en el
    puesto» (DS_C_15_756, p.6). Llamas habló de «un exceso de protagonismo, una cierta
    vanidad» en cuanto a quién lidera las investigaciones, matizó la frase que se le
    atribuye sobre la «no proactividad» recordando que el titular de la investigación es
    el juez (DS_C_15_756, p.7) y descartó dimitir: «Lo hago por mi inocencia»
    (DS_C_15_756, pp.2 y 4). Según The Objective (02-07-2026), el juez acordó
    investigarle el 2 de julio, a petición de la Fiscalía Anticorrupción y de la
    acusación popular. Rige la presunción de inocencia.
  outlet: The Objective
