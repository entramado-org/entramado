  headline: >-
    El juez sustituto de Peinado deniega a Begoña Gómez asistir a la cumbre de la OTAN
    en Ankara y le permite viajar a Londres para la graduación de su hija
  dek: >-
    Según El Independiente (6 de julio de 2026), el juez Antonio Viejo, sustituto del
    titular Juan Carlos Peinado —de vacaciones—, resolvió el 6 de julio la petición de
    permiso temporal de pasaporte de Begoña Gómez: deniega su asistencia a la cumbre de
    la OTAN en Ankara los días 7-8 de julio, al considerar que la invitación era por
    «razones de cortesía institucional» sin que Gómez tenga «una intervención activa», y
    que Turquía «no pertenece al espacio de libertad, seguridad y justicia de la Unión
    Europea», que facilita la cooperación policial y judicial. En cambio, el magistrado
    autoriza el viaje a Londres entre el 8 y el 10 de julio para la graduación de su
    hija, citando «la buena relación de cooperación judicial entre España y el Reino
    Unido, incluso después del Brexit»; el pasaporte deberá depositarse en el juzgado el
    13 de julio. Según el mismo medio, la Moncloa y Ferraz calificaron el doble criterio
    de «incomprensible». Rige la presunción de inocencia.
