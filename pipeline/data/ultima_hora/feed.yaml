  headline: >-
    La defensa de David Sánchez pide a la Audiencia de Badajoz que expulse
    de la sentencia las frases que le atribuyen conocimiento previo de que
    la plaza «se había creado para él»
  dek: >-
    Según EFE (24 de agosto de 2026), que tuvo acceso al escrito, la
    defensa de David Sánchez —hermano del presidente del Gobierno,
    condenado por la Audiencia Provincial de Badajoz (sentencia 152/2026) a
    nueve años de inhabilitación por prevaricación administrativa como
    cooperador necesario— ha pedido al tribunal una «aclaración» de la
    sentencia para que sean expulsadas de su tenor las frases que le
    atribuyen tener «conocimiento previo de que el puesto de Coordinador de
    las Actividades de los Conservatorios se había creado para él» y
    haberse presentado a la convocatoria y hecho la entrevista «para
    simular la legalidad formal del procedimiento», así como haber sido el
    «principal beneficiario» del proceso. La defensa alega vulneración de
    su derecho de defensa: al quedar prescritos los hechos previos a la
    convocatoria, Sánchez no fue interrogado en el juicio sobre esos
    prolegómenos y no pudo ofrecer explicación exculpatoria. El propio
    escrito reconoce que la aclaración no es cauce para cuestiones de fondo
    y anuncia que, si no se estima, la petición se formalizará como
    recurso. La sentencia no es firme y hay recursos anunciados ante el TSJ
    de Extremadura. Rige la presunción de inocencia.
  outlet: EFE (vía Infobae)
  url: https://www.infobae.com/espana/agencias/2026/08/24/david-sanchez-pide-eliminar-referencia-a-como-se-creo-su-plaza-en-la-diputacion-pacense/
