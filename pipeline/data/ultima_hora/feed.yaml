  headline: >-
    La defensa de Gallardo pide a la Audiencia de Badajoz que su inhabilitación se limite
    al cargo de presidente de la Diputación y se opone a la extensión a todo el empleo
    público que reclama HazteOír
  dek: >-
    Según COPE y El Mundo (10 de septiembre de 2026), la defensa de Miguel Ángel Gallardo,
    expresidente de la Diputación de Badajoz y ex secretario general del PSOE de
    Extremadura, presentó el jueves 10 de septiembre ante la Audiencia Provincial de
    Badajoz un escrito de alegaciones en el trámite de aclaración de la sentencia del
    caso David Sánchez, oponiéndose a la petición de HazteOír —una de las acusaciones
    populares de la causa, según la propia sentencia— de que la inhabilitación especial se
    extienda, conforme al artículo 42 del Código Penal, a puestos análogos, al empleo como
    funcionario, a contratar o trabajar con cualquier Administración o a cualquier cargo
    público. La defensa sostiene que esa petición «rebasa con creces» el ámbito de la pena,
    que debe conectarse con «la función raíz o la actividad que está en el origen del
    delito», y cita una sentencia del Tribunal Supremo de 2018. El mismo escrito rechaza la
    petición de Manos Limpias de que la sentencia recoja una reserva de acciones contra
    Gallardo por la creación del puesto adjudicado a Luis Carrero. Según El Mundo, la
    defensa de David Sánchez presentó ese mismo día otro escrito en el que sostiene que no
    participó en la adjudicación del puesto de coordinador de los conservatorios y se opone
    a que esa cuestión se revise en aclaración; la sentencia declaró prescrito para él ese
    bloque de hechos (p. 69) y lo condenó por el posterior cambio de nomenclatura del
    puesto (p. 360). Según la sentencia 152/2026 de la Audiencia Provincial de Badajoz (14
    de julio de 2026, incorporada al grafo), Gallardo fue condenado por dos delitos de
    prevaricación administrativa a nueve años de inhabilitación especial por cada uno
    (fallo, p. 374); no es firme y cabe apelación ante el TSJ de Extremadura (p. 376). Rige
    la presunción de inocencia.
  quote: >-
    rebasa con creces
