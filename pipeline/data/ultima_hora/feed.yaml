  headline: >-
    Calama inadmite la recusación de Zapatero contra Joyería Yanes y mantiene el encargo
    de tasar las joyas intervenidas en su despacho
  dek: >-
    Según Infobae y Libertad Digital (29 de septiembre de 2026), el juez José Luis Calama
    inadmitió la recusación que la defensa de José Luis Rodríguez Zapatero presentó el 24
    de septiembre contra Joyería Yanes, designada el 21 de septiembre para una nueva
    pericial sobre las joyas intervenidas en el despacho del expresidente. La defensa
    alegaba falta de imparcialidad por las declaraciones televisivas del director general
    de la firma, Juan Yanes, que estimó el conjunto en «un par de millones» de euros; la
    tasación anterior de Ansorena lo situó en 1.323.915 euros. Calama considera la
    recusación precipitada porque aún no se ha designado a los profesionales que harán el
    examen y sostiene que las manifestaciones de un directivo de la entidad no constituyen
    causa legal de recusación del perito. La resolución es recurrible. Rige la presunción
    de inocencia.
