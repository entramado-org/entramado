  headline: >-
    La Fiscalía Europea pide información al juez Moreno sobre las obras del caso Koldo para
    determinar si hubo fondos de la UE
  dek: >-
    Según Libertad Digital (29 de julio de 2026), que ha tenido acceso a una providencia del
    juez Ismael Moreno (Juzgado Central de Instrucción nº 2 de la Audiencia Nacional), la
    oficina de la Fiscalía Europea en Madrid remitió un oficio interesándose por la pieza de
    adjudicaciones de obra pública del caso Koldo. En él pregunta si las «obras identificadas
    por la Comisión Europea» son objeto de investigación en esa causa y si se han hecho
    gestiones para determinar la procedencia de los fondos con que se pagaron las obras, «para
    la determinación de la posible competencia». Antes de contestar, Moreno le pidió que «amplíe
    los datos de las obras enumeradas y cuya información precisa» y le recordó que en esa pieza
    se investigan las obras correspondientes a la Causa Especial 20775/2020 del Tribunal
    Supremo. Según Moncloa.com (30 de julio de 2026), la providencia es del 28 de julio y el
    interés de la Fiscalía Europea se concreta en cuatro obras: la A-68 en el tramo Arrúbal-
    Navarrete (Logroño), el Puente del Centenario (Sevilla), la integración del ferrocarril en
    Sant Feliu de Llobregat y los túneles de Belate (Navarra), incorporados a la causa esa misma
    semana. Según Libertad Digital, el juez indaga en esa pieza la relación de varias
    constructoras, principalmente Acciona, con Servinabar, sociedad que según ese medio habría
    sido instrumental para el cobro de las supuestas comisiones de la trama que atribuye a
    Santos Cerdán. Son diligencias de instrucción en curso, sin sentencia. Rige la presunción de
    inocencia.
  quote: >-
    amplíe los datos de las obras enumeradas y cuya información precisa
