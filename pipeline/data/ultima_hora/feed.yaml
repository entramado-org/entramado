  headline: >-
    La UCO señala a un exdirector de la SEPI como presunto 'topo' en el caso Leire,
    según El Independiente
  dek: >-
    Según El Independiente (24-06-2026), un informe de la UCO al que ha tenido acceso
    ese diario atribuye a Miguel Ángel Figueroa, entonces director de Participadas III
    de la SEPI, un presunto delito de revelación de secretos: habría hecho llegar «al
    menos nueve archivos informáticos» del expediente del rescate de 112,8 millones de
    euros a la compañía alavesa Tubos Reunidos a Vicente Fernández, expresidente de la
    SEPI. Según ese diario, la UCO sitúa a Fernández, junto a Leire Díez y el empresario
    Antxón Alonso, en la presunta trama denominada 'Hirurok', investigada por el juez
    Santiago Pedraz en la Audiencia Nacional. La Guardia Civil comunicó a Figueroa el 4
    de junio su condición de investigado. El diario cita una anotación en una libreta
    intervenida a Leire Díez, fechada el 3 de abril de 2021 y junto a las siglas «MAF»:
    «Va a ser nuestros ojos en la SEPI», y en la misma página: «los directores de
    participadas tienen acceso a todo de todos». La SEPI aprobó el rescate el 13 de
    julio de 2021. Son indicios de un informe policial en una instrucción en curso, no
    hechos probados; rige la presunción de inocencia.
  outlet: El Independiente
  url: https://www.elindependiente.com/espana/2026/06/24/la-uco-senala-que-el-topo-de-las-cloacas-en-la-sepi-filtro-al-socio-de-leire-nueve-archivos-sobre-tubos-reunidos/
