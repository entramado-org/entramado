  dek: >-
    Según adelantó ABC y confirmaron a EFE fuentes cercanas a los accionistas (teletipo
    recogido por Infobae), y según The Objective y El Independiente, Julio Martínez Sola
    —cofundador y presidente de la aerolínea— y Roberto Roselli —consejero delegado—
    dimitieron de sus cargos el 24 de julio, días después de entregar al juez José Luis
    Calama (Audiencia Nacional, DP 77/2024) sendos escritos en los que reconocen que Plus
    Ultra pagó 530.000 euros —el 1% del rescate de 53 millones de la SEPI— por labores de
    «acompañamiento» en el préstamo, repartidos entre tres sociedades vinculadas al
    empresario Julio Martínez Martínez (Análisis Relevante, Voli Analítica e IOT Domotic
    Europe), y el mismo día en que el juez los citó como investigados para declarar en
    septiembre. Hugo Castaño, accionista minoritario, asumirá la presidencia ejecutiva
    concentrando ambas funciones, nombramiento pendiente de aprobación de la SEPI al
    seguir la compañía bajo su supervisión tras el rescate. La causa, en la que también
    está investigado el expresidente José Luis Rodríguez Zapatero, sigue en instrucción
    y ninguno de los hechos está probado judicialmente. Rige la presunción de inocencia.
