  headline: >-
    La UCO acude a la sede de Adif por orden del juez Moreno para requerir información
    sobre una obra de emergencia adjudicada a Levantina en Asturias
  dek: >-
    Según Libertad Digital (15 de septiembre de 2026), agentes de la UCO se personaron el
    11 de septiembre en la sede de Adif, por orden del juez de la Audiencia Nacional
    Ismael Moreno, para requerir información sobre los contratos con Levantina, sociedad
    que el medio vincula a la pieza de obra pública del caso Koldo. Adif remitió un
    informe sobre los trabajos de emergencia de refuerzo de taludes tras un
    desprendimiento en 2020 en la línea Gijón–Pravia (Asturias), con un coste final de
    373.400 euros frente a 489.300 previstos, y concluyó que las mediciones «serían
    coherentes» con la documentación justificativa. Son diligencias de instrucción en
    curso. Rige la presunción de inocencia.
