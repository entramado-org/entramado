  headline: >-
    El BOE publica, cinco días después del auto de apertura de juicio oral contra Begoña Gómez, la
    jubilación forzosa por edad del juez Peinado, que cumple 72 años el día 27
  dek: >-
    Según Infobae (26 de septiembre de 2026), el BOE publicó el sábado 26 la jubilación forzosa por
    edad, acordada por el CGPJ, de Juan Carlos Peinado, titular del Juzgado de Instrucción nº 41 de
    Madrid, que cumple 72 años el domingo 27. Su última resolución, firmada el lunes 21, fue el auto de
    apertura de juicio oral ante el Tribunal del Jurado contra Begoña Gómez, esposa del presidente del
    Gobierno, y su asesora, por presuntos delitos de tráfico de influencias y malversación. Según la
    parte dispositiva del auto (p. 65), Gómez es acusada de tráfico de influencias y malversación de
    caudales públicos, y su asesora Cristina Álvarez solo de malversación, como cooperadora necesaria y
    exclusivamente en relación con el desvío del software de la cátedra. La instrucción se abrió en
    abril de 2024, cuando una denuncia de Manos Limpias recayó en su juzgado; la Audiencia Provincial
    de Madrid ratificó que Gómez será juzgada por un tribunal del jurado. El juzgado queda sin titular
    y está pendiente de concretarse qué magistrado asume la causa (Moncloa.com). La apertura de juicio
    oral no declara culpabilidad; rige la presunción de inocencia.
  outlet: Infobae
  url: https://www.infobae.com/espana/2026/09/26/el-juez-juan-carlos-peinado-se-jubila-por-edad-avanzada-a-un-dia-de-cumplir-72-anos-y-tras-mandar-a-begona-gomez-a-juicio-oral/
