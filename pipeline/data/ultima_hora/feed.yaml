  headline: >-
    La Audiencia de Tarragona deja en manos del Tribunal Supremo la decisión sobre si el
    caso Montoro sigue en Tarragona o pasa a Madrid
  dek: >-
    Según EFE (vía Infobae) e infoLibre (22 de septiembre de 2026), la Audiencia
    Provincial de Tarragona, en un auto, rechaza resolver la cuestión de competencia
    planteada por varias defensas —entre ellas la del exministro de Hacienda Cristóbal
    Montoro— al considerar que se trata de una controversia entre órganos de instrucción
    de distintas comunidades autónomas que debe dirimir el Tribunal Supremo; ni ella ni el
    TSJ de Cataluña son competentes. La causa la abrió en 2018 el Juzgado de Instrucción
    nº 2 de Tarragona y siguen pendientes diligencias y la declaración de los principales
    investigados. Rige la presunción de inocencia.
