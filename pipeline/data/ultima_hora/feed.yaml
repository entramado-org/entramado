  headline: >-
    Pedraz imputa a la presidenta de la SEPI, María Belén Gualda, y a otras 24 personas
    en el caso Leire Díez
  dek: >-
    Según elDiario.es (29-06-2026), el juez de la Audiencia Nacional Santiago Pedraz ha
    acordado imputar, a petición de la Fiscalía Anticorrupción, a otras 25 personas en
    el caso Leire, entre ellas María Belén Gualda González, presidenta de la SEPI. La
    Fiscalía investiga presuntos delitos de tráfico de influencias, malversación y
    prevaricación en operaciones relacionadas con Mercasa, Enusa, la sociedad pública
    Parque Empresarial del Principado de Asturias, Tubos Reunidos y el grupo Forestalia.
    En el caso de Gualda, según el mismo medio, la Fiscalía la relaciona con el rescate
    público de Tubos Reunidos en 2021, cifrado en 115 millones de euros, y sostiene que
    habría participado en reuniones a nivel político para agilizar su tramitación;
    fuentes jurídicas personadas en la causa replican que los atestados previos de la
    UCO no apuntaban a participación alguna de Gualda, que no figuraba entre los
    denunciados en el auto de diciembre de 2025, y fuentes del Ejecutivo aseguran que su
    integridad «no está cuestionada». Según el informe de la Fiscalía citado por
    elDiario.es, el expresidente de la SEPI Vicente Fernández habría recibido 40.000
    euros de la empresa vasca por sus gestiones, y la presunta trama no consiguió
    colocar a Leire Díez como jefa de gabinete de Gualda. Es una imputación en una
    instrucción en curso, no una acusación ni una condena; rige la presunción de
    inocencia.
