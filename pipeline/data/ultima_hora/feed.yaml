- iso: '2026-11-16'
  date: 16 nov 2026
  headline: >-
    La Fiscalía General remite a la Fiscalía Provincial de Madrid la denuncia del PSOE contra el PP, su
    abogado Alberto Durán, Eduardo Inda y la editora de OKDiario por los supuestos ofrecimientos de
    dinero a Koldo García
  dek: >-
    Según EFE (vía El Correo Gallego), Confilegal y Público (16 de noviembre de 2026), la Fiscalía
    General del Estado remitió el lunes a la Fiscalía Provincial de Madrid, por ser la territorialmente
    competente, la denuncia que el PSOE presentó el viernes 13 de noviembre contra el PP, el abogado
    Alberto Durán, el director de OKDiario, Eduardo Inda, y la editora del digital. La denuncia recoge
    el relato de Koldo García, condenado por el Tribunal Supremo en el caso mascarillas, de que Durán le
    habría ofrecido costear su defensa y un millón de euros a cambio de información contra Pedro Sánchez
    y su entorno. Según Público, pretende que se investigue el pago de 242.000 euros por parte de la
    editora de OKDiario para sufragar esa defensa. El escrito apunta a posibles delitos de obstrucción a
    la justicia, tráfico de influencias, falsedad en documento mercantil, cohecho, prevaricación y
    malversación; según Confilegal, es una calificación del partido denunciante, no una conclusión de la
    Fiscalía ni de un órgano judicial, y la Fiscalía de Madrid deberá valorar si inicia diligencias
    preprocesales o archiva. El PP niega haber ofrecido dinero y, según Confilegal, OKDiario defiende que
    los pagos respondían a un acuerdo sobre los derechos de un libro y una docuserie. Son alegaciones de
    una parte. Rige la presunción de inocencia.
  outlet: EFE (vía El Correo Gallego)
  url: https://www.elcorreogallego.es/espana/2026/11/16/fiscalia-madrid-denuncia-psoe-pagos-pp-koldo-136510542.html
  case_tag: Judicial
