  headline: >-
    Pedraz da al PSOE un nuevo plazo de 15 días para entregar «sin más demora» la
    documentación sobre sus contratos con abogados y rechaza que la consulta del partido al
    Consejo de la Abogacía suspenda el requerimiento judicial
  dek: >-
    Según The Objective e Infobae (23 de octubre de 2026) y Qué.es (24 de octubre), el juez
    de la Audiencia Nacional Santiago Pedraz dictó una providencia el 23 de octubre en las
    diligencias previas 150/2025 (caso Leire Díez) por la que concede al PSOE quince días
    para aportar, «sin más demora», la relación de letrados, despachos y consultoras
    contratados entre 2021 y 2025 por sus órganos centrales y territoriales. Rechaza que la
    consulta del partido al Consejo General de la Abogacía Española suspenda el
    requerimiento: «ninguna disposición legal atribuye a dicha iniciativa unilateral la
    virtualidad de paralizar una diligencia de investigación judicial». Rechaza también la
    invocación genérica del secreto profesional y exige que el partido identifique «de forma
    precisa e individualizada» los documentos afectados y las razones jurídicas que
    justificarían su exclusión. Es el tercer requerimiento sobre esta materia, tras los del
    6 y el 20 de octubre. Son diligencias de instrucción en curso. Rige la presunción de
    inocencia.
