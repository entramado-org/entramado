  headline: >-
    La secretaria de Zapatero, Gertrudis Alcázar, se acoge a su derecho a no declarar en
    la comisión SEPI del Senado: «Mi silencio no debe interpretarse como un desaire»
  dek: >-
    María Gertrudis Alcázar Jiménez, secretaria personal de José Luis Rodríguez Zapatero
    e investigada en el caso Plus Ultra —según Infobae (29-06-2026), por presuntos
    delitos de integración en organización criminal, tráfico de influencias y blanqueo
    de capitales en la causa que instruye el juez José Luis Calama—, compareció el 29 de
    junio de 2026 ante la comisión de investigación del Senado sobre la SEPI. Tras
    recordar su condición de investigada, anunció que, siguiendo asesoramiento jurídico,
    se mantendría en silencio. Según el Diario de Sesiones del Senado (sesión de 29 de
    junio de 2026, p.2), declaró: «Con todo respeto, espero comprendan que debo ser
    consecuente con este consejo legal. Mi silencio no debe interpretarse como un
    desaire a esta comisión, sino coherente con mi condición procesal y con el ejercicio
    de mis derechos fundamentales en el procedimiento penal que se tramita». Rige la
    presunción de inocencia.
