  headline: Pardo de Vera niega ante el juez Moreno haber favorecido adjudicaciones ferroviarias o conocido el cobro de comisiones en la pieza
    de obra pública del caso Koldo y cuestiona el valor probatorio de las conversaciones de Koldo García
  dek: Según Europa Press (vía El Progreso y Noticias de Álava, 4 de agosto de 2026), la expresidenta de ADIF Isabel Pardo de Vera presentó ante
    el juez Ismael Moreno de la Audiencia Nacional un escrito en el que niega haber favorecido adjudicaciones de obra ferroviaria o haber conocido
    el cobro de las presuntas comisiones ilegales que investiga la pieza de obra pública del caso Koldo, y cuestiona las conclusiones del informe
    de la UCO de la Guardia Civil. Sostiene que carecía de «capacidad autónoma, directa y eficaz para favorecer a determinadas empresas» al margen
    de la cadena ordinaria de informes, controles y autorizaciones; que las conversaciones de Koldo García recogen «preguntas, insinuaciones o
    expresiones» del exasesor con respuestas «evasivas» por su parte que «no revelan compromiso de resultado, orden de adjudicación, ni aceptación
    de una finalidad ilícita»; y que «el cargo no puede sustituir al acto, la conversación no puede sustituir al documento, la manifestación de
    Koldo no puede sustituir al expediente». Alega además que «no se identifica flujo patrimonial hacia ella, sociedad interpuesta, cuenta, bien,
    pago, promesa o ventaja económica asociada a su persona». La defensa solicita que el juez oficie a ADIF para que aporte la certificación final
    de los trabajos ejecutados por Levantina de Ingeniería y Construcción (LIC), una de las empresas investigadas; en una providencia, Moreno
    dio por recibido el escrito y preguntó a la Fiscalía Anticorrupción por la pertinencia de esa diligencia. Son diligencias de instrucción en
    curso; ninguno de los hechos está probado judicialmente. Rige la presunción de inocencia.
  quote: el cargo no puede sustituir al acto, la conversación no puede sustituir al documento, la manifestación de Koldo no puede sustituir al
