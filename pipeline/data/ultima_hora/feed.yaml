  headline: >-
    Calama rechaza suspender las inspecciones fiscales de la Agencia Tributaria a
    Zapatero, su familia y Julio Martínez en el caso Plus Ultra
  dek: >-
    Según The Objective (30 de julio de 2026), el juez José Luis Calama (Audiencia
    Nacional, DP 77/2024) rechazó paralizar las inspecciones fiscales que la Agencia
    Tributaria ha abierto a José Luis Rodríguez Zapatero, su mujer —que no está
    imputada—, sus hijas y el empresario Julio Martínez Martínez. La AEAT, que según
    Libertad Digital (3 de julio de 2026) había comunicado al juzgado esas actuaciones,
    pidió al magistrado suspenderlas para interrumpir los plazos de prescripción de una
    eventual deuda tributaria invocando la prejudicialidad penal; según The Objective,
    Hacienda comprueba IRPF, IVA e impuesto sobre el patrimonio entre 2021 y 2024 y, en
    el caso de Zapatero y su esposa, el impuesto temporal de solidaridad de las grandes
    fortunas. Calama compartió el criterio de la Fiscalía Anticorrupción: la suspensión
    es una medida excepcional, en la causa no se investigan por ahora hechos
    constitutivos de delito contra la Hacienda Pública y no hay identidad entre los
    hechos aunque coincidan las personas; la única excepción es la pieza separada de las
    joyas halladas en la oficina del expresidente, valoradas en 1,3 millones de euros,
    cuya posible relevancia fiscal «abre un abanico de posibilidades que impide, por sí
    solo, justificar la suspensión de las actuaciones inspectoras». El juez pide a la
    AEAT que ponga en conocimiento del juzgado cualquier indicio de delito fiscal que
    halle. La causa sigue en instrucción; ninguno de los hechos está probado
    judicialmente. Rige la presunción de inocencia.
  quote: >-
