    Leire Díez sobre la competencia de Pedraz, según Libertad Digital (02-07-2026)
  dek: >-
    Según Libertad Digital (2 de julio de 2026), una diligencia de ordenación de la
    Audiencia Nacional formó el Rollo de Sala de Apelación contra Autos nº 459/2026,
    designó magistrada ponente a Ana María Rubio Encinas y señaló el 24 de julio de 2026
    para resolver, previa deliberación y votación, los recursos de apelación de Santos
    Cerdán y Leire Díez contra la continuidad del juez Santiago Pedraz al frente de la
    investigación de las presuntas «cloacas» del PSOE. Ambos alegan que la causa ya
    estaba abierta en los juzgados de Plaza de Castilla, a cargo del magistrado Arturo
    Zamarriego (Juzgado de Instrucción nº 9 de Madrid). La Fiscalía Anticorrupción
    informó en contra de los recursos y pidió mantener la resolución recurrida, que
    declaró la competencia del Juzgado Central de Instrucción. Posteriormente, según EFE
    (vía Infobae, 20 de agosto de 2026), Díez recurrió la providencia en la que Pedraz
    reunía toda la causa en un solo procedimiento y sostuvo que la resolución por la que
    Pedraz reclamó la causa al juzgado de Madrid seguía recurrida y que la Sala de lo
    Penal no se había pronunciado sobre ella. Rige la presunción de inocencia.
