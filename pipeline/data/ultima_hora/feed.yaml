  headline: >-
    El exdirector de la Guardia Civil Leonardo Marcos niega ante Pedraz haber presionado
    a la UCO por la investigación de David Sánchez, aunque admite que pidió rapidez con
    el siguiente informe; el fiscal jefe de Badajoz declara como testigo
  dek: >-
    Según EFE (vía Infobae) y The Objective (10 de septiembre de 2026), Leonardo Marcos,
    director general de la Guardia Civil entre junio de 2023 y septiembre de 2024,
    declaró el 10 de septiembre como investigado ante el juez Santiago Pedraz (Audiencia
    Nacional, DP 150/2025), imputado a petición de la acusación popular unificada que
    ejerce el PP. El exjefe de la UCO Rafael Yuste había sostenido como testigo que, en
    una reunión del 12 de julio de 2024, Marcos calificó de «totalmente prospectivo y
    malintencionado» el informe sobre David Sánchez e instó a que el siguiente estuviera
    «analizado» y «sin nada». Según fuentes jurídicas citadas por EFE, Marcos negó haber
    presionado o interferido en el trabajo de la UCO y haber calificado así el informe:
    sostuvo que se reunió con los mandos para aclarar filtraciones a la prensa —una
    «cultura de la filtración»—, admitió que pidió a la UCO acabar con rapidez el
    siguiente informe por considerar «atípico y llamativo» que una investigación sobre
    Badajoz se encargara a esa unidad, negó haber dado indicaciones sobre el contenido y
    dijo no conocer a Antonio Balas. Marcos es el tercer responsable del instituto armado
    imputado en la causa, tras la directora Mercedes González y su número dos. El mismo
    día declaró como testigo el fiscal jefe de Badajoz, José Luis Alonso Tejuca, que
    explicó que remitió por WhatsApp una querella contra Leire Díez al entonces número
    dos de la Fiscalía General, Diego Villafañe, y negó haber recibido instrucciones sobre
    el caso de David Sánchez. Son diligencias de instrucción en curso; ninguno de los
    hechos está probado judicialmente. Rige la presunción de inocencia.
  quote: >-
    atípico y llamativo
  outlet: EFE (vía Infobae)
  url: https://www.infobae.com/espana/agencias/2026/09/10/exdirector-de-la-guardia-civil-niega-ante-el-juez-del-caso-leire-haber-presionado-a-la-uco/
