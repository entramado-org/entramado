  headline: >-
    El auto de inhibición de Zamarriego apunta que Cerdán «habría acordado
    remunerar a Leire Díez por sus servicios con los fondos del partido» y
    que la trama alcanza a personas de mayor jerarquía que la propia Díez
  dek: >-
    Según Europa Press (vía The Objective e Infobae, 13 de agosto de 2026),
    el auto por el que el juez Arturo Zamarriego (Juzgado de Instrucción
    nº 9 de Madrid) acordó el 11 de agosto inhibirse en favor del juez
    Santiago Pedraz (Audiencia Nacional, DP 150/2025) desgrana los indicios
    que sustentan su decisión. Zamarriego señala que, tras los registros
    efectuados en viviendas y empresas, se constató que Leire Díez «habría
    contado con el impulso y soporte intelectual y/o financiero de Santos
    Cerdán, quien habría acordado remunerar a Leire Díez por sus servicios
    con los fondos del partido»; que el exvicepresidente andaluz Gaspar
    Zarrías y los abogados Jacobo Teijelo e Ismael Oliver «habrían prestado
    sus sociedades mercantiles como vehículo para canalizar dichos pagos»;
    y que la gerente del PSOE Ana María Fuentes «habría emitido las
    oportunas órdenes de encargo sobre las que se habrían emitido mendaces
    facturas» que permitieron transferir fondos a Díez y al empresario
    Javier Pérez Dolset. El magistrado añade que los investigados de su
    pieza —Díez, Pérez Dolset y el periodista Pere Rusiñol— «podrían no
    ocupar un lugar principal en dicho entramado», mientras que la
    investigación de Pedraz «se dirige contra otras personas que podrían
    tener mayor nivel de jerarquía». Son diligencias de instrucción en
    curso; ninguno de los hechos está probado judicialmente. Rige la
    presunción de inocencia.
  quote: >-
    habría acordado remunerar a Leire Díez por sus servicios con los fondos
    del partido
