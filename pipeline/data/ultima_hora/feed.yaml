  headline: >-
    El colaborador de la Guardia Civil que organizó la reunión Díez–Villalba declara
    ante Pedraz que Díez decía actuar «en nombre del one», según El Independiente
  dek: >-
    Según El Independiente (29 de julio de 2026), Daniel Mateo, colaborador de la
    Jefatura de Información de la Guardia Civil, declaró ese día como testigo ante el
    juez Santiago Pedraz en la Audiencia Nacional. Según fuentes jurídicas citadas por
    el diario, Mateo organizó e informó a la Jefatura de la reunión de marzo de 2025 en
    un bar de Leganés entre Leire Díez y el comandante Rubén Villalba. Relató que Díez
    se presentó como colaboradora de Santos Cerdán y decía actuar «en nombre del one»,
    expresión con la que, según el periódico, se referiría a Pedro Sánchez. También
    sostuvo que Díez le trasladó que en Moncloa había enfado por no poder frenar
    determinadas investigaciones judiciales y que, en su presencia, mantuvo una llamada
    con una mujer a la que saludó como «Mercedes». Mateo interpretó que se trataba de
    Mercedes González, directora general de la Guardia Civil, que figuraba como
    investigada en la causa según la misma información. Preguntado por la credibilidad
    de Díez, afirmó que sus palabras le inspiraban credibilidad y miedo. Es la versión
    de un testigo en una instrucción en curso, referida por fuentes jurídicas a los
    medios; nada de ello está probado judicialmente. Rige la presunción de inocencia.
