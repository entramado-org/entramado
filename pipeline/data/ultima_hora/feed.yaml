    de mayo de 2026 en la sede del PSOE en Ferraz y en la Dirección General de la
    Guardia Civil, el juez Santiago Pedraz (Audiencia Nacional, DP 150/2025) dirigió un
    escrito a la Unidad Central Operativa (UCO) en el que le ordenó informar de los
    avances de la investigación solo a él y a la Fiscalía Anticorrupción, y mantener «la
