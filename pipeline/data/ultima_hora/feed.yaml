    de Teijelo
  dek: >-
    Según El Independiente (2 de julio de 2026), el juez Santiago Pedraz (Audiencia
    Nacional, DP 150/2025) ha pedido al PSOE en una providencia, a solicitud de la
    Fiscalía Anticorrupción, que informe de quién firmó el contrato de asesoramiento
    jurídico con el abogado Jacobo Teijelo —defensor de Santos Cerdán e investigado en
    la causa—, qué cargo ocupaba entonces y en virtud de qué acuerdo actuó. Según un
    informe de la UCO citado por ese diario, Teijelo emitió tres facturas al partido:
    una de 75.000 euros (más IVA) el 20 de enero de 2025 y dos de 25.000 euros en
    febrero y marzo. Según El Español (25 de junio de 2026), el PSOE le pagó al menos
    75.000 euros y no le abonó las otras dos. El auto de 26 de mayo de 2026 (p.15)
    señala que la nota de encargo fue rubricada por la gerente del PSOE Ana María
    Fuentes, también investigada. Rige la presunción de inocencia.
