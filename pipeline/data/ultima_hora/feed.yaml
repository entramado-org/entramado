  dek: >-
    Según El Español (8 de julio de 2026), Francisco Ortega, exjefe de seguridad de la
    empresa pública Correos, que estuvo presente en una de las dos reuniones que la
    investigada Leire Díez mantuvo en marzo de 2025 con el comandante Rubén Villalba,
    declaró el martes 7 de julio como testigo ante el juez Santiago Pedraz (Audiencia
    Nacional, DP 150/2025). Según el diario, Ortega testificó que en esa reunión Díez
    preguntó a Villalba si conocía «comportamientos indecorosos, deshonrosos e ilícitos»
    de miembros de la Guardia Civil y que fue entonces cuando Díez aludió a tener «mucho
    trabajo, entre lo de Badajoz y lo de la esposa», expresión que el diario interpreta
    como una referencia a los procedimientos judiciales sobre David Sánchez y Begoña
    Gómez; preguntado por la Fiscalía, el testigo dijo entender que se trataría de
    «recopilación de información». Ortega declaró que conoció a Díez cuando ella
    trabajaba en Correos, que fue Koldo García quien le remitió su contacto por unos
    «problemas» de seguridad en la empresa postal y que recurrió a un intermediario para
    organizar el encuentro con Villalba. Unos minutos antes declaró el propio Villalba,
    que ratificó que Díez le ofreció interceder en su favor ante la directora de la
    Guardia Civil, Mercedes González. Son testimonios en una instrucción en curso, no
    hechos probados; rige la presunción de inocencia.
