  headline: >-
    La UCO atribuye a Juanma Serrano, exjefe de gabinete de Sánchez y expresidente de
    Correos, una «participación preeminente» en la trama del caso Leire y el «enchufe»
    de Leire Díez en Correos, según El Español
  dek: >-
    Según El Español (9 de julio de 2026), un informe de la UCO remitido al juez
    Santiago Pedraz (Audiencia Nacional, DP 150/2025) atribuye a Juan Manuel Serrano
    Quintana —presidente de Correos entre 2018 y 2023 y antes jefe de gabinete de Pedro
    Sánchez en la secretaría general del PSOE— una «participación preeminente» en la
    presunta trama, incluida la «desestabilización» de causas judiciales. Según el
    diario, el informe sostiene que Serrano dio el visto bueno a la colocación en
    Correos de la investigada Leire Díez, que el también investigado Vicente Fernández
    (expresidente de la SEPI) le había planteado, y que se permitió modificar los
    requisitos del puesto en beneficio de Díez, que ocupó puestos de relevancia en
    Correos entre 2021 y 2024. Tras hablar con Serrano, Fernández escribió a Díez en
    mayo de 2021: «Me ha dicho 'Ok, vamos hablando'. No te preocupes, lo tuyo sale». En
    ese momento Serrano no tenía la condición de investigado. (Actualización 10-jul:
    Pedraz acordó su imputación; ver el ítem del 10 de julio.) Rige la presunción de
    inocencia.
