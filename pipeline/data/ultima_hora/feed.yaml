  headline: >-
    El juez Calama pide a las partes prorrogar la instrucción del caso Plus Ultra, cuyo
    plazo vence el 28 de noviembre, por diligencias de investigación pendientes
  dek: >-
    Según EFE (vía Infobae, Deia y El Debate) (26 de octubre de 2026), el juez de la
    Audiencia Nacional José Luis Calama ha acordado en una providencia dar audiencia al
    Ministerio Fiscal y a las demás partes personadas por un plazo de cinco días para que
    aleguen sobre la procedencia de prorrogar la instrucción del caso Plus Ultra, que
    acabaría el 28 de noviembre, al estar pendientes diversas diligencias de investigación
    que no sería posible concluir antes de esa fecha. La prórroga todavía no ha sido
    acordada. El juez investiga al expresidente José Luis Rodríguez Zapatero como presunto
    «vértice» de una supuesta red de tráfico de influencias en favor de la aerolínea, en el
    marco del préstamo público de 53 millones de euros que obtuvo en 2021. Son diligencias
    de instrucción en curso. Rige la presunción de inocencia.
