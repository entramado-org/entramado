  headline: >-
    La Audiencia de Tarragona aplaza al 21 de septiembre la decisión sobre si el caso
    Montoro se traslada a Madrid por la baja de la magistrada ponente
  dek: >-
    Según Europa Press (vía Infobae) y Catalunyapress (14 de septiembre de 2026), la
    Audiencia Provincial de Tarragona ha aplazado hasta el 21 de septiembre la
    deliberación y el fallo sobre el recurso de apelación de la defensa de Equipo
    Económico contra la decisión del juez Rubén Rus (Juzgado de Instrucción nº 2 de
    Tarragona), que en abril rechazó ceder a un juzgado de Madrid la causa en la que se
    investiga al exministro de Hacienda Cristóbal Montoro. Según el escrito al que tuvo
    acceso Europa Press, la magistrada ponente, Susana Calvo, está de baja laboral y,
    acordada su sustitución por la magistrada María del Prado Escoda, «se deja sin efecto
    la votación y fallo prevista para el día de hoy y se señala para la deliberación y
    fallo el próximo 21 de septiembre». La decisión puede impugnarse en reposición ante
    el letrado de la Administración de Justicia en un plazo de tres días. Ningún hecho
    está probado judicialmente. Rige la presunción de inocencia.
