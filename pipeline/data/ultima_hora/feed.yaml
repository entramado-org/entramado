- iso: '2026-11-18'
  date: 18 nov 2026
  headline: >-
    El juez de Teruel que investiga el caso Forestalia se inhibe en favor de la Audiencia Nacional
    por su conexión con el caso Leire
  dek: >-
    Según EFE (vía Infobae) y El Independiente (18 de noviembre de 2026), el juez de Teruel Juan José
    Cortés ha acordado, en un auto fechado el 17 de noviembre, inhibirse en favor de la Audiencia
    Nacional al apreciar conexión con las diligencias que instruye Santiago Pedraz, de las que la
    causa turolense sería «una parte o rama». Según EFE, el auto recoge que entre mayo y julio de
    2021 se celebraron reuniones en el domicilio en Zaragoza del fundador de Forestalia, Fernando
    Samper, con Santos Cerdán y Antxon Alonso, y que la empresa y su fundador aparecen en la
    investigación de la UCO vinculados al grupo «Hirurok». El juez apunta que la compraventa de las
    sociedades promotoras de dos parques fotovoltaicos podría haber servido para obtener fondos con
    los que pagar a directivos del Ministerio para la Transición Ecológica, hipótesis que el propio
    auto considera pendiente de confirmar con los informes policiales. Según El Independiente, la
    Audiencia Nacional aún debe aceptar la inhibición y la acusación popular de ADIVE estudia
    recurrirla. En la causa de Teruel no se ha tomado declaración judicial a ningún investigado. Rige la
    presunción de inocencia.
  outlet: EFE (vía Infobae)
  url: https://www.infobae.com/espana/agencias/2026/11/18/el-juez-del-caso-forestalia-se-inhibe-a-favor-de-pedraz-por-la-conexion-con-el-caso-leire/
