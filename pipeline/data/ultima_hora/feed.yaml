  url: https://www.infobae.com/espana/2026/07/24/el-juez-rechaza-el-recurso-de-jesica-rodriguez-y-mantiene-su-imputacion-al-apreciar-indicios-de-malversacion-por-los-sueldos-cobrados-en-empresas-publicas-sin-trabajar/
