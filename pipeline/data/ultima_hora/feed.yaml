    Calama cita el 16 de octubre como investigado al financiero holandés Simon Leendert
    Verhoeven, al que dejó en libertad con cautelares tras guardar silencio
  dek: >-
    Según The Objective (1 de octubre de 2026), el juez de la Audiencia Nacional José Luis
    Calama ha citado a declarar como investigado el 16 de octubre, a las 9 horas, a Simon
    Leendert Verhoeven, financiero holandés que concedió préstamos a Plus Ultra. Según EFE
    (vía Infobae, 25 de septiembre de 2026), Verhoeven, detenido en Alemania y entregado a
    España, guardó silencio en su primera comparecencia alegando que no había podido leer
    la causa, y Calama lo dejó en libertad con prohibición de salir de España, obligación
    de comparecer en un juzgado cada dos días y de comunicar un domicilio. Según el
    sumario citado por ambos medios, los investigadores le atribuyen la presunta gestión,
    junto a Luis Felipe Baca Arbulu, de una organización dedicada al blanqueo de
    capitales. Rige la presunción de inocencia.
