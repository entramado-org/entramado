  headline: >-
    El primer abogado de Ábalos, citado a declarar como testigo ante Pedraz por la
    presunta gestión de Leire Díez para que el PSOE pagara sus honorarios
  dek: >-
    Según EFE (vía Infobae, 13 de julio de 2026), José Aníbal Álvarez, primer letrado
    del exministro José Luis Ábalos en el caso Koldo, estaba citado como testigo ese
    lunes ante el juez Santiago Pedraz para aclarar las gestiones de Leire Díez a las
    que alude la UCO en uno de sus informes. Según el atestado recogido por EFE, los
    investigadores deducen de mensajes intervenidos que Díez habría ofrecido que el PSOE
    abonase los honorarios de Álvarez y de Ismael Oliver, quienes defendieron durante un
    tiempo a Ábalos y a Koldo García, respectivamente. En el caso de Álvarez, el informe
    señala que no se habrían respetado los plazos y vías acordados para el pago y que
    Díez habría intermediado; añade, remitiéndose a fuentes abiertas, que el letrado
    acabó rechazando la defensa por incumplimiento de pagos. Son deducciones de una
    instrucción en curso, no hechos probados; rige la presunción de inocencia.
