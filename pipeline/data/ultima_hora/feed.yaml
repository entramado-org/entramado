  headline: >-
    Calama rectifica y admite a trámite la impugnación de las ocho primeras resoluciones
    incluidas en el incidente de nulidad de Zapatero en el caso Plus Ultra
  dek: >-
    Según Infobae (31 de julio de 2026), el juez José Luis Calama rectificó en un nuevo
    auto la inadmisión por extemporáneo que dictó el 24 de julio y admitió a trámite el
    incidente de nulidad de actuaciones de la defensa de José Luis Rodríguez Zapatero
    respecto de las ocho primeras resoluciones impugnadas, entre ellas la apertura de la
    pieza, la incorporación de las diligencias de la Fiscalía Anticorrupción, varias
    autorizaciones de entradas y registros y la inhibición del Juzgado de Instrucción nº
    15 de Madrid en favor de la Audiencia Nacional. El juez reconoce un error en el
    cómputo del plazo: aunque las partes accedieron a la causa el 25 de mayo, las
    diligencias de la Fiscalía Anticorrupción no estuvieron disponibles hasta el 29 de
    mayo, por lo que el escrito presentado el 25 de junio entró dentro de plazo. Quedan
    fuera del incidente, por haber sido recurribles en su momento, las resoluciones que
    autorizaron los registros en el despacho de Zapatero y en las empresas Whathefav (de
    sus hijas), Softgestor e Inteligencia Prospectiva, el bloqueo parcial de cuentas y
    la pieza por presunto delito contra la Hacienda Pública y contrabando. El juez da
    traslado a las partes por cinco días. La causa sigue en instrucción; ninguno de los
    hechos está probado judicialmente. Rige la presunción de inocencia.
  outlet: Infobae
  url: https://www.infobae.com/espana/2026/07/31/el-juez-calama-rectifica-y-admite-a-tramite-parte-del-incidente-de-nulidad-de-zapatero-por-el-caso-plus-ultra/
