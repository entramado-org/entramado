  headline: >-
    Moreno cita como investigados a Jésica Rodríguez, al hermano de Koldo y a un
    exdirector de Adif por su presunta participación en la contratación irregular en
    empresas públicas
  dek: >-
    Según Infobae (03-07-2026), el juez Ismael Moreno, instructor del caso Koldo en la
    Audiencia Nacional, citó como investigados para el 20 de julio a Jésica Rodríguez
    —expareja del exministro José Luis Ábalos—, a Joseba García —hermano de Koldo
    García— y a Ignacio Zaldívar —entonces director de Gestión Administrativa de Adif—
    por presuntos delitos de malversación y tráfico de influencias relacionados con la
    contratación de Rodríguez en Ineco y Tragsatec. El medio recoge que el Supremo había
    declarado probado que Rodríguez fue contratada por ambas empresas sin llegar a
    trabajar y que percibió 34.450 euros netos de Ineco y 9.500,54 euros de Tragsatec.
    Según la Fiscalía, citada por Infobae, Joseba habría facilitado datos para elaborar
    los partes de trabajo y contribuido a eludir los controles internos de Ineco;
    Zaldívar habría realizado gestiones para que Rodríguez fuera contratada por
    Tragsatec al finalizar su contrato en Ineco, sin entrevista previa. La noticia daba
    cuenta de una citación en una instrucción en curso, no de una condena de los
    citados; rige la presunción de inocencia.
