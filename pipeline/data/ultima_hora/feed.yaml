  dek: >-
    Según EFE (vía The Objective, 17 de agosto de 2026), el juez de la Audiencia
    Nacional Santiago Pedraz ha asumido toda la investigación a la exmilitante del PSOE
    Leire Díez por presuntas maniobras contra jueces, fiscales y mandos de la Guardia
    Civil: en una providencia a la que tuvo acceso EFE, acuerda que las diligencias
    practicadas desde hace más de un año por Arturo Zamarriego, juez de instrucción del
    tribunal de instancia número 9 de Madrid, se unan a las que él ha llevado a cabo en
    la Audiencia Nacional. Zamarriego, a instancias del fiscal, había aceptado la semana
    anterior inhibirse en favor de la Audiencia Nacional, con lo que renunció a la
    investigación que inició en verano de 2025 a Leire Díez, al empresario Javier Pérez
    Dolset y al periodista Pere Rusiñol por presuntos delitos de cohecho y tráfico de
    influencias. Son diligencias de instrucción en curso; ninguno de los hechos está
    probado judicialmente. Rige la presunción de inocencia.
