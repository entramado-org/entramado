  headline: >-
    La Audiencia de Badajoz aclara la inhabilitación de David Sánchez: pierde la plaza
    ligada a su condena pero conserva su condición de empleado público
  dek: >-
    Según Infobae (16 de septiembre de 2026), la Sección Primera de la Audiencia
    Provincial de Badajoz dictó un auto de aclaración de la sentencia del caso David
    Sánchez. La inhabilitación especial impuesta a David Sánchez comporta la pérdida de la
    plaza cuya transformación dio lugar a su condena, aunque ya hubiera cesado
    voluntariamente en ella, y le impide obtener ese u otro puesto electivo o discrecional
    en cualquier Administración durante la condena, pero no le priva de su condición de
    empleado público. El auto precisa en términos equivalentes la situación del resto de
    condenados, entre ellos Miguel Ángel Gallardo, presidente de la Diputación cuando
    ocurrieron los hechos. La sentencia no es firme. Rige la presunción de inocencia.
