  headline: >-
    La Audiencia Nacional practica un nuevo clonado del móvil de Juan Manuel Serrano
    tras rechazar este el volcado de la UCO
  dek: >-
    Según EFE (vía Infobae, 18 de agosto de 2026), Juan Manuel Serrano acudió este
    martes con su abogado a la Audiencia Nacional. Serrano es expresidente de Correos,
    fue jefe de gabinete de Pedro Sánchez en el PSOE entre 2014 y 2018 y está
    investigado en el caso Leire desde el 10 de julio. El juez Santiago Pedraz le había
    citado para «verificar» el clonado de su móvil o, en su caso, realizar uno nuevo. La
    letrada de la Administración de Justicia le preguntó si aceptaba el clonado que los
    agentes de la UCO de la Guardia Civil practicaron el 14 y 15 de julio. Tras
    rechazarlo Serrano, se procedió a un nuevo clonado, una diligencia prevista de unas
    ocho horas con el móvil en una sala precintada de la Audiencia Nacional. Serrano
    debía volver el miércoles con su abogado a recoger una copia en un disco duro. Su
    defensa había pedido anular el clonado y que se le devolviera el terminal sin volver
    a clonarlo, pretensiones que, según las fuentes de EFE, el juez rechazó días antes.
    Según El Español (19 de agosto), el primer clonado se hizo sin que Serrano estuviera
    presente. Son diligencias de instrucción en curso; ninguno de los hechos está
    probado judicialmente. Rige la presunción de inocencia.
