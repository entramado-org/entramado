  headline: >-
    La UCO sitúa a Cerdán y Koldo García en un Kia Sportage cuya financiación atribuye a
    Servinabar para desplazarse juntos al Congreso de los Diputados
  dek: >-
    Según edatv.news, que atribuye la información en origen a ABC (27 de julio de 2026),
    el informe patrimonial de la UCO de la Guardia Civil remitido al juez Ismael Moreno
    (Audiencia Nacional) sitúa a Santos Cerdán y Koldo García en un Kia Sportage cuya
    financiación atribuye la UCO a Servinabar 2000 —la empresa de Joseba Antxon Alonso—,
    utilizado para acudir al Congreso de los Diputados: en un episodio reconstruido del
    15 de febrero de 2017, Koldo García viajó hasta Milagro (Navarra), donde residía
    Cerdán, y ambos siguieron viaje hasta Madrid en ese vehículo, localizado después
    frente al Congreso. Los investigadores sostienen que asumir el coste de ese turismo
    «formaría parte de las ventajas que, presuntamente, recibió Cerdán» por su vínculo
    con la empresa navarra. Según Infobae (17 de julio de 2026), el informe patrimonial
    de la UCO sobre Cerdán ya había hallado vínculos entre pagos en efectivo de un
    directivo de Acciona y el renting de un Toyota Rav 4 de Cerdán, y cifraba en
    323.178,41 euros lo que Cerdán y su familia habrían recibido de Servinabar o de
    otras compañías de Antxon Alonso entre 2015 y 2024. Son diligencias de instrucción
    en curso; ninguno de los hechos está probado judicialmente. Rige la presunción de
    inocencia.
