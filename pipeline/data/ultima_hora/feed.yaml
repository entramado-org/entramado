  headline: >-
    Vox anuncia recurso de apelación ante el TSJ de Extremadura para que David Sánchez
    sea condenado también por tráfico de influencias
  dek: >-
    Según The Objective (20 de julio de 2026), el portavoz de Vox, José Antonio Fúster,
    anunció ese lunes que el partido interpondrá recurso de apelación ante el Tribunal
    Superior de Justicia de Extremadura contra la decisión de la Sección Primera de la
    Audiencia Provincial de Badajoz de absolver a David Sánchez —hermano del presidente
    del Gobierno— del delito de tráfico de influencias. La sentencia del 14 de julio lo
    condenó a nueve años de inhabilitación como autor por cooperación necesaria de un
    delito de prevaricación administrativa (fallo, p. 374). Fúster afirmó que los
    servicios jurídicos de Vox están convencidos de que hay pruebas suficientes para esa
    condena adicional por participar en un proceso «destinado a simular su legalidad».
    La sentencia no es firme mientras estén abiertos los plazos de apelación para todas
    las partes. Rige la presunción de inocencia.
