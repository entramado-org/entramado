  headline: >-
    Vox recurre ante el TSJ de Extremadura para que David Sánchez, Gallardo y Carrero
    sean condenados también por tráfico de influencias
  dek: >-
    Según The Objective (30 de julio de 2026), Vox —acusación popular en la causa—
    recurrió ante el Tribunal Superior de Justicia de Extremadura la sentencia de la
    Audiencia Provincial de Badajoz del 14 de julio, que condenó a David Sánchez
    —hermano del presidente del Gobierno— a nueve años de inhabilitación por
    prevaricación y lo absolvió del tráfico de influencias. En un escrito de más de cien
    páginas firmado por la abogada Marta Castro, Vox sostiene que «el mismo acervo
    probatorio que sustentó la condena por prevaricación» acredita también el tráfico de
    influencias, con «un cuadro de 33 indicios convergentes», y considera que existen
    indicios de que la Diputación de Badajoz contrató a David Sánchez por ser hermano
    del presidente del Gobierno. Pide que se condene también por ese delito al
    expresidente de la Diputación Miguel Ángel Gallardo y al exasesor de Moncloa Luis
    María Carrero. Según el medio, Vox sostiene que la absolución por tráfico de
    influencias impide imponerles penas accesorias como la prohibición de contratar con
    el sector público o la pérdida de subvenciones. Vox ya había anunciado el recurso el
    20 de julio (The Objective, 20 de julio de 2026). La sentencia de la Audiencia
    condenó a Gallardo por dos delitos de prevaricación administrativa a sendas penas de
    nueve años de inhabilitación especial, y a Carrero, como cooperador necesario de un
    delito de prevaricación administrativa, a nueve años (fallo, pp. 373-374). La
    sentencia no es firme mientras se resuelven las apelaciones. Rige la presunción de
    inocencia.
  quote: >-
    nutren con igual solidez
