  headline: >-
    El Tribunal de Cuentas notifica a la Diputación de Badajoz como «entidad pública
    presuntamente perjudicada» y le da cinco días para decidir si reclama las
    retribuciones de David Sánchez
  dek: >-
    Según COPE (7 de septiembre de 2026) y Que.es (8 de septiembre, a partir de El
    Periódico), el Departamento 2º de la Sección de Enjuiciamiento del Tribunal de
    Cuentas ha dictado una diligencia de ordenación, fechada el 2 de septiembre, que
    admite la personación de Iustitia Europa, Vox y HazteOír.org y concede «el plazo de
    cinco días a la Diputación Provincial de Badajoz, como entidad pública presuntamente
    perjudicada», para que alegue sobre el nombramiento de un delegado instructor o pida
    el archivo; después se dará traslado al Ministerio Fiscal y a las partes personadas.
    El procedimiento examina si la creación de los puestos ocupados por David Sánchez
    (coordinador de los conservatorios y jefe de la Oficina de Artes Escénicas) causó un
    perjuicio a las arcas provinciales, tras la sentencia de la Audiencia Provincial de
    Badajoz del 14 de julio de 2026 que lo condenó a nueve años de inhabilitación por
    prevaricación administrativa —no firme— y que no ordenó devolver las nóminas al no
    considerar perjudicadas a las acusaciones populares. Según los escritos de Iustitia
    Europa citados por Que.es, Sánchez habría percibido unos 340.572 euros entre julio de
    2017 y mayo de 2025, y su colaborador Luis Carrero otros 86.988 euros. No existe
    orden de devolución: son actuaciones previas que pueden acabar en reclamación o en
    archivo. Rige la presunción de inocencia.
