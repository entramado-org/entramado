  headline: >-
    Leire Díez se querella ante Pedraz contra el PP por un vídeo con IA que le atribuye
    «haber contratado a matones para quitar de en medio a una jueza»
  dek: >-
    Según elDiario.es, El Español, Vozpópuli y Europa Press (23 de octubre de 2026), Leire
    Díez, investigada en el caso Leire que instruye el juez de la Audiencia Nacional
    Santiago Pedraz, ha presentado a través de su abogada una querella ante ese juez contra
    el Partido Popular por un vídeo con inteligencia artificial publicado en las redes del
    partido el miércoles 21 de octubre, en el que una recreación digital suya dice «haber
    contratado a matones para quitar de en medio a una jueza», en alusión a la magistrada
    Beatriz Biedma. Su defensa sostiene que esos hechos son «absoluta y rotundamente falsos»
    y que el PP actuó «con pleno conocimiento de la falsedad». La querella le atribuye
    presuntos delitos de calumnias con publicidad, contra la integridad moral y suplantación
    de identidad digital, y pide la retirada cautelar del vídeo y la declaración del partido
    como investigado. Rige la presunción de inocencia.
