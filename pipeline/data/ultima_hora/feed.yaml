  headline: >-
    Jacobo Teijelo declara como investigado ante el juez Pedraz en el caso Leire
  dek: >-
    Según El Español (25 de junio de 2026), el abogado Jacobo Teijelo, defensor de
    Santos Cerdán, declaró ese día como investigado ante el juez de la Audiencia
    Nacional Santiago Pedraz, instructor del caso Leire (DP 150/2025), y confirmó haber
    visitado la sede de la Fiscalía junto a Leire Díez, aunque no quiso aclarar el
    motivo de esas visitas. Según ese diario, confirmó también que el PSOE le contrató
    para analizar resoluciones judiciales y la viabilidad de procedimientos que
    afectaban al partido; el partido le pagó al menos 75.000 euros y no le abonó otras
    dos facturas que suman 50.000. El auto de 26 de mayo de 2026 considera penalmente
    relevante su actuación en relación con presuntos delitos de revelación de secretos,
    cohecho y contra las instituciones del Estado (p.19) y señala que habría recibido al
    menos 125.000 euros del PSOE mediante una facturación que califica de «falaz»
    (p.15). Rige la presunción de inocencia.
