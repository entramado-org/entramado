- iso: '2026-11-19'
  date: 19 nov 2026
  headline: >-
    El juez Moreno cita al comandante Villalba como investigado en el caso Koldo para el 23 de
    noviembre, a petición del propio guardia civil
  dek: >-
    Según Europa Press (vía Demócrata) y The Objective (19 de noviembre de 2026), el juez de la
    Audiencia Nacional Ismael Moreno ha citado para el 23 de noviembre, en calidad de investigado en
    el caso Koldo, al comandante de la Guardia Civil Rubén Villalba. Según Europa Press, el auto
    estima la solicitud del propio Villalba, que pidió comparecer de forma voluntaria para declarar
    sobre las supuestas entregas de dinero de Víctor de Aldama, y recoge que Aldama admitió ante el juez «haber entregado alrededor de 25.000 euros» al
    comandante. El instructor rechaza abrir una pieza separada secreta y reclamar al Ministerio del
    Interior una certificación sobre si Villalba estuvo autorizado entre 2017 y 2023 a recibir o
    gestionar fondos reservados, como pedía su defensa. Es una citación: la declaración aún no se ha
    celebrado. Rige la presunción de inocencia.
  outlet: Europa Press (vía Demócrata)
  url: https://www.democrata.es/tribunales/el-juez-llama-a-declarar-como-imputado-al-comandante-ruben-villalba-el-23-de-noviembre-en-el-caso-koldo/
