  headline: >-
    Rafael Salvador reconoce ante Pedraz reuniones con Leire Díez y afirma que ella le
    dijo «A mí me manda quien más manda», según Libertad Digital
  dek: >-
    Rafael Salvador, a quien, según la UCO, los investigados llamaban 'Torrente' (EFE
    vía Infobae, 10-07-2026), y que según Libertad Digital estuvo al frente de la Unidad
    de Policía Nacional adscrita a los Juzgados de Sevilla, declaró como testigo el
    viernes 10 de julio de 2026 en el caso Leire ante el juez Santiago Pedraz, titular
    del Juzgado Central de Instrucción nº 5 de la Audiencia Nacional. Según fuentes
    jurídicas citadas por Libertad Digital (10-07-2026), reconoció haber tenido dos
    reuniones con Leire Díez y otra en la que también habría estado presente Javier
    Pérez Dolset. Precisó que Díez contactó con él por primera vez en 2020 y que Dolset
    lo hizo después, en 2024. Según ese diario, Salvador contó que en una reunión
    celebrada en 2024 Díez le dijo: «A mí me manda quien más manda», y que él habría
    respondido: «Para mi como si te manda el Papa». También habría precisado que no le
    pidieron nada y que, si lo hubieran hecho, se habría negado. Además, reconoció que
    no fue consciente de que le grabaron. La finalidad de esos encuentros la atribuye el
    informe de la UCO, no el testigo. Según EFE, la UCO sitúa las reuniones de Díez con
    este policía el 13 de febrero y el 14 de julio de 2020, en Sevilla y en Madrid, con
    la finalidad de obtener información «que pudiera comprometer a la magistrada Alaya»,
    la juez del caso ERE. EFE añade que el informe alude también a otro encuentro en
    julio de 2024 en Zaragoza. Son declaraciones de un testigo e interpretaciones de un
    informe policial en una instrucción en curso, no hechos probados. Rige la presunción
    de inocencia.
  outlet: Libertad Digital
