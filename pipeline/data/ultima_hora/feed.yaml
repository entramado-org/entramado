  headline: >-
    El juez Peinado da cinco días a Begoña Gómez para acreditar que el pasaporte
    recuperado solo se usó para viajar a la graduación de su hija en el Reino Unido
  dek: >-
    Según Infobae (13 de julio de 2026), el juez Juan Carlos Peinado (Juzgado de
    Instrucción nº 41 de Madrid) dio en una providencia un plazo «improrrogable» de
    cinco días a la defensa de Begoña Gómez para acreditar que el pasaporte que se le
    entregó excepcionalmente el 8 de julio se usó únicamente para viajar al Reino Unido,
    entre el 8 y el 10 de julio, a la graduación universitaria de su hija,
    desplazamiento autorizado por el juez sustituto. El instructor señaló que «no consta
    ninguna diligencia de salida ni entrada en los días autorizados» y advirtió de que,
    de no acreditarse, los hechos podrían constituir un presunto delito de
    quebrantamiento de medida cautelar (artículo 468.1 del Código Penal), en relación
    con las medidas —retirada del pasaporte y prohibición de salir de España— acordadas
    el 20 de junio. Según Infobae (15 de julio de 2026), la defensa aportó después los
    billetes de avión, y según Infobae (16 de julio de 2026) la Audiencia Provincial de
    Madrid le devolvió el pasaporte. Rige la presunción de inocencia.
