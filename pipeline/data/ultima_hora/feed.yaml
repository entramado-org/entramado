  headline: >-
    Pedraz cita como investigados a la gerente del PSOE y al exabogado de Koldo García
    para declarar el 9 de septiembre en el caso Leire
  dek: >-
    Según Libertad Digital (14-07-2026), el juez Santiago Pedraz ha citado mediante
    providencia, en calidad de investigados, a Ana María Fuentes Pacheco —gerente del
    PSOE— y a Ismael Oliver Romero —exabogado de Koldo García— para que declaren el 9 de
    septiembre de 2026 (Fuentes a las 10:00 h, Oliver a las 10:30 h), en el caso por el
    que se investigan las presuntas cloacas del PSOE. Según uno de los informes de la
    UCO que cita Libertad Digital, Fuentes, «en calidad de directora gerente federal del
    PSOE», habría sido «la persona encargada, con la intermediación de Leire y bajo las
