  headline: >-
    Zarrías recurre el rastreo de ocho cuentas suyas y tres de su empresa en el caso
    Leire y pide ceñirlo a la cuenta desde la que se pagó a Leire Díez
  dek: >-
    Según EFE (vía Infobae, 31 de julio de 2026), el exvicepresidente de la Junta de
    Andalucía Gaspar Zarrías presentó un recurso de reforma contra el auto en el que el
    juez Santiago Pedraz (Audiencia Nacional, DP 150/2025) ordenó rastrear desde 2022
    ocho cuentas de Zarrías y tres de su empresa Zaño Consultores. Su defensa pide que
    el mandamiento se limite a la cuenta desde la que en 2024 se pagó a Leire Díez, y
    solo a los saldos y movimientos desde el 1 de enero de 2024. Considera que analizar
    el resto de sus movimientos bancarios es una investigación prospectiva. El recurso
    reprocha a la UCO que no haya concretado las cuentas relacionadas con la causa y que
    haya insistido en pedir la investigación de múltiples cuentas, lo que la defensa
    considera una «actuación que busca sencillamente mirarlo todo a ver si se encuentra
    algo». También sostiene que Zarrías se vio implicado en la causa «únicamente por
    haber empleado a esta señora», en referencia a Díez, en 2024. Según la misma
    información, la investigación de la Guardia Civil pone el foco en cuatro
    transferencias de Zaño Sociedad Consultores a Díez por un total de 16.000 euros. Los
    investigadores consideran que esos pagos partieron del PSOE y se hicieron empleando
    la empresa de Zarrías como intermediaria. Son diligencias de instrucción en curso;
    los hechos no están probados judicialmente. Rige la presunción de inocencia.
  quote: >-
    mirarlo todo a ver si se encuentra algo
