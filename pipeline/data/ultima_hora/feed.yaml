  headline: >-
    El expresidente de Plus Ultra Julio Martínez Sola ratifica ante Calama que asumió que
    el 1 % del rescate iba para el «grupo Zapatero» a cambio de labores de
    «acompañamiento», sin poder detallar qué gestiones hizo el expresidente
  dek: >-
    Según EFE (vía infoLibre) y Moncloa.com (7 de septiembre de 2026), Julio Martínez
    Sola, cofundador, expresidente y socio mayoritario de Plus Ultra Líneas Aéreas,
    declaró el lunes 7 de septiembre como investigado ante el juez José Luis Calama
    (Audiencia Nacional, DP 77/2024) y ratificó el escrito en el que aludió a la
    «pretensión de cobrar» del supuesto testaferro de Zapatero, Julio Martínez Martínez,
    y del propio expresidente por mediar para conseguir el préstamo público. Según
    fuentes jurídicas citadas por EFE, declaró que asumió que el pago de la comisión del
    1 % iba para el «grupo Zapatero» a cambio de labores de «acompañamiento», pero no
    explicó qué labores concretas habría hecho Zapatero porque no hizo seguimiento: fue
    Martínez Martínez quien le pidió el 1 % de la ayuda de 53 millones de euros que la
    aerolínea obtuvo en 2021. Su escrito, ya recogido en piezas anteriores, sitúa el
    inicio de los contactos en una llamada de Zapatero desde un número oculto el 30 de
    abril de 2020. Según EFE, precisó que Roberto Roselli controlaba más los asuntos
    financieros y el día a día de la empresa; Roselli declaró al día siguiente. La causa
    sigue en instrucción y Zapatero niega cualquier gestión; ninguno de los hechos está
    probado judicialmente. Rige la presunción de inocencia.
  quote: >-
