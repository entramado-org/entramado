    date: "2026-03-23"
    quote: "La Fiscalía Anticorrupción se querella por cohecho contra José Antonio Marco Sanjuán."
    note: "José Antonio Marco Sanjuán, expresidente del TEAC y ex 'número 3' de Montero en Hacienda, está imputado por cohecho en el Juzgado de Instrucción nº 35 de Madrid tras la querella de la Fiscalía Anticorrupción (admitida el 23-mar-2026, dirigida contra él y otras 15 personas) por presuntos cobros a cambio de archivar pleitos fiscales; citado a declarar en mayo de 2026 y seguía imputado a 8-jul-2026 (El Debate). El Debate menciona además prevaricación, tráfico de influencias y malversación — solo cohecho está multi-verificado, el resto no se carga. Presunción de inocencia."

