# Última hora — desarrollos de los casos que hoy solo constan en prensa.
# Cada relación lleva outlet+url (+ date + quote). status = etapa procesal (presunto).
# Las entidades enlazan a nodos ya existentes por nombre canónico (slug → entity_id).
#
# ⚠️ CADUCIDAD DE LAS ACUSACIONES (spec 061): una relación ACCUSED_OF /
# INVESTIGATED_BY / CONVICTED_OF con `date` de hace MÁS DE 90 DÍAS solo se carga si
# la persona tiene fila de estado en `pipeline/data/accusations/accusations.yaml`
# (bloque `estado:` o `status:` con `doc:`). Si no, el loader la salta y la cuenta
# (`ultima_hora_skip_stale_accusation`): una imputación que solo dijo un medio y que
# nadie ha refrescado en tres meses deja de ser «última hora». Para que siga
# publicándose hay que ASCENDERLA — documentarla en el registro de acusaciones — no
# tocarle la fecha. Las filas se quedan aquí (histórico del feed); las relaciones no
# acusatorias (MET_WITH, PAID, WORKS_FOR…) no caducan.
# La fecha de referencia es hoy; `--as-of YYYY-MM-DD` la fija para reproducir un Path A.

