    date: "2026-05-29"
    quote: "La gerente del PSOE habría avalado notas de encargo 'mendaces' para justificar pagos que encubrirían retribuciones a Leire Díez."
    note: "Ana María Fuentes Pacheco, gerente federal del PSOE (desde oct-2021, a propuesta de Cerdán), está imputada por el juez Pedraz en el caso Leire (pieza de financiación de las 'cloacas', finales de may-2026) por presunta falsedad en documento mercantil: habría avalado notas de encargo 'mendaces' que justificaron pagos del PSOE (27.225 € y 125.000 €) a los abogados Oliver y Teijelo, que encubrirían retribuciones a Leire Díez. Seguía investigada a 2-jul-2026. Según Vozpópuli y El Independiente; presunción de inocencia."


