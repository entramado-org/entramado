    date: "2026-07-08"
    quote: "Leire Díez era 'el tonto útil' del Gobierno"
    note: "El empresario Joaquín Parra declaró como testigo ante el juez Pedraz (AN, 8-jul-2026) que la investigada Leire Díez se le presentó 'de parte de Pedro Sánchez' y de Santos Cerdán, le trasladó mensajes sobre represalias y le pidió cambiar de abogado por uno afín al PSOE. Manifestaciones de un testigo, no hechos probados. Según Libertad Digital; presunción de inocencia."

  # Caso TEAC / Hacienda — Marco Sanjuán (jul-2026). Dos aristas: la relación con
  # Montero (fue su 'número 3'; encuadre de prensa, NO cargo formal probado) y el
  # destino actual en la AEAT (el gancho con la trama Zapatero). No se crea arista
  # directa con Zapatero: la conexión es institucional (el área que investiga), no
  # personal — una arista persona↔persona sería engañosa.
  - source: "José Antonio Marco Sanjuán"
    target: "María Jesús Montero"
    type: ASSOCIATED_WITH
    status: "imputado"
    outlet: "El Debate"
