    type: WORKS_FOR
    status: "imputado"
    outlet: "El Debate"
    url: "https://www.eldebate.com/espana/20260708/area-hacienda-investiga-zapatero-donde-esta-colocado-ex-tres-montero-imputado-cobrar-mordidas_436988.html"
    date: "2026-07-08"
    quote: "El área de Hacienda que investiga la trama de Zapatero es donde está colocado el ex 'tres' de Montero imputado por cobrar mordidas."
    note: "Según El Debate, tras dimitir del TEAC Marco Sanjuán fue destinado como inspector a la Dependencia Regional de Inspección de la AEAT en la Comunidad Valenciana — el área que investiga el entramado societario de la trama Zapatero (informe-udef-1907) — sin expediente interno ni suspensión cautelar pese a estar imputado por cohecho. Según prensa; presunción de inocencia."

  # Caso Leire — informe UCO de 8-jul-2026 (~50 págs) remitido a Pedraz: atribuye a
  # Juanma Serrano (expresidente de Correos, exjefe de gabinete de Sánchez en el PSOE)
  # un papel destacado en la presunta trama y el 'enchufe' de Leire Díez en Correos.
  # 10-jul-2026: Pedraz acordó su imputación a petición de Anticorrupción y autorizó el
  # volcado de su móvil → las aristas llevan ya status "investigado".
  - source: "Juan Manuel Serrano Quintana"
    target: "Leire Díez"
    type: ASSOCIATED_WITH
    status: "investigado"
    outlet: "El Español"
    url: "https://www.elespanol.com/espana/tribunales/20260709/uco-implica-exjefe-gabinete-sanchez-juanma-serrano-enchufe-leire-correos-sale/1003744315488_0.html"
    date: "2026-07-09"
    quote: "La UCO implica al exjefe de gabinete de Sánchez, Juanma Serrano, en el enchufe de Leire en Correos: 'Lo tuyo sale'."
    note: "Un informe de la UCO fechado el 8-jul-2026 y remitido al juez Pedraz (AN, DP 150/2025) atribuye a Juan Manuel Serrano —presidente de Correos 2018-2023 y antes jefe de gabinete de Pedro Sánchez en el PSOE— haber facilitado la contratación de la investigada Leire Díez en Correos con requisitos hechos a medida (accedió a puestos de relevancia entre 2021 y 2024) y un papel «preeminente» en la presunta trama para desestabilizar causas judiciales que afectan al PSOE y al Gobierno. El 10-jul-2026 Pedraz acordó su imputación (condición de investigado) a petición de la Fiscalía Anticorrupción y autorizó el volcado de su móvil. Según El Español y Vozpópuli; presunción de inocencia."

  - source: "Juan Manuel Serrano Quintana"
    target: "Vicente Fernández"
    type: ASSOCIATED_WITH
    status: "investigado"
    outlet: "Vozpópuli"
    url: "https://www.vozpopuli.com/tribunales/la-uco-senala-al-exjefe-de-gabinete-de-sanchez-por-el-enchufe-de-leire-diez-en-correos.html"
    date: "2026-07-09"
    quote: "el expresidente de la SEPI Vicente Fernández aseguraba a Leire Díez que \"no te preocupes, lo tuyo sale\" tras mantener una conversación con Juanma Serrano previa al fichaje de la exmilitante socialista como alto cargo de Correos"
    note: "Según el informe de la UCO remitido al juez Pedraz, recogido por Vozpópuli y El Español (09-07-2026), el expresidente de la SEPI Vicente Fernández —también investigado en el caso Leire (EFE vía Infobae, 10-07-2026)— habló con Serrano, entonces presidente de Correos, sobre la colocación de Leire Díez en la empresa pública y después escribió a Díez: «Me ha dicho 'Ok, vamos hablando'. No te preocupes, lo tuyo sale» (mayo de 2021, según El Español). Según El Español (19-08-2026), el 17 de mayo de 2021 Fernández habló con Serrano sobre «lo que hablamos de Leire» y le planteó si podían «ponerlo ya en marcha». Son indicios policiales en una instrucción en curso; presunción de inocencia."

