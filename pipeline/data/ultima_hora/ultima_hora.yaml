    date: "2025-06-21"
    quote: "La caída de José Antonio Marco Sanjuán, el 'tres' de Montero al que Anticorrupción investiga por cohecho y tráfico de influencias."
    note: "Según El Debate, Marco Sanjuán —presidente del TEAC (2018-2025), órgano dependiente del Ministerio de Hacienda— era considerado el 'número 3' de la vicepresidenta María Jesús Montero. Dimitió en jun-2025; Anticorrupción se querelló por cohecho, prevaricación, tráfico de influencias y malversación (mar-2026, admitida en el JI nº 35 de Madrid). Montero no está investigada. Encuadre periodístico; presunción de inocencia."

