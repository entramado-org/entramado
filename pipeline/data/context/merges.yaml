# Curated de-duplication. The document extractor sometimes creates two nodes for
# the SAME real entity when their surface forms aren't fuzzy-similar (an acronym
# vs its full name, a short name vs the official one). Each group folds the
# `duplicates` into the `canonical` node (relationships combined, duplicate names
# kept as aliases). Duplicates inherit the canonical's type unless given as
# {name, type}. Applied by `make context` (idempotent — once merged, the
# duplicate id no longer exists, so re-running is a no-op).
#
# Only list entities you are CERTAIN are the same. When in doubt, leave them split.

merges:
