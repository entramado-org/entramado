  - canonical: {name: "Organización Mundial del Turismo", type: Organization}
    duplicates: ["UNWTO"]

  - canonical: {name: "Grupo Barrabés", type: Company}
    duplicates: [{name: "Grupo Barrabés Consul SL", type: Company}]

  - canonical: {name: "PSOE", type: Organization}
    duplicates: ["Partido Socialista"]

  - canonical: {name: "Unidad Central Operativa", type: Organization}
    duplicates: ["UCO"]

  - canonical: {name: "Universidad Complutense de Madrid", type: Organization}
    duplicates: ["UCM"]

  - canonical: {name: "Puertos del Estado", type: Organization}
    duplicates: ["PdE"]

  - canonical: {name: "Ministerio de Transportes, Movilidad y Agenda Urbana", type: Organization}
    duplicates: ["MITMA"]

  # José Ruz Martínez (empresario, constructora Levantina) — el extractor dejó un
  # nodo aparte "Pepe Ruz Levantina" para la misma persona (ya figura como alias
  # del nodo canónico). Es un empresario de la trama, no un magistrado.
  - canonical: {name: "José Ruz", type: Person}
    duplicates: ["Pepe Ruz Levantina"]

  # Patricia Úriz, esposa de Koldo García — el grafo tiene un nodo "Patricia"
