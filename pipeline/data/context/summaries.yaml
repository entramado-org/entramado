    updated: "2026-06-01"
    resumen: "Su nombre figura en el documento judicial 'autoentradaferraz' (auto de 26 de mayo de 2026 del Tribunal Central de Instancia, Seccion de Instruccion, Diligencias Previas / Procedimiento Abreviado 150/2025, instruido por el magistrado Santiago Pedraz, causa secreta sobre la entrada y registro en la sede del PSOE en Ferraz). En la fuente documental aparece con el cargo de 'Letrado/a de la Administracion del Tribunal' y en el bloque de FIRMA del auto, lo que indica que es la Letrada de la Administracion de Justicia que da fe publica y autoriza la resolucion, es decir personal de la Administracion de Justicia y no una persona investigada. Su unica relacion en el grafo (WORKS_FOR -> Tribunal Central de Instancia) es coherente con esa funcion. No consta como imputada en la causa; la gerente del PSOE imputada en este procedimiento es, segun fuentes publicas, Ana Maria Fuentes Pacheco, persona distinta de Ana Esther Sanchez Garcia. No se ha podido confirmar su identidad ni su cargo concreto en fuentes publicas abiertas, por lo que se mantiene confianza baja. Rige la presuncion de inocencia respecto de cualquier persona mencionada en la causa."
