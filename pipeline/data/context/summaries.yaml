      - "https://theobjective.com/espana/tribunales/2026-07-09/pedraz-aplaza-citacion-narbona/"
      - "https://es.wikipedia.org/wiki/Cristina_Narbona"
  - entity_id: "Person:alberto-gonzalez-amador"
    name: "Alberto González Amador"
    updated: "2026-08-11"
    resumen: "Alberto González Amador es un empresario del sector sanitario —administrador de Maxwell Cremona S.L., dedicada a la intermediación y consultoría, con Quirón Salud entre sus clientes— y pareja de Isabel Díaz Ayuso, presidenta de la Comunidad de Madrid. Está acusado en el procedimiento del Juzgado de Instrucción nº 19 de Madrid por la presunta defraudación a la Hacienda Pública de 350.951 € en los ejercicios 2020 y 2021 mediante, según las acusaciones, 15 facturas falsas: el auto de apertura de juicio oral de 22 de septiembre de 2025 lo envió a juicio por dos delitos contra la Hacienda Pública en concurso medial con falsedad documental. La Fiscalía y la Abogacía del Estado piden 3 años y 9 meses de prisión; la acusación popular (PSOE y Más Madrid) eleva la petición a 5 años al añadir un delito contable y pertenencia a grupo criminal. En febrero de 2026 su defensa pidió la nulidad de la causa alegando la actuación delictiva del fiscal general y la vulneración de sus derechos; en julio de 2026 la jueza ordenó fijar fecha para el juicio, aún pendiente de señalamiento. Es además la víctima reconocida y acusación particular en la causa especial del Tribunal Supremo que condenó al fiscal general del Estado, Álvaro García Ortiz, por revelación de datos reservados en relación con el correo de su defensa de 2 de febrero de 2024. Rige plenamente la presunción de inocencia: no hay condena y su defensa niega los hechos."
    sources:
      - "https://es.wikipedia.org/wiki/Caso_Gonz%C3%A1lez_Amador"
      - "https://www.infobae.com/espana/agencias/2026/07/17/la-jueza-ordena-que-se-fije-fecha-para-el-juicio-contra-el-novio-de-ayuso-por-el-presunto-fraude-fiscal/"
      - "https://www.publico.es/politica/tribunales/juicio-delito-fiscal-novio-ayuso-lleva-diez-meses-espera-fecha-certeza-celebre-elecciones-autonomicas.html"
