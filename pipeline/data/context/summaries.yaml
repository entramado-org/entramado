  - entity_id: "Organization:fiscalia-anticorrupcion"
    name: "Fiscalía Anticorrupción"
    updated: "2026-08-03"
    resumen: "La Fiscalía Especial contra la Corrupción y la Criminalidad Organizada («Fiscalía Anticorrupción») es el órgano del Ministerio Fiscal especializado en delitos económicos y de corrupción de especial trascendencia, con jefatura de Alejandro Luzón desde 2017. En estas causas aparece presentando la querella origen de la Causa Especial 20775/2020 (caso Ábalos/Koldo/Aldama) y dirigiendo diligencias de investigación (p. ej. sobre los contratos de material sanitario), con la UCO de la Guardia Civil adscrita a sus investigaciones. Es parte acusadora, no investigada; su intervención no implica culpabilidad de nadie (presunción de inocencia)."
    sources:
      - "https://www.fiscal.es/-/fiscal%C3%ADa-especial-contra-la-corrupci%C3%B3n-y-la-criminalidad-organizada"
  - entity_id: "Company:geoalcali"
    name: "GEOALCALI"
    updated: "2026-05-31"
    resumen: "Geoalcali S.L. es la sociedad española filial de Highfield Resources (minera con matriz en Australia) y titular del proyecto de minería de potasa 'Mina Muga' entre Navarra y Aragón. El proyecto, impulsado por Geoalcali desde 2015, adjudicó la elaboración/construcción a una UTE de Acciona y Servinabar 2000 por 56,9 millones de euros (verificado en eldiario, vozpopuli y okdiario). Aparece en la trama Cerdán/Servinabar de los informes de la UCO: la UCO sitúa Mina Muga como el origen de los contactos entre Santos Cerdán, Koldo García y Fernando Merino (entonces responsable de Acciona en Navarra y La Rioja), con Servinabar 2000 (de Antxon Alonso, amigo de Cerdán) como sociedad vinculada. Según la prensa, el informe sitúa a Mina Muga solo como CONTEXTO y NO atribuye a Geoalcali participación en los hechos investigados ni conducta delictiva; la propia Geoalcali ha negado relación con lo investigado y ha negado haber adjudicado a esa UTE por 57 millones. Rige la presunción de inocencia para empresa y personas. IMPORTANTE: este nodo pertenece al caso Cerdán/Mina Muga, NO al caso de la cátedra de Begoña Gómez."
    sources:
      - "https://www.eldiario.es/navarra/mina-muga-proyecto-uco-situa-origen-trama-cerdan-koldo-navarra_1_12381803.html"
      - "https://www.vozpopuli.com/economia/empresas/la-uco-sospecha-que-la-relacion-de-koldo-y-cerdan-con-acciona-surgio-por-una-mina-que-se-adjudico-en-2024.html"
      - "https://navarra.okdiario.com/articulo/sociedad/geoalcali-niega-relacion-investigacion-uco/20251120155653623715.html"
  - entity_id: "Company:analisis-relevante"
    name: "Análisis Relevante"
    updated: "2026-05-31"
    resumen: "Análisis Relevante S.L. es una sociedad de consultoría que comenzó a operar el 10 de febrero de 2020, administrada formalmente por el empresario Julio Martínez Martínez (con participación de sus hermanos Manuel y Rafael) y sobre la que, según los investigadores, el expresidente José Luis Rodríguez Zapatero habría tenido el control real. La UDEF (Unidad de Delincuencia Económica y Fiscal de la Policía Nacional) la describe como 'pieza instrumental' diseñada para simular servicios de asesoría y dar apariencia legal a pagos derivados de un presunto tráfico de influencias en el rescate público a la aerolínea Plus Ultra. Según elDiario.es (19-05-2026), que cita al juez, ingresó en torno a 959.700 euros entre 2020 y 2025; según Infobae (25-05-2026), que cita un informe de la UDEF, Plus Ultra le habría abonado unos 301.290 euros, y la sociedad habría transferido alrededor de 490.780 euros a Zapatero y 239.755 euros a Whathefav, sociedad de las hijas del expresidente. Julio Martínez Martínez fue detenido el 11 de diciembre de 2025. La causa la instruye el juez José Luis Calama en la Audiencia Nacional. Rige la presunción de inocencia: la causa está en instrucción y no consta condena."
    sources:
      - "https://www.eldiario.es/politica/empresas-salpicadas-investigacion-zapatero-whathefav-analisis-relevante_1_13234431.html"
      - "https://www.infobae.com/espana/2026/05/19/analisis-relevante-la-empresa-vinculada-a-zapatero-y-sus-hijas-por-la-que-habrian-recibido-mordidas-del-rescate-a-la-aerolinea-plus-ultra/"
      - "https://www.infobae.com/espana/2026/05/25/el-rastro-del-dinero-del-caso-plus-ultra-julio-martinez-canalizaba-los-fondos-de-las-influencias-y-zapatero-y-su-entorno-serian-los-principales-beneficiarios/"
      - "https://www.eldiario.es/politica/zapatero-imputado-blanqueo-capitales-caso-plus-ultra_1_13231540.html"
  - entity_id: "Person:antonio-fernandez-menendez"
    name: "Antonio Fernández Menéndez"
    updated: "2026-05-31"
    resumen: "Antonio Fernández Menéndez es un empresario granadino vinculado a la empresa Obras Públicas y Regadíos (OPR), de la que figura como apoderado/representante. El Tribunal Supremo abrió una pieza separada por presuntas comisiones a cambio de adjudicaciones de obra pública en el marco del caso Koldo, que afecta también a Santos Cerdán, José Luis Ábalos y Koldo García. Según los informes de la UCO de la Guardia Civil, Antonio y su hermano Daniel Fernández Menéndez están unidos por lazos familiares (cuñados) con Fernando Merino, exdirectivo de Acciona en Navarra, quien presuntamente los habría puesto en contacto con Koldo García; Antonio habría actuado como mediador entre la empresa OPR y cargos públicos. El Supremo ordenó registros en sus domicilios y los citó a declarar en julio de 2025; los empresarios negaron haber pagado mordidas. Rige la presunción de inocencia: figura como investigado y no consta condena."
    sources:
      - "https://www.eldiario.es/andalucia/empresarios-granada-punto-mira-juez-caso-koldo-supuestas-mordidas-cambio-obras_1_12626081.html"
      - "https://www.cope.es/emisoras/andalucia/granada-provincia/granada/noticias/ts-cita-viernes-declarar-dos-empresarios-granadinos-investigados-caso-koldo-20250704_3180630.html"
      - "https://www.eldebate.com/espana/20250707/socio-cerdan-servinabar-otros-empresarios-caso-psoe-declaran-este-lunes-supremo_314516.html"
  - entity_id: "Organization:departamento-de-investigacion-economica-y-anticorrupcion"
    name: "Departamento de Investigación Económica y Anticorrupción"
    updated: "2026-05-31"
    resumen: "El Departamento de Investigación (o Delincuencia) Económica y Anticorrupción es la unidad de la UCO (Unidad Central Operativa de la Guardia Civil) especializada en delincuencia económica y corrupción. Su jefatura corresponde al teniente coronel Antonio Balas, responsable de los informes que destaparon el caso Cerdán/Koldo. Es el órgano técnico-policial que elabora, a requerimiento de los juzgados y de la Fiscalía Anticorrupción, los informes patrimoniales y de seguimiento del dinero de estas causas. Su papel es el de apoyo policial instructor, no el de parte investigada; según The Objective (28-05-2026), que cita al juez, la presunta trama vinculada a Leire Díez habría situado a Balas y a este departamento como uno de sus principales objetivos con el fin de desacreditarlos. El vínculo con la UCO y con Antonio Balas queda corroborado por las notas del vault del proyecto y por la prensa verificada."
    sources:
      - "https://theobjective.com/espana/2026-05-28/exmando-uco-datos-sensibles-leire-diez-psoe/"
      - "https://www.eldiario.es/politica/teniente-coronel-balas-interroga-generales-sufrieron-investigacion-filtraciones-hizo-abalos_1_13255401.html"
  - entity_id: "Person:leire-diez"
    name: "Leire Díez"
    updated: "2026-05-31"
    resumen: "María Leire Díez Castro (Portugalete, Vizcaya, 1975) es exmilitante del PSOE y exdirectiva de empresas públicas: fue jefa de comunicación de ENUSA (2018-2021) y ocupó cargos en Correos (2022-2023), incluida la dirección de Relaciones Institucionales. La prensa la apodó 'la fontanera del PSOE'. A raíz de unas grabaciones difundidas en mayo de 2025 (publicadas por El Confidencial), se le atribuye haber liderado una presunta operación para recabar información comprometedora contra fiscales de Anticorrupción y mandos de la UCO (entre ellos el teniente coronel Antonio Balas) que investigaban al entorno del partido. Fue detenida en diciembre de 2025 por orden del Juzgado de Instrucción nº 9 de Madrid e investigada por presuntos delitos de cohecho y tráfico de influencias; la Audiencia Nacional (juez Santiago Pedraz) investiga una presunta estructura coordinada que sitúa a Santos Cerdán al frente, con figuras como Javier Pérez Dolset, Gaspar Zarrías e Ismael Oliver. Según el juez, Díez habría recibido pagos mensuales de unos 4.000 euros canalizados a través de sociedades vinculadas a Zarrías y a despachos de abogados. Rige la presunción de inocencia: no consta condena."
    sources:
      - "https://es.wikipedia.org/wiki/Caso_Leire_D%C3%ADez"
      - "https://www.infobae.com/espana/2025/12/10/leire-diez-la-fontanera-del-psoe-detenida-por-presuntos-delitos-de-cohecho-y-trafico-de-influencias/"
      - "https://www.publico.es/politica/tribunales/cinco-claves-auto-judicial-salpica-psoe-trama-liderada-santos-cerdan-leire-diez.html"
      - "https://www.mundiario.com/articulo/politica/juez-pedraz-situa-cerdan-frente-trama-cloacas-leire-diez/20260527203653388117.html"
  - entity_id: "Court:juzgado-central-de-instruccion-numero-2"
    name: "Juzgado Central de Instrucción número 2"
    updated: "2026-05-31"
    resumen: "El Juzgado Central de Instrucción número 2 forma parte de la Audiencia Nacional y su titular es el veterano juez Ismael Moreno Chamarro (confirmado por Infobae: el Supremo le asignó la competencia para investigar el caso Koldo en julio de 2024 por presuntas irregularidades en la adjudicación de contratos de mascarillas durante la pandemia). Es un órgano judicial instructor, no una parte investigada."
    sources:
      - "https://www.infobae.com/espana/2024/07/28/quien-es-ismael-moreno-el-juez-encargado-de-investigar-el-caso-koldo-de-policia-en-el-franquismo-a-magistrado-de-la-audiencia-nacional/"
      - "https://www.eldebate.com/espana/20240223/caso-koldo-recae-juez-veterano-audiencia-nacional-conocido-alargar-instrucciones_176707.html"
  - entity_id: "Company:barrabes-ski-montana-s-l-u"
    name: "Barrabes Ski Montana S.L.U."
    updated: "2026-05-31"
    resumen: "Barrabes Ski Montana, S.L.U. es una sociedad del grupo empresarial de la familia Barrabes, con objeto social en el comercio de material deportivo de montana; Juan Carlos Barrabes esta vinculado a su administracion. Junto con Innova Next SL figura entre las empresas del entorno de Barrabes investigadas por la UCO en la pieza separada del llamado 'caso Begona Gomez'. Segun el informe de la UCO recogido por la prensa, las empresas del grupo Barrabes obtuvieron 99 expedientes de contratacion por unos 24,9 millones de euros desde 2015, concentrandose en torno al 90% de las adjudicaciones en 2021 y 2022; en concreto a Barrabes Ski Montana SL se le atribuyen alrededor de 1,8 millones en contratos y ayudas del ICO durante la pandemia (en torno a 4,27 millones segun la prensa). La UCO no acredito delito en la conducta de Begona Gomez, si bien el juez instructor (Juan Carlos Peinado) ha acordado el procesamiento de Juan Carlos Barrabes y de Begona Gomez por presuntos delitos de trafico de influencias y corrupcion en los negocios, con apertura de juicio por jurado. Todas las personas y entidades estan amparadas por la presuncion de inocencia y no existe sentencia firme."
    sources:
      - "https://www.elindependiente.com/espana/tribunales/2024/08/23/la-uco-registra-el-domicilio-y-la-empresa-de-barrabes-por-el-caso-de-begona-gomez/"
      - "https://www.elindependiente.com/espana/tribunales/2024/05/28/la-uco-senala-que-barrabes-logro-el-90-de-las-adjudicaciones-publicas-entre-2021-y-2022/"
      - "https://www.libertaddigital.com/espana/2024-06-24/pleno-de-barrabes-ocho-sociedades-vinculadas-al-guru-de-begona-gomez-necesitaron-ayuda-del-ico-y-la-lograron-7139455/"
      - "https://es.wikipedia.org/wiki/Caso_Bego%C3%B1a_G%C3%B3mez"
  - entity_id: "Person:daniel-fernandez-menendez"
    name: "Daniel Fernandez Menendez"
    updated: "2026-05-31"
    resumen: "Daniel Fernandez Menendez ('Dani', 'Dani Opr') figura en la documentacion del caso Koldo como administrador mancomunado de la mercantil Obras Publicas y Regadios (OPR), con sede en Baza (Granada). Es hermano de Antonio Fernandez Menendez, apoderado de OPR; ambos son cunados de Fernando Merino, exdirectivo de Acciona en Navarra que, segun la investigacion, los habria puesto en contacto con Koldo Garcia. La Guardia Civil sostiene que los hermanos habrian usado su proximidad a Koldo para influir en ADIF y la Direccion General de Carreteras y resultar adjudicatarios de obras senaladas por la UCO; un informe de INECO incorporado a una investigacion interna de Adif detecto desviaciones de puntuacion tecnica a favor de OPR. Estos son indicios de la instruccion (Tribunal Supremo), no hechos probados: no hay sentencia firme. Esta amparado por la presuncion de inocencia. Es persona distinta de su hermano Antonio Fernandez Menendez, otro nodo del grafo ligado a OPR."
    sources:
      - "https://www.elindependientedegranada.es/politica/tres-empresas-dos-investigados-granada-informe-uco"
      - "https://www.elindependiente.com/espana/2025/07/04/uco-constructores-caso-koldo/"
      - "https://www.eldiario.es/andalucia/empresarios-granada-punto-mira-juez-caso-koldo-supuestas-mordidas-cambio-obras_1_12626081.html"
  - entity_id: "Organization:ministerio-de-fomento"
    name: "Ministerio de Fomento"
    updated: "2026-05-31"
    resumen: "El Ministerio de Fomento fue la denominacion, hasta enero de 2020, del actual Ministerio de Transportes (entonces MITMA). En la etapa relevante lo dirigio Jose Luis Abalos, en cuyo gabinete trabajaba como asesor Koldo Garcia, lo que explica el alias del correo '[correo institucional redactado]'. Es el departamento ministerial en cuyo entorno se situa buena parte de la presunta trama investigada en el caso Koldo (contratos de mascarillas de Puertos del Estado y Adif, y adjudicaciones de obra publica). Su condicion de organismo publico no implica responsabilidad penal alguna; las investigaciones afectan a personas concretas amparadas por la presuncion de inocencia."
    sources:
      - "https://www.newtral.es/guia-caso-koldo/20240303/"
      - "https://es.wikipedia.org/wiki/Caso_Koldo"
      - "https://www.lamoncloa.gob.es/serviciosdeprensa/notasprensa/transportes/Paginas/2020/230120-abalos.aspx"
  - entity_id: "Organization:sepblac"
    name: "SEPBLAC"
    updated: "2026-05-31"
    resumen: "El SEPBLAC es la Unidad de Inteligencia Financiera de Espana y autoridad supervisora en materia de prevencion del blanqueo de capitales y de la financiacion del terrorismo. Es el servicio ejecutivo de la Comision de Prevencion del Blanqueo de Capitales e Infracciones Monetarias, dependiente de la Secretaria de Estado de Economia (Ministerio de Economia); el Banco de Espana ejerce, mediante convenio, las competencias de regimen economico, presupuestario y de contratacion del SEPBLAC y aporta medios y personal. Recibe y analiza las comunicaciones de operaciones sospechosas de las entidades obligadas (bancos, notarios, etc.) y colabora con jueces y fiscales. En el caso Koldo y causas conexas, sus informes sobre movimientos financieros sospechosos constituyen una fuente habitual para la investigacion judicial. Es un organismo publico de control, no un investigado."
    sources:
      - "https://www.sepblac.es/es/"
      - "https://es.wikipedia.org/wiki/Servicio_Ejecutivo_de_la_Comisi%C3%B3n_de_Prevenci%C3%B3n_del_Blanqueo_de_Capitales_e_Infracciones_Monetarias"
      - "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2021-3064"
  - entity_id: "Organization:ib-salut"
    name: "IB-Salut"
    updated: "2026-05-31"
    resumen: "El IB-Salut es el servicio público de salud de las Islas Baleares, dependiente de la Conselleria de Salut del Govern balear. En el caso Koldo/mascarillas figura como organismo comprador: mediante resolución de emergencia firmada en mayo de 2020 por Juli Fuster (entonces director del IB-Salut), bajo el gobierno de Francina Armengol (PSOE), adquirió en torno a 1,5 millones de mascarillas a Soluciones de Gestión y Apoyo a Empresas SL —sociedad vinculada al entorno del caso Koldo (Koldo García y Víctor de Aldama)— por unos 3,7 millones de euros. El material no cumplió la calidad FFP2 pactada (se certificó que no eran FFP2) y quedó almacenado; años después el IB-Salut promovió reclamaciones para anular el contrato y recuperar el sobrecoste, cuya gestión/caducidad ha sido objeto de controversia política y judicial. La condición de comprador es un hecho administrativo; las presuntas irregularidades están en fase de investigación y rige la presunción de inocencia."
    sources:
      - "https://www.ibsalut.es/es/servicio-de-salud/organizacion/organos-de-direccion/direccion-general"
      - "https://www.consalud.es/politica/koldo-garcia-llamo-exgobierno-baleares-compra-37-millones-euros-en-mascarillas.html"
      - "https://www.menorca.info/balears/noticias/2024/03/21/2129383/caso-mascarillas-salut-pide-declarar-nulo-contrato-por-compraron-del-caso-koldo.html"
      - "https://www.eldebate.com/espana/baleares/20260418/mascarillas-armengol-millon-medio-lote-koldo-pudren-almacen_407825.html"
  - entity_id: "Person:patricia-uriz"
    name: "Patricia Úriz"
    updated: "2026-05-31"
    resumen: "Patricia Úriz Iriarte es la pareja sentimental (esposa/exmujer) de Koldo García Izaguirre, exasesor de José Luis Ábalos. Fue vocal de Bienestar Social en la ejecutiva del PSN y, a principios de 2020, fue contratada como auxiliar administrativa (nivel 17) en el Ministerio de Transportes que dirigía Ábalos pese a no tener experiencia previa en el área, colocación investigada en el marco del caso Koldo. Fue detenida en febrero de 2024 en la Operación Delorme sobre la presunta trama de las mascarillas y posteriormente puesta en libertad; está investigada por presuntos delitos de tráfico de influencias, cohecho y pertenencia a organización criminal. Figura como administradora única de Erikapat Consultoría Internacional SL (constituida en marzo de 2022, de la que posee la práctica totalidad del capital) y la UCO la vincula al entorno de la cooperativa Noran, fundada por Koldo García y el empresario Antxon Alonso (Servinabar). Rige la presunción de inocencia: las imputaciones proceden de la fase de investigación, sin sentencia."
    sources:
      - "https://www.moncloa.com/2024/02/23/patricia-uriz-empresaria-koldo-2455776/"
      - "https://www.elespanol.com/reportajes/20240222/mujer-colocada-ministerio-hermano-sindicalista-familia-koldo-dentro-trama/834417064_0.html"
      - "https://navarra.okdiario.com/articulo/navarra/koldo-garcia-mujer-patricia-uriz-psn-jose-luis-abalos-colocacion-ministerio-transporte-empleo/20200225183557313734.html"
      - "https://okdiario.com/investigacion/uco-descubre-que-koldo-garcia-creo-cooperativa-empresario-que-beneficio-santos-cerdan-14807234"
  - entity_id: "Company:servinabar"
    name: "Servinabar"
    updated: "2026-05-31"
    resumen: "Servinabar 2000 S.L.U. es una sociedad mercantil radicada en Navarra, propiedad y administrada por Joseba Antxon Alonso Egurrola, que pasó de organización de eventos a operar como constructora y consultora de prevención de riesgos laborales, accediendo a contratos en Navarra (a menudo en UTE con Acciona), incluido el desdoblamiento del túnel de Belate. Es una de las empresas centrales del informe de la UCO en la causa que investiga a Santos Cerdán: en un registro vinculado al entorno se halló un documento privado de 2016 que atribuiría a Cerdán una participación del 45% en la sociedad; Cerdán reconoció ante el Tribunal Supremo haber firmado ese documento pero sostiene que nunca se elevó a escritura pública ni se ejecutó, y Antxon Alonso niega igualmente que la adquisición llegara a formalizarse. La investigación maneja la hipótesis de que Servinabar habría servido para canalizar presuntas comisiones (vinculadas a Acciona) a cambio de favorecer adjudicaciones de obra pública; la UCO la relaciona también con pagos a familiares de Cerdán. Todo ello corresponde a la fase de instrucción y rige la presunción de inocencia."
    sources:
      - "https://www.eldiario.es/euskadi/secretos-movil-antxon-alonso-dan-nueva-dimension-papel-servinabar-2000-trama-cerdan_1_12778022.html"
      - "https://www.elplural.com/politica/espana/claves-informe-uco-trio-conformado-cerdan-servinabar-acciona_365429102"
      - "https://www.eldiario.es/navarra/directivo-navarra-confirma-acciona-introdujo-servinabar-2000-ute-belate_1_12999914.html"
      - "https://www.eldiario.es/euskadi/pagos-empresario-antxon-alonso-familiares-santos-cerdan-refuerzan-vinculacion-servinabar-2000_1_12509270.html"
      - "https://cronicavasca.elespanol.com/politica/20250707/antxon-alonso-tribunal-supremo-cerdan-participacion-servinabar/1003742671760_0.html"
  - entity_id: "Person:juan-carlos-etero"
    name: "Juan Carlos Etero"
    updated: "2026-05-31"
    resumen: "Según el informe de la UCO incorporado a la causa del caso Koldo, Juan Carlos Etero Martínez habría simulado la contratación de Koldo García a petición de José Ruz (accionista de Levantina Ingeniería y Construcción, LIC): dio de alta a Koldo en la Seguridad Social (situada por la UCO el 15-16 de noviembre de 2022) y le pagó una nómina recurrente de unos 2.600 euros netos mensuales entre diciembre de 2022 y junio de 2023, sin que constara prestación laboral real. Esas cantidades eran luego compensadas a Etero por LIC mediante facturas y pagarés. La documentación del expediente referida en prensa señala que Patricia (Patricia Uriz, esposa de Koldo) aportó documentación y recibía los recibos de la nómina, y que en abril de 2023 Etero reclamó a Koldo los pagos pendientes de LIC, que se canalizaban mediante pagarés; el circuito terminó en junio de 2023. El propio relato no acredita que Etero participara directamente en fraude o malversación; se trata de una investigación abierta y debe presumirse su inocencia."
    sources:
      - "https://www.elespanol.com/valencia/20250612/uco-sostiene-constructor-ruz-pago-koldo-nomina-euros-cobro-abalos/1003743802162_0.html"
      - "https://www.libertaddigital.com/espana/politica/2025-07-07/las-empresas-de-la-trama-de-obras-amanadas-pagaban-nominas-a-koldo-para-hacer-llegar-la-financiacion-al-psoe-7273058/"
      - "https://www.infobae.com/espana/agencias/2025/06/12/la-uco-dice-que-koldo-logro-que-empresas-de-la-presunta-trama-les-contrataran-a-el-y-su-mujer-como-contraprestacion/"
  - entity_id: "Person:luis-carrero"
    name: "Luis Carrero"
    updated: "2026-07-14"
    resumen: "Luis María Carrero Pérez es un exasesor del Palacio de la Moncloa (Unidad de Mensaje del Departamento de Asuntos Políticos, 2020-2023) y colaborador cercano de David Sánchez, hermano del presidente del Gobierno, a quien se dirigía como 'hermanito'. El 14 de julio de 2026, la Audiencia Provincial de Badajoz lo condenó (sentencia 152/2026) como cooperador necesario de un delito de prevaricación administrativa (Bloque C de los hechos probados) a 9 años de inhabilitación especial, y lo absolvió del tráfico de influencias. El tribunal declara probado que en 2023 la Diputación de Badajoz creó la Jefatura de Sección de Coordinación de Centros y Programas de Actividades Transfronterizas y la cubrió en comisión de servicios con Carrero, único aspirante, cuando aún trabajaba en Moncloa y ya vivía en Badajoz auxiliando a David Sánchez en el programa Ópera Joven; antes de publicarse las bases, David Sánchez le escribía sobre su futura incorporación. Renunció a su puesto en julio de 2025. La sentencia NO es firme: cabe apelación ante el TSJ de Extremadura y rige la presunción de inocencia. NO debe confundirse con Luis Carrero Blanco, almirante y presidente del Gobierno franquista asesinado en 1973."
    sources:
      - "https://theobjective.com/espana/tribunales/2026-07-14/david-sanchez-condenado-nueve-anos-inhabilitacion-prevaricacion/"
      - "https://www.elespanol.com/espana/politica/20250718/exasesor-moncloa-investigado-caso-david-sanchez-renuncia-puesto-diputacion-badajoz/1003743853888_0.html"
      - "https://www.moncloa.com/2025/04/29/david-sanchez-procesado-3224775/"
      - "https://www.eldiario.es/extremadura/politica/david-sanchez-banquillo-guia-seguir-juicio-hermano-presidente_1_13249954.html"
  - entity_id: "Person:armengol"
    name: "Armengol"
    updated: "2026-05-31"
    resumen: "Francina Armengol (Inca, 1971) es presidenta del Congreso de los Diputados desde el 17 de agosto de 2023 y fue presidenta del Govern de las Illes Balears entre el 2 de julio de 2015 y el 19 de junio de 2023 por el PSIB-PSOE, primera mujer en el cargo (datos verificados en Wikipedia). Su nombre aparece en la dimensión balear del caso Koldo/mascarillas: siendo presidenta, el servicio de salud balear adquirió en 2020 unos 1,4 millones de mascarillas por 3,7 millones de euros a Soluciones de Gestión (empresa vinculada a la trama de Víctor de Aldama y Koldo García), material que resultó defectuoso. Según informes de la UCO mantuvo contactos por WhatsApp con Koldo García sobre material sanitario y, según la UCO, derivó/remitió el contacto al director del servicio de salud (Manuel Palomino); Armengol sostiene que jamás ordenó contratar a una empresa concreta. En mayo de 2026 Víctor de Aldama declaró ante el juez que no le consta que Armengol ni su Govern cobraran comisiones en Baleares por las mascarillas. No consta su imputación penal como investigada por estos hechos y debe presumirse su inocencia."
    sources:
      - "https://es.wikipedia.org/wiki/Francina_Armengol"
      - "https://www.eldiario.es/politica/uco-concluye-armengol-remitio-koldo-garcia-servicio-salud-contacto-vender-mascarillas-trama_1_13149318.html"
      - "https://www.ultimahora.es/noticias/local/2026/05/21/2634067/aldama-dice-armengol-cobro-comisiones-baleares-por-mascarillas.html"
  - entity_id: "Organization:ie-africa-center"
    name: "IE África Center"
    updated: "2026-05-31"
    resumen: "El IE África Center es un centro de IE University (Instituto de Empresa) orientado al desarrollo y la innovación en África. Begoña Gómez, esposa del presidente Pedro Sánchez, lo dirigió (referencias sitúan su etapa hacia 2018-2022), y el centro figura en la causa que instruye el juez Juan Carlos Peinado sobre presuntos delitos relacionados con su actividad. Según información de prensa y del informe de la Guardia Civil, el centro se habría vinculado a patrocinios de grandes empresas y a la sociedad Wakalua (entorno de Globalia/Javier Hidalgo). Las cifras concretas (retribución citada en torno a 55.000 euros anuales; en torno a 300.000 euros en salarios sin ingresos asociados al centro) proceden de prensa (El Español) y deben atribuirse a esas fuentes. NO guarda relación con la trama de mascarillas de Baleares. Toda imputación debe tratarse con presunción de inocencia. Variantes como 'African Diaspora Center' o 'S.E./lE África Center' son probables errores de transcripción/OCR."
    sources:
      - "https://www.ie.edu/africacenter/"
      - "https://www.elespanol.com/espana/tribunales/20240507/ie-no-ingresos-africa-center-destino-eur-salarios-anos-begona-gomez/853165039_0.html"
  - entity_id: "Organization:correos"
    name: "Correos"
    updated: "2026-05-31"
    resumen: "Correos es la sociedad estatal española de servicios postales. En el contexto del caso Koldo/mascarillas figura como una de las entidades públicas que durante la pandemia de COVID-19 contrató material sanitario con Soluciones de Gestión y Apoyo a Empresas, mercantil vinculada a Víctor de Aldama y al entorno de Koldo García. Según las informaciones de la causa, Correos firmó un contrato de emergencia en torno a 8 millones de euros para la compra de mascarillas, operación examinada por la investigación por posibles irregularidades. Correos aparece como entidad contratante, sin que ello implique imputación de sus responsables; rige la presunción de inocencia y los hechos están bajo investigación judicial."
    sources:
      - "https://www.correos.es/"
      - "https://theobjective.com/espana/tribunales/2026-04-25/trama-koldo-mascarillas-proveedor-contrato/"
      - "https://theobjective.com/espana/tribunales/2026-04-16/correo-aldama-jefe-puertos-koldo-mascarillas/"
  - entity_id: "Person:miguel-moreno-purroy"
    name: "Miguel Moreno Purroy"
    updated: "2026-05-31"
    resumen: "Miguel Moreno Purroy es el titular/gestor del bar-restaurante Franky de Pamplona, establecimiento que la UCO sitúa como una de las piezas de la presunta operativa de facturación en torno a Koldo García. Según el informe de la UCO y su declaración ante el juez instructor (Ismael Moreno, Audiencia Nacional), se le relaciona con la confección, entre 2016 y 2018, de facturas a nombre de Acciona Infraestructuras y de la UTE Recajo (por importes citados de 1.525 y 2.700 euros más IVA) con su cuenta como beneficiaria, a indicación de Koldo; los investigadores lo interpretan como un posible mecanismo para canalizar pagos hacia el entorno de Koldo. Las informaciones difieren sobre su versión: una crónica recoge que admitió cómo se confeccionaban las facturas, mientras que otra señala que negó haber emitido facturas falsas. Interviene en una causa en curso, con presunción de inocencia y sin hechos probados ni condena; no se acredita beneficio ilícito para él."
    sources:
      - "https://theobjective.com/espana/tribunales/2026-05-13/franky-facturas-falsas-koldo-acciona/"
      - "https://navarra.okdiario.com/articulo/politica/gestor-bar-franky-admite-juez-como-hacian-facturas-trama-koldo-cerdan/20260513143247644741.html"
      - "https://www.eldiario.es/navarra/dueno-bar-franky-pamplona-senalado-uco-niega-haber-emitido-facturas-falsas-acciona_1_13015570.html"
  - entity_id: "Organization:consejo-de-ministros"
    name: "Consejo de Ministros"
    updated: "2026-05-31"
    resumen: "El Consejo de Ministros es el órgano colegiado del Gobierno de España que reúne a los ministros bajo la presidencia del presidente del Gobierno y adopta los acuerdos del Ejecutivo (reales decretos, nombramientos, autorizaciones de contratación, disolución de las Cortes, etc.). En la documentación del caso aparece como órgano que adoptó acuerdos relevantes para las distintas tramas, por ejemplo decisiones de contratación de emergencia durante la pandemia o acuerdos referidos en los autos judiciales. El alias 'Consejo de Ministros del 26 de abril de 2019' remite a una reunión concreta del gabinete citada en la causa. Es un organismo institucional, no un investigado en sí mismo."
    sources:
      - "https://www.lamoncloa.gob.es/consejodeministros/Paginas/index.aspx"
  - entity_id: "Company:obras-publicas-y-regadios"
    name: "Obras Públicas y Regadíos"
    updated: "2026-05-31"
    resumen: "Obras Públicas y Regadíos (OPR) es una constructora de ingeniería civil con sede en Madrid, administrada de forma mancomunada (según el informe de la UCO, por Alberto Vilanova Espert y Daniel Fernández Menéndez). La UCO la incluye entre las mercantiles examinadas en la investigación del presunto reparto de obra pública vinculado a la trama de Santos Cerdán y José Luis Ábalos, junto a Servinabar, Acciona y Levantina Ingeniería y Construcción (LIC). No se ha probado de forma concluyente su participación en actos de corrupción. La sociedad y sus responsables están bajo escrutinio judicial con presunción de inocencia y sin hechos probados."
    sources:
      - "https://opr.es/"
      - "https://theobjective.com/espana/tribunales/2025-06-23/constructoras-salpicadas-amanos-cerdan-koldo-web-investigacion/"
      - "https://www.cordobabn.com/articulo/nacional/registros-informe-cerdan-esquema-abalos-adjudicaciones-historicas-reserva-hostal/20250618145104228284.html"
  - entity_id: "Person:pedro-sanchez"
    name: "Pedro Sánchez"
    updated: "2026-08-03"
    resumen: "Pedro Sánchez Pérez-Castejón es presidente del Gobierno de España desde junio de 2018 y secretario general del PSOE desde 2017. Figura en el grafo por su posición institucional y partidista al frente del PSOE, formación a la que pertenecían varios investigados en el caso Koldo/Cerdán: el exministro de Transportes José Luis Ábalos, el exsecretario de Organización Santos Cerdán (en prisión provisional entre junio y noviembre de 2025) y el exasesor Koldo García. Pedro Sánchez NO está imputado ni investigado en estas causas; aparece como referencia política y como responsable público de la dirección del partido. La instrucción ha explorado si el PSOE como organización pudo beneficiarse, pero ningún tribunal atribuye al presidente participación en los hechos. Su entorno familiar es objeto de causas separadas: su esposa Begoña Gómez fue procesada por el juez Peinado (auto de 11 de abril de 2026, por los trámites del Tribunal del Jurado) y ha sido citada como testigo por la Fiscalía Europea por los contratos de Red.es adjudicados al empresario Juan Carlos Barrabés; su hermano David Sánchez fue condenado el 14 de julio de 2026 por la Audiencia Provincial de Badajoz (sentencia 152/2026) como cooperador necesario de prevaricación administrativa a 9 años de inhabilitación —y absuelto de tráfico de influencias— por su contratación en la Diputación de Badajoz; la sentencia NO es firme y cabe apelación ante el TSJ de Extremadura. Estas causas siguen su curso y rige la presunción de inocencia para todos los implicados. Debe presumirse la inocencia de Pedro Sánchez: ningún tribunal le atribuye participación en los hechos investigados."
    sources:
      - "https://www.lamoncloa.gob.es/presidente/"
      - "https://es.wikipedia.org/wiki/Pedro_S%C3%A1nchez"
      - "https://es.wikipedia.org/wiki/Caso_David_S%C3%A1nchez"
      - "https://www.infobae.com/espana/2025/11/19/santos-cerdan-sale-de-la-carcel-de-soto-del-real-tras-cinco-meses-en-prision-provisional/"
      - "https://theobjective.com/espana/tribunales/2026-04-14/fiscalia-europea-contratos-barrabes-begona-gomez/"
      - "https://www.eldiario.es/extremadura/politica/david-sanchez-banquillo-guia-seguir-juicio-hermano-presidente_1_13249954.html"
  - entity_id: "Person:julio-martinez-martinez"
    name: "Julio Martínez Martínez"
    updated: "2026-06-15"
    resumen: "Julio Martínez Martínez ('Julito') es un empresario real, distinto de Julio Martínez Sola (fundador y presidente de Plus Ultra): en el entorno de la aerolínea hay DOS personas de nombre similar y los documentos judiciales las separan expresamente (se llaman 'tocayo' en el chat 'PU' del caso). A Martínez Martínez la UDEF/UCO y el auto de Calama lo presentan como el pagador del entorno de Zapatero —la 'vía Zapatero'—, administrador de Análisis Relevante y titular de Idella Consulenza Strategica, con la que se firmó el contrato del 1% más IVA sobre la ayuda pública; el instructor le atribuye el rol de 'lugarteniente principal y figura visible' de una presunta estructura de tráfico de influencias y lo considera 'titular formal' de una red societaria destinada presuntamente a 'canalizar fondos', señalando a José Luis Rodríguez Zapatero y su entorno como presuntos beneficiarios. Plus Ultra fue rescatada con unos 53 millones de euros durante la pandemia a través de la SEPI (FASEE, 2021); la comisión de investigación del Congreso cifró en unos 707.000 € los pagos de Plus Ultra a empresas controladas por él en concepto de supuestas asesorías. La Audiencia Nacional ordenó detenciones el 11 de diciembre de 2025 entre los investigados de la causa (entre ellos el excomisario Villarejo). Niega los hechos; rige la presunción de inocencia. NOTA de grafo: las aristas y menciones cuya evidencia nombra a Julio Martínez Sola se han separado a su propio nodo (spec 014, split por evidencia); este nodo conserva las co-menciones de ambos y las menciones genéricas a 'Julio Martínez' sin apellido desambiguador, por lo que su grado sigue algo inflado. El ruido de una página deportiva de Badajoz se separa aparte vía el overlay de relaciones."
    sources:
      - "https://es.wikipedia.org/wiki/Caso_Plus_Ultra"
      - "https://elpais.com/espana/2025-12-11/la-audiencia-nacional-ordena-detener-a-seis-investigados-en-el-caso-plus-ultra-entre-ellos-villarejo.html"
      - "https://www.infobae.com/espana/2026/05/25/el-rastro-del-dinero-del-caso-plus-ultra-julio-martinez-canalizaba-los-fondos-de-las-influencias-y-zapatero-y-su-entorno-serian-los-principales-beneficiarios/"
      - "https://www.lavanguardia.com/politica/20251211/11000000/plus-ultra-zapatero-detenidos.html"
  - entity_id: "Person:julio-martinez-sola"
    name: "Julio Martínez Sola"
    updated: "2026-06-15"
    resumen: "Julio Martínez Sola es el fundador y presidente de la aerolínea Plus Ultra Líneas Aéreas y administrador único de Alva Skies and Wings SL, sociedad titular del 9,46% de Plus Ultra. Es una persona REAL distinta de Julio Martínez Martínez ('Julito'), el interlocutor de la 'vía Zapatero': en los documentos del caso ambos se llaman 'tocayo' y la UDEF/UCO los separan expresamente. Como representante de Plus Ultra, Sola firmó el contrato del 1% más IVA con Idella Consulenza Strategica (la sociedad de Martínez Martínez) sobre la ayuda pública. La aerolínea fue rescatada con unos 53 millones de euros durante la pandemia a través del fondo de la SEPI (FASEE, 2021). Está investigado en el 'caso Plus Ultra' por la Audiencia Nacional, en el que el 11 de diciembre de 2025 se ordenaron detenciones entre los investigados (entre ellos el excomisario Villarejo). Niega los hechos; rige la presunción de inocencia. NOTA de grafo: este nodo se ha reconstruido separando por evidencia (spec 014) las aristas/menciones que lo nombran expresamente, que el resolver había fusionado en el nodo de Martínez Martínez."
    sources:
      - "https://es.wikipedia.org/wiki/Caso_Plus_Ultra"
      - "https://elpais.com/espana/2025-12-11/la-audiencia-nacional-ordena-detener-a-seis-investigados-en-el-caso-plus-ultra-entre-ellos-villarejo.html"
      - "https://www.infobae.com/espana/2026/05/25/el-rastro-del-dinero-del-caso-plus-ultra-julio-martinez-canalizaba-los-fondos-de-las-influencias-y-zapatero-y-su-entorno-serian-los-principales-beneficiarios/"
  - entity_id: "Person:fernando-merino"
    name: "Fernando Merino"
    updated: "2026-05-31"
    resumen: "Fernando Agustín Merino Vera trabajó en Acciona y fue delegado de la constructora en Navarra y La Rioja. Está investigado por el Tribunal Supremo en la causa del 'caso Koldo/Cerdán': según el informe de la UCO, habría sido uno de los contactos a través de los cuales se canalizó la presunta influencia sobre el asesor Koldo García para la presunta adjudicación irregular de obra pública a Acciona, en alianza (UTE) con Servinabar, sociedad vinculada a Santos Cerdán. Los investigadores destacan que en diciembre de 2018 Koldo le envió una nota de prensa sobre la licitación de la Ronda Sur de Logroño y, días después, Acciona y Servinabar firmaron un memorando de entendimiento. Merino niega haber pagado comisiones y se desvincula de las adjudicaciones; rige la presunción de inocencia. Acciona se ha desvinculado de la trama."
    sources:
      - "https://www.libremercado.com/2025-06-13/acciona-se-desvincula-de-la-trama-y-abre-una-investigacion-interna-fernando-agustin-merino-vera-fue-despedido-7265555/"
      - "https://www.publico.es/politica/tribunales/tres-datos-clave-relacion-acciona-exdirectivo-investigado-caso-cerdan.html"
      - "https://www.noticiasdenavarra.com/politica/2025/09/24/fernando-merino-exdelegado-acciona-navarra-10124691.html"
  - entity_id: "Person:juan-carlos-barrabes"
    name: "Juan Carlos Barrabés"
    updated: "2026-05-31"
    resumen: "Juan Carlos Barrabés es empresario tecnológico y fundador del Grupo Barrabés. Asesoró a Begoña Gómez en el ámbito de su cátedra en la Universidad Complutense y está investigado por el juez Juan Carlos Peinado por presuntos delitos de tráfico de influencias y corrupción en los negocios. Begoña Gómez firmó cartas de apoyo/recomendación a favor de empresas vinculadas a Barrabés (entre ellas Innova Next, en UTE con The Valley), que posteriormente lograron adjudicaciones de Red.es (cifradas por la prensa en torno a 10 millones de euros, dato no confirmado de forma independiente aquí). La causa afecta a contratos con fondos europeos, por lo que la Fiscalía Europea ha intervenido. Barrabés niega irregularidades; rige la presunción de inocencia y no hay condena."
    sources:
      - "https://es.wikipedia.org/wiki/Caso_Bego%C3%B1a_G%C3%B3mez"
      - "https://www.infobae.com/espana/2026/05/05/begona-gomez-niega-ante-la-fiscalia-europea-haber-influido-en-contratos-publicos-adjudicados-a-empresas-de-juan-carlos-barrabes/"
      - "https://theobjective.com/economia/2026-04-14/barrabes-empresa-avalada-begona-gomez/"
  - entity_id: "Person:jose-ruz"
    name: "José Ruz"
    updated: "2026-05-31"
    resumen: "José Ruz Martínez ('Pepe Ruz') es propietario de la constructora Levantina Ingeniería y Construcción (LIC), una de las tres empresas cuyas adjudicaciones de obra pública investiga el Tribunal Supremo en el 'caso Koldo/Cerdán'. Según la instrucción y el informe de la UCO, se le atribuyen indicios de haberse beneficiado de adjudicaciones presuntamente a cambio de pagos de comisiones a Koldo García y José Luis Ábalos, con posibles delitos de cohecho activo y pertenencia a organización criminal. Reconoció ante el Supremo haber pedido reunirse con Santos Cerdán para resolver problemas con contratos, pero NEGÓ haber pagado comisiones. Anticorrupción solicitó la retirada de su pasaporte y comparecencias periódicas. Rige la presunción de inocencia. NO confundir con el juez Pablo Ruz (otra persona)."
    sources:
      - "https://okdiario.com/espana/empresario-acusado-pagar-mordidas-psoe-admite-reuniones-abalos-llamadas-lineas-seguras-15060231"
      - "https://theobjective.com/espana/2025-07-05/gobierno-obra-pueblo-natal-cerdan-levantina/"
      - "https://www.infobae.com/espana/2025/07/04/los-tres-empresarios-investigados-en-la-trama-cerdan-niegan-haber-pagado-comisiones-a-abalos-y-koldo-garcia-cambio-de-la-adjudicacion-de-obras-publicas/"
  - entity_id: "Person:javier-herrero"
    name: "Javier Herrero"
    updated: "2026-05-31"
    resumen: "Francisco Javier Herrero Lizano fue nombrado director general de Carreteras a finales de junio de 2018, tras la moción de censura que llevó a Ábalos al Ministerio; según Demócrata (13-06-2025), que cita un informe de la UCO, su nombramiento habría sido propuesto por Santos Cerdán. El informe de la UCO le señala, junto a la expresidenta de Adif Isabel Pardo de Vera, al considerar que el asesor Koldo García los habría utilizado para el presunto amaño de contratos de obra pública. Fue citado como investigado ante la Audiencia Nacional en julio de 2025 por su presunta participación en adjudicaciones irregulares. Rige la presunción de inocencia. Está investigado, no condenado."
    sources:
      - "https://www.libertaddigital.com/espana/politica/2025-11-21/el-nombramiento-clave-en-el-reparto-de-obras-publicas-por-la-trama-socialista-tambien-derivo-de-la-negociacion-del-pnv-7322637/"
      - "https://www.democrata.es/actualidad/informe-cerdan-a-quien-senala-uco-cupula-transportes-abalos/"
      - "https://www.lasvocesdelpueblo.com/isabel-pardo-y-javier-herrero-ante-el-juez-por-el-caso-koldo/"
