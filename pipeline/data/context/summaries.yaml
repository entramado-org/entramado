  - entity_id: "Organization:union-europea"
    name: "Unión Europea"
    updated: "2026-10-04"
    resumen: "La Unión Europea aparece en las causas principalmente como origen de los fondos públicos cuyo presunto amaño se investiga. Según el informe de la UCO sobre Santos Cerdán recogido por eldiario.es, entre las trece obras adjudicadas (637 millones de euros) figuran contratos financiados con fondos europeos del Plan de Recuperación, Transformación y Resiliencia, como la integración ferroviaria de Sant Feliu de Llobregat (Barcelona). No es parte investigada, sino el marco institucional y financiero de varios contratos bajo sospecha. Su aparición en esta base es esencialmente contextual."
    sources:
      - "https://www.eldiario.es/economia/13-obras-recoge-informe-uco-tumbado-cerdan-suman-637-millones-e-incluyen-fondos-europeos_1_12380100.html"
  - entity_id: "Company:ferrovial"
    name: "Ferrovial"
    updated: "2026-06-01"
    resumen: "Ferrovial es una de las grandes constructoras españolas. Según el informe de la UCO sobre Santos Cerdán, varias obras públicas adjudicadas a UTE participadas por Ferrovial figuran entre los contratos presuntamente amañados desde el Ministerio de Transportes, como el soterramiento del AVE en Murcia (UTE Ferrovial-Acciona, 158,8 millones de euros, adjudicado en mayo de 2019). La UCO puso bajo sospecha megacontratos de Ferrovial y Acciona, pero la empresa no aparece imputada y no consta que se le atribuya delito; la investigación se centra en los presuntos cobros de comisiones por terceros (Cerdán/Ábalos/Koldo). Rige la presunción de inocencia."
