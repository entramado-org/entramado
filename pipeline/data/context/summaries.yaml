  - entity_id: "Organization:guardia-civil"
    name: "Guardia Civil"
    updated: "2026-05-31"
    resumen: "La Guardia Civil es el cuerpo de seguridad cuya Unidad Central Operativa (UCO) ha elaborado los principales informes de policía judicial que sustentan varias de estas causas (caso Koldo/mascarillas y trama Cerdán-Servinabar), por encargo de los juzgados instructores y de la Fiscalía. Actúa como investigador, no como investigado, y sus informes recopilan análisis de mensajería, movimientos económicos y adjudicaciones. La Jefatura de Asuntos Económicos y otras unidades territoriales también aparecen en las diligencias. Su peso en la causa refleja su papel central como autor de la prueba documental."
    sources:
      - "https://es.wikipedia.org/wiki/Guardia_Civil_(Espa%C3%B1a)"
      - "https://es.wikipedia.org/wiki/Unidad_Central_Operativa"
  - entity_id: "Person:koldo-garcia"
    name: "Koldo García"
    updated: "2026-06-23"
    resumen: "Koldo García Izaguirre fue chófer, escolta y luego asesor de confianza de José Luis Ábalos durante su etapa como ministro de Transportes (2018-2021) y da nombre al 'caso Koldo', investigación sobre una trama de comisiones por contratos públicos, en particular la adjudicación de contratos de mascarillas durante la pandemia. Fue detenido el 20 de febrero de 2024 por la UCO de la Guardia Civil en la Operación Delorme; los informes de la UCO le atribuían un papel de intermediario o conseguidor en el cobro de comisiones. El 27 de noviembre de 2025 el juez instructor del Tribunal Supremo Leopoldo Puente acordó su prisión provisional por riesgo de fuga. El 22 de junio de 2026 la Sala Segunda del Tribunal Supremo, en la sentencia núm. 418/2026 (Causa Especial 20775/2020), lo CONDENA como autor —y, en la malversación, como cooperador necesario— de un delito de pertenencia a organización criminal (art. 570 bis CP), cohecho continuado (art. 419 CP), tráfico de influencias y malversación de caudales públicos, con penas de prisión e inhabilitación, y lo ABSUELVE de los delitos de prevaricación, uso de información privilegiada y falsedad de los que también venía acusado. Junto a José Luis Ábalos debe indemnizar a INECO (34.450 €) y a TRAGSATEC (9.500,54 €), con decomiso conjunto de 430.298 €. La sentencia, dictada en instancia única ante el Supremo, es firme."
    sources:
      - "https://www.elindependiente.com/espana/2025/12/11/el-supremo-envia-a-juicio-a-abalos-y-koldo-garcia-y-les-mantiene-en-prision/"
