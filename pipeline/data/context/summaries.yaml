  - entity_id: "Company:injoo-technology"
    name: "Injoo Technology"
    updated: "2026-06-01"
    resumen: "Injoo Technology (también Innjoo) es una empresa que durante la pandemia de COVID-19 facturó material sanitario y obtuvo más de 51 millones de euros en contratos públicos, con adjudicaciones a ADIF, Puertos del Estado, el Ministerio del Interior y comunidades autónomas (Baleares, Canarias, Cataluña). Según la prensa, habría arrancado con contratos del Ministerio de Transportes de Ábalos en 2020, siguiendo pasos similares a Soluciones de Gestión, la empresa central del caso Koldo. En la compra de mascarillas de ADIF ofreció un precio inferior al de Soluciones de Gestión. Su propietario es un empresario de origen chino. No consta condena; está bajo investigación (por ejemplo, en Baleares) y rige la presunción de inocencia."
    sources:
      - "https://www.canarias7.es/politica/empresa-innjoo-facturo-millones-canarias-parte-trama-20241029072202-nt.html"
      - "https://www.elindependiente.com/economia/2024/08/29/adif-hizo-una-compra-paralela-de-mascarillas-a-la-empresa-que-le-ofrecio-mejor-precio-que-la-del-caso-koldo/"
      - "https://www.moncloa.com/2024/11/04/empresario-chino-caso-koldo-2980672/"
  - entity_id: "Organization:unidad-militar-de-emergencias"
    name: "Unidad Militar de Emergencias"
    updated: "2026-10-04"
    resumen: "La Unidad Militar de Emergencias (UME) es una fuerza conjunta del Ejército español, dependiente del Ministerio de Defensa, creada por acuerdo del Consejo de Ministros de octubre de 2005 (su organización se reguló por el Real Decreto 416/2006) y dedicada a la intervención en catástrofes y emergencias (incendios, inundaciones, pandemia COVID-19). En la documentación de la causa relacionada con adquisiciones de material durante la pandemia figura como administración pública contratante/receptora, sin que se le atribuya conducta delictiva alguna. La identificación exacta de los expedientes de contratación que se le atribuyen en esta base no está confirmada por fuentes públicas y debe contrastarse con la causa."
    sources:
      - "https://ume.defensa.gob.es/CONOCENOS/que-es/"
      - "https://es.wikipedia.org/wiki/Unidad_Militar_de_Emergencias"
      - "https://www.defensa.gob.es/fuerzasarmadas/ume/"
  - entity_id: "Company:asch-infraestructuras-y-servicios-sa"
    name: "Asch Infraestructuras y Servicios Sa"
    updated: "2026-10-04"
    resumen: "ASCH Infraestructuras y Servicios S.A. (NIF A73998346) es una empresa constructora española dedicada a la ingeniería civil, edificación e infraestructuras viarias, con actividad internacional. Consta verificadamente que ejecutó en UTE con Lantania S.A.U. las obras de ampliación a tercer carril de la Autovía de la Plata (A-66) en Asturias, adjudicadas por la Dirección General de Carreteras en noviembre de 2019 por unos 22,2 millones de euros (presupuesto final en torno a 25 M con impuestos), obra inaugurada en octubre de 2023. Esa adjudicación se produjo durante la etapa de José Luis Ábalos al frente del Ministerio de Transportes, pero no consta en fuentes públicas que ASCH figure nominalmente en el informe de la UCO sobre la trama ni que esté imputada por delito alguno; rige la presunción de inocencia. Los vínculos que constan en esta base reflejan su condición de adjudicataria de obra pública."
    sources:
      - "https://www.aschinfraestructuras.com/"
      - "https://infonif.economia3.com/ficha-empresa/asch-infraestructuras-y-servicios-sa"
      - "https://www.lantania.com/en/lantania-se-adjudica-las-obras-de-ampliacion-de-la-autovia-de-la-plata-a-66-en-asturias/"
      - "https://www.aschinfraestructuras.com/post/las-obras-de-autovía-de-la-plata-a-66-en-asturias-son-adjudicadas-a-asch-y-lantania"
  - entity_id: "Organization:boletin-oficial-del-estado"
    name: "Boletín Oficial del Estado"
    updated: "2026-06-01"
    resumen: "El Boletín Oficial del Estado (BOE) es el diario oficial de España, donde se publican leyes, reales decretos y disposiciones de obligado cumplimiento. En la documentación de la causa aparece de forma puramente instrumental: como fuente que publicó los reales decretos del estado de alarma por la COVID-19 (el Real Decreto 514/2020, de 8 de mayo, BOE-A-2020-4902, prorrogó el estado de alarma declarado por el Real Decreto 463/2020) y la normativa de contratación de emergencia aplicada durante la pandemia. Es un organismo neutral mencionado como referencia normativa, sin papel alguno en la presunta trama."
    sources:
      - "https://www.boe.es/"
      - "https://www.boe.es/buscar/doc.php?id=BOE-A-2020-4902"
  - entity_id: "Organization:consejeria-de-presidencia-interior-justicia-y-accion-exterio"
    name: "Consejería de Presidencia, Interior, Justicia y Acción Exterior"
    updated: "2026-10-04"
    resumen: "Departamento de un gobierno autonómico con competencias en presidencia, interior, justicia y acción exterior. La denominación exacta 'Consejería de Presidencia, Interior, Justicia y Acción Exterior' corresponde al Gobierno de Cantabria. En esta base se le vinculan expedientes de contratación administrativa relacionados con la causa, pero esa vinculación concreta (y la empresa adjudicataria) no está confirmada por fuentes públicas y debe contrastarse con la documentación de la causa. De confirmarse algún papel, sería el de administración contratante, sin que conste conducta delictiva. Rige la presunción de inocencia."
    sources:
      - "https://www.cantabria.es/web/consejeria-de-presidencia-y-justicia"
  - entity_id: "Organization:direccion-general-de-transporte-terrestre"
    name: "Dirección General de Transporte Terrestre"
    updated: "2026-10-04"
    resumen: "Órgano directivo del Ministerio de Transportes, Movilidad y Agenda Urbana (hoy Ministerio de Transportes y Movilidad Sostenible) responsable del sector del transporte terrestre. La Orden TMA/263/2020, de 20 de marzo, reguló la adquisición centralizada de hasta 8 millones de mascarillas FFP2 por el Ministerio durante la pandemia, encomendando a la Dirección General de Transporte Terrestre la canalización de las solicitudes y autorizaciones para su distribución entre el personal del transporte. En ejecución, esa Dirección General dictó las Resoluciones de 2 y 14 de abril de 2020 con instrucciones de reparto en el ámbito del transporte terrestre. Aparece en esta base por ese papel administrativo en el expediente de mascarillas, sin que se le atribuya ilícito penal."
    sources:
      - "https://www.boe.es/buscar/act.php?id=BOE-A-2020-3947"
      - "https://www.boe.es/buscar/act.php?id=BOE-A-2020-4262"
      - "https://www.boe.es/buscar/doc.php?id=BOE-A-2020-4470"
  - entity_id: "Organization:el-mayor"
    name: "El Mayor"
    updated: "2026-10-04"
    resumen: "Aparece en esta base, a partir de informes de la UCO y del entorno judicial del caso, como supuesta obra pública asociada a la presunta trama de amaño de adjudicaciones favorables a Acciona, presuntamente a través de la sociedad Servinabar, vinculada a Santos Cerdán. Las fuentes públicas consultadas identifican como obras de esa presunta trama las de Logroño, Sevilla, Sant Feliu de Llobregat y el AVE de Murcia (UTE Acciona-Servinabar, presunto 2% de comisión), pero no he podido confirmar una obra concretamente denominada 'El Mayor'; el nombre podría ser un fragmento o un error de extracción. Todos los implicados están investigados y rige la presunción de inocencia. No es una organización en sentido estricto, aunque esta base lo clasifique como tal."
    sources:
      - "https://www.eldiario.es/politica/son-adjudicaciones-alianza-acciona-empresa-vinculada-cerdan-lupa-justicia_1_12779315.html"
      - "https://www.libertaddigital.com/espana/2025-11-18/informe-uco-acciona-principal-fuente-financiacion-empresa-santos-cerdan-antxon-7321610/"
  - entity_id: "Company:grupo-empresarial-inmark"
    name: "Grupo Empresarial Inmark"
    updated: "2026-06-01"
    resumen: "Grupo Empresarial Inmark S.A. (con su filial Task Force) es una consultora de investigación de mercados y marketing en la que Begoña Gómez, esposa del presidente Pedro Sánchez, trabajó entre 1999 y 2018 antes de dirigir el IE Africa Center. En el marco del caso instruido por el juez Juan Carlos Peinado, la Guardia Civil (UCO) examinó pagos vinculados a Gómez, entre ellos un cheque de 8.800 euros emitido por el grupo Inmark, entidad con la que mantuvo relación profesional regular. Un informe de la UCO de mayo de 2026 concluyó que la cátedra de la Complutense se creó conforme a la normativa prevista y no halló enriquecimiento ilícito, si bien puso el foco en las adjudicaciones de un software. La empresa aparece como entidad de contexto profesional de Gómez, sin atribución de ilícito; rige la presunción de inocencia."
    sources:
      - "https://www.infobae.com/espana/agencias/2026/05/25/la-uco-concluye-que-la-catedra-de-begona-gomez-se-creo-segun-la-normativa-prevista/"
      - "https://www.eldiario.es/politica/uco-no-halla-ingresos-opacos-begona-gomez-ultimo-informe-caso_1_13247052.html"
      - "https://www.elindependiente.com/politica/2018/08/08/begona-gomez-se-encargaba-en-su-empresa-de-contratar-personal-para-captar-donaciones/"
  - entity_id: "Company:have-got-time"
    name: "Have Got Time"
    updated: "2026-06-01"
    resumen: "Have Got Time, SL es la sociedad propietaria del chalet de La Alcaidesa (San Roque, Cádiz), constituida en enero de 2021 y, según la UCO, presuntamente controlada de forma indirecta por el empresario Claudio Rivas, socio de Víctor de Aldama. Según informes de la Guardia Civil al caso Koldo, José Luis Ábalos firmó el 1 de julio de 2021 con esta sociedad un contrato de alquiler con opción de compra (2.500 euros/mes y 665.000 euros de compra); la UCO sostiene que la presunta trama habría tratado de facilitarle el inmueble en beneficio del entonces ministro. Aparece en el grafo conectada a Claudio Rivas y al entorno de la presunta trama. Todos los implicados están investigados y rige la presunción de inocencia."
    sources:
      - "https://www.infobae.com/espana/agencias/2024/12/18/el-chalet-de-la-alcaidesa-que-la-presunta-trama-habria-facilitado-a-abalos-estaba-valorado-en-665000-euros/"
      - "https://www.elespanol.com/espana/20241015/aldama-trato-comprar-chalet-cadiz-abalos-meses-empresa-claudio-rivas/893411205_0.html"
  - entity_id: "Company:ixorigue-technologies"
    name: "Ixorigue Technologies"
    updated: "2026-06-01"
    resumen: "Ixorigue Technologies S.L. es una empresa de tecnología agropecuaria (monitorización de ganado mediante IoT) vinculada al empresario Juan Carlos Barrabés. En la investigación del juez Peinado sobre Begoña Gómez, la UCO la incluyó entre las sociedades del 'grupo Barrabés' al examinar adjudicaciones públicas; recibió, entre otros, un contrato de unos 11.563 euros para una intranet segura con Parques Nacionales y dos ayudas del Ministerio de Ciencia (230.486 euros en marzo de 2020 y 422.786 euros en diciembre de 2023). A diferencia de otras sociedades del grupo, no recibió préstamos del ICO. Aparece como entidad de contexto en la pieza sobre la presunta influencia de Gómez en contratos a Barrabés; Gómez ha negado haber influido en esas adjudicaciones, rige la presunción de inocencia y no consta condena."
    sources:
      - "https://www.eldiariodehuesca.com/actualidad/caso-begona-gomez-grupo-barrabes-ha-obtenido-249-millones-en-99-adjudicaciones-publicas_21465_102.html"
      - "https://www.libertaddigital.com/espana/2024-06-24/pleno-de-barrabes-ocho-sociedades-vinculadas-al-guru-de-begona-gomez-necesitaron-ayuda-del-ico-y-la-lograron-7139455/"
  - entity_id: "Company:zano-sociedad-consultora-sl"
    name: "Zaño Sociedad Consultora SL"
    updated: "2026-06-01"
    resumen: "Zaño Sociedad Consultora S.L. es la consultora, hoy extinta (disuelta el 1 de abril de 2026), que el histórico dirigente del PSOE andaluz Gaspar Carlos Zarrías Arévalo fundó tras dejar su escaño en 2015. A través de ella, Zarrías habría pagado unos 4.000 euros mensuales durante varios meses en 2024 a la exmilitante socialista Leire Díez (apodada 'la fontanera'), supuestamente para elaborar un informe sobre el comisario Villarejo. El 27 de mayo de 2026 la UCO registró el despacho de Zarrías y la sede de Ferraz dentro de un operativo, instruido por el juez Santiago Pedraz, sobre una presunta trama de financiación irregular del PSOE. Zarrías fue condenado en 2019 por la Audiencia de Sevilla por prevaricación en el caso de los ERE (condena ratificada por el Tribunal Supremo en 2022), pero el Tribunal Constitucional anuló parcialmente esa sentencia en 2024 y ordenó dictar una nueva resolución con rebaja de pena. Todos los implicados en el caso Leire Díez están investigados y rige la presunción de inocencia."
    sources:
      - "https://www.eldebate.com/espana/andalucia/20260527/uco-registra-despacho-gaspar-zarrias-exconsejero-junta-condenado-caso-ere_422013.html"
      - "https://www.cope.es/actualidad/espana/noticias/gaspar-zarrias-exvicepresidente-chaves-condenado-ere-e-imputado-caso-leire-diez-20260527_3372430.html"
      - "https://www.publico.es/politica/constitucional-ordena-rebajar-condena-exconsejero-zarrias-ere.html"
  - entity_id: "Person:carlos-moreno"
    name: "Carlos Moreno"
    updated: "2026-06-01"
    resumen: "Carlos Moreno Medina, licenciado en Derecho por la Universidad de Cádiz, es director del Gabinete de María Jesús Montero (vicepresidenta primera y ministra de Hacienda), cargo en el que es su 'mano derecha' desde 2018. En el caso Koldo, Víctor de Aldama declaró ante el Tribunal Supremo (diciembre de 2024) que Moreno le pidió que le buscara casas para comprar y que le pagó por un 'favor' tributario, atribuyéndole la entrega de 25.000 euros en un sobre, extremo que Moreno niega. Según la instrucción, Aldama pidió por WhatsApp (30 de junio de 2020) el aplazamiento de la deuda con la Agencia Tributaria de su empresa Pilot Real Estate SL, proponiendo pagar 250.000 euros y aplazar el resto a cinco años. Moreno ha reconocido ante el juez que trasladó la petición de aplazamiento a un asesor del Ministerio (cuyo nombre facilitó a la Fiscalía) y ha admitido 'dos o tres reuniones' con Aldama, negando haber cobrado dinero alguno. La ministra Montero declaró públicamente que pone 'la mano en el fuego' por él. No consta condena; rige la presunción de inocencia."
    sources:
      - "https://www.eldebate.com/espana/20241204/quien-carlos-moreno-jefe-gabinete-maria-jesus-montero-senalado-aldama-cns_250633.html"
      - "https://confilegal.com/20250304-carlos-moreno-el-jefe-de-gabinete-de-hacienda-niega-ante-el-supremo-haber-recibido-25-000-euros-de-la-trama-koldo/"
      - "https://www.elespanol.com/espana/tribunales/20250304/jefe-gabinete-montero-admite-aldama-pidio-aplazar-deuda-derivo-asesor-gestionarlo/928657362_0.html"
      - "https://theobjective.com/espana/tribunales/2026-04-22/exjefe-gabinete-montero-reuniones-aldama/"
  - entity_id: "Person:cristian"
    name: "Cristian"
    updated: "2026-06-01"
    resumen: "Cristian Abel Corvillo Aguilar, cordobés y exmilitante del PSOE, fue chófer de Pedro Sánchez durante su campaña por la Secretaría General del PSOE en 2017, recorriendo distintos puntos de Andalucía. Según informes de la UCO en el caso Koldo, se le atribuye un papel en la gestión de la compra de un chalet en La Alcaidesa (Cádiz) que, según el relato de Aldama, habría estado destinado a servir de dádiva a José Luis Ábalos: cuando la selección del chalet se cerró (24 de enero de 2021), Aldama le habría remitido el anuncio del inmueble y Corvillo habría dado su aprobación. La UCO también lo relaciona con la gestión de adjudicaciones de mascarillas de dos entidades del Ministerio de Transportes. Hasta donde consta en fuentes públicas, no está imputado formalmente en ninguna causa ni ha sido llamado a declarar, pese al papel que los informes le atribuyen. Rige la presunción de inocencia: las menciones en informes de la UCO no implican responsabilidad penal."
    sources:
      - "https://theobjective.com/espana/tribunales/2026-05-13/uco-chofer-sanchez-trama-koldo/"
      - "https://edatv.news/politica/cristian-corvillo-chofer-sanchez-que-estuvo-ferraz-con-aldama"
      - "https://www.elindependiente.com/espana/2025/06/21/la-uco-vuelve-a-poner-el-foco-sobre-el-chofer-de-sanchez-que-tenga-cuidado-de-lo-que-habla-de-mi/"
  - entity_id: "Organization:dxc-technology-servicios-espana-s-l-u"
    name: "Dxc Technology Servicios España S.L.U."
    updated: "2026-06-01"
    resumen: "DXC Technology Servicios España es la filial española de la multinacional de servicios de tecnología de la información DXC Technology, constituida el 30/06/2016, con NIF B87615100 y sede en Las Rozas de Madrid; su actividad (CNAE 6209) es la instalación, mantenimiento y soluciones informáticas para clientes públicos y privados. En el grafo aparece dentro del ecosistema de contratación pública analizado en la causa, pero de la documentación pública consultada no se desprende que DXC esté investigada ni imputada en la trama Koldo/Cerdán; debe presumirse su condición de proveedor mercantil legítimo salvo evidencia judicial en contrario."
    sources:
      - "https://www.datoscif.es/empresa/dxc-technology-servicios-espana-sl"
      - "https://infonif.economia3.com/ficha-empresa/dxc-technology-servicios-espana-sl"
      - "https://dxc.com/es/es/"
  - entity_id: "Organization:enajenaciones-de-materiales-ferroviarios-sa"
    name: "Enajenaciones de Materiales Ferroviarios SA"
    updated: "2026-06-01"
    resumen: "EMFESA (Enajenación de Materiales Ferroviarios, S.A., S.M.E., M.P.) es una sociedad pública dependiente de ADIF y ADIF Alta Velocidad que gestiona la venta de materiales ferroviarios innecesarios. Aparece en la causa porque, según informaciones periodísticas basadas en la investigación, presuntamente se habría facilitado la contratación en la empresa de personas del entorno de Koldo García —entre ellas Nicoleta Neacsu, que ingresó en 2021 y, según fuentes citadas, fue colocada por su relación con el directivo Vicente Calzado, y el hermano de Koldo, Joseba García—, lo que motivó denuncias internas por presunto enchufismo. En la comisión de investigación del Senado, Calzado negó que Koldo tuviera relación con la contratación de Joseba. Todos los hechos son objeto de investigación y rige la presunción de inocencia para las personas afectadas."
    sources:
      - "https://www.emfesa.es/emfesa/"
      - "https://theobjective.com/espana/tribunales/2025-06-02/emfesa-detalles-contrato-nicole-koldo/"
      - "https://theobjective.com/espana/tribunales/2025-12-06/nicole-euros-emfesa-koldo-olimpo/"
  - entity_id: "Organization:fundacion-la-caixa"
    name: "Fundación la Caixa"
    updated: "2026-06-01"
    resumen: "La Fundación 'la Caixa' es la fundación bancaria del grupo CaixaBank, dedicada a obra social, cultural y científica. Figura en la causa de Begoña Gómez porque, según la instrucción, en 2020 la esposa del presidente del Gobierno habría contactado con la Fundación para que financiara la Cátedra Extraordinaria de Transformación Social Competitiva de la Universidad Complutense; la Fundación aportó financiación en torno a 15.000 euros anuales durante cuatro años. Su subdirector, Marc Simón, declaró como testigo y explicó que patrocinaron la cátedra porque encajaba con su programa de inserción social (jóvenes 'ninis' y exreclusos). Su papel documentado es el de patrocinador/donante; no consta que la Fundación esté investigada. Rige la presunción de inocencia para todas las personas investigadas en la causa."
    sources:
      - "https://www.eldebate.com/espana/20240827/fundacion-caixa-declara-begona-gomez-contacto-ellos-2020-financiaran-catedra_222584.html"
      - "https://www.elespanol.com/espana/tribunales/20240826/juez-avisa-partes-filtraciones-caso-begona-darles-video-sanchez/881162183_0.html"
      - "https://www.infobae.com/espana/agencias/2024/09/10/fundacion-la-caixa-financio-la-catedra-de-begona-gomez-porque-cuadraba-con-su-programa-para-ayudar-a-ninis-y-presos/"
  - entity_id: "Person:gonzalez-fernandez"
    name: "González Fernández"
    updated: "2026-08-03"
    resumen: "El nodo se corresponde con Mercedes González Fernández, diputada socialista por Madrid en la XV legislatura del Congreso (lista del PSOE de las elecciones del 23 de julio de 2023). En el Congreso presidió la Comisión de Educación, Formación Profesional y Deportes y fue elegida secretaria primera de la Comisión de Investigación sobre los procesos de contratación de material sanitario por las administraciones públicas durante la pandemia de covid-19, vinculada al caso Koldo. En septiembre de 2024 dejó su escaño para reincorporarse como directora general de la Guardia Civil, cargo que ya había ocupado en 2023. El 2 de julio de 2026 el juez Santiago Pedraz la imputó en la causa de las 'cloacas'/Leire Díez (DP 150/2025, Audiencia Nacional), junto al DAO Manuel Llamas; declaró como investigada el 17 de julio de 2026, negando todo vínculo con la trama y afirmando ser 'víctima' de Leire Díez. El 29 de julio de 2026 Pedraz rechazó la medida cautelar de la acusación popular de apartarla del mando sobre la UCO mientras dura la instrucción. Sigue en el cargo. Rige plenamente la presunción de inocencia: está investigada, no condenada, y son diligencias de instrucción en curso."
    sources:
      - "https://discursia.com/psoe/mercedes-gonzalez-fernandez"
      - "https://www.publico.es/politica/socialista-madrilena-mercedes-gonzalez-deja-escano-congreso.html"
      - "https://www.articulo14.es/politica/quien-es-mercedes-gonzalez-la-directora-otra-vez-de-la-guardia-civil-20240917.html"
      - "https://theobjective.com/espana/tribunales/2026-07-02/juez-pedraz-directora-general-guardia-civil-dao-caso-leire/"
      - "https://www.eldebate.com/espana/20260729/juez-pedraz-rechaza-suspender-provisionalmente-cargos-directora-dao-guardia-civil_444910.html"
  - entity_id: "Company:google"
    name: "Google"
    updated: "2026-10-04"
    resumen: "Es la multinacional tecnológica estadounidense Google (filial de Alphabet Inc.). Aparece en esta base por el caso de la Cátedra Extraordinaria de Transformación Social Competitiva de la Universidad Complutense de Madrid, codirigida por Begoña Gómez, esposa del presidente del Gobierno Pedro Sánchez. Google figura entre las entidades colaboradoras/patrocinadoras de la cátedra (junto a Reale Seguros, Fundación La Caixa, Telefónica, Indra, Deloitte y otras) y entre las empresas que participaron y abonaron fondos para el desarrollo del software Transforma TSC. El juez instructor Juan Carlos Peinado procesó en abril de 2026 a Begoña Gómez, que goza de presunción de inocencia; Google no figura investigada y su mención es la de empresa colaboradora/patrocinadora citada en la instrucción."
    sources:
      - "https://www.infobae.com/espana/2026/04/13/el-juez-peinado-procesa-a-begona-gomez-por-trafico-de-influencias-corrupcion-en-los-negocios-malversacion-de-caudales-publicos-y-apropiacion-indebida/"
      - "https://theobjective.com/espana/tribunales/2026-05-25/uco-begona-gomez-ofertas-simuladas-contratos/"
  - entity_id: "Person:jesus-manuel-gomez-garcia"
    name: "Jesús Manuel Gómez García"
    updated: "2026-06-01"
    resumen: "Jesús Manuel Gómez García fue subsecretario del Ministerio de Transportes (antes Fomento) durante la etapa de José Luis Ábalos, cargo del que fue cesado en 2024 por el ministro Óscar Puente en el contexto del caso Koldo. Declaró como investigado ante el juez de la Audiencia Nacional Ismael Moreno, donde afirmó que Koldo García le trasladó la oferta de Soluciones de Gestión SL para el suministro de mascarillas y que él la transmitió a entes públicos (Puertos del Estado, Adif). Un informe de la UCO de la Guardia Civil lo describe como presunta 'correa de transmisión' entre el entorno de Ábalos y los entes adjudicadores. Posteriormente figura como testigo clave en el juicio a Ábalos en el Tribunal Supremo. Rige la presunción de inocencia."
    sources:
      - "https://www.elespanol.com/espana/tribunales/20240923/exnumero-transportes-declara-koldo-pidio-contratar-empresa-trama/888161359_0.html"
      - "https://www.infobae.com/espana/2024/09/23/el-subsecretario-cesado-por-puente-apunta-a-cuatro-ministerios-ante-el-juez-del-caso-koldo-transportes-sanidad-interior-y-defensa/"
      - "https://www.elespanol.com/espana/tribunales/20241218/jesus-manuel-gomez-subse-abalos-koldo-culpan-uco-senala-correa-transmision/909409688_0.html"
  - entity_id: "Company:kpmg-asesores-sl"
    name: "Kpmg Asesores Sl"
    updated: "2026-06-01"
    resumen: "KPMG Asesores S.L. es la rama española de consultoría de la red internacional KPMG. En el grafo aparece por el caso de Begoña Gómez / Barrabés (no por las mascarillas): formó una UTE con Innova Next SLU (empresa vinculada a Carlos Barrabés, socio de Begoña Gómez) que resultó adjudicataria del expediente 044/20-ED de Red.es (servicios de la oficina Acelera Pyme), por importe de 2.149.200 euros, resuelto en marzo de 2021. En la UTE Innova Next ostentaba el 40,64% y KPMG el 59,36%. La UCO analiza la valoración de las ofertas por presunto favorecimiento al adjudicatario, que obtuvo la mayor puntuación por escaso margen frente a otra licitadora. KPMG no figura como investigada; su rol es el de socio empresarial en la UTE adjudicataria."
    sources:
      - "https://okdiario.com/espana/uco-destapa-nuevo-contrato-2-millones-del-gobierno-socio-begona-gomez-12903288"
      - "https://okdiario.com/espana/socio-begona-gomez-gano-contrato-destapado-uco-apenas-cinco-decimas-12919267"
  - entity_id: "Company:lopera-activa-sl"
    name: "Lopera Activa SL"
    updated: "2026-06-01"
    resumen: "Lopera Activa S.L. es una sociedad cuyo titular es el constructor valenciano José Ruz, propietario asimismo de Levantina, Ingeniería y Construcción SL. Ruz es uno de los empresarios señalados en el caso Koldo por su cercanía a Koldo García y Víctor de Aldama. Según la UCO, su relación con Koldo García se inició hacia marzo de 2019. En diciembre de 2020 Lopera Activa intervino en una operación de compraventa de un vehículo (un Pathfinder) por 7.500 euros con MTM 180 Capital, sociedad de Aldama. La instrucción investiga una presunta trama de comisiones por adjudicaciones de obra pública del Ministerio de Fomento/Transportes; según declaraciones de Aldama recogidas por la prensa, Ruz habría pagado cantidades a Aldama, Ábalos y Koldo, extremos que Ruz no ha reconocido. Rige la presunción de inocencia para todos los implicados."
    sources:
      - "https://www.elespanol.com/espana/20240924/constructor-ruz-recibio-fomento-obra-conocer-koldo-pagar-aldama/888161760_0.html"
      - "https://www.elespanol.com/espana/20250107/constructor-ruz-aldama-pagaba-abalos-koldo-logro-contrato-valoracion-subjetiva-ministerio-transportes/914408596_0.html"
  - entity_id: "Organization:policia-judicial"
    name: "Policía Judicial"
    updated: "2026-06-01"
    resumen: "La Policía Judicial es la función policial de auxilio a la autoridad judicial y al Ministerio Fiscal en la averiguación de delitos y descubrimiento de los responsables, regulada en la Ley de Enjuiciamiento Criminal y la LOFCS. La integran unidades de la Guardia Civil y del Cuerpo Nacional de Policía; en el grafo aparece practicando diligencias como registros y volcados de teléfonos móviles bajo dirección del juez instructor y del Letrado de la Administración de Justicia, en el contexto del auto de la causa (auto-zapatero). No es una entidad imputable, sino el brazo operativo de la instrucción."
    sources:
      - "https://www.policia.es/_es/organizacion_areas_policiajudicial.php"
      - "https://www.boe.es/buscar/act.php?id=BOE-A-1882-6036"
  - entity_id: "Organization:policia-local"
    name: "Policía Local"
    updated: "2026-06-01"
    resumen: "La Policía Local es el cuerpo de policía municipal; en este grafo el alias 'Policía Local de Badajoz' la sitúa en el contexto de noticias locales de Badajoz (operativos de seguridad, controles de droga, sucesos en zonas como la rotonda del hotel Río y referencias a Elvas y Mérida). Su aparición procede de documentos de prensa local incorporados a la base, no de las causas centrales de corrupción (Koldo, Cerdán, Plus Ultra). Funciona como cuerpo de orden público municipal y no consta como objeto de investigación."
    sources:
      - "https://www.aytobadajoz.es/es/ayto/policia-local/"
  - entity_id: "Person:tatiana-abalos"
    name: "Tatiana Ábalos"
    updated: "2026-06-01"
    resumen: "Tatiana Ábalos es una de las hijas del exministro de Transportes y exsecretario de Organización del PSOE José Luis Ábalos. Según los informes de la UCO incorporados a la causa del Tribunal Supremo (caso Koldo), en junio de 2018 reclamó a Koldo García el pago de 4.472,33 euros a una cuenta de la fundación FIADELSO, abono que finalmente realizó la empresa navarra Servinabar (vinculada a Santos Cerdán) mediante una transferencia. La UCO señala que dirigía 'de facto' la fundación, que entonces llevaba años inactiva. No consta que esté imputada; aparece mencionada en la investigación a título informativo y rige plenamente la presunción de inocencia."
    sources:
      - "https://www.eldiario.es/comunitat-valenciana/uco-vincula-hija-abalos-pagos-trama-caso-koldo-fundacion-fiadelso-vinculada-psoe_1_12380506.html"
      - "https://theobjective.com/espana/politica/2025-06-13/tatiana-abalos-mordidas-cerdan-ong/"
      - "https://www.elindependiente.com/espana/2025/06/14/la-uco-relaciona-a-la-hija-de-jose-luis-abalos-con-un-donativo-de-la-trama-de-santos-cerdan/"
  - entity_id: "Organization:acusacion-popular"
    name: "Acusación Popular"
    updated: "2026-06-01"
    resumen: "La 'Acusación Popular' (y la 'Acusación Popular Unificada') no es una organización concreta sino una figura procesal del Derecho español que permite a cualquier ciudadano o entidad personarse como parte acusadora en causas penales, al amparo del art. 125 de la Constitución y la LECrim. En el grafo aparece como nodo genérico vinculado a varias causas (Causa Especial 20775/2020 del Supremo, auto de imputación de Begoña Gómez, etc.), donde distintos partidos y asociaciones ejercen esa acusación. Por ser un rol procesal y no un ente único identificable, es un nodo placeholder que debería resolverse a las acusaciones populares concretas de cada causa."
    sources:
      - "https://www.poderjudicial.es/cgpj/es/Temas/"
  - entity_id: "Company:aquaterra-servicios-infraestructuras-sl"
    name: "Aquaterra Servicios Infraestructuras SL"
    updated: "2026-06-01"
    resumen: "Aquaterra Servicios Infraestructuras S.L. es una empresa constructora que formó una unión temporal de empresas (UTE) con Acciona Construcción para concurrir a obra pública analizada en el caso Koldo, en concreto la Variante de Logroño (adjudicada el 11 de septiembre de 2019 por unos 92,4 millones de euros). Según la investigación del Tribunal Supremo y la UCO, esa obra figura entre los contratos examinados por la posible canalización de comisiones hacia la trama de Santos Cerdán a través de Servinabar, si bien la UTE de Logroño la integraron Acciona y Aquaterra. Aquaterra rompió su alianza con Acciona por la gestión de la obra de Logroño a finales de 2024. La empresa no ha sido condenada y rige la presunción de inocencia."
    sources:
      - "https://www.infobae.com/espana/agencias/2025/11/18/las-obras-adjudicadas-por-245-millones-a-la-ute-entre-acciona-y-la-empresa-vinculada-a-cerdan-que-el-ts-investiga/"
      - "https://theobjective.com/economia/transporte/2025-11-24/constructora-acciona-rioja/"
      - "https://contratos.gobierto.es/adjudicatarios/aquaterra-servicios-infraestructuras-s-l"
  - entity_id: "Person:arturo-barrabes-consul"
    name: "Arturo Barrabés Consul"
    updated: "2026-06-01"
    resumen: "Arturo Fernando Barrabés Cónsul es hermano del empresario tecnológico Juan Carlos (Carlos) Barrabés Cónsul, socio de Begoña Gómez en el máster de la Universidad Complutense. Según la información publicada, en junio de 2024 su hermano Carlos le otorgó poderes como apoderado en varias de sus firmas (entre ellas la consultora Innova Next y Formiguero) en plena instrucción del 'caso Begoña Gómez'. Arturo Barrabés figura en el grafo asociado a las empresas del grupo familiar; el investigado por presunto tráfico de influencias y corrupción en los negocios en esa causa es su hermano Carlos, sin que conste imputación de Arturo. Rige la presunción de inocencia."
    sources:
      - "https://theobjective.com/espana/2024-06-26/barrabes-poderes-hermanos-represente-empresas/"
      - "https://theobjective.com/economia/2024-12-25/barrabes-designa-apoderados-familia-firma-corrupcion/"
      - "https://www.eldiariodehuesca.com/actualidad/carlos-barrabes-acusado-trafico-influencias-corrupcion-en-negocios-en-sector-privado-dentro-caso-begona-gomez_42565_102.html"
  - entity_id: "Organization:bbva"
    name: "BBVA"
    updated: "2026-06-01"
    resumen: "BBVA es una de las mayores entidades financieras de España. En las causas de corrupción aparece como banco operativo de varios investigados: en junio de 2025 la UCO pidió al juez del 'caso Koldo' en el Tribunal Supremo que se requiriese a BBVA (junto a CaixaBank y Caja Rural de Navarra) información sobre cinco cuentas vinculadas a Santos Cerdán para rastrear movimientos. También figura en la causa de David Sánchez (hermano de Pedro Sánchez) instruida en Badajoz: a petición de la jueza, BBVA certificó que a 30 de junio de 2023 David Sánchez tenía 25.216,75 euros en acciones de BBVA (dentro de una cartera de 71.409 euros con Telefónica, Repsol, Redeia y Enagás). Su mención es la de un proveedor de servicios bancarios cuyas cuentas se analizan, sin que ello impute a la entidad."
    sources:
      - "https://www.libertaddigital.com/espana/2025-06-18/uco-pide-supremo-hacienda-analice-cuentas-santos-cerdan-bienes-extranjero-7267460/"
      - "https://www.cope.es/actualidad/espana/noticias/tribunal-supremo-pide-cuentas-bancarias-santos-cerdan-mujer-padres-hermana-20250618_3172059.html"
      - "https://theobjective.com/espana/tribunales/2024-12-13/bbva-juez-sanchez-euros-acciones/"
      - "https://www.eleconomista.es/actualidad/noticias/13132747/12/24/bbva-certifica-que-el-hermano-de-pedro-sanchez-tenia-71411-euros-en-acciones-y-no-los-14-millones-que-denuncio-manos-limpias.html"
  - entity_id: "Organization:caja-rural"
    name: "Caja Rural"
    updated: "2026-06-01"
    resumen: "Bajo este nodo se agrupan distintas cooperativas de crédito del grupo Caja Rural, siendo la más relevante para la causa la Caja Rural de Navarra. En junio de 2025 la UCO solicitó al juez del 'caso Koldo' en el Tribunal Supremo que se requiriese a Caja Rural de Navarra (junto a BBVA y CaixaBank) información sobre las cuentas en las que figura Santos Cerdán, en el marco del análisis de sus flujos económicos y de los de Servinabar. Las cajas figuran como entidades requeridas para aportar documentación bancaria, sin imputación alguna."
    sources:
      - "https://www.libertaddigital.com/espana/2025-06-18/uco-pide-supremo-hacienda-analice-cuentas-santos-cerdan-bienes-extranjero-7267460/"
      - "https://www.cope.es/actualidad/espana/noticias/tribunal-supremo-pide-cuentas-bancarias-santos-cerdan-mujer-padres-hermana-20250618_3172059.html"
  - entity_id: "Organization:comunidad-foral-de-navarra"
    name: "Comunidad Foral de Navarra"
    updated: "2026-06-01"
    resumen: "La Comunidad Foral de Navarra es la administración autonómica navarra. En la trama Cerdán-Servinabar aparece como administración adjudicadora: según el informe de la UCO y la documentación intervenida, Servinabar (de la que Santos Cerdán habría poseído un 45%) obtuvo adjudicaciones de obra pública de la administración foral por más de 75 millones de euros. La comunidad figura como entorno institucional donde se habrían adjudicado contratos bajo presunta influencia de la trama, sin que ello impute a la institución."
    sources:
      - "https://www.eldiario.es/euskadi/navarra-amplio-1-4-millones-contratos-servinabar-acciona-vivienda-le-dio-dedo-100-000-euros_1_12426287.html"
      - "https://okdiario.com/espana/este-contrato-que-acredita-que-cerdan-propietario-servinabar-empresa-clave-trama-15001313"
  - entity_id: "Person:director-general-financiero-y-de-control-de-gestion"
    name: "Director General Financiero y de Control de Gestión"
    updated: "2026-06-01"
    resumen: "Este nodo (un título de cargo) corresponde a Manuel Fresno Castro, director general financiero y de control de gestión de Adif en 2020. En el caso Koldo declaró como testigo: afirmó haber realizado un estudio de solvencia de las ofertas de mascarillas recibidas por Adif y declaró que el entramado de Soluciones de Gestión 'le ponía los pelos de punta'. Sostuvo que se ajustó a la normativa. Está amparado por la presunción de inocencia; declaró como testigo, no como investigado."
    sources:
      - "https://www.elindependiente.com/economia/2024/08/26/el-director-financiero-de-adif-sobre-la-empresa-de-mascarillas-del-caso-koldo-vi-un-entramado-que-me-ponia-los-pelos-de-punta/"
      - "https://www.moncloa.com/2024/10/09/caso-koldo-adif-2932398/"
  - entity_id: "Person:felicia-appenteng"
    name: "Felicia Appenteng"
    updated: "2026-06-01"
    resumen: "Felicia Appenteng, ejecutiva ghanesa-estadounidense, es la fundadora y presidenta (founding Chair) del IE Africa Center de la IE University, además de Managing Director de The IE Fund. Begoña Gómez, esposa del presidente del Gobierno Pedro Sánchez, fue nombrada directora ejecutiva del Africa Center en agosto de 2018. Según las propias notas de prensa de la IE University, Appenteng y Gómez (Chair y Executive Director del centro) se reunieron durante FITUR 2020 en Madrid con el consejero delegado de Globalia, Javier Hidalgo, para tratar la colaboración entre ambas instituciones. No consta que Appenteng esté imputada en la causa instruida por el juez Juan Carlos Peinado en torno a Begoña Gómez; rige la presunción de inocencia respecto de todos los investigados."
    sources:
      - "https://www.ie.edu/africa/news/ie-africa-center-meets-with-globalia-during-fitur/"
      - "https://www.ie.edu/africa/news/felicia-appenteng-named-chair-of-ies-africa-center/"
      - "https://www.moncloa.com/2024/09/14/felicia-appenteng-begona-gomez-2860742/"
      - "https://www.ie.edu/notesonacontinent/about-us/"
  - entity_id: "Organization:jefatura-de-la-seccion-economico-administrativa-26-base-aere"
    name: "Jefatura de la Sección Económico-Administrativa 26 - Base Aérea de Zaragoza"
    updated: "2026-06-01"
    resumen: "Es un órgano de contratación de las Fuerzas Armadas españolas (Ejército del Aire y del Espacio, Ministerio de Defensa), encargado de la gestión económico-administrativa y de la tramitación de expedientes de contratación en la Base Aérea de Zaragoza. Su mención en la causa Barrabés/Begoña Gómez obedece a que el Ejército del Aire figura entre los órganos públicos que adjudicaron contratos a la empresa Barrabés Ski Montaña S.L.U., una de las sociedades cuyos contratos públicos (en torno a 24,9 millones de euros entre 2020 y 2023, según estimaciones atribuidas a la UCO recogidas por la prensa) están siendo analizados en la investigación. Es un organismo administrativo, no una persona."
    sources:
      - "https://contrataciondelestado.es/wps/portal/plataforma"
      - "https://www.defensa.gob.es/"
      - "https://www.elplural.com/politica/espana/decenas-contratos-administraciones-pp-ejercito-casa-real-desmontan-caceria-contra-begona-gomez-barrabes_330930102"
  - entity_id: "Organization:oficialia-mayor"
    name: "Oficialía Mayor"
    updated: "2026-06-01"
    resumen: "La Oficialía Mayor es la unidad de un ministerio responsable de los servicios comunes, el régimen interior y la gestión de medios materiales. En la causa del 'caso Koldo' aparece porque en dependencias del entonces Ministerio de Transportes se almacenaron mascarillas vinculadas a los contratos de emergencia que se investigan; la auditoría encargada por el ministro Óscar Puente sobre esos contratos señaló 'la falta de control inicial' sobre los lotes de mascarillas. El responsable de esa unidad (el oficial mayor) fue cesado en enero de 2025. Es un órgano administrativo, no una persona ni un investigado, citado por su papel logístico en los hechos."
    sources:
      - "https://www.eleconomista.es/actualidad/noticias/13164000/01/25/oscar-puente-cesa-a-su-oficial-mayor-la-persona-encargada-de-controlar-la-compra-de-mascarillas-que-se-investiga-en-el-caso-koldo.html"
      - "https://confilegal.com/20250109-transportes-cesa-al-responsable-de-controlar-las-mascarillas-cuya-compra-investiga-la-justicia-en-el-caso-koldo/"
  - entity_id: "Organization:oficina-de-artes-escenicas"
    name: "Oficina de Artes Escénicas"
    updated: "2026-06-01"
    resumen: "La 'Oficina de Artes Escénicas' es la denominación del puesto que pasó a dirigir David Sánchez Pérez-Castejón (artísticamente David Azagra), hermano del presidente del Gobierno Pedro Sánchez, en la Diputación de Badajoz. Según las acusaciones, en 2022 su plaza se transformó en la jefatura de esta oficina sin convocatoria pública. En el juicio iniciado el 28 de mayo de 2026, David Sánchez no supo precisar la ubicación física ni la estructura de dicha oficina, que las acusaciones populares describen como un puesto presuntamente creado a medida. La Fiscalía no aprecia delito y no formuló acusación; las acusaciones populares piden pena de prisión e inhabilitación. Rige la presunción de inocencia: figura como investigado/acusado, sin sentencia."
    sources:
      - "https://www.libertaddigital.com/espana/2026-05-28/las-claves-del-primer-dia-de-juicio-a-david-sanchez-donde-esta-la-oficina-de-artes-escenicas-7411250/"
      - "https://www.eldiario.es/extremadura/politica/david-sanchez-banquillo-guia-seguir-juicio-hermano-presidente_1_13249954.html"
  - entity_id: "Organization:presupuestos-generales-del-estado"
    name: "Presupuestos Generales del Estado"
    updated: "2026-10-04"
    resumen: "Los Presupuestos Generales del Estado (PGE) son la ley anual que recoge la previsión de ingresos y gastos del sector público estatal en España. En esta base aparece porque documentos contenidos en el material del caso incluían anexos presupuestarios (inversiones reales y programación plurianual), en particular de la sección del Ministerio de Transportes. Se trata de una referencia documental genérica a la norma presupuestaria, no de una organización implicada ni de un investigado."
    sources:
      - "https://www.sepg.pap.hacienda.gob.es/sitios/sepg/es-ES/Presupuestos/Paginas/Presupuestos.aspx"
  - entity_id: "Organization:subdireccion-general-de-inspeccion-de-los-servicios-y-atenci"
    name: "Subdirección General de Inspección de los Servicios y Atención al Ciudadano"
    updated: "2026-06-01"
    resumen: "La Subdirección General de Inspección de los Servicios y Atención al Ciudadano es un órgano administrativo de control interno encargado de la inspección de los servicios y de la atención ciudadana dentro de un departamento ministerial. En el contexto del 'caso Koldo'/mascarillas aparece por su función inspectora en relación con la actuación del ministerio sobre la recepción y custodia de mascarillas (la auditoría se apoyó en entrevistas a personal). Es una unidad administrativa, no una persona ni un investigado."
    sources:
      - "https://confilegal.com/20250109-transportes-cesa-al-responsable-de-controlar-las-mascarillas-cuya-compra-investiga-la-justicia-en-el-caso-koldo/"
  # 070: fila retirada; summaries_qa061.yaml la elimina (remove: true), así que el grafo no la servía
  - entity_id: "Organization:asociacion-liberum"
    name: "Asociación Liberum"
    updated: "2026-06-01"
    resumen: "La Asociación Liberum es una de las entidades personadas como acusación popular en el caso Koldo, sobre la presunta trama de adjudicación de contratos de material sanitario durante la pandemia con José Luis Ábalos al frente del Ministerio de Transportes. Se personó como acusación popular y figura entre las acusaciones populares admitidas en la causa que instruye el Tribunal Supremo. Tras la decisión del instructor de unificar las acusaciones populares bajo la representación del PP (primera en personarse), Liberum recurrió esa unificación y la exclusión de asistir a determinadas declaraciones de investigados y testigos, llegando a pedir amparo al Tribunal Constitucional. Las personas investigadas en la causa están amparadas por la presunción de inocencia."
    sources:
      - "https://www.moncloa.com/2024/12/24/liberum-recurso-supremo-koldo-3075211/"
      - "https://www.teleprensa.com/articulo/nacional-3/liberum-pide-amparo-tc-decision-ts-unificar-pp-acusaciones-populares-caso-koldo/202503101257272055877.html"
      - "https://theobjective.com/espana/tribunales/2024-12-06/liberum-psoe-koldo-interes-general/"
  - entity_id: "Organization:caixa-de-c-dels-enginyers-cc-ingeniers-scc"
    name: "Caixa de C. dels Enginyers – CC Ingeniers SCC"
    updated: "2026-10-04"
    resumen: "La Caixa de Crèdit dels Enginyers - Caja de Crédito de los Ingenieros, S.C.C. (marca comercial Caja de Ingenieros / Caixa Enginyers) es una cooperativa de crédito española fundada en Barcelona en 1967 por un grupo de ingenieros y supervisada por el Banco de España. Es una entidad financiera legítima en activo. Su mención en esta base procede de figurar como entidad titular o gestora de cuentas bancarias (IBAN) rastreadas por la Guardia Civil en investigaciones patrimoniales relacionadas con las causas recogidas en esta base. No consta imputación alguna contra la entidad y rige la presunción de inocencia respecto a cualquier titular de esas cuentas."
    sources:
      - "https://es.wikipedia.org/wiki/Caja_de_Cr%C3%A9dito_de_los_Ingenieros"
      - "https://www.unacc.com/sector-de-cooperativas-de-credito/cooperativas-asociadas/caixa-de-credit-dels-enginyers-scc/"
  - entity_id: "Company:formiguero-barrabes-sl"
    name: "FORMIGUERO BARRABES SL"
    updated: "2026-06-01"
    resumen: "Formiguero Barrabés SL (NIF B87825402) es una sociedad del entramado empresarial de Juan Carlos Barrabés dedicada a la adquisición de participaciones en empresas tecnológicas. Aparece en el contexto de la investigación sobre los contratos públicos vinculados a empresas de Barrabés, en la causa que instruye el juez Juan Carlos Peinado en torno a Begoña Gómez, esposa del presidente del Gobierno, por presunto tráfico de influencias, y en la investigación paralela de la Fiscalía Europea. Según las informaciones publicadas, Juan Carlos Barrabés liquidó / disolvió voluntariamente esta sociedad poco antes de conocerse su citación como investigado en el 'caso Begoña'. La empresa no ha sido juzgada, Barrabés está investigado/imputado y rige la presunción de inocencia."
    sources:
      - "https://infonif.economia3.com/ficha-empresa/formiguero-barrabes-sl"
      - "https://theobjective.com/economia/2025-06-26/barrabes-liquida-empresa-begona-gomez/"
      - "https://theobjective.com/espana/tribunales/2026-04-14/fiscalia-europea-contratos-barrabes-begona-gomez/"
  - entity_id: "Person:francisco-flores"
    name: "Francisco Flores"
    updated: "2026-06-01"
    resumen: "Francisco Flores (registrado como 'Fco Flores' en la documentación manejada por Julio Martínez Martínez) es, según las fuentes periodísticas que recogen el informe de la UDEF en el caso Plus Ultra, un empresario venezolano vinculado al chavismo al que se atribuye el control 'desde la sombra' de la mercantil Softgestor, sociedad que habría transferido en torno a 145.200 euros a la consultora Análisis Relevante (de Julio Martínez). La UDEF aprecia indicios de artificiosidad documental (facturas con numeración idéntica y fechas distintas) en esa relación de pagos, cuya prestación efectiva de servicios no se habría acreditado. Se le relaciona también con el entorno de la entidad Sofitasa y figura en la investigación de la Audiencia Nacional sobre presunta financiación irregular del PSOE y de la Internacional Socialista. Las fuentes señalan que falleció en febrero de 2026. Todo se halla en fase de instrucción: rige la presunción de inocencia y no le ha sido atribuida responsabilidad penal firme."
    sources:
      - "https://www.infobae.com/espana/2026/05/25/los-hermanos-amaro-chacon-y-francisco-flores-quienes-son-los-empresarios-venezolanos-vinculados-al-entorno-de-zapatero-en-el-caso-plus-ultra/"
      - "https://www.elindependiente.com/espana/2026/05/25/udef-conecta-caso-plus-ultra-trama-koldo-traves-pagos-testaferros-contratos-simulados/"
      - "https://www.infobae.com/espana/2026/05/25/el-rastro-del-dinero-del-caso-plus-ultra-julio-martinez-canalizaba-los-fondos-de-las-influencias-y-zapatero-y-su-entorno-serian-los-principales-beneficiarios/"
  - entity_id: "Organization:hirurok"
    name: "Hirurok"
    updated: "2026-06-01"
    resumen: "Hirurok ('nosotros tres' en euskera) es el nombre con el que la investigación judicial (instruida por el juez Santiago Pedraz, Audiencia Nacional) identifica una presunta estructura organizada formada por Leire Díez (Castro), Vicente Cecilio Fernández Guerrero (exdirectivo de la SEPI) y Joseba Antxon Alonso (Egurrola), empresario vasco vinculado a Servinabar S.L., sociedad en la que Santos Cerdán habría tenido el 45%. Según la instrucción, la presunta trama se habría constituido en torno a 2021-2022 (las fuentes citan el 1 de junio de 2021 y el uso de un grupo cifrado en Threema) y habría buscado orientar procedimientos en la Administración pública en beneficio propio o de terceros, canalizar comisiones y desviar fondos (se investigan en torno a 700.000 euros) entre 2021 y 2023, además de presuntamente obstruir investigaciones judiciales que afectasen al PSOE o al Gobierno; se cita como caso relevante el rescate de Tubos Reunidos. El 27 de mayo de 2026 la UCO accedió a la sede del PSOE en Ferraz en el marco de la causa. Todo se halla en fase de instrucción y bajo presunción de inocencia de los investigados."
    sources:
      - "https://www.infobae.com/espana/2026/05/27/la-uco-entra-en-la-sede-del-psoe-para-buscar-informacion-sobre-hirurok-la-estructura-de-leire-diez-y-la-sepi-acusada-de-desviar-700000-euros/"
      - "https://confilegal.com/20260528-trama-hirurok-psoe-pedraz-investigacion-corrupcion-politica/"
      - "https://www.elindependiente.com/espana/2026/05/27/pedraz-sostiene-que-la-trama-intento-incrustar-a-leire-diez-en-la-presidencia-de-la-sepi-para-recuperar-el-control/"
  - entity_id: "Person:jose-cristobal-barrabes-consul"
    name: "José Cristóbal Barrabés Consul"
    updated: "2026-06-01"
    resumen: "José Cristóbal Barrabés Cónsul es uno de los tres hermanos Barrabés Cónsul (junto con Juan Carlos y Arturo), originarios del Pirineo oscense (Espés/Benasque). Según las fuentes, los tres hermanos ostentan participaciones en torno al 32,5% cada uno del grupo empresarial familiar (Barrabes Internet, Barrabés Ski Montaña, etc.). El grupo aparece en el informe de la UCO del caso de la cátedra de Begoña Gómez por la concentración de contratos públicos (en torno a 20,2 millones de euros, ~90% en 2021-2022) adjudicados a sociedades vinculadas a Juan Carlos Barrabés Cónsul, hermano de José Cristóbal e investigado por presunto tráfico de influencias y corrupción en los negocios en esa causa. No consta que José Cristóbal Barrabés Cónsul tenga la condición de investigado en la causa; su papel documentado es el de coaccionista familiar. Rige la presunción de inocencia."
    sources:
      - "https://www.libertaddigital.com/espana/2024-05-30/la-uco-destaca-la-lluvia-de-contratos-publicos-de-20-millones-a-la-consultora-del-amigo-de-begona-gomez-barrabes-7131987/"
      - "https://www.elespanol.com/porfolio/actualidad/20240615/dia-carlos-barrabes-conocio-benasque-pedro-sanchez-no-conspiracion-marisqueria/862664271_0.html"
      - "https://es.wikipedia.org/wiki/Caso_Bego%C3%B1a_G%C3%B3mez"
  - entity_id: "Person:jose-manuel-ruano"
    name: "José Manuel Ruano"
    updated: "2026-06-01"
    resumen: "Profesor titular de Ciencia Política y de la Administración de la Universidad Complutense de Madrid y director de su Escuela de Gobierno. Figura como codirector de uno de los títulos de Begoña Gómez en la UCM (el máster 'Transformación Social Competitiva: los ODS como estrategia' y la cátedra extraordinaria asociada), nombramiento exigido por la normativa interna que obliga a que el director sea profesor de la universidad. En el marco del procedimiento que instruye el juez Juan Carlos Peinado sobre la actividad universitaria de Begoña Gómez, declaró ante una comisión de la Asamblea de Madrid que el rector se vio obligado a poner fin a los másteres y cátedras vinculados. La Complutense le abrió un expediente por no aportar documentación del curso. Comparece como figura de contexto académico, sin que conste imputación penal contra él. Rige la presunción de inocencia."
    sources:
      - "https://www.elespanol.com/madrid/comunidad/20241218/ruano-coodirector-catedras-begona-gomez-ucm-rector-vio-obligado-echarla/909659225_0.html"
      - "https://www.eldiario.es/politica/complutense-alinearse-juez-peinado-abre-expediente-codirector-curso-begona-gomez_1_11922756.html"
  - entity_id: "Person:juan-guaido"
    name: "Juan Guaidó"
    updated: "2026-06-01"
    resumen: "Dirigente opositor venezolano que en 2019 se proclamó presidente encargado de Venezuela y fue reconocido por el Gobierno español y numerosos países occidentales. Aparece en la trama Koldo/Aldama porque, según las declaraciones de Víctor de Aldama ante el juez de la Audiencia Nacional Ismael Moreno, en 2019 actuó como 'enlace' del Gobierno español con la oposición venezolana, portando una carta del entonces ministro José Luis Ábalos que ofrecía apoyo institucional y empresarial español. Ábalos, en el Tribunal Supremo, ha negado la autenticidad de esa carta y ha calificado a Aldama de 'impostor', mientras que documentos publicados por la prensa respaldan la versión de Aldama; se trata de hechos controvertidos y no probados judicialmente. Guaidó es aquí un tercero ajeno a la presunta trama, mencionado solo por esas gestiones diplomáticas. Rige la presunción de inocencia para todos los implicados."
    sources:
      - "https://www.elespanol.com/espana/20241216/aldama-organizo-reunion-abalos-embajador-guaido-espana-enlace-gobierno-venezuela/908909197_0.html"
      - "https://es.euronews.com/2025/12/11/abalos-aldama-emisario-guaido-apoyo-empresarial-espana"
  - entity_id: "Person:juan-sanchez-yepes"
    name: "Juan Sánchez Yepes"
    updated: "2026-06-01"
    resumen: "Capitán de la Guardia Civil y exmando de la UCO. El juez de la Audiencia Nacional Santiago Pedraz lo investiga por presuntos delitos de revelación de secretos, cohecho y contra las instituciones del Estado en el llamado 'caso Leire'. Según las resoluciones judiciales difundidas, el juez le atribuye haber revelado información reservada sobre la estructura de la UCO y sobre el teniente coronel Antonio Balas a una red vinculada a Leire Díez y al exsecretario de Organización del PSOE Santos Cerdán, en una reunión celebrada en Madrid en diciembre de 2024. Aparece también investigado en una causa de hidrocarburos. Está representado por el letrado Jacobo Teijelo y, según la prensa, impartía cursos formativos (de ética/antiblanqueo) en la escuela de la Guardia Civil de Valdemoro. Rige la presunción de inocencia: es una investigación en curso, sin condena."
    sources:
      - "https://www.elindependiente.com/espana/2026/05/27/de-hidrocarburos-al-caso-leire-el-ex-capitan-de-la-uco-investigado-por-pedraz/"
      - "https://theobjective.com/espana/2026-05-28/exmando-uco-datos-sensibles-leire-diez-psoe/"
      - "https://www.elespanol.com/reportajes/20260530/sanchez-yepes-manzana-podrida-uco-investigado-hidrocarburos-caso-leire-daba-cursos-antiblanqueo/1003744264188_0.html"
  - entity_id: "Organization:organizacion-mundial-del-turismo"
    name: "Organización Mundial del Turismo"
    updated: "2026-06-01"
    resumen: "Agencia especializada de la ONU para la promoción del turismo, con sede en Madrid y dirigida desde enero de 2018 por el georgiano Zurab Pololikashvili. Aparece en la trama porque su XXIII Asamblea General (San Petersburgo, septiembre de 2019) fue el escenario en que Begoña Gómez coincidió con Víctor de Aldama y Javier Hidalgo (Globalia), y porque la OMT colaboró con Globalia y patrocinó actividades vinculadas a la carrera de Begoña Gómez. La prensa ha informado de que el Gobierno cedió gratuitamente la sede de la OMT durante 75 años en ese contexto. El organismo no está acusado de ningún delito; su mención sirve para contextualizar la red de contactos empresariales y personales que el caso Koldo/Aldama y la causa de Begoña Gómez examinan."
    sources:
      - "https://es.wikipedia.org/wiki/Organizaci%C3%B3n_Mundial_del_Turismo"
      - "https://www.libertaddigital.com/espana/2024-05-25/begona-gomez-exploto-su-alianza-con-globalia-y-la-omt-acuerdos-academias-conjuntas-y-actos-en-africa-7130278/"
  - entity_id: "Person:pablo-llarena-conde"
    name: "Pablo Llarena Conde"
    updated: "2026-06-01"
    resumen: "Magistrado del Tribunal Supremo, nacido en Burgos en enero de 1963, miembro de la Sala Segunda (de lo Penal) desde el 28 de enero de 2016. Licenciado en Derecho por la Universidad de Valladolid, ingresó en la carrera judicial por oposición en 1989 (número uno de su promoción) y fue presidente de la Audiencia Provincial de Barcelona (desde febrero de 2011) y presidente de la Asociación Profesional de la Magistratura (APM) entre 2013 y noviembre de 2015. Es conocido por haber sido el magistrado instructor de la causa especial contra los líderes del proceso independentista catalán. En el grafo aparece vinculado a causas especiales del Tribunal Supremo y a recursos de apelación, en su condición de magistrado/instructor, no como investigado."
    sources:
      - "https://www.poderjudicial.es/cgpj/es/Poder-Judicial/Tribunal-Supremo/Portal-de-Transparencia/Biografias/Llarena-Conde--Pablo"
      - "https://es.wikipedia.org/wiki/Pablo_Llarena"
  - entity_id: "Organization:santillana-formacion-s-l"
    name: "Santillana Formación S.L."
    updated: "2026-10-04"
    resumen: "Santillana Formación S.L. (CIF B82430596) es una sociedad de educación terciaria no universitaria (CNAE 8544) con sede en Madrid, constituida en 1999 (alta el 14/09/1999). El 23 de julio de 2021 cambió su denominación a Bejob Empleabilidad S.L. y figura controlada por Grupo Santillana Educación Global S.L.; Bejob es el portal de empleabilidad del grupo Santillana. En esta base aparece como licitadora en un procedimiento de contratación de acciones formativas analizado por la Guardia Civil/UCO, donde figura asociada al lote 1 junto a otras empresas de formación. Su mención es la de mera concursante en la mesa de contratación; no consta que esté investigada ni imputada."
    sources:
      - "https://www.einforma.com/informacion-empresa/santillana-formacion"
      - "https://faitedixital.xunta.gal/es/santillana-lanza-bejob-el-portal-para-mejorar-la-empleabilidad"
  - entity_id: "Person:silvia-maria-alvarado-diaz"
    name: "Silvia María Alvarado Díaz"
    updated: "2026-06-01"
    resumen: "Silvia María Alvarado Díaz aparece en el grafo como miembro de una mesa de contratación en un procedimiento de adjudicación de cursos de formación analizado en el informe de la Guardia Civil/UCO. No se han hallado fuentes públicas que confirmen ni amplíen este dato con fiabilidad, por lo que la atribución procede únicamente del propio expediente del grafo. No consta públicamente que esté investigada ni imputada; rige la presunción de inocencia."
  - entity_id: "Company:task-force-sa"
    name: "TASK FORCE SA"
    updated: "2026-06-01"
    resumen: "Task Force S.A. es una sociedad del Grupo Empresarial Inmark con sede en Madrid, absorbida por Inmark Europa S.A. el 27/06/2014. Begoña Gómez, esposa del presidente del Gobierno Pedro Sánchez, trabajó en el grupo Inmark desde 2000 como directora de consultoría de externalización comercial hasta 2018, y consta como socia-directora de Task Force (2015) y accionista minoritaria de Inmark hasta junio de 2022. Esta vinculación laboral se ha citado como antecedente profesional en la causa instruida por el Juzgado de Instrucción nº 41 de Madrid (juez Juan Carlos Peinado), en la que Gómez está investigada/imputada y rige la presunción de inocencia; de la relación con Task Force/Inmark no se deriva por sí misma delito alguno."
    sources:
      - "https://www.moncloa.com/2024/07/11/begona-gomez-accionista-2721095/"
      - "https://www.libertaddigital.com/espana/2024-06-30/grupo-absorbio-empresa-dirigida-begona-gomez-recibe-8-millones-subvenciones-estado-7142238/"
      - "https://es.wikipedia.org/wiki/Bego%C3%B1a_G%C3%B3mez_Fern%C3%A1ndez"
  - entity_id: "Organization:vicepresidencia-del-gobierno-de-navarra"
    name: "Vicepresidencia del Gobierno de Navarra"
    updated: "2026-06-01"
    resumen: "La Vicepresidencia (y consejerías) del Gobierno de Navarra figura en el grafo a partir del informe de la UCO en relación con el proyecto Mina Muga, mina de potasa promovida por Geoalcali (filial de la australiana Highfield Resources) entre Navarra y Aragón. Según el informe, el administrador único de Geoalcali, Pedro Antonio Rodríguez, solicitó por correo una reunión con la Vicepresidencia y consejerías navarras en torno al proyecto, mensaje en el que se dirigía a Koldo García. La UCO sitúa este asunto entre los primeros negocios en los que habrían puesto el foco Santos Cerdán y Koldo García. La aparición del organismo es contextual (interlocutor administrativo del proyecto minero); no implica que la institución ni sus responsables estén investigados o imputados. Rige la presunción de inocencia para todas las personas mencionadas."
    sources:
      - "https://www.eldiario.es/navarra/mina-muga-proyecto-uco-situa-origen-trama-cerdan-koldo-navarra_1_12381803.html"
      - "https://navarra.okdiario.com/articulo/politica/exdirectivo-geoalcali-admite-comision-navarra-contactos-koldo-garcia-cerdan-proyecto-mina-muga/20260415130532640784.html"
  - entity_id: "Organization:administrador-de-infraestructuras-ferroviarias"
    name: "Administrador de Infraestructuras Ferroviarias"
    updated: "2026-06-01"
    resumen: "El Administrador de Infraestructuras Ferroviarias (ADIF) es la entidad pública empresarial que gestiona la infraestructura ferroviaria en España. En el grafo aparece en el marco del caso Koldo: en marzo de 2020 ADIF contrató en torno a 5 millones de mascarillas FFP2 por un importe aproximado de 12,5 millones de euros, adjudicado a Soluciones de Gestión y Apoyo a Empresas S.L., empresa para la que Koldo García actuó como intermediario, cuando José Luis Ábalos era ministro de Transportes. El Tribunal de Cuentas observó que se exigió un anticipo del 50% contra aval bancario que no consta en el expediente. ADIF figura como entidad contratante/receptora dentro del expediente, no como investigada; las personas físicas mencionadas están sujetas a la presunción de inocencia en la causa abierta (caso Koldo)."
    sources:
      - "https://www.transportes.gob.es/el-ministerio/sala-de-prensa/noticias/mar-27022024-1836"
      - "https://www.elindependiente.com/economia/2024/08/29/la-auditoria-de-puente-revela-un-dedazo-para-el-reparto-de-las-mascarillas-encargadas-por-abalos/"
      - "https://www.elespanol.com/espana/20240303/baleares-interior-adif-avalaron-mascarillas-koldo-mismo-dia-documento/836666809_0.html"
  - entity_id: "Organization:altia-consultores-s-a"
    name: "Altia Consultores S.A."
    updated: "2026-10-04"
    resumen: "Altia Consultores S.A. es una empresa de consultoría tecnológica con sede en A Coruña, integrada en el grupo Boxleo TIC y vinculada al empresario Tino Fernández. Es adjudicataria recurrente de contratos públicos de servicios informáticos. En esta base aparece como licitadora (en UTE con otras empresas) en el procedimiento de contratación de acciones formativas analizado en el informe de la Guardia Civil. Con independencia de esa mención, la CNMC incoó en 2019 un expediente sancionador contra 25 empresas de consultoría -entre ellas Altia y su matriz Boxleo TIC- por indicios de prácticas anticompetitivas (reparto de mercado y ofertas ficticias en licitaciones, principalmente públicas, entre 2009 y 2018); dicho expediente está sujeto a presunción de inocencia y no guarda relación directa con las tramas de corrupción política del proyecto."
    sources:
      - "https://www.cnmc.es/node/373467"
      - "https://www.galiciapress.es/texto-diario/mostrar/1327029/altia-grupo-presidente-depor-expedientada-acusada-repartirse-contratos-publicos"
  - entity_id: "Organization:conservatorio-superior"
    name: "Conservatorio Superior"
    updated: "2026-06-01"
    resumen: "El Conservatorio Superior de Música 'Bonifacio Gil' de Badajoz es un centro de enseñanzas artísticas superiores dependiente de la Diputación de Badajoz. Aparece en la causa del llamado 'hermanísimo': según las acusaciones, en 2017 la Diputación habría creado un puesto de coordinador de actividades de los conservatorios al que accedió David Sánchez Pérez-Castejón, hermano del presidente del Gobierno Pedro Sánchez. Las acusaciones sostienen que la plaza se habría creado a medida; David Sánchez está investigado y niega irregularidades, y rige la presunción de inocencia. El conservatorio es aquí el escenario administrativo de los hechos, no un investigado."
    sources:
      - "https://www.eldiario.es/extremadura/politica/exdirector-conservatorio-badajoz-reconoce-habia-rumores-candidatos-plaza-ocupo-hermano-pedro-sanchez_1_12202010.html"
      - "https://www.infobae.com/espana/agencias/2024/11/27/amp2-la-uco-apunta-que-el-puesto-del-hermano-de-sanchez-atenderia-a-prioridades-distintas-a-las-de-los-conservatorios/"
      - "https://csmbadajoz.es/"
  - entity_id: "Organization:departament-d-interior"
    name: "Departament d'Interior"
    updated: "2026-10-04"
    resumen: "El Departament d'Interior (hoy Departament d'Interior i Seguretat Pública) es la consejería de la Generalitat de Catalunya competente en seguridad ciudadana, tráfico, emergencias, protección civil, prevención de incendios y la policía autonómica (Mossos d'Esquadra). Su aparición en esta base deriva de menciones documentales de los documentos analizados y no implica que el departamento sea objeto de investigación. Rige la presunción de inocencia para todos los implicados."
    sources:
      - "https://ca.wikipedia.org/wiki/Departament_d'Interior_de_la_Generalitat_de_Catalunya"
      - "https://interior.gencat.cat/ca/arees_dactuacio/policia/"
  - entity_id: "Organization:enaire"
    name: "ENAIRE"
    updated: "2026-06-01"
    resumen: "ENAIRE es la entidad pública empresarial que gestiona la navegación aérea civil en España, adscrita al Ministerio de Transportes y Movilidad Sostenible; además es accionista mayoritario, con el 51%, de Aena S.A. La denominación 'ENAIRE' proviene del cambio de nombre de la antigua AENA (entidad pública) en 2014. En los documentos analizados figura como uno de los organismos públicos destinatarios del reparto de mascarillas durante la pandemia; su aparición es la de receptor logístico del material, sin que se le atribuya papel alguno en la presunta trama de contratación."
    sources:
      - "https://www.enaire.es/home"
      - "https://es.wikipedia.org/wiki/ENAIRE"
      - "https://laadministracionaldia.inap.es/noticia.asp?id=1231185"
  - entity_id: "Organization:everis-spain-s-l"
    name: "Everis Spain S.L."
    updated: "2026-10-04"
    resumen: "Everis Spain S.L. es una consultora de tecnología y servicios con sede en España, propiedad del grupo japonés NTT DATA desde 2014; en octubre de 2021 la marca everis pasó a denominarse NTT DATA. Es proveedora habitual de la Administración pública española. Aparece en los documentos analizados como una de las empresas mencionadas; su presencia en esta base no implica imputación ni atribución de conducta irregular. Rige la presunción de inocencia."
    sources:
      - "https://es.wikipedia.org/wiki/NTT_Data_Espa%C3%B1a"
      - "https://www.elespanol.com/quincemil/economia/empresas/20211022/everis-gran-presencia-galicia-llamara-ntt-data-ahora-adelante/621439119_0.html"
  - entity_id: "Person:francisco-javier-lorente"
    name: "Francisco Javier Lorente"
    updated: "2026-06-01"
    resumen: "Francisco Javier Lorente (Rodríguez) es el gestor y dueño del bar Franky de Pamplona, establecimiento que según el informe de la UCO en la causa de Santos Cerdán habría actuado presuntamente como local intermediario para canalizar pagos en efectivo procedentes de ACCIONA o de sociedades vinculadas hacia el entorno de Koldo García. Lorente compareció el 24 de febrero de 2026 ante la comisión de investigación del Parlamento de Navarra, donde negó haber participado en cualquier trama de desvío de fondos, aseguró que nunca entregó dinero en efectivo a Koldo García y atribuyó la responsabilidad de las facturas a su asesor fiscal y amigo, Miguel Moreno Purroy (quien posteriormente admitió ante el juez haber emitido facturas a petición de Koldo García). Rige la presunción de inocencia: Lorente no figura como investigado en el procedimiento judicial."
    sources:
      - "https://www.noticiasdenavarra.com/politica/2026/02/24/gestor-bar-franky-niega-haber-10740419.html"
      - "https://www.eldiario.es/navarra/dueno-bar-franky-pamplona-senalado-uco-niega-haber-emitido-facturas-falsas-acciona_1_13015570.html"
  - entity_id: "Organization:gabinete-del-ministro"
    name: "Gabinete del Ministro"
    updated: "2026-06-01"
    resumen: "Gabinete del Ministro es una denominación genérica de la estructura de asesores y personal de confianza que asiste al titular de un ministerio. En la documentación del caso aparece referido al ámbito del Ministerio de Transportes, Movilidad y Agenda Urbana (Mitma) dirigido por José Luis Ábalos, entorno en el que Koldo García ejerció como asesor de confianza. No es una persona ni una entidad con personalidad jurídica propia, sino un órgano de apoyo. Su bajo poder identificativo hace que funcione más como referencia organizativa genérica que como entidad nominal concreta."
    sources:
      - "https://www.lamoncloa.gob.es/serviciosdeprensa/notasprensa/transportes/Paginas/index.aspx"
  - entity_id: "Organization:generalitat-valenciana"
    name: "Generalitat Valenciana"
    updated: "2026-06-01"
    resumen: "La Generalitat Valenciana es la Administración autonómica de la Comunitat Valenciana. En la documentación del caso Begoña Gómez aparece a través de la Conselleria de Innovación y del programa Distrito Digital: bajo el mandato de Ximo Puig, en 2021 se convocó (a través de la Sociedad Parque Temático de Alicante / Distrito Digital) una licitación de programas internacionales de innovación abierta en Turismo, Cambio Climático y Salud, cuyo lote de Turismo fue adjudicado a una UTE encabezada por Innova Next SLU, empresa del grupo de Juan Carlos Barrabés avalado por Begoña Gómez. La actuación de la Generalitat en sí no es objeto de imputación; su relevancia en el grafo es como adjudicador en la cadena de contratos investigada. Rige la presunción de inocencia respecto de todas las personas y entidades vinculadas."
    sources:
      - "https://elcierredigital.com/investigacion/correos-avalo-barrabes-contrato-del-gobierno-valenciano-bajo-mandato-puig"
      - "https://alicanteplaza.es/distrito-digital-finaliza-la-licitacion-de-programas-de-innovacion-en-turismo-cambio-climatico-y-salud"
  - entity_id: "Company:grupo-cueto"
    name: "Grupo Cueto"
    updated: "2026-06-01"
    resumen: "Grupo Cueto es el conglomerado de empresas de Juan Carlos Cueto que, según el informe de la UCO de la Guardia Civil, habría actuado como motor económico de Soluciones de Gestión y Ayuda a las Empresas SL, adjudicataria en 2020 de contratos de suministro de material sanitario (mascarillas) por encargos vinculados al Ministerio de Ábalos y a administraciones públicas. La UCO atribuye al grupo haber facilitado la financiación y ejercido buena parte de la dirección del negocio, y describe un reparto de fondos entre sociedades del grupo para presuntamente dificultar la trazabilidad del dinero. Víctor de Aldama, presunto comisionista de la operación, mantenía relación con Cueto. Todo se enmarca en una investigación judicial en curso, rigiendo la presunción de inocencia para las personas y entidades implicadas, que no han sido condenadas."
    sources:
      - "https://www.eldiarioalerta.com/articulo/espanha/grupo-cueto-soluciones-gestion-caso-psoe-lupa-judicial/20240302172346522449.html"
      - "https://www.vozpopuli.com/espana/koldo-empresas-cueto.html"
  - entity_id: "Organization:ifema"
    name: "IFEMA"
    updated: "2026-06-01"
    resumen: "IFEMA (Institución Ferial de Madrid, Feria de Madrid) es el principal consorcio ferial de España, organizador de certámenes como FITUR. En la documentación del caso Begoña Gómez figura en relación con el evento 'Mañana', celebrado en la Feria de Madrid del 12 al 14 de junio de 2019, organizado por IFEMA y Barrabés.biz e inaugurado por Begoña Gómez como experta en el tercer sector/innovación. Su mención es contextual, como recinto anfitrión y coorganizador de actos, sin que IFEMA aparezca como entidad investigada. Rige la presunción de inocencia respecto de las personas vinculadas a esos eventos."
    sources:
      - "https://www.ifema.es/en/calendar"
      - "https://www.vozpopuli.com/economia_y_finanzas/fundacion-monto-africa-center-begona-gomez-oculta-patrocino.html"
  - entity_id: "Organization:instituto-navarro-de-deporte-y-juventud"
    name: "Instituto Navarro de Deporte y Juventud"
    updated: "2026-06-01"
    resumen: "El Instituto Navarro de Deporte y Juventud (INDJ) es el organismo autónomo foral que gestiona instalaciones y políticas deportivas y de juventud en Navarra. Aparece en la investigación de la presunta trama Cerdán-Koldo porque fue el ente promotor del traslado de parte de sus oficinas al Navarra Arena, obra adjudicada en torno a 4,57 millones de euros a una UTE Acciona-Servinabar (80% Acciona, 20% Servinabar 2000). Esa alianza Acciona-Servinabar es la que la UCO sitúa en el foco del presunto entramado vinculado a Santos Cerdán. En sede parlamentaria (abril de 2026) el exdirector Rubén Goñi defendió la legalidad de la adjudicación y negó contactos previos con Servinabar, aunque planteó que la UTE pudo conocer su ventaja antes por la apertura pública de ofertas. La Oficina de Buenas Prácticas y Anticorrupción de Navarra concluyó en septiembre de 2025 que no apreciaba irregularidades de carácter invalidante en esa adjudicación. La investigación sobre la trama sigue su curso bajo presunción de inocencia; el organismo en sí no está acusado: es el marco administrativo de los contratos examinados."
    sources:
      - "https://es.wikipedia.org/wiki/Instituto_Navarro_de_Deporte_y_Juventud"
      - "https://navarracapital.es/las-empresas-y-proyectos-navarros-que-la-uco-relaciona-con-santos-cerdan-y-koldo-garcia/"
      - "https://www.noticiasdenavarra.com/politica/2025/09/30/oficina-anticorrupcion-encuentra-irregularidades-obra-10150498.html"
      - "https://www.noticiasdenavarra.com/politica/2026/04/14/ute-navarra-arena-pudo-ventaja-10940243.html"
  - entity_id: "Person:ion-fernando-antolin-llorente"
    name: "Ion Fernando Antolín Llorente"
    updated: "2026-06-01"
    resumen: "Ion Fernando Antolín Llorente, periodista natural de Villalón de Campos (Valladolid, 1977), fue jefe de prensa y director de Comunicación del PSOE ('el hombre fuerte' de la comunicación del partido). En diciembre de 2024 Pedro Sánchez lo nombró secretario de Estado de Comunicación, pero presentó su dimisión apenas unos 20 días después; no se trata, por tanto, de un cargo que ostente de forma continuada desde entonces. En el marco del llamado 'caso Leire Díez' instruido en la Audiencia Nacional, el juez Santiago Pedraz ordenó a la UCO rastrear correos corporativos, contabilidad y accesos a la sede de Ferraz, e incluyó a Antolín entre los investigados, atribuyéndole un presunto papel operativo en la maniobra que habría buscado desestabilizar procedimientos judiciales que afectaban al partido y al Gobierno, y situándolo en la reunión del 26 de abril de 2024 en Ferraz. Rige la presunción de inocencia: es una investigación en curso y no hay hechos probados. El correo corporativo asociado a su antiguo cargo figura entre los que la UCO debía examinar."
    sources:
      - "https://www.elespanol.com/castilla-y-leon/region/valladolid/20260529/ion-antolin-periodista-villalon-campos-dircom-psoe-ahora-investiga-audiencia-nacional/1003744263996_0.html"
      - "https://www.infobae.com/espana/2026/05/27/el-juez-pedraz-ordena-a-la-uco-rastrear-correos-cuentas-visitas-y-contabilidad-del-psoe-en-el-caso-leire-diez/"
      - "https://www.vozpopuli.com/espana/politica/el-juez-investiga-la-presencia-en-ferraz-de-una-treintena-de-investigados-en-causas-que-afectan-a-sanchez.html"
  - entity_id: "Person:ketty-garat"
    name: "Ketty Garat"
    updated: "2026-06-01"
    resumen: "Ketty Garat es periodista de The Objective, donde cubre Moncloa y Ferraz. Fue de las primeras en investigar, desde 2021, el caso Ábalos, abriendo una línea periodística que derivó en posteriores informaciones sobre el caso Koldo/Ábalos. Las querellas presentadas contra ella en relación con esas informaciones fueron archivadas/desestimadas. La Asociación de la Prensa de Madrid (APM) la eligió mejor periodista de 2025 por completar 'en 2025 un proceso iniciado en 2021' con sus exclusivas sobre la corrupción en el entorno del exministro José Luis Ábalos; en 2026 también recibió el premio Sociedad Civil. Su papel en la trama es estrictamente periodístico: no es investigada ni imputada; es autora de revelaciones sobre el caso."
    sources:
      - "https://theobjective.com/autor/ketty-garat/"
      - "https://theobjective.com/medios/2026-01-09/apm-ketty-garat-periodista-2025/"
      - "https://www.apmadrid.es/comunicado/victor-marquez-reviriego-ketty-garat-mar-manrique-y-marta-gonzalez-novo-premios-apm-de-periodismo-2025/"
  - entity_id: "Company:mtm-180-capital-sl"
    name: "MTM 180 Capital SL"
    updated: "2026-06-01"
    resumen: "MTM 180 Capital SL es una sociedad relacionada con Víctor de Aldama en la pieza del 'negocio de las mascarillas' del caso Koldo. Según la Agencia Tributaria, Aldama habría utilizado MTM 180 Capital (junto con otra sociedad, Deluxe Fortune SL) de forma artificiosa como 'instrumentos interpuestos' para facturar como ingresos societarios servicios que en realidad prestaba personalmente, obteniendo un presunto ahorro fiscal. Hacienda situó la cuota defraudada en torno a 2,4 millones de euros y la cantidad reclamable (tras descontar lo pagado en Impuesto de Sociedades de 2020) en unos 1,6 millones, apreciando indicios de un delito contra la Hacienda Pública. La AEAT considera a Aldama 'esencial' en la intermediación de contratos públicos de material sanitario durante la pandemia. Todo ello está bajo investigación y rige la presunción de inocencia: no consta condena."
    sources:
      - "https://www.publico.es/politica/tribunales/agencia-tributaria-cifra-2-4-millones-fraude-aldama-negocio-mascarillas.html"
      - "https://www.elindependiente.com/espana/2026/04/22/hacienda-reclama-16-millones-aldama-fraude-compra-mascarillas/"
      - "https://www.eldiario.es/politica/hacienda-concluye-aldama-defraudo-2-4-millones-contratos-mascarillas_1_13164191.html"
  - entity_id: "Company:making-science-group"
    name: "Making Science Group"
    updated: "2026-06-01"
    resumen: "Making Science Group, S.A. es una compañía española cotizada de tecnología, marketing digital y datos. Aparece en la investigación judicial sobre Begoña Gómez porque facturó a la Universidad Complutense unos 24.200 euros (IVA incluido) por el desarrollo e implantación del software de la 'Plataforma Transforma TSC' ligada a la cátedra extraordinaria que codirigía Gómez. Una auditoría interna de la UCM concluyó que en esa contratación 'se prescindió totalmente del procedimiento administrativo' legalmente exigible, lo que cuestiona su validez. Según documentación que la empresa remitió al juez, Cristina Álvarez, asesora/colaboradora de Gómez, participó en tres reuniones 'técnicas' sobre el software (la última, el 7 de febrero de 2024). La empresa es proveedora/aportante de documentación, no investigada; la causa contra Gómez sigue en instrucción bajo presunción de inocencia."
    sources:
      - "https://www.estrelladigital.es/articulo/tribunales/begona-gomez-ucm-making-science-plataforma-digital/20260531211258447020.html"
      - "https://www.elespanol.com/espana/tribunales/20260107/empresa-revela-juez-participacion-asesora-begona-gomez-reuniones-tecnicas-software/1003744080815_0.html"
      - "https://es.euronews.com/my-europe/2026/05/25/uco-irregularidades-catedra-begona-gomez-cuestiona-software"
  - entity_id: "Company:marco-infraestructuras-y-medio-ambiente-sa"
    name: "Marco Infraestructuras y Medio Ambiente SA"
    updated: "2026-06-01"
    resumen: "Marco Infraestructuras y Medio Ambiente SA (Mainsa), del Grupo Marco y con sede en Zaragoza, es una empresa constructora especializada en obra civil, carreteras y conservación/mantenimiento de infraestructuras para distintas administraciones. Aparece en el informe de la UCO sobre el caso Koldo/Ábalos en relación con un contrato de conservación de carreteras en Teruel (sector TE-02, por unos 5,7 millones de euros) adjudicado en abril de 2021 a una UTE formada por Marco Infraestructuras y Levantina, Ingeniería y Construcción (LIC): la UCO destacó un mensaje previo ('Teruel, marco+lic') y que la oferta económica de la UTE no era la más competitiva pese a resultar adjudicataria, por lo que ese expediente figura entre los contratos cuya licitación el juez pidió investigar. Su mención responde a la trazabilidad de adjudicaciones; no consta que la mercantil esté formalmente imputada y rige la presunción de inocencia. Públicamente también fue adjudicataria de obras de emergencia por daños de DANA en carreteras estatales de Teruel (N-211, N-234 y A-23) por cerca de 1,3 millones de euros."
    sources:
      - "https://marcoinfraestructuras.com/obra-publica/"
      - "https://www.diariodeteruel.es/comarcas/adjudicada-la-restauracion-de-las-carreteras-nacionales-afectadas-por-la-dana-en-teruel"
      - "https://empresite.eleconomista.es/MARCO-INFRAESTRUCTURAS-MEDIO-AMBIENTE.html"
      - "https://www.newtral.es/adjudicaciones-irregulares-uco-montero/20250619/"
      - "https://ecodeteruel.tv/el-supremo-sigue-investigando-la-obra-turolense-de-la-trama-koldo/"
  - entity_id: "Company:ortiz-construcciones-y-proyectos-sa"
    name: "Ortiz Construcciones y Proyectos SA"
    updated: "2026-06-01"
    resumen: "Ortiz Construcciones y Proyectos SA es una empresa constructora del grupo Ortiz dedicada a obra civil e infraestructuras. En el marco del caso Koldo/Ábalos aparece como integrante de la UTE (junto a Torrescámara y Levantina, Ingeniería y Construcción) adjudicataria del tramo Santo Domingo de la Calzada-Villamayor del Río de la Autovía del Camino de Santiago (A-12), por unos 72,4 millones de euros, obra incluida en el listado de contratos públicos que la documentación aportada por Víctor de Aldama señalaba como presuntamente amañados/preadjudicados y cuyo expediente el Tribunal Supremo pidió investigar. Su aparición en la causa deriva de esa trazabilidad de adjudicaciones; no consta que la mercantil esté formalmente imputada y rige la presunción de inocencia."
    sources:
      - "https://www.elespanol.com/espana/20250424/contratos-millones-sospecha-supremo-ordena-investigar-obras-amanadas-abalos/1003743726733_0.html"
      - "https://harodigital.com/noticias-de-rioja-alta/fomento-formaliza-el-contrato-del-tramo-entre-santo-domingo-y-villamayor-en-la-a-12/"
      - "https://www.burgosconecta.es/provincia/construccion-villamayor-rioja-20191206121757-nt.html"
      - "https://www.elcorreodeburgos.com/burgos/provincia/250620/236140/supremo-pide-transportes-expediente-obras-tramo-12-burgos-rioja.html"
  - entity_id: "Company:track-globe-sl"
    name: "TRACK GLOBE SL"
    updated: "2026-06-01"
    resumen: "Track Globe SL es una de las sociedades del entorno del empresario Juan Carlos Barrabés identificadas al rastrear contratos públicos del grupo Barrabés. Según la información publicada, Track Globe habría obtenido dos contratos de Enisa por un total de unos 41.409 euros (mantenimiento y hosting del portal corporativo y desarrollo de intranet). Aparece en el marco de la causa que investiga si los contratos a empresas vinculadas a Barrabés se vieron favorecidos por la posición institucional o las cartas de recomendación atribuidas a Begoña Gómez, esposa del presidente del Gobierno. Rige plenamente la presunción de inocencia: no hay condena y la mera adjudicación de contratos no implica ilícito."
    sources:
      - "https://okdiario.com/espana/barrabes-socio-imputado-begona-gomez-aspira-contrato-industria-624-000-euros-13346544"
      - "https://www.eldiariodehuesca.com/actualidad/caso-begona-gomez-grupo-barrabes-ha-obtenido-249-millones-en-99-adjudicaciones-publicas_21465_102.html"
  - entity_id: "Person:teofilo-serrano"
    name: "Teofilo Serrano"
    updated: "2026-06-01"
    resumen: "Teófilo Serrano Beltrán (Tudela, Navarra; fallecido el 3 de agosto de 2024 a los 74 años) fue ingeniero de Caminos, Canales y Puertos y funcionario del Estado. Durante los Gobiernos de Felipe González fue secretario de Estado para la Administración Pública; fue también director general del Instituto Geográfico Nacional, presidente de Renfe (2009-2011), senador por designación autonómica y ex secretario general de la Federación Socialista Madrileña del PSOE. Aparece mencionado en relación con el informe de la UCO sobre Santos Cerdán a propósito de nombramientos tras la moción de censura de 2018: según esa información, se barajó su designación al frente de Renfe/ADIF y Cerdán habría advertido a Koldo García para evitar que Serrano fuera colocado en ADIF ('Que no se le ocurra'), correspondiendo finalmente ese puesto a otra persona. Su papel es el de persona mencionada en esos repartos de cargos, con plena presunción de inocencia y sin que se le atribuya delito."
    sources:
      - "https://www.eldiario.es/politica/muere-teofilo-serrano-ex-secretario-general-psoe-madrid-expresidente-renfe-74-anos_1_11569471.html"
      - "https://www.infobae.com/espana/2025/11/18/santos-cerdan-negocio-con-el-pnv-tres-puestos-para-apoyar-la-mocion-de-censura-de-2018-y-con-acciona-otros-enchufes-en-transportes/"
  - entity_id: "Person:victor-abalos"
    name: "Víctor Ábalos"
    updated: "2026-06-01"
    resumen: "Víctor Ábalos es hijo del exministro de Transportes y exsecretario de Organización del PSOE José Luis Ábalos. En el marco del caso Koldo/Ábalos se le vincula a sociedades de consultoría e intermediación (citadas en prensa, entre ellas External Programmes Consulting SL / External Consulting Programmes SL) cuyo objeto sería intermediar entre gobiernos y empresas para contratación pública, con actividad en Latinoamérica. La UCO investiga si cobró por organizar cenas y reuniones entre empresarios y su padre y por facilitar el acceso a este; según mensajes y transferencias aportados a la causa, habría pagado regularmente a Koldo García. Declaró como primer testigo en el juicio del caso Koldo en el Tribunal Supremo (abril de 2026). Estos extremos son indicios y acusaciones, no hechos probados; tanto Víctor Ábalos como su padre han negado las imputaciones. Rige plenamente la presunción de inocencia."
    sources:
      - "https://www.elespanol.com/espana/20260406/victor-abalos-primer-testigo-juicio-hizo-negocios-padre-colombia-petro-pagaba-regularmente-koldo/1003744196768_0.html"
      - "https://www.elespanol.com/espana/20250207/empresa-hijo-abalos-objeto-intermediar-gobiernos-empresas-uco-investiga-cobro-montar-cenas-padre/922158202_0.html"

  # --- Swarm diarios Senado SEPI (2026-06-12) ---
  - entity_id: "Person:bartolome-lora-toro"
    name: "Bartolomé Lora Toro"
    resumen: "Bartolomé Lora Toro es vicepresidente de la Sociedad Estatal de Participaciones Industriales (SEPI) y ejercía como presidente en funciones en noviembre de 2020, cuando el Consejo Gestor aprobó el rescate de 475 millones de euros a Air Europa con cargo al fondo de apoyo a la solvencia de empresas estratégicas. Compareció en abril de 2026 ante una comisión de investigación del Senado, donde defendió la legalidad de la ayuda a Air Europa. En junio de 2026, el magistrado José María Escribano (Juzgado de Instrucción nº 49 de Madrid, Tribunal de Instancia) admitió a trámite una querella de PP y Vox y lo citó a declarar como investigado el 3 de julio de 2026 por un presunto delito de prevaricación administrativa en relación con dicho rescate. La querella se enmarca en la investigación del caso Koldo, en la que se examinan las gestiones de Ábalos, Koldo García y Aldama para impulsar el rescate de Air Europa; no ha sido juzgado y rige la presunción de inocencia."
    # sources: 5 url(s)
  - entity_id: "Person:maria-belen-gualda-gonzalez"
    name: "María Belén Gualda González"
    resumen: "Belén Gualda González preside la Sociedad Estatal de Participaciones Industriales (SEPI) desde el 30 de marzo de 2021, tras presidir Navantia (2019-2021); la SEPI gestionó el Fondo de Apoyo a la Solvencia de Empresas Estratégicas (FASEE) durante la pandemia. Compareció el 13 de abril de 2026 ante la comisión de investigación del Senado sobre la gestión de la SEPI, donde defendió la legalidad de los rescates de Plus Ultra (53 millones de euros) y Air Europa, afirmó que el fondo 'salvó 62.000 empleos' con condiciones 'muy exigentes' y sostuvo que Plus Ultra era una empresa solvente que cumplía los requisitos. Declaró que ni Zapatero ni Begoña Gómez participaron en las decisiones sobre esos rescates, y se negó a identificar a los accionistas de Plus Ultra pese a la insistencia de varios senadores. No consta que esté imputada en las causas judiciales sobre los rescates; rige la presunción de inocencia."
    # sources: 4 url(s)
  - entity_id: "Court:juzgado-numero-15-de-madrid"
    name: "Juzgado Número 15 de Madrid"
    resumen: "Juzgado de Instrucción número 15 de Madrid, cuya titular Esperanza Collazos instruyó la primera causa sobre el rescate de 53 millones de euros concedido por la SEPI a Plus Ultra con cargo al FASEE. Durante la instrucción acordó la práctica de una pericial económica sobre el expediente de la ayuda y mantuvo suspendido cautelarmente el pago del segundo tramo de 34 millones, suspensión que levantó en agosto de 2021. Mediante auto de 5 de enero de 2023 acordó el sobreseimiento provisional, después de que la Audiencia Provincial de Madrid anulara la citación de Plus Ultra como investigada por haberse practicado fuera del plazo legal de instrucción (art. 324 LECrim). La investigación sobre el rescate fue retomada en la Audiencia Nacional —el juzgado madrileño se inhibió en su favor en 2026—, donde el juez José Luis Calama (Sección de Instrucción del Tribunal Central de Instancia, Plaza nº 2) ha imputado al expresidente Zapatero por presuntos tráfico de influencias y otros delitos; rige la presunción de inocencia de todos los investigados."
    # sources: 4 url(s)
  - entity_id: "Company:duro-felguera"  # el nodo era LegalCase por error del extractor; relabel 2026-07-10 (manual_fix_duro_felguera_relabel_20260710.cypher)
    name: "Duro Felguera"
    updated: "2026-07-10"
    resumen: "Duro Felguera es una histórica compañía asturiana de ingeniería que recibió en marzo de 2021 un rescate de 120 millones de euros del fondo FASEE gestionado por la SEPI (estructura inicial: 70 millones en préstamo participativo, 20 en préstamo ordinario y 30 previstos como aportación de capital, tramo que, al no entrar un inversor privado, acabó convertido en préstamo participativo). Según informes de la UCO, compartió con Air Europa los servicios de asesoría de Víctor de Aldama, y la unidad rastrea un presunto trato de favor de la SEPI a cinco empresas rescatadas: Plus Ultra, Air Europa, Duro Felguera, Tubos Reunidos y Ávoris. En una causa distinta de la Audiencia Nacional, el juez Ismael Moreno acordó proponer juzgar a la compañía, a expresidentes y exdirectivos por presuntos sobornos de 105,6 millones de dólares en Venezuela, con petición de la Fiscalía Anticorrupción de una multa de 160 millones para la empresa. Su nombre aparece además en la libreta de anotaciones intervenida por la UCO a Leire Díez en la causa sobre la presunta 'fontanería' del PSOE instruida por el juez Pedraz. Todo ello son investigaciones o acusaciones no juzgadas en firme; rige la presunción de inocencia."
    # sources: 6 url(s)
  - entity_id: "Organization:agencia-estatal-de-seguridad-aerea"
    name: "Agencia Estatal de Seguridad Aérea"
    resumen: "La Agencia Estatal de Seguridad Aérea (AESA) es el organismo público adscrito al Ministerio de Transportes que supervisa, inspecciona y ordena la aviación civil en España. En el caso del rescate de Plus Ultra —53 millones de euros aprobados con cargo al Fondo de Apoyo a la Solvencia de Empresas Estratégicas gestionado por la SEPI— la agencia aparece, según los informes policiales UDEF 1907/1908 incorporados al expediente del caso, como organismo técnico que emitió valoraciones sobre los requisitos de elegibilidad y el plan de viabilidad de la aerolínea, en el ámbito regulatorio que correspondía al Ministerio de Transportes. Los chats intervenidos a directivos de Plus Ultra recogidos en esos informes reflejan gestiones y dudas de la compañía ante AESA sobre dicho plan de viabilidad. AESA actúa como organismo técnico del expediente y no figura como investigada."
    # sources: 2 url(s)
  - entity_id: "Organization:ministerio-de-hacienda"
    name: "Hacienda"
    resumen: "Nodo genérico extraído de los diarios de sesiones que agrupa menciones distintas bajo la palabra 'Hacienda': por un lado el Ministerio de Hacienda (departamento al que está adscrita la IGAE y que tutela el control del gasto), y por otro la Hacienda Pública/administración tributaria (AEAT) como acreedora, por ejemplo de las deudas tributarias de Plus Ultra examinadas en la comisión de investigación de la SEPI. En el contexto del caso Plus Ultra se discutió la situación de la aerolínea frente a Hacienda como acreedora al evaluar si era una 'empresa en crisis' antes del rescate. No es una entidad investigada; aparece como administración de control y como acreedora."
    # sources: 2 url(s)
  - entity_id: "Person:jose-blanco"
    name: "José Blanco"
    resumen: "José Blanco López, 'Pepe Blanco', fue secretario de Organización del PSOE (2000-2008), vicesecretario general (2008-2012) y ministro de Fomento (2009-2011); tras dejar la política fundó en 2019 la consultora de asuntos públicos Acento. En el caso Koldo aparece mencionado en informes de la UCO y en el material intervenido a Koldo García: según los registros del móvil del asesor, se reunió con él al menos ocho veces entre 2018 y 2021 para 'solucionar problemas de empresas' clientes de su lobby, y Ábalos declaró ante el juez que fue Blanco quien le propuso el nombramiento de Isabel Pardo de Vera, después presidenta de Adif. Ábalos y Koldo le han señalado en sus declaraciones como presunto eje de una red de influencias sobre el Ministerio de Transportes, extremo no acreditado judicialmente. Blanco reconoce algún encuentro pero niega cualquier práctica corrupta, resta recorrido judicial a las grabaciones intervenidas y no consta que haya sido formalmente imputado en la causa."
    # sources: 4 url(s)
  - entity_id: "Person:maria-jesus-montero"
    name: "María Jesús Montero"
    updated: "2026-06-20"
    resumen: "María Jesús Montero Cuadrado es una política del PSOE que fue ministra de Hacienda desde 2018 y vicepresidenta primera del Gobierno; dejó el Ejecutivo en marzo de 2026 (su último Consejo de Ministros fue el 24 de marzo) para centrarse en su candidatura a la presidencia de la Junta de Andalucía. Fue sustituida en Hacienda por Arcadi España, que tomó posesión el 27 de marzo de 2026. Previamente fue consejera de la Junta de Andalucía (Salud 2004–2013 y Hacienda 2013–2018). En el grafo aparece vinculada al Rescate de Plus Ultra y al expediente de mascarillas por su responsabilidad como titular de Hacienda en esos periodos; se trata de menciones por su cargo institucional, sin que conste que esté investigada ni imputada en estas causas. Rige plenamente la presunción de inocencia."
    sources:
      - "https://www.infobae.com/espana/2026/03/23/maria-jesus-montero-asegura-que-dejara-el-gobierno-en-los-proximos-dias-para-centrarse-en-su-candidatura-en-las-elecciones-de-andalucia/"
      - "https://www.eldiario.es/politica/maria-jesus-montero-despide-consejo-ministros-candidata-psoe-andalucia_1_13093251.html"
      - "https://www.lamoncloa.gob.es/serviciosdeprensa/notasprensa/hacienda/paginas/2026/270326-espana-posesion-ministro.aspx"
      - "https://www.infobae.com/espana/2026/03/26/quien-es-arcadi-espana-el-nuevo-ministro-de-hacienda-tras-la-salida-de-maria-jesus-montero/"
  - entity_id: "Company:step-one"
    name: "Step One"
    updated: "2026-06-20"
    resumen: "Step One Ventures, S.L. figura como una de las sociedades vinculadas al empresario Juan Carlos Barrabés, investigado en el caso Begoña Gómez. La causa, instruida por el juez Peinado, analiza las adjudicaciones públicas obtenidas por empresas del entorno de Barrabés (en especial Innova Next, S.L. y The Valley), y desde junio de 2026 cuenta con una pieza separada por un posible fraude a los intereses financieros de la UE en un contrato con fondos europeos. Barrabés está investigado, sin que ello prejuzgue responsabilidad penal alguna de las sociedades; rige la presunción de inocencia."
    sources:
      - "https://es.wikipedia.org/wiki/Caso_Bego%C3%B1a_G%C3%B3mez"
      - "https://theobjective.com/espana/tribunales/2026-06-19/peinado-begona-gomez-fiscalia/"
  - entity_id: "Company:talking-press-sl"
    name: "Talking Press Sl"
    updated: "2026-06-20"
    resumen: "Talking Press, S.L. figura como una de las sociedades vinculadas al empresario Juan Carlos Barrabés, investigado en el caso Begoña Gómez instruido por el juez Peinado. La causa analiza las adjudicaciones públicas obtenidas por empresas del entorno de Barrabés (principalmente Innova Next y The Valley) y, desde junio de 2026, una pieza separada por posible fraude a los intereses financieros de la UE en un contrato con fondos europeos. Barrabés está investigado; las sociedades aparecen en el análisis del entramado, sin condena ni prejuicio de responsabilidad. Rige la presunción de inocencia."
    sources:
      - "https://es.wikipedia.org/wiki/Caso_Bego%C3%B1a_G%C3%B3mez"
      - "https://theobjective.com/espana/tribunales/2026-06-19/peinado-begona-gomez-fiscalia/"
