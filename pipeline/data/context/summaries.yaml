  - entity_id: "Company:agropecuaria-lucena"
    name: "Agropecuaria Lucena"
    updated: "2026-06-20"
    resumen: "Agropecuaria Lucena SL es una sociedad que la investigación del caso Plus Ultra sitúa en el entramado societario presuntamente controlado por el empresario Julio Martínez Martínez, próximo al expresidente José Luis Rodríguez Zapatero. Según la prensa que recoge la instrucción (Córdoba BN, Canarias7), la mercantil está registrada en Petrer (Alicante) y es titular de una explotación de olivar en Lucena (Córdoba); una nave industrial vinculada a la sociedad habría servido como domicilio de hasta una veintena de sociedades instrumentales, y la mercantil habría realizado pagos, entre ellos unos 20.993 euros a Whathefav SL, sociedad gestionada por hijas de Zapatero. Todo ello son indicios recogidos por la investigación y reportados por prensa, no hechos probados; las personas y sociedades implicadas están investigadas bajo presunción de inocencia."
    sources:
      - "https://www.cordobabn.com/articulo/cordoba/agropecuaria-lucena-sl-vinculo-cordobes-trama-plus-ultra/20260521102826258725.html"
      - "https://www.canarias7.es/nacional/politica/trama-zapatero-telarana-internacional-blanqueo-capital-20260531000956-ntrc.html"
  - entity_id: "Organization:asociacion-hazteoir-org"
    name: "Asociación Hazteoir.org"
    updated: "2026-06-20"
    resumen: "HazteOír.org es una asociación civil ultraconservadora española que ejerce la acción popular como acusación en varios procedimientos relacionados con estas tramas. Figura entre las acusaciones populares personadas en la causa especial del Tribunal Supremo del caso Koldo/Ábalos, en el caso Plus Ultra (donde varias acusaciones populares fueron unificadas bajo la dirección letrada del PP) y en la causa contra el fiscal general. Su papel es estrictamente procesal —ejercer la acción popular—, no el de investigada."
    sources:
      - "https://www.eldiario.es/politica/supremo-admite-asociacion-ultra-hazteoir-acusacion-fiscal-general_1_12210307.html"
      - "https://www.estrelladigital.es/articulo/tribunales/caso-plus-ultra-pp-vox-hazteoir-zapatero/20260523121622446803.html"
  - entity_id: "Company:avintia"
    name: "Avintia"
    updated: "2026-06-20"
    resumen: "Avintia (Grupo Avintia) es una constructora española que aparece mencionada en el caso Koldo en relación con contratos de obra pública del Ministerio de Fomento/Transportes durante la etapa de José Luis Ábalos. La documentación aportada por Víctor de Aldama y las diligencias sugieren la presunta existencia de comisiones en la adjudicación de obras de carreteras en 2019; Avintia participó, en UTE con Constructora San José, en un contrato adjudicado por la Dirección General de Carreteras. La empresa ha negado pública y expresamente haber pagado comisión alguna, afirmando que la obra se ganó con la mejor oferta económica en concurso público. Son indicios bajo investigación, no hechos probados; rige la presunción de inocencia."
    sources:
      - "https://www.galiciapress.es/articulo/politica-galicia/2024-12-17/5110731-constructora-avintia-socia-san-jose-niega-pagara-comisiones-koldo-como-sugieren-papeles-aldama"
      - "https://www.elindependiente.com/espana/2025/12/01/abalos-koldo-acorralados-caso-mascarillas-amano-obras-agravar-penal/"
  - entity_id: "Person:blanca-de-juan"
    name: "Blanca de Juan"
    updated: "2026-06-20"
    resumen: "Blanca de Juan figura en la causa de Begoña Gómez como coordinadora de la Cátedra de Transformación Social Competitiva de la UCM. Según los informes de la UCO recogidos por la prensa, el dominio web www.transformatsc.org se registró el 21 de septiembre de 2022 inicialmente a su nombre y fue transferido el 14 de julio de 2023 al nombre de Begoña Gómez, coincidiendo con la salida profesional de De Juan de la UCM. No consta que esté investigada ni imputada; aparece como persona vinculada a la gestión académica de la cátedra y no consta que participara en el desarrollo del software. Rige la presunción de inocencia para todos los investigados en la causa."
    sources:
      - "https://okdiario.com/espana/uco-concluye-que-begona-gomez-registro-nombre-web-marca-del-software-pagado-complutense-17145958"
      - "https://theobjective.com/espana/tribunales/2026-05-25/begona-gomez-cuenta-sanchez-marca/"
  - entity_id: "Company:copasa"
    name: "COPASA"
    updated: "2026-06-20"
    resumen: "COPASA es una constructora gallega con sede en Ourense. Aparece en el caso Koldo como una de las tres constructoras gallegas (junto a San José y Puentes y Calzadas) que Koldo García mencionó en conversaciones recogidas por la UCO. Según el informe de la UCO, no consta evidencia de pagos de comisiones por parte de estas empresas gallegas, y la Guardia Civil interpreta que Cerdán habría reprochado a Koldo gestionar mordidas con constructoras fuera del esquema principal. La propia COPASA ha desmentido haber pagado comisiones. Su mención es indiciaria y contextual; rige la presunción de inocencia. El alias 'COPASA280' es ruido de OCR (número de nota a pie de página del informe) y no un nombre real."
    sources:
      - "https://www.galiciapress.es/articulo/politica-galicia/2025-06-13/5329865-koldo-menciono-gestiones-tres-constructoras-gallegas-san-jose-puentes-copasa"
      - "https://www.galiciapress.es/articulo/politica-galicia/2024-12-16/5109547-san-jose-niega-pagar-comisiones-como-sugieren-papeles-aldama-tambien-apunta-copasa"
  - entity_id: "Organization:consejo-superior-de-deportes"
    name: "Consejo Superior de Deportes"
    updated: "2026-06-20"
    resumen: "El Consejo Superior de Deportes (CSD) es el organismo público que gestiona la política deportiva del Estado. Aparece en el caso Begoña Gómez como una de las entidades públicas que adjudicó contratos a empresas del entorno de Juan Carlos Barrabés: en 2022 el CSD adjudicó a Innova Next (empresa de Barrabés) un contrato de unos 3,68 millones de euros financiado con fondos Next Generation EU para el 'Modelo de Innovación y Transformación Digital del Deporte', tramitado por procedimiento urgente. La sede del CSD fue registrada por la UCO en mayo de 2024. Un informe de la UCO de julio de 2024 avaló la 'normalidad' de las adjudicaciones, señalando que Innova Next presentó la oferta económica más baja; informes posteriores solicitados por el juez Peinado apuntaron a posibles indicios de irregularidad en la tramitación. Rige la presunción de inocencia para los investigados."
    sources:
      - "https://www.vozpopuli.com/espana/socio-begona-gomez-contrato-csd-fondos-ue.html"
      - "https://www.elespanol.com/espana/tribunales/20240711/uco-avala-nuevo-informe-normalidad-contratos-barrabes-no-ve-rastro-begona/869413601_0.html"
  - entity_id: "Organization:conservatorios"
    name: "Conservatorios"
    updated: "2026-06-20"
    resumen: "Se refiere a los conservatorios de música dependientes de la Diputación de Badajoz. Constituyen el contexto del caso David Sánchez: el hermano del presidente del Gobierno, David Sánchez Pérez-Castejón, fue contratado en 2017 como coordinador de actividades de los conservatorios de música (después Oficina de Artes Escénicas), plaza cuya creación y adjudicación se investiga por presuntas irregularidades. Según las acusaciones, la plaza se habría diseñado a medida; David Sánchez y el expresidente de la Diputación Miguel Ángel Gallardo están acusados de presunta prevaricación y tráfico de influencias en un juicio celebrado en 2026, en el que la Audiencia de Badajoz exoneró por prescripción el delito de aceptación de nombramiento ilegal. Rige la presunción de inocencia. Es un nodo de organismo/centro de trabajo, algo genérico pero identificable."
    sources:
      - "https://es.wikipedia.org/wiki/Caso_David_S%C3%A1nchez"
      - "https://www.libertaddigital.com/espana/2026-06-01/audiencia-badajoz-exonera-david-sanchez-delito-aceptacion-nombramiento-ilegal-prescrito-7413159/"
  - entity_id: "Company:corpoestructura"
    name: "Corpoestructura"
    updated: "2026-06-20"
    resumen: "Corpoestructura S.L. es una sociedad constituida en julio de 2018 que aparece en la investigación del rescate de la aerolínea Plus Ultra (auto del juez Calama / informes de la UDEF). Según el informe de la UDEF recogido por la prensa, un contrato firmado el 1 de abril de 2021 entre Análisis Relevante y Corpoestructura elevaba una contraprestación de 10.000 euros mensuales durante 40 meses (unos 484.000 euros más IVA), que la UDEF analiza como posible vehículo de pagos dentro de la presunta red de influencias atribuida a José Luis Rodríguez Zapatero, imputado en mayo de 2026 por blanqueo y pertenencia a organización criminal. Todo ello son indicios de un informe policial en una causa abierta; rige la presunción de inocencia."
    sources:
      - "https://www.mundiario.com/articulo/politica/udef-contrato-1-plus-ultra-sombras-empresariales-que-cercan-zapatero/20260526015312387869.html"
      - "https://www.eldiario.es/politica/zapatero-imputado-blanqueo-capitales-caso-plus-ultra_1_13231540.html"
  - entity_id: "Person:eudoro-antonio-gonzalez-dellan"
    name: "Eudoro Antonio González Dellán"
    updated: "2026-06-20"
    resumen: "Eudoro Antonio González Dellán es un abogado y exdiputado venezolano vinculado a la antigua oposición (Mesa de la Unidad Democrática / Primero Justicia). Según informaciones periodísticas y el auto del caso Plus Ultra, actuó como enlace de José Luis Rodríguez Zapatero, quien lo habría enviado a Venezuela antes de las elecciones de julio de 2024 como nexo entre Delcy Rodríguez (número dos del chavismo) y el candidato opositor Edmundo González, e intervino en la negociación de la salida de este último de la embajada española en Caracas. La relación previa entre ambos databa de las negociaciones opositoras de 2017-2018 en República Dominicana, en las que Zapatero medió. Es mencionado en la causa Plus Ultra como intermediario entre el Gobierno venezolano y figuras radicadas en España. No consta condena; rige la presunción de inocencia."
    sources:
      - "https://theobjective.com/espana/2026-05-22/plus-ultra-zapatero-edmundo-delcy/"
      - "https://talcualdigital.com/quien-es-eudoro-gonzalez-y-que-papel-jugo-en-la-salida-de-edmundo-gonzalez-del-pais/"
  - entity_id: "Organization:fernandez-menendez"
    name: "Fernández Menéndez"
    updated: "2026-06-20"
    resumen: "Los hermanos Antonio y Daniel Fernández Menéndez están vinculados a la mercantil granadina OPR (Obras Públicas y Regadíos), con sede en la provincia de Granada; Daniel figura como administrador de OPR. En el marco del caso Koldo/Cerdán, el Tribunal Supremo ordenó registros en sus domicilios y los citó a declarar como investigados (julio de 2025) por indicios de que habrían podido obtener, en connivencia con Ábalos y su exasesor Koldo García, contratos de obra pública a cambio de pagos o beneficios económicos; la UCO referencia en concreto contratos en Asturias y Galicia. Ambos negaron ante el Supremo el pago de mordidas. Rige plenamente la presunción de inocencia: son investigados, no condenados."
    sources:
      - "https://www.101tv.es/ts-cita-declarar-dos-empresarios-granadinos-investigados-caso-koldo/"
      - "https://www.elindependientedegranada.es/politica/uco-hallo-datos-adjudicaciones-contrato-obras-casa-hermano-koldo-esquema-sobre-abalos"
      - "https://www.teleprensa.com/articulo/granada/dos-empresarios-granadinos-investigados-caso-koldo-niegan-ts-pago-mordidas/202507041302262162008.html"
  - entity_id: "Company:freyssinet-sau"
    name: "Freyssinet SAU"
    updated: "2026-06-20"
    resumen: "Freyssinet SAU es una empresa española de construcción e ingeniería civil especializada en pretensado y refuerzo de estructuras, filial del grupo internacional Soletanche Freyssinet, heredero de la obra de Eugène Freyssinet, inventor del pretensado. En la investigación de la trama Ábalos/Cerdán figura como integrante de una UTE junto a Acciona y Tecade SA que obtuvo la adjudicación de la ampliación del Puente del Centenario de Sevilla; la UCO solicitó documentación en sus oficinas. Su mención es la de un licitador/adjudicatario más dentro del expediente; no consta que la empresa esté investigada como tal. Rige la presunción de inocencia."
    sources:
      - "https://www.soletanchefreyssinet.com/es/our-brands/freyssinet/"
      - "https://www.eldiario.es/economia/13-obras-recoge-informe-uco-tumbado-cerdan-suman-637-millones-e-incluyen-fondos-europeos_1_12380100.html"
      - "https://www.elindependiente.com/espana/2025/11/14/la-uco-registra-las-sedes-de-acciona-en-madrid-bilbao-y-sevilla-por-el-caso-koldo/"
  - entity_id: "Organization:fundacion-ie"
    name: "Fundación IE"
    updated: "2026-06-20"
    resumen: "La Fundación IE es la fundación vinculada al IE University / Instituto de Empresa que creó y albergó el IE Africa Center, cuya dirección ocupó Begoña Gómez, esposa del presidente del Gobierno Pedro Sánchez, entre agosto de 2018 y junio de 2022. En la investigación del caso Begoña Gómez se ha examinado la relación del Africa Center con empresas como Wakalua (sociedad creada por Globalia que patrocinó actividades del centro), Globalia o el Grupo Barrabés. La prensa ha señalado falta de transparencia sobre sus patrocinadores. Begoña Gómez está investigada y rige plenamente la presunción de inocencia; la fundación es un actor del entorno, no una imputada."
    sources:
      - "https://www.vozpopuli.com/economia/fundacion-monto-africa-center-begona-gomez-incremento-ingresos-33.html"
      - "https://www.que.es/2022/06/07/begona-gomez-mujer-pedro-sanchez-deja-direccion-africa-center/"
      - "https://www.elespanol.com/espana/tribunales/20240507/ie-no-ingresos-africa-center-destino-eur-salarios-anos-begona-gomez/853165039_0.html"
  - entity_id: "Organization:hedima-dn-formacion-s-l-u"
    name: "Hedima Dn Formación S.L.U."
    updated: "2026-06-20"
    resumen: "HEDIMA D N FORMACION SL es una empresa con sede en Madrid (Avenida del Ensanche de Vallecas) dedicada a la formación y educación, con numerosas adjudicaciones públicas de formación a su nombre. En la investigación del caso Begoña Gómez aparece como una de las empresas licitadoras de un concurso público examinado: la documentación judicial señala que su oferta no especificaba las organizaciones, empresas e instituciones con las que colaboraría en la difusión ni ofrecía compromisos o cartas de apoyo. Su presencia en el grafo es la de un licitador más del expediente; no consta que la empresa esté imputada. Rige la presunción de inocencia."
    sources:
      - "https://www.axesor.es/Informes-Empresas/1502694/HEDIMA_D_N_FORMACION_SL.html"
      - "https://contratos.gobierto.es/adjudicatarios/hedima-d-n-formacion-s-l"
      - "https://infonif.economia3.com/ficha-empresa/hedima-d-n-formacion-sl"
  - entity_id: "Company:instalibero-district-sl"
    name: "Instalibero District SL"
    updated: "2026-06-20"
    resumen: "Instalibero District SL es una sociedad administrada por Manuel Sallés, imputado en la trama de los Hidrocarburos del caso Koldo. Según informes de la UCO incorporados a la causa, la empresa dio de alta a Koldo García el 27 de enero de 2022 con un sueldo de 1.950,50 euros mensuales, bajo la apariencia de un puesto de consultor de seguridad. La UCO investiga esa contratación como presuntamente 'fantasma', al no constar 'prestación efectiva de servicios', y consta que Koldo recibió además transferencias adicionales (entre ellas 5.000 euros como 'anticipo' en febrero de 2022). Todo ello se enmarca en una investigación en curso, con presunción de inocencia para las personas y sociedades implicadas."
    sources:
      - "https://www.libertaddigital.com/espana/2025-12-15/la-uco-investiga-la-contratacion-fantasma-de-koldo-en-una-empresa-de-la-trama-hidrocarburos-7332546/"
      - "https://www.moncloa.com/2025/09/11/nomina-koldo-hidrocarburos-3261307"
      - "https://www.elespanol.com/espana/20250124/empresario-contrato-koldo-salir-ministerio-imputado-trama-fuel-viajar-venezuela/918658635_0.html"
  - entity_id: "Organization:jefatura-de-asuntos-economicos-de-la-fuerza-terrestre"
    name: "Jefatura de Asuntos Económicos de la Fuerza Terrestre"
    updated: "2026-06-20"
    resumen: "La Jefatura de Asuntos Económicos de la Fuerza Terrestre es un órgano administrativo del Ejército de Tierra español encargado de la gestión económica y de actuar como órgano de contratación en licitaciones públicas militares. Aparece en la documentación de la causa como un organismo público convocante de contratos; su mención no implica imputación alguna contra el órgano."
    sources:
      - "https://es.wikipedia.org/wiki/Ej%C3%A9rcito_de_Tierra_(Espa%C3%B1a)"
      - "https://contrataciondelestado.es/wps/portal/plataforma"
  - entity_id: "Organization:jefatura-de-intendencia-de-asuntos-economicos-este"
    name: "Jefatura de Intendencia de Asuntos Económicos Este"
    updated: "2026-06-20"
    resumen: "La Jefatura de Intendencia de Asuntos Económicos Este es un órgano de contratación del Ejército de Tierra español con ámbito territorial en la zona Este. Se trata de un organismo público convocante de contratos; su aparición en la causa no supone atribución de responsabilidad alguna al órgano."
    sources:
      - "https://contrataciondelestado.es/wps/portal/plataforma"
      - "https://es.wikipedia.org/wiki/Ej%C3%A9rcito_de_Tierra_(Espa%C3%B1a)"
  - entity_id: "Person:juan-carlos-peinado-garcia"
    name: "Juan Carlos Peinado García"
    updated: "2026-06-20"
    resumen: "Juan Carlos Peinado García es el magistrado titular del Juzgado de Instrucción n° 41 de Madrid e instructor de la causa contra Begoña Gómez, esposa del presidente Pedro Sánchez. Incoó las diligencias en 2024 y a lo largo de 2025-2026 acordó transformar el procedimiento para juzgarla ante un Tribunal del Jurado por delitos como malversación, corrupción en los negocios, tráfico de influencias y apropiación indebida. El 19 de junio de 2026 abrió una nueva pieza separada por presuntos delitos de prevaricación y fraude a los intereses financieros de la UE en relación con contratos adjudicados al empresario Juan Carlos Barrabés financiados con fondos europeos, asunto que la Fiscalía Europea no pudo asumir y que deriva de un informe de la UCO; en esa nueva pieza, según las aclaraciones del propio juzgado, solo figura imputado el empresario Barrabés. Como instructor, dirige la investigación; las personas investigadas gozan de presunción de inocencia."
    sources:
      - "https://es.wikipedia.org/wiki/Caso_Bego%C3%B1a_G%C3%B3mez"
      - "https://www.elespanol.com/espana/tribunales/20260619/peinado-abre-nueva-pieza-caso-begona-irregularidades-contrato-barrabes-envia-fiscalia-europea/1003744292113_0.html"
      - "https://www.infobae.com/espana/2026/06/19/el-juez-peinado-abre-una-nueva-pieza-en-el-caso-begona-gomez-y-le-imputa-otros-dos-delitos-por-presuntas-irregularidades-en-un-contrato-a-barrabes/"
  - entity_id: "Organization:kutxabank-s-a"
    name: "Kutxabank S.A."
    updated: "2026-06-20"
    resumen: "Kutxabank S.A. es un banco español con sede en Bilbao, surgido en 2012 de la integración de las cajas vascas BBK, Kutxa y Caja Vital. Figura en la documentación de la causa (en relación con el informe de la UCO sobre la trama de Santos Cerdán) como una de las entidades financieras a las que el juzgado, a petición de la UCO, requirió información sobre cuentas y movimientos para el análisis patrimonial de personas investigadas; consta entre las cerca de 35 entidades a las que se solicitaron datos de centenares de cuentas bancarias. Su presencia en el grafo es la de una entidad bancaria proveedora de información financiera, no la de un sujeto investigado; no se le atribuye participación en los hechos."
    sources:
      - "https://es.wikipedia.org/wiki/Kutxabank"
      - "https://theobjective.com/espana/2025-06-13/juez-cuentas-bancarias-2014-red-cerdan/"
      - "https://www.kutxabank.es/"
  - entity_id: "Person:manuel-martinez"
    name: "Manuel Martínez"
    updated: "2026-06-20"
    resumen: "Manuel Martínez Martínez es hermano de Julio Martínez Martínez, empresario presentado en la investigación como presunto testaferro del expresidente José Luis Rodríguez Zapatero en el caso Plus Ultra. Según los informes (UCO/ONIF) incorporados a la causa y la información publicada por la prensa, Julio Martínez, junto con sus hermanos, figura en el entorno de las sociedades del grupo que habrían canalizado fondos vinculados al rescate de Plus Ultra (entre ellas Análisis Relevante). El reparto exacto de la titularidad familiar (cifra en torno al 75%) procede de los informes de la causa; la prensa lo atribuye a la investigación, no como hecho probado. Manuel Martínez aparece en este contexto como copartícipe familiar de la estructura societaria. Está en una causa en instrucción; rige la presunción de inocencia y no consta imputación firme ni condena."
    sources:
      - "https://www.infobae.com/espana/2026/05/25/el-rastro-del-dinero-del-caso-plus-ultra-julio-martinez-canalizaba-los-fondos-de-las-influencias-y-zapatero-y-su-entorno-serian-los-principales-beneficiarios/"
      - "https://theobjective.com/espana/2026-04-16/julio-martinez-chalet-zapatero-de-plus-ultra/"
  - entity_id: "Person:manuel-salles-carceller"
    name: "Manuel Salles Carceller"
    updated: "2026-06-20"
    resumen: "Manuel (Manel) Sallés Carceller es un empresario vinculado a la sociedad Instalibero District SL, referido en el informe de la UCO de 8 de octubre de 2023 en relación con la obtención del título de operador de hidrocarburos para la mercantil Villafuel, en el marco de la llamada trama del fuel del caso Koldo/Hidrocarburos. Según la prensa y las declaraciones recogidas en la causa, Sallés contrató a Koldo García en Instalibero District (por importes en torno a 20.000 euros) y mantuvo contacto con su entorno; la UCO usa esta vinculación para conectar el caso Hidrocarburos con el caso Koldo. Está investigado en una causa abierta; rige la presunción de inocencia y no consta condena."
    sources:
      - "https://www.moncloa.com/2025/01/29/hidrocarburos-mascarillas-3115877/"
      - "https://theobjective.com/espana/politica/2025-01-30/empresario-abalos-trama-fuel-fraude/"
  - entity_id: "Person:mariano-moreno-pavon"
    name: "Mariano Moreno Pavón"
    updated: "2026-06-20"
    resumen: "Mariano Moreno Pavón fue gerente del PSOE entre 2017 y 2021, máximo responsable de la tesorería y la gestión financiera del partido en Ferraz durante el periodo en que José Luis Ábalos era secretario de Organización. Tras la salida de Ábalos del Gobierno fue nombrado presidente de la empresa pública Enusa, con un sueldo superior a los 200.000 euros anuales. Según informes de la UCO incorporados a la causa del caso Koldo, su nombre aparece vinculado a la presunta gestión de pagos en metálico ('sobres') al entorno de Ábalos; ante el Supremo, el propio exgerente y una trabajadora del PSOE declararon que esos pagos los gestionaba Koldo García. En abril de 2026 Moreno reconoció ante el juez haber podido gestionar 'algún ingreso atípico'. Se trata de indicios policiales y declaraciones judiciales; rige la presunción de inocencia y no consta imputación firme ni condena en el momento de redactar."
    sources:
      - "https://www.eldiariodemadrid.es/articulo/politica/guardia-civil-vincula-exgerente-psoe-mariano-moreno-pavon-pagos-metalico-entorno-abalos/20251018091901112100.html"
      - "https://www.infobae.com/espana/2025/10/29/el-exgerente-y-una-trabajadora-del-psoe-confirman-ante-el-supremo-que-los-pagos-en-metalico-para-abalos-los-gestionaba-koldo-garcia/"
  - entity_id: "Company:prismchain-sl"
    name: "PRISMCHAIN SL"
    updated: "2026-06-20"
    resumen: "Prismchain SL (CIF B87463980) es una sociedad mercantil que forma parte de la estructura societaria del empresario Juan Carlos Barrabés, controlada a través del holding Llitarrada Innova SL, según información publicada en prensa (Vozpópuli) y registros mercantiles (BORME). Esa estructura es objeto de análisis por la UCO en el marco de la investigación del caso Begoña Gómez sobre adjudicaciones con fondos públicos y europeos a empresas de Barrabés. Consta documentalmente que Prismchain protagonizó operaciones de fusión por absorción (p. ej., absorbió a Think Big Factory SLU, aprobada en 2020). Su mención en los informes es de carácter indiciario dentro del análisis patrimonial; no consta acusación ni condena específica contra la sociedad."
    sources:
      - "https://www.vozpopuli.com/economia/inmobiliario/socio-begona-gomez-muda-su-holding-personal-sede-rectores-madrid.html"
      - "https://www.boe.es/buscar/doc.php?id=BORME-C-2020-6999"
  - entity_id: "Organization:psn"
    name: "PSN"
    updated: "2026-06-20"
    resumen: "El PSN-PSOE es la federación del PSOE en Navarra, que gobierna la Comunidad Foral desde 2019 con la presidenta María Chivite, primera socialista en presidir la Comunidad Foral. En la trama Koldo aparece como el entorno orgánico del que procedían Santos Cerdán (exsecretario de Organización del PSOE) y Koldo García. Según el informe de la UCO, en marzo de 2017 Koldo García figuraba en un grupo de WhatsApp denominado \"Srios. Grales. PSN-PSOE\", dato citado para ilustrar su vinculación orgánica. La aparición del PSN en los documentos es contextual: identifica el partido de militancia de los investigados, sin que ello implique responsabilidad penal del partido."
    sources:
      - "https://es.wikipedia.org/wiki/Partido_Socialista_de_Navarra"
      - "https://www.psn-psoe.org/"
      - "https://www.elindependiente.com/espana/2024/11/25/el-secretario-de-organizacion-del-psoe-en-navarra-pongo-la-mano-por-cerdan-es-una-persona-honesta/"
  - entity_id: "Company:pilot-real-estate"
    name: "Pilot Real Estate"
    updated: "2026-06-20"
    resumen: "Pilot Real Estate S.L. es una sociedad inmobiliaria vinculada al empresario Víctor de Aldama, considerado por la Fiscalía y la UCO el presunto \"nexo corruptor\" de la trama Koldo. Según información publicada (The Objective), en 2018 la sociedad presentó una oferta por un complejo inmobiliario (Campos Velázquez) en el barrio de Salamanca de Madrid, y semanas antes de la detención de Aldama en 2024 trasladó su domicilio social a un municipio de Córdoba (Peñarroya-Pueblonuevo). La sociedad aparece en los documentos del caso como uno de los vehículos empresariales de Aldama, sin que ello prejuzgue responsabilidad penal alguna."
    sources:
      - "https://theobjective.com/espana/tribunales/2025-01-24/aldama-inmobiliaria-sanchez-cordoba-detenido/"
      - "https://www.datoscif.es/empresa/pilot-real-estate-sl"
  - entity_id: "Company:premier-plus-reward-program-s-l"
    name: "Premier Plus Reward Program, S.L"
    updated: "2026-06-20"
    resumen: "El programa de fidelización (millas) \"Premier\"/\"Premier Plus\" de la aerolínea Plus Ultra Líneas Aéreas fue lanzado en julio de 2019. La aerolínea fue objeto de un rescate público de 53 millones de euros concedido por la SEPI (FASEE) en marzo de 2021, hecho investigado por la Audiencia Nacional; el juez Calama ha imputado al expresidente José Luis Rodríguez Zapatero por presuntos delitos de tráfico de influencias y blanqueo, según informe de la UDEF, sin que exista sentencia y rigiendo la presunción de inocencia. En el grafo la sociedad figura vinculada al entorno societario de Plus Ultra (Alejandro Delgado Crego, María Ysabel Pestana Rojas, Roberto Roselli). Su mención es contextual sobre la estructura corporativa de la aerolínea; no se le atribuye conducta delictiva."
    sources:
      - "https://www.plusultra.com/es-es/blog/promocion-exclusiva-para-afiliados-de-premier-plus-reward-program/"
      - "https://en.wikipedia.org/wiki/Plus_Ultra_L%C3%ADneas_A%C3%A9reas"
      - "https://www.expreso.info/noticias/transporte/70024_plus_ultra_lanza_su_programa_de_fidelizacion_premier_plus"
  - entity_id: "Organization:registro-mercantil"
    name: "Registro Mercantil"
    updated: "2026-06-20"
    resumen: "El Registro Mercantil es la institución pública española, dependiente del Ministerio de Justicia, encargada de la inscripción y publicidad de los actos de las sociedades mercantiles (constitución, administradores, cuentas anuales, etc.). En los documentos del caso aparece de forma instrumental: como fuente de la que la Guardia Civil y la UDEF obtienen los datos societarios de las empresas investigadas. No es un actor de la trama, sino un registro administrativo consultado por los investigadores."
    sources:
      - "https://www.registradores.org/"
      - "https://es.wikipedia.org/wiki/Registro_Mercantil_(Espa%C3%B1a)"

  # ===== GLOSAS — conceptos abstractos (delitos y eventos), swarm/curaduría 2026-06-20 =====
  # Definiciones llanas + cómo aparecen en estas causas. NO son biografías; presunción de inocencia.
  - entity_id: "Crime:cohecho"
    name: "cohecho"
    updated: "2026-06-20"
    resumen: "El cohecho (arts. 419-427 del Código Penal) es el delito por el que una autoridad o funcionario público solicita o recibe una dádiva, regalo o favor para realizar u omitir un acto propio de su cargo, o como recompensa por uno ya realizado; castiga también al particular que ofrece o entrega el soborno (cohecho activo). En estas causas aparece de forma transversal como el presunto pago de comisiones a cambio de adjudicaciones o decisiones administrativas favorables. Es una calificación indiciaria: rige la presunción de inocencia y ninguna imputación equivale a condena."
    sources:
      - "https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444"
  - entity_id: "Crime:trafico-de-influencias"
    name: "tráfico de influencias"
    updated: "2026-06-20"
    resumen: "El tráfico de influencias (arts. 428-431 del Código Penal) consiste en influir sobre una autoridad o funcionario prevaliéndose de una relación personal o jerárquica para conseguir una resolución que genere un beneficio económico, propio o de un tercero. Es una de las calificaciones centrales del caso Begoña Gómez (presunto aprovechamiento de su posición para favorecer a empresas) y figura también en la pieza de Plus Ultra. Calificación indiciaria, bajo presunción de inocencia."
    sources:
      - "https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444"
  - entity_id: "Crime:blanqueo-de-capitales"
    name: "blanqueo de capitales"
    updated: "2026-06-20"
    resumen: "El blanqueo de capitales (arts. 298-304 del Código Penal) es adquirir, convertir, transmitir u ocultar bienes sabiendo que proceden de una actividad delictiva, con el fin de disimular su origen ilícito e introducirlos en el circuito económico legal. En estas causas se investiga como presunto lavado de los fondos de las tramas (señaladamente en Servinabar-Cerdán y en Plus Ultra/Zapatero). Es una atribución indiciaria sujeta a la presunción de inocencia."
    sources:
      - "https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444"
  - entity_id: "Crime:malversacion"
    name: "malversación"
    updated: "2026-06-20"
    resumen: "La malversación (arts. 432-435 del Código Penal) es el delito por el que una autoridad o funcionario sustrae —o consiente que un tercero sustraiga— los caudales o efectos públicos que tiene a su cargo, o les da una aplicación privada. Aparece en varias piezas (caso Begoña Gómez por el presunto uso de medios públicos de la Complutense y de personal, y en el ámbito de los contratos de la pandemia). Calificación indiciaria; rige la presunción de inocencia."
    sources:
      - "https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444"
  - entity_id: "Crime:financiacion-ilegal"
    name: "financiación ilegal"
    updated: "2026-06-20"
    resumen: "La financiación ilegal de partidos (art. 304 bis del Código Penal, en relación con la Ley Orgánica 8/2007) castiga recibir donaciones a un partido fuera del régimen legal: anónimas, finalistas o por encima de los límites permitidos. En la trama se vincula a los presuntos pagos en efectivo del entorno del PSOE que, según la UCO, habría gestionado Koldo García. Es una sospecha indiciaria sujeta a la presunción de inocencia y no implica condena del partido como tal."
    sources:
      - "https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444"
  - entity_id: "Crime:organizacion-criminal"
    name: "organización criminal"
    updated: "2026-06-20"
    resumen: "La organización criminal (arts. 570 bis a 570 quáter del Código Penal) es una agrupación de más de dos personas, con carácter estable y reparto coordinado de tareas, constituida para cometer delitos. La UCO atribuye a la trama una presunta estructura organizada para amañar adjudicaciones de obra pública y repartir las comisiones. Se trata de una calificación indiciaria de los instructores: rige plenamente la presunción de inocencia."
    sources:
      - "https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444"
  - entity_id: "Crime:fraude"
    name: "fraude"
    updated: "2026-06-20"
    resumen: "El fraude a la Administración (art. 436 del Código Penal) castiga al funcionario que, interviniendo en una contratación pública, se concierta con los interesados para defraudar al ente público; en sentido amplio el término engloba también la estafa (art. 248). En estas causas designa el presunto amaño de licitaciones y adjudicaciones de obra. Calificación indiciaria, bajo presunción de inocencia."
    sources:
      - "https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444"
  - entity_id: "Crime:prevaricacion"
    name: "prevaricación"
    updated: "2026-06-20"
    resumen: "La prevaricación administrativa (art. 404 del Código Penal) es el delito por el que una autoridad o funcionario dicta, a sabiendas de su injusticia, una resolución arbitraria en un asunto administrativo (existe una modalidad judicial en el art. 446). Aparece en piezas donde se investiga si determinadas decisiones de contratación o gestión fueron dictadas conscientemente al margen de la legalidad. Es una atribución indiciaria sujeta a la presunción de inocencia."
    sources:
      - "https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444"
  - entity_id: "Crime:apropiacion-indebida"
    name: "apropiación indebida"
    updated: "2026-06-20"
    resumen: "La apropiación indebida (art. 253 del Código Penal) consiste en apropiarse para sí o para otro de dinero o bienes recibidos en depósito, comisión o administración, con obligación de entregarlos o devolverlos. Figura entre las calificaciones de la pieza del caso Begoña Gómez. Es indiciaria y rige la presunción de inocencia."
    sources:
      - "https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444"
  - entity_id: "Crime:falsedad-documental"
    name: "falsedad documental"
    updated: "2026-06-20"
    resumen: "La falsedad documental (arts. 390-399 del Código Penal) abarca alterar, simular o faltar a la verdad en documentos públicos, oficiales o mercantiles. En estas causas se investiga respecto a facturación, contratos o certificaciones presuntamente falseados para justificar pagos o adjudicaciones. Calificación indiciaria bajo presunción de inocencia."
    sources:
      - "https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444"
  - entity_id: "Crime:corrupcion-en-los-negocios"
    name: "corrupción en los negocios"
    updated: "2026-06-20"
    resumen: "La corrupción en los negocios (art. 286 bis del Código Penal) es la corrupción en el sector privado: entregar o recibir dádivas para favorecer indebidamente a alguien en la adquisición de bienes o servicios, al margen del ámbito estrictamente público. Es una de las calificaciones de la pieza del caso Begoña Gómez en relación con su actividad y contactos empresariales. Indiciaria; rige la presunción de inocencia."
    sources:
      - "https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444"
  - entity_id: "Crime:revelacion-de-secretos"
    name: "revelación de secretos"
    updated: "2026-06-20"
    resumen: "La revelación de secretos abarca el descubrimiento y difusión de datos reservados de particulares (art. 197 del Código Penal) y la revelación por funcionario de secretos o informaciones conocidas por su cargo (art. 417). En el entramado de causas aparece señaladamente en la investigación al Fiscal General del Estado por la presunta filtración de datos de un procedimiento. Calificación indiciaria, bajo presunción de inocencia."
    sources:
      - "https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444"
  - entity_id: "Crime:uso-de-informacion-privilegiada"
    name: "uso de información privilegiada"
    updated: "2026-06-20"
    resumen: "El uso de información privilegiada por funcionario (art. 442 del Código Penal) castiga a la autoridad o funcionario que hace uso de un secreto o de una información reservada que conoce por razón de su cargo para obtener un beneficio económico, propio o de un tercero. Aparece como calificación indiciaria en piezas donde se investiga el aprovechamiento de información oficial. Rige la presunción de inocencia."
    sources:
      - "https://www.boe.es/buscar/act.php?id=BOE-A-1995-25444"
  - entity_id: "Event:comision-de-investigacion-sobre-los-contratos-publicos-duran"
    name: "Comisión de Investigación (contratos de la pandemia)"
    updated: "2026-06-20"
    resumen: "Comisión de Investigación del Congreso de los Diputados sobre los contratos, licencias, concesiones y ayudas públicas durante la pandemia de covid-19 relacionados con la intermediación de Koldo García y la trama de la Operación Delorme. Sus comparecencias y conclusiones son debate parlamentario y control político, NO prueba judicial: lo dicho en ellas no constituye hecho probado ni acusación formal."
  - entity_id: "Event:mascarillas"
    name: "mascarillas"
    updated: "2026-06-20"
    resumen: "Designa los contratos de emergencia de compra de material sanitario (mascarillas y otros suministros) adjudicados durante la pandemia de covid-19 a empresas vinculadas a la trama de Koldo García —núcleo del llamado 'caso Koldo'— y examinados por la UCO. La mención de un organismo o empresa en este contexto no implica responsabilidad penal: rige la presunción de inocencia sobre las personas investigadas."
  - entity_id: "Event:mina-muga"
    name: "Mina Muga"
    updated: "2026-10-04"
    resumen: "Mina Muga es un proyecto minero de extracción de potasa promovido por Geoalcali (grupo Highfield Resources) entre Navarra y Aragón. Aparece en esta base por su conexión con el entorno societario de Servinabar / Antxon Alonso, examinado en los informes de la UCO de la trama Cerdán. Su mención es contextual y no implica, por sí sola, conducta ilícita."
  - entity_id: "Event:puente-del-centenario"
    name: "Puente del Centenario"
    updated: "2026-10-04"
    resumen: "El Puente del Centenario es el puente atirantado sobre el Guadalquivir de la ronda SE-30 de Sevilla. Aparece en esta base porque las obras de su ampliación/refuerzo figuran entre las adjudicaciones de obra pública (UTE con Acciona) examinadas por la UCO en la trama Cerdán-Servinabar. Es un dato de contexto sobre las obras investigadas, no una imputación."
  - entity_id: "Event:master-propio-en-direccion-de-fundraising-publico-y-privado-"
    name: "Máster de Fundraising (UCM)"
    updated: "2026-06-20"
    resumen: "Máster Propio en Dirección de Fundraising Público y Privado en Organizaciones sin Ánimo de Lucro de la Universidad Complutense de Madrid, asociado a la cátedra que codirigió Begoña Gómez. Es uno de los focos del caso Begoña Gómez, en particular por el software desarrollado con participación de la empresa de Juan Carlos Barrabés y su registro. La mención es contextual; rige la presunción de inocencia."
  - entity_id: "Event:corredores-ten-t"
    name: "Corredores TEN-T"
    updated: "2026-10-04"
    resumen: "Los Corredores TEN-T son los ejes de la Red Transeuropea de Transporte de la Unión Europea (entre ellos el Corredor Mediterráneo y el Atlántico), que vertebran inversiones ferroviarias y de carreteras. Aparecen en esta base porque varias de las obras públicas presuntamente amañadas, según la UCO, se enmarcan en estos corredores. Es un dato de contexto sobre el alcance de las obras investigadas."

  # --- Enriquecimiento swarm 2026-06-21 (auto Peinado juicio oral Begoña; verificado, con fuentes) ---
  - entity_id: "Organization:catedra-extraordinaria-de-transformacion-social-competitiva"
    name: "Cátedra Extraordinaria de Transformación Social Competitiva"
    updated: "2026-06-21"
    resumen: "Cátedra Extraordinaria de Transformación Social Competitiva, creada en la UCM (convenio de octubre de 2020) y codirigida por Begoña Gómez, esposa del presidente Pedro Sánchez. Es el núcleo del 'caso Begoña Gómez' que instruye el juez Juan Carlos Peinado: el magistrado sostiene que su creación no siguió un 'cauce académico ordinario' y que presuntamente sirvió para favorecer intereses privados (investigación por tráfico de influencias y corrupción en los negocios). Tuvo patrocinadores y colaboradores como Reale Seguros y Fundación La Caixa (60.000 € cada uno) y la colaboración de Google, Indra y Telefónica, y un software desarrollado en su seno cuya titularidad Begoña Gómez presuntamente registró a su nombre (apropiación indebida, según el juez). La UCM decidió no renovar la cátedra en septiembre de 2024. Todo bajo presunción de inocencia."
    sources:
      - "https://es.wikipedia.org/wiki/Caso_Bego%C3%B1a_G%C3%B3mez"
      - "https://www.eldebate.com/espana/20260620/razones-juez-decir-catedra-begona-gomez-no-siguio-cauce-academico-ordinario_430820.html"
      - "https://www.eleconomista.es/actualidad/noticias/12846812/06/24/la-catedra-de-begona-gomez-en-el-aire-tras-la-fuga-de-patrocinadores.html"
      - "https://www.infobae.com/espana/2024/09/11/la-complutense-decide-no-renovar-la-catedra-que-codirige-begona-gomez/"
  - entity_id: "Person:juan-carlos-doadrio"
    name: "Juan Carlos Doadrio"
    updated: "2026-06-21"
    resumen: "Juan Carlos Doadrio fue vicerrector de la UCM y participó en la tramitación de la Cátedra de Transformación Social Competitiva codirigida por Begoña Gómez. Declaró ante el juez y, en diciembre de 2025, ante una comisión de investigación del Senado (en el marco del 'caso Koldo'), donde afirmó que se sintió 'obligado' por su cargo —aunque no presionado— a impulsar la creación de la cátedra: dijo que tenía que crear las cátedras si la documentación era correcta y que el rector Joaquín Goyache estaba 'muy contento' con Begoña Gómez. Sostuvo que actuó con aval jurídico de la asesoría de la universidad. Figura como testigo/declarante, no como investigado. Todo bajo presunción de inocencia."
    sources:
      - "https://www.eldiario.es/politica/exvicerrector-complutense-dice-senado-sintio-obligado-crear-catedra-begona-gomez_1_12833386.html"
      - "https://www.elindependiente.com/espana/2025/12/10/exvicerrector-complutense-sintio-obligado-impulsar-catedra-begona-gomez/"
  - entity_id: "Company:lefebvre-el-derecho-s-a"
    name: "Lefebvre-El Derecho, S.A."
    updated: "2026-06-21"
    resumen: "Lefebvre-El Derecho, S.A. es una empresa editorial y de soluciones jurídicas que prestó servicios vinculados a la Cátedra de Transformación Social Competitiva de la UCM. En el marco del caso Begoña Gómez, el juez Peinado requirió a Lefebvre-El Derecho que aportara las facturas de los servicios prestados a dicha cátedra. Su aparición en la causa es como tercero/proveedor requerido para aportar documentación, no como investigada. Todo bajo presunción de inocencia."
    sources:
      - "https://www.infobae.com/espana/2026/04/13/el-juez-peinado-procesa-a-begona-gomez-por-trafico-de-influencias-corrupcion-en-los-negocios-malversacion-de-caudales-publicos-y-apropiacion-indebida/"
      - "https://es.wikipedia.org/wiki/Caso_Bego%C3%B1a_G%C3%B3mez"
  - entity_id: "Person:joaquin-goyache"
    name: "Joaquín Goyache"
    updated: "2026-06-21"
    resumen: "Joaquín Goyache Goñi es el rector de la Universidad Complutense de Madrid. En el caso Begoña Gómez fue imputado por el juez Peinado por presunto tráfico de influencias y corrupción en los negocios en relación con la creación de la cátedra codirigida por Begoña Gómez; declaró primero como testigo (julio de 2024) y luego como investigado, y reconoció su implicación en la creación de la cátedra. En mayo de 2025 la Audiencia Provincial de Madrid estimó en parte los recursos de las defensas y dejó sin efecto su imputación por considerarla carente de fundamento, por lo que quedó desimputado. Posteriormente la UCM se posicionó como perjudicada en relación con el software de la cátedra. Todo bajo presunción de inocencia."
    sources:
      - "https://www.moncloa.com/2025/05/16/caso-begona-gomez-2-3230822"
      - "https://www.diariodepontevedra.es/articulo/espana/desimputan-rector-complutense-guemes-caso-begona-gomez/202505162015361391155.html"
      - "https://www.elespanol.com/espana/tribunales/20240911/complutense-rescinde-catedra-begona-gomez-imputacion-rector-goyache/885162031_0.html"
  - entity_id: "Person:miguel-escassi"
    name: "Miguel Escassi"
    updated: "2026-06-21"
    resumen: "Miguel Escassi es directivo de Google España, encargado de relaciones institucionales y políticas públicas. En el procedimiento que instruyó el juez Juan Carlos Peinado sobre la actividad universitaria de Begoña Gómez figura como testigo: según el auto, una carta de 11 de julio de 2022 ofrecía a Google participar 'activamente' en la cátedra extraordinaria de Begoña Gómez. En noviembre de 2025 declaró ante el juez y relató que la asesora de Begoña Gómez, Cristina Álvarez, asistió a dos o tres reuniones sobre el software presentándose como del equipo del proyecto. Comparece como testigo de contexto, sin que conste imputación penal contra él; rige la presunción de inocencia."
    sources:
      - "https://www.infobae.com/espana/agencias/2025/10/07/las-acusaciones-del-caso-begona-gomez-piden-un-careo-entre-cargos-de-la-ucm-para-confrontar-versiones-sobre-la-catedra/"
      - "https://www.elespanol.com/espana/tribunales/20251117/directivo-google-narra-juez-asesora-begona-reuniones-catedra-presento-equipo/1003744016113_0.html"
  - entity_id: "Person:marc-murtra"
    name: "Marc Murtra"
    updated: "2026-06-21"
    resumen: "Marc Murtra Millar (n. 1972) es ingeniero industrial y directivo. Presidió Indra Sistemas entre 2021 y 2025 y desde enero de 2025 es presidente ejecutivo de Telefónica, en sustitución de José María Álvarez-Pallete. En el caso Begoña Gómez aparece de forma tangencial: declaró ante el juez Peinado que, siendo presidente de Indra, recibió a Begoña Gómez en 2022 de forma institucional, por cortesía hacia su cargo de codirectora de la cátedra, en el marco del seguimiento del patrocinio que Indra prestaba a la cátedra de la Complutense (Indra figura entre las empresas que aportaron fondos al software). Murtra ha precisado que se limitó a saludarla sin participar en la reunión de trabajo. No consta que esté investigado ni imputado; figura como contexto empresarial y rige la presunción de inocencia."
    sources:
      - "https://www.telefonica.com/en/about-us/main-data/executive-team/marc-murtra/"
      - "https://www.elindependiente.com/espana/2025/05/28/murtra-confirma-a-peinado-que-recibio-a-begona-gomez-de-forma-institucional-por-la-financiacion-del-software/"
      - "https://www.cope.es/actualidad/economia/noticias/marc-murtra-nuevo-presidente-telefonica-conexion-gobierno-plan-indra-20250120_3079773.html"
  - entity_id: "Organization:oficina-de-transferencia-de-resultados-de-investigacion"
    name: "Oficina de Transferencia de Resultados de Investigación"
    updated: "2026-06-21"
    resumen: "La OTRI (Oficina de Transferencia de Resultados de Investigación) es la unidad de la UCM que gestiona la protección y comercialización del conocimiento generado en la universidad (patentes, contratos de I+D, registro de software). En el caso Begoña Gómez, según el auto del juez Peinado y los informes de la UCO, Begoña Gómez y su asesora Cristina Álvarez mantuvieron contactos con la OTRI en otoño de 2022 para registrar el software de la cátedra; el 6 de octubre de 2022 la OTRI les remitió un contrato para formalizar la cesión de derechos a favor de la Complutense, indicando que la titularidad correspondía a la UCM. Es un organismo, no una persona investigada."
    sources:
      - "https://www.libertaddigital.com/espana/2026-05-25/la-uco-certifica-que-begona-gomez-se-salto-los-controles-de-la-complutense-para-usar-privadamente-el-software-7409302/"
      - "https://www.esdiario.com/nacional/260620/191078/auto-revela-maniobra-permitio-begona-controlar-software-ucm-valorado-350-000-euros.html"
      - "https://okdiario.com/espana/begona-gomez-registro-marca-del-software-4-dias-despues-avisarle-complutense-que-era-100-ucm-13902076"
  - entity_id: "Person:jose-maria-alvarez-pallete"
    name: "José María Álvarez Pallete"
    updated: "2026-06-21"
    resumen: "José María Álvarez-Pallete fue presidente ejecutivo de Telefónica desde 2016 hasta enero de 2025, cuando le sucedió Marc Murtra. En el caso Begoña Gómez figura porque, según el auto del juez Peinado, Begoña Gómez mantuvo en torno a 2021-2022 contactos con Telefónica para financiar el software de su cátedra en la UCM; en una de las reuniones en la sede de la compañía coincidió con Álvarez-Pallete, entonces presidente, que según declaraciones de la empresa acudió 'solo a saludar'. Telefónica aportó 55.000 euros al desarrollo del software. No consta que Álvarez-Pallete esté investigado ni imputado; comparece como contexto empresarial y rige la presunción de inocencia."
    sources:
      - "https://www.cope.es/actualidad/economia/noticias/marc-murtra-nuevo-presidente-telefonica-conexion-gobierno-plan-indra-20250120_3079773.html"
      - "https://theobjective.com/espana/tribunales/2026-05-25/telefonica-euros-software-begona-gomez-asistente/"
      - "https://www.infobae.com/espana/2025/01/22/begona-gomez-contacto-con-un-consejero-para-que-telefonica-le-financiara-el-desarrollo-del-software-de-la-complutense/"
  - entity_id: "Person:ignacio-mariscal"
    name: "Ignacio Mariscal"
    updated: "2026-06-21"
    resumen: "Ignacio Mariscal es el consejero delegado de la aseguradora Reale Seguros (grupo italiano Reale Group). Fue citado por el juez Juan Carlos Peinado (Juzgado de Instrucción nº 41 de Madrid) y declaró en agosto de 2024 como testigo en la causa que investiga a Begoña Gómez, por ser Reale una de las patrocinadoras de la cátedra que codirigía Gómez en la Universidad Complutense. Según las informaciones de prensa sobre su declaración, el contacto se produjo en 2020 a través de David Sanza, corredor de seguros amigo de Pedro Sánchez, que puso a Gómez en contacto con la aseguradora para que financiara la cátedra (cuatro años y 15.000 euros anuales, 60.000 euros en total). Declara como testigo; no consta investigado ni imputado, y rige la presunción de inocencia respecto de todas las personas de la causa."
    sources:
      - "https://www.hispanidad.com/politica/espana/caso-begona-gomez-juez-llama-declarar-como-testigos-consejero-delegado-reale-seguros-ignacio-mariscal-subdirector-fundacion-caixa-marc-simon_12053260_102.html"
      - "https://www.eldebate.com/espana/20240910/corredor-seguros-amigo-begona-gomez-puso-contacto-ceo-reale-patrocinador-catedra_226411.html"
      - "https://www.eldiario.es/politica/juez-caso-begona-gomez-cita-26-agosto-testigos-financiadores-catedra-begona-gomez_1_11597411.html"
  - entity_id: "Court:tribunal-de-instancia-de-madrid"
    name: "Tribunal de Instancia de Madrid"
    updated: "2026-06-21"
    resumen: "El Tribunal de Instancia de Madrid es el órgano judicial colegiado que, en virtud de la reforma de la Ley Orgánica 1/2025 de eficiencia del Servicio Público de Justicia, sustituye a los antiguos juzgados unipersonales en el partido judicial de Madrid; según la comunicación del Decanato de Madrid recogida por el ICAM, su entrada en funcionamiento (Fase III) está fijada para el 31 de diciembre de 2025. Las antiguas plazas de instrucción pasan a integrarse como Secciones de Instrucción dentro de ese tribunal. En los documentos del grafo aparece como cabecera de actuaciones de varias causas: la Sección de Instrucción plaza nº 41 se corresponde con el antiguo Juzgado de Instrucción nº 41 (juez Juan Carlos Peinado), que instruye el caso de Begoña Gómez, y la plaza nº 15 figura en el auto sobre las joyas relacionado con la causa de José Luis Rodríguez Zapatero. Es una estructura judicial real y vigente, no un imputado. El nodo agrupa distintas Secciones/plazas que tramitan causas separadas, por lo que conviene tratarlo como órgano genérico y no atribuirle una única causa."
    sources:
      - "https://web.icam.es/implantacion-de-los-tribunales-de-instancia-en-el-partido-judicial-de-madrid-fase-iii/"
      - "https://www.elnotario.es/index.php/opinion/opinion/13626-ley-organica-1-2025-de-2-de-enero-los-tribunales-de-instancia"
      - "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2025-76"
  - entity_id: "Organization:asociacion-de-abogados-del-estado"
    name: "Asociación de Abogados del Estado"
    updated: "2026-06-21"
    resumen: "La Asociación de Abogados del Estado es una asociación profesional del cuerpo de abogados del Estado. En la causa de Begoña Gómez (Juzgado/Sección de Instrucción nº 41 de Madrid, juez Juan Carlos Peinado) remitió al instructor, a petición de éste, un informe sobre los requisitos académicos y profesionales para redactar o suscribir pliegos en la contratación pública, en el marco de la pieza por presunta intrusión profesional. Según Libertad Digital (08-12-2025), el informe concluyó que la normativa de contratación pública no reserva esa función a un cuerpo concreto ni exige una titulación específica, de modo que Gómez podría firmar pliegos sin titulación, correspondiendo a la entidad pública (la UCM) aprobarlos. El asunto generó un cisma interno en la abogacía del Estado: la 'Asociación de Abogados del Estado por el Estado de Derecho'  es una asociación DISTINTA, presidida por Francisco Espinosa, que se desmarcó públicamente del contenido de ese informe. Rige la presunción de inocencia respecto de Begoña Gómez, investigada en una causa abierta."
    sources:
      - "https://www.vozpopuli.com/tribunales/rifirrafes-entre-abogados-del-estado-por-la-informacion-que-una-asociacion-traslado-al-juez-peinado-sobre-begona-gomez.html"
      - "https://www.libertaddigital.com/espana/2025-12-08/la-asociacion-de-abogados-del-estado-informa-a-peinado-de-que-begona-podia-firmar-pliegos-sin-titulacion-7330466/"
      - "https://theobjective.com/espana/tribunales/2024-11-27/abogados-estado-asociacion-enfrentarse-sanchez/"
  - entity_id: "Organization:iustitia-europa"
    name: "Iustitia Europa"
    updated: "2026-06-21"
    resumen: "Iustitia Europa es un partido político español que se presenta como plataforma de la sociedad civil 'sin ideología' y que actúa principalmente como acusación popular en causas de relevancia política. En el grafo aparece como parte (PARTY_TO) de la Causa Especial 20775/2020 del Tribunal Supremo (caso Koldo/Ábalos), en la que consta personada como acusación popular junto a PP y Vox, y como acusación popular en el procedimiento de Badajoz contra David Sánchez (hermano de Pedro Sánchez) y otros por su contratación en la Diputación de Badajoz. En este último juicio su representación letrada la ha ejercido el abogado Luis María Pardo. Su actuación es procesal; no consta investigada. Rige la presunción de inocencia respecto de los investigados en dichas causas."
    sources:
      - "https://www.moncloa.com/2026/06/19/hazte-oir-iustitia-europa-3386766/"
      - "https://www.libertaddigital.com/espana/2024-12-11/iustitia-europa-solicita-supremo-presente-acusacion-declaracion-abalos-7197011/"
      - "https://www.elespanol.com/espana/tribunales/20260604/ultima-hora-judicial-directo-david-sanchez-miguel-angel-gallardo-declaran-acusados-concluir-fase-testifical/1003744273054_10.html"
  - entity_id: "LegalCase:caso-noos"
    name: "Caso Noos"
    updated: "2026-10-04"
    resumen: "El caso Noos fue una pieza separada del caso Palma Arena instruida en Palma de Mallorca sobre el presunto desvio de fondos publicos hacia el Instituto Noos, entidad sin animo de lucro presidida por Inaki Urdangarin, entonces duque de Palma y yerno del rey Juan Carlos I. La Audiencia Provincial de las Illes Balears dicto sentencia en febrero de 2017 condenando a Urdangarin y a su socio Diego Torres, y en junio de 2018 el Tribunal Supremo confirmo en lo sustancial la condena a Urdangarin, fijandola en 5 anos y 10 meses de prision (rebaja de 5 meses respecto a la Audiencia) por prevaricacion, malversacion, fraude a la Administracion, trafico de influencias y dos delitos fiscales. La infanta Cristina de Borbon fue absuelta de los dos delitos fiscales de los que la acusaba la acusacion popular; el Supremo confirmo su responsabilidad civil como participe a titulo lucrativo, rebajando su cuantia de 265.088 a 136.950 euros. Es un caso ya juzgado y con sentencia firme, anterior y ajeno a la trama Koldo/Cerdan/Abalos, presente en esta base como referencia historica de corrupcion."
    sources:
      - "https://www.poderjudicial.es/cgpj/es/Poder-Judicial/Tribunal-Supremo/Noticias-Judiciales/El-Tribunal-Supremo-condena-a-Inaki-Urdangarin-a-5-anos-y-10-meses-de-prision-por-malversacion--prevaricacion--fraude--dos-delitos-fiscales-y-trafico-de-influencias-en-el--caso-Noos-"
      - "https://valenciaplaza.com/valenciaplaza/el-supremo-rebaja-la-responsabilidad-civil-de-la-infanta-cristina-de-265088-euros-a-136950-euros"
  - entity_id: "Court:tribunal-superior-de-justicia"
    name: "Tribunal Superior de Justicia"
    updated: "2026-06-21"
    resumen: "Los Tribunales Superiores de Justicia son los organos judiciales que culminan la organizacion judicial en el ambito de cada comunidad autonoma; su Sala de lo Civil y Penal asume, entre otras funciones, el enjuiciamiento de aforados autonomicos. No se refiere a un TSJ concreto: procede de una única mención en el auto de imputacion de Begona Gomez (11.04.2026, p.16), dentro de una discusion procesal sobre conexidad y competencia que cita doctrina relativa al Tribunal del Jurado. Se trata, por tanto, de una referencia institucional genérica, no de un tribunal con papel propio en la trama. El alias 'Tribunal Superior de Justicia, Sala de lo Civil y Penal' refleja esa misma cita doctrinal."
    sources:
      - "https://www.poderjudicial.es/cgpj/es/Poder-Judicial/Tribunales-Superiores-de-Justicia/TSJ-Aragon/Informacion-Institucional/Como-funciona-el-TSJ-Aragon/"

  # --- Ingesta informe-udef-2910-focus-social (trama Bolivia/Grupo Gloria, 2026-06-25) ---
  - entity_id: "Company:grupo-gloria"
    name: "Grupo Gloria"
    updated: "2026-06-25"
    resumen: "Grupo Gloria es un conglomerado industrial peruano con inversiones en Bolivia, Colombia, Ecuador, Argentina y Chile. Según el informe de la UDEF incorporado en junio de 2026 a las diligencias del Juzgado Central de Instrucción que investiga el caso, sería el beneficiario final de la presunta mediación de José Luis Rodríguez Zapatero ante el Gobierno de Bolivia para favorecer a su filial cementera SOBOCE en litigios millonarios. La UDEF sostiene que el grupo habría canalizado 200.000 euros a Zapatero a través de un contrato de asesoría con la empresa peruana Focus Social Research SAC, que los investigadores consideran sociedad interpuesta. Su director ejecutivo es Claudio Rodríguez Huaco y su directora de Asuntos Corporativos y Relaciones Institucionales, Ana María Ospina. Todos los implicados gozan de presunción de inocencia: la causa está abierta y no hay condena en España."
    sources:
      - "https://www.infobae.com/espana/2026/06/24/quien-es-quien-en-la-investigacion-de-los-200000-euros-que-zapatero-supuestamente-cobro-por-influir-a-favor-de-una-empresa-peruana-ante-el-gobierno-de-bolivia/"
      - "https://www.elespanol.com/espana/tribunales/20260624/udef-descubre-zapatero-cobro-mediar-expresidente-bolivia-evitar-multa-grupo-gloria/1003744298300_0.html"
  - entity_id: "Person:carmen-almendras"
    name: "Carmen Almendras"
    updated: "2026-06-25"
    resumen: "María del Carmen Almendras Camargo es exembajadora de Bolivia en España (2007-2015) y Senior Advisor de la consultora Kreab Bolivia. Según el informe de la UDEF de junio de 2026, habría actuado como nexo y enlace entre el entorno de José Luis Rodríguez Zapatero y los directivos del Grupo Gloria, coordinando reuniones, intercambio de documentación y los contactos con altos cargos del Gobierno boliviano (el presidente Luis Arce, la ministra María Nela Prada y la jefa de gabinete Fabiola Salazar). La policía documenta más de una decena de reuniones, videoconferencias y contactos suyos con Zapatero entre 2024 y 2025, incluida una el 8 de mayo de 2024 en el despacho del expresidente en la calle Ferraz de Madrid. Rige la presunción de inocencia: no está condenada ni hay sentencia en la causa, que sigue abierta."
    sources:
      - "https://prnoticias.com/2026/06/24/mas-de-una-decena-de-reuniones-con-carmen-almendras-y-numerosas-referencias-a-kreab/"
      - "https://www.infobae.com/espana/2026/06/24/quien-es-quien-en-la-investigacion-de-los-200000-euros-que-zapatero-supuestamente-cobro-por-influir-a-favor-de-una-empresa-peruana-ante-el-gobierno-de-bolivia/"
  - entity_id: "Person:ana-maria-ospina"
    name: "Ana María Ospina"
    updated: "2026-06-25"
    resumen: "Ana María Ospina Ospina es directora de Asuntos Corporativos y Relaciones Institucionales del conglomerado peruano Grupo Gloria. Según el informe de la UDEF de junio de 2026, habría asumido las negociaciones del contrato de asesoría vinculado a la presunta mediación ante el Gobierno de Bolivia y habría gestionado, a través de la secretaria de José Luis Rodríguez Zapatero, María Gertrudis Alcázar, la versión final del contrato. Su papel, según la policía, fue el de interlocutora del grupo empresarial en la articulación del acuerdo. Rige la presunción de inocencia: no consta imputada formalmente ni condenada en la causa española, que sigue abierta."
    sources:
      - "https://www.infobae.com/espana/2026/06/24/quien-es-quien-en-la-investigacion-de-los-200000-euros-que-zapatero-supuestamente-cobro-por-influir-a-favor-de-una-empresa-peruana-ante-el-gobierno-de-bolivia/"
      - "https://www.publico.es/politica/tribunales/udef-senala-zapatero-cobro-200-000-euros-influir-favor-empresa-peruana-gobierno-bolivia.html"
  - entity_id: "Company:soboce"
    name: "SOBOCE"
    updated: "2026-06-25"
    resumen: "SOBOCE (Sociedad Boliviana de Cementos S.A.) es la filial cementera del Grupo Gloria en Bolivia. Arrastraba desde 2011 un litigio por competencia desleal interpuesto por la cementera estatal FANCESA (Fábrica Nacional de Cemento); en febrero de 2025 el Tribunal Supremo de Justicia de Bolivia ratificó una condena de unos 107 millones de dólares a favor de FANCESA, y el 30 de mayo de 2025 un tribunal boliviano admitió un recurso constitucional que suspendió la sentencia. Según el informe de la UDEF de junio de 2026, evitar o mitigar esa condena habría sido el objetivo de la presunta mediación de José Luis Rodríguez Zapatero ante el Gobierno boliviano en favor del grupo. Rige la presunción de inocencia respecto a los investigados en la causa española, que sigue abierta."
    sources:
      - "https://www.infobae.com/espana/2026/06/24/quien-es-quien-en-la-investigacion-de-los-200000-euros-que-zapatero-supuestamente-cobro-por-influir-a-favor-de-una-empresa-peruana-ante-el-gobierno-de-bolivia/"
      - "https://www.elespanol.com/espana/tribunales/20260624/udef-descubre-zapatero-cobro-mediar-expresidente-bolivia-evitar-multa-grupo-gloria/1003744298300_0.html"
  - entity_id: "Company:focus-social-research-sac"
    name: "Focus Social Research SAC"
    updated: "2026-06-25"
    resumen: "Focus Social Research SAC es una empresa peruana de marketing/consultoría que, según el informe de la UDEF de junio de 2026, actuó como sociedad interpuesta para canalizar los pagos al expresidente José Luis Rodríguez Zapatero. La policía sostiene que detrás de los abonos estaba realmente el Grupo Gloria y que Zapatero recibió tres transferencias por un total de 200.000 euros entre julio de 2024 y junio de 2025, articuladas a través de un contrato de asesoría fechado en mayo de 2024 que incluía además dietas de 10.000 euros por jornada de viaje. El apoderado de la empresa que figura en el contrato es Mariano Uldarico Martín Carranza Gonzales. Todos los implicados mantienen la presunción de inocencia; la causa está abierta y no hay condena."
    sources:
      - "https://www.infobae.com/espana/2026/06/24/la-udef-acusa-a-zapatero-de-cobrar-200000-euros-de-un-grupo-minero-para-influir-ante-el-gobierno-de-bolivia-en-un-litigio-de-107-millones-de-dolares/"
      - "https://www.eldiario.es/politica/udef-acusa-zapatero-cobrar-200-000-euros-ejercer-influencia-politica-bolivia-favor-empresa_1_13329380.html"
  - entity_id: "Person:luis-alberto-arce-catacora"
    name: "Luis Alberto Arce Catacora"
    updated: "2026-06-25"
    resumen: "Luis Alberto Arce Catacora es economista, fue ministro de Economía y Finanzas Públicas con Evo Morales y presidió Bolivia entre 2020 y 2025. Según el informe de la UDEF de junio de 2026, es la autoridad ante la que se habría dirigido la presunta mediación de José Luis Rodríguez Zapatero en favor del Grupo Gloria; la policía documenta contactos y reuniones coordinadas con su gabinete (la ministra María Nela Prada y la jefa de gabinete Fabiola Salazar). Arce no es objeto de la investigación judicial española. Senadores bolivianos de la alianza opositora Libre han pedido activar una comisión legislativa para investigar la presunta injerencia. Rige la presunción de inocencia."
    sources:
      - "https://www.infobae.com/america/america-latina/2026/06/25/senadores-de-bolivia-piden-activar-una-comision-para-investigar-a-rodriguez-zapatero-por-injerencia/"
      - "https://www.infobae.com/espana/2026/06/24/quien-es-quien-en-la-investigacion-de-los-200000-euros-que-zapatero-supuestamente-cobro-por-influir-a-favor-de-una-empresa-peruana-ante-el-gobierno-de-bolivia/"
  - entity_id: "Person:fabiola-salazar-calle"
    name: "Fabiola Salazar Calle"
    updated: "2026-06-25"
    resumen: "Fabiola Consuelo Salazar Calle fue jefa de Gabinete de la Presidencia con el entonces presidente boliviano Luis Arce Catacora. Según el informe UDEF nº 2910/26 (junio 2026), recogido por la prensa, coordinó la agenda institucional del viaje de José Luis Rodríguez Zapatero a Bolivia en septiembre de 2024, comunicándose con la secretaria del expresidente para organizar reuniones (incluida la del 15 de septiembre de 2024 en La Paz) y, según la prensa, una posterior llamada telefónica de Zapatero con el presidente Arce, además de facilitar el contacto con el Procurador General del Estado. Todo ello en el marco de la presunta trama de influencias que la UDEF investiga; rige la presunción de inocencia y no consta que esté imputada en sede judicial española."
    sources:
      - "https://www.infobae.com/espana/2026/06/24/quien-es-quien-en-la-investigacion-de-los-200000-euros-que-zapatero-supuestamente-cobro-por-influir-a-favor-de-una-empresa-peruana-ante-el-gobierno-de-bolivia/"
      - "https://www.elespanol.com/espana/tribunales/20260624/udef-descubre-zapatero-cobro-mediar-expresidente-bolivia-evitar-multa-grupo-gloria/1003744298300_0.amp.html"
  - entity_id: "Person:francisco-shwortshik"
    name: "Francisco Shwortshik"
    updated: "2026-06-25"
    resumen: "Francisco Javier Shwortshik Jegó es, según el informe UDEF nº 2910/26 recogido por la prensa, el consejero delegado (CEO) de la Sociedad Boliviana de Cemento (SOBOCE), filial boliviana del conglomerado peruano Grupo Gloria. El informe le sitúa entre los directivos del grupo que, junto a Luis Díaz Olivero y Ana María Ospina, habrían participado en una videoconferencia con Zapatero (28 de mayo de 2024) y en una reunión de diciembre de 2024 con el ministro de Justicia César Siles, en el marco del litigio millonario de SOBOCE frente a la empresa pública FANCESA, en el que la UDEF investiga una presunta mediación de José Luis Rodríguez Zapatero ante autoridades bolivianas. Su mención es como ejecutivo de la empresa interesada; rige la presunción de inocencia."
    sources:
      - "https://www.infobae.com/espana/2026/06/24/quien-es-quien-en-la-investigacion-de-los-200000-euros-que-zapatero-supuestamente-cobro-por-influir-a-favor-de-una-empresa-peruana-ante-el-gobierno-de-bolivia/"
      - "https://www.urgente.bo/noticia/las-claves-para-entender-el-caso-zapatero-que-involucra-exautoridades-bolivianas"
  - entity_id: "Person:luis-diaz-olivero"
    name: "Luis Díaz Olivero"
    updated: "2026-06-25"
    resumen: "Luis Díaz Olivero figura en el informe UDEF nº 2910/26, según la prensa, como vicepresidente de la División de Cementos del Grupo Gloria, conglomerado empresarial peruano al que pertenece la cementera SOBOCE. Según el informe, participó en una videoconferencia con José Luis Rodríguez Zapatero el 28 de mayo de 2024 y mantuvo con él una reunión presencial en Madrid el 25 de octubre de 2024; además, en diciembre de 2024, se le sitúa junto a otros directivos del grupo en una reunión con el ministro de Justicia César Siles. La UDEF investiga estos contactos como parte de una presunta dinámica de intermediación e influencia ante el Gobierno boliviano; rige la presunción de inocencia."
    sources:
      - "https://www.eldiario.es/politica/udef-acusa-zapatero-cobrar-200-000-euros-ejercer-influencia-politica-bolivia-favor-empresa_1_13329380.html"
      - "https://www.infobae.com/espana/2026/06/24/quien-es-quien-en-la-investigacion-de-los-200000-euros-que-zapatero-supuestamente-cobro-por-influir-a-favor-de-una-empresa-peruana-ante-el-gobierno-de-bolivia/"
  - entity_id: "Person:cesar-adalid-siles-bazan"
    name: "César Adalid Siles Bazán"
    updated: "2026-06-25"
    resumen: "César Adalid Siles Bazán fue ministro de Justicia y Transparencia Institucional de Bolivia desde el 26 de septiembre de 2024 (en sustitución de Iván Lima) hasta su renuncia en junio de 2025, cargo al que llegó tras ejercer como Procurador General del Estado desde el 6 de septiembre de 2023, bajo el gobierno de Luis Arce. En el informe UDEF nº 2910/26, según la prensa, aparece referido como el 'Ministro Siles' a cuya reunión de diciembre de 2024 habrían acudido directivos del Grupo Gloria (Luis Díaz Olivero, Ana María Ospina y Francisco Shwortshik), encuentro que la UDEF enmarca en la presunta trama de influencias relacionada con el litigio de SOBOCE; la prensa le describe como 'actor clave para desbloquear procedimientos'. Su mención es como autoridad boliviana de la época; rige la presunción de inocencia."
    sources:
      - "https://www.lostiempos.com/actualidad/pais/20240926/cesar-siles-asume-como-nuevo-ministro-justicia-apostaremos-cambiar-justicia"
      - "https://www.infobae.com/america/america-latina/2025/06/15/crisis-en-bolivia-renuncio-el-ministro-de-justicia-dias-despues-de-pedir-la-detencion-de-evo-morales/"
  - entity_id: "Person:maria-nela-prada-tejada"
    name: "María Nela Prada Tejada"
    updated: "2026-06-25"
    resumen: "María Nela Prada Tejada fue ministra de la Presidencia de Bolivia desde el 9 de noviembre de 2020 en el gobierno de Luis Arce, primera mujer en ocupar ese cargo y persona de máxima confianza del presidente, de quien había sido jefa de Gabinete cuando este era ministro de Economía. Es militante del MAS y licenciada en Relaciones Internacionales. En el informe UDEF nº 2910/26, según la prensa, aparece como interlocutora que coordinó detalles de reuniones orientadas a un encuentro entre el presidente Arce y José Luis Rodríguez Zapatero, dentro de la presunta trama de influencias que la UDEF investiga en relación con los intereses del Grupo Gloria/SOBOCE. Su mención es como alta autoridad boliviana del momento; rige la presunción de inocencia."
    sources:
      - "https://en.wikipedia.org/wiki/Mar%C3%ADa_Nela_Prada"
      - "https://www.urgente.bo/noticia/qui%C3%A9n-es-mar%C3%ADa-nela-prada-la-mujer-de-confianza-de-arce-ahora-ministra-de-la-presidencia"
  - entity_id: "Person:marcelo-montenegro-gomez-garcia"
    name: "Marcelo Montenegro Gómez García"
    updated: "2026-06-25"
    resumen: "Marcelo Alejandro Montenegro Gómez García fue ministro de Economía y Finanzas Públicas de Bolivia durante el Gobierno de Luis Arce. Aparece mencionado en el informe de la UDEF de la causa que investiga al expresidente español José Luis Rodríguez Zapatero por una presunta intermediación a favor del Grupo Gloria (peruano) en sus litigios con el Estado boliviano. Según ese informe recogido por la prensa, en la agenda del viaje de Zapatero a La Paz se pidió a la Presidencia boliviana organizar una reunión con Montenegro la mañana del 15 de septiembre de 2024, inmediatamente antes del encuentro previsto con el presidente Arce. Se le cita únicamente como autoridad boliviana contactada; rige la presunción de inocencia y no consta imputado en la causa española."
    sources:
      - "https://www.infobae.com/espana/2026/06/24/quien-es-quien-en-la-investigacion-de-los-200000-euros-que-zapatero-supuestamente-cobro-por-influir-a-favor-de-una-empresa-peruana-ante-el-gobierno-de-bolivia/"
      - "https://www.urgente.bo/noticia/las-claves-para-entender-el-caso-zapatero-que-involucra-exautoridades-bolivianas"
  - entity_id: "Organization:procuraduria-general-del-estado"
    name: "Procuraduría General del Estado"
    updated: "2026-06-25"
    resumen: "La Procuraduría General del Estado es la institución boliviana encargada de la representación y defensa jurídica de los intereses del Estado en acciones judiciales, extrajudiciales y administrativas. Figura en el contexto de la causa que investiga a José Luis Rodríguez Zapatero porque uno de los contactos institucionales señalados por el informe de la UDEF fue César Siles Bazán, que ejerció como Procurador General del Estado antes de pasar a ministro de Justicia (su sucesor en la Procuraduría, Ricardo Condori Tola, también figura como actor relevante). Según el informe recogido por la prensa, la actividad investigada buscaba influir ante autoridades bolivianas en el litigio que enfrentaba a SOBOCE (filial del Grupo Gloria) con la cementera estatal FANCESA. Es un organismo público boliviano, no un investigado; se cita como entorno institucional de la causa."
    sources:
      - "https://www.infobae.com/espana/2026/06/24/quien-es-quien-en-la-investigacion-de-los-200000-euros-que-zapatero-supuestamente-cobro-por-influir-a-favor-de-una-empresa-peruana-ante-el-gobierno-de-bolivia/"
      - "https://www.procuraduria.gob.bo/paginacontenido/557"
      - "https://www.elindependiente.com/espana/2026/06/24/zapatero-intercedio-ante-presidente-bolivia-para-frenar-condena-107-millones-dolares-contra-grupo-gloria/"
  - entity_id: "Person:claudio-rodriguez-huaco"
    name: "Claudio Rodríguez Huaco"
    updated: "2026-06-25"
    resumen: "Claudio José Rodríguez Huaco es el presidente ejecutivo (CEO) del Grupo Gloria, conglomerado industrial peruano propietario de la cementera boliviana SOBOCE; pertenece a la segunda generación de la familia que dirige el grupo y asumió como CEO en 2023. En el informe de la UDEF de la causa que investiga a José Luis Rodríguez Zapatero, se le sitúa como máximo responsable ejecutivo de la empresa que se habría beneficiado de la presunta intermediación del expresidente español ante el Gobierno de Bolivia. Según el informe recogido por la prensa, el litigio en cuestión era la condena de unos 107 millones de dólares a favor de la estatal FANCESA. Rige la presunción de inocencia; se le menciona como empresario interesado, sin que conste imputación en la causa española."
    sources:
      - "https://www.infobae.com/espana/2026/06/24/quien-es-quien-en-la-investigacion-de-los-200000-euros-que-zapatero-supuestamente-cobro-por-influir-a-favor-de-una-empresa-peruana-ante-el-gobierno-de-bolivia/"
      - "https://www.bloomberglinea.com/especiales/personajes-bloomberg-linea/claudio-rodriguez-huaco/"
      - "https://www.bloomberglinea.com/2023/03/01/gloria-cambia-de-ceo-en-medio-de-compra-de-soprole-asumira-claudio-rodriguez/"
  - entity_id: "Company:fancesa"
    name: "FANCESA"
    updated: "2026-06-25"
    resumen: "FANCESA (Fábrica Nacional de Cementos S.A.) es una cementera de mayoría estatal boliviana con sede en Sucre. Es la parte beneficiaria de la condena judicial que la justicia boliviana impuso a SOBOCE (filial del Grupo Gloria peruano) por competencia desleal; según El Independiente (24-06-2026), en febrero de 2025 el Tribunal Supremo de Justicia de Bolivia ratificó una sentencia que obligaba a SOBOCE a pagar unos 107 millones de dólares a FANCESA (sentencia posteriormente suspendida de forma temporal en mayo de 2025 por una acción de amparo de SOBOCE). Ese litigio es el núcleo de la causa que investiga al expresidente español José Luis Rodríguez Zapatero por una presunta intermediación a favor del Grupo Gloria. FANCESA es la empresa estatal afectada, no parte investigada."
    sources:
      - "https://www.urgente.bo/noticia/las-claves-para-entender-el-caso-zapatero-que-involucra-exautoridades-bolivianas"
      - "https://www.elindependiente.com/espana/2026/06/24/zapatero-intercedio-ante-presidente-bolivia-para-frenar-condena-107-millones-dolares-contra-grupo-gloria/"
  - entity_id: "Company:kreab-bolivia"
    name: "Kreab Bolivia"
    updated: "2026-06-25"
    resumen: "Kreab Bolivia es la filial boliviana de la consultora internacional de comunicación estratégica y asuntos públicos Kreab. En el informe de la UDEF de la causa que investiga a José Luis Rodríguez Zapatero, se la vincula con la operación a través de su asesora sénior (Senior Advisor) Carmen Almendras Camargo, exembajadora de Bolivia en España (2007-2015), a la que el informe atribuye un papel de nexo entre el entorno de Zapatero y los directivos del Grupo Gloria. Según el informe policial recogido por la prensa, documentos y agendas relacionan a Zapatero con un contrato de unos 200.000 euros que la UDEF considera un encargo de consultoría sin actividad real, usado para justificar transferencias vinculadas al interés del Grupo Gloria; la prensa señala que en el contrato figuraba formalmente como cliente la sociedad 'Focus Social Research'. Estos datos proceden de un informe policial y de prensa: son indicios y acusaciones, no hechos probados; rige la presunción de inocencia y no consta condena."
    sources:
      - "https://www.infobae.com/espana/2026/06/24/quien-es-quien-en-la-investigacion-de-los-200000-euros-que-zapatero-supuestamente-cobro-por-influir-a-favor-de-una-empresa-peruana-ante-el-gobierno-de-bolivia/"
      - "https://www.merca2.es/2026/06/24/documentos-vinculan-zapatero-kreab-bolivia-2405173/"
  - entity_id: "Court:tribunal-supremo-de-justicia"
    name: "Tribunal Supremo de Justicia"
    updated: "2026-06-25"
    resumen: "Es el máximo tribunal ordinario de Bolivia. En el contexto de la investigación policial española sobre José Luis Rodríguez Zapatero (caso Plus Ultra), su Sala Civil dictó el Auto Supremo 59/2025 (4 de febrero de 2025) declarando infundado el recurso de casación de SOBOCE (filial del peruano Grupo Gloria) y ratificando la condena a indemnizar a FANCESA por competencia desleal (en torno a 107 millones de dólares). Según el informe de la UDEF, ese litigio es el que el Grupo Gloria habría tratado de resolver favorablemente y, por cuya mediación ante autoridades bolivianas, la unidad policial atribuye a Zapatero el cobro de 200.000 euros vía Focus Social Research. Se trata de una hipótesis policial; Zapatero está investigado, no condenado, y rige la presunción de inocencia. El tribunal es un actor judicial boliviano, ajeno a cualquier imputación; figura por ser el órgano que dictó la resolución de fondo."
    sources:
      - "https://www.infobae.com/espana/2026/06/24/la-udef-acusa-a-zapatero-de-cobrar-200000-euros-de-un-grupo-minero-para-influir-ante-el-gobierno-de-bolivia-en-un-litigio-de-107-millones-de-dolares/"
      - "https://www.elindependiente.com/espana/2026/06/24/zapatero-intercedio-ante-presidente-bolivia-para-frenar-condena-107-millones-dolares-contra-grupo-gloria/"
      - "https://www.vision360.bo/noticias/2026/06/24/54769-investigacion-revela-que-rodriguez-zapatero-uso-su-influencia-en-bolivia-para-librar-a-soboce-del-pago-de-us-107-millones-a-fancesa"
  - entity_id: "Court:tribunal-departamental-de-justicia-de-la-paz"
    name: "Tribunal Departamental de Justicia de La Paz"
    updated: "2026-06-25"
    resumen: "Es el órgano judicial departamental de La Paz (Bolivia). Su Sala Constitucional Segunda dictó el 30 de mayo de 2025 una resolución de amparo constitucional que dejó temporalmente sin efecto la condena (en torno a 107 millones de dólares) impuesta a SOBOCE, filial del Grupo Gloria. Según el informe de la UDEF, esa resolución favorable a la empresa peruana coincidió en el tiempo con los últimos pagos atribuidos a José Luis Rodríguez Zapatero, a quien la unidad policial atribuye haber mediado ante autoridades bolivianas. Es una hipótesis policial; Zapatero está investigado, no condenado, y rige la presunción de inocencia. El tribunal es un actor judicial boliviano sin imputación alguna; figura solo por ser el órgano que adoptó la decisión de amparo descrita en el informe policial."
    sources:
      - "https://www.elindependiente.com/espana/2026/06/24/zapatero-intercedio-ante-presidente-bolivia-para-frenar-condena-107-millones-dolares-contra-grupo-gloria/"
      - "https://www.infobae.com/espana/2026/06/24/la-udef-acusa-a-zapatero-de-cobrar-200000-euros-de-un-grupo-minero-para-influir-ante-el-gobierno-de-bolivia-en-un-litigio-de-107-millones-de-dolares/"
  - entity_id: "Contract:contrato-de-asesoria-focus-social"
    name: "Contrato de asesoría Focus Social"
    updated: "2026-06-25"
    resumen: "Contrato de asesoramiento suscrito el 10 de mayo de 2024 entre la mercantil peruana Focus Social Research SAC y José Luis Rodríguez Zapatero, por unos honorarios de 200.000 euros pagaderos en tres plazos (la primera factura, de 100.000 euros, el 50%), más dietas de 10.000 euros por día de viaje. Según el informe de la UDEF en el caso Plus Ultra, el contrato habría servido para encubrir servicios ajenos a la actividad de la firma, que habría actuado como intermediaria, y el beneficiario real de las gestiones sería el Grupo Gloria peruano en su litigio en Bolivia. Es una hipótesis policial, no un hecho probado: Zapatero está investigado, no imputado formalmente por estos hechos ni condenado, y rige la presunción de inocencia."
    sources:
      - "https://www.eldebate.com/espana/20260624/este-contrato-zapatero-firmo-justificar-cobro-200000-euros-gestiones-bolivia_432254.html"
      - "https://www.eldiario.es/politica/udef-acusa-zapatero-cobrar-200-000-euros-ejercer-influencia-politica-bolivia-favor-empresa_1_13329380.html"
  - entity_id: "LegalCase:auto-supremo-59-2025"
    name: "Auto Supremo 59/2025"
    updated: "2026-06-25"
    resumen: "Resolución dictada por la Sala Civil del Tribunal Supremo de Justicia de Bolivia que declaró infundado el recurso de casación de SOBOCE (filial del Grupo Gloria) y ratificó la condena a indemnizar a FANCESA por competencia desleal, en torno a 107 millones de dólares. Es la decisión de fondo desfavorable a la empresa peruana que, según el informe de la UDEF, ésta intentaba revertir, y cuya posterior suspensión por amparo (30 de mayo de 2025) coincidió con los últimos pagos atribuidos a Zapatero. La resolución es un acto judicial boliviano legítimo; su relevancia aquí es contextual, dentro de la hipótesis policial del caso Plus Ultra."
    sources:
      - "https://www.elindependiente.com/espana/2026/06/24/zapatero-intercedio-ante-presidente-bolivia-para-frenar-condena-107-millones-dolares-contra-grupo-gloria/"
      - "https://www.vision360.bo/noticias/2026/06/24/54769-investigacion-revela-que-rodriguez-zapatero-uso-su-influencia-en-bolivia-para-librar-a-soboce-del-pago-de-us-107-millones-a-fancesa"
      - "https://www.infobae.com/espana/2026/06/24/la-udef-acusa-a-zapatero-de-cobrar-200000-euros-de-un-grupo-minero-para-influir-ante-el-gobierno-de-bolivia-en-un-litigio-de-107-millones-de-dolares/"
  - entity_id: "Contract:contrato-de-prestacion-de-servicios-de-asesoria"
    name: "Contrato de prestación de servicios de asesoría"
    updated: "2026-06-25"
    resumen: "Etiqueta genérica de un contrato de prestación de servicios de asesoría dentro del entramado de consultorías que la UDEF examina en el caso Plus Ultra en relación con José Luis Rodríguez Zapatero. Por su nombre puramente descriptivo no es posible determinar con certeza si se refiere específicamente al contrato de Focus Social Research (200.000 euros, 2024) o a otro de los acuerdos rastreados por la unidad. Rige la presunción de inocencia: ningún contrato está acreditado como ilícito y Zapatero está investigado, no condenado."
    sources:
      - "https://www.eldiario.es/politica/udef-acusa-zapatero-cobrar-200-000-euros-ejercer-influencia-politica-bolivia-favor-empresa_1_13329380.html"
  - entity_id: "Person:maria-del-carmen-pano-sanchez"
    name: "María del Carmen Pano Sánchez"
    updated: "2026-06-30"
    resumen: "María del Carmen Pano Sánchez, empresaria conocida públicamente como 'Carmen Pano', es una persona del entorno de confianza de Víctor de Aldama (en la sentencia del Tribunal Supremo sobre el caso Ábalos/Koldo/Aldama, de 22 de junio de 2026, se la describe con una relación estrecha, 'casi familiar', con Aldama). Su papel central es el de TESTIGO en la pieza de las 'cloacas'/Leire Díez (Diligencias Previas 150/2025, instruidas por el juez Santiago Pedraz): el 29 de junio de 2026 declaró haber entregado 90.000 euros en efectivo en la sede del PSOE (calle Ferraz), en dos entregas de 45.000 euros, por orden de Aldama, y haber sido objeto de un presunto intento de soborno —cifrado en torno a 250.000 euros— por parte de la abogada de Koldo García, Leticia de la Hoz (investigada en esa causa), para que negara las entregas. No está investigada ni imputada: comparece como testigo. Se trata de declaraciones en una instrucción en curso, no de hechos probados; rige plenamente la presunción de inocencia respecto a todos los implicados."
    sources:
      - "https://www.infobae.com/espana/2026/05/27/el-juez-ve-indicios-de-que-la-abogada-de-koldo-ofrecio-50000-euros-a-carmen-pano-para-intentar-cambiar-su-declaracion-sobre-los-pagos-en-ferraz-esta-se-vende/"
      - "https://www.elespanol.com/espana/tribunales/20260629/carmen-pano-mujer-dice-llevo-dinero-ferraz-reitera-juez-abogada-koldo-trato-sobornarla/1003744303464_0.html"
  - entity_id: "Person:joaquin-parra-paez"
    name: "Joaquín Parra Páez"
    updated: "2026-07-08"
    resumen: "Joaquín Parra Páez es un empresario extremeño, expresidente del Club Deportivo Badajoz. Desde 2021 está investigado en una causa por un presunto fraude de IVA superior a 12 millones de euros, en la que el juzgado acordó el embargo y la subasta anticipada de parte de su patrimonio (cuentas bancarias, vehículos de alta gama, inmuebles y embarcaciones); el juicio llegó a señalarse para 2026. Su nombre figura en la lista de personas investigadas del auto de entrada y registro de la sede del PSOE en la calle Ferraz (autoentradaferraz.pdf, p.41), dentro de la causa de las 'cloacas'/Leire Díez. El 8 de julio de 2026 declaró como testigo ante el juez Santiago Pedraz (Juzgado Central de Instrucción nº 5 de la Audiencia Nacional, Diligencias Previas 150/2025), donde relató que Leire Díez habría intentado captarle diciéndose enviada del Gobierno y de Santos Cerdán, ofreciéndole acceso a fiscales y pidiéndole que cambiara de abogado por uno afín al PSOE; la describió como 'el tonto útil' del Gobierno. Son manifestaciones de un testigo en instrucciones en curso, no hechos probados; rige plenamente la presunción de inocencia."
    sources:
      - "https://www.elespanol.com/espana/20250703/joaquin-parra-empresario-intento-comprar-leire-dice-victima-persecucion-judicial/1003743832692_0.html"
      - "https://www.libertaddigital.com/espana/2026-07-08/el-empresario-joaquin-parra-asegura-a-pedraz-que-leire-diez-era-el-tonto-util-del-gobierno-7432734/"
  - entity_id: "Person:jose-antonio-marco-sanjuan"
    name: "José Antonio Marco Sanjuán"
    updated: "2026-07-09"
    resumen: "José Antonio Marco Sanjuán es inspector de Hacienda del Estado y fue presidente del Tribunal Económico-Administrativo Central (TEAC) entre 2018 y 2025 (nombrado por Real Decreto 620/2018), tras presidir el Tribunal Económico-Administrativo Regional de Castilla y León; la prensa lo describía como el 'número 3' de la vicepresidenta y ministra de Hacienda María Jesús Montero. Dimitió en junio de 2025 después de que se publicara que habría cobrado de empresarios a cambio de archivar procedimientos fiscales. En marzo de 2026 la Fiscalía Anticorrupción presentó querella contra él —admitida en el Juzgado de Instrucción nº 35 de Madrid— y está imputado por presuntos delitos de cohecho, prevaricación, tráfico de influencias, malversación y negociaciones prohibidas a funcionarios; según los informes de la UDEF recogidos por la prensa, su entorno societario (entre otras, B2B Corporación Jurídica SL, administrada por su pareja) habría percibido más de 1,2 millones de euros de un empresario al que el TEAC que él presidía anuló una deuda de unos 16 millones con la Agencia Tributaria. En julio de 2026 El Debate publicó que, tras su dimisión, fue destinado como inspector a la Dependencia Regional de Inspección de la AEAT en la Comunidad Valenciana —el área que investiga el entramado societario vinculado a José Luis Rodríguez Zapatero (trama Plus Ultra/petróleo)—, sin expediente interno ni suspensión cautelar. Su causa no forma parte de los documentos judiciales de este grafo (nodo de la capa última-hora, solo prensa). Es una instrucción en curso sin juicio ni condena; rige plenamente la presunción de inocencia."
    sources:
      - "https://www.eldebate.com/espana/20250621/caida-jose-antonio-marco-sanjuan-tres-montero-anticorrupcion-investiga-cohecho-trafico-influencias_309151.html"
      - "https://www.elcorreogallego.es/espana/2026/03/23/juez-imputa-delito-cohecho-expresidente-tribunal-economico-administrativo-central-128320553.html"
      - "https://www.eldebate.com/espana/20260512/entramado-ex-tres-montero-cobro-12-millones-anular-empresario-multa-16-millones-hacienda_416411.html"
      - "https://www.eldebate.com/espana/20260708/area-hacienda-investiga-zapatero-donde-esta-colocado-ex-tres-montero-imputado-cobrar-mordidas_436988.html"
  - entity_id: "Person:juan-manuel-serrano-quintana"
    name: "Juan Manuel Serrano Quintana"
    updated: "2026-07-10"
    resumen: "Juan Manuel Serrano Quintana ('Juanma Serrano') fue jefe de gabinete de Pedro Sánchez en la secretaría general del PSOE (2014-2018) —la prensa lo sitúa en el núcleo de máxima confianza del presidente— y presidente de la Sociedad Estatal Correos y Telégrafos entre julio de 2018 y diciembre de 2023, cuando fue relevado por Pedro Saura. Su gestión dejó a Correos en la peor situación financiera de su historia: la prensa la cifró en un 'agujero' de en torno a 1.000 millones de euros (The Objective; Vozpópuli lo eleva a 1.200 millones). Entre 2017 —último ejercicio antes de su llegada— y 2023, el pasivo de la empresa pública pasó de 562,7 a 1.411,7 millones (+151%) y el patrimonio neto cayó de 1.615,9 a 851,2 millones; en 2022 perdió 217 millones —las mayores pérdidas de su historia hasta entonces— con unas pérdidas estimadas de unos 300 millones en 2023, y fracasaron apuestas de diversificación como Correos Cargo (carga aérea, cerrada en un año) o Correos Frío. En el caso Leire (Diligencias Previas 150/2025, Audiencia Nacional), un informe de la UCO de más de 50 páginas fechado el 8 de julio de 2026 le atribuye un papel 'preeminente' en las dos patas de la causa: las presuntas irregularidades en la contratación de empresas públicas —habría pactado con el también investigado Vicente Fernández (expresidente de la SEPI) la colocación de Leire Díez en Correos con requisitos hechos a medida ('Ok, seguimos hablando. Tranquila, lo tuyo sale', escribió Fernández a Díez), un 'enchufe' al que la UCO asocia comisiones de más de 200.000 euros a través de un despacho vinculado a Fernández— y las presuntas maniobras para desestabilizar causas judiciales que afectan al PSOE y al Gobierno. El 10 de julio de 2026 el juez Santiago Pedraz acordó su imputación a petición de la Fiscalía Anticorrupción y autorizó el acceso, volcado y análisis de su teléfono móvil; según fuentes fiscales citadas por Libertad Digital la imputación sería por un presunto delito de organización criminal (otras fuentes apuntan a tráfico de influencias; el auto no se ha publicado), y según Vozpópuli será citado a declarar como investigado el 28 de julio. Su nombre figura además en la tabla de personas del auto de entrada y registro de la sede del PSOE en Ferraz. Es una instrucción en curso, sin juicio ni condena; rige plenamente la presunción de inocencia."
    sources:
      - "https://theobjective.com/economia/2023-12-27/juan-manuel-serrano-sanchez-correos/"
      - "https://www.vozpopuli.com/economia/transporte/serrano-el-fontanero-que-llevo-a-correos-a-su-peor-crisis-y-dejo-un-agujero-de-1200-millones.html"
      - "https://www.elindependiente.com/economia/2024/08/03/correos-asi-se-fraguo-el-descalabro-financiero-del-ex-jefe-de-gabinete-de-pedro-sanchez/"
      - "https://www.elespanol.com/espana/tribunales/20260709/uco-implica-exjefe-gabinete-sanchez-juanma-serrano-enchufe-leire-correos-sale/1003744315488_0.html"
      - "https://www.vozpopuli.com/tribunales/el-juez-imputa-al-ex-jefe-de-gabinete-y-amigo-de-sanchez-en-el-caso-de-las-cloacas-del-psoe.html"
      - "https://www.libertaddigital.com/espana/2026-07-10/pedraz-imputacion-exjefe-gabinete-sanchez-juanma-serrano-caso-cloacas-psoe-7433630/"
