  - entity_id: "Organization:fuerzas-y-cuerpos-de-seguridad-del-estado"
    name: "Fuerzas y Cuerpos de Seguridad del Estado"
    updated: "2026-06-01"
    resumen: "Es la denominación genérica que recoge la Ley Orgánica 2/1986, de 13 de marzo, de Fuerzas y Cuerpos de Seguridad, que incluye al Cuerpo Nacional de Policía y la Guardia Civil (dependientes del Gobierno de la Nación) y los cuerpos de policía de las comunidades autónomas y locales. En los documentos analizados aparece como referencia institucional general, normalmente en relación con la actuación de la Guardia Civil (UCO) en las investigaciones. No es un actor singular de las tramas, sino una categoría administrativa. Las menciones que recoge se refieren a la seguridad pública en abstracto."
