  - entity_id: "Company:adentro-construimos"
    name: "Adentro Construimos"
    updated: "2026-07-14"
    resumen: "Empresa constructora navarra (Adentro Construimos SL), cuyo propietario y director general es Carlos Vidaurre. Reformó la sede del PSN en Pamplona entre junio y octubre de 2022 y también el piso de Ramón Alzórriz, ex 'número dos' de Chivite, por más de 150.000 euros según prensa. En el marco del 'caso Sendaviva' (Juzgado de Instrucción nº 5 de Pamplona, querella de Vox admitida a trámite por presuntos cohecho y tráfico de influencias) se investiga un presunto fraccionamiento de contratos públicos a favor de la empresa por unos 790.000 euros en total; según The Objective, dos de los contratos, de 198.640 y 198.262 euros, se firmaron el mismo día (15-nov-2023) para no superar el umbral de 200.000 euros. El grupo parlamentario del PSN contrató como asistente parlamentario en septiembre de 2024 a Martín Vidaurre, hijo del dueño. Se trata de una investigación en curso, sin condena."
    sources:
      - "https://theobjective.com/espana/tribunales/2026-01-15/juez-investiga-troceo-contratos-chivite-sede/"
      - "https://www.elespanol.com/espana/tribunales/20260505/juez-caso-sendaviva-investiga-constructor-reformo-sede-psn-piso-numero-chivite/1003744233638_0.html"
      - "https://theobjective.com/espana/politica/2025-12-08/chivite-asesor-hijo-constructor-sede/"
      - "https://navarra.okdiario.com/articulo/politica/claves-caso-sendaviva-cuatro-contratos-constructora-investigacion-judicial/20260505143801643395.html"
  - entity_id: "Person:maria-chivite"
    name: "María Chivite"
    updated: "2026-07-14"
    resumen: "Presidenta de la Comunidad Foral de Navarra desde 2019 y secretaria general del PSN-PSOE. No consta investigada en ninguna causa. Su nombre aparece en la trama porque su 'número dos', Ramón Alzórriz, dimitió de sus cargos orgánicos en junio de 2025 tras conocerse que su pareja trabajó en Servinabar — según declaró el propio Alzórriz en el Senado, fue Chivite quien le pidió la dimisión. Además, una juez investiga en el 'caso Sendaviva' el presunto troceo de contratos de su Gobierno (a través de la sociedad pública Nicdo) a favor de Adentro Construimos, la constructora que reformó la sede del PSN."
    sources:
      - "https://theobjective.com/espana/politica/2026-06-30/ex-numero-dos-psn-chivite-dimitir-admite-contactos-cerdan/"
      - "https://theobjective.com/espana/tribunales/2026-01-15/juez-investiga-troceo-contratos-chivite-sede/"
      - "https://www.canarias7.es/nacional/politica/ramon-alzorriz-numero-dos-maria-chivite-dimite-20250618202706-ntrc.html"
  - entity_id: "Person:leonardo-marcos"
    name: "Leonardo Marcos"
    updated: "2026-07-14"
    resumen: "Leonardo Marcos González (Valderas, León, 1958) dirigió la Guardia Civil entre el 13 de junio de 2023 y el 17 de septiembre de 2024, nombrado bajo el ministro Grande-Marlaska, y dimitió alegando 'motivos personales' antes de pasar a la Embajada de España en Washington como consejero de Información. Un informe de la UCO recogió una conversación intervenida en la que Koldo García aseguraba que el director de la Guardia Civil le habría informado de las pesquisas (el llamado 'chivatazo'); la propia UCO restó credibilidad a esa manifestación y Marcos lo negó rotundamente en la comisión del Senado ('No. Nunca. Jamás'). El general Rafael Yuste, exjefe de la UCO, declaró como testigo ante el juez Pedraz en el caso Leire que atribuía a Marcos y al DAO Manuel Llamas indicaciones de no ser 'proactivos' o 'ponerse de perfil' en investigaciones que afectaban al entorno del PSOE, como la del hermano de Pedro Sánchez. No consta que Marcos haya sido imputado; rige la presunción de inocencia."
    sources:
      - "https://es.wikipedia.org/wiki/Leonardo_Marcos_Gonz%C3%A1lez"
      - "https://www.eldiario.es/politica/ex-director-guardia-civil-niega-haber-dado-chivatazo-koldo-no_1_11770046.html"
      - "https://www.leonoticias.com/leon/interior-asegura-leones-leonardo-marcos-dejo-guardia-20241012123402-nt.html"
      - "https://www.estrelladigital.es/articulo/seguridad-defensa/general-yuste-exjefe-uco-ministro-directora-general-nos-mostraron-apoyo/20260626194320448038.html"
  - entity_id: "Person:carlos-vidaurre"
    name: "Carlos Vidaurre"
    updated: "2026-07-14"
    resumen: "Constructor navarro, propietario de Adentro Construimos SL, empresa que reformó la sede del PSN en el Paseo de Sarasate de Pamplona (2022) y el piso de Ramón Alzórriz, ex 'número dos' de María Chivite en el PSN. Su empresa recibió del Gobierno de Navarra unos 792.706 euros (cifra que la prensa redondea en ~800.000) en cuatro contratos tras el incendio de Sendaviva, en los que la auditoría externa de PKF Attest y la Oficina de Buenas Prácticas y Anticorrupción de Navarra detectaron un presunto fraccionamiento para quedar bajo el umbral de 200.000 euros y eludir la licitación pública (una adjudicación fue de 199.999 euros). La jueza del Juzgado nº 5 de Pamplona que instruye el 'caso Sendaviva' le investiga por presunto cohecho y tráfico de influencias en esas adjudicaciones. Su hijo Martín fue contratado como asistente del grupo parlamentario socialista en el Parlamento de Navarra. Está investigado, no condenado: rige la presunción de inocencia."
    sources:
      - "https://www.elespanol.com/espana/tribunales/20260505/juez-caso-sendaviva-investiga-constructor-reformo-sede-psn-piso-numero-chivite/1003744233638_0.html"
      - "https://theobjective.com/espana/politica/2025-12-08/chivite-asesor-hijo-constructor-sede/"
      - "https://navarra.okdiario.com/articulo/politica/alzorriz-sera-investigado-reforma-piso-realizada-constructora-caso-sendaviva/20260505145622643397.html"
  - entity_id: "Person:martin-vidaurre"
    name: "Martín Vidaurre"
    updated: "2026-07-14"
    resumen: "Martín Vidaurre Martínez es hijo del constructor Carlos Vidaurre, dueño de Adentro Construimos SL. Fue contratado en septiembre de 2024 como asistente del grupo parlamentario socialista en el Parlamento de Navarra, en el entorno de María Chivite; su formación es en liderazgo/emprendimiento (Mondragón) y comunicación corporativa (UOC). Su contratación cobró relevancia pública al coincidir con que la empresa de su padre reformó la sede del PSN y el piso de Ramón Alzórriz y recibió unos 792.000 euros en contratos del Gobierno foral hoy investigados en el 'caso Sendaviva'. No consta que él mismo esté investigado; su mención en la trama deriva del vínculo familiar y rige la presunción de inocencia."
    sources:
      - "https://theobjective.com/espana/politica/2025-12-08/chivite-asesor-hijo-constructor-sede/"
      - "https://navarra.okdiario.com/articulo/politica/alzorriz-sera-investigado-reforma-piso-realizada-constructora-caso-sendaviva/20260505145622643397.html"
  - entity_id: "Person:rafael-perez-ruiz"
    name: "Rafael Pérez Ruiz"
    updated: "2026-07-14"
    resumen: "Magistrado cordobés (1981) que se incorporó al equipo de Grande-Marlaska en junio de 2018 como director del gabinete del ministro y fue secretario de Estado de Seguridad desde el 18 de enero de 2020 hasta el 4 de junio de 2025, tras anunciar a finales de mayo de 2025 su salida 'por motivos personales' después de siete años en Interior. Como número dos del Ministerio del Interior aparece en el grafo por la comparecencia de Marlaska en la comisión del caso Koldo del Senado y por el contexto de las supuestas presiones a la UCO investigadas en el caso Leire. No consta que esté investigado ni imputado en ninguna de estas causas; rige la presunción de inocencia."
    sources:
      - "https://es.wikipedia.org/wiki/Rafael_P%C3%A9rez_Ruiz"
      - "https://www.eldiario.es/politica/numero-marlaska-renuncia-cargo-motivos-personales_1_12334771.html"
      - "https://confilegal.com/20250527-el-secretario-de-estado-de-seguridad-rafael-perez-comunica-a-grande-marlaska-que-abandona-el-cargo/"
  - entity_id: "Person:eugenio-pereiro-blanco"
    name: "Eugenio Pereiro Blanco"
    updated: "2026-07-14"
    resumen: "Comisario principal de la Policía Nacional (nacido en 1959, ingresó en 1980; comisario principal desde 2015) que fue comisario general de Extranjería y Fronteras (nombrado en diciembre de 2017) y comisario general de Información desde noviembre de 2018 (Orden de 12-nov-2018, BOE 14-nov-2018) hasta su jubilación policial en octubre de 2024, tras 44 años de servicio. En septiembre de 2025 Marlaska le eligió como director general de Coordinación y Estudios de la Secretaría de Estado de Seguridad, uno de los puestos más relevantes y sensibles del ministerio. Aparece en el grafo por el contexto de la comparecencia de Marlaska y la cúpula de Interior en la comisión del caso Koldo del Senado. No consta que esté investigado en ninguna causa de la trama; rige la presunción de inocencia."
    sources:
      - "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2018-15521"
      - "https://www.infobae.com/espana/agencias/2025/09/15/marlaska-elige-a-eugenio-pereiro-exjefe-de-informacion-de-la-policia-como-nuevo-director-de-coordinacion-en-interior/"
  - entity_id: "Person:yuste"
    name: "Yuste"
    updated: "2026-07-14"
    resumen: "Se identifica con alta probabilidad con Rafael Yuste Arenillas, jefe de la Unidad Central Operativa (UCO) de la Guardia Civil desde junio de 2023 hasta diciembre de 2025, cuando fue ascendido a general de brigada y salió de la unidad hacia la Jefatura de Servicios Técnicos; es citado en el contexto de la comparecencia de Marlaska en la comisión del caso Koldo del Senado. El 26 de junio de 2026 declaró como testigo (no investigado) ante el juez Santiago Pedraz en el 'caso Leire' y ratificó que recibió indicaciones de no ser 'proactivo' o 'ponerse de perfil' en investigaciones que afectaban al entorno del Gobierno, como la del hermano de Pedro Sánchez, señalando al entonces director Leonardo Marcos y al DAO Manuel Llamas, aunque matizó que el ministro y la directora general trasladaron su apoyo a la unidad y que su ascenso llegó 'porque le tocaba'."
    sources:
      - "https://www.estrelladigital.es/articulo/seguridad-defensa/general-yuste-exjefe-uco-ministro-directora-general-nos-mostraron-apoyo/20260626194320448038.html"
