  - entity_id: "Organization:gobierno-de-espana"
    name: "Gobierno de España"
    updated: "2026-06-01"
    resumen: "El Gobierno de España es el poder ejecutivo del Estado. Durante el periodo cubierto por las causas (caso Koldo/mascarillas, Cerdán, Ábalos, Plus Ultra) ha estado presidido por Pedro Sánchez. En el grafo aparece como referencia institucional: varios investigados ocuparon cargos ministeriales o de partido vinculados al ejecutivo (Ábalos fue ministro de Fomento y después de Transportes, Movilidad y Agenda Urbana entre junio de 2018 y julio de 2021). El Gobierno como institución no está imputado; lo están, en su caso, personas concretas por hechos presuntamente cometidos en el ejercicio o aprovechamiento de cargos públicos, rigiendo la presunción de inocencia. Es un nodo de contexto institucional, no un sujeto procesal."
    sources:
      - "https://www.lamoncloa.gob.es/gobierno/Paginas/index.aspx"
      - "https://www.lamoncloa.gob.es/gobierno/Paginas/130120-joseluisabalos.aspx"
  - entity_id: "Organization:tragsatec"
    name: "TRAGSATEC"
    updated: "2026-06-01"
    resumen: "TRAGSATEC (Tecnologías y Servicios Agrarios SA, constituida en 1990) es la filial de servicios técnicos, consultoría e ingeniería del Grupo Tragsa, empresa pública que actúa como medio propio personificado de las Administraciones y cuyo principal accionista es la SEPI (que controla el 51% del Grupo Tragsa). En el caso Koldo aparece porque Jéssica Rodríguez, expareja sentimental del exministro José Luis Ábalos, fue contratada en TRAGSATEC (cobró unos 9.500 euros brutos entre marzo y septiembre de 2021) presuntamente sin desempeñar trabajo real, en lo que la instrucción considera un presunto enchufe gestionado a través de Koldo García. Testigos han declarado que se dio la instrucción de no molestar a Rodríguez. TRAGSATEC es la empresa pública presuntamente instrumentalizada según la acusación, no un sujeto investigado; rige la presunción de inocencia respecto de las personas imputadas."
    sources:
