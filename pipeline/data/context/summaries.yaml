  - entity_id: "Person:santos-cerdan"
    name: "Santos Cerdán"
    updated: "2026-05-31"
    resumen: "Santos Cerdán León fue secretario de Organización del PSOE desde julio de 2021 -uno de los cargos de mayor peso en la dirección del partido- y diputado por Navarra. El 12 de junio de 2025 dimitió de todos sus cargos en el partido y entregó su acta de diputado tras un informe de la UCO de la Guardia Civil que le atribuía la presunta gestión de comisiones por adjudicaciones de obra pública. Está investigado por su presunta participación en una trama de cobro de comisiones (presuntamente del 2%) por la adjudicación de obra pública, vinculada a la empresa navarra Servinabar 2000 SL. La UCO halló una escritura privada de compraventa de participaciones, fechada el 1 de junio de 2016, por la que el empresario Antxon Alonso le habría transferido el 45% de dicha sociedad; el Tribunal Supremo investiga el alcance y la significación de esa presunta titularidad oculta dentro de la trama. El juez del Supremo Leopoldo Puente acordó su prisión provisional el 30 de junio de 2025 por riesgo de destrucción de pruebas, atribuyéndole un presunto papel directivo, e ingresó en Soto del Real por presuntos delitos de pertenencia a organización criminal, cohecho y tráfico de influencias. Fue puesto en libertad provisional el 19 de noviembre de 2025, tras 142 días (casi cinco meses) en prisión preventiva, al considerar el juez mitigado el riesgo de destrucción de pruebas, con medidas cautelares: retirada del pasaporte, prohibición de salir de España y comparecencias periódicas (los días 1 y 15 de cada mes). Rige la presunción de inocencia al no existir sentencia firme."
    sources:
      - "https://elpais.com/espana/2025-11-19/el-juez-del-caso-koldo-decide-este-miercoles-si-deja-en-libertad-a-santos-cerdan.html"
      - "https://www.elespanol.com/espana/20250618/cerdan-dueno-servinabar-uco-halla-escrituras-constructora-gano-contratos/1003743809649_0.html"
      - "https://confilegal.com/20251119-el-supremo-pone-en-libertad-provisional-a-santos-cerdan/"
      - "https://www.elindependiente.com/espana/2025/06/12/santos-cerdan-dimite-como-secretario-de-organizacion-del-psoe-y-entrega-su-acta-de-diputado/"
  - entity_id: "Person:jose-luis-abalos"
    name: "José Luis Ábalos"
    updated: "2026-06-23"
    resumen: "José Luis Ábalos Meco fue ministro del primer Gobierno de Pedro Sánchez —de Fomento (2018-2020) y, tras la reestructuración, de Transportes, Movilidad y Agenda Urbana (enero de 2020 a julio de 2021)— y número tres del PSOE como secretario de Organización (2017-2021). En el marco del \"caso Koldo\" se le atribuyó participación en una trama de comisiones irregulares ligadas a contratos públicos, en particular la compra de mascarillas durante la pandemia, siendo Koldo García su exasesor. Por su condición de aforado como diputado, la causa se instruyó y enjuició en instancia única ante el Tribunal Supremo (instructor Leopoldo Puente; juicio ante la Sala Segunda presidida por Andrés Martínez Arrieta, abril-mayo de 2026), y el 27 de noviembre de 2025 ingresó en prisión provisional sin fianza, siendo el primer diputado en prisión. El 22 de junio de 2026 la Sala Segunda dictó la sentencia núm. 418/2026 (Causa Especial 20775/2020), que lo CONDENA como autor de un delito de pertenencia a organización criminal (art. 570 bis CP), cohecho (continuado y varios), tráfico de influencias y malversación de caudales públicos, con penas de prisión e inhabilitación, y lo ABSUELVE de los delitos de prevaricación, uso de información privilegiada y falsedad de los que también venía acusado. En concepto de responsabilidad civil, junto a Koldo García debe indemnizar a INECO (34.450 €) y a TRAGSATEC (9.500,54 €), y se acuerda el decomiso de 430.298 € de ganancias del cohecho. Al haberse juzgado en instancia única ante el Supremo, la sentencia es firme; cabe recurso de amparo ante el Tribunal Constitucional por eventual vulneración de derechos fundamentales."
    sources:
      - "https://es.wikipedia.org/wiki/Jos%C3%A9_Luis_%C3%81balos"
