  - entity_id: "Person:javier-hidalgo"
    name: "Javier Hidalgo"
    updated: "2026-05-31"
    resumen: "Javier Hidalgo es empresario y exconsejero delegado de Globalia, grupo turístico matriz de Air Europa fundado por su padre Juan José Hidalgo. Declaró como testigo en el juicio del 'caso Koldo' / mascarillas en el Tribunal Supremo (abril de 2026), donde rebajó el papel de Víctor de Aldama describiéndolo como mero 'canal transmisor' / canal de comunicación con varios ministerios en relación con el rescate público de Air Europa vía SEPI (aprobado en noviembre de 2020, en torno a 475 millones de euros). Reconoció que la compañía pagaba a Aldama unos 10.000 euros mensuales por funciones de asesoría, mediación en vuelos chárter y operaciones de transporte de mascarillas; negó que su padre entregara 500.000 euros a Ábalos y Koldo García (pago que habían afirmado las empresarias Pano, Leonor y Carmen) y negó haber cedido un inmueble en Marbella. Está amparado por la presunción de inocencia; comparece como testigo y las imputaciones de terceros derivan de declaraciones de un investigado (Aldama) y de una causa en curso."
    sources:
      - "https://www.publico.es/politica/tribunales/javier-hidalgo-rebaja-papel-aldama-rescate-air-europa-era-canal-transmisor-simplemente.html"
      - "https://www.infobae.com/espana/agencias/2026/04/21/javier-hidalgo-globalia-situa-a-aldama-como-canal-de-comunicacion-con-varios-ministerios/"
      - "https://www.elindependiente.com/espana/2026/04/22/interrogantes-una-hora-negativas-javier-hidalgo-juicio-caso-mascarillas/"
  - entity_id: "Organization:ministerio-de-defensa"
    name: "Ministerio de Defensa"
    updated: "2026-05-31"
    resumen: "El Ministerio de Defensa es el departamento del Gobierno de España encargado de la política de defensa y de las Fuerzas Armadas. En el contexto del 'caso Koldo' / mascarillas figura por la participación de las Fuerzas Armadas en la logística pandémica: el Gobierno movilizó aviones militares (A400M del Ejército del Aire) para transportar parte de las mascarillas adquiridas en pedidos vinculados a la trama. Su mención responde a esa intervención logística institucional; no consta atribución de responsabilidad penal a la institución y la investigación sobre los contratos sigue en curso bajo presunción de inocencia."
    sources:
      - "https://okdiario.com/espana/sanchez-movilizo-aviones-militares-traer-espana-primeras-mascarillas-trama-koldo-12489841"
      - "https://www.newtral.es/guia-caso-koldo/20240303/"
  - entity_id: "Person:oscar-puente"
    name: "Óscar Puente"
    updated: "2026-05-31"
    resumen: "Óscar Puente Santiago (Valladolid, 1968) es político del PSOE, ministro de Transportes y Movilidad Sostenible del Gobierno de España desde el 21 de noviembre de 2023, en sustitución de Raquel Sánchez; la cartera es sucesora del ministerio que dirigió José Luis Ábalos (núcleo de varias tramas investigadas). Fue concejal en Valladolid (2007-2023) y alcalde de la ciudad (2015-2023), y diputado tras las elecciones de julio de 2023. Su vínculo con el 'caso Koldo'/mascarillas es el de titular actual del departamento; según un informe de la UCO conocido en junio de 2025, Koldo García pidió en un audio que Ábalos hablara con Santos Cerdán para que Puente concediese dos adjudicaciones, pero no consta que Puente esté imputado o investigado por ello. Amparado por la presunción de inocencia."
    sources:
      - "https://es.wikipedia.org/wiki/%C3%93scar_Puente_Santiago"
      - "https://www.lamoncloa.gob.es/gobierno/Paginas/biografias-xv-legislatura/ministro-oscar-puente.aspx"
      - "https://www.eldiario.es/castilla-y-leon/politica/oscar-puente-candidato-votado-valladolid-pp-no-dejo-gobernar-llega-consejo-ministros_1_10699626.html"
  - entity_id: "Organization:partido-popular"
    name: "Partido Popular"
    updated: "2026-05-31"
    resumen: "El Partido Popular (PP) es uno de los dos grandes partidos del sistema español, de orientación de centro-derecha, constituido el 20 de enero de 1989 como refundación de Alianza Popular; lo preside Alberto Núñez Feijóo desde abril de 2022. Es la principal fuerza de la oposición frente a los gobiernos del PSOE de Pedro Sánchez y, desde la oposición, ha impulsado la fiscalización política y parlamentaria de las tramas investigadas (caso Koldo/mascarillas, Cerdán, Ábalos). En el grafo aparece como nodo de alto grado porque sus federaciones territoriales (PP de Baleares, etc.) y su grupo parlamentario figuran en múltiples documentos. Su mención es contextual y político-institucional, sin que implique imputación alguna."
    sources:
      - "https://es.wikipedia.org/wiki/Partido_Popular"
      - "https://www.pp.es/"
      - "https://en.wikipedia.org/wiki/People%27s_Party_(Spain)"
  - entity_id: "Organization:ayuntamiento-de-madrid"
    name: "Ayuntamiento de Madrid"
    updated: "2026-05-31"
    resumen: "El Ayuntamiento de Madrid es la administración local de la capital de España, con órganos de contratación propios. Durante la pandemia de COVID-19 (marzo de 2020) tramitó contratos de emergencia de material sanitario que fueron objeto del llamado 'caso Mascarillas' madrileño: el Tribunal de Cuentas señaló sobreprecios y los empresarios Luis Medina y Alberto Luceño fueron juzgados por presunta estafa al consistorio y falsedad documental en la venta de mascarillas, guantes y test (juicio iniciado en 2025), causa en la que rige la presunción de inocencia. Esta causa madrileña es distinta de la trama Koldo/Soluciones de Gestión, aunque ambas se enmarcan en las compras de emergencia de 2020. La mención de la institución no implica por sí misma imputación de personas concretas."
    sources:
      - "https://es.wikipedia.org/wiki/Ayuntamiento_de_Madrid"
      - "https://www.elespanol.com/madrid/capital/20250210/arranca-juicio-caso-mascarillas-medina-luceno-estafar-ayuntamiento-madrid/922408202_0.html"
      - "https://www.eldiario.es/politica/mascarillas-caras-espana-mala-calidad-sobreprecios-mordidas-ayuntamiento-madrid_1_9061127.html"
  - entity_id: "Organization:noran-coop"
    name: "Noran Coop"
    updated: "2026-05-31"
    resumen: "Noran Coop (Noran Sociedad Cooperativa Pequeña), domiciliada en Donostia, es una sociedad cooperativa vasca constituida en 2015 cuyos socios habrían sido Antxon Alonso —administrador de Servinabar— y Koldo García. Según informaciones sobre el informe de la UCO en la causa de Santos Cerdán, la cooperativa habría recibido fondos procedentes de Servinabar (cifras que diversas informaciones sitúan en cientos de miles de euros), y la UCO atribuiría a Santos Cerdán presunta capacidad de decisión sobre Noran y Servinabar, dentro de una estructura presuntamente empleada para canalizar fondos vinculados a adjudicaciones de obra pública. Todo ello se encuentra en fase de investigación y bajo presunción de inocencia; las cifras y atribuciones concretas proceden de fuentes periodísticas sobre el sumario y no de resolución firme."
    sources:
      - "https://www.elespanol.com/espana/20250730/uco-investiga-destino-eur-constructora-cerdan-traspaso-cooperativa-koldo/1003743868018_0.html"
      - "https://www.euskadi.eus/gobierno-vasco/-/entidad/noran-s-coop-pequena/"
      - "https://empresite.eleconomista.es/NORAN-PEQUENA.html"
  - entity_id: "Person:miguel-angel-gallardo"
    name: "Miguel Ángel Gallardo"
    updated: "2026-07-14"
    resumen: "Miguel Ángel Gallardo Miranda fue presidente de la Diputación de Badajoz y dirigente del PSOE en Extremadura. El 14 de julio de 2026, la Audiencia Provincial de Badajoz lo condenó (sentencia 152/2026) como autor de DOS delitos de prevaricación administrativa —Bloque A, la creación en 2016 del puesto de coordinador de los conservatorios para David Sánchez, hermano del presidente del Gobierno, y Bloque B, su transformación en 2022 en la jefatura de la Oficina de Artes Escénicas disfrazada de cambio de nomenclatura— a sendas penas de 9 años de inhabilitación especial para empleo o cargo público, y lo absolvió del tráfico de influencias. El tribunal declara probado que decidió la creación del puesto junto a la diputada y la directora de Cultura y que, como máximo responsable de una entidad 'de carácter presidencialista' según sus propias palabras, dispuso la contratación de David Sánchez como personal de Alta Dirección. El Ministerio Fiscal no formuló acusación; la sostuvieron las acusaciones populares. La sentencia NO es firme: cabe apelación ante el TSJ de Extremadura y rige la presunción de inocencia."
    sources:
      - "https://es.wikipedia.org/wiki/Caso_David_S%C3%A1nchez"
      - "https://www.infobae.com/espana/2026/05/28/el-juicio-por-la-contratacion-de-david-sanchez-en-la-diputacion-de-badajoz-se-aplaza-tras-el-choque-entre-defensas-y-fiscalia-por-la-prescripcion-y-las-nulidades/"
      - "https://www.eleconomista.es/actualidad/noticias/13941076/05/26/arranca-el-juicio-contra-el-hermano-de-pedro-sanchez-las-claves-del-proceso-por-presunto-enchufe-en-la-diputacion-de-badajoz.html"
  - entity_id: "Company:globalia"
    name: "Globalia"
    updated: "2026-08-27"
    resumen: "Globalia es uno de los mayores grupos turísticos de España, controlado por la familia Hidalgo (Juan José Hidalgo y su hijo Javier Hidalgo), matriz de la aerolínea Air Europa y de agencias como Halcón Viajes. En noviembre de 2020 Air Europa recibió un rescate de 475 millones de euros del fondo de la SEPI (FASEE). La compañía ha reconocido que el empresario Víctor de Aldama tuvo relación con el grupo en torno a ese rescate — según la sentencia del Tribunal Supremo de 22-06-2026, Aldama percibía una retribución mensual a través de Globalia Corporación S.A., accionista único de la aerolínea —; según testimonios no acreditados judicialmente, se habrían entregado cantidades en efectivo en presencia de Koldo García. Javier Hidalgo, exconsejero delegado, ha negado el pago de comisiones por el rescate. La antigua filial de agencia de viajes del grupo, Globalia Corporate Travel S.L.U. (NIF B57986846, hoy Sekai Corporate Travel y fuera del perímetro de Globalia desde 2020-21), tiene ficha propia en este grafo: la contratación pública que acumula es suya, no del grupo. Rige la presunción de inocencia: ni Globalia ni sus directivos han sido condenados y los hechos del rescate están bajo investigación en el marco del caso Koldo."
    sources:
      - "https://es.wikipedia.org/wiki/Juan_Jos%C3%A9_Hidalgo"
      - "https://www.moncloa.com/2026/03/20/aldama-rescate-air-europa-3366770/"
      - "https://www.newtral.es/rescate-air-europa/20240301/"
  - entity_id: "Company:globalia-corporate-travel"
    name: "Globalia Corporate Travel"
    updated: "2026-08-27"
    resumen: "Globalia Corporate Travel S.L.U. (NIF B57986846, R.M. Palma hoja PM-79779) es una agencia de viajes corporativos nacida en el grupo Globalia. Salió del perímetro del grupo en 2020-21: su socio único pasó a Gestión de Viajes Deneb S.L. (enero de 2020, BORME) y después a Ávoris Corporación Empresarial S.L. (enero de 2021, BORME), y en enero de 2022 cambió su denominación a «Sekai Corporate Travel S.L.U.», siempre con el mismo NIF. Es adjudicataria recurrente de contratación pública con ese NIF: el contrato centralizado de agencia de viajes de la AGE (62,4 millones de euros, 2018), licitaciones de Renfe y del IB-Salut, contratos de la Xunta de Galicia y cientos de contratos menores (UPV/EHU, Universidad de Sevilla, Axencia Turismo de Galicia, Aena vía las UTE de handling del grupo), donde desde 2024-25 aparece ya como SEKAI. Contratar con la administración es legal — también en emergencia o por procedimientos previstos por la ley —; el patrón de microcontratos recurrentes está descrito en /patrones como señal editorial, no como hecho ni indicio judicial. No consta investigación judicial sobre esta sociedad; no confundirla con la matriz Globalia (caso Koldo/Air Europa) ni con homónimos como Globalia Urbanismo Integral."
    sources:
      - "https://www.boe.es/diario_borme/txt.php?id=BORME-A-2021-18-07"
      - "https://www.boe.es/diario_borme/txt.php?id=BORME-A-2022-18-07"
      - "https://contrataciondelestado.es/wps/poc?uri=deeplink:detalle_licitacion&idEvl=Y0r8XyhXFgoQK2TEfXGy%2BA%3D%3D"
  - entity_id: "Company:inteligencia-prospectiva"
    name: "Inteligencia Prospectiva"
    updated: "2026-05-31"
    resumen: "Inteligencia Prospectiva, S.L. es una mercantil española participada por los hermanos venezolanos Guillermo Alfredo (62%) y Domingo Arnaldo Amaro Chacón (38%). En la causa del rescate público de la aerolínea Plus Ultra (53 millones de euros aprobados vía SEPI en marzo de 2021), que instruye el juez José Luis Calama en el Juzgado Central de Instrucción nº 4 de la Audiencia Nacional, los informes de la UDEF la describen como presunta sociedad instrumental sin actividad real que habría movido fondos y los habría canalizado, mediante presuntos contratos y facturas, hacia sociedades del entorno del expresidente José Luis Rodríguez Zapatero: según esos informes habría transferido 561.440 euros a Whathefav, S.L. (empresa de las hijas de Zapatero), 380.208 euros a Análisis Relevante (de Julio Martínez) y 266.200 euros a Gate Center. La investigación la sitúa junto a otras mercantiles (Softgestor, Grupo Aldesa) en un presunto esquema de blanqueo. Todo se enmarca en una investigación judicial en curso y no juzgada; rige la presunción de inocencia para la sociedad y sus administradores."
    sources:
      - "https://www.publico.es/politica/inteligencia-prospectiva-destino-92-pagos-empresas-vinculadas-zapatero-martinez.html"
      - "https://www.infobae.com/espana/2026/05/24/quien-es-quien-en-el-caso-plus-ultra-un-entramado-de-empresarios-politicos-y-sociedades-que-coloca-en-el-centro-de-la-investigacion-a-zapatero/"
      - "https://www.eldiario.es/politica/empresas-salpicadas-investigacion-zapatero-whathefav-analisis-relevante_1_13234431.html"
  - entity_id: "Company:air-europa"
    name: "Air Europa"
    updated: "2026-05-31"
    resumen: "Air Europa (Air Europa Holding, S.L.) es la aerolínea del Grupo Globalia, controlado por la familia Hidalgo (Juan José Hidalgo; su hijo Javier Hidalgo fue consejero delegado). El 3 de noviembre de 2020 el Consejo de Ministros aprobó una ayuda pública de 475 millones de euros a la aerolínea a través del Fondo de Apoyo a la Solvencia de Empresas Estratégicas (FASEE) de la SEPI, cuando José Luis Ábalos era ministro de Transportes. La investigación del caso Koldo y el juicio del 'caso mascarillas' examinan el presunto papel de Víctor de Aldama como intermediario —contratado por la aerolínea y cuya intervención Globalia reconoció—, y los informes de la UCO recogen que Ábalos facilitó la negociación entre Javier Hidalgo y la entonces ministra de Economía Nadia Calviño, así como indicios, no acreditados y negados por la empresa, del abono del alquiler de un chalet en Marbella (en torno a 20.000 euros, agosto de 2020) a Ábalos. La compañía es pieza relevante de esa línea de investigación; rige la presunción de inocencia."
    sources:
      - "https://www.infobae.com/espana/2026/04/22/el-rescate-a-air-europa-se-cuela-en-el-juicio-del-caso-mascarillas-con-el-rastro-del-dinero-en-efectivo-y-versiones-enfrentadas-sobre-lo-ocurrido-antes-de-la-ayuda/"
      - "https://theobjective.com/espana/tribunales/2026-04-27/uco-abalos-hidalgo-calvino-air-europa/"
  - entity_id: "Organization:congreso-de-los-diputados"
    name: "Congreso de los Diputados"
    updated: "2026-05-31"
    resumen: "El Congreso de los Diputados es la cámara baja de las Cortes Generales de España. En relación con estos casos actúa como marco de la comisión de investigación sobre la contratación pública durante la pandemia de COVID-19 y la presunta intermediación de Koldo García, y como institución a la que pertenecieron varios protagonistas: José Luis Ábalos y Santos Cerdán fueron diputados (Cerdán por Navarra), y Francina Armengol preside la Cámara. Es un organismo constitucional sin atribución penal; su presencia en el grafo es institucional y contextual."
    sources:
      - "https://www.congreso.es/"
  - entity_id: "Organization:wakalua"
    name: "Wakalua"
    updated: "2026-05-31"
    resumen: "Wakalua (Wakalua Innovation Hub) es un hub de innovación turística con sede en Madrid (Barrabés Growth Space), vinculado al Grupo Globalia —matriz de Air Europa—, lanzado el 22-24 de enero de 2019 en el marco de FITUR en colaboración con la OMT/UNWTO (acto presidido por el secretario general Zurab Pololikashvili y el CEO de Globalia Javier Hidalgo). Aparece en la investigación por dos vías: (1) como punto de conexión entre Globalia/Javier Hidalgo y Begoña Gómez (esposa de Pedro Sánchez), pues en enero de 2020 firmó un patrocinio de 40.000 euros con el IE Africa Center que ella dirigía —del que, según testimonio de su exCEO, solo se habría abonado en torno al 5%—, hecho que el juez Juan Carlos Peinado examina en la causa relativa a Begoña Gómez; y (2) por su pertenencia al ecosistema Globalia, cuyas reuniones se cruzan con el rescate de Air Europa. La entidad no tiene responsabilidad penal acreditada; rige la presunción de inocencia."
    sources:
      - "https://www.untourism.int/global/press-release/2019-01-24/wakalua-first-global-tourism-innovation-hub-launched-globalia-collaboration"
      - "https://www.libertaddigital.com/espana/politica/2025-05-12/los-tres-hechos-que-unen-a-begona-gomez-y-air-europa-y-ya-investiga-el-juez-wakalua-una-cita-y-una-llamada-de-hidalgo-7252753/"
  - entity_id: "Organization:swift"
    name: "SWIFT"
    updated: "2026-05-31"
    resumen: "SWIFT es la red cooperativa internacional, de Derecho belga y propiedad de miles de entidades financieras, que estandariza los mensajes de pago y transferencias entre bancos a escala mundial mediante los códigos BIC; no mueve dinero, sino las instrucciones de pago. En la documentación de casos de corrupción españoles, las referencias a SWIFT aluden a códigos u órdenes de transferencias internacionales rastreadas en informes policiales o financieros. Es una infraestructura técnica neutral, no un sujeto investigado ni parte de ninguna trama."
    sources:
      - "https://www.swift.com/about-us"
      - "https://es.wikipedia.org/wiki/SWIFT"
  - entity_id: "Organization:sepi"
    name: "SEPI"
    updated: "2026-05-31"
    resumen: "La SEPI es el holding de empresas públicas del Estado español, heredero del antiguo INI, y durante la pandemia gestionó el Fondo de Apoyo a la Solvencia de Empresas Estratégicas (FASEE). A través de ese fondo aprobó en marzo de 2021 un rescate de 53 millones de euros (un préstamo participativo de 34 millones y otro ordinario de 19) a la aerolínea Plus Ultra, operación hoy en el centro de la causa judicial del 'caso Plus Ultra' que instruye el juez José Luis Calama en la Audiencia Nacional. Según la investigación, la SEPI habría aprobado la ayuda con presuntas deficiencias en los informes internos y sobre cifras presuntamente cuestionadas de la aerolínea; estos extremos son objeto de investigación, no hechos probados. La SEPI es un organismo público del Estado, no un sujeto acusado de delito; rige la presunción de inocencia sobre las personas investigadas en la causa."
    sources:
      - "https://es.wikipedia.org/wiki/Sociedad_Estatal_de_Participaciones_Industriales"
      - "https://www.eldiario.es/politica/siete-claves-rescate-plus-ultra-investiga-juez-caso-zapatero_1_13240595.html"
      - "https://www.sepi.es/es/fondo-fasee"
  - entity_id: "Organization:red-es"
    name: "Red.es"
    updated: "2026-10-04"
    resumen: "Red.es es una entidad pública empresarial española dedicada a ejecutar proyectos de transformación digital de empresas, ciudadanía y administraciones (gestiona, entre otros, RedIRIS, el observatorio ONTSI y el registro de dominios '.es'). Aparece en esta base como organismo público de contratación tecnológica. Con la información disponible en este lote no se ha confirmado en fuentes fiables un papel central de Red.es en las tramas investigadas (Koldo/mascarillas, Cerdán/Servinabar, Plus Ultra). Conviene tratar con cautela cualquier vínculo concreto de Red.es con la trama hasta verificarlo documentalmente."
    sources:
      - "https://es.wikipedia.org/wiki/Red.es"
      - "https://red.es/"
  - entity_id: "Person:rodolfo-reyes"
    name: "Rodolfo Reyes"
    updated: "2026-05-31"
    resumen: "Rodolfo José Reyes Rojas es un empresario de origen venezolano al que los investigadores consideran el principal accionista de Plus Ultra Líneas Aéreas, controlada a través de las sociedades Snip Aviation y FlySpain; su esposa, María Aurora López, figura en el accionariado. La investigación del 'caso Plus Ultra' le atribuye haber sido uno de los principales impulsores de las gestiones para lograr el rescate público de 53 millones de la SEPI en 2021 y la presunta posterior ocultación de fondos en paraísos fiscales. En mayo de 2026 el juez José Luis Calama de la Audiencia Nacional emitió una orden internacional de detención contra él (y contra su esposa) por presuntos delitos de apropiación indebida/malversación, tráfico de influencias, pertenencia a organización criminal y blanqueo de capitales; consta en situación de fuga. Rige la presunción de inocencia: se trata de imputaciones no juzgadas."
    sources:
      - "https://theobjective.com/espana/tribunales/2026-05-25/juez-orden-internacional-detencion-dueno-plus-ultra/"
      - "https://www.cope.es/programas/la-linterna/noticias/juez-calama-emite-orden-internacional-detener-rodolfo-reyes-principal-accionista-plus-ultra-20260525_3371359.html"
      - "https://www.elespanol.com/espana/tribunales/20260525/juez-calama-emite-orden-internacional-detener-rodolfo-reyes-principal-accionista-plus-ultra/1003744259618_0.html"
  - entity_id: "Person:roberto-roselli"
    name: "Roberto Roselli"
    updated: "2026-05-31"
    resumen: "Roberto Roselli Miele es un empresario de origen venezolano que fue consejero delegado (CEO) de Plus Ultra Líneas Aéreas y que, según la investigación, controlaba la aerolínea junto a Rodolfo Reyes Rojas y Raif El Arigie a través de Snip Aviation y FlySpain. El 12 de diciembre de 2025 fue detenido junto al presidente de la compañía, Julio Martínez, en una operación policial de la UDEF por presunto blanqueo de capitales vinculado al rescate de 53 millones de la SEPI, y posteriormente quedó en libertad provisional con medidas cautelares (retirada de pasaporte). Esta línea de detenciones se enmarcó en una causa instruida en Madrid, distinta de la instrucción del rescate que lleva el juez Calama en la Audiencia Nacional. Rige la presunción de inocencia: son hechos investigados, no probados en juicio."
    sources:
      - "https://rankiabusiness.com/detencion-julio-martinez-y-roberto-roselli-plus-ultra-investigacion-judicial/"
      - "https://www.libertaddigital.com/espana/2025-12-13/el-juez-deja-en-libertad-a-los-tres-detenidos-del-caso-plus-ultra-que-acorrala-a-zapatero-7333220/"
      - "https://www.democrata.es/tribunales/quien-es-quien-en-caso-plus-ultra-red-investiga-audiencia-nacional/"
  - entity_id: "Organization:diputacion-de-badajoz"
    name: "Diputación de Badajoz"
    updated: "2026-05-31"
    resumen: "La Diputación Provincial de Badajoz es la administración local donde David Sánchez Pérez-Castejón, hermano del presidente del Gobierno Pedro Sánchez, fue contratado en julio de 2017 como 'coordinador de actividades de los conservatorios de música'; el puesto pasó en 2022 a denominarse 'jefe de la Oficina de Artes Escénicas'. Es el escenario central del llamado 'caso David Sánchez': la jueza instructora de Badajoz Beatriz Biedma (Juzgado de Instrucción número 3) consideró indiciariamente que la plaza se habría creado a medida para él e instruyó la causa por presuntos delitos de prevaricación administrativa y tráfico de influencias. El juicio en la Audiencia Provincial de Badajoz arrancó el 28 de mayo de 2026 con once acusados, entre ellos David Sánchez y el expresidente de la Diputación y exlíder del PSOE extremeño Miguel Ángel Gallardo; se exponen a penas de hasta tres años de cárcel. Rige la presunción de inocencia: son hechos en enjuiciamiento, no probados ni con sentencia. La Diputación comunicó al tribunal que David Sánchez percibió 340.572 euros (cifra publicada como bruta) en torno a nueve años de relación laboral."
    sources:
      - "https://es.wikipedia.org/wiki/Caso_David_S%C3%A1nchez"
      - "https://www.infobae.com/espana/agencias/2026/03/03/la-diputacion-de-badajoz-comunica-al-tribunal-que-el-hermano-de-sanchez-cobro-340572-euros-en-nueve-anos/"
      - "https://www.infobae.com/espana/agencias/2026/05/28/maxima-expectacion-ante-la-audiencia-de-badajoz-por-el-juicio-a-david-sanchez-y-gallardo/"
      - "https://www.eldiario.es/extremadura/politica/david-sanchez-pide-nulidad-causa-contrato-diputacion-basada-recortes-prensa-mentiras_1_13256513.html"
