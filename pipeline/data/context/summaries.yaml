  - entity_id: "Company:torrescamara-y-cia-de-obras-s-a"
    name: "Torrescámara y Cía. de Obras S.A."
    updated: "2026-08-28"
    resumen: "Torrescámara y Cía. de Obras, S.A. es una empresa constructora con sede en Valencia, activa en obra pública. Aparece en el informe de la UCO del caso Cerdán/Koldo (entregado al Tribunal Supremo en junio de 2025) como integrante de la UTE —junto a Levantina, Ingeniería y Construcción, S.L. y Ortiz Construcciones y Proyectos, S.A.— que se adjudicó el tramo de la autovía A-12 entre Santo Domingo de la Calzada (La Rioja) y Villamayor del Río (Burgos), por unos 59,8 millones de euros (sin IVA). La UCO subraya que esa UTE obtuvo la mejor puntuación total (95,22) pese a quedar 14ª en la oferta económica, dentro del patrón de adjudicaciones que los investigadores consideran presuntamente 'apañadas' a cambio de comisiones durante la etapa de Ábalos en el ministerio. La empresa figura como adjudicataria analizada; no está acusada de pagar comisiones y rige la presunción de inocencia."
    sources:
      - "https://www.eldiario.es/economia/13-obras-recoge-informe-uco-tumbado-cerdan-suman-637-millones-e-incluyen-fondos-europeos_1_12380100.html"
      - "https://www.todoalicante.es/politica/mapa-adjudicaciones-bajo-sospecha-triangulo-koldo-abalos-cerdan-20250614221009-ntrc.html"
  - entity_id: "Person:yolanda-sanchez-baltasar"
    name: "Yolanda Sánchez Baltasar"
    updated: "2026-06-20"
    resumen: "Yolanda Sánchez Baltasar es directora del Conservatorio Profesional de Música Juan Vázquez de Badajoz. Declaró como testigo en el juicio contra David Sánchez Pérez-Castejón (hermano del presidente del Gobierno) y otros cargos de la Diputación de Badajoz por la contratación de aquel como coordinador de actividades de los conservatorios, causa juzgada en Extremadura. Según su testimonio en el juicio (junio de 2026), conoció a través del entonces director del Conservatorio Superior de Música de Badajoz, Evaristo Valentí, el rumor de que el hermano de Pedro Sánchez podría ocupar el puesto, y afirmó que el trabajo de David Sánchez como coordinador 'fue muy bien'. No figura como acusada; su papel es el de testigo y persona del entorno administrativo del Conservatorio. Rige la presunción de inocencia para todos los investigados de la causa."
    sources:
      - "https://www.moncloa.com/2026/06/02/david-sanchez-conservatorios-3381216/"
      - "https://www.infobae.com/espana/2026/06/01/una-testigo-clave-del-juicio-al-hermano-de-pedro-sanchez-reconoce-que-no-se-le-sustituyo-durante-la-baja-pero-que-otra-persona-ocupa-ahora-la-plaza/"
  - entity_id: "Organization:area-de-cultura"
    name: "Área de Cultura"
    updated: "2026-06-20"
    resumen: "El 'Área de Cultura' es la unidad/área de Cultura de la Diputación de Badajoz. Aparece en el caso David Sánchez (Diputación de Badajoz) como el ámbito administrativo en el que se creó y al que quedó adscrito el puesto de coordinador de actividades de los conservatorios para el que fue contratado David Sánchez Pérez-Castejón en 2017, según la acusación. Es un órgano administrativo de contexto, no un ente acusado; en el juicio figuran vinculadas a esta área varias personas (entre ellas Emilia Parejo, exdirectora del Área de Cultura, y Manuel Candalija, exjefe del Servicio de Actividades Culturales). Rige la presunción de inocencia para los investigados de la causa."
    sources:
      - "https://www.dip-badajoz.es/"
      - "https://www.infobae.com/espana/agencias/2026/06/04/el-resto-de-acusados-en-el-juicio-a-david-sanchez-avalan-la-transparencia-de-los-procesos/"
  - entity_id: "Organization:junta-de-andalucia"
    name: "Junta de Andalucía"
    updated: "2026-10-04"
    resumen: "La Junta de Andalucía es el conjunto de instituciones de autogobierno de Andalucía (Presidencia, Consejo de Gobierno y consejerías). En esta base aparece de forma tangencial dentro del informe de la Guardia Civil, asociada a la Adenda al Convenio Trilateral (2019) y a listados de expedientes/convenios analizados en el contexto de la contratación pública. Su mención no implica imputación de la institución: figura como administración interviniente o citada en documentación administrativa. Rige la presunción de inocencia respecto de cualquier persona u organismo nombrado en ese contexto."
    sources:
      - "https://www.juntadeandalucia.es/organismos/sobre-junta.html"
