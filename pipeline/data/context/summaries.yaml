  - entity_id: "Organization:ministerio-de-transportes-movilidad-y-agenda-urbana"
    name: "Ministerio de Transportes, Movilidad y Agenda Urbana"
    updated: "2026-05-31"
    resumen: "El Ministerio de Transportes, Movilidad y Agenda Urbana (MITMA) fue el departamento del Gobierno de España responsable de las políticas de transporte, movilidad e infraestructuras, denominación que adoptó en 2020 (anteriormente Ministerio de Fomento y posteriormente Ministerio de Transportes y Movilidad Sostenible). José Luis Ábalos lo dirigió entre 2018 y 2021. En el marco del 'caso Koldo', diversos contratos adjudicados por este ministerio y sus organismos dependientes (como ADIF) durante esa etapa son objeto de investigación por presuntas comisiones. El ministerio es un organismo público, no un investigado; la investigación recae sobre personas concretas."
    sources:
      - "https://www.transportes.gob.es/"
      - "https://es.wikipedia.org/wiki/Caso_Koldo"
  - entity_id: "Person:victor-de-aldama"
    name: "Víctor de Aldama"
    updated: "2026-06-23"
    resumen: "Víctor Gonzalo de Aldama Delgado es un empresario español, expresidente del Zamora CF, señalado por la investigación como comisionista o intermediario ('conseguidor') del 'caso Koldo'. En octubre de 2024 ingresó en prisión provisional en una causa separada por presunto fraude fiscal en la venta de hidrocarburos (la UCO lo identifica como uno de los principales responsables de una trama que habría defraudado en torno a 182 millones de euros en IVA), y en noviembre de 2024 declaró voluntariamente ante el juez implicando a José Luis Ábalos, a Koldo García y a otros cargos, a quienes afirmó haber entregado dinero. El 22 de junio de 2026 la Sala Segunda del Tribunal Supremo, en la sentencia núm. 418/2026 (Causa Especial 20775/2020), lo CONDENA como autor de un delito de pertenencia a organización criminal (art. 570 bis CP) y de varios delitos de cohecho, apreciando la atenuante muy cualificada de colaboración con la justicia (rebaja de la pena en uno o dos grados); acuerda la suspensión de las penas privativas de libertad impuestas, condicionada a que no delinca durante cinco años, a comparecencias semestrales y a la realización de trabajos en beneficio de la comunidad durante un año (pendiente de su consentimiento). Lo ABSUELVE de los restantes delitos de los que venía acusado (incluidas inducción a la prevaricación, aprovechamiento de información privilegiada y falsedad), y participa del decomiso conjunto de 430.298 € de ganancias del cohecho. La sentencia, dictada en instancia única ante el Supremo, es firme."
    sources:
      - "https://es.wikipedia.org/wiki/V%C3%ADctor_de_Aldama"
      - "https://www.infobae.com/espana/2026/05/04/la-fiscalia-mantendra-la-peticion-de-siete-anos-de-prision-para-victor-de-aldama-y-rechazara-rebajar-la-pena-pese-a-su-colaboracion-con-la-justicia/"
      - "https://www.diariodecastillayleon.es/zamora/241007/83282/detienen-expresidente-zamora-cf-fraude-182-millones-hidrocarburos.html"
      - "Tribunal Supremo, Sala de lo Penal, Sentencia núm. 418/2026 de 22-jun-2026 (Causa Especial 20775/2020); verificable en https://www.administraciondejusticia.gob.es"
  - entity_id: "Organization:unidad-central-operativa"
    name: "Unidad Central Operativa"
    updated: "2026-05-31"
    resumen: "La Unidad Central Operativa (UCO) es la unidad de élite de la Policía Judicial de la Guardia Civil encargada de la investigación de la delincuencia grave y organizada, incluida la económica y la corrupción. En estos casos actúa como auxiliar de los juzgados y del Tribunal Supremo, elaborando los informes patrimoniales y de indicios que sustentan las investigaciones del 'caso Koldo', la rama Cerdán-Servinabar y otras causas. Sus informes son medios de prueba sujetos a contradicción judicial; no determinan culpabilidad, que corresponde a los tribunales."
    sources:
      - "https://es.wikipedia.org/wiki/Unidad_Central_Operativa"
      - "https://www.telecinco.es/noticias/espana/20251118/informe-uco-santos-cerdan-entorno-familiar-beneficiado-dinero-adjudicaciones-amanos-obra-publica_18_017613923.html"
  - entity_id: "Person:antxon"
    name: "Antxón"
    updated: "2026-05-31"
    resumen: "Joseba Antxon Alonso Egurrola es un empresario vasco identificado en las investigaciones del 'caso Koldo'/trama Cerdán como administrador y socio de Servinabar 2000 SL. Según los informes de la UCO, Santos Cerdán habría suscrito una escritura de compra del 45% de Servinabar con Alonso, extremo que Cerdán afirma que nunca se hizo efectivo; la UCO sostiene que Servinabar habría retenido presuntamente un 2% de los contratos adjudicados a Acciona supuestamente obtenidos por la influencia de Cerdán. El 11 de diciembre de 2025 la UCO le detuvo en Vizcaya en el marco de la operación de la Audiencia Nacional relacionada con Leire Díez, por presuntas irregularidades en contratos públicos. Rige plenamente la presunción de inocencia: no consta sentencia condenatoria."
    sources:
      - "https://www.infobae.com/espana/2025/12/11/la-uco-arresta-a-antxon-alonso-el-empresario-vinculado-a-servinabar-y-santos-cerdan-en-la-operacion-contra-leire-diez/"
      - "https://okdiario.com/espana/uco-detiene-antxon-alonso-socio-cerdan-servinabar-15915154"
  - entity_id: "Organization:direccion-general-de-carreteras"
    name: "Dirección General de Carreteras"
    updated: "2026-05-31"
    resumen: "La Dirección General de Carreteras es el órgano del Ministerio de Transportes encargado de la planificación, construcción y conservación de la red de carreteras del Estado. En las investigaciones del 'caso Koldo'/trama Cerdán, su titular durante el mandato de Ábalos, Javier Herrero (director general 2018-2022), está investigado por el juez de la Audiencia Nacional Ismael Moreno: la UCO atribuye a Koldo García y Santos Cerdán interés en mantenerle al frente del organismo para presuntamente amañar adjudicaciones de obra pública (entre ellas el Puente del Centenario de Sevilla, adjudicado a Acciona en 2021 por unos 71,4 millones de euros). Herrero está investigado por presuntos delitos de organización criminal, cohecho y tráfico de influencias. La presunción de inocencia ampara a las personas investigadas; no hay sentencia."
    sources:
      - "https://www.libertaddigital.com/espana/politica/2025-08-02/la-justicia-cree-probado-que-cerdan-impuso-al-director-de-carreteras-en-el-cargo-para-poder-amanar-las-obras-publicas-7282663/"
      - "https://www.elespanol.com/espana/tribunales/20260520/exdirector-carreteras-responsabiliza-ministros-sobreprecios-varias-obras-sospechosas-amanos/1003744253104_0.html"
  - entity_id: "Organization:puertos-del-estado"
    name: "Puertos del Estado"
    updated: "2026-05-31"
    resumen: "Puertos del Estado es el organismo público, adscrito al Ministerio de Transportes, que coordina y controla la eficiencia del sistema portuario de titularidad estatal. En el 'caso Koldo' figura como uno de los compradores públicos de mascarillas en 2020: adjudicó a Soluciones de Gestión y Ayuda a las Empresas SL (empresa que la investigación vincula a Víctor de Aldama) un contrato de unos 8 millones de mascarillas por aproximadamente 24,2 millones de euros. Su entonces presidente, Francisco Toledo, declaró como testigo en el Tribunal Supremo que la contratación se le comunicó como lista para firmar y conforme a la legalidad, y que ni él ni el exsecretario general Álvaro Sánchez Manzanares recibieron presiones de los acusados. Rige la presunción de inocencia: no hay condena."
    sources:
      - "https://www.infobae.com/espana/agencias/2026/04/15/expresidente-de-puertos-niega-presiones-en-los-contratos-de-mascarillasnadie-me-influyo/"
      - "https://www.teleprensa.com/articulo/nacional-3/exresponsables-puertos-dicen-que-nadie-influyo-contratacion-empresa-vinculada-aldama/202604151747312393095.html"
  - entity_id: "Person:isabel-pardo-de-vera"
    name: "Isabel Pardo de Vera"
    updated: "2026-05-31"
    resumen: "Isabel Pardo de Vera Posada fue presidenta de ADIF (2018-2021) y después secretaria de Estado de Transportes, Movilidad y Agenda Urbana (2021-2023) bajo el ministerio de José Luis Ábalos. Está investigada (imputada) en el 'caso Koldo': la UCO sostiene que Koldo García se habría valido de ella para presuntamente materializar amaños de contratos públicos, y el instructor le atribuye indiciariamente delitos como organización criminal, cohecho y tráfico de influencias; el juez la dejó en libertad con medidas cautelares y le retiró el pasaporte. Ella ha negado irregularidades y ha declarado como testigo en el Tribunal Supremo en el juicio contra Ábalos. Rige plenamente la presunción de inocencia: no hay juicio ni condena en su contra."
    sources:
      - "https://es.wikipedia.org/wiki/Isabel_Pardo_de_Vera"
      - "https://www.eldiario.es/politica/juez-retira-pasaporte-expresidenta-adif-imputada-caso-koldo_1_12480512.html"
      - "https://www.atlantico.net/espana/pardo-vera-declara-supremo-caso_1_20260413-4233789.html"
  - entity_id: "Company:soluciones-de-gestion"
    name: "Soluciones de Gestión"
    updated: "2026-05-31"
    resumen: "Soluciones de Gestión y Ayuda a las Empresas SL fue adjudicataria en 2020 de varios contratos de emergencia de material sanitario (mascarillas) por un total en torno a 53 millones de euros, mediante negociado sin publicidad, con compradores públicos como ADIF y Puertos del Estado. Según los informes de la investigación, la empresa carecía de actividad relevante previa en el sector, por lo que distintas fuentes la describen como 'empresa fantasma' o mera adjudicataria formal, atribuyendo el control real del negocio a Víctor de Aldama. Todo ello es objeto de investigación judicial sin que se haya declarado responsabilidad penal: rige la presunción de inocencia."
    sources:
      - "https://www.elconfidencial.com/espana/2024-02-23/soluciones-gestion-empresa-fantasma-mascarillas_3834567/"
      - "https://www.publico.es/politica/mascarillas-trama-koldo-53-millones-contratos-empresa-sin-actividad.html"
  - entity_id: "Court:tribunal-supremo"
    name: "Tribunal Supremo"
    updated: "2026-05-31"
    resumen: "El Tribunal Supremo es el órgano jurisdiccional superior de España en todos los órdenes salvo lo relativo a garantías constitucionales. En estas tramas resulta competente por la condición de aforados de varios investigados: su Sala Segunda (de lo Penal) ha asumido la instrucción y, en su caso, el enjuiciamiento de las piezas que afectan a José Luis Ábalos y Santos Cerdán, y ha tomado declaración a testigos e investigados como Isabel Pardo de Vera. Es un órgano del Estado, no una parte investigada."
    sources:
      - "https://www.atlantico.net/espana/pardo-vera-declara-supremo-caso_1_20260413-4233789.html"
      - "https://www.poderjudicial.es/cgpj/es/Poder-Judicial/Tribunal-Supremo/"
  - entity_id: "Organization:universidad-complutense-de-madrid"
    name: "Universidad Complutense de Madrid"
    updated: "2026-05-31"
    resumen: "La Universidad Complutense de Madrid es la mayor universidad presencial de España y un organismo público. Figura en la causa instruida por el juez Juan Carlos Peinado (Juzgado de Instrucción nº 41 de Madrid) porque en ella Begoña Gómez, esposa del presidente Pedro Sánchez, codirigía la cátedra extraordinaria 'Transformación Social Competitiva' (constituida en octubre de 2020 y no renovada en 2024) y un máster. La instrucción investiga el software/plataforma digital ('Transforma TSC') desarrollado en el contexto de la cátedra con financiación vinculada a la UCM (por importe superior a 100.000 euros; la UCM reclama unos 113.000 euros) y registrado a nombre de Gómez, así como presuntas adjudicaciones 'premeditadas' (mencionándose contratos con Deloitte) y las cartas de apoyo que Gómez firmó como codirectora. La UCM se ha personado como acusación y ha aportado documentación al juzgado. Informes de la UCO de mayo de 2026 concluyeron que la creación de la cátedra se ajustó a la normativa universitaria, pero cuestionan el software. Rige la presunción de inocencia para todas las personas investigadas, sin que ello prejuzgue responsabilidad alguna de la institución."
    sources:
      - "https://es.wikipedia.org/wiki/Caso_Bego%C3%B1a_G%C3%B3mez"
      - "https://es.euronews.com/my-europe/2026/05/25/uco-irregularidades-catedra-begona-gomez-cuestiona-software"
      - "https://okdiario.com/espana/uco-concluye-que-begona-gomez-registro-nombre-web-marca-del-software-pagado-complutense-17145958"
  - entity_id: "Person:delcy-rodriguez"
    name: "Delcy Rodríguez"
    updated: "2026-05-31"
    resumen: "Delcy Eloína Rodríguez Gómez (n. 18 de mayo de 1969) es una abogada, diplomática y política venezolana. Fue vicepresidenta de Venezuela bajo Nicolás Maduro de 2018 a 2026 y, tras la captura de Maduro a comienzos de enero de 2026, asumió como presidenta encargada de Venezuela, siendo la primera mujer en ejercer ese cargo en el país. Es central en el episodio conocido como 'Delcygate': en la madrugada del 20 de enero de 2020 aterrizó en el aeropuerto de Madrid-Barajas y se produjo un encuentro con el entonces ministro de Transportes José Luis Ábalos (acompañado de su asesor Koldo García y del empresario Víctor de Aldama), pese a tener prohibida la entrada en el espacio Schengen desde 2018 por sanciones de la UE. El Tribunal Supremo determinó en noviembre de 2020 que pisó territorio español en violación de las sanciones, pero archivó la responsabilidad penal de Ábalos. El episodio reaparece en el caso Koldo/Ábalos y en indagaciones sobre negocios vinculados a Venezuela (oro; una sociedad en Ginebra atribuida a Rodríguez junto a Aldama según grabaciones de la UCO). No consta que Delcy Rodríguez esté imputada por la justicia española; rige la presunción de inocencia para las personas implicadas."
    sources:
      - "https://es.wikipedia.org/wiki/Delcy_Rodr%C3%ADguez"
      - "https://en.wikipedia.org/wiki/Delcy_Rodr%C3%ADguez"
      - "https://www.cronista.com/espana/politica-es/delcygate-en-espana-los-contactos-de-delcy-rodriguez-sucesora-de-maduro-con-el-sanchismo/"
  - entity_id: "Person:david-sanchez"
    name: "David Sánchez"
    updated: "2026-07-14"
    resumen: "David Sánchez Pérez-Castejón es músico (compositor) y hermano del presidente del Gobierno, Pedro Sánchez. El 14 de julio de 2026, la Sección Primera de la Audiencia Provincial de Badajoz lo condenó (sentencia 152/2026) como cooperador necesario de un delito de prevaricación administrativa a 9 años de inhabilitación especial para empleo o cargo público, junto a otros diez condenados —entre ellos el expresidente de la Diputación de Badajoz Miguel Ángel Gallardo—, y lo absolvió del tráfico de influencias. El tribunal declara probado que en 2016 la Diputación creó el puesto de coordinador de actividades de los conservatorios 'con el objetivo de que el mismo fuera ocupado' por él, que el proceso selectivo se ajustó a su perfil ('el hermanísimo', le llamaban ya antes de publicarse las bases) y que en 2022 el puesto se transformó en la jefatura de la Oficina de Artes Escénicas disfrazando de cambio de nomenclatura la creación de un puesto nuevo; no declara probada, en cambio, presión o influencia del entorno del presidente del Gobierno, de ahí la absolución del tráfico de influencias. El Ministerio Fiscal no formuló acusación (pidió el sobreseimiento); la acusación la sostuvieron siete acusaciones populares (Manos Limpias, Vox, Abogados Cristianos, HazteOír, Liberum, Iustitia Europa y el PP). La sentencia NO es firme: cabe recurso de apelación ante el TSJ de Extremadura y rige la presunción de inocencia."
    sources:
      - "https://theobjective.com/espana/tribunales/2026-07-14/david-sanchez-condenado-nueve-anos-inhabilitacion-prevaricacion/"
      - "https://www.elindependiente.com/espana/2026/05/24/hermano-pedro-sanchez-tres-anos-carcel/"
      - "https://www.eldiario.es/extremadura/politica/david-sanchez-banquillo-guia-seguir-juicio-hermano-presidente_1_13249954.html"
      - "https://www.infobae.com/espana/2026/05/28/comienza-el-juicio-a-david-sanchez-el-hermanito-musico-de-pedro-sanchez-las-acusaciones-piden-carcel-y-la-fiscalia-no-ve-nada/"
  - entity_id: "Company:innova-next-slu"
    name: "Innova Next SLU"
    updated: "2026-05-31"
    resumen: "Innova Next SLU es una empresa de consultoría tecnológica vinculada al empresario aragonés Juan Carlos Barrabés. Figura en la causa del juez Peinado sobre Begoña Gómez porque formó una UTE con la sociedad The Valley (Digital Business School) que se benefició de adjudicaciones públicas (incluida una de en torno a 5,8 millones durante la pandemia); en conjunto, las empresas de Barrabés habrían recibido alrededor de 15,6 millones en contratos públicos de varios ministerios. La instrucción investiga si las cartas de apoyo firmadas por Begoña Gómez como codirectora de la cátedra de la UCM sirvieron para favorecer esas ofertas; un informe de la Intervención General del Estado (IGAE) elaborado para la Fiscalía Europea calificó algunos contratos de Red.es de presuntamente 'injustos', 'ilegales' y 'arbitrarios' y advirtió de posible 'fraude de ley'. Tanto Barrabés como Gómez defienden la legalidad de la relación y rige la presunción de inocencia."
    sources:
      - "https://es.wikipedia.org/wiki/Caso_Bego%C3%B1a_G%C3%B3mez"
      - "https://www.elespanol.com/espana/tribunales/20250929/intervencion-dice-contratos-barrabes-begona-gomez-apoyo-pudieron-incurrir-fraude-ley/1003743946044_0.html"
      - "https://www.vozpopuli.com/tribunales/la-uco-revela-que-begona-gomez-mantuvo-actividad-comercial-en-la-empresa-de-su-catedra-hasta-que-fue-imputada.html"
  - entity_id: "Person:maria-cristina-alvarez-rodriguez"
    name: "María Cristina Álvarez Rodríguez"
    updated: "2026-08-03"
    resumen: "María Cristina Álvarez Rodríguez es la asesora de Begoña Gómez adscrita al Gabinete de la Presidencia del Gobierno (Moncloa). Está investigada por el juez Peinado en el caso Begoña Gómez por un presunto delito de malversación de caudales públicos, al sospecharse que, cobrando un sueldo público, dedicó tiempo y medios a gestiones privadas de la esposa del presidente vinculadas a la cátedra y el máster de la UCM. El juez propuso juicio con jurado y la citó, junto a Begoña Gómez y al empresario Juan Carlos Barrabés, a la audiencia previa convocada para el 9 de junio de 2026. El auto de la Sección 23 de la Audiencia Provincial de Madrid de 16 de julio de 2026 limitó el juicio con jurado a los presuntos delitos de tráfico de influencias y malversación. El 28 de julio de 2026 la Fiscalía comunicó al juzgado que no formulará acusación contra ella ni contra Begoña Gómez y que presentará un escrito de conclusiones absolutorias; la acusación popular unificada solicita para ella 6 años como presunta cooperadora necesaria de malversación, y la UCM, sin formular acusación penal, le reclama solidariamente una indemnización civil en caso de condena. Tanto ella como Gómez sostienen que sus funciones eran legítimas; rige la presunción de inocencia mientras no exista sentencia."
    sources:
      - "https://www.elespanol.com/espana/tribunales/20260526/peinado-convoca-begona-gomez-cristina-alvarez-barrabes-audiencia-previa-juicio-jurado-junio/1003744259845_0.html"
      - "https://www.eldiario.es/politica/audiencia-provincial-avala-juez-peinado-imputase-begona-gomez-asistente-malversacion_1_12859563.html"
      - "https://es.wikipedia.org/wiki/Caso_Bego%C3%B1a_G%C3%B3mez"
  - entity_id: "Company:whathefav-sl"
    name: "Whathefav SL"
    updated: "2026-05-31"
    resumen: "Whathefav SL es una agencia de comunicación/marketing administrada por Alba y Laura Rodríguez Espinosa, hijas del expresidente José Luis Rodríguez Zapatero (fundada por Laura en 2019). En la instrucción del 'caso Plus Ultra' (diligencias previas 77/2024, instruidas por el juez José Luis Calama en la Audiencia Nacional), la UDEF la describe como 'elemento finalista' y 'centro de redistribución de flujos económicos' de la presunta trama. Según los informes policiales, la sociedad habría recibido más de 985.000 euros de empresas vinculadas al entorno de Zapatero, entre ellas unos 239.755 euros desde Análisis Relevante SL y la mayor parte (unos 561.440 euros) desde Inteligencia Prospectiva; la UDEF sostiene que habría emitido facturación 'ad hoc' para dar cobertura formal a movimientos. Las caracterizaciones proceden de una instrucción en curso. No existe sentencia ni culpabilidad probada; la sociedad, sus administradoras y Zapatero están amparados por la presunción de inocencia."
    sources:
      - "https://www.elindependiente.com/espana/2026/05/25/la-udef-pone-el-foco-en-whathefav-la-sociedad-de-las-hijas-de-zapatero-elemento-finalista-de-la-trama-de-corrupcion/"
      - "https://www.infobae.com/espana/2026/05/26/la-udef-sostiene-que-las-hijas-de-zapatero-usaron-su-empresa-whathefav-para-ocultar-pagos-de-la-trama-plus-ultra-mediante-facturas-falsas/"
      - "https://www.infobae.com/espana/2026/05/24/quien-es-quien-en-el-caso-plus-ultra-un-entramado-de-empresarios-politicos-y-sociedades-que-coloca-en-el-centro-de-la-investigacion-a-zapatero/"
  - entity_id: "Company:softgestor"
    name: "Softgestor"
    updated: "2026-05-31"
    resumen: "Softgestor es una sociedad mercantil identificada en la instrucción del 'caso Plus Ultra' (DP 77/2024, juez Calama, Audiencia Nacional) como pieza del presunto entramado financiero vinculado a Análisis Relevante SL y a Plus Ultra. Según el sumario, estaba formalmente administrada por Carlos Alberto Parra Delgado, pero los investigadores atribuyen su control real al empresario venezolano Francisco Enrique Flores Suárez, que la habría manejado 'desde la sombra'. Desde Softgestor se habrían transferido fondos a entidades del entorno de Zapatero, incluidos pagos a Análisis Relevante (en torno a 145.200 euros, y otras cantidades) por informes que el juez considera presuntamente simulados y que podrían encubrir comisiones. No hay delito probado y se mantiene la presunción de inocencia; la investigación sigue abierta sin sentencia."
    sources:
      - "https://www.infobae.com/espana/2026/05/25/los-hermanos-amaro-chacon-y-francisco-flores-quienes-son-los-empresarios-venezolanos-vinculados-al-entorno-de-zapatero-en-el-caso-plus-ultra/"
      - "https://www.elindependiente.com/espana/2026/05/25/la-udef-pone-el-foco-en-whathefav-la-sociedad-de-las-hijas-de-zapatero-elemento-finalista-de-la-trama-de-corrupcion/"
