      - "https://www.eldiario.es/politica/juez-rechaza-archivar-caso-begona-gomez-e-insiste-juzgue-jurado-popular_1_13199724.html"
      - "https://www.eldebate.com/espana/20260506/juez-peinado-mantiene-procesamiento-begona-juicio-jurado_414693.html"
  - entity_id: "Organization:psoe"
    name: "PSOE"
    updated: "2026-05-31"
    resumen: "El PSOE es el principal partido de la izquierda española y sostiene al Gobierno de Pedro Sánchez. Aparece de forma transversal en las causas del entorno (caso Koldo/mascarillas, trama Cerdán-Servinabar) porque varios investigados ocuparon cargos orgánicos en el partido, señaladamente la Secretaría de Organización (José Luis Ábalos y, después, Santos Cerdán, quien dimitió en 2025 y entró en prisión provisional), ambos investigados judicialmente. La mención del partido en informes y diligencias no equivale a imputación del PSOE como organización; rige la presunción de inocencia respecto a las personas investigadas."
    sources:
      - "https://es.wikipedia.org/wiki/Partido_Socialista_Obrero_Espa%C3%B1ol"
      - "https://www.psoe.es/"
  - entity_id: "Company:acciona"
    name: "Acciona"
    updated: "2026-05-31"
    resumen: "Acciona es una de las mayores constructoras y desarrolladoras de infraestructuras de España, presente en más de 60 países. En la causa que investiga la presunta trama de adjudicaciones ligada a Santos Cerdán, los informes de la UCO de la Guardia Civil examinan obras públicas (ferroviarias y de carreteras) adjudicadas a UTEs en las que participaba Acciona junto a la mercantil Servinabar 2000, S.L.; según la UCO, Servinabar habría percibido en torno al 2% de lo facturado por Acciona en esas obras en UTE (p. ej. tres obras por unos 245,9 millones de euros, autopista en Logroño, puente en Sevilla y tren de Sant Feliú). La sociedad no consta, a fecha de los hechos públicos, acusada ni condenada, por lo que rige la presunción de inocencia. La aparición frecuente como 'UTE Acciona-Servinabar' explica su alto grado en el grafo."
    sources:
      - "https://es.wikipedia.org/wiki/Acciona"
      - "https://www.acciona.com/"
      - "https://www.eldiario.es/politica/son-adjudicaciones-alianza-acciona-empresa-vinculada-cerdan-lupa-justicia_1_12779315.html"
  - entity_id: "Organization:adif"
    name: "ADIF"
    updated: "2026-05-31"
    resumen: "ADIF es la entidad pública empresarial que gestiona y licita gran parte de la infraestructura ferroviaria de España, incluida la alta velocidad. Aparece en la investigación de la trama Koldo-Ábalos-Cerdán porque varias de las adjudicaciones de obra presuntamente amañadas, según los informes de la UCO, corresponderían a contratos licitados por ADIF y otras administraciones; según ESdiario (19-11-2025), que cita un informe de la UCO, parte de los presuntos pagos ilícitos se vincularían a adjudicaciones de Acciona y ADIF (p. ej. obras del soterramiento ferroviario de Murcia y el corredor de alta velocidad Murcia-Almería). Ser el órgano de contratación no implica responsabilidad penal de ADIF, y rige la presunción de inocencia respecto de las personas físicas investigadas. Su peso en la causa deriva de su papel como adjudicador recurrente."
    sources:
      - "https://es.wikipedia.org/wiki/Administrador_de_Infraestructuras_Ferroviarias"
      - "https://www.adif.es/"
      - "https://www.esdiario.com/nacional/251119/172665/uco-reafirma-pago-550-000-euros-comisiones-obras-ave-murcia-caso-koldo.html"
  - entity_id: "Person:jose-luis-rodriguez-zapatero"
    name: "José Luis Rodríguez Zapatero"
    updated: "2026-05-31"
    resumen: "José Luis Rodríguez Zapatero fue presidente del Gobierno de España entre 2004 y 2011 y secretario general del PSOE (2000-2012). En mayo de 2026, tras levantar el secreto de las actuaciones el 19 de mayo, el juez José Luis Calama (Juzgado Central de Instrucción nº 4 de la Audiencia Nacional, Diligencias Previas 77/2024) lo citó a declarar como investigado (imputado) en el caso Plus Ultra; la comparecencia, prevista inicialmente para el 2 de junio, se aplazó a petición de su defensa al 17 y 18 de junio de 2026. La causa indaga el rescate de 53 millones de euros concedido por la SEPI en 2021 a la aerolínea Plus Ultra dentro del fondo de apoyo a la solvencia de empresas estratégicas de la pandemia. En un auto de unas 85 páginas, el instructor le atribuye presuntos delitos de organización criminal, tráfico de influencias y falsedad documental, con posible extensión al blanqueo de capitales, y lo sitúa como presunto 'núcleo de decisión y estrategia' de una estructura estable y jerarquizada orientada a obtener decisiones administrativas favorables para la aerolínea. Según la tesis policial (UDEF), él y su entorno habrían percibido en torno a 1,95 millones de euros (unos 1,52 millones el expresidente y 423.779 euros sus hijas Laura y Alba, a través de la sociedad Whathefav S.L.); el sumario no recoge mensajes directos suyos, pero sí conversaciones interceptadas que, para el instructor, apuntan a su liderazgo. Rige plenamente la presunción de inocencia: se trata de una instrucción en curso, sin juicio ni condena, y el expresidente niega cualquier irregularidad, sostiene que jamás hizo gestión alguna sobre el rescate y que su trabajo de asesoramiento (para la consultora Análisis Relevante, de Julio Martínez Martínez) fue legal. En la misma causa figura como investigado distinto el propio Julio Martínez Martínez, empresario alicantino y amigo personal del expresidente, persona diferente de él. El alto grado de Zapatero en el grafo refleja su centralidad en esta causa y su prominencia política."
    sources:
