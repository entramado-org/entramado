  - entity_id: "Person:julian-exposito-talavera"
    name: "Julián Expósito Talavera"
    updated: "2026-07-15"
    resumen: "Julián Expósito Talavera fue director del Área de Presidencia y Relaciones Institucionales de la Diputación de Badajoz entre 2017 y 2025 y en la actualidad es letrado del Organismo Autónomo de Recaudación (OAR) de la propia Diputación. La sentencia 152/2026 de la Audiencia Provincial de Badajoz lo describe como 'persona muy próxima' al entonces presidente Miguel Ángel Gallardo y recoge su intervención en la tramitación de los puestos ocupados por David Sánchez; declaró como testigo en el juicio, donde defendió que el cambio contractual de 2022 fue una modificación de un puesto ya existente y no la creación de uno nuevo. No fue acusado ni condenado en la causa; rige la presunción de inocencia."
    sources:
      - "https://www.laportadadeextremadura.com/badajoz/badajoz-ciudad/exdirector-presidencia-diputacion-defiende-modificacion-contractual-david-sanchez_5599_102.html"
      - "https://dip-badajoz.es/diputacion/organigrama/getDetallePersona.php?id=jexpositot.oar"
      - "https://www.esdiario.com/nacional/260602/189358/testigos-diputacion-justifican-cambios-puesto-david-sanchez.html"
  - entity_id: "Person:ismael-moreno"
    name: "Ismael Moreno"
    updated: "2026-07-23"
    resumen: "Ismael Moreno Chamarro es magistrado titular del Juzgado Central de Instrucción nº 2 de la Audiencia Nacional, uno de los instructores más veteranos del órgano. En julio de 2024 el Tribunal Supremo le asignó la competencia para investigar las presuntas irregularidades en los contratos de mascarillas durante la pandemia (pieza principal del caso Koldo en la Audiencia Nacional), y desde entonces instruye también sus piezas derivadas: la de presuntos amaños de obra pública (14 imputados, entre ellos el exdirector general de Carreteras) y la de las contrataciones de Jésica Rodríguez en Ineco y Tragsatec (citaciones de julio de 2026). El 22 de julio de 2026 dirigió un auto a cinco entidades bancarias reclamando información sobre cuentas del entorno familiar de Santos Cerdán, según el teletipo de EFE. Es el órgano instructor de la causa: no es parte investigada ni acusada. Las personas que cita o imputa están amparadas por la presunción de inocencia."
    sources:
      - "https://www.infobae.com/espana/2024/07/28/quien-es-ismael-moreno-el-juez-encargado-de-investigar-el-caso-koldo-de-policia-en-el-franquismo-a-magistrado-de-la-audiencia-nacional/"
      - "https://www.eldebate.com/espana/20240223/caso-koldo-recae-juez-veterano-audiencia-nacional-conocido-alargar-instrucciones_176707.html"
      - "https://www.elindependiente.com/espana/2026/05/12/el-juez-ismael-moreno-rechaza-archivar-la-investigacion-a-koldo-por-las-mascarillas-de-baleares-y-canarias/"
  - entity_id: "Person:cristina-narbona"
    name: "Cristina Narbona"
    updated: "2026-07-23"
    resumen: "Cristina Narbona Ruiz (Madrid, 1951) es presidenta del PSOE desde 2017, eurodiputada y exministra de Medio Ambiente (2004-2008). Aparece en el grafo únicamente por el caso Leire, y siempre en condición de TESTIGO, no de investigada: citada a instancias de la Fiscalía Anticorrupción, declaró el 15 de julio de 2026 ante el juez Santiago Pedraz (Audiencia Nacional, DP 150/2025), donde admitió haber tenido contacto con Leire Díez y haberla remitido a Santos Cerdán, quien según su declaración le comunicó que la información era «intrascendente» (la citación inicial del 10 de julio se aplazó). El 22 de julio de 2026 compareció ante la Comisión de Investigación del caso Koldo en el Senado, donde negó ser la «madrina» de Leire Díez en el partido. No está investigada en ninguna causa; rige la presunción de inocencia."
    sources:
      - "https://www.eldiario.es/politica/narbona-abre-puerta-psoe-querelle-leire-diez-decision-adoptaremos-momento_1_13398216.html"
