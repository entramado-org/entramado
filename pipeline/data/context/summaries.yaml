  - entity_id: "LegalCase:adenda-al-convenio-trilateral"
    name: "Adenda al Convenio Trilateral"
    updated: "2026-06-01"
    resumen: "Es una adenda/convenio administrativo en el contexto de la colaboración entre Red.es (entidad pública adscrita al Ministerio de Economía y Empresa) y la Junta de Andalucía para impulsar la continuidad asistencial mediante la transformación digital de los servicios sociales en Andalucía. El convenio original se publicó por Resolución de 26 de marzo de 2019 de la Subsecretaría (BOE-A-2019-5410, BOE de 10 de abril de 2019); la adenda propiamente dicha que prorrogó el convenio se publicó por Resolución de 1 de abril de 2022 de Red.es (BOE-A-2022-6435). Es un instrumento contractual-administrativo, no una causa judicial autónoma; figura en la documentación de convenios y adjudicaciones de Red.es analizada en la investigación, con presunción de inocencia y sin que conste por sí misma como objeto de imputación penal."
