summaries:
  - entity_id: "Person:begona-gomez"
    name: "Begoña Gómez"
    updated: "2026-08-03"
    resumen: "María Begoña Gómez Fernández (n. 1971) es la esposa de Pedro Sánchez, presidente del Gobierno de España. Profesionalmente fue directiva del Grupo Inmark, directora del Africa Center del Instituto de Empresa (2018-2022) y codirectora de la Cátedra Extraordinaria de Transformación Social Competitiva de la Universidad Complutense de Madrid y de un máster asociado, hasta 2024. Nunca ha ostentado cargo público. Está investigada en la causa instruida por el juez Juan Carlos Peinado en el Juzgado de Instrucción nº 41 de Madrid, abierta el 24 de abril de 2024 a raíz de una denuncia de la asociación Manos Limpias. A lo largo de la instrucción se le atribuyeron presuntos delitos de tráfico de influencias, corrupción en los negocios, malversación, apropiación indebida e intrusismo, en relación con su actividad vinculada a la Complutense y con contactos empresariales. En 2026 el juez cerró la fase de instrucción y propuso enviarla a juicio con jurado popular por cuatro presuntos delitos (corrupción en los negocios, malversación, tráfico de influencias y apropiación indebida), descartando el de intrusismo. El auto de la Sección 23 de la Audiencia Provincial de Madrid de 16 de julio de 2026 limitó el juicio con jurado a los presuntos delitos de tráfico de influencias y malversación. El 28 de julio de 2026 la Fiscalía comunicó al juzgado que no formulará escrito de conclusiones en sentido acusatorio contra ella ni contra su asesora Cristina Álvarez y que presentará un escrito de conclusiones absolutorias; la acusación la sostiene la acusación popular unificada (13 años de prisión solicitados, rebajados desde 24), y la UCM, sin formular acusación penal, reclama como perjudicada una indemnización civil en caso de condena. El juicio está pendiente de señalamiento. Rige plenamente la presunción de inocencia: no hay condena y la defensa niega los hechos. Su elevado grado en el grafo refleja su centralidad documental, no responsabilidad penal acreditada."
    sources:
      - "https://es.wikipedia.org/wiki/Caso_Bego%C3%B1a_G%C3%B3mez"
