  - entity_id: "Person:luis-antonio-martin-bernardos"
    name: "Luis Antonio Martín Bernardos"
    updated: "2026-05-31"
    resumen: "Luis Antonio Martín Bernardos fue administrador (solidario) de Innova Next SL —la sociedad del empresario Juan Carlos Barrabés que concentró alrededor del 91,7% del dinero público adjudicado al grupo Barrabés— cargo que ejerció hasta 2022. En la órbita del caso Begoña Gómez ha intervenido como testigo (no investigado): declaró ante el juez Peinado que trabajó con Begoña Gómez en torno a dos proyectos (incluido el desarrollo de software para una plataforma) y que su relación con ella fue limitada. Las acusaciones populares han cuestionado su testimonio al sospechar vínculos empresariales con Barrabés. Rige plena presunción de inocencia: no consta imputado."
    sources:
      - "https://www.elespanol.com/espana/tribunales/20260518/escassi-rosauro-varo-joaquin-goyache-lista-testigos-pide-begona-gomez-juicio/1003744249966_0.html"
      - "https://www.cronista.com/espana/actualidad-es/un-testigo-clave-en-la-causa-de-begona-gomez-declaro-que-se-reunio-dos-veces-con-pedro-sanchez-en-la-moncloa/"
      - "https://www.empresia.es/persona/martin-bernardos-luis-antonio/"
  - entity_id: "Person:santiago-fernandez-lena"
    name: "Santiago Fernández Lena"
    updated: "2026-05-31"
    resumen: "Santiago Fernández Lena es un abogado mercantilista que durante más de una década ejerció como secretario externo de la aerolínea Plus Ultra y pasó a ser secretario de su consejo de administración; fue socio del despacho Andersen, que abandonó el 30 de noviembre de 2025, 11 días antes del registro de su domicilio del 11 de diciembre. En el caso Plus Ultra/Zapatero figura como investigado: la UDEF lo relaciona con el entorno de José Luis Rodríguez Zapatero y con Caletón Consultores SL —sociedad descrita como instrumental, administrada por un testaferro, a la que Plus Ultra habría pagado en torno a 1,16 millones de euros (2020-2025) justificados como 'comisiones'—, según conversaciones atribuidas a Fernández Lena y a Julio Martínez. En el registro de su domicilio la UDEF halló 31.670 euros (y 655 dólares) en efectivo ocultos en una caja de zapatos. Todo bajo presunción de inocencia: es una causa en instrucción, sin condena."
    sources:
      - "https://www.vozpopuli.com/tribunales/el-abogado-de-plus-ultra-imputado-escondia-31000-euros-en-efectivo-en-una-caja-de-zapatos.html"
      - "https://www.vozpopuli.com/economia/el-abogado-de-plus-ultra-dejo-el-despacho-adersen-dias-antes-de-la-detencion-para-centrarse-en-la-defensa.html"
      - "https://okdiario.com/investigacion/udef-registro-casa-del-financiero-plus-ultra-investiga-abogado-del-presidente-16159926"
