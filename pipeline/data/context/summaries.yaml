  - entity_id: "Person:fernando-grande-marlaska"
    name: "Fernando Grande-Marlaska"
    updated: "2026-07-14"
    resumen: "Ministro del Interior desde 2018 en los gobiernos de Pedro Sánchez, magistrado de carrera y exjuez de la Audiencia Nacional. Compareció ante la comisión Koldo del Senado el 30-jun-2026, en relación con las reuniones de la entonces directora de la Guardia Civil, Mercedes González, con la exmilitante socialista Leire Díez. Declaró que González le informó de que una persona buscaba la 'rehabilitación' del comandante Rubén Villalba, investigado en el caso Koldo, aunque dijo no recordar si le mencionó el nombre de Díez o solo 'una persona del PSOE'. Aseguró no conocer a Leire Díez ni haber hablado con ella, negó que en esos encuentros se hablara de trama alguna contra la UCO y expresó su confianza en González. No consta que esté investigado en ninguna de las causas."
    sources:
      - "https://www.elindependiente.com/espana/2026/06/30/marlaska-se-distancia-de-la-directora-de-la-guardia-civil-y-dice-que-no-recuerda-si-le-dijo-que-se-reunio-con-leire-diez-o-con-una-persona-del-psoe/"
      - "https://www.deia.eus/politica/2026/06/30/marlaska-asegura-directora-guardia-civil-senado-leire-diez-11269047.html"
      - "https://www.publico.es/politica/pp-cita-marlaska-peramato-senado-expliquen-reuniones-leire-diez.html"
  - entity_id: "Person:jesus-maria-gomez-martin"
    name: "Jesús María Gómez Martín"
    updated: "2026-07-14"
    resumen: "Comisario de la Policía Nacional conocido en prensa como 'el comisario del Delcygate' por dirigir la comisaría de Barajas durante la escala de Delcy Rodríguez en enero de 2020; posteriormente fue ascendido a jefe superior de Policía de Canarias, cargo que mantiene. Compareció ante la comisión de investigación del Senado sobre la SEPI el 29-jun-2026, por el rescate de la aerolínea Plus Ultra. Negó rotundamente haber recibido pagos o gratificaciones de la presunta trama ('ni 7.000 euros, ni 70.000, ni 700 millones'). Admitió que Julio 'Julito' Martínez, a quien los investigadores del caso Plus Ultra consideran presunto testaferro de Zapatero, pasaba por su despacho de Barajas a tomar café, coincidiendo con los viajes de este a Venezuela. Según prensa su nombre figura en el sumario que instruye el juez Calama, pero él sostiene que no está formalmente investigado ni imputado; rige la presunción de inocencia."
    sources:
      - "https://www.libertaddigital.com/espana/2026-06-29/el-excomisario-de-barajas-niega-pagos-de-la-trama-plus-ultra-a-mi-nadie-me-ha-dado-dinero-7428516/"
