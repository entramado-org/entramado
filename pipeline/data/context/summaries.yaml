      - "https://theobjective.com/espana/tribunales/2026-05-29/udef-testaferro-zapatero-caracas-plus-ultra/"
  - entity_id: "Organization:bar-franky"  # re-key 2026-07-10: el nodo Person se fusionó en el canónico Organization (merges.yaml)
    name: "Bar Franky"
    updated: "2026-07-10"
    resumen: "'Bar Franky' (alias 'Franky') es un bar/restaurante de Pamplona —un establecimiento, no una persona—. Según la investigación del caso Koldo, su asesor fiscal/contable Miguel Moreno Purroy reconoció ante el juez haber emitido entre 2016 y 2018 facturas falsas (por un total inferior a 8.000 euros) a nombre de Acciona y de la UTE Recajo —en la que Acciona participaba— sin servicios reales: él inventaba los conceptos y Koldo García indicaba los importes. El dinero entraba en la cuenta del bar y luego se entregaba en efectivo a Koldo García o a su entonces pareja, Patricia Úriz. Moreno Purroy declaró que accedió porque Koldo le dijo que atravesaba un momento económico difícil, negando ser parte de una trama. Todo ello son indicios bajo investigación y presunción de inocencia, sin condena."
    sources:
      - "https://theobjective.com/espana/tribunales/2026-05-13/franky-facturas-falsas-koldo-acciona/"
      - "https://www.elespanol.com/espana/politica/20260303/asesor-fiscal-bar-franky-pamplona-admite-emitio-facturas-falsas-acciona-favor-koldo-garcia/1003744153848_0.html"
      - "https://www.elindependiente.com/espana/2026/03/03/koldo-garcia-ordeno-facturas-falsas-restaurante-franky-nombre-acciona-segun-asesor-fiscal/"
  - entity_id: "Person:ana-isabel-meras-santiago"
    name: "Ana Isabel Meras Santiago"
    updated: "2026-05-31"
    resumen: "Ana Isabel Meras Santiago es la Letrada de la Administración de Justicia (antigua secretaria judicial) del Tribunal Central de Instancia, Plaza número 2, de Madrid. Su nombre figura en el auto del caso Plus Ultra (auto-zapatero) en las Diligencias Previas 77/2024; el auto la identifica explícitamente como 'Letrada de la Administración de Justicia' y firmante de la resolución, en un órgano descrito como Tribunal Central de Instancia, Plaza número 2 (auto fechado el 18 de mayo de 2026). Su aparición es estrictamente funcional: como fedataria pública da fe de las actuaciones procesales, no es parte investigada ni tiene papel material en los hechos. No se le atribuye ninguna conducta ilícita; es personal de la Administración de Justicia."
    sources:
      - "https://www.infobae.com/espana/2026/05/24/cronologia-del-caso-zapatero-de-los-primeros-contactos-para-tocar-puertas-al-rescate-de-53-millones-a-plus-ultra/"
      - "https://www.mundiario.com/articulo/politica/causa-zapatero-anatomia-auto-judicial-mas-relevante-democracia/20260523214015387663.html"
  - entity_id: "Organization:otri"
    name: "OTRI"
    updated: "2026-05-31"
    resumen: "OTRI son las siglas de 'Oficina de Transferencia de Resultados de Investigación' (hoy también denominada Oficina de Transferencia de Conocimiento) de la Universidad Complutense de Madrid, la unidad encargada de gestionar la propiedad intelectual e industrial y el registro de los resultados generados en la universidad. Aparece en la causa de Begoña Gómez instruida por el juez Peinado: según la instrucción y testigos vinculados a la universidad, el software/plataforma desarrollado para la Cátedra de Transformación Social Competitiva debía registrarse a través de la OTRI por pertenecer a la UCM; la OTRI facilitó información y enlaces sobre el registro y advirtió de que la titularidad correspondía a la universidad, pero el procedimiento no se habría completado. Según el juez, al conocer la cesión de derechos a favor de la UCM se habría cortado la comunicación con la oficina encargada del registro y registrado privadamente dominio/marca. La OTRI actúa como organismo perjudicado/testigo, no como investigada. El nodo se refiere a la OTRI de la Universidad Complutense de Madrid."
    sources:
      - "https://www.ucm.es/otri/quienes-somos-"
      - "https://www.libertaddigital.com/espana/politica/2026-04-26/la-prueba-que-acorrala-a-begona-gomez-en-el-software-eludio-el-registro-del-programa-en-la-complutense-1b-7394002/"
      - "https://www.eldebate.com/espana/20250925/juez-peinado-encarga-uco-investigue-adjudicacion-software-begona-gomez-mails-complutense_338120.html"
  - entity_id: "Person:ignacio-espejo-saavedra-hernandez"
    name: "Ignacio Espejo-Saavedra Hernández"
    updated: "2026-05-31"
    resumen: "Ignacio Espejo-Saavedra Hernández desarrolla su carrera en Red.es desde 2005, donde ha sido letrado, subdirector de Asesoría Jurídica y vicesecretario general y del Consejo, según la propia web de Red.es. Consta en el Portal de Contratación del Estado como presidente de una mesa de contratación de Red.es y firma documentación contractual del organismo (marzo de 2021). Red.es adjudicó en 2021 a la UTE Innova Next-The Valley Digital Business contratos por más de 10,9 millones de euros, que un informe pericial de la IGAE para la Fiscalía Europea considera presunto 'fraude de ley' y que se investigan en el marco del caso Begoña Gómez, conexo al entorno del caso Koldo. No se ha podido confirmar con fuente fiable la atribución concreta de que presidiera precisamente la mesa que valoró esa UTE ni que el contrato se adjudicara 'pese a no presentar la mejor oferta económica'; esos extremos se dejan como no verificados. No consta que esté imputado y rige la presunción de inocencia. Las variantes 'Espajo-Saavedra' y 'Espejo-Saaavedra' son erratas de OCR del mismo nombre."
    sources:
      - "https://www.red.es/es/organos-de-gobierno/comite-de-direccion/ignacio-espejo-saavedra-hernandez"
      - "https://contrataciondelestado.es/wps/wcm/connect/PLACE_es/Site/area/docAccCmpnt?srv=cmpnt&cmpntname=GetDocumentsById&DocumentIdParam=f79133c4-27c4-4f27-8b6c-5c886f065ec2"
  - entity_id: "Person:salvador-illa"
    name: "Salvador Illa"
    updated: "2026-05-31"
    resumen: "Salvador Illa Roca fue ministro de Sanidad entre enero de 2020 y enero de 2021, periodo de gestión de la compra centralizada de material sanitario durante la pandemia que está en el origen del 'caso Koldo' y de las auditorías sobre contratos de emergencia. Compareció en comisiones de investigación del Congreso y del Senado, donde reconoció haberse reunido una sola vez con Koldo García, en un encuentro institucional, y sostuvo que el Ministerio de Sanidad no realizó ninguna compra a la mercantil Soluciones de Gestión ('ni un euro salió para esa empresa'), aunque esta sí quedó incluida —junto a otras decenas de empresas— en un acuerdo marco de selección de material sanitario que no implicaba obligación de contratar. Desde agosto de 2024 es presidente de la Generalitat de Cataluña por el PSC. No consta que esté imputado ni investigado judicialmente en estas causas y rige plenamente la presunción de inocencia; su aparición en el grafo responde a su cargo institucional en el momento de los hechos."
    sources:
      - "https://es.wikipedia.org/wiki/Salvador_Illa"
      - "https://www.publico.es/politica/salvador-illa-desmiente-pp-comision-mascarillas-me-vi-vez-koldo-pero-sanidad-compro.html"
      - "https://web.gencat.cat/"
  - entity_id: "Person:angel-contreras"
    name: "Ángel Contreras"
    updated: "2026-05-31"
    resumen: "Ángel Contreras Marín (Torrent, Valencia, 1975) es ingeniero de caminos, canales y puertos que desarrolló su carrera en ADIF desde 2011, donde fue director general de Conservación y Mantenimiento (2018-2023) y, entre el 8 de diciembre de 2023 y septiembre de 2024, presidente de Adif y Adif Alta Velocidad, antes de ser cesado por el ministro Óscar Puente. Según el informe de la UCO de la Guardia Civil incorporado a la causa y la información publicada por la prensa, los agentes lo sitúan en relación con adjudicaciones de ADIF presuntamente direccionadas en el marco del caso Koldo: en mensajes de febrero de 2024 entre el empresario Daniel Fernández (vinculado a Obras Públicas y Regadíos, OPR) y Koldo García se alude a un 'Ángel' que los investigadores identifican con Contreras y a una obra en la que se habrían recortado 600.000 euros a OPR. Contreras reconoció una relación 'social' con Koldo y negó cualquier amaño de contratos. No consta que haya sido imputado y rige plenamente la presunción de inocencia: las fuentes lo describen como mencionado/ubicado en informes de la UCO, no como investigado, imputado ni condenado."
    sources:
      - "https://www.adif.es/w/d.-angel-contreras-marin"
      - "https://es.wikipedia.org/wiki/%C3%81ngel_Contreras"
      - "https://www.elindependiente.com/espana/tribunales/2024/05/20/la-uco-ubica-al-presidente-de-adif-en-amanos-de-la-trama-del-caso-koldo/"
  - entity_id: "Court:tribunal-central-de-instancia"
    name: "Tribunal Central de Instancia"
    updated: "2026-05-31"
    resumen: "El Tribunal Central de Instancia es el órgano judicial de ámbito nacional con sede en Madrid creado por la Ley Orgánica 1/2025, de 2 de enero, de medidas de eficiencia del Servicio Público de Justicia, que reorganizó los juzgados unipersonales en Tribunales de Instancia. Su disposición transitoria segunda fijó que el 31 de diciembre de 2025 se constituiría mediante la transformación de los antiguos Juzgados Centrales de la Audiencia Nacional en Secciones (Instrucción, Penal, Menores, Vigilancia Penitenciaria y Contencioso-administrativo). La 'Plaza número 2 de la Sección de Instrucción' equivaldría al antiguo Juzgado Central de Instrucción nº 2. Según Estrella Digital (29-09-2026), la causa de Plus Ultra (Diligencias Previas 77/2024), en la que se investiga la presunta influencia de José Luis Rodríguez Zapatero en el rescate de la aerolínea, la instruye el juez José Luis Calama, titular de la antigua plaza nº 4, desde la Plaza nº 2 de la Sección de Instrucción; en mayo de 2026 (auto de 19 de mayo) se levantó el secreto y se citó a Zapatero como investigado. Es un órgano jurisdiccional, no una persona ni parte del proceso; respecto de cualquier investigado rige la presunción de inocencia."
    sources:
      - "https://www.boe.es/buscar/act.php?id=BOE-A-2025-76"
      - "https://es.wikipedia.org/wiki/Tribunal_Central_de_Instancia"
      - "https://www.estrelladigital.es/articulo/tribunales/juez-calama-rechaza-recusacion-joyeria-yanes-planteada-zapatero-caso-plus-ultra/20260929165650451594.html"
  - entity_id: "Court:sala-de-lo-penal"
    name: "Sala de lo Penal"
    updated: "2026-05-31"
    resumen: "En los documentos analizados, 'Sala de lo Penal' designa la Sala Segunda del Tribunal Supremo, órgano competente para instruir y juzgar a aforados como José Luis Ábalos y Santos Cerdán. Tramita la Causa Especial 20775/2020, cuyo magistrado instructor es Leopoldo Puente Segura; en su marco se recibió declaración como investigado a Santos Cerdán y se acordó su prisión provisional, comunicada y sin fianza, el 30 de junio de 2025 por riesgo de destrucción de pruebas (quedó en libertad provisional el 19 de noviembre de 2025). Es un órgano jurisdiccional que ejerce función instructora y juzgadora, no una persona ni parte acusadora. Las actuaciones siguen su curso y rige plenamente la presunción de inocencia respecto de todos los investigados."
    sources:
      - "https://es.wikipedia.org/wiki/Sala_Segunda_del_Tribunal_Supremo"
      - "https://www.tribunalsupremo.es/"
      - "https://www.poderjudicial.es/cgpj/es/Poder-Judicial/Sala-de-Prensa/Archivo-de-notas-de-prensa/El-instructor-del-Tribunal-Supremo-mantiene-la-prision-provisional-de-Santos-Cerdan-al-persistir-el-riesgo-de-destruccion-de-pruebas"
  - entity_id: "Person:vicente-calzado-tellez"
    name: "Vicente Calzado Téllez"
    updated: "2026-05-31"
    resumen: "Vicente Calzado Téllez es director/gerente de EMFESA, sociedad pública del ámbito ferroviario vinculada a la estructura ferroviaria estatal (Adif/Renfe) y al Ministerio de Transportes. En el marco del caso Koldo compareció ante la comisión de investigación del Senado (mayo de 2024) y reconoció su amistad con Koldo García; defendió que el contrato de su hermano en la empresa se basó en méritos y no en esa relación. Trabajadores y publicaciones le han atribuido prácticas de nepotismo en EMFESA, allegations que él ha rechazado. La marisquería La Chalana (Madrid) figura en la investigación como punto de encuentro relacionado con la trama. Rige plenamente la presunción de inocencia: ha negado cualquier actividad ilícita, figura como persona de interés/testigo y no consta como adjudicatario de los contratos de mascarillas ni imputado por ellos. NOTA: detalles concretos no confirmados de forma independiente en este chequeo se han retirado o suavizado (préstamo de dinero y del coche por Koldo; '20% de la plantilla emparentada'; que Ábalos y Koldo 'avalaron su continuidad'; antigüedad 'desde 2011'); la ficha oficial de EMFESA citada como fuente ya no está disponible (404)."
    sources:
      - "https://theobjective.com/espana/tribunales/2024-12-28/abalos-koldo-emfesa-nepotismo/"
      - "https://www.pressdigital.es/articulo/politica/2024-05-29/4849135-director-emfesa-admite-amistad-koldo-pero-dice-contrato-hermano-meritos-no-relacion"
  - entity_id: "Organization:contratacion-del-estado"
    name: "Contratación del Estado"
    updated: "2026-05-31"
    resumen: "El nodo, con alias 'Junta Consultiva de Contratación Pública del Estado', se refiere al órgano consultivo del Estado en materia de contratación pública (adscrito al Ministerio de Hacienda), que emite informes y recomendaciones sobre la aplicación de la legislación de contratos del sector público. El rótulo genérico 'Contratación del Estado' mezcla un concepto (la contratación pública) con ese órgano concreto. Es un marco/institución administrativa, no un sujeto investigado; aparece en la documentación porque las adjudicaciones de las presuntas tramas (mascarillas, obra pública) se rigen por la normativa de contratos del sector público que esta Junta interpreta."
    sources:
      - "https://www.hacienda.gob.es/es-ES/Areas%20Tematicas/Contratacion/Junta%20Consultiva%20de%20Contratacion%20Administrativa/Paginas/Organos%20colegiados%20y%20funciones.aspx"
  - entity_id: "Organization:subsecretaria"
    name: "Subsecretaría"
    updated: "2026-05-31"
    resumen: "Los alias ('Subsecretaría de Transportes', 'subsecretaría del Ministerio de Transportes', 'Unidad temporal PRTR de la Subsecretaría') identifican el nodo con la Subsecretaría del Ministerio de Transportes, Movilidad y Agenda Urbana, órgano que asume los servicios comunes y la gestión administrativa del departamento, incluida la gestión de fondos del Plan de Recuperación (PRTR). Su relevancia en la causa deriva de que la estructura administrativa del ministerio, en la etapa de José Luis Ábalos, es el entorno donde se sitúan las adjudicaciones investigadas en el caso Koldo. Es un organismo, no un sujeto investigado en sí mismo; rige la presunción de inocencia respecto de cualquier persona vinculada."
    sources:
      - "https://www.mitma.gob.es/"
  - entity_id: "Organization:aena"
    name: "AENA"
    updated: "2026-05-31"
    resumen: "AENA (Aena S.M.E., S.A.) es el gestor de la red de aeropuertos de interes general en Espana, sociedad mercantil estatal cotizada cuya mayoria accionarial mantiene el Estado a traves de Enaire, adscrita al Ministerio de Transportes. En los documentos analizados aparece de forma instrumental: en el informe de auditoria sobre la compra de mascarillas COVID (2020) figura como destinataria de un reparto de mascarillas para el sector aereo, y se la menciona como organismo del sector dependiente del Ministerio junto a Adif, Renfe, Enaire y Puertos del Estado. No consta que AENA como entidad este imputada; su papel es el de organismo publico del sector, no de investigado. Rige la presuncion de inocencia para cualquier persona vinculada."
    sources:
      - "https://www.aena.es/"
      - "https://es.wikipedia.org/wiki/Aena"
  - entity_id: "Organization:banco-caminos"
    name: "Banco Caminos"
    updated: "2026-05-31"
    resumen: "Banco Caminos es una entidad financiera espanola con origen en 1977 ligada al Colegio de Ingenieros de Caminos, Canales y Puertos y otros colectivos profesionales; se transformo en banco en 2008 y, junto con Bancofar (Grupo Caminos), opera bajo la marca CBNK en torno a 2023. En los documentos analizados aparece de forma instrumental como entidad bancaria mencionada en el informe de la UCO sobre cuentas, transferencias y mandamientos judiciales en la causa Koldo/Abalos, asociada a un movimiento de 20.000 euros (2019). El alias generico 'Banco' es ambiguo: algunas citas se refieren en realidad a otras entidades. No consta imputacion de la entidad; rige la presuncion de inocencia."
    sources:
      - "https://www.bancocaminos.es/conocenos/asi-somos"
      - "https://cbnk.es/conocenos"
      - "https://es.wikipedia.org/wiki/Banco_Caminos"
  - entity_id: "Person:camino-arce"
    name: "Camino Arce"
    updated: "2026-05-31"
    resumen: "Camino Arce Blanco es ingeniera de Caminos que ocupo un alto cargo en la Direccion General de Carreteras del Ministerio de Transportes (Subdireccion General de Construccion) durante la etapa de Jose Luis Abalos, puesto desde el que se realizaban valoraciones tecnicas de licitaciones de obra publica; posteriormente paso a un cargo en la sociedad estatal SEITTSA. Segun el informe de la UCO se cita un contacto con Koldo Garcia, incluido el supuesto envio de la imagen de un documento por WhatsApp, en el contexto de la investigacion sobre la presunta influencia en adjudicaciones. Estos extremos estan en fase de investigacion y no implican conducta delictiva probada; rige la presuncion de inocencia."
    sources:
      - "https://www.libertaddigital.com/espana/politica/2025-06-27/oscar-puente-mantuvo-en-cargos-oficiales-a-las-dos-personas-que-exigio-koldo-para-seguir-amanando-obras-7270307/"
  - entity_id: "Person:fernando-codobes"
    name: "Fernando Codobes"
    updated: "2026-05-31"
    resumen: "Fernando Codobes aparece unicamente en los documentos analizados (informe de la UCO) como contacto de WhatsApp de Koldo Garcia, con mensajes datados entre 2017 y 2019, y se le menciona en relacion con Fernando Merino. El documento transcribe el nombre tambien como 'Femando Codobes', lo que apunta a posibles errores de OCR en nombre o apellido. No se ha podido confirmar su identidad civil ni cargo en ninguna fuente publica fiable, por lo que no se le atribuye conducta alguna. Rige la presuncion de inocencia."
  - entity_id: "Person:javier-perez-dolset"
    name: "Javier Perez Dolset"
    updated: "2026-05-31"
    resumen: "Javier Perez Dolset es un conocido empresario espanol del sector tecnologico y del videojuego, fundador de Zed Worldwide y cofundador de Pyro Studios. Tras la quiebra de Zed fue investigado/procesado en la Audiencia Nacional por presunto fraude de subvenciones (operacion Hanta), con presuncion de inocencia. En los documentos analizados su aparicion procede del auto de entrada y registro en la sede del PSOE en Ferraz (autoentradaferraz), donde se le vincula a la presunta trama de Leire Diez (los llamados 'fontaneros'), supuestamente orientada a interferir en investigaciones judiciales; se le situa en reuniones con Diez y se le relaciona con un encuentro con el fiscal Stampa. No le consta condena por estos hechos; todo esta en fase de investigacion y rige la presuncion de inocencia."
    sources:
      - "https://www.newtral.es/empresario-javier-perez-dolset/20250605/"
      - "https://theobjective.com/espana/2025-05-27/quien-javier-perez-dolset/"
      - "https://es.wikipedia.org/wiki/Javier_P%C3%A9rez_Dolset"
  - entity_id: "Company:aridos-anfersa-sl"
    name: "Aridos Anfersa SL"
    updated: "2026-05-31"
    resumen: "Aridos Anfersa SL es una empresa espanola del sector de los aridos y la explotacion de canteras. Segun el informe de la UCO y las manifestaciones de Victor de Aldama, figura entre las empresas mencionadas en relacion con Koldo Garcia que habrian recibido contratos publicos; la Guardia Civil examina un contrato de Adif de 2022 adjudicado a una UTE y otro para suministro de balasto, asi como el alta laboral en la sociedad de Patricia Uriz, expareja de Koldo. Todo ello se investiga como posible contraprestacion, sin que conste condena ni irregularidad probada; rige la presuncion de inocencia para personas y empresa."
    sources:
      - "https://www.anfersa.es/"
      - "https://www.eldebate.com/espana/20260121/uco-investiga-contrato-adif-cantera-certificacion-empleo-mujer-koldo-como-proveedora-material-tramo-adamuz_376640.html"
      - "https://www.elcorreogallego.es/espana/2024/12/04/aldama-128-contratos-publicos-constructoras-koldo-comisiones-112333298.html"

  # --- Plus Ultra / UDEF + Causa 20775 + Begoña (enrich swarm 2026-05-31) ---
  - entity_id: "Company:plus-ultra-lineas-aereas"
    name: "Plus Ultra Líneas Aéreas"
    resumen: "Plus Ultra Líneas Aéreas es una pequeña aerolínea española de largo radio que en marzo de 2021 recibió un rescate público de 53 millones de euros (un préstamo participativo de 34 millones y otro ordinario de 19 millones) con cargo al Fondo de Apoyo a la Solvencia de Empresas Estratégicas gestionado por la SEPI, pese a haber registrado pérdidas antes de la pandemia (cerró 2019 en números rojos). El rescate es objeto de una investigación instruida por el juez José Luis Calama en la Audiencia Nacional por presuntos delitos de organización criminal, tráfico de influencias y falsedad documental, en la que está investigado (imputado) el expresidente del Gobierno José Luis Rodríguez Zapatero, citado a declarar el 2 de junio de 2026. Según la instrucción y el informe de la UDEF, los responsables de la compañía habrían articulado una estructura para retribuir presuntas influencias, con ramificaciones vinculadas a Venezuela. Se trata de indicios en una causa abierta y todos los implicados están amparados por la presunción de inocencia."
    # sources: 2 url(s)
  - entity_id: "LegalCase:causa-especial-20775-2020"
    name: "Causa Especial 20775/2020"
    resumen: "La Causa Especial 20775/2020 es el procedimiento que tramita la Sala Segunda del Tribunal Supremo, instruido por el magistrado Leopoldo Puente, en el marco del llamado caso Koldo. Investiga al exministro de Transportes José Luis Ábalos, a su exasesor Koldo García y al exsecretario de Organización del PSOE Santos Cerdán por presuntos delitos vinculados al cobro de comisiones ilegales en la adjudicación de contratos públicos, con Víctor de Aldama como presunto comisionista. La condición de aforado de los investigados determina la competencia del Supremo. En el marco de la causa el instructor acordó prórrogas de la instrucción y se han dictado autos y abierto piezas separadas. Es una causa abierta y rige la presunción de inocencia."
    # sources: 2 url(s)
  - entity_id: "Person:miguel-palomero"
    name: "Miguel Palomero"
    resumen: "Miguel Palomero (Miguel Palomero de Juan) es un abogado de Madrid que figura como investigado en el caso Plus Ultra, instruido en la Audiencia Nacional. Según el informe de la UDEF y la instrucción, mantuvo relación profesional con Rodolfo Reyes, considerado accionista de Plus Ultra, y habría actuado como intermediario para articular contactos políticos e institucionales en torno al rescate de 53 millones de euros y para diseñar estrategias destinadas a frenar la investigación judicial. Según mensajes intervenidos e incorporados al informe de la UDEF, tras conocer presuntamente la entrega de 50.000 euros en efectivo, Palomero habría escrito que 'hay que cuidar a los jueces, policías y funcionarios'; se trata de material de la instrucción aún no enjuiciado. Tras el estallido público de la causa en diciembre de 2025, el despacho Andersen, donde se había incorporado como socio, prescindió de él. Se le sitúa además como posible nexo entre Plus Ultra y el entorno del exministro Ábalos. Rige la presunción de inocencia."
    # sources: 3 url(s)
  - entity_id: "Person:jose-angel-partearroyo"
    name: "José Ángel Partearroyo"
    resumen: "José Ángel Partearroyo fue director del área de empresas participadas de la SEPI (Sociedad Estatal de Participaciones Industriales), responsable de proponer rescates a compañías en dificultades. Según informaciones periodísticas basadas en la instrucción del juez Calama, habría acelerado la tramitación del rescate de Plus Ultra, comunicando a la aerolínea la concesión de la ayuda (el 2 de marzo de 2021) antes de que la aprobara el Consejo de Ministros (el 9 de marzo de 2021). Compareció ante el Senado sobre el procedimiento, donde reconoció que no se elaboraron informes internos para el rescate al considerarse suficientes los de asesores externos. Es mencionado en el auto de Calama y su actuación se examina en la causa, si bien según una de las fuentes consultadas no consta formalmente imputado en una causa contra la SEPI ni mencionado en informes de la UCO. Rige la presunción de inocencia."
    # sources: 2 url(s)
  - entity_id: "Person:manuel-aaron-fajardo-garcia"
    name: "Manuel Aaron Fajardo García"
    resumen: "Manuel Aarón Fajardo (citado en algunas fuentes como Manuel Aarón Fajardo García) es un empresario canario, hijo del senador del PSOE por Lanzarote Francisco Manuel Fajardo Palarea, vinculado a proyectos empresariales en Venezuela. En el caso Plus Ultra, el auto del juez Calama y el informe de la UDEF lo identifican como presunto 'pieza de Zapatero en Venezuela', actuando como primer enlace entre la cúpula de la aerolínea y el entorno del expresidente durante las gestiones para obtener la ayuda pública del rescate; se le describe como interlocutor de confianza dentro de la presunta trama. Se le vincula con operaciones empresariales en Venezuela. Las fuentes no precisan que esté formalmente imputado, solo su papel intermediario según la instrucción. Rige la presunción de inocencia."
    # sources: 3 url(s)
  - entity_id: "Organization:fasee"
    name: "FASEE"
    resumen: "El FASEE (Fondo de Apoyo a la Solvencia de Empresas Estratégicas) fue creado por el Gobierno el 3 de julio de 2020 (Real Decreto-ley 25/2020), con una dotación inicial de 10.000 millones de euros, adscrito al Ministerio de Hacienda y gestionado por la SEPI a través de un Consejo Gestor, para apoyar la solvencia de empresas consideradas estratégicas y golpeadas por la COVID-19; en total el fondo aprobó 30 operaciones por 3.255 millones de euros. A través de este fondo se aprobó el 9 de marzo de 2021 el rescate de 53 millones de euros a Plus Ultra Líneas Aéreas (un préstamo ordinario de 19 millones a devolver en cinco años y uno participativo de 34 millones). Ese rescate es el origen de las diligencias previas 77/2024 del Juzgado Central de Instrucción nº 4 de la Audiencia Nacional (juez José Luis Calama), en las que se investiga una presunta trama de tráfico de influencias en torno al expresidente José Luis Rodríguez Zapatero, imputado en la causa. El FASEE es el instrumento público a través del cual se canalizó la ayuda; su mención en el grafo es institucional y no implica por sí misma irregularidad, rigiendo la presunción de inocencia para todos los investigados."
    # sources: 3 url(s)
  - entity_id: "Person:camilo-ibrahim-issa"
    name: "Camilo Ibrahim Issa"
    resumen: "Camilo Ibrahim Issa es un empresario venezolano, uno de los socios históricos de Plus Ultra Líneas Aéreas, en la que habría entrado en 2017 junto a Rodolfo Reyes a través de la sociedad SNIP Aviation, controlando ambos buena parte del capital antes de la reorganización accionarial de 2025. En la instrucción del caso Plus Ultra (DP 77/2024, Audiencia Nacional), los investigadores lo sitúan dentro de la denominada 'vía Zapatero' activada para impulsar la gestión del rescate de 53 millones de euros concedido en marzo de 2021; según los informes policiales, Rodolfo Reyes habría relatado que Ibrahim Issa mantuvo reuniones con el expresidente Zapatero para tratar la evolución de la ayuda pública. Su entorno familiar habría controlado el banco panameño Panacorp, que concedió un préstamo a la aerolínea antes del rescate público. Todo ello procede de una investigación en curso, sin sentencia ni culpabilidad probada; rige la presunción de inocencia."
    # sources: 2 url(s)
  - entity_id: "Organization:deloitte"
    name: "Deloitte"
    resumen: "Deloitte es una de las grandes firmas multinacionales de servicios profesionales (consultoría, auditoría y asesoramiento legal). Aparece vinculada a dos investigaciones diferentes. En el caso Plus Ultra (DP 77/2024), Deloitte actuó como asesora jurídica de la SEPI en el proceso del rescate: según El Español (27-05-2026), que tuvo acceso a los informes, presentó su documento final el 26 de febrero de 2021, dos días hábiles antes de que el expediente llegara al Consejo Gestor del FASEE. En el caso de la cátedra de Begoña Gómez en la Universidad Complutense, la UCO sostiene que las adjudicaciones a Deloitte para desarrollar el software habrían sido 'premeditadas', mediante un contrato menor de 14.999 euros y un procedimiento abierto simplificado posterior que habrían funcionado como 'mero marco administrativo' para dotar de apariencia de legalidad a la adjudicación; Deloitte Consulting habría cobrado en total 78.648,79 euros de la UCM y habría empezado a trabajar antes de la adjudicación formal. Deloitte no figura como investigada en estas piezas, que se centran en los responsables públicos y en la promotora de la cátedra; todo procede de instrucciones en curso y rige la presunción de inocencia."
    # sources: 3 url(s)
    sources:
      - "https://www.elespanol.com/invertia/empresas/20260527/sepi-inflo-empleos-plus-ultra-cuota-mercado-minimizo-crisis-financiera-aprobar-rescate/1003744258402_0.html"
  - entity_id: "Person:cristobal-cano-quiles"
    name: "Cristóbal Cano Quiles"
    resumen: "Cristóbal Cano Quiles figura en la instrucción del caso Plus Ultra (Audiencia Nacional) como uno de los gestores societarios del entramado vinculado a Julio Martínez Martínez. El juez instructor y los informes policiales lo sitúan en un 'tercer nivel jerárquico', junto a María Gertrudis Alcázar ('Gertru'), secretaria de José Luis Rodríguez Zapatero, con funciones de gestión diaria del entramado empresarial y de coordinación y cobertura formal de la documentación que sustenta los pagos y la facturación de la red. La UDEF analiza correos entre Cano Quiles y Alcázar en los que presuntamente se acordaban a posteriori conceptos e importes de facturas (en un correo de marzo de 2022 ella le pregunta si debían aumentar el importe). Aparece como contacto recurrente en varias de las sociedades analizadas y se le relaciona con un contrato de comisión del 1% del rescate. La instrucción lo señala como administrador de Análisis Relevante SL y, según informes de la UDEF recogidos por la prensa (Infobae, Público, OKDiario), lo vincula además a una sociedad offshore en Dubái (Landside Dubai/Middle East Fzco). No confundir con dirigentes asociativos homónimos de la Guardia Civil. Rige la presunción de inocencia: son indicios de una investigación en curso, sin acusación firme ni condena."
    # sources: 4 url(s)
  - entity_id: "Company:voli-analitica"
    name: "Voli Analítica"
    resumen: "Voli Analítica SL es una de las sociedades que, según la instrucción del caso Plus Ultra, habría participado en la canalización de fondos procedentes de la aerolínea. Según los informes recogidos por la prensa, le fueron intervenidas catorce facturas expedidas a Plus Ultra entre abril y diciembre de 2021, con el concepto 'Servicios prestados por gestión de vuelos Madrid-Caracas', por un importe total de 86.992,95 euros (IVA incluido); habría recibido de la aerolínea ingresos por unos 155.847,36 euros pese a carecer de trabajadores en esos periodos. La investigación la vincula a Julio Martínez Martínez y la describe como instrumento para dar apariencia formal a operaciones sin causa económica real, dentro del entramado relacionado con el entorno de Zapatero. Se trata de indicios de una causa en instrucción; rige la presunción de inocencia."
    # sources: 2 url(s)
  - entity_id: "Person:felipe-baca"
    name: "Felipe Baca"
    resumen: "Luis Felipe Baca Arbulu es un empresario de origen peruano residente en Suiza que figura en el centro de la investigación del caso Plus Ultra en la Audiencia Nacional, donde se analiza un presunto esquema de blanqueo de capitales. La instrucción lo describe como presunto facilitador de entregas de efectivo fuera del circuito bancario y como uno de los nodos con capacidad para coordinar contactos, financiación y operaciones (cuentas, brokers, transferencias y estructuras societarias repartidas entre España, Suiza, Emiratos, Panamá y República Dominicana) ligadas al rescate de la aerolínea con 53 millones de euros vía SEPI. Según la prensa, fue detenido en la isla de Aruba y entregado a España mediante un procedimiento de extradición; tras su llegada a Madrid, el juez instructor acordó su libertad con prohibición de salir del espacio Schengen. Rige la presunción de inocencia: se trata de una investigación en curso, sin condena."
    # sources: 3 url(s)
  - entity_id: "Company:landside-dubai-fzco"
    name: "Landside Dubai Fzco"
    resumen: "Landside Dubai FZCO (también citada como Landside Middle East FZCO) es una sociedad cuya creación, según el auto del 'caso Plus Ultra', se habría iniciado a finales de enero de 2021 en una zona económica especial de Dubái. Según la investigación judicial, José Luis Rodríguez Zapatero habría dado instrucciones para su creación y estaría participada al 100% por la sociedad española Idella Consulenza Strategica, administrada por Julio Martínez Martínez. Idella había firmado previamente con Plus Ultra un contrato para percibir el 1% del rescate público (unos 530.000 euros); los investigadores sostienen, con presunción de inocencia, que la estructura en Dubái buscaba canalizar ese cobro fuera de España. Diversos medios señalan que no consta la sociedad en los registros oficiales del emirato. La sociedad y sus titulares están investigados; no consta condena."
    # sources: 3 url(s)
  - entity_id: "Person:alejandro-delgado-crego"
    name: "Alejandro Delgado Crego"
    resumen: "Alejandro Delgado Crego es un directivo de la aerolínea Plus Ultra Líneas Aéreas, identificado en la prensa como director financiero de la compañía y de origen venezolano (anteriormente presidió Santa Bárbara Airlines hasta finales de 2017, incorporándose después a Plus Ultra). Aparece en la investigación del 'caso Plus Ultra' por su participación en comunicaciones internas (chats de WhatsApp) sobre la gestión del rescate público de 53 millones de euros concedido por la SEPI durante la pandemia, incluidos mensajes interpretados por los investigadores como referencias a pagos vinculados al entorno de Julio Martínez Martínez ('Julito'). La UDEF registró su domicilio en el marco de la causa. Rige la presunción de inocencia y no consta condena."
    # sources: 3 url(s)
  - entity_id: "Person:juan-manuel-teixeira-diaz"
    name: "Juan Manuel Teixeira Díaz"
    resumen: "El mayor general Juan Manuel Teixeira Díaz es un alto militar venezolano vinculado al gobierno de Nicolás Maduro que, según las informaciones de la causa, presidió el Instituto Nacional de Aeronáutica Civil (INAC) entre 2020 y 2023, organismo que controla el espacio aéreo y los permisos de vuelo. En el 'caso Plus Ultra' se le sitúa en la dimensión venezolana del presunto tráfico de influencias: según el auto y las comunicaciones recogidas, mantuvo contactos con Julio Martínez Martínez sobre la autorización de vuelos de Plus Ultra entre Madrid y Caracas en 2021. Posteriormente fue nombrado presidente de la Sociedad de Bienes Recuperados (SBR), agencia encargada de la expropiación de bienes de opositores. Se le atribuye un papel en la trama según las informaciones de la causa; rige la presunción de inocencia y no consta condena."
    # sources: 2 url(s)
  - entity_id: "Person:ramon-gordils"
    name: "Ramón Gordils"
    resumen: "Ramón Antonio Gordils Montes es un político y diplomático venezolano, identificado en la prensa como exviceministro de Cooperación del gobierno de Nicolás Maduro. En la investigación del 'caso Plus Ultra' se le atribuye un papel de intermediario: según las comunicaciones recogidas en la causa, Rodolfo Reyes (considerado por los investigadores accionista de facto de la aerolínea) le pidió ayuda para 'llegar a ZP' (Zapatero) y explorar vías de financiación pública para Plus Ultra, y Gordils habría respondido que buscaría cómo hacerlo por la vía formal. Su nombre figura en informes y en el auto en el contexto de los contactos exploratorios para facilitar el rescate. Rige la presunción de inocencia y no consta condena."
    # sources: 3 url(s)
  - entity_id: "Company:grupo-aldesa"
    name: "Grupo Aldesa"
    resumen: "Grupo Aldesa (Aldesa Construcciones S.A.) es un grupo empresarial español del sector de la construcción y la obra pública. Aparece mencionado en la investigación del 'caso Koldo' / informes de la UCO: según la documentación, su nombre figura en una nota del 25 de mayo de 2022 -descrita como un diálogo entre Koldo García y Javier Herrero (exdirector general de Carreteras)- junto a otras constructoras (MAB, Maygar, Azvi, Copasa), en relación con posibles obras dependientes de la Dirección General de Carreteras. La mera aparición de la empresa en estas notas no implica imputación ni acusación contra ella; rige la presunción de inocencia. El esquema general que investiga la UCO atribuye a Ábalos, Cerdán y Koldo García el presunto cobro de comisiones por amaño de obra pública."
    # sources: 2 url(s)
  - entity_id: "Organization:tesoreria-general-de-la-seguridad-social"
    name: "Tesorería General de la Seguridad Social"
    resumen: "La Tesorería General de la Seguridad Social (TGSS) es un servicio común de la Seguridad Social española, adscrito al Ministerio de Inclusión, Seguridad Social y Migraciones, encargado de la gestión y custodia de los recursos económicos del sistema (recaudación de cotizaciones, pagos, inscripción de empresas y afiliación). Es un organismo institucional del Estado, sin papel acusatorio ni investigado. Aparece en la documentación del proyecto principalmente por su función administrativa (datos de afiliación/cotización, requerimientos judiciales) en distintas causas, como el informe de auditoría de mascarillas y autos relacionados."
    # sources: 2 url(s)
  - entity_id: "Organization:vox"
    name: "Vox"
    resumen: "Vox es un partido político español situado en la extrema derecha. Según The Objective (22-05-2026), el juez José Luis Calama (Audiencia Nacional) admitió a Vox, junto al PP y a Hazte Oír, como acusación popular en el 'caso Plus Ultra', causa en la que está investigado el expresidente José Luis Rodríguez Zapatero. El 29 de mayo de 2026 el juez Calama agrupó las acusaciones populares bajo la dirección del PP por considerar que tiene 'una más relevante implantación institucional', y entendió que la personación de Vox 'carecía de los requisitos procesales indispensables para su plena eficacia'. No es sujeto investigado, sino parte acusadora."
    # sources: 2 url(s)
  - entity_id: "Company:indra"
    name: "Indra"
    resumen: "Indra Sistemas es una multinacional española de tecnología, defensa y consultoría cuyo principal accionista es el Estado a través de la SEPI. Marc Murtra presidió Indra hasta enero de 2025, cuando pasó a presidir Telefónica y fue sustituido al frente de Indra por Ángel Escribano. En el contexto general de estos casos, la SEPI y diversas empresas y entidades públicas dependientes de ella aparecen en la instrucción sobre la presunta influencia de Santos Cerdán en nombramientos y adjudicaciones; no consta, sin embargo, en las fuentes verificadas que Indra en particular sea objeto de esa investigación judicial. Indra es una empresa, no un sujeto acusado de delito; rige la presunción de inocencia sobre las personas investigadas."
    # sources: 3 url(s)
  - entity_id: "Person:sergio-sanchez"
    name: "Sergio Sánchez"
    resumen: "Sergio Sánchez Benítez es exdirector de Comunicación del CNI y directivo de Telefónica (Movistar+). En el 'caso Plus Ultra' la UDEF lo identifica como titular del 25% de la consultora Análisis Relevante, administrada por Julio Martínez Martínez (descrito en la investigación como 'testaferro' y amigo del expresidente Zapatero), y como el verdadero autor de los informes de consultoría que se atribuían a Zapatero. Según los investigadores, los pagos por esos contratos de consultoría —canalizados en parte a través de la empresa Whathefav SL, administrada por las hijas de Zapatero— podrían haber encubierto presuntas dádivas. Todo ello está bajo investigación y rige la presunción de inocencia, sin que conste delito probado."
    # sources: 3 url(s)
  - entity_id: "Organization:ministerio-fiscal"
    name: "Ministerio Fiscal"
    resumen: "El Ministerio Fiscal es el órgano de relevancia constitucional que, con autonomía funcional, ejerce la acción penal en defensa de la legalidad, los derechos de los ciudadanos y el interés público. En estos procedimientos (caso Koldo, Cerdán, Ábalos, Plus Ultra, Begoña Gómez) interviene como parte: solicita diligencias, informa sobre medidas cautelares y, en su caso, formula acusación. No es un sujeto investigado, sino una institución procesal acusadora."
    # sources: 2 url(s)
  - entity_id: "Organization:onif"
    name: "ONIF"
    resumen: "La ONIF es la Oficina Nacional de Investigación del Fraude, unidad de la Agencia Estatal de Administración Tributaria (AEAT) creada en 1998 (Resolución de 27 de octubre de 1998) e integrada en el Departamento de Inspección Financiera y Tributaria; investiga los casos de fraude fiscal más relevantes de ámbito nacional. En estos casos aparece como organismo que elabora informes técnicos para la instrucción del 'caso Plus Ultra'/auto-Zapatero sobre la estructura societaria de Julio Martínez Martínez y la canalización de pagos. Es un organismo investigador de la Administración tributaria, no un sujeto acusado."
    # sources: 3 url(s)
  - entity_id: "Person:maria-dolores-de-haro-lopez-villalta"
    name: "María Dolores De Haro Lopez-Villalta"
    resumen: "María Dolores de Haro López-Villalta es Letrada de la Administración de Justicia (antigua secretaria judicial) adscrita a la Sala de lo Penal del Tribunal Supremo. Fue nombrada para ese puesto por Orden JUS/532/2020 y figura como Letrada de la Administración de Justicia que da fe en resoluciones de la Sala Segunda, por ejemplo en la Sentencia 137/2026 (Rec. 20926/2024), de 18 de febrero de 2026. Su función es dar fe pública de los actos procesales y firmar la tramitación; no es parte investigada ni acusada en ninguna causa. Su presencia en los documentos es estrictamente institucional."
    # sources: 2 url(s)
  - entity_id: "Person:alejandra"
    name: "Alejandra"
    resumen: "Nombre de pila ('Alejandra') que aparece en el auto de instrucción del caso Plus Ultra únicamente como supuesta destinataria de un pago en una conversación intervenida. No constan apellidos ni datos suficientes para identificarla públicamente con certeza, ni se le atribuye una posición concreta en la trama. No es posible ofrecer un perfil verificado; rige la presunción de inocencia."
  - entity_id: "Person:evaristo"
    name: "Evaristo"
    resumen: "Evaristo Valentí es el exdirector del Conservatorio Superior de Música de Badajoz, dependiente de la Diputación de Badajoz. En el marco del 'caso David Sánchez' (sobre la plaza de coordinador de actividades de los conservatorios que ocupó David Sánchez Pérez-Castejón, hermano del presidente del Gobierno), declaró como testigo ante la jueza instructora. Reconoció que hubo 'rumores' sobre varios candidatos a la plaza y figura como autor de un correo que se refería al 'hermanísimo' el mismo día en que se publicaron las bases. Es testigo, no acusado; rige la presunción de inocencia."
    # sources: 2 url(s)
  - entity_id: "Organization:brigada-central-de-investigacion-de-blanqueo-de-capitales-y-"
    name: "Brigada Central de Investigación de Blanqueo de Capitales y Anticorrupción"
    resumen: "Es la brigada de la UDEF (Unidad de Delincuencia Económica y Fiscal) de la Policía Nacional especializada en blanqueo de capitales y corrupción. En la causa Plus Ultra (Juzgado Central de Instrucción nº 2, juez Calama) la UDEF participa como unidad policial auxiliar de la instrucción en el rastreo de los presuntos pagos y movimientos de dinero vinculados al rescate de la aerolínea con fondos del FASEE. Actúa como policía investigadora, no como entidad investigada. Nota de verificación: la denominación exacta de la unidad suele aparecer como 'Brigada Central de Investigación de Blanqueo de Capitales y Anticorrupción (BCIBCA)'; el acrónimo 'BBCA' es de uso menos canónico. No se ha podido confirmar de forma independiente la cita a páginas concretas (p.2, p.78) del auto-zapatero, por lo que esa referencia paginada se omite."
    # sources: 3 url(s)
  - entity_id: "Court:juzgado-de-instruccion-n-41-de-madrid"
    name: "Juzgado de Instrucción n° 41 de Madrid"
    resumen: "Es el juzgado madrileño que, bajo el magistrado Juan Carlos Peinado, instruye la causa contra Begoña Gómez, esposa del presidente Pedro Sánchez, abierta en abril de 2024 a raíz de una denuncia de Manos Limpias. Peinado cerró la instrucción en abril de 2026 y propuso juzgarla ante un jurado popular por presuntos delitos de malversación, corrupción en los negocios, tráfico de influencias y apropiación indebida (rige la presunción de inocencia; la Fiscalía pidió el archivo, aunque después discrepó de la investigada y avaló el jurado). También figuran como investigados Cristina Álvarez, asesora de Gómez, y el empresario Juan Carlos Barrabés. El juzgado citó a Gómez para una comparecencia personal el 9 de junio de 2026."
    # sources: 3 url(s)
  - entity_id: "Person:raif-el-arigie"
    name: "Raif El Arigie"
    resumen: "Empresario de origen venezolano que, según la investigación volcada en el caso Plus Ultra (JCI nº 2, juez Calama), figura como consejero de la aerolínea Plus Ultra y mantenía relaciones estrechas con Rodolfo Reyes y Roberto Roselli. Aparece en conversaciones intervenidas (HSI) recogidas por la UDEF en torno a la gestión del rescate de la aerolínea con fondos del FASEE y a contactos relacionados con la obtención de apoyo institucional. A partir de las fuentes disponibles no consta de forma expresa que esté formalmente imputado; rige la presunción de inocencia. La grafía 'El Argie' de algunas transcripciones es una variante del mismo nombre."
    # sources: 2 url(s)
  - entity_id: "Person:antonio-caldeiro-tellez"
    name: "Antonio Caldeiro Téllez"
    resumen: "Empresario que, como administrador de ALVA Skies and Wings SL, controlaba una participación de aproximadamente el 9,46% de la aerolínea Plus Ultra. Según las conversaciones intervenidas que recoge la investigación de la UDEF en el caso instruido por el juez Calama (JCI nº 2), Caldeiro se mostró inicialmente reticente a firmar la documentación y respaldar el plan de viabilidad necesario para el rescate con fondos públicos del FASEE; la investigación apunta que, tras una conversación que él mismo atribuyó a 'José Luis' (en alusión a Zapatero), comunicó que ya no se opondría. Rige plenamente la presunción de inocencia; los hechos están en fase de instrucción y de las fuentes no se desprende con claridad que esté formalmente imputado."
    # sources: 2 url(s)
  - entity_id: "Person:guillermo-alfredo-amaro-chacon"
    name: "Guillermo Alfredo Amaro Chacón"
    resumen: "Es uno de los hermanos Amaro Chacón (junto a Domingo Arnaldo Amaro Chacón), hijos del empresario venezolano Domingo Arnaldo Amaro Rangel, vinculados al entorno empresarial de Caracas. Administra, con su hermano, la consultora Inteligencia Prospectiva SL (creada en enero de 2020 en Madrid). Según la investigación de la UDEF reflejada en el caso que salpica al expresidente José Luis Rodríguez Zapatero, Inteligencia Prospectiva habría transferido más de un millón de euros a sociedades próximas a Zapatero, incluida What The Fav / Whathefav (agencia vinculada a las hijas de Zapatero, a la que habría pagado en torno a 561.000 euros entre 2020 y 2025), presuntamente en relación con el rescate público de la aerolínea. La UDEF sitúa a la familia Amaro Chacón como presuntos pagadores de comisiones a la red investigada. Rige la presunción de inocencia; se trata de imputaciones y diligencias en fase de instrucción."
    # sources: 3 url(s)
  - entity_id: "Organization:manos-limpias"
    name: "Manos Limpias"
    resumen: "Manos Limpias es una organización autodenominada 'sindicato' (colectivo de funcionarios) fundada en 1995 que ha presentado más de doscientas denuncias y se persona como acusación popular en causas de relevancia mediática (ERE, papeles de Bárcenas, caso Nóos, etc.). Fue el denunciante en cuyo escrito se basó el juez Peinado para abrir el 'caso Begoña Gómez' en abril de 2024. En 2026 pidió desgajarse del bloque del resto de acusaciones populares (sin éxito hasta la fecha) y reclamó 10 años y 3 meses de cárcel para Begoña Gómez (8 años por presunta malversación continuada y 2 años y 3 meses por presunto tráfico de influencias); rige la presunción de inocencia respecto a la investigada. Su responsable histórico es Miguel Bernad Remón, abogado vinculado a la extrema derecha. Buena parte de sus denuncias se han sustentado en recortes de prensa."
    # sources: 3 url(s)
  - entity_id: "Company:acciona-construccion"
    name: "Acciona Construcción"
    resumen: "Acciona Construcción, S.A. es la división constructora del grupo español Acciona, una de las grandes constructoras del país. En noviembre de 2025, en el marco de una pieza secreta del 'caso Koldo/Ábalos' relacionada con el exsecretario de Organización del PSOE Santos Cerdán, la UCO de la Guardia Civil registró sedes de Acciona en Madrid, Bilbao y otras empresas en Sevilla en busca de documentación sobre contratos de obra pública. Según el informe de la UCO, varias obras públicas presuntamente amañadas en distintas provincias (Logroño, Sevilla, Murcia, Barcelona) habrían sido adjudicadas en UTE a Acciona Construcción, sin presentar la mejor oferta económica pero favorecidas por criterios de valoración subjetivos; entre ellas figura la reparación de los cables del Puente del Centenario de Sevilla (SE-30). La empresa no está condenada ni imputada por delito probado y rige la presunción de inocencia; la investigación sigue abierta."
    # sources: 3 url(s)
  - entity_id: "Person:carlos-alberto-parra-delgado"
    name: "Carlos Alberto Parra Delgado"
    resumen: "Carlos Alberto Parra Delgado es un ciudadano vinculado a empresarios venezolanos asentados en España señalado en la instrucción del 'caso Plus Ultra' (Diligencias Previas 77/2024, Audiencia Nacional, juez José Luis Calama). Las fuentes lo identifican como administrador de Softgestor SL —una sociedad sin actividad aparente registrada por la UDEF en mayo de 2026— y como administrador único de Apamate Corporate and Trust SL, sociedad que, según la investigación, se habría empleado para canalizar cupos de petróleo de PDVSA y movimientos de fondos (entre ellos una transferencia de 300.000 euros a una empresa de Víctor de Aldama). Según la información publicada, el juez sitúa al banquero Francisco Flores como quien controlaba 'en la sombra' Softgestor; las fuentes consultadas no detallan expresamente el papel de Parra como administrador meramente instrumental, por lo que se evita esa atribución. Rige la presunción de inocencia: no hay delito probado y la causa permanece abierta. El alias 'Carlos Alfonso Parra Delgado' parece una variante errónea del segundo nombre; las fuentes solo confirman 'Carlos Alberto'."
    # sources: 3 url(s)
  - entity_id: "LegalCase:diligencias-previas-1146-2024"
    name: "Diligencias previas 1146/2024"
    resumen: "Nodo de causa judicial cuyos alias ('D.P. 77/24', 'Diligencias Previas 77/2024', 'Diligencias Previas número 77/24') apuntan a las Diligencias Previas 77/2024 de la Audiencia Nacional, instruidas por el juez José Luis Calama en el Juzgado Central de Instrucción nº 4: el llamado 'caso Plus Ultra'. En esa causa se investiga la presunta trama de tráfico de influencias en torno al rescate público de 53 millones de euros a la aerolínea Plus Ultra en 2021, y en mayo de 2026 fue imputado el expresidente del Gobierno José Luis Rodríguez Zapatero, a quien el juez sitúa como presunto líder de 'una estructura estable y jerarquizada' por delitos de organización criminal, tráfico de influencias y falsedad documental, con posible ampliación a blanqueo. El número '1146/2024' del nombre no coincide con el '77/2024' de los alias, por lo que el nodo mezcla dos referencias de causa que el grafo ha fusionado; las fuentes públicas se refieren consistentemente a las DP 77/2024. Rige la presunción de inocencia para todos los investigados."
    # sources: 2 url(s)
  - entity_id: "Person:francisco-enrique-flores-suarez"
    name: "Francisco Enrique Flores Suárez"
    resumen: "Francisco Enrique Flores Suárez fue un empresario y banquero venezolano descrito en la prensa como vinculado al chavismo. Su fallecimiento a los 55 años fue comunicado por su grupo empresarial (Corporación Kingdom & Asociados) y la Fundación Venezolana Nueva; la nota dató la muerte el 6 de febrero de 2026 y la noticia se difundió públicamente en marzo de 2026. Aparece señalado en la instrucción del 'caso Plus Ultra' (DP 77/2024, Audiencia Nacional) y en la documentación aportada por Víctor de Aldama. Según la información publicada del sumario, el juez Calama considera que Flores controlaba 'en la sombra' la sociedad Softgestor SL —formalmente administrada por Carlos Alberto Parra Delgado— y aparece como contacto ('Fco Flores') en intercambios de borradores de contratos de asesoramiento con el entorno de Julio Martínez Martínez (Análisis Relevante SL) que el juez considera presuntamente simulados ('artificiosidad en la configuración formal de contratos y facturas'). No hubo condena y rige la presunción de inocencia; la causa sigue abierta."
    # sources: 3 url(s)
  - entity_id: "Company:iot-domotic-europe"
    name: "IOT Domotic Europe"
    resumen: "IOT Domotic Europe SL es una sociedad mercantil señalada en la instrucción del 'caso Plus Ultra' (DP 77/2024, Audiencia Nacional, juez Calama) como una de las sociedades reactivadas por el empresario Julio Martínez Martínez, socio investigado de Zapatero. Según la información de la causa, la sociedad —constituida en junio de 2019 con la denominación 'Aplicaciones Portuarias SL'— cambió de nombre y amplió su objeto social (desarrollo de aplicaciones informáticas y gestión de equipos tecnológicos) y habría emitido seis facturas a Plus Ultra por un total de unos 110.799 euros entre diciembre de 2021 y enero de 2022. La UDEF la enmarca en el presunto entramado financiero que canalizaba fondos en la trama, como una de las sociedades 'instrumentales'. No hay delito probado y rige la presunción de inocencia; la investigación continúa abierta."
    # sources: 2 url(s)
  - entity_id: "Organization:instituto-de-credito-oficial"
    name: "Instituto de Crédito Oficial"
    resumen: "El Instituto de Crédito Oficial (ICO) es el banco público español, entidad de crédito con forma de empresa pública adscrita al Ministerio de Economía, que canaliza líneas de financiación y avales del Estado (entre ellos los avales COVID). En el 'caso Plus Ultra' (DP 77/2024), la UDEF apunta a que la presunta trama habría intentado primero obtener un crédito bancario respaldado por el ICO para la aerolínea Plus Ultra —gestionado con Banco Santander y CaixaBank— antes de que esa vía fracasara por el rechazo bancario y se optara por el rescate público de 53 millones de euros aprobado por la SEPI (fondo FASEE) en 2021. El ICO aparece, por tanto, como vía de crédito tanteada y descartada, sin que se le atribuya responsabilidad. Rige la presunción de inocencia respecto de los investigados."
    # sources: 2 url(s)
  - entity_id: "Person:laura-rodriguez-espinosa"
    name: "Laura Rodríguez Espinosa"
    resumen: "Laura Rodríguez Espinosa es hija del expresidente del Gobierno José Luis Rodríguez Zapatero y fundó en 2019 la agencia de publicidad y marketing Whathefav SL, que administra junto a su hermana Alba Rodríguez Espinosa. Según los informes de la UDEF incorporados al sumario del juez Calama en la Audiencia Nacional, los investigadores sostienen que Whathefav habría servido presuntamente como vehículo instrumental ('conducto financiero de la red') para emitir 'facturas ad hoc' y dar cobertura formal a movimientos vinculados a la trama del rescate de Plus Ultra. La policía señala que la facturación de la sociedad pasó de 155.791 euros en 2020 a 471.810 cuatro años después, tras el rescate de 53 millones, y que las cuentas de Laura y Alba recibieron en torno a 423.779 euros según el auto. El 18 de junio de 2026, a petición de la Fiscalía Anticorrupción, el juez Calama la citó formalmente como investigada (imputada) en la causa, junto a su hermana Alba y la exsecretaria de Zapatero, María Gertrudis Alcázar. Rige la presunción de inocencia: se trata de una instrucción en curso, sin juicio ni condena, y ser citada como investigada no implica delito probado."
    # sources: 3 url(s)
  - entity_id: "Person:pedro-antonio-rodriguez-fernandez"
    name: "Pedro Antonio Rodríguez Fernández"
    resumen: "Pedro Antonio Rodríguez Fernández fue máximo responsable de Geoalcali SL y del proyecto de mina de potasa Mina Muga (Sangüesa, Navarra) hacia 2011-2016. El informe de la UCO sitúa en este proyecto el presunto origen de la relación entre Santos Cerdán y Koldo García en Navarra: en un correo de 24 de agosto de 2015 Pedro Rodríguez se disculpaba por no haber copiado a Koldo García y se refería a la pareja Cerdán-García como 'nuestros ojos' y 'nuestros oídos' ante el Gobierno de Navarra. Al ser preguntado, reconoció el correo y explicó que se trataba de personas con contactos en organizaciones socialistas que podían ayudar a medir el clima político. Figura como testigo/persona vinculada a la instrucción; rige la presunción de inocencia y no consta que se le atribuya delito."
    # sources: 2 url(s)
  - entity_id: "LegalCase:pieza-separada-62-2025"
    name: "Pieza Separada 62/2025"
    resumen: "Identifica un procedimiento judicial vinculado al 'caso Plus Ultra', causa por el presunto tráfico de influencias en torno al rescate de 53 millones de euros concedido a la aerolínea durante la pandemia, con derivaciones por organización criminal, falsedad documental y blanqueo. La Audiencia Nacional, con el juez Calama, asumió la instrucción tras la inhibición del Juzgado de Instrucción nº 15 de Madrid; el 19 de mayo de 2026 se levantó el secreto y se citó a declarar como investigado al expresidente José Luis Rodríguez Zapatero, señalado en el auto como presunto 'núcleo estratégico y decisorio' de la estructura. ATENCIÓN: las fuentes consultadas indican que la 'Pieza Separada 62/2025' y la pieza del art. 762.6 LECrim ('8/2025') corresponderían a piezas abiertas para investigar posibles ilícitos de TERCERAS PERSONAS AJENAS a la trama principal (p. ej. una red de blanqueo internacional), no necesariamente la pieza nuclear donde está imputado Zapatero; conviene confirmar la equivalencia exacta de numeraciones antes de fusionar. Rige la presunción de inocencia: causa abierta sin delito declarado probado."
    # sources: 3 url(s)
  - entity_id: "Company:thinking-heads"
    name: "Thinking Heads"
    resumen: "Thinking Heads es una consultora especializada en conferencias internacionales, consultoría estratégica y proyectos editoriales que mantiene relación con exlíderes gubernamentales de distintos países. En el marco del caso Plus Ultra, la investigación examina pagos de Thinking Heads Group SL a la cuenta del expresidente Zapatero; las cifras varían según la fuente (en torno a 649.552 euros en 37 transferencias en una versión, hasta un total de unos 681.318 euros atribuidos a servicios de Zapatero según el medio Demócrata, más una cantidad menor dirigida a una agencia de su entorno familiar). La empresa ha negado públicamente cualquier implicación en la trama Plus Ultra, ha subrayado que no está investigada ni imputada y afirma que todos los pagos están respaldados por contrato y por una prestación efectiva y verificable de servicios desde 2014. Rige la presunción de inocencia: la consultora defiende la legalidad de sus pagos y no consta resolución judicial que acredite irregularidad."
    # sources: 2 url(s)
  - entity_id: "Company:daiwa-corporate-advisory"
    name: "Daiwa Corporate Advisory"
    resumen: "Daiwa Corporate Advisory fue la firma de asesoramiento financiero en la que se apoyó la SEPI para evaluar la operación de rescate de 53 millones de euros solicitada por Plus Ultra con cargo al FASEE durante la pandemia, mientras Deloitte se ocupó del análisis jurídico. Su informe (recibido por la SEPI hacia el 23 de febrero de 2021) se integró en el proceso de aprobación de la ayuda pública. En el marco de la investigación, parte del análisis se centra en si la concesión tuvo carácter político más que técnico y en la fiabilidad de los datos (p. ej. cuotas de mercado) manejados; no consta que Daiwa esté imputada ni que se le atribuya participación en la presunta trama. Rige la presunción de inocencia: figura como asesor externo del proceso, no como integrante de la red investigada."
    # sources: 2 url(s)
  - entity_id: "Organization:grupo-zapatero"
    name: "Grupo Zapatero"
    resumen: "'Grupo Zapatero' es la denominación que, según los informes policiales y el auto del juez Calama en el caso Plus Ultra, se empleaba para referirse a la presunta estructura de influencia que habría operado alrededor del expresidente José Luis Rodríguez Zapatero y sus colaboradores próximos; el término se atribuye a su uso por directivos de Plus Ultra. El magistrado describe una organización presuntamente jerarquizada con Zapatero en la cúspide como presunto líder y un segundo nivel de colaboradores operativos (entre ellos Julio Martínez Martínez, descrito como su principal 'lugarteniente', y Manuel Aarón Fajardo). Se vincula con mercantiles como Análisis Relevante SL (que contrató a Zapatero como consultor y facturó unos 72.600 euros a Plus Ultra) y con el FASEE/Plus Ultra. Es una hipótesis indiciaria de la instrucción: rige la presunción de inocencia, no hay condena ni delito declarado probado, y no es una persona jurídica formal sino un concepto descriptivo de la causa."
    # sources: 3 url(s)
  - entity_id: "Person:juan-manuel-cendoya"
    name: "Juan Manuel Cendoya"
    resumen: "Juan Manuel Cendoya (nombre completo Juan Manuel Cendoya Méndez de Vigo) es alto directivo de Banco Santander: director general de Comunicación, Marketing Corporativo y Estudios desde 2001 y, desde diciembre de 2016, vicepresidente del consejo de Santander España. Su nombre aparece en la causa Plus Ultra / 'auto Zapatero' al figurar en un fichero Excel localizado en un terminal intervenido a Julio Martínez Martínez ('Julito'), administrador de Análisis Relevante, como uno de los 'clientes' u objetivos junto a otras figuras empresariales (Florentino Pérez, Air Europa, Huawei, Julio Martínez Sola). Según las informaciones publicadas, figura como objetivo de ese listado sin que conste un vínculo contractual acreditado, y no consta que esté investigado ni imputado. Rige la presunción de inocencia."
    # sources: 3 url(s)
  - entity_id: "Company:alva-skies-and-wings-sl"
    name: "Alva Skies And Wings SL"
    resumen: "Alva Skies and Wings SL es una sociedad mercantil española que figura en el entramado societario de la aerolínea Plus Ultra: poseía una participación del 9,46% en Plus Ultra Líneas Aéreas y su administrador único fue Julio Martínez Sola, fundador y presidente de Plus Ultra (no Julio Martínez Martínez, el interlocutor de la 'vía Zapatero'). La investigación de la UDEF examina el rescate de 53 millones de euros concedido a Plus Ultra por la SEPI durante la pandemia y la presunta red de influencia con la que se habría obtenido, en la que se distingue una 'vía Zapatero' (con Julio Martínez Martínez) y una 'vía Ábalos'. Conviene precisar que en el entorno de Plus Ultra hay dos personas de nombre similar (Julio Martínez Sola, fundador, y Julio Martínez Martínez, amigo de Zapatero), por lo que la titularidad de Alva corresponde al primero. Todo en fase de instrucción y bajo presunción de inocencia."
    # sources: 3 url(s)
  # Síntesis canónica de Jésica (reescrita en el barrido 2026-07-10 al fusionar sus
  # 3 nodos: jesica-rodriguez-garcia ← jessica-rodriguez-garcia + jessica-rodriguez).
  - entity_id: "Person:jesica-rodriguez-garcia"
    name: "Jesica Rodríguez García"
    updated: "2026-07-10"
    resumen: "Jésica Rodríguez García, expareja del exministro de Transportes José Luis Ábalos (relación iniciada hacia 2019), es una de las figuras del caso Koldo. Trabajó como azafata de imagen y, según declaró, es dentista colegiada. Entre 2019 y 2021 fue contratada por las empresas públicas Ineco y Tragsatec (dependientes del Ministerio de Transportes), donde percibió en torno a 43.950 euros (unos 34.450 de Ineco y unos 9.500 de Tragsatec) sin desempeñar trabajo alguno: la sentencia del Tribunal Supremo de 22 de junio de 2026 que condenó a Ábalos, Koldo García y Víctor de Aldama declaró probado que 'no llegó a desempeñar trabajo o función alguna' y que su contratación fue gestionada por indicación directa de Ábalos a través de Koldo García ante la cúpula de ADIF; ella misma reconoció ante el Supremo que cobraba sin trabajar ('soy dentista colegiada y era azafata de imagen', dijo). La sentencia condenó a Ábalos y Koldo a indemnizar solidariamente a Ineco con los 34.450 euros de su salario; ella declaró entonces como testigo y no fue juzgada en esa causa. El 3 de julio de 2026 el juez Ismael Moreno (Audiencia Nacional, caso Koldo) la citó como investigada —junto a Joseba García Izaguirre, hermano de Koldo, e Ignacio Zaldívar, exdirector de Gestión Administrativa de ADIF— por presuntos delitos de tráfico de influencias y malversación, con declaración fijada para el 20 de julio. Según la UCO, el entorno de Víctor de Aldama sufragó además el alquiler de su piso en la Torre de Madrid (Plaza de España, más de 80.000 euros) y parte de sus estudios. Rige plenamente la presunción de inocencia: la citación es una instrucción en curso, no una condena."
    sources:
      - "https://theobjective.com/espana/tribunales/2026-07-03/koldo-jesica-enchufes-ineco-tragsatec/"
      - "https://www.libertaddigital.com/espana/2026-07-03/ismael-moreno-imputa-a-jessica-rodriguez-por-su-contratacion-ineco-y-tragsatec-7430660/"
      - "https://www.elindependiente.com/espana/2026/06/23/abalos-koldo-devolver-34-450-euros-que-jessica-rodriguez-cobro-en-ineco-sin-haber-ido-a-trabajar/"
      - "https://www.telemadrid.es/programas/telenoticias-1/El-juez-Moreno-imputa-a-Jessica-Rodriguez-y-al-hermano-de-Koldo-y-les-cita-a-declarar-el-20-de-julio-2-2903729618--20260703024728.html"
      - "https://www.publico.es/politica/tribunales/jessica-rodriguez-cobro-43-978-euros-empresas-publicas-tragsatec-e-ineco-2019-2021.html"
      - "https://www.infobae.com/espana/2025/08/25/todo-lo-que-se-sabe-de-la-contratacion-de-jessica-rodriguez-ex-de-abalos-en-tragsatec-e-ineco-44000-euros-cobrados-en-un-trabajo-al-que-no-acudia/"
  - entity_id: "Person:basiliso-gil-carrasquero"
    name: "Basiliso Gil Carrasquero"
    resumen: "Basiliso Gil Carrasquero figura como administrador único de Caletón Consultores SL y aparece en el 'auto Zapatero' / caso Plus Ultra como presunto testaferro de esa sociedad. Según el informe de la UDEF, la gestión real de Caletón correspondería a Santiago Fernández Lena, mientras que Gil Carrasquero, ciudadano venezolano que viajaría periódicamente entre Venezuela y España, habría prestado su nombre a cambio de una cantidad fija mensual en efectivo (unos 600 euros cuando viaja a España), sin participar en las decisiones. La investigación atribuye a Caletón Consultores haber recibido 1.159.558 euros de fondos procedentes de Plus Ultra entre 2020 y 2025, justificados como 'comisiones por operaciones de chárter' presuntamente simuladas, dentro de la red que la UDEF vincula al expresidente Zapatero. La UDEF lo localizó viajando a Caracas con dos directivos de Plus Ultra. Todo ello en fase de instrucción y bajo presunción de inocencia."
    # sources: 3 url(s)
  - entity_id: "Person:daniel-romero-abreu-kaup"
    name: "Daniel Romero-Abreu Kaup"
    resumen: "Daniel Romero-Abreu Kaup es un empresario y lobbista gaditano, fundador y presidente de la agencia de conferenciantes Thinking Heads y del think tank Gate Center, cuyo consejo asesor preside José Luis Rodríguez Zapatero. En el 'auto Zapatero' / operación Tíbet, el juez de la Audiencia Nacional José Luis Calama lo sitúa como presunta 'pantalla' financiera del expresidente: según el auto, las empresas del grupo Thinking Heads vinculadas a Romero-Abreu habrían transferido 681.318 euros a Zapatero y 12.297 euros a Whathefav (sociedad de las hijas del expresidente), y Gate Center otros 352.980 euros, superando en conjunto el millón de euros entre 2020 y 2025. Fue recibido en Moncloa acompañando a su esposa unos meses antes de aparecer en el auto judicial. Según las informaciones publicadas, sus empresas están siendo investigadas en la operación Tíbet. Rige la presunción de inocencia."
    # sources: 3 url(s)
  - entity_id: "Organization:finance-boutique"
    name: "Finance Boutique"
    resumen: "\"Finance boutique\" es la denominación que, según el informe de la UDEF, se usaba de forma recurrente para referirse a la presunta estructura de sociedades (Análisis Relevante, Whathefav, etc.) diseñada para canalizar pagos derivados del presunto tráfico de influencias en el rescate de Plus Ultra. La UDEF la interpreta como una estructura instrumental aparentemente legal a través de la cual se habrían justificado contratos de asesoramiento, atribuyendo su liderazgo al expresidente Zapatero y funciones de coordinación documental a su secretaria María Gertrudis Alcázar y a Cristóbal Cano. Se trata de hechos en fase de instrucción ante la Audiencia Nacional (Juzgado/Tribunal Central de Instrucción, juez José Luis Calama), con todos los implicados amparados por la presunción de inocencia. No consta como entidad mercantil con personalidad jurídica propia."
    # sources: 2 url(s)
  - entity_id: "Person:aurora-lopez-lopez"
    name: "Aurora López López"
    resumen: "María Aurora López López es señalada por la UDEF y por el juez José Luis Calama como una de las propietarias reales de Plus Ultra junto a su pareja Rodolfo Reyes Rojas, quien en 2017 entró en el capital de la aerolínea a través de la sociedad Snip Aviation S.L. En el marco de la investigación del rescate de 53 millones de euros, el juez de la Audiencia Nacional dictó contra ella una orden internacional de detención, atribuyéndole los presuntos delitos de apropiación indebida/malversación, tráfico de influencias, pertenencia a organización criminal y blanqueo de capitales, los mismos que a su pareja. Todos los hechos se hallan en fase de instrucción y le ampara la presunción de inocencia."
    # sources: 2 url(s)
  - entity_id: "Company:panacorp-casa-de-valores"
    name: "Panacorp Casa de Valores"
    resumen: "Panacorp Casa de Valores S.A. es una entidad financiera panameña que figura en la instrucción del caso Plus Ultra como otorgante de un supuesto préstamo participativo (en torno a 7,5 millones de dólares / 6,3 millones de euros) a la aerolínea, instrumento que la trama habría utilizado para reforzar artificialmente su solvencia y cumplir los requisitos del rescate público de la SEPI. Según las pesquisas, ese préstamo no suponía un flujo libre de recursos, pues unos cuatro millones quedaron inmovilizados en un depósito en el Commonwealth Bank and Trust de Dominica (paraíso fiscal), reduciendo la liquidez efectiva. El juez de la Audiencia Nacional (José Luis Calama) considera el préstamo un elemento clave, presuntamente ficticio, en la trama, sin que ello prejuzgue responsabilidad de la entidad. Todo se halla en fase de investigación y rige la presunción de inocencia."
    # sources: 2 url(s)
  - entity_id: "Person:alba-rodriguez-espinosa"
    name: "Alba Rodríguez Espinosa"
    resumen: "Alba Rodríguez Espinosa es una de las hijas del expresidente del Gobierno José Luis Rodríguez Zapatero y, junto con su hermana Laura, administra la mercantil Whathefav S.L. Según el informe de la UDEF, la sociedad Análisis Relevante habría transferido 239.755 euros a Whathefav S.L. entre junio de 2020 y diciembre de 2024, dentro del presunto circuito de fondos vinculado al cobro de influencias en el rescate de Plus Ultra; los investigadores sospechan que parte de esa facturación carecía de servicios reales documentados. La Audiencia Nacional autorizó a la UDEF el acceso al correo de Zapatero y de sus hijas para rastrear estos movimientos. El 18 de junio de 2026, a petición de la Fiscalía Anticorrupción, el juez José Luis Calama la citó como investigada (imputada) en la causa —junto a su hermana Laura y la exsecretaria de Zapatero, María Gertrudis Alcázar—, al apreciar indicios racionales de que Whathefav habría servido para la canalización, ocultación o facilitación de fondos de la presunta trama. Se trata de una instrucción en curso y le ampara plenamente la presunción de inocencia: no hay juicio ni condena, y ser citada como investigada no implica culpabilidad probada."
    # sources: 2 url(s)
  - entity_id: "Organization:asociacion-de-abogados-democratas-por-europa"
    name: "Asociación de Abogados Demócratas por Europa"
    resumen: "La Asociación de Abogados Demócratas por Europa (ADADE) se personó como acusación popular en el caso Koldo en mayo de 2024, cuando la causa aún estaba en la Audiencia Nacional, antes de que el exministro José Luis Ábalos fuera aforado, y siguió la causa especial seguida después en el Tribunal Supremo. Es una de las varias acusaciones populares de la causa, junto a entidades como Vox, Manos Limpias, la Asociación Liberum, Hazte Oír y Iustitia Europa. Diversos medios la han vinculado al entorno del PSOE y han cuestionado su papel, alegando que apenas habría aportado actividad procesal; se trata de valoraciones periodísticas no acreditadas judicialmente que deben tomarse con cautela."
    # sources: 2 url(s)
  - entity_id: "Organization:presidencia-del-gobierno"
    name: "Presidencia del Gobierno"
    resumen: "La Presidencia del Gobierno (Moncloa) es el órgano que asiste al presidente del Gobierno de España. En el caso Begoña Gómez aparece porque María Cristina Álvarez Rodríguez está adscrita a su Gabinete como asesora con sueldo público. El juez Peinado investiga si parte del tiempo y los medios públicos de ese puesto se dedicaron a gestiones privadas de la esposa del presidente, lo que fundamentaría el presunto delito de malversación. La organización figura como contexto institucional del empleo público investigado, sin que ello implique atribución de responsabilidad a la institución; rige la presunción de inocencia."
    # sources: 1 url(s)
  - entity_id: "Court:tribunal-de-instancia-de-madrid-plaza-n-15"
    name: "Tribunal de Instancia de Madrid, Plaza nº 15"
    resumen: "El Tribunal de Instancia de Madrid es el órgano judicial sede de la sección de instrucción que tramita el caso Begoña Gómez, dirigida por el magistrado Juan Carlos Peinado, titular de la antigua Instrucción nº 41 de Plaza de Castilla (puesto que ocupa desde 2015). Tras la reforma de la planta judicial de 2025, los antiguos juzgados de instrucción de Plaza de Castilla pasaron a integrarse como secciones de instrucción del Tribunal de Instancia de Madrid. Este órgano concluyó la instrucción en abril de 2026 y propuso juzgar ante un jurado popular a Begoña Gómez, a su asesora Cristina Álvarez y al empresario Juan Carlos Barrabés. Es el tribunal que cita y resuelve las medidas del procedimiento; rige la presunción de inocencia para los investigados."
    # sources: 2 url(s)
  - entity_id: "Company:apamate-corporate-and-trust"
    name: "Apamate Corporate And Trust"
    resumen: "Apamate Corporate and Trust SL es una sociedad cuyo administrador único es Carlos Alberto Parra Delgado (ciudadano español nacido en Venezuela). Según informes de la UDEF recogidos en el auto del caso Plus Ultra, Apamate figura como receptora de un contrato de prestación de servicios de asesoramiento de 30/07/2020 por 120.000 euros vinculado a la consultora Análisis Relevante (relacionada con Julio Martínez Martínez, presunto testaferro de Zapatero), y se le atribuye una transferencia de 300.000 euros a Deluxe Fortune, sociedad vinculada a Víctor de Aldama, el 3 de enero de 2020. Los investigadores la sitúan como una de las sociedades a través de las cuales presuntamente se habrían canalizado fondos en la trama investigada en torno al entorno de José Luis Rodríguez Zapatero. Se trata de hechos en fase de investigación; rige la presunción de inocencia."
    # sources: 2 url(s)
    # sources: 3 url(s)
  - entity_id: "Contract:contrato-de-prestacion-de-servicios-de-asesoramiento"
    name: "Contrato de prestación de servicios de asesoramiento"
    resumen: "Es un contrato de prestación de servicios de asesoramiento fechado el 30/07/2020, por un importe de 120.000 euros (60.000 a la firma y 60.000 el 15/04/2021), que contemplaba informes políticos y económicos. Según el auto del caso Plus Ultra y los informes de la UDEF, el contrato se intercambió entre un contacto identificado como Francisco Flores y Julio Martínez Martínez (presunto testaferro de Zapatero, vinculado a la consultora Análisis Relevante), figurando Apamate Corporate and Trust SL como receptora del servicio; el 18/10/2020 Francisco Flores remitió el contrato ya cumplimentado a Julio Martínez Martínez. Los investigadores lo señalan como documento presuntamente instrumental para justificar movimientos de fondos dentro del entramado investigado. Es material probatorio en fase de investigación; rige la presunción de inocencia."
    # sources: 1 url(s)
  - entity_id: "Organization:direccion-general-de-aviacion-civil"
    name: "Dirección General de Aviación Civil"
    resumen: "La Dirección General de Aviación Civil (DGAC) es el organismo del Ministerio de Transportes que regula y ordena el sector aéreo. Aparece en la causa del rescate de Plus Ultra (caso Zapatero, instruido en la Audiencia Nacional por el juez José Luis Calama) porque, según las informaciones publicadas, un informe de la DGAC sirvió de base técnica casi exclusiva para declarar a Plus Ultra empresa 'estratégica', argumento clave para aprobar la ayuda pública de 53 millones de euros de la SEPI. Según El Español, la SEPI copió siete de los nueve párrafos utilizados directamente de ese informe, que el Gobierno nunca mencionó públicamente pese a defender durante años que el rescate se basó en tres informes independientes; el de la DGAC era el menos independiente al estar elaborado por una dirección subordinada al Ministerio de Transportes. La DGAC no consta investigada; figura como organismo cuyo informe se cita en el procedimiento en el que el expresidente José Luis Rodríguez Zapatero está investigado, rigiendo plenamente la presunción de inocencia."
    # sources: 2 url(s)
  - entity_id: "Person:maria-sonsoles-espinosa-diaz"
    name: "María Sonsoles Espinosa Díaz"
    resumen: "María Sonsoles Espinosa Díaz es la esposa de José Luis Rodríguez Zapatero. Según informaciones publicadas a partir del informe de la UDEF en el caso Plus Ultra (Audiencia Nacional, juez José Luis Calama), una cuenta bancaria que comparte con su marido habría recibido en torno a 1,5 millones de euros entre 2020 y 2025 procedentes de sociedades vinculadas a la presunta trama; según esas fuentes, la mayor parte (más de un millón de euros en 76 transferencias) procedería de Thinking Heads Group y entidades ligadas a Daniel Romero-Abreu, y unos 445.200 euros (2021–junio de 2025) más alrededor de 30.000 euros en 2020 de la mercantil 'Análisis Relevante', administrada por Julio Martínez. Según las informaciones, el juez se plantea citarla —como testigo o investigada— para que explique el origen de esos fondos y de unas joyas halladas por la UDEF en un registro, sin que conste por ahora su imputación; se ha apuntado una posible responsabilidad civil a título lucrativo (art. 122 CP). Rige plenamente la presunción de inocencia: son hechos en fase de investigación, no probados ni juzgados, y la mención de su nombre no equivale a atribución de delito."
    # sources: 3 url(s)
  - entity_id: "Organization:reale-seguros"
    name: "Reale Seguros"
    resumen: "Reale Seguros es una compañía aseguradora del grupo italiano Reale Group. En el caso de Begoña Gómez (Juzgado de Instrucción nº 41 de Madrid, juez Juan Carlos Peinado) figura como una de las patrocinadoras de la Cátedra Extraordinaria de Transformación Social Competitiva que codirigía Gómez en la Universidad Complutense: aportó una donación de unos 60.000 euros (cifrada por la prensa en 15.000 euros anuales durante cuatro años). Según declaró ante el juez su consejero delegado, Ignacio Mariscal, el contacto se produjo en agosto de 2020 a través de un corredor de seguros amigo de Gómez y de Pedro Sánchez, David Sanza; informes recogen además que la asesora de Gómez habría instado a Reale a seguir financiando la cátedra, patrocinio que la aseguradora suspendió en febrero de 2024. La empresa no consta imputada y rige la presunción de inocencia respecto de todas las personas investigadas en la causa."
    # sources: 2 url(s)
  - entity_id: "Organization:policia-nacional"
    name: "Policía Nacional"
    resumen: "La Policía Nacional es el cuerpo policial estatal español dependiente de la Dirección General de la Policía. En las causas de corrupción recogidas en esta base aparece como autoridad actuante: sus unidades especializadas (en particular la UDEF y la Brigada Central de Investigación de Blanqueo de Capitales y Anticorrupción) elaboran informes y practican diligencias por orden judicial. En el 'caso Plus Ultra' / auto-zapatero, el auto recoge expresamente la 'Colaboración de la agencia de los Estados Unidos Homeland Security Investigations (HSI)' a través de los mecanismos de cooperación de los que dispone la Policía Nacional. Es un organismo público, no un sujeto investigado."
    # sources: 2 url(s)
  - entity_id: "Person:tomas-guerrero-blanco"
    name: "Tomás Guerrero Blanco"
    resumen: "Tomás Víctor Guerrero Blanco aparece en la investigación del 'caso Plus Ultra'. La prensa que cita la causa (Público) lo describe como directivo del Halal Trade and Marketing Centre (HTMC), centro de negocios impulsado por el Gobierno de Dubái; el informe policial UDEF-BBCA 1907/26, con lenguaje cautelar ('pudiera tratarse de'), lo identifica como fundador de sociedades españolas del ámbito halal (Halal International Tourism S.L., Halal Global Services S.L.) y de Statecraft. Según la documentación de la causa, tras una reunión de enero de 2021 habría remitido por correo electrónico al empresario Julio Martínez Martínez la documentación necesaria para crear una empresa en el emirato, proponiendo según Público los nombres 'Idella Consulenza FZCO' o 'Idella Consulenza Services FZCO'; la sociedad finalmente constituida en Dubái se denominó, según el auto, 'Landside Dubai FZCO'. La investigación examina si esa estructura en Dubái servía para canalizar de forma opaca una presunta comisión del 1% (unos 530.000 euros) asociada al rescate de Plus Ultra por la SEPI. Rige la presunción de inocencia: figura como investigado y no consta condena."
    # sources: 2 url(s)
  - entity_id: "Court:tribunal-central-de-instancia-plaza-n-dos"
    name: "Tribunal Central de Instancia, Plaza nº DOS"
    resumen: "Es el órgano de instrucción de la Audiencia Nacional denominado, tras la reforma de los Tribunales de Instancia en vigor desde el 1 de julio de 2025, 'Sección de Instrucción del Tribunal Central de Instancia, Plaza nº 2', que sustituyó al anterior Juzgado Central de Instrucción nº 2. A este órgano se atribuyó la instrucción del 'caso Plus Ultra' / trama Zapatero (Diligencias Previas 77/2024) después de que el órgano de instrucción de Madrid plaza nº 15 (antiguo Juzgado de Instrucción nº 15) se inhibiera mediante auto de 23.02.2026. El auto del caso está firmado por el magistrado José Luis Calama Teixeira, que figura como instructor de esta plaza nº 2; ante este órgano la UDEF-BBCA presentó sus informes 1907/26 y 1908/26, de 22 de abril de 2026. Es un órgano judicial, no un sujeto investigado."
    # sources: 3 url(s)
  - entity_id: "Organization:inac"  # re-key 2026-07-10: el nodo de nombre largo se fusionó en el canónico INAC (merges.yaml)
    name: "Instituto Nacional de Aeronáutica Civil de Venezuela"
    updated: "2026-07-10"
    resumen: "El Instituto Nacional de Aeronáutica Civil de Venezuela (INAC) es el organismo regulador de la aviación civil de Venezuela. En la causa del auto-zapatero / 'caso Plus Ultra' se le cita en el contexto de la operativa de la aerolínea Plus Ultra y de las gestiones del entorno investigado sobre permisos y vuelos: el auto refiere influencias con el presidente del INAC de Venezuela y la atribución de responsabilidades por la comercialización de vuelos sin la autorización correspondiente. Es un organismo público venezolano, no un sujeto investigado. Comparte identidad con el nodo 'INAC' del grafo, que es la forma abreviada de este mismo ente."
    # sources: 2 url(s)
  - entity_id: "Person:jaime-ribes"
    name: "Jaime Ribes"
    resumen: "Jaime Ribes aparece en los informes de la UDEF (informe-udef-1907/1908) como 'director de la agencia' y 'ejecutivo de empresas' de Banco Santander que, junto al 'director/responsable de área' José Javier Castellanos, atendió en junio de 2020 una solicitud de financiación presentada por Plus Ultra, representada por su director financiero Roberto Roselli. En los chats intervenidos, Roselli relata que se reunió telefónicamente con 'nuestro ejecutivo de empresas Jaime Ribes que trabaja directamente con Javier Castellanos'. Su mención se limita a su labor como empleado bancario que tramitó la operación de crédito solicitada por la aerolínea. No consta que esté investigado ni imputado en la causa del rescate de Plus Ultra; figura únicamente como tercero (banquero) citado en las conversaciones intervenidas. Rige plenamente la presunción de inocencia."
    # sources: 1 url(s)
  - entity_id: "Company:landside-holding-ltd"
    name: "Landside Holding Ltd"
    resumen: "Landside Holding Ltd (también 'Landside Holdings Limited') es una mercantil offshore radicada en las Islas Vírgenes Británicas (RG Hodge Plaza, Road Town, Tortola) que, según el informe de la UDEF (informe-udef-1907), preside y representa Julio Martínez Martínez (investigado), señalado por los agentes como presunto canalizador de fondos en la trama del rescate de Plus Ultra. En el ordenador intervenido a Martínez se halló un documento 'MANDATE LANDSIDE HOLDING' (acuerdo de negociación, con honorarios del 8,75% de los fondos recaudados) y constancia de activos de la sociedad en 2016 (cuenta de broker MORA WM SECURITIES LLC). Los investigadores la situan dentro del entramado societario opaco vinculado a la presunta estructura de cobro de comisiones ('finance boutique') en torno a José Luis Rodríguez Zapatero. Debe distinguirse de 'Landside Middle East FZCO / Landside Dubai Fzco', la sociedad de Dubái creada en 2021 y 100% participada por Idella Consulenza Strategica. Presunción de inocencia: hechos atribuidos según informe policial, sin sentencia."
    # sources: 2 url(s)
  - entity_id: "Person:raul-medina"
    name: "Raúl Medina"
    resumen: "Raúl Medina Caballero fue Director General de Aviación Civil (DGAC), dependiente del Ministerio de Transportes, entre 2015 y 2022, y presidente de AESA en ese periodo; desde el 1 de enero de 2023 es director general de EUROCONTROL (elegido en junio de 2022). En el marco del rescate de Plus Ultra firmó, en febrero de 2021, el informe de la DGAC 'Análisis de la actividad de la compañía aérea Plus Ultra', documento que la SEPI recibió el 18/02/2021 e incorporó a su expediente y empleó como base para declarar a la aerolínea 'estratégica' y justificar la ayuda de 53 millones (la SEPI copió textualmente siete de los nueve párrafos usados). Diversas informaciones cuestionan que ese informe sobrevalorara la flota y situación de Plus Ultra, pero a Medina NO se le atribuye participación en la presunta trama ni consta imputado o investigado: aparece como alto cargo técnico autor de un informe oficial y, puntualmente, citado en una conversación como posible asistente a una reunión. Presunción de inocencia plena."
    # sources: 3 url(s)
  - entity_id: "Organization:boutique-financiera"
    name: "boutique financiera"
    resumen: "La 'boutique financiera' (en las conversaciones, 'finance boutique' o simplemente 'la boutique') es la denominación que la UDEF da a la presunta estructura mercantil que Roberto Roselli y Julio Martínez Martínez habrían montado para canalizar las 'mordidas' del rescate de Plus Ultra mediante facturas y contratos de asesoría a través de sociedades instrumentales (Análisis Relevante, Idella Consulenza, Softgestor, etc.). En un chat de mayo de 2020, Roselli comenta a Rodolfo Reyes que Julio Martínez 'montaron su finance boutique' y que 'así que por [ahí] vendrá la mordida'; clientes de la boutique aparecen en las conversaciones (p. ej. Domingo Amaro Chacón). Según el informe policial, los pagos se articulaban formalmente bajo apariencia de contratos de asesoría para encubrir el presunto cobro de influencias en torno a José Luis Rodríguez Zapatero. Es un concepto descriptivo del entramado, no una sociedad inscrita con ese nombre registral. Presunción de inocencia: relato de la UDEF, no juzgado."
    # sources: 2 url(s)
  - entity_id: "Company:aerovip"
    name: "Aerovip"
    resumen: "Aerovip es un conjunto de mercantiles venezolanas (entre ellas ADMINISTRADORA AEROVIP C.A. y AEROVIP GSA C.A., con dominio atribuido por la UDEF a Rodolfo Reyes Rojas) descrito por la UDEF como 'estrecho colaborador' de Plus Ultra Líneas Aéreas, con relaciones mercantiles que incluyen servicios de handling y representación general de ventas (GSA). Según el informe de la UDEF (informe-udef-1907/1908), Roberto Roselli planteó en sus chats facturar cobros 'vía aerovip' ('Pedimos NC y facturamos por aerovip') como posible canal para articular pagos del rescate sin que la SEPI pusiera inconvenientes. Los investigadores la sitúan así dentro del circuito societario del presunto cobro de comisiones del rescate de 53 millones. Presunción de inocencia: hechos según informe policial, no juzgados."
    # sources: 2 url(s)
  - entity_id: "Company:caixabank"
    name: "CaixaBank"
    resumen: "CaixaBank S.A. (CIF A08663619, que integró Banco Mare Nostrum y Bankia) es una de las principales entidades bancarias de España. En las causas analizadas aparece exclusivamente como entidad financiera tercera: destinataria de mandamientos judiciales para que remita movimientos de cuentas a la UCO/UDEF (p. ej. en el ATS 242/2026, donde figura como 'CAIXABANK SA (A08663619)', y mandamientos solicitados el 11/02/2026 en el caso Plus Ultra), y como banco en el que constan transferencias examinadas por la UDEF (por ejemplo un justificante de transferencia de 72.600 euros ordenado por la sociedad SOFTGESTOR S.L. el 15/09/2021, concepto 'PAGO FACTURA01SG-2021', y cuentas tituladas por José Luis Rodríguez Zapatero y su cónyuge a las que se derivaron fondos). No se le atribuye ninguna conducta ilícita: figura como proveedor de servicios bancarios cuyos registros se requieren como prueba. Presunción de inocencia plena para la entidad."
    # sources: 2 url(s)
  - entity_id: "Person:francisco-martin-aguirre"
    name: "Francisco Martín Aguirre"
    updated: "2026-07-29"
    resumen: "Francisco Martín Aguirre (Madrid, 1981) es un dirigente del PSOE, delegado del Gobierno en la Comunidad de Madrid desde 2023. Antes fue secretario general de la Presidencia del Gobierno (2021-2023), donde dirigió el gabinete que coordinó la exhumación de los restos de Franco y la celebración de la cumbre de la OTAN en Madrid. En noviembre de 2025 compareció en la comisión de investigación del Senado sobre el 'caso PSOE' (financiación y entorno de Koldo García/Cerdán). En el 'caso Begoña Gómez' llegó a estar imputado por la contratación de la asesora de Moncloa (el auto de 23-09-2025 lo incluía en la transformación a procedimiento de jurado), pero, según la prensa (EFE vía Infobae; El Diario de Madrid), la Audiencia Provincial de Madrid revocó su imputación el 04-12-2025 al no apreciar «ni el menor indicio» de responsabilidad y el juez Peinado sobreseyó su causa el 18-12-2025. Su papel actual es el de cargo institucional; rige la presunción de inocencia."
    sources:
      - "https://www.infobae.com/espana/agencias/2025/12/18/el-juez-del-caso-begona-gomez-acata-la-orden-de-la-audiencia-y-archiva-para-el-delegado-del-gobierno-en-madrid/"
      - "https://www.infobae.com/espana/agencias/2025/12/04/la-audiencia-de-madrid-corrige-al-juez-del-caso-begona-gomez-y-le-emplaza-a-exonerar-al-delegado-del-gobierno/"
      - "https://www.eldiariodemadrid.es/articulo/tribunales/audiencia-provincial-revoca-imputacion-francisco-martin-caso-begona-gomez/20251204173532115754.html"
  - entity_id: "Organization:ico"
    name: "ICO"
    resumen: "El ICO (Instituto de Crédito Oficial) es el banco público español que durante la pandemia avaló líneas de financiación a empresas. En el caso Plus Ultra aparece porque, según el informe de la UDEF, la presunta trama intentó primero obtener para la aerolínea créditos avalados por el ICO a través de la banca (Santander, La Caixa) -se halló en el ordenador del director financiero de Plus Ultra una carta a Banco Santander de mayo de 2020 solicitando un crédito ICO-, operaciones que no prosperaron; tras el rechazo bancario se reorientó la gestión, en julio de 2020, hacia el rescate público de la SEPI/FASEE. El ICO es un organismo, no un investigado, y opera con presunción de regularidad."
    # sources: 2 url(s)
  - entity_id: "Company:iberia"
    name: "Iberia"
    resumen: "Iberia es la aerolínea de bandera española. Aparece en la documentación del caso Koldo (mascarillas) en el contexto de los vuelos para el transporte desde China del material sanitario importado en 2020: según los autos, Víctor de Aldama habría pedido renegociar a la baja el precio con Iberia, mientras la aerolínea sostiene que Soluciones de Gestión contrató los vuelos 'al mismo precio' que otras compañías. Su mención es operativa/logística y no implica imputación alguna. NOTA: los nombres 'Kreab Iberia S.L.' y 'Bureau Veritas Iberia SL' corresponden a empresas distintas (Kreab es una consultora de comunicación; Bureau Veritas, certificadora) y no deben fusionarse con la aerolínea Iberia, aunque compartan el sufijo 'Iberia'."
    # sources: 3 url(s)
  - entity_id: "Person:jose-luis-escriva-belmonte"
    name: "José Luis Escrivá Belmonte"
    resumen: "José Luis Escrivá Belmonte es economista, gobernador del Banco de España desde 2024 y anteriormente presidente de la AIReF (2014-2020) y ministro de Inclusión, Seguridad Social y Migraciones (2020-2023). En el caso Plus Ultra figura porque, según el informe de la UDEF, el 7 de septiembre de 2020 mantuvo una reunión con el expresidente Zapatero en el Ministerio de Trabajo, días después de que la aerolínea presentara su solicitud de rescate. Escrivá y su entorno sostienen que el encuentro versó sobre las medidas frente a la pandemia y no sobre el rescate, que el asunto no era de sus competencias y que no participó en ningún aplazamiento de deuda (la aerolínea obtuvo un aplazamiento de su deuda con la Seguridad Social en octubre de 2020 al formalizar la solicitud de ayuda). No está imputado en la causa y rige plenamente la presunción de inocencia."
    # sources: 4 url(s)
  - entity_id: "Person:julian-mateos"
    name: "Julián Mateos"
    resumen: "Julián Mateos-Aparicio fue nombrado en agosto de 2021 director del Fondo de Apoyo a la Solvencia de Empresas Estratégicas (FASEE) de la SEPI, el vehículo público que rescató a Plus Ultra. Según el informe de la UDEF, una conversación de agosto de 2021 entre miembros del entorno de Plus Ultra (un mensaje '10k done') apuntaría a un presunto pago de 10.000 euros vinculado a su nombramiento; no obstante, varios medios subrayan la contradicción cronológica: el rescate de Plus Ultra se autorizó en marzo de 2021, antes de que Mateos asumiera la dirección del fondo en agosto, lo que debilitaría la hipótesis de tráfico de influencias sobre el rescate. Rige la presunción de inocencia; se trata de sospechas recogidas en un informe policial, no de hechos probados."
    # sources: 3 url(s)
  - entity_id: "Person:maria-del-pilar-hidalgo-lopez"
    name: "María del Pilar Hidalgo López"
    resumen: "María del Pilar Hidalgo López es procuradora de los Tribunales colegiada en Madrid. En el procedimiento del caso Begoña Gómez (Sección de Instrucción nº 41 de Madrid, magistrado-juez Juan Carlos Peinado García) figura como procuradora del partido político VOX, personado como acusación popular. Es decir, actúa como representante procesal de una de las acusaciones populares, NO como investigada ni como magistrada."
    # sources: 2 url(s)
  - entity_id: "Person:philippe-apikian"
    name: "Philippe Apikian"
    resumen: "Philippe Apikian (en documentos oficiales APIKIAN, Philipp Paul Vartan; nacido el 15/01/1969 en Ginebra, ciudadano suizo) es un empresario suizo identificado en el informe de la UDEF (informe-udef-1907) como presidente de la sociedad Swissoil Trading S.A. Según el informe policial, conforme a un mensaje intervenido de 23/01/2024 atribuido a Domingo Amaro Chacón y dirigido a Julio Martínez Martínez, Apikian aparecía junto a compradores chinos como interesado en operaciones de compra de petróleo/petcoke venezolano, operativa que el informe vincula a la red de influencia que sitúa en torno a José Luis Rodríguez Zapatero y a Delcy Rodríguez. El propio informe consigna que figura en la lista de sanciones de la OFAC estadounidense (programa Venezuela, EO 13850). Se trata de indicios recogidos en un informe policial dentro de una instrucción judicial abierta; rige la presunción de inocencia y no consta que esté imputado ni que los hechos hayan sido juzgados."
    # sources: 2 url(s)
  - entity_id: "Person:ruben-eladio-lopez-martinez"
    name: "Rubén Eladio López Martínez"
    resumen: "Rubén Eladio López Martínez es inspector de la Policía Nacional que, durante la etapa de José Luis Ábalos al frente del Ministerio de Transportes, fue director de la Unidad de Emergencias, Coordinación y Gestión de Crisis del MITMA, cargo en el que, según Infobae (29-02-2024), que cita un auto judicial, fue colocado en 2020 y para cuya consolidación Koldo García recurrió a Ábalos. Según elDiario.es (05-09-2025), en 2025 regresó al servicio activo en el Cuerpo y fue destinado a una comisaría de distrito de Madrid. En el informe de la UDEF (informe-udef-1907/1908) aparece como remitente de un mensaje sobre la agenda política ('Está zapatero reunido ahora mismo con el ministro de inclusión...') dentro de una secuencia de comunicaciones reproducida en el análisis de los dispositivos intervenidos. Su mención es contextual dentro del caso Koldo/Ábalos; rige la presunción de inocencia y no consta que esté imputado."
    # sources: 3 url(s)
    sources:
      - "https://www.infobae.com/espana/2024/02/29/koldo-recurrio-a-abalos-para-consolidar-al-policia-que-destapo-el-caso-villarejo-en-un-alto-cargo-de-transportes/"
      - "https://www.eldiario.es/politica/policia-cabecera-abalos-epoca-transportes-regresa-cuerpo-destinado-comisaria-madrid_1_12580970.html"
  - entity_id: "Person:alvaro-gutierrez-molano"
    name: "Álvaro Gutiérrez Molano"
    resumen: "Álvaro Gutiérrez Molano figura en el informe de la UDEF (informe-udef-1907) como apoderado de la sociedad Caleton Consultores, sociedad cuyo administrador el informe describe con un papel 'meramente formal'. Según el informe, el 17/06/2022 se elevó a público el apoderamiento de Caleton a su favor y a favor de otra persona, dos días después de que ambos constituyeran la sociedad Orbe Consulting SLLP. El informe constata además una relación profesional directa y consolidada en el tiempo entre Gutiérrez Molano y Santiago Fernández Lena (intervención conjunta en numerosos protocolos notariales hasta 2025; p.ej. apoderamiento en TDE Consultores SL). Su aparición se enmarca en el análisis de los flujos societarios de la pieza de Plus Ultra/Venezuela; rige la presunción de inocencia y se trata de indicios de un informe policial, no de hechos probados."
    # sources: 1 url(s)
  - entity_id: "LegalCase:diligencias-previas-597-2021"
    name: "Diligencias Previas 597/2021"
    resumen: "Las Diligencias Previas n.º 597/2021 son el procedimiento penal conocido como 'caso Plus Ultra'. Se incoaron en 2021 en el Juzgado de Instrucción nº 15 de Madrid (jueza Esperanza Collazos), a raíz del rescate público de unos 53 millones de euros concedido a la aerolínea Plus Ultra a través del fondo de la SEPI, tras una denuncia a la que se adhirieron PP y Vox. La jueza Collazos archivó en enero de 2023 la pieza relativa a la SEPI por no apreciar indicios penales en la concesión del préstamo; posteriormente se reactivó la investigación sobre el destino final de los fondos. De la causa dimana la Pieza Separada 62/2025, declarada secreta, en cuyo marco la UDEF elaboró los informes 1907 y 1908 que conectan la trama con José Luis Rodríguez Zapatero y operaciones de hidrocarburos venezolanos. El 3 de marzo de 2026 la Audiencia Nacional (Juzgado Central de Instrucción nº 4, juez José Luis Calama) asumió la competencia; Zapatero fue imputado el 19/05/2026 por presuntos delitos de tráfico de influencias y blanqueo de capitales. Rige la presunción de inocencia respecto de todos los investigados."
    # sources: 3 url(s)
  - entity_id: "Court:tribunal-constitucional"
    name: "Tribunal Constitucional"
    resumen: "El Tribunal Constitucional (TC) es el órgano constitucional encargado de la interpretación suprema de la Constitución española y del control de constitucionalidad de las leyes, así como de la protección de derechos fundamentales por la vía del recurso de amparo. En esta base aparece citado de forma incidental en resoluciones y documentos del caso como referencia jurisprudencial o doctrinal -por ejemplo, su doctrina sobre la inviolabilidad del domicilio o sentencias invocadas en sede parlamentaria-, no como órgano instructor de estas causas penales, cuya competencia corresponde al Tribunal Supremo, a la Audiencia Nacional y a los juzgados de instrucción."
    # sources: 2 url(s)
  - entity_id: "Contract:contrato-ar-15-10-2020"
    name: "Contrato AR 15-10-2020"
    resumen: "'Contrato AR 15-10-2020.pdf' es la denominación de un archivo que, según el informe de la UDEF (informe-udef-1907), Julio Martínez Martínez envió el 13/10/2020 y que se corresponde con un contrato de prestación de servicios de asesoramiento fechado el 30/07/2020. El 'AR' alude a la sociedad prestadora del servicio, ANÁLISIS RELEVANTE; en esa primera versión no constaban los datos del receptor y, en una remisión posterior (18/10/2020, devuelta por 'Francisco Flores'), el contrato aparece cumplimentado con los datos de la mercantil APAMATE CORPORATE AND TRUST, cuyo administrador único es Carlos Alberto Parra Delgado. Su cláusula tercera ('Alcance de los servicios') contemplaba la entrega de un informe mensual sobre 'las claves relevantes de la situación política, económica y social en el mundo'. Es un documento de prueba dentro de la instrucción; las valoraciones del informe policial están sujetas a presunción de inocencia y no son hechos probados."
    # sources: 1 url(s)
  - entity_id: "Contract:contrato-idella-aldesa-de-01-10-2021"
    name: "Contrato Idella-Aldesa de 01/10/2021"
    resumen: "Según el auto del juez José Luis Calama (Audiencia Nacional, 'caso Plus Ultra') y los informes de la UDEF, el 01/10/2021 se documenta actividad contractual entre el entorno de Julio Martínez Martínez y Grupo Aldesa. Las fuentes periodísticas presentan datos parcialmente divergentes: algunas describen un contrato de Idella Consulenza Strategica con Aldesa para la 'búsqueda de oportunidades de negocio y su intermediación' (3% del valor), y otras una remuneración periódica de 5.000 euros mensuales más IVA -actualizada por un contrato de 15/09/2022- atribuida a Análisis Relevante S.L. (representada en algunas piezas por Alejandro Fernández Ruiz). El instructor relaciona estos vínculos con abonos de Grupo Aldesa en torno a 127.050 euros en cuentas de Análisis Relevante, dentro de la presunta estructura para canalizar pagos hacia el entorno de José Luis Rodríguez Zapatero. La UDEF describe estas mercantiles como 'piezas instrumentales'. Rige la presunción de inocencia y la causa está en instrucción, sin condena. No está acreditado que el nombre 'Idella-Aldesa' sea erróneo: Idella sí figura como contraparte de Aldesa en una pieza."
    # sources: 3 url(s)
  - entity_id: "Contract:contrato-idella-plus-ultra-19-01-2021"
    name: "Contrato Idella-Plus Ultra 19/01/2021"
    resumen: "Es el documento que la UDEF y el auto de Calama señalan como pieza clave del 'caso Plus Ultra': un contrato suscrito el 19/01/2021 entre Idella Consulenza Strategica SL -representada por el empresario Julio Martínez Martínez, presentado como pagador del entorno de Zapatero- y Plus Ultra Líneas Aéreas SA -representada por su presidente y principal accionista, Julio Martínez Sola-. Según el auto, estipulaba como remuneración el 1% más IVA del importe de la ayuda aprobada por el fondo de rescate en favor de Plus Ultra, con referencias a servicios de orientación, valoración y preparación de la solicitud ante la SEPI. El rescate de 53 millones de euros (FASEE) se aprobó en marzo de 2021. El contrato se halló en un registro en Petrer (Alicante) y la UDEF destaca un correo de 23/02/2021 con asunto 'copia contrato honorario SEPI'. Rige la presunción de inocencia; la causa está en instrucción y no consta condena."
    # sources: 3 url(s)
  - entity_id: "Court:audiencia-provincial-de-madrid"
    name: "Audiencia Provincial de Madrid"
    resumen: "La Audiencia Provincial de Madrid es el tribunal colegiado que conoce en segunda instancia (apelaciones) de los asuntos civiles y penales de la provincia de Madrid. Su Sección 23ª (de lo Penal) ha intervenido resolviendo recursos vinculados al procedimiento contra Begoña Gómez, esposa del presidente del Gobierno, instruido por el Juzgado de Instrucción nº 41 de Madrid (juez Juan Carlos Peinado); entre otras decisiones, estimó parcialmente los recursos de Gómez, Cristina Álvarez y Juan Carlos Barrabés y anuló la decisión del instructor de enjuiciar el caso mediante un jurado popular. Actúa como órgano de garantía y revisión de las decisiones del instructor, sin prejuzgar el fondo; los afectados están investigados y rige la presunción de inocencia. No debe confundirse con la Audiencia Nacional (que instruye los casos Plus Ultra/Zapatero, Koldo y Cerdán)."
    # sources: 2 url(s)
  - entity_id: "Contract:contrato-analisis-relevante-corpoestructura"
    name: "Contrato Análisis Relevante - Corpoestructura"
    resumen: "Según el auto de Calama, en 2021 (fecha citada como 01/04/2021) se suscribió un contrato de prestación de servicios entre Análisis Relevante S.L. y Corpoestructura -gestionada por Rodolfo Reyes Rojas, accionista de Plus Ultra y entonces administrador solidario de la mercantil- por un periodo de 40 meses y un importe total de 484.000 euros (en torno a 10.000-12.100 euros mensuales más IVA según las fuentes). El instructor lo enmarca entre los contratos que, según la investigación, servirían para dar apariencia de legalidad a pagos dentro del presunto entramado de tráfico de influencias en torno al rescate de Plus Ultra (53 millones de la SEPI). Análisis Relevante, controlada por Julio Martínez Martínez, es descrita por la UDEF como 'pieza instrumental' del entramado. Rige la presunción de inocencia; la causa está en instrucción y no hay condena."
    # sources: 2 url(s)
  - entity_id: "Contract:contrato-de-asesoramiento-de-01-10-2021"
    name: "Contrato de asesoramiento de 01/10/2021"
    resumen: "Es el contrato/remuneración de asesoramiento fechado el 01/10/2021 que, según fuentes sobre el auto de Calama, vincula a Análisis Relevante S.L. (mercantil de Julio Martínez Martínez) con Grupo Aldesa, con honorarios de 5.000 euros mensuales más IVA, posteriormente actualizados por un nuevo contrato de 15/09/2022. El instructor lo relaciona con abonos de Grupo Aldesa en torno a 127.050 euros y a la presunta operativa para canalizar pagos hacia el entorno de Zapatero. En la misma fecha (01/10/2021) las fuentes citan también un contrato de intermediación de Idella Consulenza Strategica con Aldesa (3% del valor), por lo que no está claro si ambos son el mismo contrato o piezas relacionadas pero distintas. Rige la presunción de inocencia; causa en instrucción, sin condena."
    # sources: 2 url(s)
  - entity_id: "Contract:contrato-de-prestacion-de-servicios-whathefav-analisis-relev"
    name: "Contrato de prestación de servicios Whathefav-Análisis Relevante"
    resumen: "Hace referencia al contrato y facturación de 'prestación de servicios' suscrito el 1 de junio de 2020 entre Análisis Relevante SL (mercantil de Julio Martínez Martínez, señalado por la investigación como presunto testaferro del expresidente) y Whathefav SL, agencia de comunicación administrada por Alba y Laura Rodríguez Espinosa, hijas del expresidente José Luis Rodríguez Zapatero. La documentación fue intervenida en la instrucción del 'caso Plus Ultra' que dirige el juez José Luis Calama en la Audiencia Nacional. Según el informe de la UDEF recogido en el auto, los informes mensuales eran elaborados para Análisis Relevante y solo 'maquetados' o difundidos por Whathefav, por lo que la policía infiere que el contrato podía servir de cobertura formal a una contraprestación económica; las facturas intervenidas, emitidas entre 2020 y 2024, se justificaban con el concepto genérico de 'servicios de agencia' sin detallar el trabajo realizado. La UDEF cifra en unos 239.755 euros lo transferido por Análisis Relevante a Whathefav por esta vía. Se trata de caracterizaciones de una instrucción en curso: no existe sentencia ni culpabilidad probada, y las sociedades, sus administradoras y Zapatero están amparados por la presunción de inocencia."
    # sources: 4 url(s)

  # --- enriquecimiento swarm 2026-06-01 (nodos sin revisar) ---
  - entity_id: "Organization:opr"
    name: "OPR"
    updated: "2026-06-01"
    resumen: "OPR (Obras Publicas y Regadios) es una empresa constructora vinculada a los hermanos Daniel y Antonio Fernandez Menendez, que figuran como administrador y apoderado de la sociedad. Segun informes de la UCO recogidos en la prensa, OPR y Construcciones Perez Jimenez obtuvieron adjudicaciones de obra publica de la Direccion General de Carreteras y Adif en Asturias, Ubeda (Jaen) y Monforte (Lugo) entre 2019 y 2021, por un importe cercano a diez millones de euros. La UCO sostiene en sus pesquisas que OPR habria pagado 1.300 euros mensuales al entorno de Koldo Garcia entre septiembre de 2022 y junio de 2023, y que en los registros aparecio documentacion sobre adjudicaciones del Ministerio de Fomento. La empresa aparece asi senalada en la investigacion del 'caso Koldo' por presunto amano de licitaciones, en relacion con Koldo Garcia (exasesor del exministro Abalos) y el exsecretario de Organizacion del PSOE Santos Cerdan. Rige la presuncion de inocencia: se trata de indicios recogidos por la UCO en una causa en instruccion, no de hechos juzgados ni condenas firmes."
    sources:
      - "https://www.elindependiente.com/espana/2025/07/04/uco-constructores-caso-koldo/"
      - "https://www.elindependientedegranada.es/politica/uco-hallo-datos-adjudicaciones-contrato-obras-casa-hermano-koldo-esquema-sobre-abalos"
      - "https://www.vozpopuli.com/legal/un-juzgado-de-madrid-declara-en-concurso-a-una-de-las-constructoras-ligadas-a-koldo-garcia.html"
  - entity_id: "LegalCase:diligencias-previas-65-2023"
    name: "Diligencias Previas 65/2023"
    updated: "2026-06-01"
    resumen: "Las Diligencias Previas 65/2023, tramitadas por el Juzgado Central de Instruccion n.2 de la Audiencia Nacional (juez Ismael Moreno), constituyen la pieza matriz del llamado 'caso Koldo', sobre presuntas adjudicaciones irregulares de contratos de mascarillas durante la pandemia (entre otros, a Soluciones de Gestion) y comisiones asociadas. Por orden del Tribunal Supremo de 26 de julio de 2024 se atribuyo a ese juzgado la competencia sobre los contratos de los servicios de salud de Baleares y Canarias, manteniendo la Fiscalia Europea su competencia exclusiva sobre posibles delitos contra los intereses financieros de la UE. Entre los investigados figuran Victor de Aldama, Koldo Garcia y el exministro Jose Luis Abalos (este imputado en el Tribunal Supremo), a quienes se atribuyen presuntos delitos. Rige la presuncion de inocencia: causa en instruccion/enjuiciamiento, no condenas firmes."
    sources:
      - "https://www.libertaddigital.com/espana/2024-07-23/fiscalia-supremo-sostiene-caso-koldo-investigar-audiencia-nacional-fiscalia-europea-7149991/"
      - "https://www.elindependiente.com/espana/2026/04/05/guia-juicio-caso-mascarillas-quien-quien-que-juzga-abalos-koldo-aldama-sientan-banquillo/"
      - "https://www.noticiasdegipuzkoa.eus/politica/2026/02/23/juez-amplia-6-meses-instruccion-10737611.html"
  - entity_id: "Company:banco-santander"
    name: "Banco Santander"
    updated: "2026-10-04"
    resumen: "Banco Santander, S.A. es una entidad de credito espanola con sede social en Cantabria, presidida por Ana Botin. En el contexto de estas causas aparece principalmente como entidad financiera operativa: cuentas, transferencias, pagos y rastreo de movimientos analizados por la UCO y la ONIF en los informes patrimoniales. No consta que el banco sea investigado como parte de la trama; su presencia en esta base deriva de ser el banco a traves del cual se canalizaron operaciones de personas o sociedades investigadas. Rige la presuncion de inocencia respecto a cualquier tercero mencionado."
    sources:
      - "https://www.bancosantander.es/"
      - "https://www.cnmv.es/"
  - entity_id: "Person:marga-prohens"
    name: "Marga Prohens"
    updated: "2026-06-01"
    resumen: "Política del Partido Popular, preside el Govern balear desde julio de 2023 tras encabezar la oposición a Francina Armengol. En el marco del caso Koldo/mascarillas compareció ante la comisión de investigación del Congreso (mayo de 2024), donde aportó documentación del Servicio de Protocolo para sostener que Koldo García figuraba entre los acompañantes de José Luis Ábalos en un encuentro de marzo de 2021 en Palma, contradiciendo la versión de Armengol. Su papel es el de cargo político compareciente; no consta investigada en estas causas. Como presidenta del Govern impulsó la reclamación de fondos públicos pagados por material sanitario durante la pandemia."
    sources:
      - "https://theobjective.com/espana/politica/2024-05-27/armengol-congreso-koldo/"
      - "https://www.elespanol.com/espana/politica/20240527/pp-cita-armengol-comision-caso-koldo-senado-semana-europeas/858414592_0.html"
  - entity_id: "Company:summer-wind"
    name: "Summer Wind"
    updated: "2026-06-01"
    resumen: "Sociedad madrilena dedicada, segun ella misma, a la intermediacion y broker aeronautico (alquiler de aviones a Plus Ultra). Aparece en el caso Plus Ultra instruido por el juez Jose Luis Calama, donde la UDEF sospecho que pudo actuar como sociedad interpuesta para canalizar fondos relacionados con la aerolinea; en mayo de 2026 el juez le rechazo acceder a las actuaciones al no acreditar interes legitimo, dejando constancia de que no esta investigada, perjudicada ni victima en la causa. Summerwind niega ser empresa pantalla: alega que no recibio 3,9 millones de Plus Ultra, sino que pago a la aerolinea mas de 3,2 millones como broker, y que su contrato de consultoria con Afitta (213.202 euros, firmado en 2023) responde a servicios reales declarados a Hacienda. Rige la presuncion de inocencia: son sospechas de la investigacion, no hechos probados."
    sources:
      - "https://www.infobae.com/espana/agencias/2026/05/25/summerwind-alega-al-juez-del-caso-plus-ultra-que-no-recibio-fondos-de-la-aerolinea/"
      - "https://www.infobae.com/espana/agencias/2026/05/28/el-juez-rechaza-que-summerwind-acceda-a-las-actuaciones-del-caso-plus-ultra/"
      - "https://www.eldiario.es/politica/summerwind-desmiente-udef-advierte-juez-calama-no-son-empresa-pantalla-trama-alquila-aviones-plus-ultra_1_13252094.html"
  - entity_id: "Company:afitta-sl"
    name: "Afitta SL"
    updated: "2026-06-01"
    resumen: "Mercantil que el juez Jose Luis Calama atribuye a la red de Julio Martinez Martinez, descrito en el caso Plus Ultra como 'amigo personal y presunto colaborador' del expresidente Jose Luis Rodriguez Zapatero. Era una sociedad sin actividad reciente que cambio de manos en mayo de 2021, durante el despliegue del rescate, asumiendo Julio Martinez su administracion unica. Recibio 213.202 euros de Summerwind SL en virtud de un contrato de consultoria de 2023 para servicios de negociacion de operaciones aeronauticas. La instruccion examina si esos flujos formaron parte de un presunto esquema de trafico de influencias en torno al rescate publico de Plus Ultra (53 millones, marzo de 2021). Rige la presuncion de inocencia: el contrato es presentado por las partes como real y declarado a Hacienda; son hipotesis de investigacion, no hechos probados."
    sources:
      - "https://www.actualidad.es/politica/2026/05/25/acusaciones-de-la-udef-julio-martinez-redes-societarias-y-el-rescate-de-plus-ultra/"
      - "https://www.infobae.com/espana/agencias/2026/05/25/summerwind-alega-al-juez-del-caso-plus-ultra-que-no-recibio-fondos-de-la-aerolinea/"
      - "https://www.mundiario.com/articulo/politica/empresario-julio-martinez-reactivo-tres-sociedades-clave-trama-plus-ultra/20260521123324387329.html"
  - entity_id: "Person:federico-lledo-soria"
    name: "Federico Lledo Soria"
    updated: "2026-06-01"
    resumen: "Federico Lledo Soria figura como apoderado solidario de Summer Wind SL hasta 2023, sociedad que segun fuentes periodisticas habria recibido unos 3.979.182 euros de Plus Ultra en 2023 y, a su vez, habria realizado pagos (cifrados por la prensa en torno a 213.202 euros) a Afitta SL, mercantil vinculada a Julio 'Julito' Martinez Martinez, presunto testaferro del entorno investigado de Zapatero. Segun esas mismas fuentes, en 2023 la administracion unica de Summer Wind paso formalmente a Maria Elena Lledo Gomez. La empresa ha emitido un comunicado distanciandose y afirmando que su gestion y propiedad actuales son independientes de los administradores previos. Los hechos estan en fase de investigacion y no han sido juzgados: rige la presuncion de inocencia."
    sources:
      - "https://www.elcorreogallego.es/espana/2026/05/22/empresa-cobro-4-millones-plus-zapatero-mordida-summer-wind-julito-130529235.html"
      - "https://www.elcorreogallego.es/espana/2026/05/22/plus-ultra-pago-4-millones-130522174.html"
  - entity_id: "Organization:direccion-general-del-agua"
    name: "Direccion General del Agua"
    updated: "2026-06-01"
    resumen: "La Direccion General del Agua es el organo directivo del Ministerio para la Transicion Ecologica y el Reto Demografico (MITECO) encargado de la politica del agua, que gestiona el dominio publico hidraulico de las cuencas intercomunitarias y a traves del cual las Confederaciones Hidrograficas (organismos autonomos con personalidad juridica propia) quedan adscritas al Ministerio. En el informe de la Guardia Civil aparece en el contexto de contrataciones de equipos de proteccion y suministros tramitadas por organismos del agua (p. ej. la Confederacion Hidrografica del Tajo) durante la pandemia. Su mencion es como organismo publico de contratacion dentro del analisis de adjudicaciones, sin que ello implique imputacion alguna."
    sources:
      - "https://www.miteco.gob.es/es/agua.html"
      - "https://www.miteco.gob.es/en/ministerio/organizacion/organismos-publicos/confederaciones-hidrograficas.html"
  - entity_id: "Organization:udef"
    name: "UDEF"
    updated: "2026-06-01"
    resumen: "La UDEF (Unidad de Delincuencia Economica y Fiscal), creada en 2005 (en el contexto de las investigaciones de corrupcion en Marbella) e integrada como una de las unidades de la Comisaria General de Policia Judicial del Cuerpo Nacional de Policia, es la unidad policial especializada en corrupcion, blanqueo de capitales y fraude financiero; entre sus brigadas figura la dedicada a blanqueo de capitales y anticorrupcion. En estos casos elabora informes (citados como 'informe 1907 UDEF-BBCA' e 'informe 5183 UDEF-BBCA') y ha participado, junto al GOIT, en actuaciones recientes del entorno investigado de Jose Luis Rodriguez Zapatero. Es organo instructor-policial, no parte investigada."
    sources:
      - "https://www.newtral.es/udef-que-es-organizacion-policia-nacional/20220222/"
      - "https://theobjective.com/espana/2026-05-20/udef-goit-policia-nacional-investigacion-zapatero/"
  - entity_id: "Organization:movil"
    name: "Movil"
    updated: "2026-06-01"
    resumen: "El nodo 'Movil' es incoherente y producto de la ingesta. Su nombre y el alias 'Plataforma Movil' provienen casi con seguridad de metadatos de OCR de los informes UCO, donde 'Plataforma: Movil' es un campo de las capturas de WhatsApp, no una organización. Algunos de sus alias remiten además al Parque Móvil del Estado (organismo autónomo del Ministerio de Hacienda que presta servicios de vehículos con conductor a la Administración), pero esa atribución no está verificada con fuente y conviene tratarla con cautela. En conjunto el nodo debe limpiarse/separarse y no representa una entidad única."
    sources:
      - "https://www.hacienda.gob.es/es-ES/Areas%20Tematicas/ParqueMovil/Paginas/Parque%20Movil%20del%20Estado.aspx"
      - "https://es.wikipedia.org/wiki/Parque_M%C3%B3vil_del_Estado"
  - entity_id: "Company:raminatrans"
    name: "Raminatrans"
    updated: "2026-06-01"
    resumen: "Raminatrans S.L. es una compañía española de transporte y logística (transitaria) presidida por Rafael Milla. Según la instrucción del 'caso Koldo' en la Audiencia Nacional, intervino en el transporte de mascarillas relacionadas con la adquisición de ADIF vinculada a la empresa Soluciones de Gestión de Víctor de Aldama durante la pandemia; la prensa la sitúa como transitario propuesto por Francisco Toledo. En abril de 2025 el juez Ismael Moreno requirió a su presidente las actas y albaranes de entrega para esclarecer contradicciones entre testimonios: Milla declaró haber transportado unos 5 millones de mascarillas a instalaciones de ADIF, mientras que la expresidenta de ADIF Isabel Pardo de Vera declaró haber recibido 300.000, lo que dejaría unos 4,7 millones sin localizar. No consta que la empresa esté imputada; opera bajo presunción de inocencia."
    sources:
      - "https://theobjective.com/espana/tribunales/2025-04-16/juez-caso-koldo-actas-mascarillas/"
      - "https://www.infobae.com/espana/agencias/2025/04/16/el-juez-del-caso-koldo-en-la-audiencia-nacional-pide-a-raminatrans-las-actas-de-mascarillas-adquiridas-por-adif/"
      - "https://www.moncloa.com/2025/04/19/mascarillas-perdidas-adif-3222488"
  - entity_id: "Organization:seguridad-social"
    name: "Seguridad Social"
    updated: "2026-10-04"
    resumen: "La Seguridad Social es el sistema público español de protección social; sus referencias en esta base corresponden a la Tesorería General de la Seguridad Social y a los Servicios Comunes. Aparece de forma tangencial en la documentación de los casos (auditorías e informes UCO), normalmente como organismo administrativo o como contexto, no como parte investigada. No es un actor central de las tramas."
    sources:
      - "https://www.seg-social.es/"
  - entity_id: "Contract:014-20-ed"  # rekey s91: LegalCase→Contract (qa_migration_20260902-splits)
    name: "014/20-ED"
    updated: "2026-06-01"
    resumen: "014/20-ED es un expediente de contratación de la entidad pública Red.es, vinculado a la adjudicación de servicios de digitalización en la que participaron Innova Next SLU (sociedad del grupo de Juan Carlos Barrabés), The Valley Digital y KPMG Asesores. Según un informe pericial de un técnico de Hacienda recogido en la causa, se habría excluido sin justificación razonable a una oferta rival (UTE Awakelab), más económica, lo que benefició a la adjudicataria. La Fiscalía Europea investiga la legalidad del proceso por estar implicados fondos europeos y tiene investigado/imputado al directivo de Red.es Luis Prieto Cuerdo, a quien se atribuye la responsabilidad sobre la exclusión; David Cierco era entonces director general de Red.es. Todo ello bajo presunción de inocencia."
    sources:
      - "https://www.elindependiente.com/espana/2025/10/01/fiscalia-europea-tiene-imputado-directivo-red-es-sigue-oscar-lopez/"
      - "https://okdiario.com/espana/hacienda-revela-que-red-bajo-forma-ilogica-nota-otro-rival-dar-25-millones-barrabes-15509860"
  - entity_id: "Organization:autoridad-de-auditoria"
    name: "Autoridad de Auditoría"
    updated: "2026-06-01"
    resumen: "En el grafo, 'Autoridad de Auditoría' designa de forma genérica al equipo/actuación de auditoría interna del Ministerio de Transportes y Movilidad Sostenible sobre los expedientes de adquisición de mascarillas durante la pandemia, encargada en 2024 por el ministro Óscar Puente y desarrollada por inspectoras del Departamento (en la prensa se identifica a Sara Anguita y Ana Balbás). La auditoría examinó contratos de Puertos del Estado y ADIF (en torno a 36 millones de euros), revisó miles de correos y archivos y apreció, entre otras cosas, indicios de que la empresa de Aldama (Soluciones de Gestión) tuvo acceso a la operación antes de su publicación oficial. No es una 'Autoridad de Auditoría' formal de fondos europeos, sino la actuación inspectora interna del Ministerio."
    sources:
      - "https://www.elindependiente.com/espana/2026/04/23/auditoras-transportes-ratifican-empresa-aldama-conocia-compra-mascarillas-antes-de-publicarse-alguien-se-lo-comunico/"
      - "https://theobjective.com/espana/tribunales/2024-10-21/cargo-transportes-juez-actas-mascarillas/"
  - entity_id: "Company:telefonica"
    name: "Telefónica"
    updated: "2026-06-01"
    resumen: "Telefónica es la principal operadora de telecomunicaciones de España, con presencia en Europa y Latinoamérica. En el caso de la cátedra de Begoña Gómez aparece como una de las empresas con las que la esposa del presidente del Gobierno habría mantenido contactos en el marco de su actividad universitaria (cátedra extraordinaria de la Universidad Complutense). No consta que Telefónica esté investigada ni imputada; su mención en el grafo deriva de reuniones (MET_WITH) atribuidas en la documentación y de su perfil como gran patrocinador corporativo. José María Álvarez-Pallete presidió la compañía desde 2016 hasta enero de 2025, cuando el consejo, en una decisión impulsada por la entrada de la SEPI en el capital, nombró presidente ejecutivo a Marc Murtra en su sustitución."
    sources:
      - "https://www.telefonica.com/es/"
      - "https://es.wikipedia.org/wiki/Telef%C3%B3nica"
      - "https://es.euronews.com/2025/01/18/cambio-historico-en-telefonica-marc-murtra-sustituye-a-alvarez-pallete-como-presidente-eje"
  - entity_id: "Company:villafuel"
    name: "VILLAFUEL"
    updated: "2026-06-01"
    resumen: "Villafuel SL es una sociedad inscrita como operador al por mayor de productos petrolíferos. Según la instrucción del Juzgado Central de Instrucción nº 5 de la Audiencia Nacional (juez Santiago Pedraz), habría sido el vértice de una estructura societaria empleada presuntamente para defraudar el IVA de los hidrocarburos, con un perjuicio cuantificado en torno a 182,5 millones de euros entre 2022 y 2024 (cifra que investigaciones posteriores de la Guardia Civil han elevado). La investigación atribuye a Víctor de Aldama y a Claudio Rivas un papel directivo en esa presunta organización, que operaba a través de una red de empresas suministradoras (Canary Islands Fuel, Salamanca Fuel Center, Obaoil 3000, etc.). Todos los implicados están investigados y rige la presunción de inocencia; no hay sentencia. El grafo la vincula con Aldama y con el Ministerio de Transportes, conexión esta última que conviene tomar con cautela."
    sources:
      - "https://es.wikipedia.org/wiki/Trama_de_los_hidrocarburos"
      - "https://www.elespanol.com/invertia/empresas/energia/20241011/villafuel-canary-island-fuel-salamanca-trama-crudo-aldama-defraudo-millones/892411335_0.html"
      - "https://www.infobae.com/espana/agencias/2025/01/21/investigadas-34-personas-fisicas-y-49-juridicas-por-el-fraude-de-hidrocarburos-de-aldama/"
      - "https://www.moncloa.com/2025/06/04/hidrocarburos-182-millones-3235700/"
  - entity_id: "Contract:016-20-ed"  # rekey s91: LegalCase→Contract (qa_migration_20260902-splits)
    name: "016/20-ED"
    updated: "2026-06-01"
    resumen: "El 016/20-ED es un expediente de licitación de la entidad pública Red.es, con objeto la prestación de servicios de formación especializada (ciberseguridad, big data, cloud) para personas desempleadas, con un presupuesto base de 9.090.909 euros (Lote 1 adjudicado a una UTE por unos 3.636.363,64 euros). Forma parte del grupo de contratos de Red.es examinados en la instrucción del 'caso Begoña Gómez', en la que un informe pericial de la IGAE apreció presunto 'fraude de ley' y opacidad en adjudicaciones a sociedades vinculadas a Carlos Barrabés, supuestamente favorecidas tras dos cartas de recomendación de Begoña Gómez en julio de 2020; el informe sostiene que la adjudicación del Lote 1 debió declararse nula al excluirse sin fundamento a un competidor mejor valorado (Awakelab). Se trata de hechos bajo investigación judicial; rige la presunción de inocencia."
    sources:
      - "https://perfilcontratante.red.es/perfilcontratante/busqueda/DetalleLicitacionesDefault.action?idLicitacion=7149"
      - "https://okdiario.com/espana/informe-pericial-acorrala-barrabes-begona-fraude-ley-contratos-106-millones-15487133"
      - "https://www.elespanol.com/espana/tribunales/20250929/intervencion-dice-contratos-barrabes-begona-gomez-apoyo-pudieron-incurrir-fraude-ley/1003743946044_0.html"
  - entity_id: "Organization:estado-mayor-del-ejercito-de-tierra"
    name: "Estado Mayor del Ejército de Tierra"
    updated: "2026-06-01"
    resumen: "El Estado Mayor del Ejército de Tierra es el principal órgano auxiliar de mando del Jefe de Estado Mayor del Ejército de Tierra (JEME), encuadrado en el Ministerio de Defensa. En la documentación del caso aparece a través de la estructura económico-logística del Ejército (la Jefatura de Asuntos Económicos del Mando de Apoyo Logístico, unidad real conforme a la organización publicada en el BOE), en el contexto del informe de auditoría sobre la adquisición de mascarillas durante la pandemia. Su mención es de carácter administrativo-logístico; no consta imputación ni atribución de conducta ilícita al organismo. El grafo agrupa bajo este nodo varias unidades económicas del Ejército, lo que conviene tratar como un alias funcional más que como entidades distintas."
    sources:
      - "https://es.wikipedia.org/wiki/Estado_Mayor_del_Ej%C3%A9rcito_de_Tierra_(Espa%C3%B1a)"
      - "https://www.boe.es/buscar/doc.php?id=BOE-A-2020-8636"
      - "https://ejercito.defensa.gob.es/"
  - entity_id: "Person:manuel-candalija-valle"
    name: "Manuel Candalija Valle"
    updated: "2026-07-14"
    resumen: "Manuel Candalija Valle es director del Area de Cultura de la Diputacion de Badajoz; en 2017, como Jefe de Servicio de Actividades Culturales, formo parte de la comision asesora que valoro los curriculos y entrevisto a David Sanchez. El 14 de julio de 2026, la Audiencia Provincial de Badajoz lo condeno (sentencia 152/2026) como cooperador necesario de un delito de prevaricacion administrativa (Bloque C: firmo en 2023, como Director del Area de Cultura, la propuesta de modificacion de la RPT que creo la Jefatura de Seccion de Actividades Transfronterizas cubierta por Luis Carrero, unico aspirante) a 9 anos de inhabilitacion especial, y lo absolvio del resto. La sentencia NO es firme: cabe apelacion ante el TSJ de Extremadura y rige la presuncion de inocencia."
    sources:
      - "https://www.esdiario.com/nacional/260528/188986/caso-david-sanchez-i-otros-imputados.html"
      - "https://www.infobae.com/espana/agencias/2026/05/27/dos-delitos-11-investigados-y-42-testigos-la-guia-en-cifras-del-juicio-a-david-sanchez/"
      - "https://theobjective.com/espana/tribunales/2025-09-15/denuncia-diputacion-badajoz-imputado-david-sanchez-enchufe-candalija-biedma/"
  - entity_id: "Company:deluxe-fortune-sl"
    name: "Deluxe Fortune SL"
    updated: "2026-06-01"
    resumen: "Deluxe Fortune S.L. es una de las sociedades vinculadas a Victor de Aldama, comisionista senalado como pieza central del 'caso Koldo'. Segun el informe de la Agencia Tributaria remitido a la Audiencia Nacional, Aldama habria utilizado Deluxe Fortune (junto con MTM 180 Capital S.L.) para canalizar la facturacion de sus servicios derivados del negocio de las mascarillas durante la pandemia de 2020 y reducir su tributacion personal; Hacienda estima que defraudo unos 2,4 millones de euros en 2020 (1,6 millones tras descontar lo abonado por esas sociedades en el impuesto de sociedades). La empresa figura asi como presunto vehiculo para canalizar ingresos dentro de la trama de las mascarillas. Todo ello en fase de instruccion y bajo presuncion de inocencia."
    sources:
      - "https://www.infobae.com/espana/agencias/2026/04/22/hacienda-estima-que-aldama-defraudo-24-millones-en-2020-por-el-negocio-de-las-mascarillas/"
      - "https://www.eldiario.es/politica/hacienda-concluye-aldama-defraudo-2-4-millones-contratos-mascarillas_1_13164191.html"
  - entity_id: "Organization:direccion-general-de-organizacion-e-inspeccion"
    name: "Dirección General de Organización e Inspección"
    updated: "2026-06-01"
    resumen: "La Direccion General de Organizacion e Inspeccion es un organo de la Subsecretaria del Ministerio de Transportes (hoy Transportes y Movilidad Sostenible) encargado de la organizacion interna, inspeccion de servicios y auditorias del departamento. Bajo su direccion se elaboro el informe de auditoria sobre la adquisicion de mascarillas por procedimiento de emergencia durante la pandemia, encargado por el ministro Oscar Puente en febrero de 2024 y fechado el 19 de agosto de 2024, documento incorporado al 'caso Koldo' (analiza la compra de ocho millones de mascarillas por Puertos del Estado y cinco millones por Adif en marzo de 2020). Maria Belen Villar Sanchez es directora general de este organo, bajo cuya direccion se realizo la auditoria. El exministro Jose Luis Abalos se querello contra los autores de esa auditoria (Belen Villar y el perito que la elaboro) por presunta falsedad documental y falso testimonio pericial; las defensas de investigados (Koldo Garcia) han pedido citar como testigos a sus responsables. El organo es un ente administrativo legitimo, no un investigado."
    sources:
      - "https://www.transportes.gob.es/ministerio/organizacion-y-funciones/subsecretaria-de-transportes-y-movilidad-sostenible/direccion-general-de-organizacion-e-inspeccion"
      - "https://www.transportes.gob.es/el-ministerio/sala-de-prensa/noticias/mar-27022024-1836"
      - "https://www.elindependiente.com/espana/2025/07/28/abalos-se-querella-contra-el-ministerio-de-transportes-por-la-auditoria-sobre-la-compra-mascarillas/"
  - entity_id: "Person:gaspar-carlos-zarrias-arevalo"
    name: "Gaspar Carlos Zarrías Arévalo"
    updated: "2026-06-01"
    resumen: "Gaspar Carlos Zarrias Arevalo es un veterano dirigente del PSOE andaluz que fue consejero de Presidencia (y vicepresidente) de la Junta de Andalucia y secretario de Estado de Cooperacion Territorial. En mayo de 2026 la UCO registro la sede de su consultora (Zano/Zano Sociedad Consultora S.L.) en el marco de la investigacion de la Audiencia Nacional sobre Leire Diez, la llamada 'fontanera' del PSOE; el juez Pedraz le ha imputado en esa causa. Zarrias reconoce haber contratado a Diez (presuntamente unos 4.000 euros mensuales durante cuatro meses a traves de Zano) para investigar una supuesta implicacion del comisario jubilado Jose Manuel Villarejo en la causa de los ERE. Fue juzgado y condenado en la pieza politica del caso de los ERE (Audiencia de Sevilla), fallo posteriormente afectado por resoluciones del Tribunal Constitucional que han ordenado revisar varias de esas condenas. Esta investigado/imputado bajo presuncion de inocencia en la causa de Leire Diez."
    sources:
      - "https://www.eldebate.com/espana/andalucia/20260527/uco-registra-despacho-gaspar-zarrias-exconsejero-junta-condenado-caso-ere_422013.html"
      - "https://theobjective.com/espana/tribunales/2026-05-27/guardia-civil-sede-consultora-socialista-gaspar-zarrias/"
      - "https://theobjective.com/espana/tribunales/2026-05-27/golpe-psoe-cloacas-juez-gerente-partido/"
      - "https://www.eleconomista.es/actualidad/noticias/13940595/05/26/gaspar-zarrias-el-socialista-andaluz-que-contrato-a-la-fontanera-leire-y-que-no-tiene-carne-del-psoe.html"
  - entity_id: "Court:jci-numero-2"
    name: "JCI número 2"
    updated: "2026-10-04"
    resumen: "El Juzgado Central de Instruccion numero 2 es uno de los juzgados centrales de instruccion de la Audiencia Nacional, con competencia sobre delitos de ambito nacional (terrorismo, corrupcion de relevancia estatal, etc.). Es un organo judicial legitimo. En esta base aparece vinculado a querellas de asociaciones (Manos Limpias, Hazte Oir, Vox, PP, Iustitia Europa/Abogados Democratas por Europa) relacionadas con el caso Begona Gomez; sin embargo, esa causa la instruye el Juzgado de Instruccion n 41 de Madrid (juez Juan Carlos Peinado), no la Audiencia Nacional, por lo que esas aristas parecen una atribucion erronea de la extraccion."
    sources:
      - "https://es.wikipedia.org/wiki/Caso_Bego%C3%B1a_G%C3%B3mez"
      - "https://www.publico.es/politica/tribunales/golpe-efecto-juez-peinado-acercar-begona-gomez-banquillo-dos-anos-polemica-instruccion.html"
  - entity_id: "Person:jacobo-teijelo"
    name: "Jacobo Teijelo"
    updated: "2026-06-25"
    resumen: "Jacobo Teijelo (su apellido aparece transcrito como 'Teijejo' en algún documento por una variante de OCR; el grafo lo conserva como alias) es un abogado penalista que en julio de 2025 se incorporó formalmente a la defensa de Santos Cerdán en el 'caso Koldo', en coordinación con el despacho de Benet Salellas. Su nombre saltó a la actualidad por aparecer en unos audios grabados en su despacho con la exmilitante del PSOE Leire Díez, en los que ella buscaba información sensible sobre guardias civiles de la UCO y fiscales de Anticorrupción. Teijelo ha denunciado que esas grabaciones fueron clandestinas y parciales y ha negado tener capacidad para ofrecer beneficios judiciales a cambio de información comprometida. Rige la presunción de inocencia: no consta que esté imputado por delito alguno en relación con estos hechos a fecha de los documentos disponibles."
    sources:
      - "https://www.elespanol.com/espana/politica/20250708/jacobo-teijelo-abogado-relacionado-leire-suma-defensa-cerdan-presunta-corrupcion/1003743839430_0.html"
      - "https://www.telemadrid.es/noticias/nacional/Jacobo-Teijelo-abogado-de-los-audios-de-Leire-Diez-se-suma-a-la-defensa-de-Cerdan-0-2795720442--20250708075959.html"
      - "https://theobjective.com/espana/tribunales/2025-07-08/abogado-audios-leire-diez-caso-koldo/"
  - entity_id: "Organization:plataforma-de-contratacion-del-sector-publico"
    name: "Plataforma de Contratación del Sector Público"
    updated: "2026-06-01"
    resumen: "La Plataforma de Contratación del Sector Público (PLACSP, antes Plataforma de Contratación del Estado o PLACE, dominio contrataciondelestado.es) es el nodo electrónico central del sector público español para publicar licitaciones, perfiles de contratante y resultados de adjudicación; la gestiona la Dirección General del Patrimonio del Estado del Ministerio de Hacienda y Función Pública. No es un actor de la trama, sino una fuente documental: en los informes de la UCO sobre la trama Cerdán/Ábalos se cita el portal para acreditar adjudicaciones de obra pública (p.ej. expedientes de ADIF y de carreteras presuntamente direccionados). Su aparición en el grafo es como sistema/registro consultado por los investigadores, no como entidad imputable."
    sources:
      - "https://contrataciondelestado.es/"
      - "https://www.gobierto.es/blog/plataforma-de-contratacion-del-sector-publico-placsp"
      - "https://administracionelectronica.gob.es/ctt/place"
  - entity_id: "Person:ruben-villalba-carnero"
    name: "Rubén Villalba Carnero"
    updated: "2026-06-01"
    resumen: "Rubén Villalba Carnero es un comandante de la Guardia Civil investigado en el 'caso Koldo'. Según el informe de la UCO, la trama le habría pagado unos 88.119 euros a cambio de presunta 'protección' a Koldo García y a Víctor de Aldama, que habría consistido -según los investigadores- en facilitarles teléfonos seguros y en dar de alta a Aldama como confidente/colaborador de la Dirección de Información de la Guardia Civil para alertarle de posibles investigaciones. Fue detenido en marzo en el aeropuerto de Madrid-Barajas, llegando de Málaga, cuando los agentes de la UCO sospechaban que su destino final podía ser Venezuela, donde había sido destinado a la embajada española. Está investigado por presunta integración en organización criminal, blanqueo de capitales y cohecho; rige la presunción de inocencia mientras no haya sentencia firme."
    sources:
      - "https://www.elespanol.com/espana/tribunales/20241009/trama-pago-euros-comandante-guardia-civil-cambio-proteccion-koldo-aldama/892161146_0.html"
      - "https://www.elespanol.com/espana/tribunales/20241010/guardia-civil-caso-koldo-dio-alta-aldama-confidente-saber-uco-investigaba/892161190_0.html"
      - "https://theobjective.com/espana/tribunales/2024-12-04/guardia-civil-trama-koldo-venezuela/"
  - entity_id: "Company:the-valley"
    name: "The Valley"
    updated: "2026-06-01"
    resumen: "The Valley Digital Business School, S.L. es una escuela de negocios especializada en transformación digital que aparece en el 'caso Begoña Gómez' como socia, en unión temporal de empresas (UTE), de Innova Next SLU, sociedad vinculada al empresario Juan Carlos Barrabés. Según la instrucción del juez Peinado y la investigación de la Fiscalía Europea, la UTE Innova Next / The Valley resultó adjudicataria de contratos públicos millonarios -entre ellos uno cercano a los 5 millones de euros para formación en empleo juvenil en la economía digital y otro de más de 3,6 millones para formación de desempleados- en cuya obtención habrían influido cartas de recomendación firmadas por Begoña Gómez desde la cátedra que codirigía en la Universidad Complutense. La empresa figura como adjudicataria/operadora económica; la investigación por presuntos delitos (tráfico de influencias, corrupción en los negocios) se centra en Gómez y Barrabés y no consta imputación penal de la propia mercantil. Presunción de inocencia."
    sources:
      - "https://www.infobae.com/espana/2026/05/05/begona-gomez-niega-ante-la-fiscalia-europea-haber-influido-en-contratos-publicos-adjudicados-a-empresas-de-juan-carlos-barrabes/"
      - "https://theobjective.com/espana/tribunales/2026-04-14/fiscalia-europea-contratos-barrabes-begona-gomez/"
      - "https://edatv.news/politica/gobierno-otorgo-subvencion-millonaria-empresa-vinculada-al-socio-begona-gomez"
  - entity_id: "Company:transforma-tsc-s-l"
    name: "Transforma TSC, S.L."
    updated: "2026-06-01"
    resumen: "Transforma TSC, S.L. es una sociedad limitada constituida en noviembre de 2023 y administrada por Begoña Gómez, con el mismo nombre que la marca 'TSC' (Transformación Social Competitiva) y la cátedra que ella codirigía en la Universidad Complutense de Madrid. Según el informe de la UCO remitido al juez Peinado, Gómez registró la marca 'TSC' (por unos 206,57 euros) a través de una cuenta bancaria que comparte con su marido, Pedro Sánchez; la UCO documenta que la mercantil tuvo actividad comercial real (pagos por unos 6.688 euros procedentes de la empresa Innovación Hexagonal) entre noviembre de 2023 y junio de 2024, y aprecia una analogía con el software desarrollado en el marco de la cátedra de la UCM, lo que alimenta la sospecha de que la sociedad privada pudo beneficiarse de una herramienta financiada con fondos universitarios. La instrucción investiga estos hechos en el 'caso Begoña Gómez'; rige la presunción de inocencia."
    sources:
      - "https://www.elindependiente.com/espana/2026/05/25/marca-registrada-begona-gomez-cobro-cuenta-comparte-pedro-sanchez/"
      - "https://theobjective.com/espana/tribunales/2026-05-25/begona-gomez-cuenta-sanchez-marca/"
      - "https://okdiario.com/espana/begona-gomez-creo-noviembre-empresa-transforma-tsc-sl-impulsar-agenda-2030-empresas-12649652"
  - entity_id: "Organization:transformatsc-org"
    name: "Transformatsc.org"
    updated: "2026-06-01"
    resumen: "Transformatsc.org es el dominio de internet de la plataforma digital \"Transforma TSC\", herramienta de medición de impacto social y ambiental desarrollada en el seno de la Cátedra Extraordinaria de Transformación Social Competitiva que dirigía Begoña Gómez en la Universidad Complutense de Madrid. Según el informe de la UCO (fechado en mayo de 2026) recogido por la prensa, el dominio se dio de alta el 21 de septiembre de 2022 a nombre de la coordinadora de la cátedra (Blanca de Juan) y se transfirió a nombre de Begoña Gómez el 14 de julio de 2023; la marca asociada (Transforma TSC) se solicitó en octubre de 2022 y se concedió en abril de 2023 con Gómez como titular. La investigación, que instruye el Juzgado de Instrucción nº 41 de Madrid, atribuye a Gómez haber registrado a su nombre el dominio y la marca de un software financiado con fondos que, una vez depositados en la UCM, tendrían carácter público, abonando las tasas (unos 127,88 euros) desde una cuenta personal. Begoña Gómez está investigada con presunción de inocencia y niega la comisión de delito alguno; se trata de imputaciones en una causa abierta, no de hechos probados."
    sources:
      - "https://okdiario.com/espana/uco-concluye-que-begona-gomez-registro-nombre-web-marca-del-software-pagado-complutense-17145958"
      - "https://theobjective.com/espana/tribunales/2026-05-25/begona-gomez-cuenta-sanchez-marca/"
  - entity_id: "Person:zurab-pololikashvili"
    name: "Zurab Pololikashvili"
    updated: "2026-06-01"
    resumen: "Zurab Pololikashvili (Tiflis, 1977) es un diplomático y político georgiano que ocupa la Secretaría General de la Organización Mundial del Turismo (OMT, hoy ONU Turismo) desde el 1 de enero de 2018; previamente fue embajador de Georgia en España (2006-2009) y ministro de Desarrollo Económico de su país (2009-2010). En la causa de Begoña Gómez aparece mencionado en los informes de la UCO como uno de los contactos del entorno de la OMT en el marco de eventos de innovación turística vinculados a la consultora Barrabés, a Wakalua (Globalia) y a directivos como Javier Hidalgo, en los que también participó Begoña Gómez (por ejemplo la presentación de Wakalua en el Barrabés Growth Space el 22 de enero de 2019 y competiciones de startups de turismo en torno a FITUR 2019-2020). La prensa lo describe como interlocutor de ese entorno (\"Zurab\"). No consta que Pololikashvili esté investigado ni imputado en la causa; su mención es como representante institucional de la OMT, con plena presunción de inocencia."
    sources:
      - "https://www.casafrica.es/es/persona/zurab-pololikashvili"
      - "https://www.infobae.com/espana/2024/12/06/zurab-pololikashvili-secretario-general-de-onu-turismo-se-presentara-para-la-reeleccion-para-el-mandato-2026-2029/"
      - "https://www.elespanol.com/reportajes/20260218/zurab-diplomatico-georgiano-conoce-madrid-hablaba-sanchez-begona-socio-estrategico-hidalgo/1003744133716_0.html"
  - entity_id: "Person:cueto"
    name: "Cueto"
    updated: "2026-10-04"
    resumen: "La ficha \"Cueto\" corresponde a Juan Carlos Cueto Martín, empresario al que la Fiscalía Anticorrupción y la UCO señalan como la persona que presuntamente controlaba Soluciones de Gestión SL, sociedad del Grupo Cueto a través de la cual la presunta trama del caso Koldo facturó alrededor de 54 millones de euros a varios ministerios y comunidades autónomas por suministro de mascarillas durante la pandemia. Según la investigación, Cueto habría actuado junto a Víctor de Aldama y mantenido reuniones con Koldo García; la Fiscalía lo describe como presunto líder que habría ejercido ascendencia sobre el resto de investigados, y el juez le impuso medidas cautelares como la prohibición de salir de España. Cueto está investigado/imputado con presunción de inocencia y defiende la legalidad de los contratos; no consta condena. La ficha arrastra alias contradictorios (\"Carlos Blanco Sánchez de Cueto\") que corresponden a una persona distinta (un procurador de los tribunales de Madrid) mezclada por homonimia parcial del apellido."
    sources:
      - "https://www.elespanol.com/espana/tribunales/20240227/juez-caso-koldo-cita-manana-investigado-empresario-juan-carlos-cueto/835916544_0.html"
      - "https://www.newtral.es/implicados-caso-koldo/20240301/"
      - "https://www.vozpopuli.com/espana/koldo-cueto-juez-fiscalia-prohiba-espana.html"
  - entity_id: "Person:vicente-fernandez"
    name: "Vicente Fernández"
    updated: "2026-06-01"
    resumen: "Vicente Cecilio Fernández Guerrero es jurista, ingresó por oposición en el cuerpo de letrados de la Junta de Andalucía en 1999 y fue presidente de la SEPI entre junio de 2018 y octubre de 2019, cargo para el que lo designó la entonces ministra de Hacienda María Jesús Montero. Dimitió en octubre de 2019 tras ser imputado por la presunta adjudicación de la mina de Aznalcóllar, causa de la que fue ABSUELTO por la Audiencia de Sevilla en diciembre de 2025. Posteriormente fue contratado como asesor por Servinabar (empresa administrada por Antxon Alonso y de la que la UCO atribuye un 45% a Santos Cerdán), de la que habría cobrado en torno a 219.000 euros entre 2021 y 2023 (68.632 en 2021, 117.000 en 2022 y 33.251 en 2023). El 10 de diciembre de 2025 fue detenido por la UCO junto a Leire Díez en el marco de una investigación del Juzgado Central de Instrucción (juez Pedraz) por presuntos delitos de fraude, malversación, tráfico de influencias y prevaricación en contratos públicos; figura como investigado y fue puesto en libertad con medidas cautelares. Rige plenamente la presunción de inocencia y no consta condena. Fuentes periodísticas le atribuyen además una relación personal pasada con Leire Díez."
    sources:
      - "https://www.publico.es/politica/tribunales/expresidente-sepi-detenido-leire-diez-cobro-219-000-euros-servinabar.html"
      - "https://okdiario.com/espana/quien-vicente-fernandez-relacion-maria-jesus-montero-imputacion-todo-sobre-ex-presidente-sepi-15915369"
      - "https://www.libertaddigital.com/espana/2025-12-10/vicente-fernandez-el-expresidente-de-la-sepi-detenido-que-fue-no-2-de-maria-jesus-montero-y-trabajo-en-servinabar-7331697/"
  - entity_id: "Person:angel-victor-torres"
    name: "Ángel Víctor Torres"
    updated: "2026-06-01"
    resumen: "Ángel Víctor Torres es dirigente del PSOE, fue presidente del Gobierno de Canarias entre 2019 y 2023 y desde 2023 es ministro de Política Territorial y Memoria Democrática. En el caso Koldo/mascarillas, Víctor de Aldama declaró ante el juez que, a través de Koldo García, se le habría reclamado una comisión de 50.000 euros vinculada a la compra de mascarillas por la comunidad canaria que entonces presidía Torres. El propio Aldama matizó en sede judicial que Torres 'ni pidió dinero ni cobró' y que esa comisión no se pagó. Torres niega cualquier irregularidad y rige plenamente la presunción de inocencia; no consta condena ni imputación firme por estos hechos."
    sources:
      - "https://www.elplural.com/sociedad/tribunales/aldama-reconoce-supremo-torres-ni-pidio-ni-cobro-dinero-caso-mascarillas_388580102"
      - "https://www.elespanol.com/espana/tribunales/20260521/aldama-declara-nadie-baleares-cobro-trama-mascarillas-ministro-angel-victor-torres/1003744254290_0.html"
  - entity_id: "Person:joseba-garcia-izaguirre"
    name: "Joseba García Izaguirre"
    updated: "2026-06-01"
    resumen: "Joseba García Izaguirre es hermano de Koldo García, el exasesor del exministro José Luis Ábalos. El 21 de febrero de 2024 fue detenido en el marco de la operación de la Guardia Civil sobre la presunta trama de comisiones por contratos públicos durante la pandemia; ocupaba un puesto en Emfesa, empresa pública dependiente del Ministerio de Transportes (procedía de Ineco/ADIF). La Fiscalía Anticorrupción y los informes de la UCO le atribuyen indiciariamente haber actuado como testaferro de su hermano para ocultar la titularidad real de bienes (entre ellos un inmueble en Polop de la Marina, Alicante). Figura como investigado/imputado y rige plenamente la presunción de inocencia; él niega haber ocultado patrimonio y no consta condena."
    sources:
      - "https://theobjective.com/espana/politica/2024-06-05/hermano-koldo-transportes-imputado-emfesa/"
      - "https://okdiario.com/espana/hermano-koldo-imputado-audiencia-juez-informe-uco-patrimonio-13773974"
      - "https://www.elespanol.com/espana/politica/20240221/detenida-mujer-koldo-garcia-secretaria-transportes-abalos-alto-cargo-psn/834416839_0.html"
  - entity_id: "Person:nicoleta-neacsu"
    name: "Nicoleta Neacsu"
    updated: "2026-06-01"
    resumen: "Nicoleta Neacsu Doloiu (citada como \"Nicoleta\", \"Nicole\"), de nacionalidad rumana, fue contratada hacia septiembre de 2022 por EMFESA (Enajenacion de Materiales Ferroviarios), entidad publica vinculada a ADIF, como delegada territorial de Medio Ambiente, dejando la empresa el 31 de marzo de 2025. Segun el informe de la UCO de la Guardia Civil, su colocacion la habria orquestado Koldo Garcia, exasesor del exministro Jose Luis Abalos, que pidio un \"favor personal\" a Santos Cerdan y se sirvio de su contacto con Vicente Calzado, director de EMFESA; el informe menciona ademas a Juanma Serrano (entonces presidente de Correos) como contacto alternativo barajado. La UCO la describe como \"amiga intima\" de Koldo a partir de conversaciones intervenidas. Su papel es el de presunta beneficiaria de una colocacion atribuida por la UCO al entorno de Koldo; rige la presuncion de inocencia y no consta que este imputada."
    sources:
      - "https://theobjective.com/espana/tribunales/2025-06-23/nicole-koldo-dejo-emfesa-exclusiva-to/"
      - "https://www.libertaddigital.com/espana/politica/2025-06-13/la-uco-revela-que-santos-cerdan-coloco-a-otra-sobrina-de-koldo-nicoleta-no-solo-hay-que-valer-para-follar-7265201/"
  - entity_id: "Person:pablo-osuna-garcia"
    name: "Pablo Osuna García"
    updated: "2026-06-01"
    resumen: "Pablo Osuna Garcia es un nombre que figura en el informe de la Guardia Civil (UCO) en relacion con la mesa de contratacion vinculada a las licitaciones de formacion de la entidad publica empresarial Red.es que el documento examina por presuntas irregularidades en favor de la UTE Innova Next-The Valley, contratos rubricados por el entonces director general de Red.es David Cierco. No ha sido posible verificar en fuentes publicas abiertas su identidad ni los detalles concretos de su funcion mas alla de esa mencion documental, por lo que esos extremos deben tomarse con cautela. No consta que este imputado y rige la presuncion de inocencia."
    sources:
      - "https://www.noticiasdegipuzkoa.eus/politica/2026/05/30/jueces-investigan-liderazgo-cerdan-amanos-sepi-11135668.html"
  - entity_id: "Person:ruben-goni-urroz"
    name: "Ruben Goñi Urroz"
    updated: "2026-06-01"
    resumen: "Ruben Goñi Urroz (Pamplona, 1982) fue director gerente del Instituto Navarro de Deporte y Juventud (INDJ), organismo que actuo como organo contratante de las obras del Navarra Arena adjudicadas en 2017. Segun el informe de la UCO, Koldo Garcia habria enviado a Santos Cerdan, el 3 de octubre de 2017 y siete dias antes de la adjudicacion, un mensaje anticipando que la obra recaeria en la UTE de Acciona y Servinabar, lo que situa esa licitacion entre las analizadas por presunto amaño en Navarra. Goñi comparecio el 14 de abril de 2026 ante la comision de investigacion del Parlamento de Navarra, donde planteo que la UTE pudo conocer con antelacion el resultado tras la apertura de la oferta economica el 29 de septiembre, a la que concurrio una unica UTE. No consta que este imputado y rige la presuncion de inocencia; su papel es el de responsable del organo contratante de la epoca."
    sources:
      - "http://www.kait.eus/ruben-goni-nombrado-director-gerente-del-instituto-navarro-de-deporte-y-juventud/"
      - "https://www.noticiasdenavarra.com/politica/2026/04/14/goni-plantea-ute-pudo-recibiria-10937945.html"
      - "https://es.wikipedia.org/wiki/Instituto_Navarro_de_Deporte_y_Juventud"
  - entity_id: "Person:david-cierco-jimenez-de-parga"
    name: "David Cierco Jiménez de Parga"
    updated: "2026-06-01"
    resumen: "David Cierco Jimenez de Parga fue director general de la entidad publica empresarial Red.es desde julio de 2018 hasta el 31 de mayo de 2021, sucediendo a Jose Manuel Leceta, tras haber sido consejero delegado de Truphone. Segun el informe de la Guardia Civil (UCO), Cierco rubrico, en su condicion de director general, los pliegos (PPT y PCAP) de expedientes de formacion que se adjudicaron a la UTE Innova Next-The Valley (en algunos lotes con KPMG Asesores) y que el documento examina por posibles irregularidades, en el marco de la investigacion sobre presunto trafico de influencias ligado a recomendaciones de Begoña Gomez. Su mencion en la causa deriva de esa funcion de maxima responsabilidad sobre las licitaciones; posteriormente paso a la consultora Acento. No consta que este imputado y rige la presuncion de inocencia."
    sources:
      - "https://www.red.es/redes/es/page/director-general"
      - "https://transparencia.gob.es/servicios-buscador/contenido/curriculums.htm?id=CV_6182&lang=es"
      - "https://www.zonamovilidad.es/david-cierco-jimenez-de-parga-nuevo-director-general-red.es"
      - "https://www.libertaddigital.com/espana/2024-06-03/la-uco-certifica-que-la-formula-elegida-para-la-concesion-de-10-millones-al-amigo-de-begona-gomez-beneficiaba-a-barrabes-7133277/"
  - entity_id: "Person:emilia-parejo-gala"
    name: "Emilia Parejo Gala"
    updated: "2026-07-14"
    resumen: "Emilia Parejo Gala fue directora del Area de Cultura de la Diputacion de Badajoz. El 14 de julio de 2026, la Audiencia Provincial de Badajoz la condeno (sentencia 152/2026) como cooperadora necesaria de un delito de prevaricacion administrativa (Bloque B: firmo, junto al Delegado Francisco Martos, la ficha de modificacion que en 2022 transformo el puesto de David Sanchez en la jefatura de la Oficina de Artes Escenicas, omitiendo el documento de funciones que habria evidenciado la creacion de un puesto nuevo) a 9 anos de inhabilitacion especial, y la absolvio del resto. La sentencia NO es firme: cabe apelacion ante el TSJ de Extremadura y rige la presuncion de inocencia."
    sources:
      - "https://www.cope.es/emisoras/extremadura/noticias/piden-absolucion-tres-altos-cargos-diputacion-badajoz-caso-david-sanchez-20251104_3245155.html"
      - "https://www.infobae.com/espana/agencias/2026/05/27/dos-delitos-11-investigados-y-42-testigos-la-guia-en-cifras-del-juicio-a-david-sanchez/"
  - entity_id: "Person:felix-gonzalez-marquez"
    name: "Félix González Márquez"
    updated: "2026-07-14"
    resumen: "Félix González Márquez es Jefe de Servicio de Gestión de RRHH de la Diputación de Badajoz. El 14 de julio de 2026, la Audiencia Provincial de Badajoz lo condenó (sentencia 152/2026) como cooperador necesario de un delito de prevaricación administrativa (Bloque A: formó parte de la comisión asesora que en 2017 fijó los criterios de valoración a la medida de David Sánchez y elaboró un informe-propuesta que consideraba apto únicamente a este, pese a que el acta oficial recogía seis aptos) a 9 años de inhabilitación especial, y lo absolvió del resto. La sentencia NO es firme: cabe apelación ante el TSJ de Extremadura y rige la presunción de inocencia. ATENCIÓN (homonimia): las menciones a un \"Félix\" en conversaciones intervenidas a Koldo García (\"yo sé que Félix habla con... con Azvi\") pertenecen al caso Koldo y con alta probabilidad NO corresponden a esta persona; no confundir tampoco con el expresidente Felipe González Márquez."
    sources:
      - "https://theobjective.com/espana/tribunales/2026-07-14/david-sanchez-condenado-nueve-anos-inhabilitacion-prevaricacion/"
      - "https://www.libertaddigital.com/espana/politica/2026-05-09/koldo-se-quejo-por-darle-obras-a-azvi-la-empresa-vinculada-a-las-obras-del-tramo-del-accidente-de-adamuz-1b-7401468/"
  - entity_id: "Person:cristina-nunez-fernandez"
    name: "Cristina Núñez Fernández"
    updated: "2026-07-14"
    resumen: "Cristina Núñez Fernández fue Diputada Delegada del Área de Cultura de la Diputación de Badajoz en la etapa (2016-2017) en que se creó y cubrió el puesto de coordinador de actividades de los conservatorios que ocupó David Sánchez, hermano del presidente del Gobierno. El 14 de julio de 2026, la Audiencia Provincial de Badajoz la condenó (sentencia 152/2026) como cooperadora necesaria de un delito de prevaricación administrativa (Bloque A) a 9 años de inhabilitación especial, y la absolvió del resto. El tribunal declara probado que decidió la creación del puesto junto a Gallardo y Elisa Moriano, firmó la propuesta de la RPT y la petición de cobertura 'con premura', y formuló la propuesta de contratación de David Sánchez basándose 'sobre todo' en la entrevista pese a no haber estado presente durante las entrevistas que recogía el acta. La sentencia NO es firme: cabe apelación ante el TSJ de Extremadura y rige la presunción de inocencia."
    sources:
      - "https://theobjective.com/espana/tribunales/2026-07-14/david-sanchez-condenado-nueve-anos-inhabilitacion-prevaricacion/"
      - "https://www.eldiario.es/extremadura/politica/david-sanchez-banquillo-guia-seguir-juicio-hermano-presidente_1_13249954.html"
  - entity_id: "Person:david-lucas-parron"
    name: "David Lucas Parrón"
    updated: "2026-06-01"
    resumen: "Francisco David Lucas Parrón es un dirigente del PSOE que fue secretario general de Agenda Urbana y Vivienda (2020-2023), secretario de Estado de Transportes, Movilidad y Agenda Urbana (febrero a noviembre de 2023) y, desde noviembre de 2023, secretario de Estado de Vivienda y Agenda Urbana. Su cargo lo sitúa en el entorno del Ministerio de Transportes que se investiga en el caso Koldo; en las fuentes consultadas no consta que esté imputado ni acusado en la pieza de las mascarillas. Sí han aparecido informaciones que apuntan a que la UCO examina un presunto fraccionamiento de contratos de obras de su etapa anterior, materia distinta y no juzgada. Rige la presunción de inocencia."
    sources:
      - "https://es.wikipedia.org/wiki/David_Lucas_Parr%C3%B3n"
      - "https://www.transportes.gob.es/el-ministerio/sala-de-prensa/noticias/mar-21022023-1542"
      - "https://www.mivau.gob.es/el-ministerio/biografia-de-altos-cargos-vivienda-agenda-urbana/francisco-david-lucas-parron"
  - entity_id: "LegalCase:diligencias-previas-numero-147-2024"
    name: "Diligencias Previas número 147/2024"
    updated: "2026-06-01"
    resumen: "Diligencias Previas 147/2024 es la causa instruida por el Juzgado Central de Instrucción nº 5 de la Audiencia Nacional (magistrado Santiago Pedraz), incoada en 2024, por un presunto fraude a la Hacienda Pública en el IVA de los hidrocarburos (cifrado por distintas fuentes en torno a 182-194 millones de euros, con estimaciones posteriores aún mayores), con presuntos delitos contra la Hacienda Pública, organización criminal y blanqueo de capitales (caso Villafuel). Entre los investigados figuran Víctor de Aldama y su socio Claudio Rivas, detenidos en octubre de 2024. De la colaboración de Aldama en esta causa derivaron informaciones que salpicaron a José Luis Ábalos. La instrucción ha sido objeto de sucesivas prórrogas. Todos los investigados están amparados por la presunción de inocencia."
    sources:
      - "https://www.poderjudicial.es/cgpj/es/Poder-Judicial/Audiencia-Nacional/Oficina-de-Comunicacion/Notas-de-prensa/El-juez-de-la-Audiencia-Nacional-propone-juzgar-a-una-organizacion-criminal-investigada-por-un-fraude-de-194-millones-de-euros-en-el-pago-del-IVA-de-hidrocarburos"
      - "https://www.estrelladigital.es/media/estrelladigital/files/2024/10/21/20241021122347554670.pdf"
  - entity_id: "LegalCase:expediente-3-20-27507-0207"
    name: "expediente 3.20/27507.0207"
    updated: "2026-06-01"
    resumen: "Identificador de un expediente administrativo de contratación pública que, según el grafo, se vincula a ADIF, a la Dirección General de Carreteras, a Marco Infraestructuras y Medio Ambiente SA, a Ángel Contreras y a Isabel Pardo de Vera (ex presidenta de Adif y ex secretaria de Estado de Transportes), en el marco de la investigación sobre presuntas adjudicaciones irregulares de obra pública asociadas al entorno de José Luis Ábalos. Es un código de expediente, no una causa penal con número propio. Los detalles concretos (vía de emergencia, fechas de tramitación en 2020, página 188 de un informe de la UCO) proceden de la extracción documental y no han podido confirmarse de forma independiente. Las personas y entidades mencionadas están amparadas por la presunción de inocencia."
    sources:
      - "https://www.poderjudicial.es/cgpj/es/Poder-Judicial/Tribunal-Supremo/Oficina-de-Comunicacion/Archivo-de-notas-de-prensa/El-Tribunal-Supremo-asume-la-causa-penal-contra-Jose-Luis-Abalos-al-apreciar-indicios-de-varios-delitos-en-la-exposicion-del-juez-Moreno"
  - entity_id: "Court:juez-central-de-instruccion-numero-5"
    name: "Juez Central de Instrucción número 5"
    updated: "2026-10-04"
    resumen: "Es uno de los seis Juzgados Centrales de Instrucción de la Audiencia Nacional, competente para instruir delitos de alcance nacional (corrupción, fraude, terrorismo). En la trama investiga el presunto fraude de hidrocarburos atribuido a Víctor de Aldama y su socio Claudio Rivas: el 7 de octubre de 2024 De Aldama fue detenido en el marco de esa causa instruida por el titular del JCI nº5 (Santiago Pedraz) y se intervino su teléfono móvil, cuyo volcado nutre después varias diligencias del caso Koldo. El órgano figura en esta base vinculado a las Diligencias Previas 147/2024 y al informe sobre el móvil de Aldama. Todas las personas afectadas están investigadas bajo presunción de inocencia."
    sources:
      - "https://theobjective.com/espana/tribunales/2024-12-05/aldama-juez-telefono-pruebas-contra-gobierno/"
      - "https://www.elespanol.com/espana/tribunales/20241205/aldama-pide-desencripte-movil-incautado-pedraz-acreditar-multiples-chats-altos-cargos-gobierno/906159951_0.html"
      - "https://confilegal.com/20201222-santiago-pedraz-se-cambia-al-juzgado-central-de-instruccion-5-de-la-audiencia-nacional/"
  - entity_id: "LegalCase:300-2021-00652"
    name: "300/2021/00652"
    updated: "2026-06-01"
    resumen: "Es la referencia de un expediente de contratación pública citado en el informe de la Guardia Civil (UCO) sobre la trama de adjudicaciones vinculada a Innova Next SLU y al entorno Aldama/Koldo, donde figura referido al órgano de contratación del Gobierno de Navarra. El grafo lo asocia además al Ayuntamiento de Madrid y a Innova Next SLU. No ha sido posible verificar de forma independiente en la Plataforma de Contratación del Estado el objeto contractual concreto ni el órgano definitivo, por lo que estos extremos deben confirmarse. No es un procedimiento penal sino un identificador administrativo de contratación. Las empresas y personas mencionadas se rigen por la presunción de inocencia."
    sources:
      - "https://contrataciondelestado.es/wps/portal/plataforma"
  - entity_id: "LegalCase:expediente-3-19-27507-0250"
    name: "Expediente 3.19/27507.0250"
    updated: "2026-06-01"
    resumen: "Es una referencia administrativa de un expediente de contratacion de ADIF, no una causa judicial. Segun los informes de la UCO de la Guardia Civil difundidos por la prensa, el expediente se asocia a obras en el tramo Monforte-Lugo de la Linea 800 ejecutadas por una UTE integrada al 50% por OPR (Obras Publicas y Regadios S.A.) y ASCH Infraestructuras y Servicios S.A.; el 16 de agosto de 2021 ADIF realizo una adjudicacion por emergencia a dicha UTE. Posteriormente, en 2024, un contrato de emergencia para reparar un talud derrumbado se habria adjudicado a ASCH. El expediente aparece en el marco del rastreo de adjudicaciones presuntamente favorecidas que investigan la UCO y el Tribunal Supremo (magistrado Leopoldo Puente). Ninguna de las personas o empresas implicadas ha sido condenada y rige la presuncion de inocencia; el nodo debe entenderse como un identificador documental, no como un procedimiento penal."
    sources:
      - "https://www.galiciapress.es/articulo/politica-galicia/2025-06-12/5328787-uco-relata-presunto-amano-contrato-adif-monforte"
      - "https://www.infolibre.es/politica/informa-uco-senala-contrato-tren-monforte-lugo-indicios-corrupcion-asesor-abalos_1_2013342.html"
      - "https://www.elprogreso.es/articulo/ribeira-sacra/licitacion-adif-linea-monforte-lugo-obras-investigadas-uco/202506122102441886789.html"
  - entity_id: "LegalCase:2023-02-04-005077-1"
    name: "2023-02-04-005077/1"
    updated: "2026-10-04"
    resumen: "Identificador con formato de expediente de contratación administrativa (2023). En esta base se vincula a la Consejería de Presidencia, Justicia, Seguridad y Simplificación Administrativa del Gobierno de Cantabria y a un importe de 12.036,05 euros citado en documentación de la UCO de la Guardia Civil, junto a expedientes correlativos (005079/1 y 005081/1). No es una causa judicial, sino una referencia administrativa de adjudicación incorporada como documentación. No ha sido posible confirmar en fuentes públicas abiertas ni el importe ni la atribución concreta a Cantabria, por lo que estos extremos se ofrecen como no verificados. Cualquier persona o entidad relacionada está amparada por la presunción de inocencia."
  - entity_id: "LegalCase:22491-2025"
    name: "22491/2025"
    updated: "2026-06-01"
    resumen: "Referencia con formato de número de resolución (22491/2025) atribuida en el grafo a la Sala de lo Penal del Tribunal Supremo y vinculada al magistrado instructor Pablo Llarena Conde, miembro de la Sala Segunda (Penal) del Supremo e instructor de causas de aforados. El identificador es coherente con la nomenclatura CENDOJ/ROJ de resoluciones de 2025 (existen resoluciones contiguas como la 22493/2025 dictada por esa Sala en diciembre de 2025), pero no ha sido posible confirmar el contenido concreto del auto 22491/2025 en fuentes públicas. Se trata por tanto de una referencia procesal no verificada en su contenido. Rige la presunción de inocencia respecto de cualquier persona afectada."
    sources:
      - "https://www.poderjudicial.es/cgpj/es/Poder-Judicial/Tribunal-Supremo/Portal-de-Transparencia/Estructura-organizativa/Salas-ordinarias---Sala-Segunda---Composicion"
  - entity_id: "LegalCase:300-2016-01507"
    name: "300/2016/01507"
    updated: "2026-06-01"
    resumen: "Identificador con formato de expediente de contratación del Ayuntamiento de Madrid (300/...). En el grafo se relaciona con la empresa Innova Next SLU y con el área de innovación del Ayuntamiento de Madrid. La UCO de la Guardia Civil solicitó al Ayuntamiento de Madrid los contratos con Innova Next (vinculada al empresario Juan Carlos Barrabés) en el marco de la causa que investiga presuntas cartas de recomendación firmadas por Begoña Gómez. Informes posteriores de la UCO avalaron la 'normalidad' de varios de esos contratos. La referencia se incorpora a la instrucción como documentación administrativa, no como causa judicial autónoma. Todas las personas y entidades están amparadas por la presunción de inocencia mientras no exista sentencia firme."
    sources:
      - "https://www.servimedia.es/noticias/contrato-ayuntamiento-madrid-empresa-barrabes-adjudico-criterio-economico/1410169859"
      - "https://www.infobae.com/espana/agencias/2024/05/29/la-uco-pide-contratos-al-ayuntamiento-de-madrid-y-al-csd-en-la-causa-sobre-begona-gomez/"
  - entity_id: "LegalCase:adif-av-3-18-20830-0295"
    name: "ADIF AV – 3.18/20830.0295"
    updated: "2026-06-01"
    resumen: "Identificador con formato de expediente de contratación de ADIF Alta Velocidad (ADIF AV), administrador de infraestructuras ferroviarias del Estado para la red de alta velocidad. ADIF AV figura como adjudicador de varias obras analizadas por la UCO de la Guardia Civil en relación con presuntas adjudicaciones a Acciona y a la empresa Servinabar, vinculada a Santos Cerdán, en el marco del caso Koldo/Cerdán; un informe de la UCO de noviembre de 2025 detalló cinco adjudicaciones a Acciona, parte de ellas de ADIF. El código corresponde a nomenclatura interna de expedientes de ADIF, no a una causa judicial. Las adjudicaciones investigadas lo están bajo presunción de inocencia, conforme a los informes de la UCO y a la instrucción en curso."
    sources:
      - "https://rtvc.es/cerdan-obras-acciona-segun-uco-19-noviembre-2025/"
      - "https://www.libertaddigital.com/espana/2025-11-21/las-cinco-adjudicaciones-a-acciona-que-originaron-una-deuda-de-1-millon-de-euros-en-mordidas-para-abalos-7321746/"
  - entity_id: "LegalCase:ddpp-65-2023"
    name: "DDPP 65/2023"
    updated: "2026-06-01"
    resumen: "Las Diligencias Previas 65/2023 se siguen ante el Juzgado Central de Instrucción nº 2 de la Audiencia Nacional, cuyo titular es el magistrado Ismael Moreno, en el marco del denominado 'caso Koldo'. En ellas figuran como investigados, entre otros, el empresario Víctor de Aldama y Koldo García Izaguirre, exasesor del Ministerio de Transportes, por la presunta intermediación en la adjudicación de contratos públicos, incluido material sanitario (mascarillas) durante la pandemia. Según los informes de la UCO incorporados a la causa se investigan posibles comisiones y tratos de favor; todas las personas mencionadas están amparadas por la presunción de inocencia al no existir sentencia. La instrucción se ha entrelazado con la causa del Tribunal Supremo sobre Ábalos y Cerdán."
    sources:
      - "https://www.libertaddigital.com/espana/2024-07-23/fiscalia-supremo-sostiene-caso-koldo-investigar-audiencia-nacional-fiscalia-europea-7149991/"
      - "https://www.infobae.com/espana/2024/07/28/quien-es-ismael-moreno-el-juez-encargado-de-investigar-el-caso-koldo-de-policia-en-el-franquismo-a-magistrado-de-la-audiencia-nacional/"
      - "https://www.elplural.com/sociedad/tribunales/audiencia-nacional-agrega-confesion-aldama-koldo-supremo-causa-presunto-amano-obras-financiacion-psoe_389526102"
  - entity_id: "LegalCase:expediente-54-05-15-11-se-4720"
    name: "Expediente 54.05/15; 11-SE-4720"
    updated: "2026-06-01"
    resumen: "Es un expediente administrativo de contratación de obra pública (no una causa penal) correspondiente a la duplicación de la carretera N-IV (Autovía del Sur A-4 de Madrid a Cádiz) entre Dos Hermanas y Los Palacios y Villafranca, en la provincia de Sevilla. La clave de proyecto 11-SE-4720 consta en el BOE (proyecto de trazado, p.k. 558,5 al 566,5) y las obras fueron licitadas y adjudicadas por la Dirección General de Carreteras del entonces Ministerio de Fomento hacia 2015, entrando en servicio años después. El nodo se incorporó al grafo presuntamente al rastrearse una obra mencionada en la investigación del Tribunal Supremo sobre Santos Cerdán y la presunta trama de amaño de obra pública (Servinabar/Acciona); esa vinculación concreta con la causa no se ha podido confirmar de forma independiente. Su inclusión no implica por sí sola irregularidad acreditada."
    sources:
      - "https://www.boe.es/diario_boe/txt.php?id=BOE-B-2008-104301"
      - "https://www.transportes.gob.es/carreteras/nuevos-tramos-en-servicio/2021/4-duplicacion-del-tramo-dos-hermanas-los-palacios-y-villafranca"
  - entity_id: "LegalCase:procedimiento-abreviado"
    name: "Procedimiento Abreviado"
    updated: "2026-06-01"
    resumen: "El 'Procedimiento Abreviado' es, en general, una modalidad de proceso penal regulada en la Ley de Enjuiciamiento Criminal para delitos de hasta nueve años de prisión. En este grafo el nodo mezcla esa categoría genérica con un procedimiento concreto: el Procedimiento Abreviado nº 43/25 seguido en Badajoz por la presunta contratación irregular de David Sánchez Pérez-Castejón, hermano del presidente del Gobierno, en la Diputación de Badajoz. En esa causa la acusación popular atribuye presuntos delitos de tráfico de influencias, prevaricación y nombramiento ilegal; David Sánchez niega los hechos y rige la presunción de inocencia. El 1 de junio de 2026 la Audiencia Provincial de Badajoz declaró prescrito el delito de aceptación de nombramiento ilegal, manteniendo las acusaciones por tráfico de influencias y prevaricación."
    sources:
      - "https://www.cope.es/emisoras/extremadura/noticias/audiencia-provincial-considera-prescrito-delito-aceptacion-nombramiento-ilegal-le-imputaba-hermano-sanchez-20260601_3375253.html"
      - "https://www.publico.es/politica/tribunales/tribunal-declara-prescrito-delito-nombramiento-ilegal-david-sanchez-expulsa-acusacion-puesto-exasesor-moncloa.html"
  - entity_id: "Court:seccion-de-instruccion"
    name: "Sección de Instrucción"
    updated: "2026-10-04"
    resumen: "Ficha genérica que recoge menciones a una \"Sección de Instrucción\" en autos judiciales de los documentos analizados (causas auto-zapatero, autoentradaferraz). No identifica un órgano concreto y único, sino que funciona como término procesal genérico que agrega menciones de distintas secciones de instrucción. La vinculación al \"Tribunal de Instancia de Madrid\" procede de la propia documentación analizada y no se ha verificado con fuente pública externa, por lo que se trata con cautela. Toda persona mencionada en actuaciones de instrucción goza de presunción de inocencia mientras no recaiga sentencia firme."
  - entity_id: "Court:audiencia-provincial"
    name: "Audiencia Provincial"
    updated: "2026-06-01"
    resumen: "Nodo genérico que agrega menciones a \"Audiencia Provincial\" en los autos de los documentos analizados, en especial el auto de imputación de Begoña Gómez de 11/04/2026, que cita doctrina de una Sección de la Audiencia Provincial sobre conexidad y enjuiciamiento separado. Las Audiencias Provinciales son tribunales con sede en cada capital de provincia que conocen en segunda instancia y enjuician determinados delitos. El nodo no concreta la provincia ni la sección, por lo que es un término procesal genérico más que un órgano específico identificable. Begoña Gómez figura como investigada/imputada; rige la presunción de inocencia mientras no haya sentencia firme."
    sources:
      - "https://www.poderjudicial.es/cgpj/es/Temas/Compendio-de-Derecho-Judicial/Audiencias-Provinciales/"
  - entity_id: "LegalCase:ddpp-65-23-del-jci-2"
    name: "DDPP 65/23 del JCI 2"
    updated: "2026-06-01"
    resumen: "Procedimiento de Diligencias Previas 65/2023 incoado por el Juzgado Central de Instrucción nº 2 de la Audiencia Nacional, marco procesal del llamado 'caso Koldo' sobre presuntas irregularidades en adjudicaciones de contratos durante la pandemia de COVID-19. En esta causa se investiga la presunta intermediación de Koldo García Izaguirre, vinculada a la órbita del exministro José Luis Ábalos. El JCI nº 2 elevó una exposición razonada a la Sala Segunda del Tribunal Supremo para que asumiera la competencia respecto a Ábalos, aforado como diputado. Conecta procesalmente con la causa especial seguida en el Tribunal Supremo. Todos los implicados están investigados bajo presunción de inocencia."
    sources:
      - "https://www.estrelladigital.es/articulo/tribunales/audiencia-nacional-eleva-exposicion-razonada-exministro-abalos-por-presuntas-irregularidades-adjudicaciones-pandemia/20241023135157362834.html"
  - entity_id: "LegalCase:hsk-53-2018"
    name: "HSK-53/2018"
    updated: "2026-10-04"
    resumen: "HSK-53/2018 aparece en esta base como un identificador interno de un expediente de contratación pública, mencionado al analizar adjudicaciones (relacionado, según las evidencias internas del documento, con material de trabajo en altura para SSEI y con AENA). No se trata de una causa judicial con nombre propio sino de una referencia administrativa de licitación recogida como evidencia documental. No identifica a personas concretas y no consta acreditada ninguna conducta ilícita asociada. No se ha localizado fuente pública independiente que respalde esta referencia interna, por lo que la confianza es baja."
  - entity_id: "LegalCase:it-2024-9"
    name: "IT-2024-9"
    updated: "2026-10-04"
    resumen: "IT-2024-9 figura en esta base como un identificador interno de un expediente de contratación, mencionado al analizar suministros (vinculado, según las evidencias internas, a un importe de 92.128,72 euros y al Departament d'Interior de la Generalitat). No es una causa judicial nominada sino una referencia administrativa de licitación recogida como evidencia documental. No identifica a personas concretas ni consta acreditada conducta ilícita alguna. No se ha localizado fuente pública independiente que respalde esta referencia interna, por lo que la confianza es baja."
  - entity_id: "LegalCase:contrato-e-019-20"
    name: "contrato E/019/20"
    updated: "2026-06-01"
    resumen: "\"E/019/20\" se ha registrado como referencia de un expediente administrativo de contratacion de mascarillas durante la pandemia de COVID-19 en el ambito del Ministerio de Transportes/Puertos del Estado, en el marco del llamado caso Koldo. La auditoria encargada por el ministro Oscar Puente (hecha publica en 2024) analizo como la empresa Soluciones de Gestion paso a ser proveedor de mascarillas y describio un presunto trato de favor de Jose Luis Abalos y Koldo Garcia hacia ese proveedor, sin que ello prejuzgue responsabilidad penal de los intervinientes (presuncion de inocencia; causa en instruccion). El codigo exacto \"E/019/20\" y su atribucion concreta a Puertos del Estado NO han podido confirmarse en las fuentes citadas, por lo que se mantiene como identificador administrativo con confianza baja."
    sources:
      - "https://www.vozpopuli.com/economia/auditoria-puente-denuncia-trato-favor-abalos-koldo-proveedor-mascarillas.html"
      - "https://www.estrelladigital.es/articulo/tribunales/auditoras-caso-mascarillas-apuntan-koldo-exceso-atribuciones-cambio-justificar/20260423181747445732.html"
  - entity_id: "Contract:12-lo-5440"  # rekey s91 (era LegalCase:informe-12-lo-5440; es una licitación DGC, no un procedimiento)
    name: "Expediente 12-LO-5440 (54.567/19)"
    updated: "2026-06-01"
    resumen: "\"12-LO-5440\" (citado junto a la referencia 54.567/19) se ha registrado como referencia de un expediente de contratacion de obra publica en el ambito del Ministerio de Transportes analizado en el marco de la investigacion de la UCO de la Guardia Civil sobre el presunto amano de adjudicaciones en favor de Acciona y de la empresa Servinabar, vinculada a Santos Cerdan. La UCO sostiene que Acciona y Servinabar firmaron acuerdos por los que Servinabar obtenia un 2% del importe de las adjudicaciones, y describe coincidencias entre reuniones y procesos de licitacion (entre ellos las obras de Logroño, Sevilla y Sant Feliu de Llobregat). Todo ello bajo presuncion de inocencia y pendiente de instruccion judicial. El codigo exacto \"12-LO-5440\" NO ha podido confirmarse en las fuentes citadas, por lo que se mantiene como identificador administrativo."
    sources:
      - "https://www.elplural.com/politica/espana/claves-informe-uco-trio-conformado-cerdan-servinabar-acciona_365429102"
      - "https://www.eldiario.es/politica/son-adjudicaciones-alianza-acciona-empresa-vinculada-cerdan-lupa-justicia_1_12779315.html"
  - entity_id: "LegalCase:012-22-ed"
    name: "012/22-ED"
    updated: "2026-06-01"
    resumen: "\"012/22-ED\" es una referencia de expediente cuyo formato con sufijo '-ED' coincide con la nomenclatura de expedientes de Red.es investigados en la causa de Begoña Gomez y el empresario Juan Carlos Barrabes (Fiscalia Europea + UCO + IGAE), por ejemplo el expediente 44/20-ED remitido por la UCO el 14 de mayo de 2024. No se ha podido confirmar en fuente publica fiable la asociacion concreta de '012/22-ED' a un importe de 289.256,20 euros ni su relacion con la causa de Santos Cerdan; la atribucion original al entorno Cerdan/Acciona no esta respaldada por la fuente citada (un articulo sobre Cerdan que no menciona este codigo). Es un identificador administrativo. Rige la presuncion de inocencia de cualquier interviniente."
  - entity_id: "Contract:104-2021"  # rekey s91: el nodo pasó a Contract en el pase 4 y el bloque quedó huérfano
    name: "104/2021"
    updated: "2026-06-01"
    resumen: "\"104/2021\" es una referencia de expediente de contratacion. La atribucion original a la trama de Santos Cerdan/Servinabar es erronea: la empresa Innova Next SLU esta vinculada al empresario Juan Carlos Barrabes y a los contratos de Red.es investigados en la causa de Begoña Gomez por la Fiscalia Europea y la UCO, no a la investigacion de Cerdan/Acciona. No se ha podido confirmar en fuente publica fiable que el codigo '104/2021' corresponda a Innova Next ni el importe de 107.464,55 euros. Es un identificador administrativo. Rige la presuncion de inocencia de cualquier interviniente."
  - entity_id: "LegalCase:2020-02-04-003809-1"
    name: "2020-02-04-003809/1"
    updated: "2026-06-01"
    resumen: "Es un número de expediente administrativo, no una causa judicial. Según el informe de la UCO (Guardia Civil) recogido en el grafo, corresponde a un contrato menor de suministro para la adquisición de material de montaña por importe de 2.761,96 euros (sin impuestos), vinculado a Barrabés Ski Montaña S.L.U. Aparece en el marco del análisis de la UCO sobre las adjudicaciones públicas a las empresas del grupo Barrabés (entorno del caso Koldo / Begoña Gómez), investigación judicial abierta. Se trata de un identificador de fichero, no de una entidad nominal investigable por sí misma."
    sources:
      - "https://www.elindependiente.com/espana/tribunales/2024/05/28/la-uco-senala-que-barrabes-logro-el-90-de-las-adjudicaciones-publicas-entre-2021-y-2022/"
  - entity_id: "LegalCase:2021-ea26-00001152e"
    name: "2021/EA26/00001152E"
    updated: "2026-06-01"
