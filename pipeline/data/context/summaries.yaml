  - entity_id: "Person:ramon-alzorriz-goni"
    name: "Ramón Alzórriz Goñi"
    updated: "2026-07-14"
    resumen: "Considerado el 'número dos' de María Chivite en el PSN, era vicesecretario general y portavoz parlamentario cuando dimitió de sus cargos orgánicos el 18 de junio de 2025, tras conocerse que su pareja trabajó en Servinabar (empresa de la que, según una escritura pública revelada por la prensa, Santos Cerdán poseía un 45%) entre junio de 2021 y septiembre de 2024. Admitió públicamente que él mismo pidió a Antxon Alonso la contratación de su pareja y sostiene que Cerdán no intervino en ella. Compareció ante la comisión Koldo del Senado el 30-jun-2026, donde afirmó que Chivite le pidió dimitir y reconoció haber llamado a Cerdán al estallar el caso. Según prensa, en el marco del 'caso Sendaviva' se investiga la reforma de su piso, realizada por la constructora Adentro Construimos, tras una querella de Vox por presuntos cohecho y tráfico de influencias; por su condición de aforado, la parte que le afecta se elevó al Tribunal Superior de Justicia de Navarra. Sigue siendo parlamentario foral; no consta condena alguna y rige la presunción de inocencia."
    sources:
