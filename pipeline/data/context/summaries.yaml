  - entity_id: "Person:domingo-arnaldo-amaro-chacon"
    name: "Domingo Arnaldo Amaro Chacón"
    updated: "2026-05-31"
    resumen: "Domingo Arnaldo Amaro Chacón es empresario de origen venezolano que, junto a su hermano (los 'hermanos Amaro Chacón'), controla la consultora Inteligencia Prospectiva. Según la UDEF recogida por la prensa, dicha sociedad habría canalizado en torno a un millón de euros hacia tres entidades del entorno de José Luis Rodríguez Zapatero (incluidas Análisis Relevante y Whathefav) y movido más de 2,6 millones de euros, cifra que la UDEF considera incongruente con su actividad declarada. Los hermanos se describen como vinculados a PDVSA y próximos a la vicepresidenta venezolana Delcy Rodríguez. La instrucción relaciona a Inteligencia Prospectiva con operaciones de compraventa de petróleo venezolano. Rige la presunción de inocencia: son indicios, sin condena."
    sources:
      - "https://www.infobae.com/espana/2026/05/25/los-hermanos-amaro-chacon-y-francisco-flores-quienes-son-los-empresarios-venezolanos-vinculados-al-entorno-de-zapatero-en-el-caso-plus-ultra/"
      - "https://www.mundiario.com/articulo/politica/dos-empresarios-venezolanos-emergen-como-pieza-clave-trama-plus-ultra/20260525131332387822.html"
  - entity_id: "Company:grupo-barrabes"
    name: "Grupo Barrabés"
    updated: "2026-05-31"
    resumen: "Grupo Barrabés es un grupo empresarial de consultoría e innovación dirigido por Carlos Barrabés. Sus sociedades (vía UTE Barrabés/The Valley) obtuvieron 10,6 millones de euros mediante tres adjudicaciones de Red.es entre marzo y agosto de 2021, contratos investigados en la causa del caso Begoña Gómez instruida por el juez Juan Carlos Peinado. Begoña Gómez firmó dos cartas de aval/apoyo a licitaciones vinculadas a la UTE. El juez ha apreciado indicios suficientes para juicio con jurado contra Barrabés y Begoña Gómez por tráfico de influencias y corrupción en los negocios; él y sus empresas defienden haber actuado con regularidad. Rige la presunción de inocencia: no hay sentencia firme."
    sources:
      - "https://theobjective.com/espana/2025-12-11/barrabes-silencio-senado-begona-gomez/"
      - "https://theobjective.com/economia/2026-04-14/barrabes-empresa-avalada-begona-gomez/"
      - "https://www.eldiariodehuesca.com/actualidad/carlos-barrabes-acusado-trafico-influencias-corrupcion-en-negocios-en-sector-privado-dentro-caso-begona-gomez_42565_102.html"
  - entity_id: "Person:jose-luis-calama-teixeira"
    name: "Jose Luis Calama Teixeira"
    updated: "2026-05-31"
    resumen: "José Luis Calama Teixeira (Salamanca, 20 de mayo de 1959; en la carrera judicial desde 1988) es magistrado titular del Juzgado Central de Instrucción nº 4 de la Audiencia Nacional desde 2018, donde sucedió a Fernando Andreu. Especialista en delitos económicos, ha instruido Pegasus (archivada provisionalmente en enero de 2026) y Banco Popular. Es el juez instructor del caso Plus Ultra: el 19 de mayo de 2026 levantó el secreto de las actuaciones y citó como investigado al expresidente José Luis Rodríguez Zapatero, al que en su auto describe como 'núcleo estratégico y decisor' de una presunta estructura de tráfico de influencias en torno al rescate de 53 millones de euros a la aerolínea; dictó cuatro órdenes internacionales de detención (Rodolfo José Reyes Rojas y otros). Su papel es estrictamente jurisdiccional: instruye la causa, no es parte investigada."
    sources:
      - "https://www.vozpopuli.com/tribunales/quien-es-jose-luis-calama-el-juez-que-ha-imputado-a-jose-luis-rodriguez-zapatero-por-el-caso-plus-ultra.html"
      - "https://www.poderjudicial.es/cgpj/es/Poder-Judicial/Noticias-Judiciales/----La-Audiencia-Nacional-cita-al-expresidente-Jose-Luis-Rodriguez-Zapatero-como-investigado-por-delitos-de-trafico-de-influencias-y-otros-conexos"
      - "https://www.eldiario.es/politica/juez-calama-califica-zapatero-nucleo-decisor-red-apoya-conversaciones-pana-zapatero-detras_1_13233672.html"
  - entity_id: "Company:barrabes-internet-sl"
    name: "Barrabes Internet Sl"
    updated: "2026-05-31"
    resumen: "Barrabes Internet, S.L. (también Barrabes Internet SLU) es una de las mercantiles del Grupo Barrabés vinculado al empresario Carlos Barrabés. Forma parte del perímetro empresarial cuyas adjudicaciones públicas, en particular las de Red.es vinculadas al caso Begoña Gómez (instruido por el juez Juan Carlos Peinado), son objeto de investigación por presuntos indicios de irregularidad. Rige la presunción de inocencia: no existe declaración judicial firme de delito."
    sources:
      - "https://theobjective.com/economia/2026-04-14/barrabes-empresa-avalada-begona-gomez/"
  - entity_id: "Court:audiencia-nacional"
    name: "Audiencia Nacional"
    updated: "2026-05-31"
    resumen: "La Audiencia Nacional es el tribunal competente para los delitos economicos y de corrupcion de mayor alcance en Espana. En la trama Koldo/mascarillas, el Juzgado Central de Instruccion n2, a cargo del magistrado Ismael Moreno, instruye las Diligencias Previas 65/2023 sobre los contratos de adquisicion de material sanitario durante la pandemia tras asignarle el Tribunal Supremo la competencia; mantiene investigado a Koldo Garcia por las mascarillas adjudicadas por los servicios de salud de Baleares y Canarias y figura tambien el empresario Victor de Aldama. La parte que afectaba a aforados (el exministro Jose Luis Abalos y el exdirigente del PSOE Santos Cerdan) se elevo al Tribunal Supremo (Causa Especial 20775/2020). En 2025 quedo en la Audiencia Nacional, bajo el juez Ismael Moreno, la pieza de los presuntos pagos en efectivo realizados desde la sede del PSOE a Abalos y Koldo, sobre la que el Supremo autorizo a la UCO el acceso a la evidencia digital intervenida (resolucion confirmada en diciembre de 2025). Todos los investigados estan amparados por la presuncion de inocencia."
    sources:
      - "https://es.wikipedia.org/wiki/Audiencia_Nacional_(Espa%C3%B1a)"
      - "https://www.poderjudicial.es/cgpj/eu/Botere-Judiziala/Auzitegi-Gorena/Auzi-Berriak/El-Tribunal-Supremo-asigna-al-juez-Ismael-Moreno-la-competencia-para-investigar-las-presuntas-irregularidades-en-los-contratos-de-las-mascarillas-durante-la-pandemia"
      - "https://www.elindependiente.com/espana/2026/05/12/el-juez-ismael-moreno-rechaza-archivar-la-investigacion-a-koldo-por-las-mascarillas-de-baleares-y-canarias/"
      - "https://theobjective.com/espana/tribunales/2025-12-15/supremo-investigacion-audiencia-nacional-pagos-psoe/"
  - entity_id: "Company:construcciones-perez-jimenez"
    name: "Construcciones Perez Jimenez"
    updated: "2026-05-31"
    resumen: "Construcciones Perez Jimenez, S.L. es una empresa real con sede en Granada (NIF B18077867, constituida el 2 de junio de 1987, CNAE 4211 construccion de carreteras y autovias) que opera con frecuencia en UTE y consta como adjudicataria de obra publica. En el marco de la investigacion del 'caso Koldo' figura, segun el informe de la UCO, en una licitacion ferroviaria del AVE de Extremadura: el 28 de enero de 2019 Koldo Garcia habria remitido a Isabel Pardo de Vera, entonces presidenta de ADIF, una imagen con el resultado de las ofertas en la que aparecia resaltada la de la UTE CTNES. Perez Jimenez SL-OPR -que habria obtenido la mejor puntuacion- frente a la de Acciona Construccion, mostrandose Koldo disgustado porque, segun la UCO, habria querido que la adjudicacion recayera en Acciona. La empresa es vinculada a los hermanos Fernandez Menendez (tambien ligados a OPR). Su mencion en el sumario se refiere a una concurrencia competitiva y a actos atribuidos a terceros; no implica responsabilidad alguna de la empresa, que goza de presuncion de inocencia. El alias 'Construcciones Perrez Jimenez' es un error tipografico/OCR del mismo nombre."
    sources:
      - "https://www.elindependientedegranada.es/politica/tres-empresas-dos-investigados-granada-informe-uco"
      - "https://www.democrata.es/actualidad/informe-cerdan-a-quien-senala-uco-cupula-transportes-abalos/"
      - "https://empresite.eleconomista.es/CONSTRUCCIONES-PEREZ-JIMENEZ.html"
      - "https://www.axesor.es/Informes-Empresas/408227/CONSTRUCCIONES_PEREZ_JIMENEZ_SOCIEDAD_LIMITADA.html"
  - entity_id: "Organization:tribunal-de-cuentas"
    name: "Tribunal de Cuentas"
    updated: "2026-08-27"
    resumen: "El Tribunal de Cuentas es la institucion encargada de fiscalizar la actividad economico-financiera del sector publico espanol (incluida la de los partidos politicos y sus fundaciones) y de enjuiciar la responsabilidad contable de quienes manejan fondos publicos, conforme al art. 136 de la Constitucion y la LO 2/1982. En el contexto de estas tramas, sus auditorias e informes de fiscalizacion sobre contratacion publica (por ejemplo la contratacion de emergencia durante la pandemia) sirven como elemento de contraste. Institucion distinta del Tribunal de Cuentas Europeo (UE), que aparece mencionado puntualmente en los mismos informes (alias saneados en la migracion s85, QA pase 3)."
    sources:
      - "https://es.wikipedia.org/wiki/Tribunal_de_Cuentas_(Espa%C3%B1a)"
      - "https://www.tcu.es/tribunal-de-cuentas/es/la-institucion/Presentacion/"
      - "https://app.congreso.es/consti/constitucion/indice/sinopsis/sinopsis.jsp?art=136&tipo=2"
      - "https://www.boe.es/buscar/act.php?id=BOE-A-1982-11584"
  - entity_id: "Person:maria-gertrudis-alcazar-jimenez"
    name: "María Gertrudis Alcázar Jiménez"
    updated: "2026-05-31"
    resumen: "María Gertrudis Alcázar Jiménez ('Gertru') fue durante alrededor de dos décadas la secretaria personal de máxima confianza del expresidente del Gobierno José Luis Rodríguez Zapatero, custodiando el acceso a su despacho. En el marco del 'caso Plus Ultra' (la causa de la Audiencia Nacional que investiga el rescate público de la aerolínea), según la cobertura periodística el juez instructor la sitúa como figura relevante de la presunta estructura investigada y se la relaciona con la cuenta de correo [correo de la oficina redactado]. Diversos medios la describen como presunta 'pieza operativa esencial' de la presunta red. Las afirmaciones sobre tareas concretas (preparación de facturas, transmisión de instrucciones, intermediación con el empresario Julio Martínez) proceden de la cobertura periodística del auto y no han sido contrastadas judicialmente. Rige plenamente la presunción de inocencia: los hechos no han sido juzgados y no consta condena."
    sources:
      - "https://www.infobae.com/espana/2026/05/21/quien-es-gertrudis-alcazar-la-secretaria-que-custodio-durante-dos-decadas-el-acceso-a-zapatero-y-que-ahora-el-juez-situa-en-el-corazon-del-caso-plus-ultra/"
      - "https://www.democrata.es/en/courts/who-is-maria-gertrudis-alcazar-zapatero-s-secretary-pointed-out-by-the-judge-in-the-plus-ultra-case/"
      - "https://www.articulo14.es/politica/gertrudis-alcazar-la-secretaria-era-una-pieza-operativa-esencial-dentro-de-la-red-organizada-20260520.html"
  - entity_id: "Company:levantina-ingenieria-y-construccion"
    name: "Levantina Ingeniería y Construcción"
    updated: "2026-05-31"
    resumen: "Levantina, Ingeniería y Construcción SL (LIC), vinculada a José Ruz, es una de las empresas que la instrucción del caso relaciona con la presunta trama de adjudicación irregular de obra pública en torno a Santos Cerdán, la sociedad Servinabar y Acciona. Entre las obras citadas en la cobertura periodística figura, junto a Acciona, la sustitución de cables del puente del V Centenario sobre el Guadalquivir (Sevilla), además de otras actuaciones que aparecen en el grafo. Según la información publicada, José Ruz habría negado haber realizado pagos a la 'red de Cerdán'. A partir de las fuentes públicas no consta una atribución firme de delito a la compañía ni condena; rige la presunción de inocencia y su papel concreto está siendo objeto de instrucción."
    sources:
      - "https://www.diariodeleon.es/nacional/251115/2066243/informe-sobre-dinero-cerdan-desata-registros-uco-acciona.html"
      - "https://www.eldiario.es/politica/son-adjudicaciones-alianza-acciona-empresa-vinculada-cerdan-lupa-justicia_1_12779315.html"
  - entity_id: "Company:idella-consulenza-strategica"
    name: "Idella Consulenza Strategica"
    updated: "2026-05-31"
    resumen: "Idella Consulenza Strategica SL es una consultoría radicada en Petrer (Alicante) vinculada al empresario Julio Martínez Martínez, una de las figuras relacionadas con el 'caso Plus Ultra'. Según la cobertura periodística sobre la investigación del entorno de Zapatero, la sociedad figura entre las empresas señaladas en el análisis del entramado societario asociado al rescate público de la aerolínea Plus Ultra. No se han acreditado en fuentes públicas pruebas concluyentes de conducta dolosa ni existe condena; rige plenamente la presunción de inocencia y su papel se enmarca en el análisis judicial, no acreditándose por sí misma la comisión de delito. Pertenece a la rama Plus Ultra/Zapatero, no a la trama Servinabar de Cerdán."
    sources:
      - "https://www.eldiario.es/politica/empresas-salpicadas-investigacion-zapatero-whathefav-analisis-relevante_1_13234431.html"
      - "https://www.einforma.com/informacion-empresa/idella-consulenza-strategica"
  - entity_id: "Person:pedro-saura"
    name: "Pedro Saura"
    updated: "2026-05-31"
    resumen: "Pedro Saura García (1962) es economista, profesor en la Universidad de Murcia y dirigente del PSOE (secretario general del PSRM-PSOE y diputado por Murcia). Fue secretario de Estado de Infraestructuras, Transporte y Vivienda —número dos de José Luis Ábalos— entre 2018 y 2021, y posteriormente presidió Paradores (2021-2023) y, desde diciembre de 2023, la sociedad estatal Correos. Su nombre ha aparecido en el ámbito de las investigaciones por su cargo en Transportes durante los hechos del caso Koldo, y medios lo han mencionado en relación con diligencias y comparecencias políticas. A partir de las fuentes públicas no consta que esté imputado ni condenado, por lo que rige plenamente la presunción de inocencia."
    sources:
      - "https://es.wikipedia.org/wiki/Pedro_Saura_Garc%C3%ADa"
      - "https://www.transportes.gob.es/ministerio/comunicacion/sala-prensa/lun-18062018-0805"
      - "https://www.elespanol.com/espana/murcia/20241016/pp-murcia-pide-explicaciones-socialista-pedro-saura-presunta-vinculacion-caso-koldo/893910662_0.html"
  - entity_id: "Organization:gate-center"
    name: "Gate Center"
    updated: "2026-05-31"
    resumen: "Gate Center es una entidad descrita públicamente como think tank, con sedes en Madrid y Pekín, fundada en abril de 2022 (vinculada al empresario Daniel Romero-Abreu y a Feng Yi Zhang) y gestionada en el entorno de Thinking Heads; el expresidente José Luis Rodríguez Zapatero figura como presidente de su comité asesor. Según informaciones periodísticas sobre la instrucción del juez Calama, Gate Center habría recibido transferencias de Inteligencia Prospectiva (en torno a 266.200 euros) y habría abonado pagos a Zapatero, en el marco de la investigación sobre presunto tráfico de influencias y blanqueo conectada al rescate de Plus Ultra. Todos estos extremos están bajo investigación y rige la presunción de inocencia; Zapatero ha negado los hechos."
    sources:
      - "https://www.libertaddigital.com/espana/2026-05-21/el-juez-calama-investiga-el-pago-de-1-2-millones-a-zapatero-a-traves-de-un-think-tank-relacionado-con-china-7406771/"
      - "https://www.publico.es/politica/inteligencia-prospectiva-destino-92-pagos-empresas-vinculadas-zapatero-martinez.html"
      - "https://www.actualidad.es/politica/2026/05/24/pagos-sociedades-y-comunicaciones-el-mapa-que-situa-a-zapatero-en-la-trama-plus-ultra/"
  - entity_id: "Person:ricardo-cabezas-martin"
    name: "Ricardo Cabezas Martín"
    updated: "2026-07-14"
    resumen: "Ricardo Cabezas Martín (Badajoz, 1974) es un político socialista, concejal y portavoz del Grupo Municipal Socialista en el Ayuntamiento de Badajoz desde 2015 y diputado provincial en la Diputación de Badajoz (área de Cultura, Deporte y Juventud) desde julio de 2023; es maestro de Educación Primaria y profesor de piano. El 14 de julio de 2026, la Audiencia Provincial de Badajoz lo condenó (sentencia 152/2026) como autor de un delito de prevaricación administrativa (Bloque C: la creación en 2023 de la Jefatura de Sección de Actividades Transfronterizas cubierta por Luis Carrero, cuya propuesta de modificación de la RPT firmó como diputado de Cultura) a 9 años de inhabilitación especial, y lo absolvió del resto. La sentencia NO es firme: cabe apelación ante el TSJ de Extremadura y rige la presunción de inocencia. ATENCIÓN (homonimia): las menciones a un 'Ricardo' en las transcripciones del caso Koldo (relaciones con Koldo García y Víctor de Aldama) con alta probabilidad NO corresponden a este político pacense; su condena pertenece exclusivamente a la causa de la Diputación de Badajoz."
    sources:
      - "https://www.aytobadajoz.es/es/ayto/corporacion-municipal/concejal/22837/ricardo-cabezas-martin/"
      - "https://transparencia.dip-badajoz.es/transparencia-institucional/cargos-electos/equipo-de-gobierno/ricardo-cabezas-martin/"
      - "https://www.extremadura7dias.com/noticia/vox-exige-dimision-de-ricardo-cabezas-acusado-prevaricacion"
  - entity_id: "Person:vidal-matas"
    name: "Vidal Matas"
    updated: "2026-10-04"
    resumen: "Vicenç Vidal Matas (Esporles, 31 de mayo de 1980) es un político de MÉS per Mallorca, diputado en el Congreso por las Illes Balears desde agosto de 2023 dentro del Grupo Plurinacional Sumar; previamente fue senador por las Illes Balears (2019-2023) y conseller de Medi Ambient, Agricultura i Pesca del Govern balear (2015-2019). En esta base figura por su intervención como vocal de la comisión de investigación del Congreso sobre la contratación de material sanitario durante la pandemia. Actúa en ejercicio de su función de control parlamentario, no como investigado."
    sources:
      - "https://es.wikipedia.org/wiki/Vicen%C3%A7_Vidal"
      - "https://www.congreso.es/es/busqueda-de-diputados?mostrarFicha=true&codParlamentario=192&idLegislatura=XV"
  - entity_id: "Organization:confederacion-hidrografica-del-tajo"
    name: "Confederación Hidrográfica del Tajo"
    updated: "2026-10-04"
    resumen: "La Confederación Hidrográfica del Tajo (CHT) es un organismo autónomo de cuenca, con personalidad jurídica propia, adscrito al Ministerio para la Transición Ecológica y el Reto Demográfico, responsable de la administración y gestión de las aguas de la demarcación del Tajo (CIF Q2817005H); fue creada por Real Decreto en 1926. En esta base aparece como entidad contratante del sector público vinculada a expedientes de contratación y al suministro de equipos de protección individual, en el marco de la revisión de la contratación de emergencia. Su mención responde a su condición de organismo público contratante, no a una imputación."
    sources:
      - "https://www.chtajo.es/"
      - "https://es.wikipedia.org/wiki/Confederaci%C3%B3n_Hidrogr%C3%A1fica_del_Tajo"
      - "https://administracion.gob.es/pagFront/espanaAdmon/directorioOrganigrama/fichaUnidadOrganica.htm?codigoUnidad=EA0043828"
  - entity_id: "Organization:ineco"
    name: "INECO"
    updated: "2026-05-31"
    resumen: "Ineco es una sociedad mercantil estatal de ingeniería y consultoría en transporte e infraestructuras, dependiente del Ministerio de Transportes y Movilidad Sostenible. En el caso Koldo la empresa aparece por presuntas contrataciones irregulares de personas del entorno de José Luis Ábalos y Koldo García: según la investigación y diversas informaciones periodísticas, habría contratado a Jésica Rodríguez (entonces pareja de Ábalos) y a Joseba García (hermano de Koldo); estos hechos se han examinado en el juicio contra Ábalos y Koldo (2026). Todos estos extremos están bajo investigación/enjuiciamiento y rige la presunción de inocencia. Ineco es un instrumento público vinculado a la causa, no un investigado formal."
    sources:
      - "https://es.wikipedia.org/wiki/INECO"
      - "https://www.transportes.gob.es/empresas-fomento/ineco"
      - "https://theobjective.com/espana/politica/2024-09-27/ineco-abalos-mexico-ficho-jesica/"
  - entity_id: "Court:tribunal-del-jurado"
    name: "Tribunal del Jurado"
    updated: "2026-10-04"
    resumen: "El Tribunal del Jurado es el órgano judicial español que materializa la participación directa de la ciudadanía en la justicia penal, previsto en el artículo 125 de la Constitución y desarrollado por la Ley Orgánica 5/1995 (LOTJ). Se compone de nueve jurados legos y un magistrado-presidente, y se constituye en el ámbito de las Audiencias Provinciales. Es competente para enjuiciar determinados delitos como el homicidio, las amenazas, el allanamiento de morada, la omisión del deber de socorro, delitos contra el honor y delitos cometidos por funcionarios públicos (cohecho, tráfico de influencias, malversación de caudales públicos, entre otros). En esta base aparece como referencia procesal genérica; no es el tribunal que instruye o enjuicia los casos investigados (que recaen principalmente en el Tribunal Supremo, la Audiencia Nacional o juzgados centrales de instrucción)."
    sources:
      - "https://es.wikipedia.org/wiki/Tribunal_del_Jurado_(Espa%C3%B1a)"
      - "https://www.boe.es/buscar/act.php?id=BOE-A-1995-12095"
  - entity_id: "Contract:obra-ferroviaria-logrono"
    name: "Obra ferroviaria — Logroño"
    updated: "2026-05-31"
    resumen: "Nodo que representa un contrato de obra pública en Logroño (La Rioja), una de las tres adjudicaciones a la UTE entre Acciona y la sociedad Servinabar 2000 SL examinadas por la UCO en la pieza de obra pública del caso Koldo. Según los informes de la UCO recogidos por la prensa, esta obra corresponde a la variante/Ronda Sur de Logroño (vinculada a la autovía A-68), adjudicada el 11 de septiembre de 2019 por unos 92,4 millones de euros, y NO es propiamente una obra ferroviaria como sugiere el nombre del nodo. Servinabar —de la que Santos Cerdán habría poseído un 45% desde 2015/2016 y vinculada a Antxon Alonso— habría cobrado en torno al 2% del importe (alrededor de 2,03 millones) mediante un contrato de prestación de servicios. Las tres obras (Logroño, Sevilla y Sant Feliú) sumaron unos 245,9 millones de euros. La causa está en instrucción en el Tribunal Supremo, los hechos no han sido juzgados y rige la presunción de inocencia para todas las personas y empresas implicadas."
    sources:
      - "https://www.infobae.com/espana/agencias/2025/11/18/las-obras-adjudicadas-por-245-millones-a-la-ute-entre-acciona-y-la-empresa-vinculada-a-cerdan-que-el-ts-investiga/"
      - "https://www.eldiario.es/la-rioja/bingo-logrono-detalles-informe-uco-trama-acciona-cerdan-rioja_1_12778092.html"
      - "https://es.wikipedia.org/wiki/Caso_Koldo"
  - entity_id: "Contract:obra-ferroviaria-sant-feliu-de-llobregat"
    name: "Obra ferroviaria — Sant Feliú de Llobregat"
    updated: "2026-10-04"
    resumen: "Corresponde al contrato de 'Construcción de la integración del ferrocarril en Sant Feliú de Llobregat' (Barcelona), una de las tres adjudicaciones a Acciona y la sociedad Servinabar 2000 SL examinadas por la UCO en la pieza de obra pública del caso Koldo. Según los informes de la UCO recogidos por la prensa, esta obra ferroviaria fue adjudicada a Acciona el 4 de noviembre de 2019 por unos 51,76 millones de euros, y Acciona contrató a Servinabar (tareas de seguridad y salud) por unos 1,04 millones, en torno al 2% del importe. Servinabar estaba vinculada a Antxon Alonso y Santos Cerdán habría poseído un 45% de su capital. La investigación analiza si estas adjudicaciones se lograron mediante presunta influencia indebida a cambio de comisiones. Los hechos no han sido juzgados y rige plenamente la presunción de inocencia."
    sources:
      - "https://www.infobae.com/espana/agencias/2025/11/18/las-obras-adjudicadas-por-245-millones-a-la-ute-entre-acciona-y-la-empresa-vinculada-a-cerdan-que-el-ts-investiga/"
      - "https://www.moncloa.com/2025/12/03/caso-koldo-tres-obras-3344453"
      - "https://es.wikipedia.org/wiki/Caso_Koldo"
  - entity_id: "Contract:obra-ferroviaria-sevilla"
    name: "Obra ferroviaria — Sevilla"
    updated: "2026-05-31"
    resumen: "Nodo que representa un contrato de obra pública en Sevilla, una de las tres adjudicaciones a Acciona y la sociedad Servinabar 2000 SL examinadas por la UCO en la pieza de obra pública del caso Koldo. Según los informes de la UCO recogidos por la prensa, la obra de Sevilla corresponde a actuaciones en el Puente del Centenario y/o accesos por la SE-40, es decir una obra de puente/viario y NO propiamente ferroviaria como sugiere el nombre del nodo. Acciona habría firmado con Servinabar memorandos que reproducían el modelo de colaboración (asistencia de consultoría a cambio de en torno al 2% de lo cobrado); la prensa cifra en torno a 1,8 millones lo presuntamente cobrado por Servinabar en relación con Sevilla. Las tres obras (Logroño, Sevilla y Sant Feliú) sumaron unos 245,9 millones de euros. Santos Cerdán habría poseído un 45% de Servinabar, vinculada a Antxon Alonso. La causa está en instrucción, los hechos no han sido juzgados y rige la presunción de inocencia."
    sources:
      - "https://www.infobae.com/espana/agencias/2025/11/18/las-obras-adjudicadas-por-245-millones-a-la-ute-entre-acciona-y-la-empresa-vinculada-a-cerdan-que-el-ts-investiga/"
      - "https://www.elpespunte.es/articulo/sevilla/cerdan-puente-centenario-uco-cifra-18-millones-cobrado-servinabar/20251119114402115666.html"
      - "https://es.wikipedia.org/wiki/Caso_Koldo"
  - entity_id: "Contract:suministro-de-mascarillas-adif-2020"
    name: "Suministro de mascarillas — ADIF (2020)"
    updated: "2026-10-04"
    resumen: "Corresponde a un contrato de suministro de mascarillas adjudicado en 2020, por la vía de emergencia de la pandemia de COVID-19, en el ámbito del Ministerio de Transportes. Según las fuentes, la orden ministerial partió de comprar mascarillas a través de Puertos del Estado para trabajadores de ADIF, Renfe, Enaire, Aena, Salvamento Marítimo y Correos, entre otros. Forma parte de la trama de mascarillas del caso Koldo, en la que la empresa Soluciones de Gestión y Apoyo a Empresas SL obtuvo en torno a 12 adjudicaciones por un importe global cercano a 53 millones de euros entre 2020 y 2021; según los informes de la UCO, Koldo García habría facilitado esas adjudicaciones a cambio de presuntas comisiones. El asunto se enjuicia en el Tribunal Supremo (juicio oral del caso mascarillas, en marcha en abril-mayo de 2026, instruido por el magistrado Leopoldo Puente), con José Luis Ábalos, Koldo García y Víctor de Aldama entre los acusados; rige la presunción de inocencia hasta que haya sentencia firme."
    sources:
      - "https://es.wikipedia.org/wiki/Caso_Koldo"
      - "https://www.eldiario.es/politica/53-millones-trama-mascarillas-concurso-sobrecostes-pagados-parte-fondos-europeos_1_10949340.html"
      - "https://www.poderjudicial.es/cgpj/es/Poder-Judicial/Tribunal-Supremo/Oficina-de-Comunicacion/Notas-de-prensa/El-instructor-del-Tribunal-Supremo-abre-juicio-oral-al-exministro-Abalos--su-exasesor-Koldo-Garcia-y-el-empresario-Aldama-por-la-contratacion-irregular-de-mascarillas-durante-la-pandemia-de-COVID"
  - entity_id: "Contract:suministro-de-mascarillas-puertos-del-estado-2020"
    name: "Suministro de mascarillas — Puertos del Estado (2020)"
    updated: "2026-10-04"
    resumen: "Corresponde a un contrato de suministro de mascarillas adjudicado en 2020 por la vía de emergencia de la pandemia a través de Puertos del Estado, organismo dependiente del Ministerio de Transportes entonces dirigido por José Luis Ábalos. Según las fuentes, la mayor adjudicación de la trama (unos 20 millones de euros) se decidió a través de Puertos del Estado el 21 de marzo de 2020, días después de declararse el estado de alarma. Se integra en la trama de mascarillas del caso Koldo, donde la mercantil Soluciones de Gestión y Apoyo a Empresas SL obtuvo en torno a 12 adjudicaciones por un importe global cercano a 53 millones de euros que, según la UCO, habrían generado presuntas comisiones para Koldo García y su entorno. El asunto se enjuicia en el Tribunal Supremo (juicio oral del caso mascarillas, en marcha en abril-mayo de 2026, instruido por el magistrado Leopoldo Puente); los hechos no están probados judicialmente y rige la presunción de inocencia para todos los acusados."
    sources:
      - "https://es.wikipedia.org/wiki/Caso_Koldo"
      - "https://www.eldiario.es/politica/53-millones-trama-mascarillas-concurso-sobrecostes-pagados-parte-fondos-europeos_1_10949340.html"
      - "https://www.poderjudicial.es/cgpj/es/Poder-Judicial/Tribunal-Supremo/Oficina-de-Comunicacion/Notas-de-prensa/El-instructor-del-Tribunal-Supremo-abre-juicio-oral-al-exministro-Abalos--su-exasesor-Koldo-Garcia-y-el-empresario-Aldama-por-la-contratacion-irregular-de-mascarillas-durante-la-pandemia-de-COVID"
  - entity_id: "Person:ismael-oliver"
    name: "Ismael Oliver"
    updated: "2026-05-31"
    resumen: "Ismael Oliver Romero es un abogado penalista español, socio director del despacho Oliver & Abogados (especializado en derecho penal económico, con sede cerca de la Audiencia Nacional) y exdirector de la asesoría jurídica de Siemens. Formó parte del equipo de defensa de Sandro Rosell, expresidente del FC Barcelona, que fue absuelto. En febrero de 2025 asumió la defensa de Koldo García en el caso mascarillas, defensa a la que posteriormente renunció. Según informaciones periodísticas sobre el auto judicial, el juez Santiago Pedraz lo imputó, junto a otros, por presuntos delitos de revelación de secretos, cohecho y contra las instituciones del Estado en la trama de las 'cloacas'/Leire Díez; se le atribuye indiciariamente haber contactado con Leire Díez para plantear la 'necesidad de negociar' con la testigo Carmen Pano antes de su comparecencia judicial. Rige plenamente la presunción de inocencia: está investigado/imputado, no condenado. Cualquier etiqueta ACCUSED_OF 'blanqueo de capitales' debe entenderse como imputación indiciaria no probada (y el 'blanqueo' corresponde al caso Rosell, en el que actuó como defensor, no como acusado)."
    sources:
      - "https://okdiario.com/espana/koldo-cambia-estrategia-contrata-abogado-pollo-carvajal-14237688"
      - "https://confilegal.com/20240307-oliver-abogados-una-boutique-especializada-en-penal-economico-con-una-experiencia-unica-en-empresas/"
      - "https://www.infobae.com/espana/2026/05/27/el-juez-ve-indicios-de-que-la-abogada-de-koldo-ofrecio-50000-euros-a-carmen-pano-para-intentar-cambiar-su-declaracion-sobre-los-pagos-en-ferraz-esta-se-vende/"
      - "https://spain.news-pravda.com/world/2026/05/27/93956.html"
  - entity_id: "Person:juana-cinta-calderon-zazo"
    name: "Juana Cinta Calderón Zazo"
    updated: "2026-07-14"
    resumen: "Juana Cinta Calderón Zazo es abogada (licenciada en Derecho por la Universidad de Granada, 1993) y técnica de Administración General en la Diputación de Badajoz desde 2000. Fue directora del Área de Recursos Humanos de la Diputación Provincial de Badajoz entre el 1 de junio de 2016 y el 24 de agosto de 2023, y es concejala y teniente de alcalde por el PSOE en el Ayuntamiento de Olivenza. El 14 de julio de 2026, la Audiencia Provincial de Badajoz la condenó (sentencia 152/2026) como cooperadora necesaria de un delito de prevaricación administrativa (Bloque B: la transformación en 2022 del puesto de David Sánchez en la jefatura de la Oficina de Artes Escénicas, tramitada con su ayuda desde RRHH aplicando un reglamento de 2003 que nunca fue aprobado ni publicado) a 9 años de inhabilitación especial, y la absolvió del resto. La sentencia NO es firme: cabe apelación ante el TSJ de Extremadura y rige la presunción de inocencia."
    sources:
      - "https://es.ayuntamientodeolivenza.com/da-juana-cinta-calderon-zazo/"
      - "https://www.moncloa.com/2025/10/16/david-sanchez-rrhh-peritaje-3269102/"
      - "https://www.libertaddigital.com/espana/2025-04-28/juez-biedma-procesa-david-sanchez-10-personas-prevaricacion-trafico-de-influencias-7247715/"
      - "https://www.esdiario.com/nacional/260528/188986/caso-david-sanchez-i-otros-imputados.html"
  - entity_id: "Person:luis-prieto-cuerdo"
    name: "Luis Prieto Cuerdo"
    updated: "2026-05-31"
    resumen: "Luis Prieto Cuerdo es directivo de Red.es, entidad pública adscrita al Ministerio para la Transformación Digital y de la Función Pública (dirigido por Óscar López); las fuentes lo identifican como director de Economía Digital de Red.es, cargo que ocupa desde septiembre de 2018, con trayectoria previa como subdirector general en distintos ministerios. Está imputado por la Fiscalía Europea (EPPO) por la presunta adjudicación irregular de contratos con fondos europeos a la consultora del empresario Juan Carlos Barrabés, asunto conectado con la pieza del caso Begoña Gómez. Según un informe de la IGAE y declaraciones de un exdirectivo de Red.es, la mesa/equipo de contratación que dirigía habría descartado sin justificación aparente una oferta competidora y valorado favorablemente las ofertas de Barrabés (en cuyo expediente figuraban cartas de recomendación de Begoña Gómez); las adjudicaciones, junto con otra empresa en UTE, sumaron en torno a 10,2 millones de euros. Los delitos investigados incluyen malversación, tráfico de influencias y prevaricación. Rige plenamente la presunción de inocencia: está imputado, no condenado."
    sources:
      - "https://www.elindependiente.com/espana/2025/10/01/fiscalia-europea-tiene-imputado-directivo-red-es-sigue-oscar-lopez/"
      - "https://es.linkedin.com/in/luis-prieto-cuerdo"
  - entity_id: "Person:ana-maria-fuentes-pacheco"
    name: "Ana María Fuentes Pacheco"
    updated: "2026-05-31"
    resumen: "Ana María Fuentes Pacheco (Ronda, Málaga, 1 de mayo de 1972) es jurista y dirigente del PSOE, con un perfil de cumplimiento normativo (compliance) y docencia en Derecho Constitucional. Fue diputada por Málaga (2004-2011), responsable de la Oficina de Cumplimiento del PSOE (2018-2021) y, desde octubre de 2021, gerente federal del partido, supervisando contratos, facturación, presupuestos y pagos internos. Tras la renuncia de Santos Cerdán, en junio de 2025 fue nombrada miembro de la Secretaría de Organización del PSOE de forma provisional. Según informaciones sobre el auto judicial, el juez Santiago Pedraz la imputó tras la entrada de la UCO en Ferraz por su presunta participación en la validación de pagos a Leire Díez mediante facturas que la UCO considera falsas, en el marco de la trama de las 'cloacas'/'caso Fontanera'; se la investiga por un posible delito de falsedad en documento mercantil. Rige plenamente la presunción de inocencia: está investigada/imputada, no condenada."
    sources:
      - "https://www.eleconomista.es/actualidad/noticias/13939754/05/26/quien-es-ana-maria-fuentes-la-gerente-del-psoe-imputada-por-el-juez-tras-la-entrada-de-la-uco-en-ferraz.html"
      - "https://www.democrata.es/tribunales/ana-maria-fuentes-gerente-psoe-imputada/"
      - "https://www.vozpopuli.com/espana/politica/la-gerente-del-psoe-investigada-por-la-financiacion-de-las-cloacas-diseno-la-operativa-interna-para-prevenir-delitos.html"
      - "https://es.wikipedia.org/wiki/Ana_Mar%C3%ADa_Fuentes"
  - entity_id: "Person:elisa-moriano-morales"
    name: "Elisa Moriano Morales"
    updated: "2026-07-14"
    resumen: "Elisa Moriano Morales fue directora del Area de Cultura y Accion Ciudadana de la Diputacion de Badajoz entre enero de 2016 y julio de 2019, durante la presidencia de Miguel Angel Gallardo, de cuya confianza era. El 14 de julio de 2026, la Audiencia Provincial de Badajoz la condeno (sentencia 152/2026) como cooperadora necesaria de un delito de prevaricacion administrativa (Bloque A: la creacion en 2016 del puesto de coordinador de los conservatorios para David Sanchez) a 9 anos de inhabilitacion especial, y la absolvio del resto. El tribunal declara probado que decidio la creacion del puesto junto a Gallardo y la diputada Cristina Nuñez, firmo la propuesta de la RPT, atribuyo falsamente la propuesta al director del Conservatorio Superior ante la mesa de negociacion y formo parte de la comision asesora que fijo criterios a la medida de David Sanchez. La sentencia NO es firme: cabe apelacion ante el TSJ de Extremadura y rige la presuncion de inocencia."
    sources:
      - "https://www.libertaddigital.com/espana/2024-12-10/la-uco-identifica-a-tres-personas-de-la-orbita-socialista-que-transformaron-el-puesto-para-darselo-al-hermano-de-sanchez-7195832/"
      - "https://www.esdiario.com/nacional/260528/188986/caso-david-sanchez-i-otros-imputados.html"
      - "https://theobjective.com/espana/tribunales/2025-04-09/imputada-caso-david-sanchez-contratacion/"
  - entity_id: "Company:lic"
    name: "LIC"
    updated: "2026-05-31"
    resumen: "LIC es Levantina, Ingenieria y Construccion SL, constructora con sede en Alberic (Valencia) cuyo gerente y socio (en torno al 20%) era el ingeniero Jose Ruz, identificado por la UCO por su relacion personal con Koldo Garcia y Jose Luis Abalos. Segun los informes de la UCO incorporados al caso Koldo, LIC habria recibido del Ministerio de Transportes dirigido por Abalos adjudicaciones por unos 125 millones de euros (en buena parte a traves de UTE), y las conversaciones intervenidas reflejan que Koldo Garcia habria realizado gestiones ante otros organismos (ADIF, etc.) para presuntamente favorecer a la empresa, incluida obra ferroviaria; entre los proyectos citados figura la estacion del AVE de Elche (ejecutada por la UTE LIC-Construcciones Vilor, en servicio en febrero de 2021). La compania entro en concurso voluntario de acreedores en 2024 y sus activos fueron adquiridos por socios de Cyes y Esyc. Rige la presuncion de inocencia: lo investigado son presuntas irregularidades en la tramitacion de contratos."
    sources:
      - "https://www.esdiario.com/comunidad-valenciana/250612/161068/jose-ruz-constructor-valenciano-intimo-koldo-abalos-llevaba-contratos-uco.html"
      - "https://valenciaplaza.com/valenciaplaza/comunitat-valenciana1/lic-la-constructora-valenciana-vinculada-a-las-mordidas-del-caso-koldo"
      - "https://www.elespanol.com/invertia/20250118/constructora-jose-ruz-vinculada-trama-koldo-adquirida-cyes-esyc-concurso-acreedores/917158539_0.html"
  - entity_id: "Organization:renfe"
    name: "Renfe"
    updated: "2026-05-31"
    resumen: "Renfe-Operadora es la entidad publica empresarial espanola encargada de la explotacion del transporte ferroviario de viajeros y mercancias, adscrita al Ministerio de Transportes que dirigio Jose Luis Abalos (2018-2021). Aparece de forma contextual en la documentacion del caso Koldo en relacion con presuntas gestiones de la orbita de Koldo Garcia durante la etapa de Abalos al frente del ministerio. La mencion de Renfe es institucional: la entidad no esta acusada de delito y las eventuales responsabilidades se circunscriben a personas concretas bajo investigacion, con plena presuncion de inocencia."
    sources:
      - "https://www.renfe.com/"
      - "https://en.wikipedia.org/wiki/Koldo_Case"
  - entity_id: "Company:sacyr"
    name: "Sacyr"
    updated: "2026-05-31"
    resumen: "Sacyr es una de las grandes constructoras e ingenierias espanolas, con actividad en obra civil, concesiones y servicios. En el marco del caso Koldo, los informes de la UCO recogen una conversacion intervenida (atribuida a abril de 2019) en la que Koldo Garcia mencionaba un reparto de obras entre Acciona, Sacyr y Ferrovial; segun la propia UCO algunas de esas adjudicaciones no llegaron a materializarse. Sacyr figura asi como empresa citada en el sumario, lo que no implica imputacion ni responsabilidad penal de la compania: el grueso de la investigacion sobre presuntas mordidas se centra en personas fisicas y, en el plano empresarial, principalmente en Acciona. Rige la presuncion de inocencia respecto a cualquier persona o entidad mencionada."
    sources:
      - "https://es.wikipedia.org/wiki/Caso_Koldo"
      - "https://www.eldiario.es/politica/claves-informe-uco-apunta-intermediacion-cerdan-cobro-mordidas-abalos-koldo-garcia_1_12379117.html"
      - "https://www.sacyr.com/"
  - entity_id: "Organization:agencia-tributaria"
    name: "Agencia Tributaria"
    updated: "2026-05-31"
    resumen: "La Agencia Tributaria (AEAT) es el organismo publico espanol encargado de la gestion, inspeccion y recaudacion del sistema tributario estatal y aduanero. En la documentacion de estos casos aparece de forma transversal y contextual, en relacion con cuestiones fiscales y deudas tributarias de personas y empresas investigadas. Es un organismo de la Administracion, no una parte investigada: figura como contexto institucional de las distintas tramas."
    sources:
      - "https://sede.agenciatributaria.gob.es/"
      - "https://es.wikipedia.org/wiki/Agencia_Estatal_de_Administraci%C3%B3n_Tributaria"
  - entity_id: "Person:francisco-martos-ortiz"
    name: "Francisco Martos Ortiz"
    updated: "2026-07-14"
    resumen: "Francisco Martos Ortiz es un politico socialista de la provincia de Badajoz, exalcalde de Castuera y exdiputado provincial (Delegado del Area de Cultura) de la Diputacion de Badajoz. El 14 de julio de 2026, la Audiencia Provincial de Badajoz lo condeno (sentencia 152/2026) como cooperador necesario de un delito de prevaricacion administrativa (Bloque B: firmo, como Delegado de Cultura, la ficha de modificacion que transformo en 2022 el puesto de David Sanchez en la jefatura de la Oficina de Artes Escenicas omitiendo el documento de funciones) a 9 anos de inhabilitacion especial, y lo absolvio del resto. La sentencia NO es firme: cabe apelacion ante el TSJ de Extremadura y rige la presuncion de inocencia. Con anterioridad fue condenado en primera instancia (2020, Juzgado de lo Penal de Don Benito) a tres anos de prision por acoso laboral al arquitecto municipal de Castuera, pero la Audiencia Provincial lo ABSOLVIO en apelacion (abril de 2022); asunto procesalmente distinto de la causa de la Diputacion."
    sources:
      - "https://okdiario.com/investigacion/diputado-psoe-protege-hermano-pedro-sanchez-prision-13457431"
      - "https://confilegal.com/20201107-el-alcalde-socialista-de-castuera-badajoz-condenado-a-3-anos-de-prision-por-mobbing-al-arquitecto-municipal/"
      - "https://www.eldiario.es/extremadura/politica/absuelto-alcalde-castuera-acoso-laboral-lesiones-psiquicas_1_8893573.html"
      - "https://www.infobae.com/espana/2026/05/28/comienza-el-juicio-a-david-sanchez-el-hermanito-musico-de-pedro-sanchez-las-acusaciones-piden-carcel-y-la-fiscalia-no-ve-nada/"
      - "https://www.dip-badajoz.es/cultura/archivo/historico_diputados/consulta_ficha.php?id=1038"
  - entity_id: "Company:llitarrada-innova-sl"
    name: "Llitarrada Innova Sl"
    updated: "2026-05-31"
    resumen: "Llitarrada Innova SL (CIF B86684032) es una sociedad holding con sede en Madrid (CNAE 642, actividades de sociedades holding), constituida el 4 de marzo de 2013, cuyo objeto es la adquisicion y tenencia de participaciones en empresas de innovacion, tecnologia, diseno e internet. Segun bases de datos mercantiles esta participada por Barrabes Internet SL (en torno al 91%) y por Luis Antonio Martin Bernardos (en torno al 9%), y actua como cabecera (holding personal) del entramado societario del empresario Juan Carlos Barrabes, controlando o participando en sociedades como Innova Next, Prismchain o Stepone Ventures. El grupo Barrabes es objeto de investigacion (UCO/Guardia Civil) en la pieza relativa a la catedra y contratos relacionados con Begona Gomez. No constan indicios de actividad ilicita directamente imputables a la sociedad, que opera bajo presuncion de inocencia."
    sources:
      - "https://www.empresia.es/empresa/llitarrada-innova/"
      - "https://www.axesor.es/Informes-Empresas/7697259/LLITARRADA_INNOVA_SL.html"
      - "https://www.vozpopuli.com/economia/inmobiliario/socio-begona-gomez-muda-su-holding-personal-sede-rectores-madrid.html"
  - entity_id: "Company:azvi"
    name: "AZVI"
    updated: "2026-05-31"
    resumen: "El Grupo Azvi es una constructora andaluza de obra civil e infraestructuras ferroviarias, con sede en Sevilla, presidida por Manuel Contreras Caro. Figura entre las empresas adjudicatarias de obra publica del Ministerio de Transportes durante la etapa de Jose Luis Abalos (2018-2021) -las informaciones cifran sus adjudicaciones en torno a 150-165 millones de euros, incluidas obras en Navarra- y cuyas adjudicaciones examina la UCO de la Guardia Civil en el caso Cerdan/Koldo por presunto cobro de comisiones ('mordidas'). Segun audios atribuidos a Koldo Garcia y a su esposa recogidos por la prensa, se discutia como facturar a Azvi 6.000 euros mensuales sin contrato; ademas, segun medios, Azvi habria fichado a Koldo Garcia por unos 6.000 euros al mes mas un 0,75% por cada obra internacional. Victor de Aldama atribuyo a Azvi un pago/comision en 2019. La compania ha rechazado las vinculaciones, no consta condenada y rige la presuncion de inocencia. El alias 'AZVI279' es un artefacto de extraccion (numeracion), no parte del nombre."
    sources:
      - "https://www.elespanol.com/espana/20240919/constructora-azvi-ficho-koldo-mes-obra-obtener-contratos-abalos/886911857_0.html"
      - "https://theobjective.com/espana/tribunales/2025-07-26/audio-koldo-constructora-azvi-amanos/"
      - "https://www.eleconomista.es/actualidad/noticias/13411501/06/25/mas-de-un-centenar-de-adjudicaciones-publicas-bajo-sospecha-por-mordidas-a-abalos-santos-cerdan-y-koldo-garcia.html"
      - "https://www.libertaddigital.com/espana/politica/2026-05-09/koldo-se-quejo-por-darle-obras-a-azvi-la-empresa-vinculada-a-las-obras-del-tramo-del-accidente-de-adamuz-1b-7401468/"
  - entity_id: "Person:sanchez-manzanares"
    name: "Sánchez Manzanares"
    updated: "2026-05-31"
    resumen: "Alvaro Sanchez Manzanares (n. 1972), jurista, fue secretario general de Puertos del Estado y delegado de proteccion de datos del organismo, y esta investigado en el caso Koldo por haber tramitado la compra de unos 8 millones de mascarillas (en torno a 20 millones de euros) a Soluciones de Gestion, empresa recomendada por el entorno de Jose Luis Abalos y Koldo Garcia. Fue cesado el 5 de marzo de 2024 por el ministro Oscar Puente por 'perdida de confianza', tras conocerse que Puertos del Estado habria facilitado informacion incompleta sobre su relacion con el intermediario Victor de Aldama pese a existir correos. Ante el juez de la Audiencia Nacional declaro (septiembre de 2024) que actuo siguiendo 'instrucciones' del Ministerio de Abalos. Koldo Garcia se referia a el como 'Alvarito' en conversaciones intervenidas. Rige la presuncion de inocencia; no consta condena en esta causa."
    sources:
      - "https://www.telecinco.es/noticias/espana/20240305/caso-koldo-quien-es-alvaro-sanchez-manzanares-cesado-puertos-estado-oscar-puente_18_011886502.html"
      - "https://www.eldiario.es/politica/ex-secretario-general-puertos-dice-juez-cumplio-instrucciones-ministerio-contratar-empresa-caso-koldo_1_11644652.html"
      - "https://www.elindependiente.com/economia/2025/07/20/de-las-mascarillas-de-koldo-a-las-obras-de-cerdan-todos-los-investigados-en-el-huracan-judicial-de-transportes/"
  - entity_id: "Company:caleton-consultores"  # re-key 2026-07-10: el nodo -sl se fusionó en el canónico (merges.yaml)
    name: "Caletón Consultores SL"
    updated: "2026-05-31"
    resumen: "Caleton Consultores SL es una sociedad de consultoria identificada en las diligencias previas 77/2024 del Juzgado Central de Instruccion (pieza sobre la presunta influencia en el rescate publico via SEPI/FASEE de 53 millones de euros a Plus Ultra Lineas Aereas en 2021) como una de las sociedades instrumentales a traves de las cuales habria circulado dinero presentado como servicios de consultoria. Segun la investigacion (UDEF) recogida por la prensa, Plus Ultra le abono pagos (por ejemplo 431.492 euros en 2021 y 329.479 euros en 2023) y la sociedad transfirio a su vez fondos a otras entidades de la red (como IoT/Lot Domotic Europe y Voli Analitica), mediante facturacion presuntamente simulada. Estaria controlada de facto por el abogado Santiago Fernandez Lena (secretario del consejo de Plus Ultra) y vinculada al entorno de Julio Martinez Martinez, presunto testaferro de Jose Luis Rodriguez Zapatero. No se ha establecido vinculacion con un delito probado y rige plenamente la presuncion de inocencia."
    sources:
      - "https://www.eleconomista.es/actualidad/noticias/13935228/05/26/plus-ultra-pago-17-millones-al-testaferro-de-zapatero-a-traves-de-sociedades-instrumentales.html"
      - "https://www.actualidad.es/politica/2026/05/25/acusaciones-de-la-udef-julio-martinez-redes-societarias-y-el-rescate-de-plus-ultra/"
      - "https://www.infobae.com/espana/2026/05/20/las-presuntas-maniobras-de-zapatero-para-ocultar-el-dinero-del-caso-plus-ultra-facturas-falsas-de-50000-euros-una-sociedad-offshore-en-dubai-y-ordenes-para-borrar-la-palabra-comision/"
  - entity_id: "Organization:fiadelso"
    name: "FIADELSO"
    updated: "2026-05-31"
    resumen: "FIADELSO (Fundación Internacional de Apoyo al Desarrollo Local y Social) es una ONG de cooperación al desarrollo fundada por el exministro de Transportes y exsecretario de Organización del PSOE José Luis Ábalos. La Generalitat Valenciana inició su liquidación judicial después de que un juzgado de Valencia estimase la demanda por no publicar sus cuentas desde 2016; la entidad estaba inactiva y se cerró en 2023. En el marco del caso Koldo, la UCO la ha situado como una de las líneas de investigación patrimonial sobre Ábalos: según informes de la Guardia Civil reflejados en prensa, la presunta trama habría canalizado pagos a la fundación (con su hija Tatiana Ábalos solicitando pagos a Koldo García), incluida una transferencia de 4.500€ emitida por Servinabar 2000 presentada como donación. La UCO obtuvo autorización para examinar cuentas de la fundación y sospecha que los pagos pudieron ser recurrentes. También se la relaciona con un inmueble en Perú que pertenecería a FIADELSO pero figura a nombre de Ábalos. Todo ello son indicios de una investigación en curso, bajo presunción de inocencia; no hay condena."
    sources:
      - "https://www.eldiario.es/comunitat-valenciana/generalitat-valenciana-inicia-liquidacion-judicial-fundacion-vinculada-exministro-abalos_1_10112143.html"
      - "https://www.eldiario.es/comunitat-valenciana/uco-vincula-hija-abalos-pagos-trama-caso-koldo-fundacion-fiadelso-vinculada-psoe_1_12380506.html"
      - "https://www.eldiario.es/comunitat-valenciana/abalos-utilizo-pagos-trama-koldo-fiadelso-pagar-gastos-injustificados-ong_1_12398027.html"
      - "https://theobjective.com/espana/politica/2025-06-13/tatiana-abalos-mordidas-cerdan-ong/"
      - "https://www.elcorreogallego.es/espana/2025/07/14/uco-busca-dinero-mordidas-cuentas-fiadelso-fundacion-abalos-119667034.html"
  - entity_id: "Person:leopoldo-puente-segura"
    name: "Leopoldo Puente Segura"
    updated: "2026-05-31"
    resumen: "Leopoldo Puente Segura (Madrid, 1964) es magistrado de la Sala Segunda (de lo Penal) del Tribunal Supremo desde noviembre de 2020, plaza a la que fue promovido por el Pleno del CGPJ con 19 de 21 votos (RD 911/2020, de 13 de octubre). Es el juez instructor de la causa especial contra aforados del caso Koldo, que investiga presuntas irregularidades en adjudicaciones de contratos públicos (mascarillas) y comisiones, con José Luis Ábalos, Koldo García y Víctor de Aldama entre los investigados/procesados. En el ejercicio de su función ha dictado autos relevantes y, el 27 de noviembre de 2025, acordó la prisión provisional de Ábalos y Koldo García al apreciar un riesgo 'extremo' de fuga, remitiendo posteriormente la causa hacia juicio. Su papel es estrictamente jurisdiccional: dirige la instrucción; no es parte ni investigado."
    sources:
      - "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2020-13806"
      - "https://www.poderjudicial.es/cgpj/es/Poder-Judicial/Tribunal-Supremo/Portal-de-Transparencia/Biografias/Puente-Segura--Leopoldo"
