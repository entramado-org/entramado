  - entity_id: "Person:joan-groizard"
    name: "Joan Groizard"
    updated: "2026-07-15"
    resumen: "Joan Groizard Payeras (Palma, 1989), ingeniero en Energía y Medio Ambiente por la Universidad de Cambridge, es secretario de Estado de Energía desde noviembre de 2024, cuando ocupó la vacante dejada por Sara Aagesen al ascender esta a vicepresidenta tercera. Antes fue director general de Energía y Cambio Climático del Govern balear (2015), director de Energías Renovables y Mercado Energético del IDAE (2018) y director general del IDAE (2019-2024). Aparece en el grafo citado en la comparecencia de Aagesen ante la comisión de investigación del Senado sobre la SEPI. No consta que esté investigado en ninguna causa; rige la presunción de inocencia."
    sources:
      - "https://www.elespanol.com/invertia/empresas/energia/20241128/gobierno-nombra-joan-groizard-ahora-director-general-idae-nuevo-secretario-energia/904659716_0.html"
      - "https://elperiodicodelaenergia.com/joan-groizard-nuevo-secretario-de-estado-de-energia/"
