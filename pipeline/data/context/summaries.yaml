      - "https://fiscalizacion.es/wp-content/uploads/2025/06/20250605_uco_cerdan.pdf"
  - entity_id: "LegalCase:sentencia-34-2019"
    name: "sentencia 34/2019"
    updated: "2026-06-01"
    resumen: "STS 34/2019, de 30 de enero de 2019, es una sentencia de casacion de la Sala Segunda del Tribunal Supremo. Segun el texto de la resolucion (recurso 10433/2018), resuelve un recurso contra una sentencia de la Audiencia Provincial de Gipuzkoa (Seccion Primera) de 31 de mayo de 2018 por delitos de estafa, robo con fuerza en casa habitada y blanqueo de capitales; el Supremo confirmo parcialmente la condena (estafa y robo) y anulo la condena por blanqueo por insuficiencia de prueba. Aparece citada en los documentos analizados como precedente jurisprudencial. NOTA: la otra referencia que vinculaba esta sentencia con doctrina sobre prevaricacion/trafico de influencias NO se ha confirmado para esta cita exacta (34/2019 de 30 de enero), por lo que probablemente corresponda a otra resolucion. Es jurisprudencia, no una causa contra los investigados de las tramas analizadas."
    sources:
      - "https://vlex.es/vid/763539769"

