  - entity_id: "Organization:boe"
    name: "BOE"
    updated: "2026-10-04"
    resumen: "El BOE (Boletín Oficial del Estado) es el diario oficial del Estado español, editado por la Agencia Estatal Boletín Oficial del Estado, donde se publican y entran en vigor las normas y actos oficiales. En esta causa aparece como referencia documental: en él se publicó el Real Decreto-ley 7/2020 (medidas urgentes COVID-19) y las órdenes ministeriales de contratación de emergencia analizadas en el informe de auditoría sobre la adquisición de mascarillas, así como menciones ligadas a Plus Ultra. Es un organismo institucional neutro, no un investigado; su presencia en esta base es como fuente normativa/cronológica, no como parte de ninguna trama."
    sources:
