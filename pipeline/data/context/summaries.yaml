  - entity_id: "LegalCase:sts-300-2012"
    name: "STS 300/2012"
    updated: "2026-06-01"
    resumen: "STS 300/2012, de 3 de mayo de 2012, es una sentencia de la Sala Segunda (de lo Penal) del Tribunal Supremo dictada en casacion (procedente de la Sala de lo Civil y Penal del Tribunal Superior de Justicia de Canarias, sentencia de 6 de junio de 2011) sobre un delito de trafico de influencias. La resolucion fija doctrina sobre la diferencia tipica entre el trafico de influencias y la prevaricacion (que emplean el termino 'resolucion' como objetivo de la influencia) y el cohecho (que utiliza una formula mas amplia), interpretando de forma restrictiva los requisitos del tipo. Aparece en la documentación analizada como precedente jurisprudencial citado para delimitar el alcance del delito de trafico de influencias. Es jurisprudencia, no una causa contra ninguno de los investigados de las tramas analizadas."
    sources:
      - "https://supremo.vlex.es/vid/-375393910"
      - "https://vlex.es/vid/375393910"
  - entity_id: "LegalCase:servicios-de-apoyo-a-la-direccion-general-de-innovacion-y-em"
    name: "Servicios de apoyo a la Dirección General de Innovación y Emprendimiento en la gestión del centro de innovación \"La Nave\""
    updated: "2026-06-01"
    resumen: "Se trata del objeto de un contrato publico del Ayuntamiento de Madrid (Area de Economia, Innovacion y Empleo) para servicios de apoyo a la Direccion General de Innovacion y Emprendimiento en la gestion del centro municipal de innovacion 'La Nave'. La adjudicataria fue Innova Next SLU, sociedad vinculada al empresario Juan Carlos Barrabes, por un importe de unos 1,79 millones de euros (en torno a 841.000 euros anuales) y plazo inicial de dos anos prorrogables; la adjudicacion se decidio por criterio economico entre siete empresas concurrentes. Este contrato figura entre los analizados en la causa instruida por el juez Juan Carlos Peinado sobre la actividad de Begona Gomez, esposa del presidente del Gobierno, por presuntos delitos de trafico de influencias y otros. Todos los implicados gozan de presuncion de inocencia. El identificador 300/2020/00884 corresponde al numero de expediente administrativo del contrato, no a una causa penal."
    sources:
      - "https://www.servimedia.es/noticias/contrato-ayuntamiento-madrid-empresa-barrabes-adjudico-criterio-economico/1410169859"
      - "https://www.elplural.com/politica/contrato-ayuntamiento-almeida-empresario-investiga-juez-peinado_330593102"
  - entity_id: "LegalCase:uco-n-211-2024"
    name: "UCO nº 211/2024"
    updated: "2026-06-01"
    resumen: "Referencia a un atestado o informe de la Unidad Central Operativa (UCO) de la Guardia Civil, numerado 211/2024 según la documentación analizada, elaborado dentro de la investigacion del denominado caso Koldo (contratos de mascarillas y presuntos amanos de obra publica). Los informes de la UCO de esta investigacion sustentan las actuaciones ante el Tribunal Supremo y atribuyen, segun la Guardia Civil, el cobro y reparto de presuntas comisiones a Jose Luis Abalos, Koldo Garcia y Santos Cerdan, a partir de grabaciones intervenidas. Se trata de un documento de investigacion policial: sus contenidos son indicios pendientes de valoracion judicial y todos los investigados mantienen la presuncion de inocencia."
