  - entity_id: "LegalCase:adif-av-3-18-20830-0165"
    name: "ADIF AV – 3.18/20830.0165"
    updated: "2026-06-01"
    resumen: "Numero de expediente de ADIF Alta Velocidad de la serie 3.18/20830, vinculada al soterramiento de la red arterial ferroviaria de la ciudad de Murcia (tramos Barriomar y Nonduermas) dentro del nuevo acceso ferroviario de Alta Velocidad de Levante. La obra se licito el 9 de agosto de 2018 y el contrato matriz de obras (3.18/20830.0295) se adjudico el 28 de mayo de 2019 a la UTE Ferrovial-Acciona por 158.801.001,18 euros. Segun el informe de la UCO, este seria uno de los contratos a los que Koldo Garcia y Jose Luis Abalos se referian como 'El Mayor', y en una conversacion de 2022 entre Koldo Garcia y Santos Cerdan se habria mencionado el cobro de 550.000 euros procedentes de dos obras de Murcia. Se trata de hechos atribuidos en una investigacion abierta: todos los implicados estan investigados bajo presuncion de inocencia y los hechos no han sido juzgados. El sufijo concreto .0165 no esta verificado de forma independiente en fuentes abiertas; lo confirmado es la serie de Murcia y el contrato matriz .0295."
