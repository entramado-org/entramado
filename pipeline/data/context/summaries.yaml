  - entity_id: "Person:sara-aagesen-munoz"
    name: "Sara Aagesen Muñoz"
    updated: "2026-07-15"
    resumen: "Sara Aagesen Muñoz (Madrid, 1976), ingeniera química por la Universidad Complutense, es vicepresidenta tercera del Gobierno y ministra para la Transición Ecológica y el Reto Demográfico desde el 25 de noviembre de 2024, en sustitución de Teresa Ribera. Técnica de la Oficina Española de Cambio Climático desde 2002 y negociadora climática de la delegación española, fue asesora del gabinete de la ministra Ribera (2018-2020) y secretaria de Estado de Energía (enero de 2020 - noviembre de 2024). En esa condición fue vocal del consejo gestor del FASEE, el fondo de la SEPI que aprobó los rescates de Air Europa y Plus Ultra, y por ello compareció el 8 de julio de 2026 ante la comisión de investigación del Senado sobre la SEPI, donde defendió la legalidad y el carácter técnico de las operaciones. No consta que esté investigada en ninguna causa; rige la presunción de inocencia."
    sources:
      - "https://www.lamoncloa.gob.es/gobierno/Paginas/biografias-xv-legislatura/ministra-sara-aagesen.aspx"
      - "https://es.euronews.com/my-europe/2024/11/25/quien-es-sara-aagesen-la-nueva-vicepresidenta-del-gobierno"
      - "https://es.wikipedia.org/wiki/Sara_Aagesen"
  - entity_id: "Person:miguel-gonzalez-suela"
    name: "Miguel González Suela"
    updated: "2026-07-15"
    resumen: "Miguel Ángel González Suela (Talavera de la Reina, 1969), licenciado en Derecho por la Universidad Complutense y administrador civil del Estado desde 1997, es subsecretario para la Transición Ecológica y el Reto Demográfico desde enero de 2020 (Real Decreto 125/2020). Antes fue director general de Servicios del Ministerio de Medio Ambiente (2010) y secretario general del CDTI. Aparece en el grafo por la comparecencia de Sara Aagesen ante la comisión de investigación del Senado sobre la SEPI (8 de julio de 2026), donde se le citó en relación con los informes que el ministerio elevó al consejo gestor del FASEE sobre los rescates. No consta que esté investigado en ninguna causa; rige la presunción de inocencia."
    sources:
      - "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2020-948"
      - "https://www.miteco.gob.es/en/ministerio/organizacion/organigrama/subsecretaria-transicion-ecologica-y-reto-demografico/ss_transicionyretodemografico.html"
