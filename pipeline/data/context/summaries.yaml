      - "https://es.wikipedia.org/wiki/Bolet%C3%ADn_Oficial_del_Estado"
  - entity_id: "Organization:bomberos"
    name: "Bomberos"
    updated: "2026-06-01"
    resumen: "Bajo 'Bomberos' se agrupan cuerpos de bomberos territorialmente distintos —Bomberos de Badajoz, Consorcio de Bomberos de la Provincia de Cádiz, parque emeritense (Mérida) y el servicio del SEPEI de Cáceres— mencionados sobre todo a propósito del apagón del 28 de abril de 2025 (rescates en ascensores, semáforos sin funcionar) en piezas de prensa de Extremadura. No es una organización única ni una entidad investigada; su aparición es contextual y de servicio público de emergencias."
  - entity_id: "Organization:delincuencia-economica"
    name: "Delincuencia Económica"
    updated: "2026-06-01"
    resumen: "Hace referencia al grupo o área de delincuencia económica de la Unidad Central Operativa (UCO) de la Guardia Civil, encargado de la investigación patrimonial y financiera en las principales causas de corrupción y dirigido por el teniente coronel Antonio Balas. Sus agentes elaboran los informes de la UCO que constan en el caso Koldo, la pieza Ábalos-Cerdán y otras causas, analizando flujos de dinero, sociedades y adjudicaciones. En el grafo aparece bajo múltiples variantes de nombre, que designan dependencias policiales. Es un órgano investigador, no un investigado: actúa por delegación judicial."
