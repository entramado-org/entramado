- entity_id: Organization:transformatsc-org
  name: Transformatsc.org
  resumen: 'Transformatsc.org es el dominio de internet de la plataforma digital «Transforma TSC», herramienta de
    medición de impacto social y medioambiental desarrollada en el seno de la Cátedra Extraordinaria de Transformación
    Social Competitiva que dirigía Begoña Gómez en la Universidad Complutense de Madrid (auto del Juzgado de Instrucción
    nº 41 de Madrid de 11 de abril de 2026, p.28). Según ese auto, el dominio fue dado de alta el 20 de septiembre
    de 2022, solicitado inicialmente por Blanca de Juan —coordinadora de la cátedra, según OKDiario y The Objective
    (25-05-2026)—, y pasó a figurar a nombre de Begoña Gómez desde el 13 de julio de 2023 (auto, p.28-29); el atestado
    de la UCO de 21 de mayo de 2026, según esos mismos medios, fecha ambos actos un día después (21 de septiembre
    de 2022 y 14 de julio de 2023). El 10 de octubre de 2022 Gómez solicitó a título personal el registro de la
    marca «Plataforma de medición de Impacto Social y Medioambiental www.TransformaTSC.org», incluyendo el dominio
    en la propia solicitud (auto, p.28); la inscripción de la marca a su nombre tuvo un coste de 127,88 euros abonado
    desde una cuenta de la que es titular única, y las renovaciones del dominio en Arsys (60,50 euros el 26 de julio
    de 2023 y 58,08 euros el 5 de abril de 2024) se pagaron también desde su cuenta personal (auto de 20 de junio
    de 2026, p.11 y p.13). Según OKDiario (25-05-2026), la UCO concluye que ni la marca ni el dominio se inscribieron
    a nombre de la universidad pese a que la herramienta se sufragó con fondos que, una vez ingresados en la UCM,
    adquirieron la condición de fondos públicos. Begoña Gómez está acusada en esa causa (auto de apertura de juicio oral de 21 de septiembre de 2026, p.65); su defensa sostiene que los hechos no son constitutivos de delito y pide la libre absolución (según Libertad
    Digital y elDiario.es, 3 y 4 de septiembre de 2026), y la Fiscalía ha anunciado que pedirá su absolución (según
    EFE, vía Infobae, 6 de septiembre de 2026). Rige la presunción de inocencia: se trata de imputaciones en una
    causa abierta, no de hechos probados.'
  sources:
