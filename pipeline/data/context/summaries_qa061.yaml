- entity_id: Organization:fiadelso
  name: FIADELSO
  resumen: 'FIADELSO (Fundación Internacional para el Desarrollo Local y Social, denominación que recoge el informe
    de la UCO junto a su CIF, p.54; elDiario.es la cita como «Fundación Internacional de Apoyo al Desarrollo Local
    y Social») es una fundación con sede en Valencia vinculada a José Luis Ábalos —exministro de Transportes y exsecretario
    de Organización del PSOE— y a su entorno familiar (auto del Tribunal Supremo de 30 de junio de 2025, p.12).
    Según elDiario.es y The Objective (13-06-2025), Ábalos fue uno de sus fundadores, la entidad se dedicaba a la
    cooperación al desarrollo en Iberoamérica y cerró en 2023. Según elDiario.es, la Generalitat Valenciana promovió
    su extinción: el Juzgado de Primera Instancia nº 3 de Valencia estimó la demanda autonómica por no haber publicado
    la fundación sus cuentas desde 2016 y el Protectorado de Fundaciones inscribió la declaración judicial de extinción
    y la apertura de su liquidación. En el marco del caso Koldo, el informe de la UCO recoge que Santos Cerdán gestionó
    con Koldo García una transferencia de 4.500 euros de Servinabar a la fundación, presentada como donativo, cuya
    confirmación Koldo reenvió a Tatiana Ábalos disculpándose por la tardanza (informe UCO, pp.54-55); el auto del
    Tribunal Supremo de 30 de junio de 2025 (p.12) aprecia indiciariamente que esos ingresos «no parecen haber tenido
    un carácter puntual sino periódico». Según El Correo Gallego (14-07-2025), la UCO busca dinero de presuntas
    mordidas en las cuentas de la fundación, y un inmueble en Chimbote (Perú) sería de FIADELSO pero figura a nombre
    de Ábalos en los registros. Todo ello son indicios de una investigación en curso, bajo presunción de inocencia;
    no hay condena.'
  sources:
  - https://www.eldiario.es/comunitat-valenciana/generalitat-valenciana-inicia-liquidacion-judicial-fundacion-vinculada-exministro-abalos_1_10112143.html
  - https://www.eldiario.es/comunitat-valenciana/uco-vincula-hija-abalos-pagos-trama-caso-koldo-fundacion-fiadelso-vinculada-psoe_1_12380506.html
