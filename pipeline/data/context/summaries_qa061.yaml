- entity_id: Person:laura-rodriguez-espinosa
  name: Laura Rodríguez Espinosa
  resumen: 'Laura Rodríguez Espinosa es hija del expresidente del Gobierno José Luis Rodríguez Zapatero y administra
    junto a su hermana Alba Rodríguez Espinosa la sociedad Whathefav SL, de la que ambas son administradoras y socias
    (informe UDEF 1907, p.78); según Wikipedia la fundaron las dos hermanas, según Infobae (24-05-2026) la sociedad
    comenzó sus operaciones en 2019, y la prensa la describe como agencia de publicidad (Público) o de marketing
    (actualidad.es, 24-05-2026). El auto del juez José Luis Calama (Audiencia Nacional, 18 de mayo de 2026, p.10)
    sostiene que Whathefav «actúa como sociedad finalista, recibiendo fondos de clientes y de otras sociedades instrumentales,
    generando facturación genérica y redistribuyendo pagos hacia el entorno de José Luis Rodríguez Zapatero», y
    la UDEF, según El Independiente (25-05-2026), la califica de «elemento finalista» capaz de generar «facturación
    ad hoc». Según el mismo auto (p.55), Análisis Relevante habría remitido 239.755 euros a Whathefav, Gate Center
    171.727 euros y sociedades del grupo Thinking Heads 12.297 euros; y las cuentas personales de las hermanas habrían
    recibido transferencias de Whathefav por 247.191,06 euros (Laura, entre abril de 2021 y diciembre de 2025) y
    199.904,25 euros (Alba, entre abril de 2023 y diciembre de 2025), en las que Zapatero figura como autorizado
    (p.50). El 18 de junio de 2026 el juez Calama acordó citarla como investigada, junto a su hermana Alba y a la
    secretaria de Zapatero, María Gertrudis Alcázar, según El Independiente (18-06-2026); según Wikipedia, a petición
    de la Fiscalía Anticorrupción. Rige la presunción de inocencia: se trata de una instrucción en curso, sin juicio
    ni condena, y ser citada como investigada no implica delito probado.'
