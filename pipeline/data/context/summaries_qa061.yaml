- entity_id: Person:francisco-enrique-flores-suarez
  name: Francisco Enrique Flores Suárez
  resumen: 'Francisco Enrique Flores Suárez es descrito como «empresario venezolano» en el auto de 18 de mayo de
    2026 del caso Plus Ultra (Diligencias Previas 77/2024 del Tribunal Central de Instancia; p.72) y en el informe
    UDEF 1907/2026 (p.158), que recoge que «informaciones periodísticas» refieren su fallecimiento el 6 de febrero
    de 2026. Su nombre aparece en la instrucción a propósito de los pagos de Softgestor SL a Análisis Relevante
    SL (sociedad del entorno de Julio Martínez Martínez): el auto localiza un contacto «grabado en su agenda como
    Fco Flores, no identificado» (p.46) que «podría corresponderse» con Flores Suárez, «ajeno formalmente a Softgestor»
    (p.72), y describe que los borradores del contrato de asesoramiento se intercambiaron entre Martínez Martínez
    y ese contacto (remitido el 13 de octubre de 2020, devuelto el 18 con los datos de Apamate Corporate And Trust
    y sustituidos el 22 por los de Softgestor), que Martínez Martínez reclamó el pago del segundo plazo a Flores
    Suárez «no a Carlos Alberto Parra Delgado, administrador de Softgestor», y que este llegó a plantear pagar «por
    otra vía distinta a Softgestor» (p.72); el juez aprecia «indicios consistentes de artificiosidad en la configuración
    formal de contratos y facturas» (p.46). No consta que estuviera investigado en la causa, no hubo condena y rige
    la presunción de inocencia; la causa sigue abierta.'
