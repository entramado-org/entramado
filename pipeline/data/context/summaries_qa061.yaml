    de Transportes recoge un correo del presidente de Puertos del Estado que, ante los retrasos de los fletes, pedía
    «activar a iberia o al ejército para que pongan un avión cargo» (informe de auditoría de 19 de agosto de 2024,
    p.39). En la causa de Plus Ultra figura únicamente como referencia en las conversaciones de los investigados
    sobre las ayudas públicas a las aerolíneas (informe UDEF 1908, p.45 y p.61; auto de 18-05-2026, p.60). Su mención
    es operativa/logística y no implica imputación alguna.'
