- entity_id: Person:jose-antonio-marco-sanjuan
  name: José Antonio Marco Sanjuán
  resumen: 'José Antonio Marco Sanjuán es inspector de Hacienda del Estado y fue presidente del Tribunal Económico-Administrativo
    Central (TEAC) hasta su dimisión en junio de 2025 (Diario de Sesiones del Senado, 13 de julio de 2026, p.21;
    El Correo Gallego, 23-03-2026); según El Debate (21-06-2025) había presidido antes durante una década el tribunal
    regional de Castilla y León. El Debate lo describía como el ''tres'' de la entonces vicepresidenta y ministra
    de Hacienda María Jesús Montero, y un senador lo llamó «el tercero del ministerio» (DS Senado, p.21), condición
    que la ministra negó: «no es el número tres del Ministerio de Hacienda, es un funcionario de carrera» (El Correo
    Gallego, 23-03-2026). Dimitió después de que El Debate publicara que habría cobrado de empresarios a los que
    archivaba pleitos fiscales; según ese medio (21-06-2025) la Fiscalía Anticorrupción abrió entonces diligencias
    por cinco delitos (cohecho, tráfico de influencias, prevaricación, malversación y negociaciones prohibidas a
    funcionarios). En marzo de 2026 el Juzgado de Instrucción nº 35 de Madrid admitió a trámite la querella por
    cohecho de la Fiscalía Anticorrupción, presentada tras una denuncia de Manos Limpias, con lo que pasó a estar
    investigado (imputado) por ese delito, según El Periódico (vía El Correo Gallego, 23-03-2026) y El Debate (08-07-2026).
    Según El Debate (12-05-2026), que cita un informe de la Unidad de Apoyo de la AEAT adscrita a Anticorrupción,
    la sociedad Investment Theorchad SL, de su amigo y socio Enrique Lahuerta Tornos —considerado por los investigadores
    presunto testaferro—, recibió 1.258.922 euros en 138 transferencias de Alza Obras y Servicios SL, de unos empresarios
    a los que el TEAC que él presidía anuló el 19 de mayo de 2023 una derivación de responsabilidad de 16.099.696
    euros; el mismo medio sitúa en el entramado analizado a B2B Corporación Jurídica SL, administrada por su pareja.
    Según El Debate (08-07-2026), tras dimitir fue destinado como inspector a la Dependencia
    Regional de Inspección de la AEAT en la Comunidad Valenciana —el área que rastrea el entramado societario vinculado
    a José Luis Rodríguez Zapatero (caso Plus Ultra)—, sin expediente interno ni suspensión cautelar; la exdirectora
    de la AEAT declaró en el Senado que pidió plaza en Valencia (DS Senado, 13-07-2026, p.22).
    Su causa no forma parte de los documentos judiciales de esta base (la información procede de prensa y del Diario de Sesiones del Senado). Es una instrucción en curso sin juicio ni condena; rige plenamente la presunción de
    inocencia.'
  sources:
  - https://www.eldebate.com/espana/20250621/caida-jose-antonio-marco-sanjuan-tres-montero-anticorrupcion-investiga-cohecho-trafico-influencias_309151.html
  - https://www.elcorreogallego.es/espana/2026/03/23/juez-imputa-delito-cohecho-expresidente-tribunal-economico-administrativo-central-128320553.html
  - https://www.eldebate.com/espana/20260512/entramado-ex-tres-montero-cobro-12-millones-anular-empresario-multa-16-millones-hacienda_416411.html
  - https://www.eldebate.com/espana/20260708/area-hacienda-investiga-zapatero-donde-esta-colocado-ex-tres-montero-imputado-cobrar-mordidas_436988.html
  updated: '2026-10-04'
