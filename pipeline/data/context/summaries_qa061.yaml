- entity_id: Person:jose-cristobal-barrabes-consul
  name: José Cristóbal Barrabés Consul
  resumen: 'José Cristóbal Barrabés Cónsul es uno de los tres hermanos Barrabés Cónsul (junto con Juan Carlos y
    Arturo); según El Español (15-06-2024), la familia procede de Espés, aldea del Pirineo oscense cercana a Benasque,
    donde creció el negocio familiar. Según el informe de la UCO del caso de la cátedra de Begoña Gómez, los tres
    hermanos ostentan el 32,51 % cada uno de Grupo Barrabés Consul SL, matriz de Barrabés Internet SL, y José Cristóbal
    figura además como consejero de sociedades del grupo (informe UCO, p.14-15 y p.77). Ese informe destaca la concentración
    de contratos públicos en Innova Next SLU, sociedad de Juan Carlos Barrabés Cónsul: unos 20,2 millones de euros
    en 2021-2022, aproximadamente el 90 % de sus adjudicaciones (p.80 y p.127). Juan Carlos, hermano de José Cristóbal,
    tiene la condición de investigado en esa causa por presuntos delitos de tráfico de influencias y corrupción
    en los negocios (auto de 11 de abril de 2026, p.38); según Infobae (16-07-2026), la Audiencia Provincial de
    Madrid lo excluyó del juicio con jurado de la causa principal, y la pieza sobre el contrato de Red.es a la UTE
    de Innova Next y KPMG fue remitida a la Fiscalía Europea (Europa Press vía The Objective, 04-08-2026). No consta
    que José Cristóbal Barrabés Cónsul tenga la condición de investigado en la causa; su papel documentado es el
    de coaccionista familiar y consejero. Rige la presunción de inocencia.'
