    causa de David Sánchez (hermano de Pedro Sánchez) instruida en Badajoz: la respuesta de BBVA al oficio judicial
    obra en la causa (escrito de acusación, p.35) y, según The Objective (13-12-2024), certifica que a 30 de junio
