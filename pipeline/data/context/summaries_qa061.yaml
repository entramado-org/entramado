- entity_id: Contract:obra-ferroviaria-logrono
  name: Obra ferroviaria — Logroño
  updated: '2026-09-09'
  resumen: Contrato de obra pública en Logroño (La Rioja), una de las tres adjudicaciones a la UTE entre
    Acciona y la sociedad Servinabar 2000 SL examinadas por la UCO en la pieza de obra pública del caso
    Koldo. Según los informes de la UCO recogidos por la prensa, esta obra corresponde a la variante/Ronda
    Sur de Logroño (vinculada a la autovía A-68), adjudicada el 11 de septiembre de 2019 por unos 92,4
    millones de euros, y no es propiamente una obra ferroviaria pese a su denominación. Servinabar —de
    la que Santos Cerdán habría poseído un 45% desde 2015/2016 y vinculada a Antxon Alonso— habría cobrado
    en torno al 2% del importe (alrededor de 2,03 millones) mediante un contrato de prestación de servicios.
    Las tres obras (Logroño, Sevilla y Sant Feliú) sumaron unos 245,9 millones de euros. La causa está
    en instrucción en el Tribunal Supremo, los hechos no han sido juzgados y rige la presunción de inocencia
    para todas las personas y empresas implicadas.
  sources:
  - https://www.infobae.com/espana/agencias/2025/11/18/las-obras-adjudicadas-por-245-millones-a-la-ute-entre-acciona-y-la-empresa-vinculada-a-cerdan-que-el-ts-investiga/
  - https://www.eldiario.es/la-rioja/bingo-logrono-detalles-informe-uco-trama-acciona-cerdan-rioja_1_12778092.html
  - https://es.wikipedia.org/wiki/Caso_Koldo
  reason: 'spec 061 L7: retirada la frase de meta-texto sobre el nodo/grafo; contenido factual sin cambios'
