- entity_id: Person:felix-gonzalez-marquez
  name: Félix González Márquez
  resumen: 'Félix González Márquez es funcionario de carrera de la Diputación de Badajoz, donde en 2017 era Jefe
    de Servicio de Gestión de RRHH (sentencia de la Audiencia Provincial de Badajoz de 14 de julio de 2026, pp.10
    y 212); no consta en las fuentes su cargo actual y Infobae (28-05-2026) lo cuenta entre los «ex altos cargos»
    de la institución. El 14 de julio de 2026, la Audiencia Provincial de Badajoz lo condenó (sentencia nº 152/2026)
    como autor por cooperación necesaria de un delito de prevaricación administrativa correspondiente al Bloque
    A de los hechos probados —formó parte de la comisión asesora que el 26 de junio de 2017 fijó los criterios de
    valoración de los currículos otorgando mayor puntuación a los que sabían que concurrían en David Sánchez (p.10),
    y consta un informe-propuesta confeccionado por él que consideraba apto únicamente a David Sánchez, mientras
    el acta oficial incorporada al procedimiento recogía la aptitud de seis aspirantes (p.358)— a la pena de nueve
    años de inhabilitación especial para empleo o cargo público y para el ejercicio del derecho de sufragio pasivo
    (pp.373-374), y lo absolvió libremente del resto de infracciones que se le imputaban (p.375). La sentencia NO
    es firme: cabe recurso de apelación en diez días ante la Sala Civil y Penal del Tribunal Superior de Justicia
    de Extremadura (p.376) y rige la presunción de inocencia. ATENCIÓN (homonimia): las menciones a un «Félix» en
    una conversación intervenida a Koldo García («yo sé que Félix habla con… con Azvi», informe UCO, p.349; reproducida
    por Libertad Digital, 09-05-2026) pertenecen al caso Koldo y no consta que se refieran a esta persona; no confundir
    tampoco con el expresidente del Gobierno Felipe González Márquez.'
