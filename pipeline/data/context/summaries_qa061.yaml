- entity_id: Person:sanchez-manzanares
  name: Sánchez Manzanares
  resumen: Álvaro Sánchez Manzanares (Madrid, 1972, según Wikipedia), licenciado en Derecho (según Wikipedia), fue
    secretario general de Puertos del Estado y, desde 2017, delegado de protección de datos del organismo (Telecinco,
    05-03-2024), y está investigado en el caso Koldo por haber tramitado la compra de 8 millones de mascarillas
    por 20 millones de euros a Soluciones de Gestión y Apoyo a Empresas SL (informe de auditoría del Ministerio
    de Transportes de 19 de agosto de 2024, p.41), empresa recomendada por Koldo García, asesor de José Luis Ábalos,
    según Telecinco (05-03-2024); la exposición razonada de 23 de octubre de 2024 recoge que su superior, Francisco
    Toledo (entonces presidente de Puertos del Estado), le reprochaba las condiciones de entrega de Soluciones cuando
    existía una oferta que mejoraba precio y plazo (p.10). Fue cesado el 5 de marzo de 2024 por el ministro Óscar
    Puente; según El País (vía Telecinco), por «pérdida de confianza», después de que, según El Mundo (vía Telecinco),
    Puertos del Estado negara ante la ONIF de la Agencia Tributaria «relación alguna» con Víctor de Aldama pese
    a existir al menos un correo de Sánchez Manzanares con el empresario. El 11 de septiembre de 2024 declaró como
    investigado ante el juez Ismael Moreno, de la Audiencia Nacional, y sostuvo que se limitó a cumplir «instrucciones»
    del Ministerio de Transportes, entonces dirigido por Ábalos, y que había expresado dudas sobre la solvencia
    de Soluciones de Gestión (elDiario.es, 11-09-2024; Diario de Sesiones del Senado DS_C_15_233, p.20). Según Telecinco
    (05-03-2024), Koldo García se refería a él como «Alvarito» en conversaciones intervenidas, apodo recogido también
    en la comisión de investigación del Senado (DS_C_15_233, pp.33-34). Rige la presunción de inocencia; no consta
    condena en esta causa.
