- entity_id: Person:julio-martinez-martinez
  name: Julio Martínez Martínez
  resumen: 'Julio Martínez Martínez, conocido como ''Julito'' (así lo llaman en el Senado y en El Español), es un
    empresario distinto de Julio Martínez Sola, presidente y cofundador de Plus Ultra según Infobae y elDiario.es
    (el auto de Calama lo cita como vicepresidente en 2020): en el entorno de la aerolínea hay DOS personas de nombre
    similar, los documentos judiciales las separan expresamente y se llaman ''tocayo'' en los chats del caso (auto
    de 18 de mayo de 2026, p.18-19 y p.59). A Martínez Martínez la UDEF y el auto de Calama lo presentan como el
    canalizador de fondos hacia el entorno de Zapatero —la ''vía Zapatero''—, administrador único de Análisis Relevante
    (auto p.71) y titular de Idella Consulenza Strategica, con la que Plus Ultra firmó el contrato del 1% más IVA
    sobre la ayuda pública; el instructor le atribuye el rol de ''lugarteniente principal y figura visible'' de
    una presunta estructura de tráfico de influencias (p.59) y lo considera titular formal de una red societaria
    destinada presuntamente a canalizar fondos, señalando a José Luis Rodríguez Zapatero y su entorno como presuntos
    beneficiarios. Plus Ultra fue rescatada con unos 53 millones de euros durante la pandemia a través de la SEPI
    (FASEE, 2021). Según la ONIF, citada en el auto (p.48), Análisis Relevante fue la principal sociedad pagadora
    del entramado que controla, con pagos por 707.467,58 euros entre 2020 y 2025. Separadamente, Idella Consulenza
    Strategica suscribió con Plus Ultra un contrato que generaría un ingreso de 530.000 euros (auto p.11); según
    Infobae, Plus Ultra habría abonado a Análisis Relevante 301.290 euros entre octubre de 2020 y septiembre de
    2021. El 11 de diciembre de 2025 se practicaron entradas y registros ordenados por la Sección de Instrucción
    del Tribunal de Instancia de Madrid, Plaza 15, en la pieza separada 62/2025 de las DP 597/2021 (informe UDEF
    1907, p.11); según The Objective y Libertad Digital, ese día fue detenido junto a Julio Martínez Sola y Roberto
    Roselli. Está investigado (informe UDEF 1907, p.167). Rige la presunción de inocencia.'
