- entity_id: Company:azvi
  name: AZVI
  resumen: 'El Grupo Azvi es una constructora de obra civil e infraestructuras ferroviarias presidida por Manuel
    Contreras Caro (escrito de la defensa de Víctor de Aldama incorporado a la Causa Especial 20775/2020 del Tribunal
    Supremo, p.23-24), descrita como constructora sevillana y andaluza por El Español (19-09-2024) y The Objective
    (26-07-2025). Figura entre las empresas adjudicatarias de obra pública del Ministerio de Transportes durante
    la etapa de José Luis Ábalos (2018-2021): según El Español (19-09-2024), logró en solitario adjudicaciones por
    165 millones de euros en esos tres años y fuentes del caso confirmaban que se investigaban sus adjudicaciones;
    The Objective (26-07-2025) las cifra en más de 150 millones. Según El Español (19-09-2024), Azvi fichó a Koldo
    García por unos 6.000 euros al mes, conforme a un contrato firmado por Contreras Caro, más un 0,75% del importe
    de cada obra lograda a nivel internacional (hasta un máximo de 350.000 euros); según Libertad Digital (09-05-2026),
    esa relación duró entre 2023 y 2024 y cesó tras la detención de Koldo en febrero de 2024. Según audios recogidos
    por The Objective (26-07-2025), Patricia Uriz, esposa de Koldo, comentaba en 2023 que no sabía si podían «hacer
    factura a Azvi sin tener un contrato», y Koldo preguntaba «sobre facturas de 6.000 euros de Azvi». En su escrito
    ante el Tribunal Supremo, la defensa de Aldama sostiene que Azvi realizó un pago de 18.000 euros el 9 de octubre
    de 2019 a Pilot Club Natación de Sevilla, sociedad vinculada a Aldama, «como compensación por la obra pública
    adjudicada con su mediación» (p.24); según El Español, la empresa sostiene que fue una «cuota» para un negocio
    en un club de natación que le fue devuelta el 17 de marzo de 2020, y según The Objective Azvi ha rechazado esa
    acusación en los tribunales. En el informe de la UCO sobre Santos Cerdán, Azvi aparece en una nota del móvil
    de Koldo junto a otras constructoras asociadas a posibles obras de la Dirección General de Carreteras (informe
    UCO, p.184) y en un mensaje de Javier Herrero de abril de 2019 como «azvi empresa andaluza» adjudicataria (p.123).
    La compañía no consta imputada ni condenada y rige la presunción de inocencia.'
