- entity_id: Person:carmen-almendras
  name: Carmen Almendras
  resumen: 'María del Carmen Almendras Camargo es exembajadora de Bolivia en España (2007-2015) y Senior Advisor
    de la consultora Kreab Bolivia. Según el informe nº 2910/26 de la UDEF (conocido en junio de 2026), habría actuado
    como intermediaria y enlace entre el entorno de José Luis Rodríguez Zapatero y los directivos del Grupo Gloria:
    remitió documentación sobre la consultoría, recibió el borrador del contrato de asesoramiento y fue informada
    de las gestiones; los contactos con altos cargos del Gobierno boliviano (el presidente Luis Arce, la ministra
    María Nela Prada y la jefa de gabinete Fabiola Salazar) los gestionó, según ese mismo informe, la secretaria
    de Zapatero, Gertrudis Alcázar. Según PRNoticias (24-06-2026), las agendas de Zapatero recogen más de una decena
    de reuniones, videoconferencias y contactos suyos con el expresidente entre 2024 y 2025; el informe UDEF 2910/26
    documenta, entre otras, una reunión el 8 de mayo de 2024 en el despacho del expresidente en la calle Ferraz
    de Madrid (pp.12 y 20) y videoconferencias el 28 de mayo de 2024, el 2 de diciembre de 2024 y el 24 de abril
    de 2025 (pp.14, 17 y 18). Rige la presunción de inocencia: no está condenada ni hay sentencia en la causa, que
    sigue abierta.'
  sources:
