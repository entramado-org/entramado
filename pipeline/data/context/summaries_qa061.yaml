  name: Instituto Navarro de Deporte y Juventud
  resumen: 'El Instituto Navarro de Deporte y Juventud es el organismo autónomo del Gobierno de Navarra que gestiona
    las políticas de deporte y juventud. Promovió el traslado de parte de sus oficinas al Navarra Arena, obra adjudicada
