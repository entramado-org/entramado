- entity_id: Person:francisco-javier-lorente
  name: Francisco Javier Lorente
  resumen: 'Francisco Javier Lorente Rodríguez gestionaba el bar Franky de Pamplona, según el informe de la UCO
    en la causa de Santos Cerdán (informe UCO, p.193). Según ese informe, el establecimiento habría actuado presuntamente
    como intermediario en una operativa que habría permitido obtener liquidez de ACCIONA para el entorno de Koldo García:
    ACCIONA abonaba por transferencia facturas que la UCO califica de «ficticias» y el restaurante compensaba esos
    abonos con dinero en efectivo que posteriormente retiraba Koldo García (informe UCO, pp.193-194). Según elDiario.es
    (24-02-2026), Lorente compareció el 24 de febrero de 2026 ante la comisión de investigación del Parlamento de
    Navarra, donde negó haber participado o tener conocimiento de la presunta trama, aseguró que «nunca» pagó dinero
    en efectivo a Koldo García y atribuyó la elaboración de las facturas a su «amigo» y contable, Miguel Moreno
    Purroy. Según The Objective (13-05-2026), Moreno Purroy declaró después como testigo ante el juez Ismael Moreno
    que elaboró facturas falsas a nombre de Acciona a petición de Koldo García, y Lorente, que declaró a continuación,
    volvió a negar haber entregado dinero en efectivo a Koldo García. Rige la presunción de inocencia: no consta
    que Lorente figure como investigado en el procedimiento judicial.'
  sources:
  - https://www.eldiario.es/navarra/dueno-bar-franky-pamplona-senalado-uco-niega-haber-emitido-facturas-falsas-acciona_1_13015570.html
  - https://theobjective.com/espana/tribunales/2026-05-13/franky-facturas-falsas-koldo-acciona/
  updated: '2026-10-01'
  reason: '063 tramo 2 (2026-10-01): Se retira «dueño» porque la UCO (pp.194-195) sitúa la propiedad en otra persona.
    Se corrige el flujo de dinero: ACCIONA pagaba por transferencia y el efectivo lo retiraba Koldo. Se retira «o
    de sociedades vinculadas» por no tener fuente. Se atribuyen la comparecencia a elDiario.es (24-02-2026) y la
    admisión de Moreno Purroy a The Objective (13-05-2026). Se añade la declaración judicial de 13-05-2026 y la
    salvaguarda queda como «no consta». Se quita la fuente de Noticias de Navarra porque es inaccesible.'
