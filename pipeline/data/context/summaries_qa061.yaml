- entity_id: Person:jose-blanco
  name: José Blanco
  resumen: 'José Blanco López, ''Pepe Blanco'', fue secretario de Organización del PSOE (2000-2008), vicesecretario
    general (2008-2012) y ministro de Fomento (2009-2011), según Wikipedia; Actualidad.es (24-05-2026) le atribuye
    la consultora de asuntos públicos Acento Public Affairs. En los documentos analizados del caso Koldo aparece en las grabaciones
    que Koldo García hizo de sus conversaciones con Santos Cerdán, transcritas en el informe de la UCO: en la del
    2 de febrero de 2022 Koldo afirma que Isabel Pardo de Vera «habla con Óscar López y con Antonio (ininteligible)
    […] a través de Pepiño Blanco» (informe UCO, p.368), y en la del 12 de diciembre de 2023 dice que «Pepe Bono,
    Pepe Blanco» «han venido a pedirme de todo» y que «Isabel Pardo de Vera, con Pepiño Blanco, están haciendo la
    (ininteligible) juntos» (informe UCO, pp.400-401). Son manifestaciones de Koldo en conversaciones privadas,
    no hechos acreditados. En la comisión de investigación del Congreso, Ábalos, preguntado por Blanco, se limitó
    a responder que «era vicesecretario general del partido» (DS Congreso 103, p.46). No consta que esté investigado
    ni imputado en estas causas; rige la presunción de inocencia.'
  sources:
  - https://es.wikipedia.org/wiki/Partido_Socialista_Obrero_Espa%C3%B1ol
  - https://es.wikipedia.org/wiki/Jos%C3%A9_Luis_Rodr%C3%ADguez_Zapatero
