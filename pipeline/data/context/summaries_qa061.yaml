    = auto p.32-33 (fuente judicial directa, ya no hace falta la prensa)'
- entity_id: Person:jose-angel-partearroyo
  name: José Ángel Partearroyo
  resumen: José Ángel Partearroyo fue director del área de empresas participadas de la SEPI (Sociedad Estatal de
    Participaciones Industriales), responsable de proponer rescates a compañías en dificultades. Según el auto del
    juez Calama y los informes de la UDEF, habría instado a acelerar la tramitación del rescate de Plus Ultra y
    comunicó a la aerolínea el 2 de marzo de 2021 que la ayuda había sido aprobada por el Consejo Gestor del FASEE,
