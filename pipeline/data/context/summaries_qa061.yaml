- entity_id: Organization:boutique-financiera
  name: boutique financiera
  resumen: 'La ''boutique financiera'' (en las conversaciones, ''finance boutique'' o simplemente ''la boutique'')
    es la denominación que los propios investigados dan —y que la UDEF y el auto del juez Calama de 18 de mayo de
    2026 recogen— a la presunta estructura mercantil que, según esas fuentes, Julio Martínez Martínez y el «equipo»
    en torno a José Luis Rodríguez Zapatero habrían montado para canalizar las ''mordidas'' del rescate de Plus
    Ultra mediante facturas y contratos de asesoría a través de sociedades instrumentales (Análisis Relevante e
    Idella Consulenza Strategica, ambas de Julio Martínez Martínez; auto de 18-05-2026, pp.10-11 y p.29; informe
    UDEF 1907, p.35 y pp.79-80). En un chat de 18 de mayo de 2020, Roselli comenta a Rodolfo Reyes que Julio Martínez
    ''montaron su finance boutique'' y que ''así que por ahí vendrá la mordida'' (auto de 18-05-2026, p.14; informe
    UDEF 1908, p.49); el 16 de junio de 2020 Reyes pregunta a Roselli si ''la boutique financiera'' ha puesto precio
    a sus servicios (auto, p.15); clientes de la boutique aparecen en las conversaciones (p. ej. Domingo Amaro Chacón,
    «cliente de la boutique» según el informe UDEF 1907, p.80, y el auto, p.29). Según el informe policial, los
    pagos se articulaban formalmente bajo apariencia de contratos de asesoría para encubrir el presunto cobro de
    influencias en torno a José Luis Rodríguez Zapatero. Es un concepto descriptivo del entramado, no una sociedad
    inscrita con ese nombre registral. Presunción de inocencia: relato de la UDEF, no juzgado.'
