- entity_id: Company:afitta-sl
  name: Afitta SL
  resumen: 'Afitta SL es una mercantil que el auto de 18 de mayo de 2026 del juez José Luis Calama sitúa en el entorno
    societario de Julio Martínez Martínez —a quien Infobae (25-05-2026) describe como «amigo personal y supuesto
    colaborador» del expresidente José Luis Rodríguez Zapatero— entre las sociedades a través de las que este canalizaría
    fondos (auto, p.36 y p.41); el auto la describe «en posición de ajenidad respecto de la operativa económica
    real, limitándose a actuar como titular meramente formal en determinadas operaciones» (auto, p.12). Según Mundiario
    (21-05-2026, citando El País), era una sociedad sin actividad reciente que cambió de manos en mayo de 2021,
    en pleno despliegue del rescate de Plus Ultra, cuando Julio Martínez asumió la administración única. En 2023
    recibió de Summer Wind SL —que ese año había recibido 3.979.182 euros de Plus Ultra— pagos por un total de 213.202
    euros, amparados en un contrato de 1 de julio de 2023 de asesoramiento en la negociación y formalización de
    operaciones aeronáuticas y en una factura emitida el 30 de diciembre de 2023 cuyo concepto, según el auto, se
    adaptó con posterioridad (auto, p.41-42; informe UDEF 1907/26, p.135). La instrucción examina si esos flujos
    formaron parte de un presunto esquema de tráfico de influencias en torno al rescate público de 53 millones de
    euros a Plus Ultra. Summerwind alegó ante el juez que existe una «contractualidad real, no facturación ''ad
    hoc''», declarada a la Agencia Tributaria, y que no recibe fondos de Plus Ultra sino que le paga (según Infobae,
    25-05-2026). Rige la presunción de inocencia: son hipótesis de investigación, no hechos probados.'
  sources:
  - https://www.actualidad.es/politica/2026/05/25/acusaciones-de-la-udef-julio-martinez-redes-societarias-y-el-rescate-de-plus-ultra/
  - https://www.infobae.com/espana/agencias/2026/05/25/summerwind-alega-al-juez-del-caso-plus-ultra-que-no-recibio-fondos-de-la-aerolinea/
