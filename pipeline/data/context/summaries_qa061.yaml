- entity_id: Organization:partido-popular
  name: Partido Popular
  resumen: 'El Partido Popular (PP) es uno de los dos grandes partidos del sistema español, de orientación de centro-derecha;
    según Wikipedia, fue fundado el 20 de enero de 1989 en sustitución de Alianza Popular y lo preside Alberto Núñez
    Feijóo desde abril de 2022. Según Wikipedia, es la principal fuerza de la oposición frente a los gobiernos del
    PSOE de Pedro Sánchez. En estas causas actúa en dos planos: como acusación popular —está personado en la causa
    especial del Tribunal Supremo contra José Luis Ábalos desde su escrito de 23 de octubre de 2024 (auto del TS
    de citación de Ábalos, p.3 y p.11) y fue la primera acusación popular personada ante el Juzgado Central de Instrucción
    nº 2 en el caso Koldo (ATS 15039/2024, p.2); según Europa Press (vía Infobae, 01-09-2026), la acusación popular
    que encabeza se opuso a los incidentes de nulidad de Ábalos y Koldo García contra la sentencia de 22 de junio
    de 2026— y en la fiscalización parlamentaria, en particular en la comisión de investigación del Senado, donde
    con Vox y UPN aprobó la ampliación de su objeto (Diario de Sesiones del Senado, DS 745, p.36). Aparece con muchas conexiones en esta base porque sus federaciones territoriales y su grupo parlamentario figuran en múltiples
    documentos (por ejemplo, el Grupo Parlamentario Popular en el Senado, DS 744, p.40). Su mención es contextual
    y político-institucional, sin que implique imputación alguna.'
  sources:
  - https://es.wikipedia.org/wiki/Partido_Popular
  - https://www.infobae.com/espana/agencias/2026/09/01/anticorrupcion-pide-al-ts-rechazar-la-peticion-de-abalos-y-koldo-para-anular-la-sentencia-del-caso-mascarillas/
