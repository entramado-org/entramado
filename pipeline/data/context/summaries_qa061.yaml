- entity_id: Person:ruben-villalba-carnero
  name: Rubén Villalba Carnerero
  resumen: Rubén Villalba Carnerero es un comandante de la Guardia Civil investigado en el 'caso Koldo'. Según el
    informe de la UCO recogido por El Español (octubre de 2024), la trama le habría pagado unos 88.119 euros a cambio
    de presunta 'protección' a Koldo García y a Víctor de Aldama, que habría consistido -según los investigadores-
    en facilitarles teléfonos seguros y en dar de alta a Aldama como confidente/colaborador de la Dirección de Información
    de la Guardia Civil para alertarle de posibles investigaciones. Según El Español, fue detenido a principios
    de marzo de 2024 en el aeropuerto de Madrid-Barajas, al llegar en un vuelo desde Málaga, porque los agentes
    de la UCO sospechaban que su destino final podía ser Venezuela, en cuya embajada española estaba destinado;
    ese mismo mes el Ministerio del Interior lo cesó de ese puesto. Está investigado por presunta integración en
    organización criminal, blanqueo de capitales y cohecho; rige la presunción de inocencia mientras no haya sentencia
    firme.
