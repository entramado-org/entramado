    pagado a su vez 60.500 euros a IoT Domotic Europe y 108.900 euros a Voli Analítica. Fernández Lena, abogado
    (informe UDEF nº 1908, p.150), era secretario del consejo de administración de Plus Ultra según Infobae (20
    de mayo de 2026); Julio Martínez Martínez es descrito por la UDEF, según Actualidad.es (25 de mayo de 2026),
    como supuesto testaferro del expresidente José Luis Rodríguez Zapatero. No se ha establecido vinculación con
    un delito probado y rige plenamente la presunción de inocencia.'
