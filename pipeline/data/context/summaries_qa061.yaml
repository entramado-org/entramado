- entity_id: Person:francisco-martin-aguirre
  name: Francisco Martín Aguirre
  resumen: Francisco Martín Aguirre es delegado del Gobierno en la Comunidad de Madrid, cargo que ocupaba en diciembre
    de 2025 según Europa Press (vía Infobae) y El Diario de Madrid. Antes fue secretario general de la Presidencia
    del Gobierno desde el 20 de julio de 2021 hasta el 28 de marzo de 2023, cuando le sucedió Judit Alexandra González
    Pedraz (auto de 20 de junio de 2026, p.29). En el 'caso Begoña Gómez' el juez Juan Carlos Peinado admitió en
    mayo de 2025 una querella de Vox contra él por malversación de caudales públicos, en relación con la contratación
    de Cristina Álvarez como asesora en Moncloa cuando él era secretario general de la Presidencia (Europa Press
    vía Infobae, 06-12-2025), y le tomó declaración como investigado; el auto de 23 de septiembre de 2025 lo incluía,
    con esa condición, en la transformación de la causa en procedimiento ante el Tribunal del Jurado (auto de 23-09-2025,
    p.1, p.2 y p.5). Según El Diario de Madrid (04-12-2025) y Europa Press (vía Infobae, 06-12-2025), la Audiencia
    Provincial de Madrid estimó los recursos de la Fiscalía y de la Abogacía del Estado y revocó su condición de
    investigado al considerar que la querella se basaba en «meras suposiciones» sin «el más mínimo indicio», y Peinado
    acató la orden y acordó el sobreseimiento libre en un auto notificado el 18 de diciembre de 2025 (Europa Press
    vía Infobae). Su papel actual es el de cargo institucional; rige la presunción de inocencia.
