- entity_id: LegalCase:expediente-54-05-15-11-se-4720
  name: Expediente 54.05/15; 11-SE-4720
  resumen: Es un expediente administrativo de contratación de obra pública (no una causa penal) correspondiente
    a la duplicación de la carretera N-IV (Autovía del Sur A-4 de Madrid a Cádiz) entre Dos Hermanas y Los Palacios
    y Villafranca, en la provincia de Sevilla. La clave de proyecto 11-SE-4720 consta en el BOE (proyecto de trazado,
    p.k. 558,5 al 566,5) y las obras fueron licitadas y adjudicadas por la Dirección General de Carreteras del entonces
    Ministerio de Fomento hacia 2015, entrando en servicio años después. El informe 96/2025 de la UCO, de 5 de junio
    de 2025, elaborado en la Causa Especial 20775/2020 del Tribunal Supremo, lo identifica como la obra adjudicada
    el 4 de noviembre de 2015 a una UTE formada por Levantina, Ingeniería y Construcción (LIC) y Acciona, cuyo modificado,
    por 4.587.843,65 euros, se aprobó en 2019. Según ese mismo informe, el 14 de octubre de 2020 José Ruz pidió
    a Koldo García que preguntase al director general de Carreteras por la aprobación económica de ese modificado,
    y un mes después le comentó que se habría desbloqueado el cobro (informe UCO, pp.170-171). Su inclusión no implica
    por sí sola irregularidad acreditada.
  sources:
  - https://www.boe.es/diario_boe/txt.php?id=BOE-B-2008-104301
  - https://www.transportes.gob.es/carreteras/nuevos-tramos-en-servicio/2021/4-duplicacion-del-tramo-dos-hermanas-los-palacios-y-villafranca
  updated: '2026-10-03'
  reason: '063 tramo 6 (2026-10-03): Se sustituye la frase con la nota interna «no se ha podido confirmar», que
    es falsa, y con la mención a Servinabar, que no tiene apoyo. En su lugar va el vínculo documentado en el informe
    UCO 96/2025, pp.170-171. El resto del resumen se conserva literal.'
