  name: Juan Carlos Barrabés
  resumen: Juan Carlos Barrabés Cónsul es empresario tecnológico, socio y fundador de Barrabes.biz (auto de 11 de
    abril de 2026, p.2) y, según el informe de la Guardia Civil, presidente y fundador del Grupo Barrabés. Asesoró
    a Begoña Gómez en el ámbito de su cátedra en la Universidad Complutense y fue investigado por el juez Juan Carlos
    Peinado por presuntos delitos de tráfico de influencias y corrupción en los negocios hasta que, según Infobae
    (16 de julio de 2026), la Sección 23ª de la Audiencia Provincial de Madrid lo excluyó del procedimiento por
    falta de pruebas directas al resolver los recursos contra el auto de apertura de juicio oral; según Europa Press
    (vía The Objective, 4 de agosto de 2026), Peinado archivó después la pieza separada sobre el contrato de Red.es
    a la UTE Innova Next-KPMG y remitió esos hechos a la Fiscalía Europea. En julio de 2020 Begoña Gómez firmó,
    como codirectora del máster, dos cartas de recomendación a favor de ofertas de la UTE Innova Next-The Valley
    en procedimientos de Red.es (auto de 11 de abril de 2026, p.3); según el auto de 20 de junio de 2026 (p.31),
    los expedientes 014/20-ED y 016/20-ED de Red.es se adjudicaron a esa UTE —Innova Next pertenece al grupo empresarial
    de Barrabés— el 30 de julio de 2021 por 7.778.926,45 euros y el 2 de agosto de 2021 por unos 4,4 millones de
    euros, y la UTE aportó a las mesas de contratación una carta firmada por Gómez. La causa afecta a contratos
    con fondos europeos, por lo que la Fiscalía Europea ha intervenido (auto de 11 de abril de 2026, p.22). Según
    The Objective, Barrabés sostiene que ha actuado «con regularidad», y su defensa solicitó el sobreseimiento (auto
    de 20 de junio de 2026, p.17); rige la presunción de inocencia y no hay condena.
