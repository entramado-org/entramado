- entity_id: Person:juan-guaido
  name: Juan Guaidó
  resumen: Dirigente opositor venezolano, presidente de la Asamblea Nacional y 'presidente encargado' de Venezuela
    en 2019 (El Español, 16-12-2024; Euronews, 11-12-2025); según el escrito de la defensa de Víctor de Aldama ante
    el Tribunal Supremo (diciembre de 2024, p.7), el Gobierno de España le reconoció como presidente en febrero
    de 2019 y a principios de 2020 pasó a denominarle líder de la oposición. Aparece en la trama Koldo/Aldama porque,
    según las declaraciones de Víctor de Aldama ante el juez de la Audiencia Nacional Ismael Moreno (El Español,
    16-12-2024), fue Aldama quien en 2019 actuó como 'enlace' del Gobierno español con la oposición venezolana,
    portando una carta del entonces ministro José Luis Ábalos, firmada el 26 de julio de 2019, que ofrecía apoyo
    institucional y empresarial español; el escrito de su defensa reproduce la carta («hemos enviado a D. Víctor
    de Aldama Delgado con la misión, no sólo de hacerle llegar esta misiva, sino también para que sirva de enlace
    en nuestras relaciones», p.12) y sitúa a Aldama como «interlocutor oficial del Gobierno frente al sr. Guaidó»
    (p.13). Según El Español (16-12-2024), Ábalos, en su declaración ante el Tribunal Supremo, negó la autenticidad
    de esa carta y calificó a Aldama de 'impostor', mientras que los mensajes y fotografías a los que accedió ese
    diario respaldan la versión de Aldama; se trata de hechos controvertidos y no probados judicialmente. Guaidó
    aparece aquí únicamente como interlocutor o destinatario de las gestiones descritas por la defensa de Aldama,
    sin que ninguna resolución le atribuya conducta alguna en la causa. Rige la presunción de inocencia para todos
    los implicados.
