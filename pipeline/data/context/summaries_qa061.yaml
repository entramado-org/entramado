- entity_id: Person:miguel-moreno-purroy
  name: Miguel Moreno Purroy
  resumen: Miguel Moreno Purroy es, según el informe de la UCO, el asesor de Francisco Javier Lorente Rodríguez,
    gestor del bar-restaurante Franky de Pamplona (propiedad de María Sol Álvarez Gómez), establecimiento que el
    informe sitúa como pieza de una operativa de compensación que habría permitido obtener liquidez procedente de
    Acciona para el entorno de Koldo García (informe UCO, p.193-194); The Objective y elDiario.es lo describen como
    el contable del bar. Según el informe, el 26 de noviembre de 2016 Koldo le remitió el NIF de Acciona y el 29
    de noviembre de 2016 Moreno Purroy envió una factura de 1.525 euros a nombre de Acciona Infraestructuras (p.194-195);
    el 2 de agosto de 2017 Koldo le pidió confeccionar una factura a la UTE Recajo por 2.700 euros más IVA, y una
    factura «FRA.9I UTE RECAJO» de 2.750 euros más IVA con emisor «PURROY» señalaba una cuenta de la que él era
    titular (p.196-197); en enero de 2018 Koldo le dio instrucciones para otra factura a nombre de Acciona Infraestructuras
    (p.198). La UCO subraya que «gestionaba el modo de proceder» (p.196). Según The Objective y OKDiario Navarra
    (13-05-2026), declaró como testigo ante el juez Ismael Moreno (Juzgado Central de Instrucción 2, Audiencia Nacional)
    y reconoció haber emitido facturas falsas para Koldo a nombre de Acciona porque este le dijo que «pasaba por
    un mal momento»; admitió haber cobrado en su cuenta la factura de la UTE Recajo de 2017, retirado el efectivo
    y entregárselo a Patricia Úriz por indicación de Koldo, sin descartar otras facturas que desconozca. Según elDiario.es
    (24-02-2026), el dueño del bar, Javier Lorente, negó ante la comisión del Parlamento de Navarra haber hecho
    pagos en efectivo a Koldo y señaló que de las facturas se encargaba su «amigo» y contable, Moreno Purroy. Interviene
    como testigo en una instrucción en curso; no consta que esté investigado y rige la presunción de inocencia.
  sources:
