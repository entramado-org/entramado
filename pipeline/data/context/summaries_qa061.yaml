    García, Fernando Merino y Antxon Alonso, un correo de 24 de agosto de 2015 en el que Pedro Rodríguez, desde
    su cuenta de Geoalcali, se disculpaba ante Koldo García por no haberle puesto en copia en un mensaje anterior
    sobre una solicitud de reunión con el Gobierno de Navarra, «porque estas cosas debo cuidarlas para que tú y
    Santos especialmente, estéis informados de nuestros pasos», añadiendo «a VOSOTROS os consideramos nuestros Ojos
    y nuestros Oídos» (informe UCO, p.40-41). Figura como persona vinculada a la instrucción; rige la presunción
    de inocencia y no consta que se le atribuya delito.
