- entity_id: Company:daiwa-corporate-advisory
  name: Daiwa Corporate Advisory
  resumen: 'Daiwa Corporate Advisory (DC Advisory) fue la firma de asesoramiento financiero a la que la SEPI adjudicó,
    por el trámite de emergencia, el contrato de asesor financiero para evaluar el rescate de 53 millones de euros
    solicitado por Plus Ultra durante la pandemia (un préstamo participativo de 34 millones y un préstamo ordinario
    de 19 millones), mientras Deloitte Legal actuó como asesor jurídico; los contratos con ambos asesores se formalizaron
    el 16 de diciembre de 2020 (informe UDEF 1907, p.38; informe UDEF 1908, p.100). Su «Informe de revisión de los
    requisitos de elegibilidad de acceso al fondo y análisis del plan de viabilidad y capacidad de pago» está fechado
    el 23 de febrero de 2021 (informe UDEF 1907, p.48). No consta que Daiwa esté imputada ni que se le atribuya
    participación en la presunta trama. Rige la presunción de inocencia: figura como asesor externo del proceso,
    no como integrante de la red investigada.'
  sources: []
  updated: '2026-10-03'
  reason: '063 tramo 6 (2026-10-03): El pack no trae unidades del resumen; se actúa con motivo explícito. El resumen
    vigente no cita ninguna fuente. (1) «recibido por la SEPI hacia el 23 de febrero de 2021» se corrige: la p.48
    del informe UDEF 1907 da el 23/02/2021 como FECHA del informe de Daiwa, no como fecha de recepción. (2) Se retira
    la frase «parte del análisis se centra en si la concesión tuvo carácter político más que técnico y en la fiabilidad
    de los datos (p. ej. cuotas de mercado)»: ninguna fuente la vincula a Daiwa. La cuota del 0,03% aparece en el
    informe UDEF 1908 p.153 sin mencionar a Daiwa, y lo dicho en la Comisión del Congreso (DS_C_15_717 p.9) es la
    opinión de un compareciente. (3) Se retira «con cargo al FASEE» porque solo lo sostiene Wikipedia. Se añaden
    las citas del corpus (UDEF 1907 p.38 y p.48; UDEF 1908 p.100, que documenta la adjudicación por emergencia a
    Daiwa Corporate Advisory, S.L.). Se conserva la salvaguarda: no hay fila de registro ni ítems en el feed.'
