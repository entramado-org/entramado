- entity_id: Person:yuste
  name: Rafael Yuste Arenillas
  resumen: Rafael Yuste Arenillas fue jefe de la Unidad Central Operativa (UCO) de la Guardia Civil desde junio
    de 2023 hasta diciembre de 2025, cuando fue ascendido a general de brigada y salió de la unidad hacia la Jefatura
    de Servicios Técnicos; es citado en el contexto de la comparecencia de Marlaska en la comisión del caso Koldo
    del Senado (Diario de Sesiones del Senado, 30 de junio de 2026, p. 122). Según The Objective, El Independiente
    y Estrella Digital, el 26 de junio de 2026 declaró como testigo ante el juez Santiago Pedraz en el 'caso Leire'
    y ratificó que le pidieron «ponerse de perfil» y no ser proactivo en investigaciones que afectaban al entorno
    del presidente del Gobierno, como la del hermano de Pedro Sánchez; ante agentes de la UCO había atribuido esas
    supuestas presiones al entonces director general de la Guardia Civil, Leonardo Marcos, y al DAO, Manuel Llamas. Según
    Estrella Digital, matizó que el ministro del Interior y la directora general mostraron su apoyo a la UCO y que
    fue ascendido a general porque le «tocaba» y «no para apartarlo de la unidad». Declaró como testigo; no consta
    que esté investigado.
  sources:
