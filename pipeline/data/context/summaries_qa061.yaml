- entity_id: Person:vicente-fernandez
  name: Vicente Fernández
  resumen: 'Vicente Cecilio Fernández Guerrero es jurista: según okdiario (11-12-2025) y Público (10-12-2025), ingresó
    por oposición en el cuerpo de letrados de la Junta de Andalucía en 1999 como número uno de su promoción, fue
    interventor general de la Junta (2016-2018) con María Jesús Montero como consejera de Hacienda y, ya con Montero
    como ministra de Hacienda, fue nombrado presidente de la SEPI, cargo que ocupó entre el 23 de junio de 2018
    y el 4 de octubre de 2019, «fecha en que dimitió por su imputación por prevaricación en el caso Aznalcóllar»
    (auto de 26 de mayo de 2026, p.4). De esa causa, sobre la adjudicación de la mina de Aznalcóllar, fue absuelto
    junto al resto de acusados, según se hizo público el 5 de diciembre de 2025 (Público; okdiario). Según el auto
    (p.5), Servinabar —empresa administrada por Antxon Alonso y de la que la UCO atribuye un 45% a Santos Cerdán,
    según Público— lo contrató el 1 de junio de 2021, fecha en la que se creó el grupo de Threema «Hirurok» («Nosotros
    3») que formaban Fernández, Alonso y Leire Díez; según Público, que cita a la UCO y a la Hacienda foral, cobró
    de Servinabar cerca de 219.000 euros brutos como asesor entre 2021 y 2023 (68.632 en 2021, unos 117.000 en 2022
    y 33.251 en 2023). El 10 de diciembre de 2025 fue detenido por la UCO junto a Leire Díez en una operación acordada
    entonces en las Diligencias Previas 89/2025 del Juzgado Central de Instrucción nº 6 de la Audiencia Nacional
    (auto de 26 de mayo de 2026, p.3), por presuntos delitos de fraude, malversación, tráfico de influencias y prevaricación
    en contratos públicos, según Público. La causa la instruye hoy el juez Santiago Pedraz (DP 150/2025), en la
    que figura como investigado (auto, p.3 y p.40); en su pieza sobre presuntos amaños de la contratación de empresas
    públicas fue citado como investigado, junto a otras 24 personas, el 29 de junio de 2026, según elDiario.es,
    que le atribuye haber actuado como nexo de influencia y haber recibido 40.000 euros de Tubos Reunidos. El auto
    recoge que él y Díez «habrían mantenido contacto, luego una relación personal, desde el año 2019» (p.4). Rige
    plenamente la presunción de inocencia y no consta condena.'
  sources:
