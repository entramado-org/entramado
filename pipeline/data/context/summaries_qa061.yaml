- entity_id: Person:jose-manuel-ruano
  name: José Manuel Ruano
  resumen: 'José Manuel Ruano de la Fuente es profesor titular de la Universidad Complutense de Madrid (auto de
    11 de abril de 2026, p.21), docente de Ciencia Política según elDiario.es. Figura como director del máster propio
    ''Transformación Social Competitiva: los ODS como estrategia'' (informe de la Guardia Civil, p.42) y como codirector
    de la cátedra extraordinaria del mismo nombre que codirigía Begoña Gómez, nombramiento del 8 de febrero de 2021
    que respondía a la exigencia de que la cátedra tuviera un director vinculado a la Complutense (auto de 20 de
    junio de 2026, p.34); el auto de 11 de abril de 2026 califica su intervención en la cátedra de «meramente institucional»
    (p.21). Según El Español (18-12-2024), compareció ante la comisión de investigación de la Asamblea de Madrid
    sobre la relación entre Begoña Gómez y la UCM y afirmó que «el rector se ve obligado a echar a Begoña Gómez
    de la UCM», en un proceso en tres fases que incluyó la finalización de los másteres y las cátedras vinculadas.
    Según elDiario.es (26-12-2024), la Complutense le abrió un expediente por no entregar una documentación del
    curso que se le requirió; según la misma cabecera (10-12-2025), el exvicerrector Juan Carlos Doadrio reveló
    en el Senado que la universidad le impuso una suspensión de empleo y sueldo de tres meses. Según The Objective
    (vía Infobae, 08-09-2026), el juez Juan Carlos Peinado rechazó citarlo como testigo a petición de la defensa
    en la audiencia preliminar. Comparece como figura de contexto académico, sin que conste imputación penal contra
    él. Rige la presunción de inocencia.'
  sources:
  - https://www.elespanol.com/madrid/comunidad/20241218/ruano-coodirector-catedras-begona-gomez-ucm-rector-vio-obligado-echarla/909659225_0.html
