    de investigado con fuentes.'
- entity_id: Person:javier-perez-dolset
  name: Javier Pérez Dolset
  resumen: Javier Pérez Dolset (Jaén, 1969, según Wikipedia) es un empresario español del sector tecnológico y del
    videojuego, fundador y principal accionista de Zed Worldwide (según Wikipedia y The Objective, 27-05-2025) y
    cofundador, con su hermano, de Pyro Studios en 1996, creadora de la saga Commandos (según Newtral, 05-06-2025).
    Según Newtral (05-06-2025), tras la quiebra de Zed Worldwide en 2016 el proceso de insolvencia derivó en un
    procedimiento judicial contra él (operación Hanta) en el que fue procesado por fraude; rige la presunción de
    inocencia. En los documentos analizados su aparición procede del auto de entrada y registro en la sede del PSOE en Ferraz
    (autoentradaferraz, p.6, 8 y 16), donde se le vincula a la presunta trama de Leire Díez (los llamados «fontaneros»),
    supuestamente orientada a interferir en investigaciones judiciales; el auto recoge que actuaba conjuntamente
    con Díez (p.6) y que ambos mantuvieron una reunión con el fiscal Ignacio Stampa el 7 de mayo de 2025 (p.16).
    Según Europa Press (vía Telecinco, 07-08-2026), está investigado por presuntos delitos de cohecho y tráfico
    de influencias en la causa abierta en el Juzgado de Instrucción nº 9 de Madrid, que el juez Santiago Pedraz
    (Audiencia Nacional) asumió en agosto de 2026 según EFE (vía The Objective, 17-08-2026). No le consta condena
    por estos hechos; todo está en fase de investigación y rige la presunción de inocencia.
