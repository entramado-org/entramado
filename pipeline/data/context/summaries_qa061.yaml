- entity_id: Company:kpmg-asesores-sl
  name: Kpmg Asesores Sl
  resumen: 'KPMG Asesores S.L. es la rama española de consultoría de la red internacional KPMG. En esta base aparece por el caso de Begoña Gómez / Barrabés: formó con Innova Next SLU (que el informe de la UCO incluye entre las empresas vinculadas
    a Juan Carlos Barrabés) la UTE a la que la Dirección General de Red.es adjudicó el 18 de marzo de 2021 el expediente 044/20-ED
    (servicios de oficina Acelera Pyme), por 2.149.200 euros sin IVA. En la UTE Innova Next ostentaba el 40,64% y KPMG el
    59,36%. La UCO analizó la valoración de las ofertas por presunto favorecimiento al adjudicatario, que obtuvo la mayor
    puntuación por escaso margen frente a otra licitadora. Según El Español (11/07/2024), un informe de la UCO fechado el
    2 de julio de 2024 analizó seis contratos adjudicados a empresas de Barrabés, entre ellos este de Red.es (formalizado el
    19 de abril de 2021 por un importe final de 2.360.000 euros sin IVA), y concluyó que se desarrollaron «con normalidad»
    y «bajo los principios que rigen la contratación pública»; esa conclusión se refiere a los contratos examinados en ese
    informe. No consta que KPMG esté investigada; su papel es el de socio empresarial en la UTE adjudicataria.'
