- entity_id: Person:pedro-antonio-rodriguez-fernandez
  name: Pedro Antonio Rodríguez Fernández
  resumen: Pedro Antonio Rodríguez Fernández fue administrador único de Geoalcali SL desde el inicio de su actividad,
