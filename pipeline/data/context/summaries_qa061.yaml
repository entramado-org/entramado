- entity_id: Organization:caja-rural
  name: Caja Rural
  resumen: Caja Rural es la denominación común de distintas cooperativas de crédito (Caja Rural de Navarra, de Granada,
    de Soria, de Albacete, Ciudad Real y Cuenca, Cajamar…), siendo la más relevante para la causa la Caja Rural
    de Navarra. Según Libertad Digital y COPE (18-06-2025), en junio de 2025 la UCO pidió en un oficio al instructor
    del 'caso Koldo' en el Tribunal Supremo, Leopoldo Puente, que dirigiera mandamientos judiciales a BBVA, CaixaBank
    y Caja Rural de Navarra para que detallaran las cinco cuentas en las que ha figurado Santos Cerdán, y que solicitara
    a la Agencia Tributaria un informe sobre sus cuentas bancarias, bienes en el extranjero y movimientos fiduciarios
    entre 2012 y 2024. Ya en su informe 96/2025 de 5 de junio de 2025 la UCO había incluido, entre las diligencias
    solicitadas, mandamientos judiciales a Caja Rural de Albacete, Ciudad Real y Cuenca, Caja Rural de Granada,
    Caja Rural de Navarra, Caja Rural de Soria y Cajamar para que remitieran la información de determinados productos
    bancarios (informe UCO 96/2025, p.448-464), y localizó en una cuenta de Caja Rural de Navarra de Koldo García
    cinco abonos de 1.000 y 1.050 euros procedentes de Servinabar entre el 22 de diciembre de 2015 y el 16 de marzo
    de 2018, que atribuye a una relación laboral/económica entre Koldo García y Antxon Alonso/Servinabar (p.202).
    Las cajas figuran como entidades requeridas para aportar documentación bancaria, sin imputación alguna.
