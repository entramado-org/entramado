- entity_id: Company:analisis-relevante
  name: Análisis Relevante
  resumen: 'Análisis Relevante S.L. es una sociedad de consultoría que comenzó a operar el 10 de febrero
    de 2020, administrada formalmente por el empresario Julio Martínez Martínez (con participación de
    sus hermanos Manuel y Rafael) y sobre la que, según los investigadores, el expresidente José Luis
    Rodríguez Zapatero habría tenido el control real. La UDEF (Unidad de Delincuencia Económica y Fiscal
    de la Policía Nacional) la describe como ''pieza instrumental'' diseñada para simular servicios de
    asesoría y dar apariencia legal a pagos derivados de un presunto tráfico de influencias en el rescate
    público a la aerolínea Plus Ultra. Según elDiario.es (19-05-2026), que cita al juez, ingresó en torno a 959.700 euros entre 2020 y 2025; según Infobae (25-05-2026), que cita un informe de la UDEF, Plus Ultra le habría abonado unos 301.290 euros, y la sociedad habría transferido alrededor de 490.780 euros a Zapatero y 239.755 euros a Whathefav, sociedad de las hijas
    del expresidente. Según elDiario.es (19-05-2026), Julio Martínez Martínez fue detenido en diciembre de 2025, junto al presidente y al consejero delegado de Plus Ultra, en la causa que entonces instruía un juzgado de Madrid.
    La causa del rescate (DP 77/2024) la instruye el juez José Luis Calama (Sección de Instrucción del
    Tribunal Central de Instancia, Plaza nº 2, Audiencia Nacional). Rige la presunción de inocencia: la
    causa está en instrucción y no consta condena.'
