    a ZP» (informe UDEF 1908, p.33-34; auto de 18 de mayo de 2026, p.13). El 28 de abril de 2020 Reyes pidió a Julio
    Martínez Sola que escribiera a Manuel Fajardo «de parte de Ramón Gordils» (informe UDEF 1908, p.9). La UDEF
    lo describe como el «nexo o elemento necesario» empleado por Reyes para llegar a Zapatero (informe UDEF 1908,
    p.36) y el auto recoge que «mediante la mediación de Ramón Gordils Montes» Martínez Sola se aproximó al entorno
