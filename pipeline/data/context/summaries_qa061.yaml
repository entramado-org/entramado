- entity_id: Organization:diputacion-de-badajoz
  name: Diputación de Badajoz
  resumen: 'La Diputación Provincial de Badajoz es la administración local donde David Sánchez Pérez-Castejón,
    hermano del presidente del Gobierno Pedro Sánchez, fue contratado en julio de 2017 como ''coordinador
    de actividades de los conservatorios de música''; el puesto pasó en 2022 a denominarse ''jefe de la
    Oficina de Artes Escénicas''. Es el escenario central del llamado ''caso David Sánchez'': la jueza
    instructora de Badajoz Beatriz Biedma (Juzgado de Instrucción número 3) consideró indiciariamente
    que la plaza se habría creado a medida para él e instruyó la causa por presuntos delitos de prevaricación
    administrativa y tráfico de influencias. El juicio en la Audiencia Provincial de Badajoz arrancó,
    según Infobae, el 28 de mayo de 2026 con once acusados, entre ellos David Sánchez y el expresidente
    de la Diputación y exlíder del PSOE extremeño Miguel Ángel Gallardo. La sentencia 152/2026, de 14
    de julio de 2026, condenó a los once por prevaricación administrativa (Gallardo como autor de dos
    delitos, Ricardo Cabezas como autor de uno y los nueve restantes, David Sánchez incluido, como cooperadores
    necesarios) a nueve años de inhabilitación especial para empleo o cargo público, absolviéndolos del
    resto de infracciones; no es firme y cabe recurso de apelación ante el TSJ de Extremadura, por lo
    que rige la presunción de inocencia. La Diputación comunicó al tribunal que David Sánchez percibió
    340.572 euros (cifra publicada como bruta) en torno a nueve años de relación laboral.'
