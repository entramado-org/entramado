- entity_id: Organization:enajenaciones-de-materiales-ferroviarios-sa
  name: Enajenaciones de Materiales Ferroviarios SA
  resumen: 'EMFESA (Enajenación de Materiales Ferroviarios, S.A., S.M.E., M.P.) es una empresa pública dependiente
    de ADIF (informe UCO, folio 366) dedicada, según su web, a la recuperación y el reciclaje de activos ferroviarios.
    Aparece en la causa por las contrataciones de personas del entorno de Koldo García: según el informe UCO, Nicoleta
    Neacsu fue contratada por EMFESA tras una conversación con Koldo de 9 de septiembre de 2022 en la que este le
    reenvió el mensaje de que ya podía firmar el contrato (folios 366-367), y según The Objective (2 de junio de
    2025), fuentes del ente sostienen que fue Koldo quien la colocó gracias a su amistad con el director, Vicente
    Calzado; el hermano de Koldo, Joseba García, también trabajó en EMFESA (DS_C_15_233, p.29). Según The Objective
    (28 de diciembre de 2024), trabajadores de la empresa presentaron denuncias por presunto nepotismo ante su Canal
    Ético. En la comisión de investigación del Senado, Calzado reconoció su amistad con Koldo y negó que este influyera
    en la contratación de Joseba, que atribuyó a sus méritos (Agencias vía Pressdigital, 29 de mayo de 2024). Todos
    los hechos son objeto de investigación y rige la presunción de inocencia para las personas afectadas.'
