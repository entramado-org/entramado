- entity_id: Person:ana-esther-sanchez-garcia
  name: Ana Esther Sánchez García
  resumen: 'Ana Esther Sánchez García es la Letrada de la Administración de Justicia del Tribunal Central de Instancia,
    Sección de Instrucción, Plaza nº 5, que da fe y firma el auto de 26 de mayo de 2026 dictado por el magistrado
    Santiago Pedraz en las Diligencias Previas / Procedimiento Abreviado 150/2025 (causa declarada secreta) que
    autorizó el requerimiento y la entrada y registro en la sede del PSOE en Ferraz (auto, p.1 y bloque de firma).
    Es personal de la Administración de Justicia y no una persona investigada: su nombre aparece únicamente en el
    encabezado y en la firma del auto. No debe confundirse con Ana María Fuentes Pacheco, gerente de la Secretaría
    de Organización del PSOE, que también aparece en ese auto. Su cargo consta en el propio auto y no ha sido
    contrastado en ninguna otra fuente de los documentos analizados ni de prensa.'
  sources:
  - https://contenidos.naroh.es/auto-psoe/
  updated: '2026-10-04'
