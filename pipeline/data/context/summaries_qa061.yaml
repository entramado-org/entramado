  resumen: Aparece en el caso Begoña Gómez como uno de los organismos públicos que adjudicaron contratos a Innova
    Next SLU, sociedad del empresario Juan Carlos Barrabés según Vozpópuli (29/05/2024). Según el informe de la
    UCO, el 4 de agosto de 2022 la Presidencia del CSD le adjudicó el lote 1 de 2 de un contrato relativo al diseño
