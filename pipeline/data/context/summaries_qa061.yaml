    innovación abierta sobre turismo, cambio climático y salud para el Distrito Digital Comunidad Valenciana (expediente
    DD/003/20), cuyo lote 1 (Turismo) se adjudicó el 5 de mayo de 2021, por 157.214 euros sin impuestos, a la UTE
    Globaldit Innova Next (informe de la Guardia Civil de 14 de mayo de 2024, p.180), participada al 70 % por Innova
    Next SLU —empresa vinculada a Juan Carlos Barrabés— según Alicante Plaza (19-04-2021); en octubre de 2022 la
