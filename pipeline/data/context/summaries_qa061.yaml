- entity_id: Company:aridos-anfersa-sl
  name: Áridos Anfersa SL
  resumen: Áridos Anfersa SL es una empresa familiar granadina nacida en 1998, dedicada a la fabricación de áridos
    y la explotación de canteras (según su web corporativa); la UCO la describe como sociedad dedicada a la preparación
    de terrenos, administrada por Francisco Coca Sánchez y con domicilio en Freila (Granada) (informe UCO, p.233).
    En su escrito ante el Tribunal Supremo, Víctor de Aldama la incluyó entre las empresas relacionadas con Koldo
    García a las que se adjudicaron contratos públicos, «representada por don Francisco Coca Sánchez, el cual contrató
    a un familiar directo de don Koldo» (escrito de Aldama, p.20). Según el informe de la UCO, la sociedad contrató
    a Patricia Úriz Iriarte —a la que el informe identifica como mujer de Koldo—, de alta en el régimen general
    desde el 13 de julio de 2022, que cobró de Áridos Anfersa al menos 13.796,77 euros netos en concepto de nómina
    entre el 3 de agosto de 2022 y el 2 de junio de 2023 (1.300 euros mensuales); la UCO vincula esa contratación
    a la constructora OPR —con la que Anfersa constituyó la UTE Motril Sur el 22 de julio de 2022— y sostiene que
    Daniel Fernández Menéndez, de OPR, habría actuado de intermediario entre la sociedad y Koldo (informe UCO, p.16
    y p.233-235). Según El Debate (21-01-2026), la UCO investiga además el contrato de suministro de 275.000 toneladas
    de balasto para la línea de alta velocidad Sevilla-Madrid, adjudicado por Adif en noviembre de 2022 por 5.264.498
    euros a una UTE formada por Áridos Técnicos, Aritec Almonacid y Áridos Anfersa, cuya cantera El Parroso (Sevilla)
    no contaba con certificación para balasto de alta velocidad; según ese medio, Adif resolvió anticipadamente
    uno de los expedientes porque el material aportado no era apto. Todo ello se investiga como posible contraprestación,
    sin que conste condena ni irregularidad probada; rige la presunción de inocencia para personas y empresa.
