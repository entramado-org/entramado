- entity_id: Person:cesar-adalid-siles-bazan
  name: César Adalid Siles Bazán
  resumen: César Adalid Siles Bazán fue ministro de Justicia y Transparencia Institucional de Bolivia desde el 26
    de septiembre de 2024, en sustitución de Iván Lima, hasta su renuncia en junio de 2025, cargo al que llegó tras
    ejercer como Procurador General del Estado desde el 6 de septiembre de 2023, en el gobierno de Luis Arce (según
    Los Tiempos, 26-09-2024, e Infobae, 15-06-2025; el informe UDEF nº 2910/26 lo sitúa como ministro entre septiembre
    de 2024 y junio de 2025 y como procurador entre septiembre de 2023 y septiembre de 2024, p.9). En ese informe
    aparece, siendo procurador, como destinatario de una notificación de controversia del Grupo Gloria (17-01-2024)
    y de una carta de SOBOCE (29-02-2024) sobre la conciliación de su litigio (p.30-31), y, ya como el «Ministro
    Siles», en los mensajes del 3 de diciembre de 2024 en los que Carmen Almendras comunica a la secretaria de José
    Luis Rodríguez Zapatero que a la reunión conseguida con él asistirían Luis Díaz Olivero, Ana María Ospina y
    Francisco Shwortshik (p.17 y p.51); la UDEF concluye que Zapatero solicitó la intermediación del presidente
    Arce ante el Procurador General «si bien la intermediación la haría directamente el ministro SILES, por indicación
    del propio ARCE» (p.64), en el marco de la presunta trama de influencias relacionada con el litigio de SOBOCE.
    Según Infobae (24-06-2026), la investigación lo presenta, junto a Ricardo Condori, como uno de los «actores
    clave para desbloquear los procedimientos» que afectaban a los intereses del Grupo Gloria. Su mención es como
    autoridad boliviana de la época; no consta que esté investigado en la causa española y rige la presunción de
    inocencia.
  sources:
