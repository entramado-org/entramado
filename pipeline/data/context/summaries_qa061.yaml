- entity_id: Company:alva-skies-and-wings-sl
  name: Alva Skies And Wings SL
  resumen: 'Alva Skies and Wings SL es una sociedad limitada que figura en el entramado societario de la aerolínea
    Plus Ultra: poseía una participación del 9,46 % en Plus Ultra Líneas Aéreas y su administrador único fue Antonio
    Caldeiro Téllez, desde el 13 de octubre de 2016 hasta el 31 de agosto de 2023 (informe UDEF 1908, p.124; informe
    UDEF 1907, p.47; auto del Tribunal Central de Instancia de 18 de mayo de 2026, p.22). Según el informe UDEF
    1908 (p.124), Caldeiro era una «pieza clave en la estructura accionarial» porque su voto en el consejo de administración
    era necesario para aprobar el plan de viabilidad; el 25 de enero de 2021, ante una próxima junta de accionistas,
    Julio Martínez Sola (vicepresidente de Plus Ultra según el auto, p.53) dijo en un chat grupal haber dado instrucciones
    a Caldeiro «para que se mantenga callado» (auto de 18 de mayo de 2026, p.22; UDEF 1907, p.47; UDEF 1908, p.115).
    La investigación de la UDEF examina el rescate de 53 millones de euros concedido a Plus Ultra por la SEPI durante
    la pandemia (autorizado por el Consejo de Ministros el 9 de marzo de 2021: 34 millones en préstamo participativo
    y 19 en préstamo ordinario; auto, pp.24 y 28; UDEF 1907, p.5) y la presunta red de influencia con la que se
    habría obtenido, en la que se distingue una ''vía Zapatero'' (con Julio Martínez Martínez) y una ''vía Ábalos''
    (UDEF 1908, pp.31 y 43). Todo en fase de instrucción y bajo presunción de inocencia.'
