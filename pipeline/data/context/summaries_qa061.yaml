- entity_id: Company:plus-ultra-lineas-aereas
  name: Plus Ultra Líneas Aéreas
  resumen: Plus Ultra Líneas Aéreas es una pequeña aerolínea española de largo radio que en marzo de 2021
    recibió un rescate público de 53 millones de euros (un préstamo participativo de 34 millones y otro
    ordinario de 19 millones) con cargo al Fondo de Apoyo a la Solvencia de Empresas Estratégicas gestionado
    por la SEPI, pese a haber registrado pérdidas antes de la pandemia (cerró 2019 en números rojos).
