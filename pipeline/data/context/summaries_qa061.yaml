- entity_id: Organization:conservatorios
  name: Conservatorios
  resumen: 'Se refiere a los conservatorios de música dependientes de la Diputación de Badajoz. Constituyen el contexto
    del caso David Sánchez: el hermano del presidente del Gobierno, David Sánchez Pérez-Castejón, fue contratado
    el 30 de junio de 2017 por resolución del entonces presidente de la Diputación, Miguel Ángel Gallardo, como
    coordinador de actividades de los conservatorios de música (después Oficina de Artes Escénicas), plaza cuya
    creación y adjudicación fue objeto de la causa juzgada por la Audiencia Provincial de Badajoz en 2026. Según
    las acusaciones, la plaza se habría diseñado a medida. En la sentencia 152/2026, de 14 de julio de 2026 (no
    firme: recurrible ante el Tribunal Superior de Justicia de Extremadura), la Audiencia Provincial de Badajoz
    condenó a David Sánchez, como cooperador necesario de un delito de prevaricación administrativa por los hechos
    del Bloque B —el posterior «cambio de nomenclatura» del puesto que, según la sentencia, enmascaraba la creación
    de una plaza de alta dirección adaptada a sus intereses (pp.340 y 357)—, a nueve años de inhabilitación especial,
    y a Miguel Ángel Gallardo, como autor de dos delitos de prevaricación administrativa, a sendas penas de inhabilitación;
    absolvió a ambos del resto de los delitos imputados, entre ellos el tráfico de influencias, y declaró prescrito
    el delito de aceptación de nombramiento ilegal referido a la contratación inicial de 2017 (Bloque A) que se
    imputaba a David Sánchez (sentencia, p.69 y pp.373-375). Rige la presunción de inocencia mientras la condena
    no sea firme.'
  sources:
