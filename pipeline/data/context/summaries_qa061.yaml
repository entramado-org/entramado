- entity_id: Person:miguel-gonzalez-suela
  name: Miguel González Suela
  resumen: 'Miguel Ángel González Suela, licenciado en Derecho por la Universidad Complutense y administrador civil
    del Estado (promoción 32, según la asociación ACSACE), es subsecretario para la Transición Ecológica y el Reto
    Demográfico desde enero de 2020 (Real Decreto 125/2020, de 21 de enero, BOE de 22 de enero de 2020). Según el
    organigrama del MITECO y ACSACE, antes fue director general de Servicios del Ministerio de Medio Ambiente, y
    Medio Rural y Marino (2010-2013) y secretario general del Centro para el Desarrollo Tecnológico Industrial (CDTI)
    (2019-2020). Aparece en esta base por la comparecencia de Sara Aagesen ante la comisión de investigación del
    Senado sobre la SEPI (8 de julio de 2026): la ministra declaró que delegó en él, como subsecretario y en representación
    del ministerio, la asistencia a la reunión del consejo gestor del FASEE en que se adoptó la decisión final sobre
    el rescate de Tubos Reunidos, y se le preguntó por el documento de trabajo que el ministerio elaboró para ese
    consejo (Diario de Sesiones del Senado, pp.3 y 18 del PDF). No consta que esté investigado en ninguna causa;
    rige la presunción de inocencia.'
