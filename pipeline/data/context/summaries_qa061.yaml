- entity_id: Person:alberto-gonzalez-amador
  name: Alberto González Amador
  resumen: 'Alberto González Amador es un empresario —administrador único de Maxwell Cremona S.L., dedicada a la
    intermediación y consultoría, con el Grupo Quirón entre sus clientes según Wikipedia y Público— y pareja de
    Isabel Díaz Ayuso, presidenta de la Comunidad de Madrid. Según Público e Infobae, está acusado por la presunta
    defraudación a la Hacienda Pública de 350.951 € en los ejercicios 2020 y 2021 mediante, según las acusaciones, 15
    facturas falsas: en septiembre de 2025 el juzgado de instrucción de Madrid que le investigó abrió juicio oral
    contra él por dos delitos contra la Hacienda Pública en concurso medial con falsedad documental, cuyo enjuiciamiento
    corresponde a la Audiencia Provincial de Madrid. Según esos mismos medios, la Fiscalía y la Abogacía del Estado
    piden tres años y nueve meses de prisión y la acusación que ejercen PSOE y Más Madrid eleva la petición a cinco
    años al añadir un delito contable y pertenencia a grupo criminal. Según Wikipedia, el 19 de febrero de 2026
