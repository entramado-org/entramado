- entity_id: Person:delcy-rodriguez
  name: Delcy Rodríguez
  resumen: 'Delcy Eloína Rodríguez Gómez (n. 18 de mayo de 1969) es, según Wikipedia, abogada, diplomática y política
    venezolana. Fue vicepresidenta de Venezuela bajo Nicolás Maduro de 2018 a 2026 y, tras la captura de Maduro
    a comienzos de enero de 2026, asumió como presidenta encargada de Venezuela, siendo la primera mujer en ejercer
    ese cargo en el país (Wikipedia). Es central en el episodio conocido como ''Delcygate'': en la madrugada del
    20 de enero de 2020 aterrizó en el aeropuerto de Madrid-Barajas y se produjo un encuentro con el entonces ministro
    de Transportes José Luis Ábalos (acompañado de su asesor Koldo García y del empresario Víctor de Aldama), pese
    a tener prohibida la entrada en el espacio Schengen por sanciones de la UE (desde 2018, según Wikipedia). El
    asunto fue objeto de un procedimiento judicial que quedó archivado (así lo recuerda el excomisario de Barajas
    en el Senado, DS 744 p.25): según El Mundo (11 de noviembre de 2020, citado en Wikipedia), un juzgado de Madrid
    archivó el caso al considerar que la zona de tránsito de Barajas «no es territorio nacional»; según El País,
    el Tribunal Supremo archivó el 26 de noviembre de 2020 la investigación contra Ábalos por el encuentro y la
    Audiencia de Madrid acordó el archivo definitivo en abril de 2021. El episodio reaparece en el caso Koldo/Ábalos
    y en indagaciones sobre negocios vinculados a Venezuela (oro; una sociedad en Ginebra atribuida a Rodríguez
    junto a Aldama, según una grabación de la investigación de la UCO filtrada en mayo de 2025, de acuerdo con Cronista
    y Wikipedia). No consta que Delcy Rodríguez esté imputada por la justicia española; rige la presunción de inocencia
    para las personas implicadas.'
  sources:
  - https://es.wikipedia.org/wiki/Delcy_Rodr%C3%ADguez
  - https://en.wikipedia.org/wiki/Delcy_Rodr%C3%ADguez
  - https://www.cronista.com/espana/politica-es/delcygate-en-espana-los-contactos-de-delcy-rodriguez-sucesora-de-maduro-con-el-sanchismo/
  - https://es.wikipedia.org/wiki/Jos%C3%A9_Luis_%C3%81balos
  updated: '2026-09-11'
