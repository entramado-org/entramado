- entity_id: Person:blanca-de-juan
  name: Blanca de Juan
  resumen: 'Blanca de Juan (Blanca María Juan de Castro, según El Español, 18-05-2026) figura en la causa de Begoña
    Gómez como coordinadora de la Cátedra Extraordinaria de Transformación Social Competitiva de la Universidad
    Complutense de Madrid, que codirigía Begoña Gómez (informe UCO de 14 de mayo de 2024, p.43; auto de 20 de junio
    de 2026, p.47). Los autos recogen que el dominio web transformatsc.org, en el que se alojó el software de la
    cátedra, se dio de alta en septiembre de 2022 a su nombre a través de Arsys y pasó en julio de 2023 a nombre
    de Begoña Gómez, y no de la UCM (auto de 11 de abril de 2026, pp.11 y 28-31; auto de 20 de junio de 2026, p.47);
    según el informe de la UCO citado por OKDiario y The Objective (25-05-2026), el cambio de titularidad coincidió
    con la desvinculación profesional de De Juan de la cátedra. El auto de 11 de abril de 2026 (p.26) recoge que
    un testigo la identificó, junto con Begoña Gómez y Cristina Álvarez, como una de «las tres personas de la Cátedra»
    con las que hacía el seguimiento del proyecto, y el auto de 20 de junio de 2026 (p.45) la sitúa en correos con
    la OTRI sobre el registro del software. No consta que esté investigada ni imputada: los autos la mencionan solo
    en esas gestiones, y la defensa de Begoña Gómez la propuso como testigo para el juicio (El Español, 18-05-2026).
    Rige la presunción de inocencia para todos los investigados en la causa.'
