- entity_id: Person:luis-alberto-arce-catacora
  name: Luis Alberto Arce Catacora
  resumen: 'Luis Alberto Arce Catacora fue presidente del Estado Plurinacional de Bolivia entre 2020 y 2025 (informe
    UDEF nº 2910/26, p.9) y, según elDiario.es (24-06-2026), ministro de Economía en el gobierno de Evo Morales.
    Según ese informe de la UDEF, es la autoridad ante la que se habría dirigido la presunta mediación de José Luis
    Rodríguez Zapatero en favor del Grupo Gloria: la secretaria de Zapatero, Gertrudis Alcázar, coordinó con la
    ministra de la Presidencia, María Nela Prada, y con la jefa de gabinete presidencial, Fabiola Salazar, una reunión
    entre Arce y Zapatero prevista para el 15 de septiembre de 2024 y confirmada el 11 de septiembre (p.15 y p.62),
    celebrada ese día en la Casa Grande del Pueblo según Infobae (24-06-2026); el informe concluye que Zapatero
    «solicita la intermediación del presidente ARCE ante el Procurador General, si bien la intermediación la haría
    directamente el ministro SILES, por indicación del propio ARCE» (p.64). No consta que esté investigado en la
    causa española: el informe lo cita como autoridad boliviana de la época (p.9). Según Infobae (25-06-2026), senadores
    de la alianza opositora Libre anunciaron que pedirían una comisión legislativa especial para investigar la presunta
    injerencia. Rige la presunción de inocencia.'
