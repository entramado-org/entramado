- entity_id: Person:juan-manuel-cendoya
  name: Juan Manuel Cendoya
  resumen: 'Juan Manuel Cendoya es directivo de Banco Santander: los informes de la UDEF lo identifican en 2020
    como vicepresidente de Banco Santander España y director general de Comunicación (informe UDEF 1908, p.12; informe
    1907, p.80: «a la sazón vicepresidente del Banco de Santander»). Su nombre aparece en la causa Plus Ultra /
    ''auto Zapatero'' por dos vías. En el equipo informático intervenido a Roberto Roselli se halló una carta dirigida
    a él, creada el 25 de mayo de 2020, en la que, «por instrucciones de José Luis Rodríguez Zapatero», desde Plus
    Ultra Líneas Aéreas se solicitaba su ayuda para obtener un crédito ICO para la compañía (informe UDEF 1907,
    p.19; informe 1908, p.51), contacto que la UDEF presenta como ejemplo de las actuaciones de la red «al más alto
    nivel» ante entidades financieras (informe 1907, p.80). Además figura, junto a Banco Santander, en un listado
    de personas y entidades con cargos y correos hallado en el terminal intervenido a Julio Martínez Martínez, con
    Julio Martínez Sola, Antonio Fernández (Aldesa), Francisco Flores (Softgestor), los hermanos Amaro Chacón, Danilo
    Diazgranados y Yong Ying (Huawei España), archivos que la UDEF considera una «herramienta logística» que refleja
    «una cierta planificación previa» (informe 1907, p.84). Figura como destinatario de esa carta y mencionado en
    ese listado, sin que conste vínculo contractual acreditado, y no consta que esté investigado ni imputado. Rige
    la presunción de inocencia.'
