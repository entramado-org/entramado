    la Guardia Civil incorporado a la causa de Begoña Gómez sobre las licitaciones de Red.es: figura entre las empresas
    que concurrieron a los lotes 1 y 3 del expediente 014/20-ED (servicio de formación en economía digital para
    jóvenes), en los que la oferta mejor valorada en los criterios de juicio de valor fue la de la UTE Innova Next–The
    Valley Digital Business School (informe Guardia Civil, p.91 y p.96-98). Es una licitadora más de ese expediente:
    de la documentación pública consultada no se desprende que DXC esté investigada ni imputada en ninguna de estas
    causas, y debe presumirse su condición de proveedor mercantil legítimo.'
