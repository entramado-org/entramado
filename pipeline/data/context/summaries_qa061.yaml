- entity_id: Person:alejandro-delgado-crego
  name: Alejandro Delgado Crego
  resumen: 'Alejandro Delgado Crego es directivo de la aerolínea Plus Ultra Líneas Aéreas: los informes 1907/2026
    y 1908/2026 de la UDEF-BBCA y el auto de la Audiencia Nacional (diligencias previas 77/2024) lo citan entre
    los directivos y «responsables de Plus Ultra» junto a Julio Martínez Sola y Roberto Roselli Miele (informe UDEF
    1907, p.28; auto, p.53) y como «investigado en la presente causa» (informe UDEF 1908, p.75); en 2019 constituyó
    con Roselli la sociedad Premier Plus Reward Program SL, que gestiona el programa de fidelidad de la aerolínea
    (informe UDEF 1908, p.127). Según Okdiario (30-01-2026), es de origen venezolano, presidió Santa Bárbara Airlines
    hasta finales de 2017 y se incorporó a Plus Ultra en noviembre de 2017 como gerente general adjunto; los informes
    de la UDEF y el auto identifican como director financiero de Plus Ultra a Roberto Roselli. Aparece en la investigación
    del caso Plus Ultra por su participación en chats grupales de los directivos sobre la obtención de la ayuda
    pública de 53 millones de euros que el Consejo de Ministros autorizó el 9 de marzo de 2021 con cargo al fondo
    gestionado por la SEPI (auto, pp.24 y 28): en una conversación grupal del 21 de agosto de 2020 escribió «Correcto
    una vez que llegue la ayuda le pagamos (...) Es que él pana 60 más 35 PWC más 44 este ahora y sin seguridad»,
    mensaje que la UDEF interpreta como «una referencia directa al importe de 60.000 euros (antes de IVA)» que Análisis
    Relevante SL —sociedad representada por Julio Martínez Martínez, conocido como «Julito» (auto, p.17; DS_C_15_744,
    p.5)— recibiría de Plus Ultra por un contrato de asesoramiento que los investigadores consideran «una excusa
    formal para justificar los pagos» (informe UDEF 1908, pp.17-18 y 75); el 29 de mayo de 2023 preguntó en otro
    chat «cómo les fue con el tocayo?», en referencia a una actuación de Julio Martínez Martínez (informe UDEF 1907,
    p.137; auto, p.41). Su domicilio fue objeto de entrada y registro el 11 de diciembre de 2025, acordada por el
    Juzgado de Instrucción nº 15 de Madrid (auto, p.4) y practicada por la UDEF según Okdiario (30-01-2026). Rige
    la presunción de inocencia y no consta condena.'
  sources:
