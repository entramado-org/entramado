- entity_id: Company:grupo-empresarial-inmark
  name: Grupo Empresarial Inmark
  resumen: 'Grupo Empresarial Inmark S.A. es una consultora de marketing y asesoramiento de empresas: su objeto
    social es «el asesoramiento técnico de empresas y la realización de toda clase de actuaciones relativas al estudio,
    gestión, asesoramiento, gestión del conocimiento, formación, difusión, comercialización, propaganda y adaptación
    de sistemas de organización de empresas» (informe de la UCO de 14 de mayo de 2024, p.37), y el auto de apertura
    de juicio oral de 20 de junio de 2026 sitúa a Begoña Gómez, esposa del presidente Pedro Sánchez, en «el ámbito
    laboral privado del marketing y la consultoría en el Grupo Inmark, empresa de la que solicitó una excedencia
    en 2018» (p.29). Según el informe de la UCO, Gómez habría trabajado entre 1999 y 2018 para el Grupo Empresarial
    Inmark y su participada Task Force S.A. —en la que ostentó cargos de consejera (desde 2004), secretaria (desde
    2009) y apoderada (desde 2010)— y se presentaba como «Directora de Negocio para España y Portugal INMARK» (informe
    UCO, p.38, p.44 y p.132); en agosto de 2018 pasó a dirigir el IE Africa Center, cargo que ocupó hasta junio
    de 2022 (informe UCO, p.39; auto de 11 de abril de 2026, p.2). Según El Independiente (08-08-2018), Task Force,
    dedicada a captar donativos para ONG, fue absorbida en 2014 por Inmark Europa. En el marco del caso instruido
    por el Juzgado de Instrucción nº 41 de Madrid (juez Juan Carlos Peinado), un informe de la UCO de mayo de 2026
    examinó, según Europa Press (vía Infobae, 25-05-2026), un cheque de 8.800 euros a nombre de Gómez emitido por
    el grupo empresarial Inmark, organización con la que mantuvo relaciones profesionales; según elDiario.es, ese
    informe no encuentra ingresos opacos y sitúa los ingresos de Gómez en pagadores conocidos con los que tuvo vinculación
    profesional, entre ellos el Grupo Empresarial Inmark. El mismo informe, según Europa Press (vía Infobae), concluye
    que la cátedra de la Complutense se constituyó conforme a la normativa de la UCM, pero pone el foco en las adjudicaciones
    para el desarrollo de un software. La empresa aparece como entidad de contexto profesional de Gómez, sin atribución
    de ilícito; rige la presunción de inocencia.'
