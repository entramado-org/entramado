    Aplicaciones Portuarias, con cambio de nombre y ampliación de actividad semanas antes de la aprobación del rescate.
    El auto le atribuye «un papel esencial dentro del circuito de circulación de fondos investigado, actuando como
    receptora final de los mismos y como instrumento para la formalización aparente de operaciones carentes de causa
    económica real» (auto, p.11). Según el informe de la ONIF de 25 de febrero de 2026, Plus Ultra le imputó pagos
    por 155.847,36 euros, mientras que el análisis bancario detecta dos transferencias de la aerolínea por 126.807,36
    euros (48.157,36 euros el 9 de septiembre de 2022 y 78.650 euros el 1 de marzo de 2023); los contratos hallados
