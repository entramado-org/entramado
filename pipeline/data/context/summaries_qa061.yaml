- entity_id: Company:aerovip
  name: Aerovip
  resumen: 'Aerovip es un grupo empresarial venezolano que la UDEF describe como «estrecho colaborador» de Plus
    Ultra Líneas Aéreas, con relaciones mercantiles entre ambas desde, al menos, 2018. Según el informe UDEF 1907/26,
    de 22 de abril de 2026 (p.77), los servicios que presta a la aerolínea se canalizan a través de dos sociedades
    con el mismo domicilio en Caracas: ADMINISTRADORA AEROVIP C.A., con contratos de handling (asistencia en tierra),
    de gestión de la atención al cliente y como fletador de vuelos chárter, y AEROVIP GSA C.A., nombrada agente
    general de ventas para el transporte de pasajeros en exclusiva en Venezuela. El informe añade que se trabaja
    con información «que debe ser contrastada» que apuntaría a que Rodolfo Reyes Rojas ostentaría dominio sobre
    el grupo. Según los informes UDEF 1907/26 (p.76) y 1908/26 (p.138), en un chat del 2 de marzo de 2021, ante
    la consulta de si un pago de 40.000 euros a un consejero de Plus Ultra, que figuraba en el listado de deuda
    que se iba a presentar a la SEPI, podía cobrarse a través de una sociedad, Roberto Roselli respondió «Podría
    hacerlo vía aerovip» y «Pedimos NC y facturamos por aerovip»; la UDEF ve en esa conversación la intención de
    canalizar pagos a través de una sociedad distinta de la inicialmente prevista para evitar que la SEPI les pusiera
    inconvenientes. Son hechos descritos en informes policiales, no juzgados; rige la presunción de inocencia.'
  sources: []
  updated: '2026-10-01'
  reason: '063 tramo 3 (2026-10-01): tanda 2026-10-01: decisión del dueño'
- entity_id: Company:corpoestructura
  name: Corpoestructura
  resumen: Corpoestructura S.L. es una sociedad en la que el 5 de septiembre de 2018 fueron nombrados administradores
    solidarios Rodolfo Reyes (hasta el 15 de noviembre de 2024) y Roberto Roselli (hasta el 24 de noviembre de 2021),
    según el informe 1908/2026 de la UDEF (p.148). Según ese informe (pp.29 y 148) y el auto del juez José Luis
    Calama de 18 de mayo de 2026 (p.25), el 19 de abril de 2021 Rodolfo Reyes Rojas remitió por correo electrónico
    a Santiago Fernández Lena un contrato de prestación de servicios de asesoramiento fechado el 1 de abril de 2021
    entre Análisis Relevante S.L. y Corpoestructura, rubricado por Reyes como administrador solidario, con unos
    honorarios mensuales de 10.000 euros más IVA durante 40 meses (484.000 euros); la UDEF lo describe como «un
    contrato tipo de asesoramiento de ANÁLISIS RELEVANTE, similar a los observados en otros casos». El contrato
    figura en la causa sobre el rescate de Plus Ultra en la que José Luis Rodríguez Zapatero fue citado en calidad
    de investigado (auto de 18 de mayo de 2026, p.2). Todo ello son indicios de una causa abierta; rige la presunción
    de inocencia.
  sources: []
  updated: '2026-10-01'
  reason: '063 tramo 3 (2026-10-01): Fecha de constitución sin fuente, retirada; «posible vehículo de pagos» sin
    fuente; «blanqueo» con fuentes que discrepan. El contrato se cita del corpus (UDEF 1908 pp.29 y 148; auto pp.2
    y 25). Las dos URL de prensa se quitan: su texto archivado no menciona Corpoestructura y todo lo publicado queda
    sostenido por el corpus.'
