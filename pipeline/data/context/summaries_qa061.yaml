- entity_id: Person:yolanda-sanchez-baltasar
  name: Yolanda Sánchez Baltasar
  resumen: Yolanda Sánchez Baltasar es directora del Conservatorio Profesional de Música Juan Vázquez de Badajoz
    (sentencia de la Audiencia Provincial de Badajoz 152/2026, p.132; Infobae, 01-06-2026). Declaró como testigo
