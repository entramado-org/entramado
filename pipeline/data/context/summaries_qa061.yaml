    de Sendaviva de junio de 2022 la empresa pública Nicdo, dependiente del Gobierno de Navarra, adjudicó a Adentro
    Construimos obras de reconstrucción por un total de 792.706,51 euros, divididos en cuatro contratos menores,
    cada uno por debajo de 200.000 euros. Según El Español (05-05-2026), una auditoría externa de la firma PKF Attest
    encargada por Parquenasa, sociedad que gestiona Sendaviva, apreció indicios de fraccionamiento en esas adjudicaciones,
    y la Oficina de Buenas Prácticas y Anticorrupción de Navarra detectó «presuntas irregularidades» por un posible
    fraccionamiento «indebido». Según El Español (05-05-2026), el Juzgado de Instrucción nº 5 de Pamplona le investiga
    por cohecho y tráfico de influencias en el llamado ''caso Sendaviva'', cuyo foco principal son esas adjudicaciones;
    la causa parte de una querella de Vox. Su hijo, Martín Vidaurre, fue contratado como asistente parlamentario
    por el Parlamento de Navarra a propuesta del grupo socialista, según declaró Ramón Alzórriz en el Senado (Diario
    de Sesiones del Senado nº 745, 30-06-2026, pp. 26 y 70). Está investigado, no condenado: rige la presunción
    de inocencia.'
