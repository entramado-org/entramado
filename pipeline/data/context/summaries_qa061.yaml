  resumen: Jaime Ribes es mencionado en los informes 1907/26 y 1908/26 de la UDEF (22 de abril de 2026) solo a través
    de mensajes de Roberto Roselli, director financiero de Plus Ultra, extraídos de su teléfono. En un mensaje de
    9 de junio de 2020, Roselli escribe que en la reunión mantenida con Banco Santander sobre la financiación de
    la aerolínea «por parte de Santander estuvo Jaime Ribes director de la agencia y José Javier castellanos director
    de área» (informe UDEF 1907, p.22; informe UDEF 1908, p.55). El 24 de junio de 2020, Roselli relata que había
    estado «reunido telefónicamente con nuestro ejecutivo de empresas Jaime Ribes que trabaja directamente con Javier
    Castellanos», y añade que «ellos han activado la solicitud» pero no les había llegado «ninguna orden» sobre
    el caso (informe UDEF 1907, p.26; informe UDEF 1908, p.59). Según la UDEF, las gestiones relativas a los préstamos
    avalados por el ICO finalmente no llegaron a materializarse (informe UDEF 1907, p.26). No consta que esté investigado
    ni imputado en la causa del rescate de Plus Ultra; figura únicamente como tercero (banquero) citado en las conversaciones
    intervenidas. Rige plenamente la presunción de inocencia.
