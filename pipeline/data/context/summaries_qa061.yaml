- entity_id: Person:juan-sanchez-yepes
  name: Juan Sánchez Yepes
  resumen: 'Capitán de la Guardia Civil y exmando de la UCO. El juez de la Audiencia Nacional Santiago Pedraz (Tribunal
    Central de Instancia, Sección de Instrucción nº 5, DPA 150/2025) lo investiga por presuntos delitos de revelación
    de secretos, cohecho y contra las instituciones del Estado en el llamado ''caso Leire'' (auto de 26 de mayo
    de 2026, p.19 y p.50). Según ese auto, en una reunión celebrada el 10 de diciembre de 2024 con Leire Díez, Javier
    Pérez Dolset y Jacobo Teijelo, grabada y unida a la causa, atendió las solicitudes de Díez informándole sobre
    la estructura interna de la UCO y aportando información sobre alguno de sus miembros, pese a reconocer que se
    trataba de información secreta (p.16-17); The Objective (28-05-2026) y El Español (30-05-2026) precisan que
    esa información incluía al teniente coronel Antonio Balas, y El Español sitúa la reunión en Madrid. Aparece
    también investigado en una causa de hidrocarburos. Está representado por el letrado Jacobo Teijelo (auto, p.6).
    Según El Español (30-05-2026), fue durante 14 años y hasta 2022 mando de la UCO, experto en antiblanqueo de
    capitales que impartía charlas en foros especializados, y en la actualidad desempeña labores administrativas
    en el Colegio de Guardias Jóvenes de Valdemoro (Madrid), destino que también recoge The Objective (28-05-2026).
    Rige la presunción de inocencia: es una investigación en curso, sin condena.'
