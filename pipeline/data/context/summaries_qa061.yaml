- entity_id: Person:daniel-fernandez-menendez
  name: Daniel Fernández Menéndez
  resumen: 'Daniel Fernández Menéndez («Dani», «Dani Opr») figura en el informe de la UCO de junio de 2025 como
    administrador mancomunado de la constructora Obras Públicas y Regadíos (OPR) durante los hechos investigados
    (p.106 y 410), sociedad con sede social en Madrid (p.106) y oficinas en Peligros (Granada), según El Independiente
    de Granada (12-06-2025). Es hermano de Antonio Fernández Menéndez, apoderado de OPR desde agosto de 2023 (p.106);
    ambos son cuñados de Fernando Merino, exdirectivo de Acciona, que según el informe (p.107) los habría introducido
