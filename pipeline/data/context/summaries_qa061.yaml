- entity_id: Company:acciona-construccion
  name: Acciona Construcción
  resumen: Acciona Construcción, S.A. (antes Acciona Infraestructuras SA) es la filial constructora del grupo Acciona,
    con sede en Madrid (informe UCO, p.28). Según el informe de la UCO de 5 de junio de 2025, en las grabaciones
    de Koldo García este persigue el cobro de presuntas contraprestaciones económicas adeudadas tras la adjudicación
    de obra pública «principalmente a ACCIONA SA, especialmente a través de su filial ACCIONA CONSTRUCCIÓN SA» (informe
    UCO, p.7), y el instructor del Tribunal Supremo señala que todas esas obras fueron adjudicadas a Acciona Construcción
    actuando en UTE «con otras de mucha menor envergadura, sin que en ninguno de los casos la adjudicataria presentara
    la mejor oferta económica, invariablemente favorecida en la licitación por criterios de valoración subjetiva»,
    en el marco del Ministerio de Transportes a través de la Dirección General de Carreteras o de Adif, en Logroño,
    Sevilla, Sant Feliu de Llobregat, El Mayor y Murcia (auto del TS de 2025, ATS 8611/2025, p.6 y p.9); entre ellas
    figuran la autovía A-68 Arrúbal-Navarrete (La Rioja) y el proyecto de construcción de tirantes del Puente del
    Centenario de Sevilla (SE-30) (informe UCO, p.16). El 14 de noviembre de 2025, en una pieza separada del caso
    Koldo/Ábalos relacionada con Santos Cerdán y la sociedad Servinabar, la UCO practicó por orden del instructor
    Leopoldo Puente ocho registros en varias empresas, incluidas sedes de Acciona en Madrid y Bilbao y el domicilio
    del exdirector de Construcción para España Justo Vicente Pelegrini (según Diario de León, 15-11-2025, e Infobae,
    18-11-2025); el juez levantó después el secreto parcial de la pieza (Libertad Digital, 18-11-2025) y tres antiguos
    directivos de Acciona Construcción figuran como investigados en la causa especial (auto del TS 242/2026, p.2).
    Según Europa Press (vía Andalucía Información) e Infobae (24 y 27 de julio de 2026), el juez Ismael Moreno de
    la Audiencia Nacional, que instruye la pieza de obra pública, reclamó a Hacienda los expedientes fiscales 2021-2023
    de Acciona Construcción e incorporó la adjudicación de los túneles de Belate (Navarra) a la UTE de Acciona Construcción
    con Servinabar. No consta imputación de la sociedad como persona jurídica; la investigación sigue abierta y
    rige la presunción de inocencia.
