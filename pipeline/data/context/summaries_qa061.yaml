- entity_id: LegalCase:ddpp-65-23-del-jci-2
  name: DDPP 65/23 del JCI 2
  resumen: Procedimiento de Diligencias Previas 65/2023 incoado por el Juzgado Central de Instrucción nº 2 de la
    Audiencia Nacional, marco procesal del llamado 'caso Koldo' sobre presuntas irregularidades en adjudicaciones
    de contratos durante la pandemia de COVID-19. En esta causa se investiga la presunta intervención de Koldo García
    Izaguirre, entonces asesor personal del ministro José Luis Ábalos, en la consecución de contratos de material
    sanitario (informe UCO 96/2025, p.11). El 23 de octubre de 2024 el Tribunal Supremo recibió una exposición razonada
    remitida por el JCI nº 2 que sometía a la consideración de su Sala de lo Penal la asunción de la competencia
    para continuar la instrucción de las DDPP 65/2023 (ATS 13325/2024, de 5 de noviembre de 2024); según Moncloa.com
    (24-12-2024), la exposición se elevó porque José Luis Ábalos «todavía está aforado por su condición de diputado».
    Conecta procesalmente con la causa especial seguida en el Tribunal Supremo. Rige la presunción de inocencia.
  sources:
  - https://www.estrelladigital.es/articulo/tribunales/audiencia-nacional-eleva-exposicion-razonada-exministro-abalos-por-presuntas-irregularidades-adjudicaciones-pandemia/20241023135157362834.html
