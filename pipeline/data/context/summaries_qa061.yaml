- entity_id: Person:salvador-illa
  name: Salvador Illa
  resumen: 'Salvador Illa Roca fue ministro de Sanidad entre el 13 de enero de 2020 y el 27 de enero de 2021 (según
    Público y Wikipedia), en lo peor de la pandemia, periodo en que se produjeron las compras de emergencia de material
    sanitario de las que arranca el ''caso Koldo'' y las auditorías sobre contratos de emergencia. Compareció ante
    la comisión de investigación del Congreso el 22 de abril de 2024 y, según se recogió en la comisión del Senado,
    también ante esta a finales de abril de 2024 (Diario de Sesiones del Senado, 6 de mayo de 2024, p.17). Según
    Público (22-04-2024), en el Congreso admitió haberse visto una vez con Koldo García —«le remití a los técnicos
    y el resultado es que Sanidad no compró nada»—, explicó que las compras de su ministerio las ejecutaron el INGESA
    y la Dirección General de Farmacia, y sostuvo que el Ministerio de Sanidad no gastó «ni un euro» en compras
    a Soluciones de Gestión, aunque esta llegó a estar seleccionada, junto a otras 72 sociedades, en un acuerdo
    marco de selección de material sanitario del INGESA por dos años que, en sus palabras, «no significaba ninguna
    obligación de compra. Insisto: ni un euro salió para esa empresa». Desde el 10 de agosto de 2024 es presidente
    de la Generalitat de Cataluña por el PSC, partido del que es primer secretario desde diciembre de 2021 (según
    Wikipedia). No consta que esté imputado ni investigado judicialmente en estas causas y rige plenamente la presunción
    de inocencia; su aparición en esta base responde a su cargo institucional en el momento de los hechos.'
  sources:
  - https://es.wikipedia.org/wiki/Salvador_Illa
  - https://www.publico.es/politica/salvador-illa-desmiente-pp-comision-mascarillas-me-vi-vez-koldo-pero-sanidad-compro.html
