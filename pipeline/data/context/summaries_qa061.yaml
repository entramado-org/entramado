- entity_id: Company:iberia
  name: Iberia
  resumen: 'Iberia es la aerolínea de bandera española. Aparece en la documentación del caso Koldo (mascarillas)
    en el contexto de los vuelos para el transporte desde China del material sanitario importado en 2020: José Luis
    Ábalos declaró ante la comisión de investigación del Senado que «solo teníamos dos compañías acreditadas en
