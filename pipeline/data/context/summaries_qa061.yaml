- entity_id: Organization:hirurok
  name: Hirurok
  resumen: Hirurok ('nosotros tres' en euskera) es el nombre con el que, según el auto de 26 de mayo de 2026 del
    juez Santiago Pedraz (Tribunal Central de Instancia, Sección de Instrucción nº 5 —Audiencia Nacional—, diligencias
    previas 150/2025), se autodenominaba un grupo formado por Leire Díez Castro, Vicente Cecilio Fernández Guerrero
    (presidente de la SEPI entre el 23 de junio de 2018 y el 4 de octubre de 2019) y Joseba Antxon Alonso Egurrola
    (p.3-4), propietario y administrador único de Servinabar 2000 S.L.U., sociedad de la que Santos Cerdán habría
    adquirido 1.350 de las 3.000 participaciones (45 %) mediante un contrato privado (auto de prisión de 30 de junio
    de 2025, p.11). Según Infobae (27-05-2026), que cita la instrucción, la presunta trama se habría constituido
    en torno a 2021-2022 (las fuentes citan el 1 de junio de 2021 y el uso de un grupo cifrado en Threema) y habría
    buscado orientar procedimientos en la Administración pública en beneficio propio o de terceros, canalizar comisiones
    y desviar fondos (se investigan en torno a 700.000 euros) entre 2021 y 2023, además de presuntamente obstruir
    investigaciones judiciales que afectasen al PSOE o al Gobierno; se cita como caso relevante el rescate de Tubos
    Reunidos. El 27 de mayo de 2026 la UCO accedió a la sede del PSOE en Ferraz en el marco de la causa. Todo se
    halla en fase de instrucción y bajo presunción de inocencia de los investigados.
