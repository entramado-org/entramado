- entity_id: Organization:brigada-central-de-investigacion-de-blanqueo-de-capitales-y-
  name: Brigada Central de Investigación de Blanqueo de Capitales y Anticorrupción
  resumen: Es la brigada de la UDEF (Unidad de Delincuencia Económica y Fiscal) de la Policía Nacional especializada
    en blanqueo de capitales y corrupción. En la causa Plus Ultra (Juzgado Central de Instrucción nº 2, juez Calama)
    la UDEF participa como unidad policial auxiliar de la instrucción en el rastreo de los presuntos pagos y movimientos
    de dinero vinculados al rescate de la aerolínea con fondos del FASEE. Actúa como policía investigadora, no como
    entidad investigada. Firma, con la sigla UDEF-BBCA, los informes 1907/26 y 1908/26 de 22 de abril de 2026 y
    el 2910/26 de 22 de junio de 2026 en las diligencias previas 77/2024 (informe UDEF 1907, p.2; informe UDEF 1908,
    p.2; informe UDEF 2910, p.2); el auto de 18 de mayo de 2026 recoge su oficio 2342/26 UDEF-BBCA de 14 de mayo
    de 2026, en el que solicitó diligencias de entrada y registro (p.5), y autoriza el traslado de los documentos
    y efectos intervenidos a las dependencias de la UDEF para su análisis por funcionarios adscritos a la brigada
    (p.78).
