    a directivos de Plus Ultra y de su puesta en libertad provisional con retirada de pasaporte y comparecencias
    periódicas. Según el informe de la UDEF y la instrucción, mantuvo relación profesional con Rodolfo
    Reyes, considerado accionista de Plus Ultra, y habría actuado como intermediario para articular contactos
    políticos e institucionales en torno al rescate de 53 millones de euros y para diseñar estrategias
    destinadas a frenar la investigación judicial. Según mensajes intervenidos e incorporados al informe
    de la UDEF, tras conocer presuntamente la entrega de 50.000 euros en efectivo, Palomero habría escrito
    que 'hay que cuidar a los jueces, policías y funcionarios'; se trata de material de la instrucción
    aún no enjuiciado. Según El Independiente, el despacho Andersen, al que se había incorporado como
    socio el 15 de septiembre de 2025, prescindió de él el 14 de diciembre de 2025, tres días después
    del estallido público de la causa. Según The Objective, el juez Ismael Moreno se abstuvo de la causa
    (abstención notificada el 23 de octubre de 2024) tras haber mantenido encuentros con Palomero por
    un asunto particular. Se le sitúa además como posible nexo entre Plus Ultra y el entorno del exministro
    Ábalos. Rige la presunción de inocencia.
