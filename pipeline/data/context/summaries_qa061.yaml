- entity_id: Person:armengol
  name: Armengol
  resumen: 'Francina Armengol (Inca, 1971) es presidenta del Congreso de los Diputados desde el 17 de agosto de
    2023 y fue presidenta del Govern de las Illes Balears entre el 2 de julio de 2015 y el 19 de junio de 2023 por
    el PSIB-PSOE, del que es secretaria general desde 2012, primera mujer en presidir el Govern (según Wikipedia).
    Su nombre aparece en la dimensión balear del caso Koldo/mascarillas: siendo presidenta, la Administración balear
    contrató el 8 de mayo de 2020 con Soluciones de Gestión —empresa vinculada a la trama de Víctor de Aldama y
    Koldo García— 1,4 millones de mascarillas por 3,7 millones de euros (Diario de Sesiones del Congreso, comisión
    de investigación, p.32 y p.65; elDiario.es); según declaró en esa comisión el director general del IB-Salut,
    el Servicio de Salud entendió después que esas mascarillas no eran KN95/FFP2, las valoró como quirúrgicas y
    reclamó a la empresa 2,6 millones de euros de diferencia (p.3). Según elDiario.es, un informe de la UCO sitúa
    el primer contacto detectado entre Koldo García y Armengol en un mensaje de WhatsApp del 25 de abril de 2020
    y concluye que ella remitió a Koldo al servicio de salud: ese mismo día Manuel Palomino, director de Gestión
    del Servicio de Salud balear, escribió al asesor ministerial que le habían dado su contacto y que querían adquirir
    un millón de mascarillas FFP2. Armengol ha declarado, según recoge elDiario.es, que cualquier gestión la habría
    derivado al órgano de contratación correspondiente y que «nunca recibí orden o presión para contratar con nadie».
    Según Última Hora (21-05-2026), Víctor de Aldama declaró como investigado ante el juez Ismael Moreno (Audiencia
    Nacional) que no le consta que se cobraran comisiones en Baleares por los contratos de mascarillas. No consta
    que esté investigada por estos hechos y rige plenamente la presunción de inocencia.'
