- entity_id: Person:santiago-fernandez-lena
  name: Santiago Fernández Lena
  resumen: 'Santiago Fernández Lena es abogado; según The Objective (23-05-2026), estuvo una década ligado a la
    aerolínea Plus Ultra como secretario no consejero (externo, a título particular) y pasó a ser secretario de
    su consejo de administración, y fue socio y apoderado solidario del despacho Andersen, al que llegó a finales
    de 2021 y que abandonó por decisión propia el 30 de noviembre de 2025, once días antes del registro de su vivienda
    del 11 de diciembre (según Vozpópuli, 26-05-2026). En el caso Plus Ultra/Zapatero figura como investigado (informe
    UDEF 1907, p.127). La UDEF y el auto del TCI de 18 de mayo de 2026 lo vinculan a Caletón Consultores SL, sociedad
    que el auto describe como «controlada de facto por Santiago Fernández Lena pese a carecer de vinculación formal»
    e «instrumental» para canalizar fondos de Plus Ultra hacia sociedades del entorno de Julio Martínez Martínez
    (auto, p.10), cuyo administrador único, Basiliso Gil Carrasquero, es descrito como testaferro (auto, p.41) y
    a la que Plus Ultra pagó 1.159.558,55 euros entre 2020 y 2025, facturados en parte como «comisiones» por operaciones
    chárter (auto, p.38): las facturas de Caletón le eran enviadas por un empleado de Julio Martínez Martínez «a
    pesar de no ostentar ningún cargo conocido en CALETÓN» (informe UDEF 1907, p.126) y, en una conversación con
    Julio Martínez Sola sobre una factura de 50.000 euros, afirmó que «Caletón no tiene programas» y propuso hacerlo
    «con otro concepto» (p.128-129). Según Vozpópuli (26-05-2026), en el registro de su vivienda la UDEF halló 31.670
    euros y 655 dólares en efectivo ocultos en una caja de seguridad dentro de una caja de zapatos. Es una causa
    en instrucción, sin condena: rige la presunción de inocencia.'
  sources:
  - https://www.vozpopuli.com/tribunales/el-abogado-de-plus-ultra-imputado-escondia-31000-euros-en-efectivo-en-una-caja-de-zapatos.html
