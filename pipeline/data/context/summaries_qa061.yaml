    a través del Fondo de Apoyo a la Solvencia de Empresas Estratégicas (FASEE) de la SEPI, cuando José Luis Ábalos
    era ministro de Transportes. La investigación del caso Koldo y el juicio del 'caso mascarillas' examinan el
    presunto papel de Víctor de Aldama como intermediario —contratado por la aerolínea y cuya intervención Globalia
    reconoció—, y los informes de la UCO recogen que Ábalos facilitó la negociación entre Javier Hidalgo y la entonces
    ministra de Economía Nadia Calviño, y la sentencia del Tribunal Supremo de 22 de junio de 2026 declaró probado
    que, en pago a las gestiones relacionadas con el rescate, Víctor de Aldama —con la colaboración de Koldo García
    y el conocimiento de Ábalos— gestionó el alquiler de una vivienda en Marbella (Villa Parra) donde Ábalos y su
    familia vacacionaron del 14 al 23 de agosto de 2020, con 8.000 euros de renta pagados en efectivo, importe decomisado
    en la sentencia. La compañía es pieza relevante de esa línea de investigación; rige la presunción de inocencia.
