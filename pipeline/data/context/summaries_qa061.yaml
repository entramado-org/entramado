    pero sí en elDiario.es (juez retira pasaporte) → atribuidos en vez de retirados'
- entity_id: Organization:puertos-del-estado
  name: Puertos del Estado
  resumen: 'Puertos del Estado es el organismo público, adscrito al Ministerio de Transportes, que coordina y controla
    la eficiencia del sistema portuario de titularidad estatal. En el ''caso Koldo'' figura como uno de los compradores
    públicos de mascarillas en 2020: adjudicó a Soluciones de Gestión y Ayuda a las Empresas SL (empresa que la
    investigación vincula a Víctor de Aldama) un contrato de unos 8 millones de mascarillas por aproximadamente
    24,2 millones de euros. Según EFE (vía Infobae) y Europa Press (vía Teleprensa), el 15 de abril de 2026 su entonces
    presidente, Francisco Toledo, y el exsecretario general Álvaro Sánchez Manzanares declararon como testigos en
    el juicio del Tribunal Supremo que no recibieron presiones ni instrucciones de los acusados; Toledo testificó
    que la contratación le llegó lista para la firma y que se le dijo que cumplía las reglas legales. Rige la presunción
    de inocencia: no hay condena.'
