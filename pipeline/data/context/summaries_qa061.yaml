- entity_id: Company:apamate-corporate-and-trust
  name: Apamate Corporate And Trust
  resumen: 'Apamate Corporate and Trust SL es una sociedad cuyo administrador único es Carlos Alberto Parra Delgado
    y cuyas participaciones corresponden en un 99,6 % a Softgestor SL, también administrada por Parra Delgado, lo
    que según el auto del caso Plus Ultra «refuerza la existencia de un grupo societario bajo control efectivo»
    de este (auto, p.71; informe UDEF 1907, p.159). Su nombre aparece en el contrato de prestación de servicios
    de asesoramiento entre Análisis Relevante SL —consultora controlada formalmente por Julio Martínez Martínez,
    a quien el informe UDEF 1907 señala como testaferro de José Luis Rodríguez Zapatero (p.115)— y el entorno de
    Parra Delgado: el 18 de octubre de 2020 Francisco Flores devolvió a Martínez Martínez el contrato, fechado a
    30 de julio de 2020 y con honorarios de 120.000 euros (60.000 a la firma y 60.000 el 15 de abril de 2021), cumplimentado
    con los datos de Apamate como receptora del servicio, y el 22 de octubre de 2020 se remitió la versión definitiva
    sustituyendo esos datos por los de Softgestor, que fue quien transfirió 72.600 euros a Análisis Relevante el
    30 de octubre de 2020 (auto, p.46 y p.72; informe UDEF 1907, p.159-160). El auto atribuye a Softgestor, no a
    Apamate, la función de vehículo de canalización de fondos (p.10 y p.71), y tanto el auto como la UDEF constatan
    que en las cuentas de Análisis Relevante no se detecta ninguna transferencia con origen en Apamate (auto, p.46;
    UDEF, p.160). La UDEF añade que, «según fuentes abiertas», Apamate estaría relacionada con un pago de 300.000
    euros el 3 de enero de 2020 a Deluxe Fortune, sociedad relacionada con Víctor de Aldama (informe UDEF 1907,
    p.160). Se trata de hechos en fase de investigación; rige la presunción de inocencia.'
  sources: []
  updated: '2026-09-15'
