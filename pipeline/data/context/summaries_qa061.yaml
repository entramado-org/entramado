- entity_id: Person:tomas-guerrero-blanco
  name: Tomás Guerrero Blanco
  resumen: Tomás Guerrero Blanco aparece en la investigación del caso Plus Ultra por la constitución de una sociedad
    en Dubái. Según el auto de 18 de mayo de 2026 del juez José Luis Calama (Audiencia Nacional, DP 77/2024), al
    día siguiente de un encuentro entre José Luis Rodríguez Zapatero y Julio Martínez Martínez, Guerrero envió a
    este un correo electrónico, «según lo conversado ayer», detallándole la documentación necesaria para constituir
    una sociedad en Dubái, le puso en contacto con los responsables de la zona franca y, poco después, le remitió
    otro correo con el posible nombre de la sociedad y la dirección de contacto; la sociedad finalmente radicada
    en Dubái se denominó Landside Dubai FZCO, participada al 100 % por Idella Consulenza Strategica SL (auto, p.32;
    informe UDEF-BBCA 1907/26, p.94-96). El auto sitúa esa reunión, organizada por Zapatero y a la que acudieron
    Martínez Martínez y Guerrero Blanco, el 26 de enero de 2021, una semana después del contrato entre Plus Ultra
    e Idella por el 1 % del rescate (530.000 euros), e infiere de forma indiciaria la creación de una estructura
    societaria para recibir ese pago en el extranjero (p.33). El informe UDEF-BBCA 1907/26 apunta, con lenguaje
    cautelar («pudiera tratarse de»), que podría ser Tomás Víctor Guerrero Blanco, fundador de Halal International
    Tourism S.L., Halal Global Services S.L. y Statecraft Global Advisor S.L.U., de la que constaría como administrador
    único (p.94, nota 92). No consta que esté investigado ni imputado; rige la presunción de inocencia.
  sources: []
