- entity_id: Company:voli-analitica
  name: Voli Analítica
  resumen: Voli Analítica SL es una sociedad de Julio Martínez Martínez (auto de 18 de mayo de 2026, p.24) investigada
    en el caso Plus Ultra (diligencias previas 77/2024 de la Sección de Instrucción del Tribunal Central de Instancia,
    plaza nº 2). Según ese auto, la sociedad tuvo «un papel relevante tanto en la canalización directa de fondos
    procedentes de Plus Ultra como en su circulación indirecta a través de sociedades interpuestas», generando «cobertura
    formal mediante facturación cuya correspondencia con una actividad real resulta, cuando menos, cuestionable»
    (auto de 18 de mayo de 2026, p.11). En las diligencias de entrada y registro fueron intervenidas catorce facturas
    expedidas por Voli Analítica a Plus Ultra entre el 1 de abril y el 22 de diciembre de 2021, con el concepto
    «Servicios prestados por gestión de vuelos Madrid-Caracas», por un importe total de 86.992,95 euros, IVA incluido
    (auto, p.38; informe UDEF 1907/26, p.118); la sociedad declaró haber recibido de la aerolínea 141.772,71 euros,
    mientras que el análisis de sus cuentas bancarias muestra transferencias de Plus Ultra por 119.992,71 euros,
    y carecía de trabajadores en los ejercicios en que percibió esos ingresos (auto, p.37-38). El auto añade que
    en 2023 Caletón Consultores SL le pagó 108.900 euros por siete facturas de honorarios de asesoramiento (auto,
    p.39) y la describe como una pieza del entramado societario de Julio Martínez Martínez utilizada para «dotar
    de apariencia de legalidad a operaciones cuya causa económica no ha sido suficientemente acreditada» (auto,
    p.11 y p.36); en esa misma resolución el instructor acordó la imputación de José Luis Rodríguez Zapatero (auto,
    p.2-3). Se trata de indicios de una causa en instrucción; rige la presunción de inocencia.
