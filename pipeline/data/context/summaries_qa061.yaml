- entity_id: Person:luis-antonio-martin-bernardos
  name: Luis Antonio Martín Bernardos
  resumen: 'Luis Antonio Martín Bernardos fue administrador solidario de Innova Next SL —la sociedad del empresario
    Juan Carlos Barrabés que, según el informe de la UCO, aglutina el 91,7 % del importe total adjudicado por la
    Administración a las empresas vinculadas a Barrabés (28 contratos por 22.857.805,49 euros, sobre un total de
    24.923.443,60 euros; informe UCO, p.69 y p.83)— entre el 5 de junio de 2013 y su cese el 7 de abril de 2022
    (informe UCO, p.19 y p.76). En la causa contra Begoña Gómez ha intervenido como testigo, no como investigado:
    según EFE (vía Cronista, 15-07-2024), el juez Juan Carlos Peinado le tomó declaración en persona el 15 de julio
    de 2024, el mismo día que a Barrabés, y las acusaciones populares anunciaron que valorarían pedir que ambos
    testigos pasaran a ser investigados ante los «indicios» en su contra. Según El Español (18-05-2026), la defensa
    de Gómez lo incluyó en su lista de testigos para el juicio, por ser directivo de Innova Next cuando esta obtuvo
    las adjudicaciones, con el fin de desvincularlas de cualquier trato de favor. Rige plena presunción de inocencia:
    no consta imputado.'
