- entity_id: Person:juan-manuel-teixeira-diaz
  name: Juan Manuel Teixeira Díaz
  resumen: 'El mayor general Juan Manuel Teixeira Díaz es un militar venezolano que presidía el Instituto Nacional
    de Aeronáutica Civil (INAC) de Venezuela en 2021, organismo que autorizaba los vuelos de Plus Ultra entre Caracas
    y Madrid, según el auto del juez José Luis Calama de 18 de mayo de 2026 (p.36 y 57) y el informe UDEF 1907 (p.59).
