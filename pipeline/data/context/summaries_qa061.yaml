- entity_id: Organization:bar-franky
  name: Bar Franky
  resumen: '''Bar Franky'' (alias ''Franky'') es un bar/restaurante de Pamplona —un establecimiento, no una persona—.
    Según el informe de la UCO, a través de él se articuló una operativa que permitió obtener liquidez procedente
    de Acciona para el entorno de Koldo García: el bar emitía facturas ficticias a Acciona, la constructora las
    pagaba por transferencia al restaurante y los abonos se compensaban con dinero en efectivo que retiraba Koldo
    (informe de la UCO, p.193-194); la primera comunicación data del 26 de noviembre de 2016 y la primera factura,
    de 1.525 euros a nombre de Acciona Infraestructuras, del 29 de noviembre de 2016 (p.194-195). Su asesor fiscal,
    Miguel Moreno Purroy, reconoció ante la comisión de investigación del Parlamento de Navarra (según El Español
    y El Independiente, 03-03-2026) y después, como testigo, ante el juez Ismael Moreno de la Audiencia Nacional
    (según The Objective y OKDiario Navarra, 13-05-2026) haber emitido entre 2016 y 2018, a petición de Koldo García,
    unas seis facturas que «no respondían a una prestación real» y que en total «no ascienden a más de 8.000 euros»,
    cinco a nombre de Acciona y una de la UTE Recajo —en la que participaba Acciona—: Koldo le indicaba el importe
    y el destinatario y él se inventaba los conceptos. Según El Español, el dinero de las facturas se cobraba en
    la cuenta del bar y se entregaba en efectivo a Koldo García; según The Objective, el pago de la factura de la
    UTE Recajo lo recibió en su propia cuenta, retiró el efectivo y se lo entregó a Patricia Úriz, entonces pareja
    de Koldo. Moreno Purroy declaró que accedió porque Koldo le dijo que «estaba en mal momento económico» y negó
    formar parte de «una trama corrupta» (El Español, 03-03-2026); según El Independiente, el juez instructor le
    comunicó en junio de 2025 que no tiene la condición de investigado. Todo ello son indicios en una instrucción
    en curso; rige la presunción de inocencia y no hay condena.'
