- entity_id: Person:ricardo-cabezas-martin
  name: Ricardo Cabezas Martín
  resumen: 'Ricardo Cabezas Martín (Badajoz, 1974) es concejal del Grupo Municipal Socialista en el Ayuntamiento
    de Badajoz, del que es portavoz según Infobae (28-05-2026) y Extremadura7días (28-05-2025); según la ficha municipal
    es graduado en Educación Primaria por la Universidad de Extremadura y profesor de piano. Fue diputado provincial
    delegado del Área de Cultura, Deportes y Juventud de la Diputación de Badajoz: como tal firmó el 19 de septiembre
    de 2023 la propuesta de modificación de la RPT que creó la Jefatura de Sección de Coordinación de Centros y
    Programas de Actividades Transfronterizas, cubierta después por Luis María Carrero (sentencia AP Badajoz 152/2026,
    p.158). El 14 de julio de 2026 la Sección Primera de la Audiencia Provincial de Badajoz lo condenó, en la causa
    por la contratación de David Sánchez en la Diputación, como autor de un delito de prevaricación administrativa
    (Bloque C de los hechos probados) a nueve años de inhabilitación especial para empleo o cargo público y para
    el ejercicio del derecho de sufragio pasivo, y lo absolvió del resto de las infracciones que se le imputaban
    (sentencia, p.375). La sentencia NO es firme: cabe recurso de apelación ante la Sala Civil y Penal del Tribunal
    Superior de Justicia de Extremadura (p.376) y rige la presunción de inocencia. Homonimia: el «Ricardo» que aparece
    en las transcripciones del caso Koldo es Ricardo Mar Ruipérez, jefe de Gabinete del Ministerio de Transportes
    (informe UCO, p.368; sentencia del Tribunal Supremo de 22-06-2026, p.72), sin relación con este político pacense,
    cuya condena pertenece exclusivamente a la causa de la Diputación de Badajoz.'
