- entity_id: Company:servinabar
  name: Servinabar
  resumen: 'Servinabar 2000 S.L.U. es una sociedad mercantil radicada en Navarra, propiedad y administrada por Joseba
    Antxon Alonso Egurrola, que actuó en UTE con Acciona en contratos en Navarra; según elDiario.es, nació como
