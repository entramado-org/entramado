- entity_id: Company:grupo-barrabes
  name: Grupo Barrabés
  resumen: 'Grupo Barrabés es el grupo empresarial del empresario aragonés Juan Carlos (Carlos) Barrabés Cónsul,
    a quien el informe de la UCO de 14 de mayo de 2024 (p.13, citando a Banco Santander) describe como su presidente
    y fundador; ofrece, según esa misma cita, servicios de asesoramiento en transformación digital, innovación,
    nuevas tecnologías y comercio electrónico. La UCO identifica seis sociedades del grupo adjudicatarias de contratos
    públicos (informe UCO, p.142) y, en particular, tres expedientes de la entidad pública Red.es (044/20-ED, 014/20-ED
    y 016/20-ED) adjudicados a Innova Next SLU, sola o en UTE con The Valley, por 10.607.203,30 euros en conjunto
    (informe UCO, p.83 y p.127); los dos últimos se adjudicaron el 30 de julio y el 2 de agosto de 2021 y contaron
    con dos cartas de apoyo firmadas por Begoña Gómez como codirectora de un máster de la Universidad Complutense
    (auto de 20 de junio de 2026, p.5). Esos hechos se investigaron en las diligencias previas 1146/2024 del Juzgado
    de Instrucción nº 41 de Madrid (informe UCO, p.2), el caso Begoña Gómez instruido, según The Objective (14 de
    abril de 2026), por el juez Juan Carlos Peinado; en la comisión de investigación del Senado (11 de diciembre
    de 2025) Barrabés declaró que él y sus empresas «han actuado con absoluta regularidad» (The Objective, 14 de
    abril de 2026). Según Infobae (16 de julio de 2026), la Sección 23ª de la Audiencia Provincial de Madrid excluyó
    a Barrabés del procedimiento por falta de pruebas directas, y según Europa Press (vía The Objective, 4 de agosto
    de 2026) Peinado remitió a la Fiscalía Europea la pieza sobre el contrato de Red.es a la UTE Innova Next-KPMG,
    financiado con fondos europeos. Rige la presunción de inocencia: no hay condena.'
