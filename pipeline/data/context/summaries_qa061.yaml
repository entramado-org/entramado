- entity_id: Organization:manos-limpias
  name: Manos Limpias
  resumen: 'Manos Limpias (Sindicato Colectivo de Funcionarios Públicos Manos Limpias, denominación con la que consta
    en las resoluciones judiciales) es una organización que ejerce la acusación popular en causas de relevancia
    mediática: la de Begoña Gómez, la del fiscal general Álvaro García Ortiz (querella de 17 de junio de 2024; sentencia
    del Tribunal Supremo, p.3), la de David Sánchez ante la Audiencia Provincial de Badajoz (sentencia 152/2026,
    pp.1 y 4) y la causa especial del Tribunal Supremo por el caso Koldo (ATS 15039/2024, p.3). Su denuncia, con
    hechos «sustentados en noticias de prensa» según el informe de la Guardia Civil (p.7), fue la que dio origen
    al ''caso Begoña Gómez'' en abril de 2024 (auto de incoación de 16 de abril de 2024). Su secretario es Miguel
    Bernad Remón (sentencia del Tribunal Supremo en la causa del fiscal general, p.3). Infobae (01-06-2026) y elDiario.es
    la califican de «pseudosindicato» y Wikipedia de «sindicato de extrema derecha». Rige la presunción de inocencia
    respecto de las personas a las que acusa.'
