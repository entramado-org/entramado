    juzgada en Extremadura. La sentencia declara probado que el entonces director del Conservatorio Superior de
    Música, Evaristo Valentí, le dijo en una reunión previa que se rumoreaba que el puesto se creaba para una persona
    determinada, David Sánchez (sentencia 152/2026, p.7). Según Infobae (01-06-2026), en su declaración como testigo
    en junio de 2026 afirmó que la labor de David Sánchez como coordinador les «vino muy bien», dijo desconocer
    quién lo seleccionó y comentó que le sorprendió el «rumor». No figura como acusada; su papel es el de testigo
    y persona del entorno administrativo del Conservatorio. Rige la presunción de inocencia para todos los investigados
    de la causa.
