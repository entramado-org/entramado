- entity_id: Organization:gate-center
  name: Gate Center
  resumen: Gate Center (The Global Analysis & Trends in Emerging Regions Center) se describe en su web, según recoge
    el informe de la UDEF, como un think tank sin ánimo de lucro con sede en Madrid fundado en 2022; su fundador
