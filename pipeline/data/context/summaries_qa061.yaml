- entity_id: Company:injoo-technology
  name: Injoo Technology
  resumen: Injoo Technology (también Innjoo Technology) es una empresa que durante la pandemia de COVID-19 vendió
    material sanitario a administraciones públicas. Según Moncloa.com (4 de noviembre de 2024), facturó 51.454.644
    euros en contratos públicos —entre ellos con ADIF (2,1 millones), el Ministerio del Interior (2,4 millones)
    y los gobiernos de Baleares, Canarias y Cataluña—, es propiedad de un ciudadano chino, Chen Shouting, con matriz
    en Hong Kong, y se encontraba en liquidación; según ese mismo medio, tanto Soluciones de Gestión como Innjoo
    «se estrenaban con contratos del Estado en 2020», primero con Puertos del Estado y ADIF, y esos contratos con
    el Ministerio de Transportes de Ábalos «les abrieron la puerta» a otros clientes públicos, siguiendo Innjoo
    «el mismo camino» que Soluciones de Gestión, la empresa central del caso Koldo. En la compra de mascarillas
    de ADIF de marzo de 2020 presentó una oferta a 2,10 euros la unidad frente a los 2,5 de Soluciones de Gestión,
    que obtuvo el contrato (informe de auditoría de Adif de 19 de agosto de 2024, p.58-60); según El Independiente
    (29 de agosto de 2024), Adif le compró en paralelo un millón de mascarillas por 2,1 millones de euros. También
    remitió una oferta a Puertos del Estado en marzo de 2020 (exposición razonada elevada al Tribunal Supremo por
    el juez Ismael Moreno (JCI nº 2) de 23 de octubre de 2024, p.10) y, según Canarias7 (29 de octubre de 2024),
    facturó 9,1 millones al Servicio Canario de Salud. Según Moncloa.com, el Govern balear investigaba cinco contratos
    adjudicados a la empresa por 3,5 millones de euros. No consta que esté imputada ni condenada; rige la presunción
    de inocencia.
