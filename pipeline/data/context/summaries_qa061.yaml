- entity_id: Person:claudio-rodriguez-huaco
  name: Claudio Rodríguez Huaco
  resumen: Claudio Rodríguez Huaco es el presidente ejecutivo (CEO) del Grupo Gloria, conglomerado industrial peruano
    propietario de la cementera boliviana SOBOCE (informe de la UDEF, p.8); según Bloomberg Línea (28-02-2023),
