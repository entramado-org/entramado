- entity_id: Person:raul-medina
  name: Raúl Medina
  resumen: 'Raúl Medina Caballero era director general de Aviación Civil (DGAC), órgano integrado en el Ministerio
    de Transportes, en 2020-2021 (informe UDEF 1908, p.66 y p.115). En el marco del rescate de Plus Ultra firmó
    electrónicamente el 24 de febrero de 2021 el informe de la DGAC «Análisis de la actividad de la compañía aérea
    Plus Ultra», fechado el 18 de febrero de 2021 y hallado entre la documentación requerida a la SEPI (informe
    UDEF 1908, p.115 y p.128); el Consejo de Ministros autorizó el 9 de marzo de 2021 la ayuda de 53 millones de
    euros, articulada en un préstamo participativo de 34 millones y otro ordinario de 19 (auto del caso Plus Ultra,
    p.24). En la comisión de investigación del Congreso, el diputado Hernando García (Grupo Popular) afirmó, citando
    al Tribunal de Cuentas, que al consejo gestor de la SEPI se aportaron dos informes sobre el carácter estratégico
    de la aerolínea, el de AESA y el de la DGAC, y que «el presidente de AESA era el director general de Aviación
    Civil», por lo que «al parecer» ambos los firmó la misma persona (Diario de Sesiones 754, p.12). Su nombre aparece
    además en una conversación del 14 de julio de 2020 en la que Julio Martínez Sola, preguntado por los altos cargos
    del Ministerio que asistirían a una reunión, respondió «puedo imaginar que Raúl Medina, Director General de
    Aviación Civil» (informe UDEF 1908, p.15 y p.66-67). A Medina no se le atribuye participación en la presunta
    trama ni consta imputado o investigado: aparece como alto cargo firmante de un informe oficial. Presunción de
    inocencia plena.'
  sources: []
