- entity_id: Organization:grupo-zapatero
  name: Grupo Zapatero
  resumen: '''Grupo Zapatero'' es la denominación que, según el auto del juez José Luis Calama de 18 de mayo de
    2026 en el caso Plus Ultra, empleaban los propios investigados para referirse a la presunta red de influencia
    liderada por el expresidente José Luis Rodríguez Zapatero: el auto cita la conversación de 4 de julio de 2020
    en la que Julio Martínez Sola informa a Rodolfo Reyes de que «lo tiene Grupo Zapatero desde esta mañana. Ya
    estaban en ello (dicen)», un día después de la creación del Fondo de Apoyo a la Solvencia de Empresas Estratégicas
    (FASEE) (auto, p.59). El magistrado describe una estructura en la que Zapatero «ejerce funciones de dirección
    y control, seguido de Julio Martínez Martínez, quien actúa como lugarteniente principal y figura visible», y
    en la que Manuel Aarón Fajardo es «otro lugarteniente con un ámbito de actuación específico en Venezuela» (auto,
    p.59), situando en un segundo nivel a Fajardo y Martínez Martínez «como personas de confianza e interlocutores
    directos con los clientes» (auto, p.54) y concluyendo que Zapatero «ejerce un liderazgo efectivo sobre una estructura
    diseñada para ejercer influencias ilícitas» (auto, p.61). Se vincula con mercantiles como Análisis Relevante
    SL, sociedad de Martínez Martínez que suscribió con Plus Ultra un contrato de 12 meses por 5.000 euros mensuales
    más IVA (72.600 euros en total) para la entrega de un informe mensual (auto, p.17) y que, según el auto, habría
    abonado a Zapatero 490.780 euros entre 2020 y 2025 (auto, p.49). Es una hipótesis indiciaria de la instrucción:
    rige la presunción de inocencia, no hay condena ni delito declarado probado, y no es una persona jurídica formal
    sino un concepto descriptivo de la causa.'
  sources: []
  updated: '2026-09-15'
  reason: '061 revisión humana T0d 2026-09-15 (Fable, dueño): (cc53a) inciso «contrató a Zapatero como consultor
    y facturó 72.600 € a Plus Ultra» corregido: el contrato es Análisis Relevante–Plus Ultra (auto p.17) y lo abonado
    a Zapatero es 490.780 € (p.49); (d53ec) literales del auto p.54/p.59/p.61 con página; origen del término citado
    de la conversación del 04-07-2020 (p.59).'
- entity_id: Organization:iustitia-europa
  name: Iustitia Europa
  resumen: Iustitia Europa es un partido político español que, según su propia presentación recogida por Moncloa.com
    (19-06-2026), se define como partido «sin ideología y de la sociedad civil», y que actúa principalmente como
    acusación popular en causas de relevancia política. En la causa especial 20775/2020 del Tribunal Supremo (caso
    Koldo/Ábalos) fue tenida por personada como acusación popular por providencia de 3 de diciembre de 2024, junto
    al PP, Vox y otras acusaciones, y se opuso a la unificación de las acusaciones populares que el instructor acordó
    el 11 de diciembre de 2024 (auto del TS de 11-12-2024, p.2-3; sentencia del TS de 22-06-2026, p.4-5). Ejerce
    también la acusación popular en el procedimiento de Badajoz contra David Sánchez —hermano de Pedro Sánchez—
    y Miguel Ángel Gallardo por la contratación del primero en la Diputación de Badajoz, representada por el procurador
    José Miguel Gil Mayoral y defendida por el letrado Luis María Pardo Rodríguez (sentencia de la AP de Badajoz
    de 14-07-2026, p.1 y p.4; escrito de acusación, p.1), y figura como acción popular en la causa contra Begoña
    Gómez (auto del Juzgado de Instrucción nº 41 de Madrid de 23-09-2025, p.1; auto de 20-06-2026, p.1). Según Libertad
    Digital y EFE (vía Infobae), el 23 de julio de 2026 presentó ante el Tribunal de Cuentas una acción de responsabilidad
    contable para que se reintegren las cantidades abonadas por la Diputación de Badajoz a David Sánchez. Su actuación
    es procesal; no consta investigada. Rige la presunción de inocencia respecto de los investigados y acusados
    en dichas causas.
  sources:
  - https://www.moncloa.com/2026/06/19/hazte-oir-iustitia-europa-3386766/
  - https://www.libertaddigital.com/espana/2024-12-11/iustitia-europa-solicita-supremo-presente-acusacion-declaracion-abalos-7197011/
  - https://www.elespanol.com/espana/tribunales/20260604/ultima-hora-judicial-directo-david-sanchez-miguel-angel-gallardo-declaran-acusados-concluir-fase-testifical/1003744273054_10.html
  - https://www.libertaddigital.com/espana/2026-07-23/iustitia-europa-pide-al-tribunal-de-cuentas-que-exija-a-david-sanchez-340-000-euros-de-sus-sueldos-en-badajoz-7439749/
