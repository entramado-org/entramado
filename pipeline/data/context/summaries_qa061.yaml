- entity_id: Person:jesica-rodriguez-garcia
  name: Jesica Rodríguez García
  resumen: 'Jésica Rodríguez García, expareja del exministro de Transportes José Luis Ábalos, es una de las figuras
    del caso Koldo. Trabajó como azafata de imagen y, según declaró, es dentista colegiada. Entre 2019 y 2021 fue
    contratada por las empresas públicas Ineco (dependiente del Ministerio de Transportes) y Tragsatec (del grupo
    Tragsa, dependiente de la SEPI), donde percibió en torno a 43.950 euros (unos 34.450 de Ineco y unos 9.500 de
    Tragsatec) sin desempeñar trabajo alguno: la sentencia del Tribunal Supremo de 22 de junio de 2026 que condenó
    a Ábalos, Koldo García y Víctor de Aldama declaró probado que ''no llegó a desempeñar trabajo o función alguna''
    y que su contratación fue gestionada por indicación directa de Ábalos a través de Koldo García ante la cúpula
    de ADIF; ella misma reconoció ante el Supremo que cobraba sin trabajar (''soy dentista colegiada y era azafata
    de imagen'', dijo). La sentencia condenó a Ábalos y Koldo a indemnizar
    solidariamente a Ineco con los 34.450 euros de su salario (sentencia, p.216); según Público y Libertad Digital,
    ella había declarado en esa causa como testigo (febrero de 2025) y no fue juzgada en ella. Según informaron
    Telemadrid y The Objective, el 3 de julio de 2026 el juez Ismael Moreno (Audiencia Nacional, caso Koldo) la
    citó como investigada —junto a Joseba García Izaguirre, hermano de Koldo, e Ignacio Zaldívar, exdirector de
    Gestión Administrativa de ADIF— por presuntos delitos de tráfico de influencias y malversación; según elDiario.es,
    el 20 de julio se acogió a su derecho a no declarar, y según Infobae (24-07-2026) el juez rechazó el 23 de julio
    el recurso de su defensa y mantuvo su imputación por indicios de malversación, al considerar que el Supremo
    no la juzgó —declaró solo como testigo—, resolución recurrible ante la Sala de lo Penal; según The Objective
    (26-08-2026), la Fiscalía Anticorrupción se opuso a su recurso de apelación. Según la UCO, Víctor de Aldama
    pagó a través de su socio Alberto Escolano el alquiler de su piso en la Torre de Madrid (Plaza de España): 2.700
    euros mensuales entre marzo de 2019 y septiembre de 2021, 82.295 euros en total según los hechos probados de
    la sentencia del Supremo (p.29; decomiso, p.216). Rige plenamente la presunción de inocencia: la imputación
    es una instrucción en curso, no una condena.'
