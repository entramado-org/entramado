- entity_id: Company:ute-motril-sur
  name: UTE Motril Sur
  resumen: '''Motril Sur'' (con el ''369'' añadido como artefacto del OCR del folio) alude a una obra o unión temporal
    de empresas del sector de áridos vinculada a Áridos Anfersa SL en la provincia de Granada, en el marco de la
    ramificación granadina de la causa Koldo. Según COPE (06-03-2024) y El Independiente de Granada (05-03-2024),
    que se hacen eco del informe de la UCO publicado por El Español, la Guardia Civil examina contratos públicos
    obtenidos por Áridos Anfersa (con ADIF y con el Ayuntamiento de Motril, incluida la Ronda Sur de Motril); el
    propio informe de la UCO recoge el alta laboral de Patricia Úriz, entonces mujer de Koldo García, en dicha empresa
    el 13 de julio de 2022 y sitúa esos pagos entre las posibles contraprestaciones percibidas por el entorno de
    Koldo (informe UCO, p.16 y pp.233-235). No es una causa judicial autónoma, sino una referencia documental dentro
    de la investigación. Las fuentes citadas no establecen la situación procesal de cada persona o empresa
    mencionada; rige plenamente la presunción de inocencia.'
  sources:
  - https://www.cope.es/emisoras/andalucia/granada-provincia/motril/noticias/motril-aparece-caso-koldo-por-contrato-con-aridos-anfersa-una-empresa-granadina-20240306_3181829
  - https://www.elindependientedegranada.es/politica/uco-investiga-contrato-mujer-koldo-garcia-con-empresa-granada
  - https://www.infobae.com/espana/agencias/2025/06/12/la-uco-dice-que-koldo-logro-que-empresas-de-la-presunta-trama-les-contrataran-a-el-y-su-mujer-como-contraprestacion/
  updated: '2026-10-03'
  reason: '063 tramo 6 (2026-10-03): La unidad atribuía la información a «información periodística» de forma genérica.
    Se añaden los medios con su fecha y la cita del informe de la UCO con página, y «expareja» pasa a «entonces
    mujer», como figura en el corpus. Se retira la frase que daba a «las personas y empresas implicadas» por
    «investigadas y no condenadas» en bloque: ni el informe de la UCO (pp.16 y 233-235) ni COPE respaldan ese estado
    procesal para cada una (revisión Codex del PR #86).'
