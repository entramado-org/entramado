- entity_id: Person:pedro-saura
  name: Pedro Saura
  resumen: 'Pedro Saura García (Torre-Pacheco, 1962) es, según Wikipedia, economista, profesor titular de la Universidad
    de Murcia y político del PSOE; fue secretario general del PSRM-PSOE (2004-2012) y diputado por Murcia hasta
    su renuncia al escaño en febrero de 2020. Fue secretario de Estado de Infraestructuras, Transporte y Vivienda
    —número dos de José Luis Ábalos— entre 2018 y 2021, y posteriormente presidió Paradores (2021-2023) y, desde
    diciembre de 2023, la sociedad estatal Correos. Su nombre ha aparecido en relación con estas causas por su cargo
    en Transportes: según El Español (16-10-2024), el PP de Murcia le pidió «explicaciones» «por su presunta vinculación»
    con el caso Koldo; y en el caso Plus Ultra, el auto de 18 de mayo de 2026 (p.16) recoge mensajes de julio de
    2020 entre directivos de la aerolínea sobre una reunión con él, como secretario de Estado de Transportes, prevista
    para el 22 de julio de 2020. A partir de las fuentes públicas no consta que esté imputado ni condenado, por
    lo que rige plenamente la presunción de inocencia.'
