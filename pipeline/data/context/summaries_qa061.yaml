- entity_id: Organization:asociacion-de-abogados-del-estado
  name: Asociación de Abogados del Estado
  resumen: 'La Asociación de Abogados del Estado es una asociación profesional del cuerpo de abogados del Estado.
    En la causa de Begoña Gómez (Juzgado/Sección de Instrucción nº 41 de Madrid, juez Juan Carlos Peinado) emitió,
    a requerimiento judicial, un informe en el que analiza la normativa de contratación pública aplicable a la elaboración
    y redacción de pliegos; el informe se incorporó a las actuaciones dentro de la investigación del presunto intrusismo
    profesional vinculado a la firma de documentos técnicos de contratación (auto de 20 de junio de 2026, p.49).
    Según Libertad Digital (08-12-2025), Peinado se lo había pedido a la asociación y el escrito se remitió al juzgado
    el 2 de diciembre de 2025. Según el mismo auto (p.49) y Libertad Digital (08-12-2025), el informe concluyó que
    la normativa de contratación pública no reserva esa función a un cuerpo concreto ni exige una titulación específica,
    de modo que, según Libertad Digital, Gómez podría firmar pliegos sin titulación, correspondiendo a la entidad
    pública (la UCM) aprobarlos. El intrusismo figura entre los delitos del procedimiento en el auto de 11 de abril
    de 2026 (p.1), pero ya no figura entre los delitos del encabezamiento del auto de 20 de junio de 2026 (p.1).
    El asunto generó un cisma interno en la abogacía del Estado: según Vozpópuli (19-12-2025), la ''Asociación de
    Abogados del Estado por el Estado de Derecho'' es una asociación distinta, presidida por Francisco Espinosa,
    que se desmarcó públicamente del contenido de ese informe. Rige la presunción de inocencia respecto de Begoña
    Gómez.'
  sources:
  - https://www.libertaddigital.com/espana/2025-12-08/la-asociacion-de-abogados-del-estado-informa-a-peinado-de-que-begona-podia-firmar-pliegos-sin-titulacion-7330466/
