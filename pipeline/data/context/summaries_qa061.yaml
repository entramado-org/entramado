    Manos Limpias y ADADE, y el instructor Leopoldo Puente, por auto de 11 de diciembre de 2024, unificó todas las
    acusaciones populares bajo una sola representación procesal pese a la oposición de HazteOír (auto del TS de
    11-12-2024, p.2; sentencia del TS de 22-06-2026, p.4-5); según El Independiente (05-04-2026), esa dirección
    letrada unificada la ostenta el PP. En la causa contra el fiscal general Álvaro García Ortiz fue tenida por
    parte como acusación popular por providencia de 10 de abril de 2025, unificada por auto de 12 de mayo de 2025
    con la Fundación Foro Libertad y Alternativa y después con Vox, y formuló acusación por revelación de secretos
    (sentencia del TS, p.5 y p.10). Consta asimismo como acción popular en la causa contra Begoña Gómez (auto del
    Juzgado de Instrucción nº 41 de Madrid de 23-09-2025, p.1) —donde, según Libertad Digital (30-07-2026), rebajó
    de 24 a 13 años su petición de prisión para Gómez y, según Infobae (08-09-2026), dirige la acusación popular—
    y entre las acusaciones del juicio de Badajoz contra David Sánchez y Miguel Ángel Gallardo (sentencia de la
    AP de Badajoz de 14-07-2026, p.1). En el caso Plus Ultra, según Estrella Digital (23-05-2026), el juez Calama
    la admitió como acusación popular junto al PP y Vox y abrió el 22 de mayo de 2026 un trámite de alegaciones
    sobre la conveniencia de agrupar las acusaciones populares, sin haberlo acordado todavía. Su papel es estrictamente
    procesal —ejercer la acción popular—, no el de investigada.
