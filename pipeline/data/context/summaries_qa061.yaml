- entity_id: Company:globalia
  name: Globalia
  resumen: 'Globalia (Globalia Corporación Empresarial S.A.) es un grupo turístico español de la familia Hidalgo,
    presidido por su fundador Juan José Hidalgo y matriz de la aerolínea Air Europa y de Halcón Viajes (según Wikipedia;
    calificación de la Fiscalía, p.11; informe de la Guardia Civil, p.49); su hijo Javier Hidalgo fue consejero
    delegado del grupo (calificación de la Fiscalía, p.11). En noviembre de 2020 Air Europa recibió un rescate de
    475 millones de euros del fondo de la SEPI (FASEE). La compañía ha reconocido que el empresario Víctor de Aldama
    tuvo relación con el grupo en torno a ese rescate — según la sentencia del Tribunal Supremo de 22-06-2026, Aldama
    percibía 12.100 euros mensuales, de noviembre de 2019 a noviembre de 2020, a través de Globalia Corporación
    S.A., accionista único de la aerolínea —. Según Público (21-04-2026), las empresarias Leonor y Carmen Pano afirmaron
    que Juan José Hidalgo entregó 500.000 euros a Aldama y Koldo García por el rescate, lo que Javier Hidalgo negó
    al declarar como testigo ante el Tribunal Supremo el 21 de abril de 2026, donde también negó haber autorizado
    la puesta a disposición de Ábalos de una casa en Marbella; la sentencia recoge además que Koldo García declaró
    que Hidalgo le había dicho que no tenía intención de pagar comisión alguna (sentencia TS 22-06-2026, p.138).
    La antigua filial de agencia de viajes del grupo, Globalia Corporate Travel S.L.U. (NIF B57986846, hoy Sekai
    Corporate Travel y fuera del perímetro de Globalia desde 2020-21), tiene ficha propia en esta base: la contratación
    pública que acumula es suya, no del grupo. Rige la presunción de inocencia: ni Globalia ni sus directivos han
    sido condenados y los hechos del rescate están bajo investigación en el marco del caso Koldo.'
