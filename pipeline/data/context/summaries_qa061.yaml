- entity_id: Person:jose-luis-abalos
  name: José Luis Ábalos
  resumen: José Luis Ábalos Meco fue ministro de los dos primeros Gobiernos de Pedro Sánchez —de Fomento (2018-2020)
    y, tras la reestructuración, de Transportes, Movilidad y Agenda Urbana (enero de 2020 a julio de 2021)— y número
    tres del PSOE como secretario de Organización (2017-2021). En el marco del "caso Koldo" se le atribuyó participación
    en una trama de comisiones irregulares ligadas a contratos públicos, en particular la compra de mascarillas
    durante la pandemia, siendo Koldo García su exasesor. Por su condición de aforado como diputado, la causa se
    instruyó y enjuició en instancia única ante el Tribunal Supremo (instructor Leopoldo Puente; juicio ante la
    Sala Segunda presidida por Andrés Martínez Arrieta, abril-mayo de 2026), y el 27 de noviembre de 2025 ingresó
    en prisión provisional sin fianza, el primer diputado nacional en ejercicio en ingresar en prisión, según The
    Objective y El Independiente (27-nov-2025). El 22 de junio de 2026 la Sala Segunda dictó la sentencia núm. 418/2026
    (Causa Especial 20775/2020), que lo CONDENA como autor de un delito de pertenencia a organización criminal (art.
    570 bis CP), cohecho (continuado y varios), tráfico de influencias y malversación de caudales públicos, con
    penas de prisión e inhabilitación, y lo ABSUELVE de los delitos de prevaricación, uso de información privilegiada
    y falsedad de los que también venía acusado. En concepto de responsabilidad civil, junto a Koldo García debe
    indemnizar a INECO (34.450 €) y a TRAGSATEC (9.500,54 €), y el decomiso de 430.298 € de ganancias del cohecho
    se acuerda respecto de los tres condenados (Ábalos, García y Aldama). Al haberse juzgado en instancia única
    ante el Supremo, la sentencia es firme; cabe recurso de amparo ante el Tribunal Constitucional por eventual
    vulneración de derechos fundamentales.
  sources:
