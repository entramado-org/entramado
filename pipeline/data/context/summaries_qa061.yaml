- entity_id: Court:tribunal-de-instancia-de-madrid
  name: Tribunal de Instancia de Madrid
  updated: '2026-09-09'
  resumen: 'El Tribunal de Instancia de Madrid es el órgano judicial colegiado que, en virtud de la reforma
    de la Ley Orgánica 1/2025 de eficiencia del Servicio Público de Justicia, sustituye a los antiguos
    juzgados unipersonales en el partido judicial de Madrid; según la comunicación del Decanato de Madrid
    recogida por el ICAM, su entrada en funcionamiento (Fase III) está fijada para el 31 de diciembre
    de 2025. Las antiguas plazas de instrucción pasan a integrarse como Secciones de Instrucción dentro
    de ese tribunal. Aparece como cabecera de actuaciones de varias causas: la Sección de Instrucción
    plaza nº 41 se corresponde con el antiguo Juzgado de Instrucción nº 41 (juez Juan Carlos Peinado),
    que instruye el caso de Begoña Gómez, y la plaza nº 15 figura en el auto sobre las joyas relacionado
    con la causa de José Luis Rodríguez Zapatero. Es una estructura judicial real y vigente, no un imputado.'
  sources:
  - https://web.icam.es/implantacion-de-los-tribunales-de-instancia-en-el-partido-judicial-de-madrid-fase-iii/
  - https://www.elnotario.es/index.php/opinion/opinion/13626-ley-organica-1-2025-de-2-de-enero-los-tribunales-de-instancia
  - https://www.boe.es/diario_boe/txt.php?id=BOE-A-2025-76
  reason: 'spec 061 L7: retirada la frase de meta-texto sobre el nodo/grafo; contenido factual sin cambios'
