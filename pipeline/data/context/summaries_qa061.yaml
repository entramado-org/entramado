- entity_id: Organization:acusacion-popular
  name: Acusación Popular
  resumen: 'La ''Acusación Popular'' (y la ''Acusación Popular Unificada'') no es una organización concreta sino
    una figura procesal del Derecho español que permite a cualquier ciudadano o entidad personarse como parte acusadora
    en causas penales, al amparo del art. 125 de la Constitución y la LECrim. En las causas de los documentos analizados la ejercen
    distintos partidos y asociaciones, agrupados bajo una sola representación (art. 109 bis LECrim): en la Causa
    Especial 20775/2020 del Tribunal Supremo se personaron como acusación popular el Partido Popular, Vox, Hazteoir.org,
    Liberum, el sindicato Manos Limpias y la Asociación de Abogados Demócratas por Europa (auto de 2 de diciembre
    de 2024, p.11) y después Iustitia Europa (ATS 15039/2024, p.2), y el instructor dio traslado de la causa «a
    la representación de las acusaciones populares» (ATS 10788/2025, p.1); en el procedimiento contra Begoña Gómez
    (Tribunal del Jurado 1146/2024, Juzgado de Instrucción nº 41 de Madrid) actúa una «acusación popular unificada»
    (auto de 11 de abril de 2026, p.2) en la que figuran, entre otros, Hazteoir.org, Iustitia Europa, Vox y Manos
    Limpias (auto de 23 de septiembre de 2025, p.1); y en la causa de Badajoz contra David Sánchez y Miguel Ángel
    Gallardo la dirigió Manos Limpias en nombre de Hazte Oír, Abogados Cristianos, Liberum, Iustitia Europa y Vox
    (escrito de acusación, p.1).'
