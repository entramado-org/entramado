- entity_id: Organization:administrador-de-infraestructuras-ferroviarias
  name: Administrador de Infraestructuras Ferroviarias
  resumen: 'El Administrador de Infraestructuras Ferroviarias (ADIF) es la entidad pública empresarial que gestiona
    la infraestructura ferroviaria en España. En esta base aparece en el marco del caso Koldo: en marzo de 2020 ADIF
    contrató el suministro de 5.000.000 de mascarillas FFP2 por un importe de adjudicación de 12.500.000 euros a
    Soluciones de Gestión y Apoyo a Empresas S.L. (informe de auditoría del Ministerio de Transportes de 19-08-2024,
    p.68), empresa para la que Koldo García actuó como intermediario, cuando José Luis Ábalos era ministro de Transportes.
    ADIF figura como entidad contratante/receptora dentro del expediente, no como investigada; las personas físicas
    mencionadas están sujetas a la presunción de inocencia en la causa abierta (caso Koldo).'
