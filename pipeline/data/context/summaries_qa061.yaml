- entity_id: Person:elisa-moriano-morales
  name: Elisa Moriano Morales
  resumen: 'Elisa Moriano Morales fue directora del Área de Cultura y Acción Ciudadana de la Diputación de Badajoz
    durante la presidencia de Miguel Ángel Gallardo (en el cargo en 2016-2017 según la sentencia 152/2026, pp.6
    y 163), a quien Libertad Digital (10-12-2024) la describe como «mano derecha». El 14 de julio de 2026, la Audiencia
    Provincial de Badajoz la condenó (sentencia 152/2026) como cooperadora necesaria de un delito de prevaricación
    administrativa (Bloque A: la creación en 2016 del puesto de coordinador de los conservatorios para David Sánchez)
    a 9 años de inhabilitación especial, y la absolvió del resto. El tribunal declara probado que decidió la creación
    del puesto junto a Gallardo y la diputada Cristina Núñez, firmó la propuesta de la RPT, atribuyó falsamente
    la propuesta al director del Conservatorio Superior ante la mesa de negociación y formó parte de la comisión
    asesora que fijó criterios a la medida de David Sánchez. Se trata de una condena no firme: cabe apelación ante
    el TSJ de Extremadura y rige la presunción de inocencia hasta la firmeza.'
