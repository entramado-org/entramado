    (08-12-2025) y había retirado el paréntesis del alias. Cambios del árbitro: «requisitos académicos y profesionales»
    y «pieza por presunta intrusión profesional» no constan en las fuentes → descripción del auto de 20-06-2026
    p.49; fecha de remisión (LD); el intrusismo sale del encabezamiento de delitos entre el auto de 11-04-2026 (p.1)
    y el de 20-06-2026 (p.1). Se conservan del vigente la conclusión favorable a Gómez (ahora también con la cita
    del auto p.49: «no establece una reserva estricta de dicha función a un cuerpo concreto de funcionarios ni exige
    una titulación específica»), la frase del cisma, atribuida a Vozpópuli (19-12-2025, verificado: «presidida por
    Francisco Espinosa Fernández … desmarcándose del contenido»), y la fuente de The Objective. «investigada en
    una causa abierta» se retira por desfasado (auto de apertura de juicio oral de 20-06-2026); queda la presunción
    de inocencia.'
