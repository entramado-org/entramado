- entity_id: Person:patricia-uriz
  name: Patricia Úriz
  resumen: 'Los documentos judiciales se refieren a Patricia Úriz Iriarte como esposa de Koldo García Izaguirre,
    exasesor de José Luis Ábalos, al relatar los hechos que investigan (auto del Tribunal
    Supremo EN0E47_3, p.9; informe 96/2025 de la UCO, p.16; sentencia del Tribunal Supremo de 22 de junio de 2026,
    p.42); Okdiario (12-06-2025) la describe como su expareja. Fue vocal de Bienestar Social
    en la ejecutiva del PSN y, a principios de 2020, fue contratada como ayudante de secretaria (apoyo en la secretaría,
    nivel 17) en el Ministerio de Transportes que dirigía Ábalos, sin experiencia previa en el área (Okdiario, 25-02-2020;
    Moncloa.com, 23-02-2024; Diario de Sesiones del Senado DS_C_15_103, p.32). Según El Español (22-02-2024), fue
    detenida por la Guardia Civil en febrero de 2024 en la Operación Delorme sobre la presunta trama de las mascarillas
    y puesta en libertad con cargos, atribuyéndosele presuntos delitos de tráfico de influencias, cohecho y pertenencia
    a organización criminal. Está investigada en el procedimiento 65/2023 del Juzgado Central de Instrucción nº
    2 de la Audiencia Nacional (caso Koldo): la exposición razonada de 23 de octubre de 2024 la incluye entre quienes
    «formarían parte de la organización investigada» (p.1), y la sentencia del Tribunal Supremo de 22 de junio de
    2026 describe esa causa, dirigida entre otros contra ella, como seguida por posibles delitos de pertenencia
    a organización criminal, blanqueo de capitales, cohecho, tráfico de influencias y contra la Hacienda Pública
    (p.3). El informe 96/2025 de la UCO documenta su contratación por Áridos Anfersa SL, sociedad que la UCO vincula
    a OPR, con alta desde el 13 de julio de 2022 y al menos 13.796,77 euros netos cobrados como «nómina» entre agosto
    de 2022 y junio de 2023, que la UCO enmarca como pagos de OPR «al entorno de Koldo» (pp.16 y 233-234). Es administradora
    única de Erikapat Consultoría Internacional SL desde el 31 de marzo de 2022 (Moncloa.com, 23-02-2024), sociedad
    de la que posee el 99,97% del capital según Okdiario (12-06-2025) y a través de la cual, según el escrito de
    la defensa de Víctor de Aldama (p.23), el Grupo Azvi contrató a Koldo García en 2023 como asesor. Rige la presunción
    de inocencia: las imputaciones proceden de la fase de investigación y no hay sentencia respecto a ella.'
  sources:
