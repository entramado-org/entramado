- entity_id: Person:joseba-garcia-izaguirre
  name: Joseba García Izaguirre
  resumen: Joseba García Izaguirre es hermano de Koldo García, el exasesor del exministro José Luis Ábalos (calificación
    fiscal, p.6). Según El Español (21-02-2024), fue uno de los detenidos el 21 de febrero de 2024 en la Operación
    Delorme de la Guardia Civil sobre la presunta trama de comisiones por contratos públicos durante la pandemia;
    trabajaba entonces en Emfesa, empresa pública dependiente del Ministerio de Transportes y filial de Adif (Diario
    de Sesiones del Senado, comisión de investigación, p.29), a la que había llegado en febrero de 2022 procedente
    de Ineco, donde desde 2019 tuvo un contrato temporal de asistencia técnica a Adif (según The Objective, 05-06-2024).
    Los informes de la UCO citados en la instrucción describen «una operativa que permitiría que fondos obtenidos
    a través de don Joseba García Izaguirre acabaran en las cuentas bancarias de don Koldo García Izaguirre y/o
    su núcleo familiar» (auto sobre el móvil de Aldama, p.15); según The Objective (05-06-2024), la querella de
    la Fiscalía Anticorrupción sostiene que Koldo habría utilizado a su hermano para ocultar «la titularidad real
    de algunos inmuebles» y los investigadores detectaron traspasos por 97.404 euros desde las cuentas de Joseba
    a las de Koldo, y según okdiario (23-05-2025) la UCO señala una finca en Polop de la Marina (Alicante) valorada
    en 251.257 euros que figura a nombre del hermano pero sería utilizada por Koldo. Su defensa presentó al juez
    un informe en el que sostiene que no ocultó patrimonio y que la casa de Polop se compró el 18 de diciembre de
    2020 por 225.000 euros con hipoteca (según okdiario, 07-11-2024). El 3 de julio de 2026 el juez Ismael Moreno
    (Audiencia Nacional) lo citó como investigado, junto a Jésica Rodríguez e Ignacio Zaldívar, por presuntos delitos
    de malversación y tráfico de influencias en la contratación de Rodríguez en Ineco y Tragsatec (según Infobae, 03-07-2026; según el escrito de la Fiscalía recogido por Libertad Digital, 03-07-2026, en su caso únicamente por la contratación en Ineco), y el 20 de julio se acogió a su derecho a no declarar (según elDiario.es, 20-07-2026). Es investigado
    en una instrucción en curso; rige plenamente la presunción de inocencia y no consta condena.
