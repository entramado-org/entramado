- entity_id: Organization:oficialia-mayor
  name: Oficialía Mayor
  resumen: 'La Oficialía Mayor es la unidad de un ministerio responsable de los servicios comunes, el régimen interior
    y la gestión de medios materiales. En la causa del ''caso Koldo'' aparece porque en dependencias del entonces
    Ministerio de Transportes se almacenaron mascarillas vinculadas a los contratos de emergencia que se investigan:
    el entonces asesor del ministro, Koldo García, llevó unas 25.000 al Ministerio, que «se guardaron en un almacén
    de la oficialía mayor», según declaró el ex director general de Organización e Inspección Javier Sánchez Fuentefría
    ante el Senado (DS_C_15_233, 14-11-2024, p.23), «sin que quedara constancia alguna más allá del conocimiento
    oficioso por parte de la Oficialía Mayor y del entonces DGOI» (informe de auditoría del Ministerio de 19 de
    agosto de 2024, p.78; Confilegal, 09-01-2025). Esa auditoría, ordenada por el ministro Óscar Puente el 27 de
    febrero de 2024, destacó «la falta de control inicial de mascarillas en el Ministerio» (informe, p.78) y cifró
    en 238.840 las mascarillas que seguían en el sótano del Ministerio y en unas 206.000 las del almacén de Azuqueca
    de Henares (informe, p.50). Según Confilegal (agencias, 09-01-2025), el Ministerio cesó al oficial mayor que
    en 2020 era responsable del área encargada del control de esas mascarillas; fuentes ministeriales fecharon el
    cese el 12 de diciembre de 2024 y negaron conocer sus motivos. Es un órgano administrativo, no una persona ni
    un investigado, citado por su papel logístico en los hechos.'
  sources:
  - https://confilegal.com/20250109-transportes-cesa-al-responsable-de-controlar-las-mascarillas-cuya-compra-investiga-la-justicia-en-el-caso-koldo/
