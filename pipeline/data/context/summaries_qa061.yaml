- entity_id: LegalCase:pieza-separada-62-2025
  name: Pieza Separada 62/2025
  resumen: 'La Pieza Separada 62/2025 es la pieza dimanante de las Diligencias Previas 597/2021 de la Sección de
    Instrucción del Tribunal de Instancia de Madrid (plaza nº 15) en la que se investigaba el presunto tráfico de
    influencias en torno al rescate de 53 millones de euros concedido por la SEPI a la aerolínea Plus Ultra durante
    la pandemia (auto de 18 de mayo de 2026, p.24 y p.28). Por auto de 23 de febrero de 2026 ese juzgado acordó
    inhibirse en favor de la Sección de Instrucción del Tribunal Central de Instancia (plaza nº 2, Audiencia Nacional),
    que aceptó la inhibición por auto de 3 de marzo de 2026 e integró la pieza en sus Diligencias Previas 77/2024,
    seguidas por presuntos delitos de pertenencia a organización criminal, tráfico de influencias, apropiación indebida,
    falsedad documental y blanqueo de capitales (auto de 18 de mayo de 2026, p.1 y p.4; informe UDEF 1907/2026,
    p.7). En esas diligencias, el auto de 18 de mayo de 2026, firmado por el juez José Luis Calama (p.35), autorizó
    entradas y registros el 19 de mayo de 2026, acordó comunicar las actuaciones al expresidente José Luis Rodríguez
    Zapatero para que se personara como investigado y señaló su declaración en esa condición para el 2 de junio
    de 2026 (p.2), describiéndolo como «núcleo decisor y estratégico de la red» (p.58). Rige la presunción de inocencia:
    causa abierta sin delito declarado probado.'
