# Retiradas y correcciones de PROSA curada de la auditoría dual (spec 061).
#
# Lo llena `make qa-dual-patches` desde los defectos con parche acordado por los dos
# lectores (Fable + Astra) y lo revisa un humano ANTES de aplicarlo. Se carga EL
# ÚLTIMO del overlay de contexto (los `*_qa061.yaml` van al final), así que pisa a
# `summaries.yaml` para una misma entidad.
#
# Dos formas por entrada:
#   - entity_id: Person:...        # corrección: sustituye el resumen publicado
#     resumen: |
#       …
#     sources: [https://…]
#     updated: 'YYYY-MM-DD'
#   - entity_id: Person:...        # retirada: borra summary/summary_sources/summary_updated
#     remove: true
# Declarar `remove: true` junto a un `resumen` no vacío aborta la carga.
#
# NUNCA se aplica al grafo vivo: Path A (efímero sobre el seed → `make context` →
# diff-gate → re-tar → bump del seed).

