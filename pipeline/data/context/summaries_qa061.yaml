- entity_id: Person:fernando-grande-marlaska
  name: Fernando Grande-Marlaska
  resumen: 'Ministro del Interior desde 2018 en los gobiernos de Pedro Sánchez y juez de carrera: «he estado treinta
    años y me he tomado muy en serio el trabajo de juez, y muchos años de juez de instrucción», dijo ante la comisión
    de investigación (DS_C_15_745, p.87). Compareció ante la comisión Koldo del Senado el 30-jun-2026, en relación
    con las reuniones de la entonces directora de la Guardia Civil, Mercedes González, con la exmilitante socialista
    Leire Díez. Declaró que González le informó de que una persona buscaba la ''rehabilitación'' del comandante
    Rubén Villalba, investigado en el caso Koldo, aunque dijo no recordar si le mencionó el nombre de Díez o solo
    ''una persona del PSOE''. Aseguró no conocer a Leire Díez ni haber hablado con ella, negó que en esos encuentros
    se hablara de trama alguna contra la UCO y expresó su confianza en González. No consta que esté investigado
    en ninguna de las causas.'
