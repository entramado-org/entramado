- entity_id: Person:juan-carlos-peinado-garcia
  name: Juan Carlos Peinado García
  resumen: Juan Carlos Peinado García fue el magistrado titular del Juzgado de Instrucción n.º 41 de Madrid (después
    Sección de Instrucción del Tribunal de Instancia de Madrid, plaza n.º 41) e instructor de la causa contra Begoña
    Gómez, esposa del presidente Pedro Sánchez. Incoó las diligencias en 2024 y a lo largo de 2025-2026 acordó transformar
    el procedimiento para juzgarla ante un Tribunal del Jurado; entonces se le atribuían, entre otros, malversación,
    corrupción en los negocios, tráfico de influencias y apropiación indebida. En una providencia conocida el 19 de junio
    de 2026 abrió una pieza separada por presuntos delitos de prevaricación y fraude a los intereses financieros de la
    Unión Europea en relación con un contrato de Red.es de unos 4 millones de euros adjudicado a una UTE de Innova Next
    —empresa de Juan Carlos Barrabés— y KPMG, financiado con fondos europeos, y pidió a la Fiscalía un informe sobre
    la tipicidad de los hechos (según COPE y El Español, 19-06-2026); según COPE, la Fiscalía Europea había reclamado
    ese expediente tras un informe de la UCO, pero el juez de garantías de la Audiencia Nacional resolvió, a instancia
    de la defensa de Barrabés, que recayera en el juzgado de Peinado. Según Infobae (19-06-2026), una providencia posterior
    del juzgado aclaró que la pieza afecta únicamente a Barrabés y no a Gómez ni a su asesora Cristina Álvarez. Según
    Europa Press (vía The Objective, 04-08-2026), Peinado acordó en agosto remitir esa pieza a la Fiscalía Europea, que
    investiga otros contratos de Red.es con participación de Barrabés, y archivar las actuaciones «sin más trámite»,
    tras apartar la Audiencia Provincial de Madrid a Barrabés del juicio con jurado. El 21 de septiembre de 2026 dictó
    auto de apertura de juicio oral contra Begoña Gómez por tráfico de influencias y malversación, y contra Cristina
    Álvarez solo por malversación; el mismo auto recoge que la Audiencia Provincial de Madrid (auto 655/2026, de 13 de
    julio) sobreseyó para todos el delito de corrupción en los negocios y descartó la apropiación indebida y la administración
    desleal [auto-peinado-juicio-oral-begona-2026-09-21.pdf, p.65]. Según el BOE (BOE-A-2026-19944), el CGPJ declaró
    su jubilación forzosa por edad con efectos de 27 de septiembre de 2026. Las personas acusadas gozan de presunción
    de inocencia.
