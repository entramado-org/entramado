- entity_id: Person:teofilo-serrano
  name: Teofilo Serrano
  resumen: 'Teófilo Serrano (Tudela, Navarra; fallecido el 3 de agosto de 2024 a los 74 años, según EFE vía elDiario.es,
    03-08-2024) fue ingeniero de Caminos, Canales y Puertos y funcionario del Estado. Según la misma necrológica,
    durante los Gobiernos de Felipe González fue secretario de Estado para la Administración Pública; fue también
    director general del Instituto Geográfico Nacional, presidente de Renfe (2009-2011), senador por designación
    autonómica (1991-1994) y secretario general de la Federación Socialista Madrileña del PSOE desde 1991. Aparece
    mencionado en el informe de la UCO sobre Santos Cerdán a propósito de nombramientos tras la moción de censura
    de 2018: el 18 de junio de 2018 Cerdán escribió a Koldo García «Que no se le ocurra poner en Adif a Teofilo
    Serrano. Es de Navarra mal tío y tengo muy mala información de él» (informe UCO 96/2025, folio 279; recogido
    en el auto de prisión del Tribunal Supremo de 30 de junio de 2025, p.12), y, según Infobae (18-11-2025), Serrano
    no obtuvo ningún puesto. Su papel es el de persona mencionada en esos repartos de cargos, con plena presunción
    de inocencia y sin que se le atribuya delito.'
