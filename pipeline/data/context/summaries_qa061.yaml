- entity_id: Person:ignacio-espejo-saavedra-hernandez
  name: Ignacio Espejo-Saavedra Hernández
  resumen: Ignacio Espejo-Saavedra Hernández desarrolla su carrera en Red.es desde 2005, donde ha sido abogado,
    subdirector de la Asesoría Jurídica (desde 2009), vicesecretario general y del Consejo y, desde 2022, director
    adjunto de la Asesoría Jurídica, según la propia web de Red.es. Según el informe de la UCO de 14 de mayo de
    2024 (atestado 95/2024, Diligencias Previas 1146/2024 del Juzgado de Instrucción nº 41 de Madrid, caso Begoña
    Gómez), presidió, como subdirector de la Asesoría Jurídica, todas las sesiones de las mesas de contratación
    de los expedientes 044/20-ED, 014/20-ED y 016/20-ED de Red.es (informe UCO, pp.86-113), adjudicados en 2021
    a la UTE KPMG-Innova Next (2.149.200 euros sin IVA, 18 de marzo de 2021; p.90) y a la UTE Innova Next-The Valley
    Digital Business School (lotes 1 y 3 del 014/20-ED por 4.821.639,69 euros y lote 1 del 016/20-ED por 3.636.363,64
    euros, sin IVA, 30 de julio de 2021; pp.100 y 110). En el lote 1 del 014/20-ED la mesa elevó al órgano de contratación
    como mejor valorada la oferta de esa UTE «pese a que no presenta la mejor oferta económica» (informe UCO, pp.99-100).
    Un informe pericial de la IGAE elaborado para la Fiscalía Europea sostiene que esas adjudicaciones pudieron
    incurrir en «fraude de ley», según El Español (29-09-2025) y The Objective (14-04-2026). La Fiscalía Europea
    tiene imputados a Juan Carlos Barrabés y al director de Economía Digital de Red.es, Luis Prieto Cuerdo, según
    El Independiente (01-10-2025); no consta que Espejo-Saavedra esté investigado ni imputado, y rige la presunción
    de inocencia.
