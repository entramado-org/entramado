- entity_id: Organization:autoridad-de-auditoria
  name: Autoridad de Auditoría
  resumen: 'En esta base, ''Autoridad de Auditoría'' designa de forma genérica la auditoría interna del Ministerio
    de Transportes y Movilidad Sostenible sobre los expedientes de adquisición de mascarillas durante la pandemia:
    por Orden de 27 de febrero de 2024 el ministro Óscar Puente mandató a la Dirección General de Organización e
    Inspección del Departamento llevarla a cabo, y el 11 de julio de 2024 emitieron su informe las dos inspectoras
    de servicios designadas (informe de auditoría de 19-08-2024, p.3-4 y p.14), identificadas por El Independiente
    (23-04-2026) como Sara Anguita y Ana Balbás, que ratificaron el informe como testigos ante el Tribunal Supremo
    en el juicio del caso mascarillas. La auditoría examinó las actuaciones de Puertos del Estado y ADIF en los
    contratos con Soluciones de Gestión, con acceso a la documentación administrativa, a los correos electrónicos
    corporativos y a las declaraciones de empleados públicos y autoridades (informe, p.6); según El Independiente
    (05-04-2026), las compras bajo sospecha superan los 36 millones de euros (unos 24 millones de Puertos del Estado
    y 12,5 millones de ADIF). Entre sus observaciones, el informe recoge que la responsable de Soluciones de Gestión
    pidió a ADIF los datos de facturación «para preparar la oferta» a las 13:26 h del 26 de marzo de 2020, antes
    de que el secretario general de Puertos del Estado remitiera esa oferta a ADIF a las 14:30 h (informe, p.59),
    y que el 20 de marzo de 2020 el secretario general de Puertos del Estado envió a la empresa los datos de facturación
    y la instrucción de adquisición antes de que constara firmada la segunda orden ministerial (informe, p.39);
    según El Independiente (23-04-2026), la inspectora Anguita declaró ante el Supremo que «era evidente que alguien
    se lo estaba comunicando». No es una ''Autoridad de Auditoría'' formal de fondos europeos, sino la actuación
    inspectora interna del Ministerio.'
