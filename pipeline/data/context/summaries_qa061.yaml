- entity_id: Person:felicia-appenteng
  name: Felicia Appenteng
  resumen: Felicia Appenteng, a la que Moncloa.com (14-09-2024) describe como empresaria ghanesa-estadounidense,
    es la presidenta fundadora (founding Chair) del IE Africa Center de la IE University, según la web institucional
    del IE; según Moncloa.com, en 2018 era directora de la Fundación IE en Nueva York. Begoña Gómez, esposa del
    presidente del Gobierno Pedro Sánchez, fue nombrada directora ejecutiva del Africa Center en agosto de 2018
    y ocupó el cargo hasta junio de 2022 (informe de la UCO de 14 de mayo de 2024, p.45). Según las propias notas
    de prensa de la IE University, Appenteng y Gómez (Chair y Executive Director del centro) se reunieron durante
    FITUR 2020 en Madrid con el consejero delegado de Globalia, Javier Hidalgo, para tratar la colaboración entre
    ambas instituciones. No consta que Appenteng esté imputada en la causa instruida por el juez Juan Carlos Peinado
    en torno a Begoña Gómez; rige la presunción de inocencia respecto de todos los investigados.
