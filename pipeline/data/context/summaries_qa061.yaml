    a la Intervención General del Estado un informe para investigar los contratos de obras señalados por la UCO,
    entre ellos este. Su mención responde a la trazabilidad de adjudicaciones; no consta que la mercantil esté formalmente
    imputada y rige la presunción de inocencia. Según Diario de Teruel (11-02-2025), también fue adjudicataria de
    obras de emergencia por daños de DANA en carreteras estatales de Teruel (N-211, N-234 y A-23) por cerca de 1,3
    millones de euros.
