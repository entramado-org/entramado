- entity_id: Person:cristobal-cano-quiles
  name: Cristóbal Cano Quiles
  resumen: 'Cristóbal Cano Quiles figura en la instrucción del caso Plus Ultra (Audiencia Nacional) como uno de
    los gestores societarios del entramado vinculado a Julio Martínez Martínez. El juez instructor y los informes
    policiales lo sitúan en un ''tercer nivel jerárquico'', junto a María Gertrudis Alcázar (''Gertru''), secretaria
    de José Luis Rodríguez Zapatero, con funciones de gestión diaria del entramado empresarial y de coordinación
    y cobertura formal de la documentación que sustenta los pagos y la facturación de la red. El auto del juez Calama
    recoge correos entre Cano Quiles y Alcázar (22 de septiembre de 2021 y 21 de marzo de 2022) sobre si debía emitirse
    una o varias facturas y sobre «ir consensuando los conceptos», que el instructor considera evidencia de una
    concertación previa sobre el contenido, la descripción y el importe de las facturas. Aparece como contacto recurrente
    en varias de las sociedades analizadas y se le relaciona con el contrato de comisión del 1% más IVA de la ayuda
    pública aprobada (530.000 euros) entre Idella y Plus Ultra, cuya copia remitió por correo el 23 de febrero de
    2021. El auto lo describe como gestor del entramado societario y de la facturación ad hoc y como responsable
    de facturación de Julio Martínez Martínez, y recoge sus correos para la constitución de la filial en Dubái Landside
    Dubai Fzco (participada al 100 % por Idella Consulenza Strategica SL). No confundir con dirigentes asociativos
    homónimos de la Guardia Civil. Rige la presunción de inocencia: son indicios de una investigación en curso,
    sin acusación firme ni condena.'
  sources:
  - https://www.democrata.es/tribunales/cristobal-cano-juez-caso-zapatero-plus-ultra/
  updated: '2026-09-11'
  reason: '061 revisión humana T0b 2026-09-11 (Fable, dueño): 861b8c53 1bc02ccc: Astra defecto 2 aceptado en ambas:
    auto Calama p.66 (correos 22.09.2021 y 21.03.2022, «ir consensuando los conceptos», «concertación previa») corrige
