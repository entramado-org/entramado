- entity_id: Person:basiliso-gil-carrasquero
  name: Basiliso Gil Carrasquero
  resumen: Basiliso Gil Carrasquero figura como administrador único de Caletón Consultores SL y aparece en el 'auto
    Zapatero' / caso Plus Ultra como presunto testaferro de esa sociedad. Según el auto de la Audiencia Nacional
    de 18 de mayo de 2026 (p.10 y p.40) y el informe de la UDEF (nº 1907, p.134), la gestión real de Caletón correspondería
    a Santiago Fernández Lena, que la controlaría de facto pese a carecer de vinculación formal, mientras que Gil
    Carrasquero, que viajaría periódicamente entre Venezuela y España, ostentaría «un papel meramente formal» a
    cambio de unos 600 euros mensuales pagados en efectivo cuando viaja a España, sin participar en las decisiones.
    La investigación atribuye a Caletón Consultores haber recibido 1.159.558,55 euros de Plus Ultra entre 2020 y
    2025; parte de esos pagos está respaldada por 18 facturas de 2021 y 2022 con el concepto de «comisiones por
    las operaciones chárter operadas por Plus Ultra… conforme contrato brokerage» (informe UDEF, p.122 y p.127;
    auto, p.38), y el auto describe la sociedad como instrumental, utilizada para canalizar fondos de Plus Ultra
    hacia sociedades del entorno de Julio Martínez «mediante facturación simulada y contratos ad hoc» (p.10). El
    informe de la UDEF recoge un mensaje de Fernández Lena de abril de 2022 en el que anuncia la probable llegada
