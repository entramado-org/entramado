- entity_id: Person:jose-maria-alvarez-pallete
  name: José María Álvarez Pallete
  resumen: José María Álvarez-Pallete fue presidente ejecutivo de Telefónica desde abril de 2016 hasta enero de
    2025, cuando le sucedió Marc Murtra (según Euronews, 18-01-2025, y COPE, 20-01-2025). En el caso Begoña Gómez
    figura porque, según los autos del juez Peinado, Begoña Gómez mantuvo una reunión con él, entonces presidente
    de la compañía, el 22 de diciembre de 2021, a la que siguieron contactos con altos cargos de Telefónica en relación
    con el apoyo a la plataforma o software de su cátedra en la UCM (auto de 11 de abril de 2026, p.24; auto de
    20 de junio de 2026, p.35); según declaró ante el juez un representante legal de Telefónica, recogido por Infobae
