- entity_id: Person:jesus-manuel-gomez-garcia
  name: Jesús Manuel Gómez García
  resumen: Jesús Manuel Gómez García fue subsecretario del Ministerio de Transportes, Movilidad y Agenda Urbana
    (antes Fomento) durante la etapa de José Luis Ábalos, quien declaró en la comisión del Senado que lo nombró
    y le encargó toda la gestión de la contratación de material sanitario (DS Senado 103, p.3); según El Español
    e Infobae (23-09-2024), fue cesado a finales de agosto de 2024 por el ministro Óscar Puente tras hacerse pública
    la auditoría interna sobre la compra de mascarillas. En septiembre de 2024 declaró como investigado ante el
    juez de la Audiencia Nacional Ismael Moreno y, según Infobae y El Español, afirmó que Koldo García le entregó
    en mano la oferta de Soluciones de Gestión SL para el suministro de mascarillas y que él la transmitió a las
    entidades que debían adjudicar los contratos, Puertos del Estado y Adif; la sentencia del Tribunal Supremo de
    22 de junio de 2026 recoge que Koldo García hizo llegar a Puertos la oferta «a través del Subsecretario» (p.83).
    Según El Español (18-12-2024), un informe de la UCO lo calificaba como «correa de transmisión» entre «la esfera
    próxima del ministro Ábalos» y los entes adjudicadores; en la comisión del Senado se atribuyó esa expresión
    a un aviso de la Fiscalía (DS Senado 233, p.28). Declaró como testigo el 14 de abril de 2026 en el juicio del
    Tribunal Supremo contra Ábalos, Koldo García y Víctor de Aldama (según Europa Press, vía Teleprensa, y The Objective).
    Rige la presunción de inocencia.
  sources:
