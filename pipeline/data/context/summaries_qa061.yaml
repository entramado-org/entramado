- entity_id: Organization:fasee
  name: FASEE
  resumen: El FASEE (Fondo de Apoyo a la Solvencia de Empresas Estratégicas) fue creado por el Gobierno
    el 3 de julio de 2020 (Real Decreto-ley 25/2020), con una dotación inicial de 10.000 millones de euros,
    adscrito al Ministerio de Hacienda y gestionado por la SEPI a través de un Consejo Gestor, para apoyar
    la solvencia de empresas consideradas estratégicas y golpeadas por la COVID-19; en total el fondo
    aprobó 30 operaciones por 3.255 millones de euros. A través de este fondo se aprobó el 9 de marzo
    de 2021 el rescate de 53 millones de euros a Plus Ultra Líneas Aéreas (un préstamo ordinario de 19
    millones a devolver en cinco años y uno participativo de 34 millones). Ese rescate es el origen de
    las diligencias previas 77/2024 de la Sección de Instrucción del Tribunal Central de Instancia, Plaza
    nº 2 (Audiencia Nacional; juez José Luis Calama), en las que se investiga una presunta trama de tráfico
    de influencias en torno al expresidente José Luis Rodríguez Zapatero, imputado en la causa. El FASEE
    es el instrumento público a través del cual se canalizó la ayuda; su mención en esta base es institucional
    y no implica por sí misma irregularidad, rigiendo la presunción de inocencia para todos los investigados.
