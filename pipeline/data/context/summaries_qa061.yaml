- entity_id: Person:ismael-moreno
  name: Ismael Moreno
  resumen: 'Ismael Moreno Chamarro es magistrado titular del Juzgado Central de Instrucción nº 2 de la Audiencia
    Nacional, al que El Debate (23-02-2024) describió como «el juez más veterano de la Audiencia Nacional». Desde
    febrero de 2024 instruye la causa por las presuntas irregularidades en los contratos de mascarillas durante
    la pandemia (pieza principal del caso Koldo en la Audiencia Nacional), cuya competencia el Tribunal Supremo
    atribuyó a su juzgado, y no a la Fiscalía Europea, en julio de 2024, según Infobae (28-07-2024). Instruye también
    sus piezas derivadas: la de presuntos amaños de obra pública, que según EFE (vía Infobae, 9-03-2026) reunía
    catorce imputados, entre ellos el exdirector general de Carreteras, y la de las contrataciones de Jésica Rodríguez
    en Ineco y Tragsatec, en la que la citó como investigada en julio de 2026, según Infobae (3-07-2026). El 22
    de julio de 2026, según EFE (vía El Correo Gallego), pidió a cinco entidades bancarias información sobre cuentas
    de familiares de Santos Cerdán. Es el órgano instructor de la causa: no es parte investigada ni acusada. Las
    personas que cita o imputa están amparadas por la presunción de inocencia.'
  sources:
