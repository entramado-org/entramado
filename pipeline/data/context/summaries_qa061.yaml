- entity_id: Person:zurab-pololikashvili
  name: Zurab Pololikashvili
  resumen: 'Zurab Pololikashvili (Tiflis, 1977, según El Español, 18-02-2026) es un diplomático y político georgiano
    que fue secretario general de la Organización Mundial del Turismo (OMT, hoy ONU Turismo) desde el 1 de enero
    de 2018, según Casa África; el informe UDEF nº 2910/26 acota su mandato «entre 2018 y 2025» (p.9) y, según El
    Español (18-02-2026), su intento de optar a un tercer mandato descarriló en 2025 cuando el Gobierno de Georgia
    retiró su apoyo a la candidatura. Previamente fue embajador de Georgia en España (2006-2009) y ministro de Desarrollo
    Económico de su país (2009-2010), según Casa África. En la causa de Begoña Gómez aparece en el informe de la
    Guardia Civil como asistente a eventos de innovación turística del entorno de la consultora Barrabés, de Wakalua
    (Globalia) y de Javier Hidalgo: la presentación de Wakalua en el Barrabés Growth Space el 22 de enero de 2019
    y la 1ª Competición de startups de turismo en FITUR 2019 (p.51-52), sin que el informe sitúe allí a Begoña Gómez,
    y la 2ª competición del 20 de enero de 2020, en la que sí coincidieron ambos (p.53 y 55). El Español (18-02-2026)
    lo describe como interlocutor de ese entorno («Zurab»). Además, el informe UDEF nº 2910/26 (p.3 y 34) lo incluye
    en la comitiva del viaje de José Luis Rodríguez Zapatero a Bolivia de septiembre de 2024, inclusión que el propio
    informe considera «a priori» ajena al ejercicio de influencias investigado. No consta que Pololikashvili esté
    investigado ni imputado en ninguna de las dos causas; su mención es como representante institucional de la OMT,
    con plena presunción de inocencia.'
  sources:
