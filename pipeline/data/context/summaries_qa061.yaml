- entity_id: Person:director-general-financiero-y-de-control-de-gestion
  name: Director General Financiero y de Control de Gestión
  resumen: 'Manuel Fresno Castro fue director general financiero y de control de gestión de Adif en 2020, según
    El Independiente (26-08-2024) y Moncloa.com (09-10-2024), que lo identifican como el titular de ese cargo entrevistado
    en la auditoría interna del Ministerio de Transportes sobre la compra de mascarillas (informe de 19 de agosto
    de 2024, en el que los nombres aparecen tachados). Según esa auditoría, realizó por iniciativa propia un estudio
    de solvencia de las dos empresas con oferta, Soluciones de Gestión e Injoo Technology (p.60), y sobre la primera
    declaró: «Vi que Soluciones tenía un entramado que me ponía los pelos de punta. Vi el contrato de Angola, no
    me gustó un pelo, era una empresa de chicha y nabo» (p.61); la auditoría concluye que la elección de Soluciones
    de Gestión por el órgano de contratación de Adif no estaba justificada, «teniendo en cuenta que el análisis
    de solvencia realizado por el Director General Financiero y de Control de Gestión de Adif situaba peor valorada
    a la empresa Soluciones de Gestión» (p.62). Está amparado por la presunción de inocencia; no consta como investigado.'
