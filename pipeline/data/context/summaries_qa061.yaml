  resumen: IOT Domotic Europe SL es una sociedad mercantil señalada en la instrucción del caso Plus Ultra (diligencias
    previas 77/2024 del Tribunal Central de Instancia, Sección de Instrucción Plaza nº 2 de la Audiencia Nacional,
    juez José Luis Calama) como integrante del entramado societario controlado por Julio Martínez Martínez, a quien
