- entity_id: Person:francisco-shwortshik
  name: Francisco Shwortshik
  resumen: Francisco Javier Shwortshik Jegó es, según el informe UDEF nº 2910/26 (p.9), el consejero delegado (CEO)
    de la Sociedad Boliviana de Cemento (SOBOCE), filial boliviana del Grupo Gloria, conglomerado industrial de
    capitales peruanos (p.7). El informe le sitúa, junto a Luis Díaz Olivero y Ana María Ospina, en una videoconferencia
    con José Luis Rodríguez Zapatero el 28 de mayo de 2024 (p.14 y 61) y, según mensajes del 3 de diciembre de 2024,
    como asistente previsto a una reunión que se habría conseguido fijar con el ministro de Justicia de Bolivia,
    César Siles (p.17 y 51), sin que el informe acredite su celebración ni su fecha; también firmó, en representación
    de SOBOCE, una carta de 29 de febrero de 2024 dirigida a Siles cuando este era Procurador General del Estado
    (p.31). Todo ello en el marco del litigio millonario de SOBOCE frente a la empresa pública FANCESA, en el que
    la UDEF investiga una presunta mediación de Zapatero ante autoridades bolivianas. Su mención es como ejecutivo
    de la empresa interesada; rige la presunción de inocencia.
