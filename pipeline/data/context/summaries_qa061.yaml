- entity_id: Company:zano-sociedad-consultora-sl
  name: Zaño Sociedad Consultora SL
  resumen: Zaño Sociedad Consultora S.L. es la consultora del histórico dirigente del PSOE andaluz Gaspar Carlos
    Zarrías Arévalo, que según El Debate (27-05-2026) fundó tras dejar su acta de diputado en 2015 y disolvió voluntariamente
    el 1 de abril de 2026 (COPE, 27-05-2026, la describe como inactiva desde diciembre de 2025). El auto de entrada
    y registro de 26 de mayo de 2026 del Tribunal Central de Instancia (Sección de Instrucción nº 5, diligencias
    previas 150/2025) sostiene que Santos Cerdán «habría acordado remunerar» a Leire Díez con 4.000 euros mensuales
    «con cargo a los fondos del partido» y que Zarrías «prestaría su sociedad como vehículo para dichos pagos y
    asesoría jurídica» (p.5); según ese auto, desde el 26 de junio de 2024 Díez percibió de Zaño cuatro pagos de
    4.000 euros (p.10), y los pagos se habrían articulado mediante sociedades de los investigados con facturas emitidas
    sobre órdenes de encargo de la gerencia de la Secretaría de Organización del PSOE (p.6). Zarrías, por su parte,
    declaró ante el juez Arturo Zamarriego (Plaza de Castilla) que contrató a Díez para investigar una supuesta
    implicación del comisario jubilado José Manuel Villarejo en la causa de los ERE y que le pagó 4.000 euros mensuales
    durante cuatro meses a través de la consultora, según El Debate y COPE (27-05-2026). El 27 de mayo de 2026 la
    UCO registró el domicilio de Zarrías en Madrid y la sede de la consultora, y requirió documentación en la sede
    del PSOE en Ferraz, por orden del juez Santiago Pedraz según El Debate, COPE y The Objective (27-05-2026); el
    auto describe el objeto de la investigación como acciones «cuya pretensión era la desestabilización de estas
    causas judiciales con afectación al PSOE o al Gobierno» (p.7) y aprecia indicios de responsabilidad respecto
    de Zarrías, entre otros, por organización criminal, cohecho, revelación de secretos, falsedad documental, prevaricación,
    tráfico de influencias y delito contra las instituciones del Estado (p.19); The Objective enmarcó el registro
    de Ferraz en una investigación sobre la supuesta financiación ilegal del partido. Según El Debate (27-05-2026)
    y EFE (vía Público, 17-07-2024), Zarrías fue condenado en 2019 por la Audiencia Provincial de Sevilla a nueve
    años de inhabilitación por prevaricación continuada en el caso de los ERE, condena ratificada por el Tribunal
    Supremo en 2022; en julio de 2024 el Tribunal Constitucional estimó parcialmente su recurso de amparo, anuló
    esa condena y ordenó a la Audiencia dictar una nueva sentencia con rebaja de la inhabilitación. Todos los implicados
    en el caso Leire Díez están investigados y rige la presunción de inocencia.
