- entity_id: Company:soluciones-de-gestion
  name: Soluciones de Gestión
  resumen: 'Soluciones de Gestión y Ayuda a las Empresas SL fue adjudicataria en 2020 de varios contratos de emergencia
    de material sanitario (mascarillas) por un total en torno a 53 millones de euros, mediante negociado sin publicidad,
    con compradores públicos como ADIF y Puertos del Estado. Según la exposición razonada elevada al Tribunal Supremo
    por el juez Ismael Moreno (JCI nº 2) de 23 de octubre de 2024 (p.2), que recoge las conclusiones de la inspección
    de Hacienda, la empresa no había realizado actividad en el sector de los equipos de protección individual en
    los años analizados y sería «una mera adjudicataria formal y no a quien realmente se le asignó la compra de
    mascarillas»; la misma exposición razonada (p.18) recoge que la totalidad de los contratos adjudicados a Soluciones
    reportaron a Víctor de Aldama un beneficio económico de 6,6 millones de euros. Todo ello es objeto de investigación
    judicial sin que se haya declarado responsabilidad penal de la sociedad: rige la presunción de inocencia.'
  sources:
