- entity_id: Person:aurora-lopez-lopez
  name: Aurora López López
  resumen: 'María Aurora López López es la cónyuge de Rodolfo Reyes Rojas, a quien la UDEF identifica como «el principal
    accionista de Plus Ultra Líneas Aéreas S.A. a través de su esposa María Aurora López López» (informe UDEF 1908,
    p.4); según The Objective y El Español (25-05-2026), la orden internacional de detención dictada contra Reyes
    recoge que en 2017 la titularidad real y la gestión de Plus Ultra pasaron a manos de Reyes y de su esposa. Está
    investigada en las diligencias del caso Plus Ultra (informe UDEF 1907, p.141), en las que se instruye el rescate
    de 53 millones de euros de la aerolínea (auto, p.24): el auto recoge una conversación del 22 de mayo de 2024
    en la que Julio Martínez Sola le da instrucciones sobre facturas a emitir a Federico Lledó («270.000 menos 176.200»)
    y concluye que de ella «se desprende una posición de ajenidad respecto de la operativa económica real, limitándose
    a actuar como titular meramente formal en determinadas operaciones, sin participación efectiva en la toma de
    decisiones» (auto, p.42; informe UDEF 1907, p.141-143). Según The Objective y El Español (25-05-2026), el juez
    José Luis Calama (Audiencia Nacional) emitió contra ella una orden internacional de detención por los mismos
    delitos que atribuye a su marido: apropiación indebida, tráfico de influencias, pertenencia a organización criminal
    y blanqueo de capitales. Todos los hechos se hallan en fase de instrucción y le ampara la presunción de inocencia.'
