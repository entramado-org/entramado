- entity_id: Person:ismael-oliver
  name: Ismael Oliver
  resumen: 'Ismael Oliver Romero es abogado penalista, socio director del despacho Oliver & Abogados, que dirige
    desde 2010, centrado en derecho penal económico y con sede cerca de la Audiencia Nacional, y fue director de
    la asesoría jurídica de Siemens, según Confilegal (07-03-2024). Según Confilegal y OKDiario (06-02-2025), formó
    parte del equipo de abogados de Sandro Rosell, expresidente del FC Barcelona, absuelto de delito fiscal. En
    febrero de 2025 asumió la defensa de Koldo García en el caso mascarillas (OKDiario, 06-02-2025); después dejó
    de ser su abogado: en la comisión de investigación del Senado se le citó como su «primer abogado» y a Leticia
    de la Hoz como su «segunda abogada» (DS Senado 758, p.38), y la prensa lo describe como exabogado de Koldo (Libertad
    Digital, 14-07-2026). En el caso Leire Díez (Audiencia Nacional, DP 150/2025), el auto de 26 de mayo de 2026
    del juez Santiago Pedraz aprecia indicios de responsabilidad respecto de él, junto a Leire Díez, Javier Pérez
    Dolset, Santos Cerdán y Gaspar Zarrías, en los hechos investigados como organización criminal, cohecho, revelación
    de secretos, inducción al falso testimonio, acusación falsa, falsedad en documento mercantil, prevaricación,
    tráfico de influencias y delito contra las instituciones del Estado (p.18-19). El auto lo identifica como letrado
    de Nervis Villalobos (p.12) y describe que, tras cesar los pagos a Díez a través de Zaño, el PSOE abonó 27.225
    € a Estudio Jurídico I. Oliver & Partners sobre una nota de encargo que el auto considera falseada y Oliver
    pagó esa misma cantidad a Díez desde una segunda sociedad, Oliver Gruppe SL (p.11); también recoge que, días
    antes de la declaración judicial de la testigo Carmen Pano, contactó con Díez para plantear la necesidad de
    «negociar» con ella («es importante y si queréis lo negocio yo»), a lo que Díez respondió «negócialo. Si puedes,
    hazlo» (p.17; Infobae, 27-05-2026). Según Libertad Digital (14-07-2026), Pedraz lo citó a declarar como investigado
    el 9 de septiembre de 2026 y, según EFE (vía Infobae, 09-09-2026), declaró ese día que fue Leire Díez quien
    le contrató en nombre del PSOE como asesoría jurídica sobre la comisión parlamentaria de la «operación Cataluña».
    Es una instrucción en curso: está investigado, no acusado ni condenado, y rige plenamente la presunción de inocencia.'
  sources:
