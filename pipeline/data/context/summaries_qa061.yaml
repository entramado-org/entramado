- entity_id: Person:raif-el-arigie
  name: Raif El Arigie
  resumen: Raif El Arigie Harbie consta como consejero de la aerolínea Plus Ultra Líneas Aéreas según la UDEF (informe
    1907, p.76), en la investigación del caso Plus Ultra (diligencias previas 77/2024 de la Sección de Instrucción
    del Tribunal Central de Instancia, instruidas por el juez José Luis Calama). Participaba en los chats grupales
    con Roberto Roselli, Rodolfo Reyes y Alejandro Delgado Crego recogidos por la UDEF (informe 1908, pp.74 y 84;
    informe 1907, p.58) y el 22 de julio de 2020 reenvió a Reyes un mensaje firmado por Sola y Roselli sobre una
    reunión con el secretario de Estado Pedro Saura y su jefe de gabinete (auto de 18 de mayo de 2026, p.17; informe
    UDEF 1908, pp.16 y 71). Esas conversaciones intervenidas (terminal aportado por el HSI) giran en torno a la
    gestión del rescate de la aerolínea con fondos del FASEE y a los contactos para obtener apoyo institucional
    (informe UDEF 1908, p.42). A partir de las fuentes disponibles no consta de forma expresa que esté formalmente
