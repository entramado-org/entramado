- entity_id: Person:santos-cerdan
  name: Santos Cerdán
  resumen: 'Santos Cerdán León fue secretario de Organización del PSOE desde julio de 2021 -uno de los cargos de
    mayor peso en la dirección del partido- y diputado por Navarra. El 12 de junio de 2025 dimitió de todos sus
    cargos en el partido y entregó su acta de diputado tras un informe de la UCO de la Guardia Civil que le atribuía
    la presunta gestión de comisiones por adjudicaciones de obra pública. Está investigado por su presunta participación
    en una trama de cobro de comisiones (un 2 % de cada adjudicación, según el informe de la UCO recogido por Infobae)
    por la adjudicación de obra pública, vinculada a la empresa navarra Servinabar 2000 SL. En el registro del domicilio
    del empresario Antxon Alonso se intervino un contrato privado de compraventa —no elevado a público, fechado el 1 de junio de 2016 según El Español (18-06-2025)— por el que este le cedía 1.350 de las 3.000 participaciones de dicha
    sociedad (el 45 %); el Tribunal Supremo investiga el alcance y la significación de esa presunta titularidad
    oculta dentro de la trama. El juez del Supremo Leopoldo Puente acordó su prisión provisional el 30 de junio
    de 2025 por riesgo de destrucción de pruebas, por hechos que el auto califica indiciariamente como delitos de
    integración en organización criminal, tráfico de influencias y cohecho y atribuyéndole indiciariamente el papel
    de reclamar a las constructoras las cantidades adeudadas, recaudarlas y hacerlas llegar a Ábalos y a Koldo García;
    según Infobae y The Objective ingresó en la prisión de Soto del Real. Según Confilegal y El País, fue puesto
    en libertad provisional el 19 de noviembre de 2025, tras 142 días (casi cinco meses) en prisión preventiva,
    al considerar el juez mitigado el riesgo de destrucción de pruebas, con medidas cautelares: retirada del pasaporte,
    prohibición de salir de España y comparecencias quincenales. Rige la presunción de inocencia al no existir sentencia
    firme.'
