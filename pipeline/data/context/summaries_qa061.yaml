- entity_id: Person:leonardo-marcos
  name: Leonardo Marcos
  resumen: Leonardo Marcos González (Valderas, León, 1958, según Wikipedia) es funcionario del Cuerpo Superior de
    Administradores Civiles del Estado. Según Wikipedia, fue director general de Protección Civil y Emergencias
    (29 de enero de 2020–13 de junio de 2023) y dirigió la Guardia Civil entre el 13 de junio de 2023 y el 17 de
    septiembre de 2024, nombrado por el ministro Fernando Grande-Marlaska (DS Senado 745, p.81 y p.107). Según fuentes
    de Interior citadas por Europa Press (vía Leonoticias, 12-10-2024), dejó el cargo por «motivos personales» tras
    quince meses y pasó a la Embajada de España en Washington como consejero de Información, puesto que ya había
    ocupado en otras embajadas. Según Leonoticias, la UCO sostiene en un informe que Koldo García reconoció al comandante
    Rubén Villalba que habría sido Marcos quien le dio el «chivatazo» de la investigación; Marcos negó en la comisión
    de investigación del Senado haber dado ningún «chivatazo» y, preguntado si conoce a Koldo García, respondió
    «No. Nunca. Jamás» (según elDiario.es). El general Rafael Yuste, exjefe de la UCO, declaró como testigo en el
    caso Leire (Audiencia Nacional, DP 150/2025, juez Santiago Pedraz) que Marcos y el director adjunto operativo
    Manuel Llamas le presionaron para que la unidad «se pusiera de perfil» en la investigación sobre David Sánchez,
    hermano del presidente del Gobierno (según The Objective, 02-07-2026, y Libertad Digital, 24-07-2026); en el
    Senado, Llamas resumió esas acusaciones como «ponerse de perfil y no ser proactivo» y las negó (DS Senado 756,
    p.13). Según Infobae (29-07-2026), el juez Pedraz lo citó como investigado en esa causa por providencia de 29
    de julio de 2026, tras haber rechazado semanas antes esa imputación, y el 10 de septiembre de 2026 declaró como
    investigado negando haber presionado a la UCO, aunque admitió haber pedido rapidez con el siguiente informe
    (según EFE, vía Infobae). Es una instrucción en curso y rige la presunción de inocencia.
