- entity_id: Person:jose-luis-rodriguez-zapatero
  name: José Luis Rodríguez Zapatero
  resumen: 'José Luis Rodríguez Zapatero fue presidente del Gobierno de España entre 2004 y 2011 y secretario general
    del PSOE (2000-2012). El auto de 18 de mayo de 2026 del juez José Luis Calama (Sección de Instrucción del Tribunal
    Central de Instancia, Plaza nº 2, Audiencia Nacional; Diligencias Previas 77/2024) acordó citarlo a declarar
    como investigado (imputado) en el caso Plus Ultra el 2 de junio (p.2); según El Español, la comparecencia se
    aplazó a petición de su defensa al 17 y 18 de junio de 2026. La causa indaga el rescate de 53 millones de euros
    concedido por la SEPI en 2021 a la aerolínea Plus Ultra dentro del fondo de apoyo a la solvencia de empresas
    estratégicas de la pandemia, y se instruye por presuntos delitos de organización criminal, tráfico de influencias,
    apropiación indebida, falsedad documental y blanqueo de capitales (auto de 18 de mayo de 2026, p.1). Ese auto
    lo sitúa «en el vértice de la estructura», como quien «ejerce el liderazgo estratégico y mantiene los contactos
    institucionales y empresariales de alto nivel» (p.9), y lo describe como «núcleo decisor y estratégico de la
    red», con un liderazgo que «no se manifiesta de forma formal o pública» sino a través de la dirección, coordinación
    y supervisión, «evitando en lo posible la ejecución directa de las gestiones más comprometidas» (p.58); según
    Infobae, la imputación abarca organización criminal, tráfico de influencias y falsedad documental, y según Libertad
    Digital el juez no descartó un posible blanqueo de capitales. Según los flujos recogidos en el auto (p.49-50),
    el expresidente habría recibido aproximadamente 1,52 millones de euros de Análisis Relevante (490.780), Gate
    Center (352.980) y el grupo Thinking Heads (681.318,04); esas mismas sociedades habrían transferido conjuntamente
    423.779 euros a Whathefav S.L., sociedad administrada por sus hijas Laura y Alba. Rige plenamente la presunción
    de inocencia: se trata de una instrucción en curso, sin juicio ni condena, y el expresidente niega cualquier
    irregularidad: según Wikipedia, negó ante el juez haber influido en el rescate de Plus Ultra, y según Infobae
    sostiene que sus cobros de la consultora Análisis Relevante corresponden a consultorías reales. En la misma
    causa figura como investigado distinto Julio Martínez Martínez (informe UDEF 1907, p.167), empresario alicantino
    y amigo personal del expresidente según Infobae y Wikipedia, persona diferente de él.'
  sources:
