    Antxon Alonso la contratación de su pareja y sostiene que Cerdán no intervino en ella. Compareció ante la comisión
    Koldo del Senado el 30-jun-2026, donde afirmó que Chivite le pidió dimitir y reconoció haber llamado a Cerdán
    al estallar el caso. Según prensa, Vox presentó una querella por presuntos cohecho y tráfico de influencias
    en relación con la reforma de su piso, realizada por la constructora Adentro Construimos (adjudicataria de obras
    del parque Sendaviva investigadas en un juzgado por posible fraccionamiento); por su condición de aforado, la
    parte que le afectaba se elevó al Tribunal Superior de Justicia de Navarra, cuya Sala de lo Civil y Penal la
    inadmitió en junio de 2026 al considerar que se basaba en «meras sospechas, conjeturas o posibilidades» (según
    elDiario.es y Noticias de Navarra, 12-jun-2026). Sigue siendo parlamentario foral; no consta condena alguna
    y rige la presunción de inocencia.
