- entity_id: Person:camino-arce
  name: Camino Arce
  resumen: Camino Arce Blanco fue subdirectora general de Construcción de la Dirección General de Carreteras del
    Ministerio de Transportes, nombrada por resolución de la Secretaría de Estado de Transportes de 16 de noviembre
    de 2018 (informe UCO, p.285), durante la etapa de José Luis Ábalos, puesto desde el que firmó informes de valoración
    técnica de licitaciones de obra pública (informe de 26 de abril de 2019, p.129; p.191), informes técnicos (p.75,
    p.101) y, junto al director general Javier Herrero, la aprobación técnica de un modificado de obra (p.137);
    según Libertad Digital (27-06-2025, citando a la Fundación de Ingenieros de Caminos, Canales y Puertos), es
    ingeniera de Caminos y desde el 27 de abril de 2023 es directora técnica y de desarrollo de negocio de la sociedad
    estatal SEITT. El informe de la UCO recoge una conversación del 5 de diciembre de 2019 en la que envió a Koldo
    García por WhatsApp la imagen del documento que aprobaba el importe de una modificación de obra y ordenaba liberar
    el pago a OPR, bajo el título «lo conseguimos!!» (p.138-139), en el contexto de la investigación sobre la presunta
    influencia en adjudicaciones. Estos extremos están en fase de investigación y no implican conducta delictiva
    probada; no consta que esté investigada y rige la presunción de inocencia.
