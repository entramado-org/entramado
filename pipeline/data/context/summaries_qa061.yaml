- entity_id: Person:victor-de-aldama
  name: Víctor de Aldama
  resumen: Víctor Gonzalo de Aldama Delgado es un empresario español, expresidente del Zamora CF, señalado por la
    investigación como comisionista o intermediario ('conseguidor') del 'caso Koldo'. Según Diario de Castilla y León (07-10-2024), en octubre de 2024 fue detenido en una causa separada por presunto fraude fiscal en la venta de hidrocarburos, en la que ingresó en prisión provisional (la UCO lo identifica como uno de los principales responsables de
    una trama que habría defraudado en torno a 182 millones de euros en IVA), y en noviembre de 2024 declaró voluntariamente
    ante el juez implicando a José Luis Ábalos, a Koldo García y a otros cargos, a quienes afirmó haber entregado
    dinero. El 22 de junio de 2026 la Sala Segunda del Tribunal Supremo, en la sentencia núm. 418/2026 (Causa Especial
    20775/2020), lo CONDENA como autor de un delito de pertenencia a organización criminal (art. 570 bis CP) y de
    varios delitos de cohecho, apreciando como cualificada la atenuante de análoga significación a la de confesión
    (colaboración con la justicia); acuerda la suspensión de las penas privativas de libertad impuestas durante
    cinco años, condicionada a que no delinca en ese plazo, a comparecencias semestrales ante el Tribunal y a la
    realización de trabajos en beneficio de la comunidad durante un año. Lo ABSUELVE de los restantes delitos de
    los que venía acusado (incluidas inducción a la prevaricación, aprovechamiento de información privilegiada y
    falsedad), y participa del decomiso conjunto de 430.298 € de ganancias del cohecho. La sentencia, dictada en
    instancia única ante el Supremo, es firme.
