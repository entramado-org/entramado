- entity_id: Person:juan-carlos-etero
  name: Juan Carlos Etero
  resumen: 'Según el informe de la UCO incorporado a la causa del caso Koldo (informe UCO, p.16 y p.224-230), Juan
    Carlos Etero Martínez habría simulado la contratación de Koldo García: confirmó su alta en la Seguridad Social
    el 16 de noviembre de 2022 como trabajador desde el día 15 (p.225) y le pagó una nómina recurrente de unos 2.600
    euros netos mensuales entre diciembre de 2022 y junio de 2023 «sin que hubiera tenido que desempeñar función
    alguna» (p.16, p.224); esas cantidades eran luego compensadas a Etero por Levantina Ingeniería y Construcción
    (LIC) mediante facturas y pagarés (p.227-228). Según El Español (12-06-2025), que cita ese informe, el constructor
    José Ruz, al que describe como accionista de LIC (Infobae, 04-07-2025, lo llama administrador de la empresa),
    fue quien pagó esa nómina a través de la contratación por parte de Etero. El informe recoge que Patricia Uriz,
    esposa de Koldo, envió a Etero el DNI y la tarjeta sanitaria de éste y recibía cada mes el documento de la nómina
    (p.225-227); que el 25 de abril de 2023 Etero preguntó a Koldo cuándo le pagaría LIC, pues estaba adelantando
    el dinero mediante nómina y los pagos le llegaban en pagarés a meses vista (p.227-230); y que en junio de 2023
    finalizó la canalización de pagos (p.230). El propio informe no acredita que Etero participara en fraude o malversación;
    se trata de un informe policial en una instrucción en curso, no consta su imputación y rige la presunción de
    inocencia.'
