- entity_id: Person:angel-victor-torres
  name: Ángel Víctor Torres
  resumen: Ángel Víctor Torres es dirigente del PSOE (secretario general del PSOE de Canarias desde 2017, según
    Wikipedia), fue presidente del Gobierno de Canarias —lo era a finales de 2020, según el escrito de la defensa
    de Víctor de Aldama (p.31)— y es el actual ministro de Política Territorial y Memoria Democrática (El Plural,
    29-04-2026). En el caso Koldo, Aldama declaró ante el instructor del Tribunal Supremo el 21 de noviembre de
    2024 que «Koldo me dice que el sr Victor Ángel Torres pide 50.000 €», petición que, según el escrito de su defensa,
    se vinculaba a «otro contrato» que Koldo García mediaba con el Gobierno de Canarias para el suministro de test
    PCR de detección del COVID a través de Fertinvest Consulting, con adjudicaciones a Eurofins Megalab entre diciembre
    de 2020 y febrero de 2021 por 5.363.299,73 euros (escrito de la defensa de Aldama, p.30-32); Aldama afirma que
    se negó a pagar esa cantidad (p.32). En el juicio del caso mascarillas ante el Tribunal Supremo, Aldama precisó
    que fue Koldo García quien le pidió pagar la comisión y que Torres «ni pidió ni cobró» dinero y «no se pagó»
    cuantía alguna, según El Plural (29-04-2026); ante la Audiencia Nacional, el 21 de mayo de 2026, insistió en
    que Koldo le pidió 50.000 euros para Torres y que se negó a abonarlos (El Español, 21-05-2026). Torres niega
    cualquier irregularidad (El Español, 21-05-2026). Según El Independiente (05-04-2026), el Tribunal Supremo admitió
    su declaración como testigo por escrito en ese juicio. No consta su imputación ni condena y rige plenamente
    la presunción de inocencia.
  sources:
  - https://www.elplural.com/sociedad/tribunales/aldama-reconoce-supremo-torres-ni-pidio-ni-cobro-dinero-caso-mascarillas_388580102
  - https://www.elespanol.com/espana/tribunales/20260521/aldama-declara-nadie-baleares-cobro-trama-mascarillas-ministro-angel-victor-torres/1003744254290_0.html
  - https://www.elindependiente.com/espana/2026/04/05/guia-juicio-caso-mascarillas-quien-quien-que-juzga-abalos-koldo-aldama-sientan-banquillo/
