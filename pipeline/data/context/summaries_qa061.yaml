- entity_id: Person:vicente-calzado-tellez
  name: Vicente Calzado Téllez
  resumen: Vicente Calzado Téllez es director de EMFESA (Enajenación de Materiales Ferroviarios, S.A.), empresa
    pública dependiente del Ministerio de Transportes y participada mayoritariamente por Adif (DS Senado 233, p.29;
    Wikipedia); según declaró en el Senado, ocupa el puesto desde 2011 (Pressdigital, Agencias, 29-05-2024), y The
    Objective (06-12-2025) sigue describiendo a EMFESA como «la empresa pública dirigida por Vicente Calzado». Compareció
    el 29 de mayo de 2024 ante la comisión de investigación del Senado sobre el caso Koldo, donde reconoció su amistad
    con Koldo García, al que llegó a prestar dinero y con el que comía a menudo, y defendió que contrató en 2021
    al hermano de este, Joseba García, por sus méritos y no por esa relación (Pressdigital, 29-05-2024; DS Senado
    233, p.29). Reconoció asimismo un encuentro con Koldo García en el restaurante La Chalana (Madrid) en febrero
    de 2023, en el que, según dijo, se habló principalmente de una fruta tropical (Pressdigital, 29-05-2024; DS
    Senado 233, p.29). Según The Objective (28-12-2024), en una llamada intervenida el 20 de septiembre de 2023
    Koldo pidió a Ábalos «que trates con cariño a Vicente […] ha dado trabajo a toda mi familia», y la UCO sostiene
    que ambos habrían «avalado la continuidad» de Calzado en la empresa; el mismo medio recoge que trabajadores
    de EMFESA le han acusado de nepotismo y presentaron denuncias ante el canal ético de la empresa, y que Calzado
    admitió haber dejado dinero y su coche a Koldo pero se desmarcó de cualquier acción ilícita. En la conversación
    grabada el 23 de noviembre de 2023, Koldo pide a Ábalos un puesto en Adif para Calzado, al que el informe de
    la UCO describe como «antiguo director de la sociedad pública EMFESA» (informe UCO, pp.391-392). No consta que
    esté investigado ni imputado; rige la presunción de inocencia.
  sources:
