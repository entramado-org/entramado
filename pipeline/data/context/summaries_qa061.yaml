- entity_id: Person:nicoleta-neacsu
  name: Nicoleta Neacsu
  resumen: 'Nicoleta Neacsu Duloiu (citada como «Nicoleta» y «Nicole»; The Objective escribe «Doloiu»), de nacionalidad
    rumana según The Objective (23-06-2025), fue contratada en septiembre de 2022 por EMFESA (Enajenación de Materiales
    Ferroviarios), empresa pública dependiente del Ministerio de Transportes y adscrita a ADIF: según el informe
    de la UCO de la Guardia Civil de junio de 2025 (p.366-367), el 9 de septiembre de 2022 Koldo García le reenvió
    el aviso de que ya podía firmar el contrato y ella le remitió una captura de su contrato con EMFESA. Según The
    Objective (23-06-2025), ocupó el puesto de delegada territorial de Medio Ambiente y causó baja el 31 de marzo
    de 2025. Según el informe de la UCO (p.365-366), en una conversación grabada el 2 de febrero de 2022 Koldo García,
    exasesor del exministro José Luis Ábalos, pidió a Santos Cerdán un «favor personal» para colocarla y mencionó
    a «Juanma Serrano, el de Correos» (Juan Manuel Serrano, entonces presidente de Correos) como quien podría ayudar;
    The Objective (23-06-2025) añade que Koldo la colocó aprovechando su amistad con Vicente Calzado, director de
    EMFESA. La UCO señala que «habría mantenido una relación cercana con Koldo» (p.365); The Objective la describe
    como su «amiga íntima». Su papel es el de presunta beneficiaria de una colocación atribuida por la UCO al entorno
    de Koldo; rige la presunción de inocencia y no consta que esté investigada ni imputada.'
  sources:
  - https://theobjective.com/espana/tribunales/2025-06-23/nicole-koldo-dejo-emfesa-exclusiva-to/
  - https://www.libertaddigital.com/espana/politica/2025-06-13/la-uco-revela-que-santos-cerdan-coloco-a-otra-sobrina-de-koldo-nicoleta-no-solo-hay-que-valer-para-follar-7265201/
