- entity_id: Organization:delincuencia-economica
  name: Delincuencia Económica
  resumen: 'Hace referencia al departamento o área de Delincuencia Económica (y Anticorrupción) de la Unidad Central
    Operativa (UCO) de la Guardia Civil —denominación que emplea la directora general de la Guardia Civil en su
    comparecencia ante la Comisión de Interior del Senado (Diario de Sesiones del Senado, Comisión de Interior,
    16-06-2026, p.4-6)—, encargado de la investigación patrimonial y financiera en las principales causas de corrupción.
    Según The Objective (17-06-2025), el área la dirige el teniente coronel Antonio Balas; en esa misma comparecencia
    la directora general defiende al «teniente coronel Balas» y «a todos los agentes que trabajan en esa unidad»
    (p.21). Sus agentes elaboran informes que constan en el caso Koldo y en la causa especial 20775/2020 del Tribunal
    Supremo (Ábalos y Cerdán), como el informe de la UCO de 5 de junio de 2025 sobre presuntas irregularidades en
    contratación pública (informe UCO, p.1); en el caso Begoña Gómez, donde el Grupo de Delincuencia Económica 3
    de la UCO firmó el atestado 95/2024 en las diligencias previas 1146/2024 (informe de la Guardia Civil de 14-05-2024,
    p.1-2); y en el de Badajoz, donde agentes de la UCO del Grupo de Delincuencia Económica figuran como testigos
    propuestos por la acusación (escrito de acusación, p.33), analizando flujos de dinero, sociedades y adjudicaciones.
    Aparece bajo distintas variantes de nombre que designan dependencias de la UCO. Es un órgano investigador, no
    un investigado: actúa por delegación judicial.'
