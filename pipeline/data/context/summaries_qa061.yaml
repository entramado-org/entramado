- entity_id: Person:gaspar-carlos-zarrias-arevalo
  name: Gaspar Carlos Zarrías Arévalo
  resumen: 'Gaspar Carlos Zarrías Arévalo es un histórico dirigente del PSOE andaluz: según COPE (27-05-2026), nacido
    en Madrid en 1955 y licenciado en Derecho, fue consejero de Presidencia (El Debate) y vicepresidente de la Junta
    de Andalucía en los gobiernos de Manuel Chaves —COPE sitúa su etapa en el Ejecutivo andaluz entre 1996 y 2009—,
    secretario de Organización del PSOE de Andalucía y secretario general del PSOE de Jaén; dejó su escaño en el
    Congreso en julio de 2015 y se dio de baja del partido un año después (COPE). Fue condenado en el caso de los
    ERE a nueve años de inhabilitación por un delito continuado de prevaricación por la Audiencia Provincial de
    Sevilla en 2019, condena ratificada por el Tribunal Supremo en 2022; en julio de 2024 el Tribunal Constitucional
    estimó parcialmente su recurso, anuló la sentencia por vulnerar su derecho a la legalidad penal y ordenó a la
    Audiencia de Sevilla dictar otra que rebaje la inhabilitación (Público/EFE, 17-07-2024; El Debate, 27-05-2026).
    En el caso Leire (Audiencia Nacional, DP 150/2025, juez Santiago Pedraz), el auto de entrada y registro de 26
    de mayo de 2026 sostiene que Santos Cerdán «habría acordado remunerar» a Leire Díez «en la cantidad de 4.000
    euros mensuales con cargo a los fondos del partido» y que Zarrías «prestaría su sociedad como vehículo para
    dichos pagos y asesoría jurídica» (p.5); el 26 de junio de 2024 Díez «comienza a percibir fondos provenientes
    de Zaño Sociedad Consultora, llegando a percibir cuatro pagos de 4.000 €» (p.10). El auto aprecia «indicios
    de responsabilidad» respecto de él (p.19) y The Objective (27-05-2026) informó de que Pedraz le imputó ese día,
    en el que la UCO entró en la sede de su consultora Zaño (The Objective) y en su domicilio de Madrid (El Debate).
    Según El Debate y COPE, Zarrías había declarado ante el juez Arturo Zamarriego (Juzgado de Instrucción nº 9
    de Madrid) que contrató a Díez, a través de Zaño, para investigar una supuesta implicación del comisario jubilado
    José Manuel Villarejo en la causa de los ERE, y que le pagó 4.000 euros mensuales durante cuatro meses. El 31
    de julio de 2026 Pedraz abrió una pieza separada económica y ordenó rastrear desde 2022 ocho cuentas suyas y
    tres de Zaño; su defensa recurrió la medida por «prospectiva» y pidió ceñir el análisis a la cuenta desde la
    que se pagó a Díez en 2024 (El Independiente y EFE vía Infobae, 31-07-2026). Está investigado bajo presunción
    de inocencia; no hay juicio ni condena en esta causa.'
