- entity_id: Person:jacobo-teijelo
  name: Jacobo Teijelo
  resumen: Jacobo Teijelo es un abogado penalista (según El Español, 08-07-2025) que el 8 de julio de 2025 se personó
    oficialmente como defensor de Santos Cerdán en el caso Koldo, «en codefensa y coordinación» con el despacho
    de Benet Salellas, según el comunicado recogido por Europa Press (vía Telemadrid, El Español y The Objective,
    08-07-2025). Su nombre se dio a conocer, según esos mismos medios, al difundirse un audio grabado en su despacho
    en el que la exconcejal socialista Leire Díez, con intervención de Teijelo, del empresario Javier Pérez Dolset
    —al que también representa— y de Alejandro Hamlyn, reclamaba información sensible sobre guardias civiles y fiscales,
    principalmente sobre el mando de la UCO Antonio Balas, en una conversación en la que a cambio se ofrecían pactos
    con la Fiscalía, la Abogacía del Estado o Hacienda; Teijelo denunció entonces lo que consideraba una grabación
    clandestina y parcial, sostuvo que Díez hablaba «en sentido figurado» y negó tener capacidad de ofrecer beneficios
    judiciales a cambio de información comprometida (Europa Press vía Telemadrid, 08-07-2025). El auto de entrada
    y registro en la sede del PSOE dictado el 26 de mayo de 2026 en las diligencias previas 150/2025 de la Audiencia
    Nacional lo cita entre los investigados —letrado de Cerdán y del capitán Juan Sánchez Yepes, «quien también
    factura sus servicios al PSOE»— y señala que habría recibido al menos 125.000 euros del partido con una facturación
    que el instructor considera «falaz» (p.6 y p.15), si bien precisa que su integración en la organización investigada
    «queda a expensas» de futuras diligencias (p.14). Según Infobae (12-06-2026) y El Independiente (25-06-2026),
    el juez Santiago Pedraz lo citó como investigado por presuntos delitos de revelación de secretos, cohecho y
    contra las instituciones del Estado y declaró el 25 de junio de 2026; según El Español (25-06-2026), reconoció
    haber percibido 125.000 euros del PSOE por una «prospectiva sentimental de sus causas» y confirmó haber acudido
    a la sede de la Fiscalía General junto a Leire Díez. Son diligencias de instrucción en curso; rige la presunción
    de inocencia.
