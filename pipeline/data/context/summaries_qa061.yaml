- entity_id: Person:julio-martinez-sola
  name: Julio Martínez Sola
  resumen: 'Julio Martínez Sola es, según Infobae y elDiario.es, cofundador de la aerolínea Plus Ultra Líneas Aéreas
    y fue su presidente hasta su dimisión el 24 de julio de 2026 (EFE, vía Infobae) (el auto de Calama lo cita como
    vicepresidente en 2020, p.53); Alva Skies and Wings SL, sociedad titular del 9,46% de Plus Ultra, tenía como
    administrador único a Antonio Caldeiro Téllez, a quien Sola daba instrucciones según la UDEF. Es una persona
    distinta de Julio Martínez Martínez (''Julito'', como se le llama en la comisión de investigación del Senado,
    DS 744, pp.4 y 79), el interlocutor de la ''vía Zapatero'': en los mensajes que recoge el auto de 18 de mayo
    de 2026, Sola se refiere a él como «el tocayo» (pp.19, 22-23 y 39, donde el instructor lo identifica como Julio
    Martínez Martínez) y la UDEF los distingue expresamente (informe 1908, p.144). Como representante de Plus Ultra,
    Sola firmó el contrato del 1% más IVA con Idella Consulenza Strategica (la sociedad de Martínez Martínez) sobre
    la ayuda pública. La aerolínea fue rescatada con unos 53 millones de euros durante la pandemia a través del
    fondo de la SEPI (FASEE, 2021). Está investigado en el ''caso Plus Ultra''. El 11 de diciembre de 2025 se practicaron
    entradas y registros ordenados por la Sección de Instrucción del Tribunal de Instancia de Madrid, Plaza 15 (pieza
    separada 62/2025 de las DP 597/2021), según los informes de la UDEF; según Libertad Digital y Rankia, ese día
    fue detenido junto a Roberto Roselli. Según EFE (vía Infobae, 24-07-2026), dimitió como presidente el 24 de
    julio de 2026, días después de presentar al juez un escrito en el que reconoce el pago del 1% del rescate a
    sociedades de Martínez Martínez; declaró como investigado ante Calama el 7 de septiembre de 2026 (EFE vía infoLibre).
    Rige la presunción de inocencia.'
