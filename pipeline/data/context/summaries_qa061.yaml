- entity_id: Person:julian-mateos
  name: Julián Mateos
  resumen: 'Julián Mateos (Julián Mateos Aparicio Prieto, según Wikipedia) es director de negocios de la SEPI y,
    según una noticia de El Mundo de 17 de agosto de 2021 recogida en el auto de la Audiencia Nacional de 18 de
    mayo de 2026 (p.25) y en el informe UDEF 1908 (p.153-154), fue puesto por la SEPI «al frente del fondo de rescate
    tras la polémica con Plus Ultra», el Fondo de Apoyo a la Solvencia de Empresas Estratégicas (FASEE) a través
    del cual se canalizó la ayuda pública de 53 millones de euros a Plus Ultra, autorizada por el Consejo de Ministros
    el 9 de marzo de 2021 y desembolsada en dos tramos, el 18 de marzo (19 millones) y el 10 de agosto de 2021 (34
    millones) (informe UDEF 1907, p.7, p.53 y p.180). El informe UDEF 1908 (p.154) recoge que ese 17 de agosto de
    2021 Julio Martínez Martínez reenvió a Rodolfo Reyes la noticia de su nombramiento, que Reyes le preguntó si
    lo conocía y que en el mensaje siguiente escribió «10k done», lo que la UDEF interpreta como «la confirmación
    de un pago por importe de 10.000 euros» (el auto, p.25, y el informe UDEF 1907, p.58, precisan «sin especificar
    divisa»); ni el auto ni los informes atribuyen ese pago a Mateos ni lo vinculan a su nombramiento, y según la
    cronología de Infobae (24-05-2026) el mensaje se envió una semana después de completarse el segundo tramo del
    rescate. Rige la presunción de inocencia: lo anterior son indicios recogidos en informes policiales y resoluciones
    de instrucción, no hechos probados.'
