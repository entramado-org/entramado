- entity_id: Organization:fundacion-ie
  name: Fundación IE
  resumen: La Fundación IE es la fundación vinculada al IE University / Instituto de Empresa que creó y albergó
    el IE Africa Center, cuya dirección ocupó Begoña Gómez, esposa del presidente del Gobierno Pedro Sánchez, entre
    agosto de 2018 y junio de 2022. En la investigación del caso Begoña Gómez, el informe de la UCO de la Guardia
    Civil examinó la vinculación del IE Africa Center con Wakalua, filial del Grupo Globalia, y la de esta sociedad
    con el empresario Juan Carlos Barrabés (pp. 45, 133 y 134). El auto del juez Juan Carlos Peinado de 11 de abril
    de 2026 recoge que el 17 de enero de 2020 se firmó un acuerdo entre el IE Africa Center y Wakalua, «proyecto
    en el que colaboraba» Barrabés (p. 2). Según el informe, las webs de Globalia y del IE recogen que un evento
    del centro en Londres, el 5 de marzo de 2020, fue patrocinado por Wakalua (pp. 46 y 134). El IE aseguró en un
    comunicado no haber recibido aportación dineraria alguna de Globalia ni de Wakalua (p. 46), y la UCO no observó
    indicios de que Barrabés fuera la vía por la que Begoña Gómez inició su relación con Wakalua (p. 45). Rige plenamente
    la presunción de inocencia respecto de Begoña Gómez; la fundación es un actor del entorno, no una imputada.
