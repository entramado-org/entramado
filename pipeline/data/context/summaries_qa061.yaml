- entity_id: Person:carlos-moreno
  name: Carlos Moreno
  resumen: Carlos Moreno Medina, licenciado en Derecho por la Universidad de Cádiz según El Debate (04-12-2024),
    fue jefe de Gabinete de la ministra de Hacienda María Jesús Montero desde junio de 2018 (sentencia del Tribunal
    Supremo de 22 de junio de 2026, p.46); El Debate señala que fue nombrado de nuevo el 22 de noviembre de 2023,
    cuando Montero pasó a ser vicepresidenta, y The Objective (22-04-2026) ya lo describe como exjefe de Gabinete.
    En el caso Koldo, Víctor de Aldama declaró ante el Juzgado Central de Instrucción nº 2 de la Audiencia Nacional
    el 21 de noviembre de 2024 (y ante el Tribunal Supremo el 16 de diciembre de 2024; informe UCO, p.5, n.4) que
    Moreno le pidió «oportunidades de inmuebles» y que, tras la gestión del aplazamiento tributario de su empresa
    Pilot Real State SL, Koldo García entregó a Moreno 25.000 euros en un sobre en un bar junto al Ministerio (escrito
    de la defensa de Aldama, aldama-movil.pdf, p.27-28), extremo que Moreno niega (The Objective, 22-04-2026). Según
    El Español (04-03-2025), la UCO halló en el móvil de Aldama un WhatsApp enviado a Moreno el 30 de junio de 2020
    en el que, sobre una deuda de unos 550.000 euros, proponía «pondríamos 250.000 y el resto un convenio de cinco
    años». Moreno, que declaró como testigo ante el instructor el 4 de marzo de 2025, reconoció haberse reunido
    con Aldama por indicación de Koldo García y haber trasladado la petición a un asesor del gabinete —Ignacio Granados,
    inspector de Hacienda, según la sentencia (p.158)—, y en el juicio admitió «dos o tres reuniones» con el empresario,
    negando haber cobrado dinero alguno (El Español, 04-03-2025; The Objective, 22-04-2026). La sentencia del Tribunal
    Supremo de 22 de junio de 2026 declara probada la reunión de junio de 2020 y el traslado de la petición, pero
    también que no llegó a producirse aplazamiento alguno, que no ha quedado probada la entrega de los 25.000 euros
    y que estos hechos no son constitutivos de tráfico de influencias (p.46 y p.158-159). Según El Debate (04-12-2024),
    Montero declaró en noviembre de 2024 que pondría «la mano en el fuego» por él. Intervino en la causa como testigo;
    no consta imputación ni condena y rige la presunción de inocencia.
