- entity_id: Person:francisco-martos-ortiz
  name: Francisco Martos Ortiz
  resumen: 'Francisco Martos Ortiz es un político socialista de la provincia de Badajoz, alcalde de Castuera y diputado
    provincial delegado de la Diputación de Badajoz (así se describe en la sentencia 152/2026, p.210), donde fue
    Delegado del Área de Cultura (sentencia, pp.14 y 230). El 14 de julio de 2026, la Audiencia Provincial de Badajoz
    lo condenó (sentencia 152/2026) como cooperador necesario de un delito de prevaricación administrativa (Bloque
    B: firmó, como Delegado de Cultura, la ficha de modificación que transformó en 2022 el puesto de David Sánchez
    en la jefatura de la Oficina de Artes Escénicas omitiendo el documento de funciones) a 9 años de inhabilitación
    especial, y lo absolvió del resto. Se trata de una condena no firme: cabe apelación ante el TSJ de Extremadura
    y rige la presunción de inocencia hasta la firmeza. Según Confilegal y elDiario.es, con anterioridad fue condenado
    en primera instancia (2020, Juzgado de lo Penal de Don Benito) a tres años de prisión por acoso laboral al arquitecto
    municipal de Castuera, pero la Audiencia Provincial lo ABSOLVIÓ en apelación (abril de 2022); asunto procesalmente
    distinto de la causa de la Diputación.'
