- entity_id: Organization:reale-seguros
  name: Reale Seguros
  resumen: 'Reale Seguros es una compañía aseguradora. En el caso de Begoña Gómez (Juzgado de Instrucción nº 41
    de Madrid, juez Juan Carlos Peinado) figura como «patrocinador fundacional» de la Cátedra Extraordinaria de
    Transformación Social Competitiva que codirigía Gómez en la Universidad Complutense (auto de apertura de juicio
    oral de 20 de junio de 2026, p.11): su primer pago fue necesario para la creación de la cátedra, fue cofirmante
    del convenio de constitución de 30 de octubre de 2020 (p.5) y aportó 60.000 euros «en diferentes tramos temporales»
    (p.34); el auto de 11 de abril de 2026 (p.3) lo describe como una aportación única de 60.000 euros, frente a
    los 15.000 euros anuales comprometidos por La Caixa. Según el auto de 20 de junio de 2026 (p.34), la reunión
    previa entre Gómez e Ignacio Mariscal, CEO de Reale Seguros (auto de 11 de abril de 2026, p.25), se produjo
    por la intermediación de David Sanza, «amigo personal del Presidente del Gobierno»; Mariscal, que declaró como
    testigo, confirmó que ese año no mantuvo ninguna otra reunión de esas características. El mismo auto recoge
    que el 8 de febrero de 2024 María Cristina Álvarez, asesora de Gómez y hoy acusada en la causa (por presunta malversación), remitió un correo
    a representantes de Reale Seguros manifestando actuar «en nombre de Begoña» para interesar la continuidad del
    patrocinio (p.40). En septiembre de 2024 la Universidad Complutense decidió no renovar la cátedra, cuyo convenio
    de cuatro años expiraba, según El Español (11-09-2024) e Infobae (11-09-2024). La empresa no consta imputada
    y rige la presunción de inocencia respecto de todas las personas investigadas en la causa.'
  sources:
  - https://www.elespanol.com/espana/tribunales/20240911/complutense-rescinde-catedra-begona-gomez-imputacion-rector-goyache/885162031_0.html
  - https://www.infobae.com/espana/2024/09/11/la-complutense-decide-no-renovar-la-catedra-que-codirige-begona-gomez/
