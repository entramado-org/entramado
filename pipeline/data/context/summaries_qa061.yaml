- entity_id: Organization:oficina-de-artes-escenicas
  name: Oficina de Artes Escénicas
  resumen: 'La «Oficina de Artes Escénicas» es la denominación que recibió en la Diputación de Badajoz el puesto
    de David Sánchez Pérez-Castejón —hermano del presidente del Gobierno, Pedro Sánchez, y conocido artísticamente
    como David Azagra, según Libertad Digital (28-05-2026)— tras el cambio de nomenclatura del puesto de «Coordinador
    de las Actividades de los Conservatorios» a «Jefe de la Oficina de Artes Escénicas», con eliminación del componente
    de incompatibilidad (sentencia de la Audiencia Provincial de Badajoz de 14-07-2026, p.232). Según el escrito
    de la acusación popular, en su declaración judicial durante la instrucción David Sánchez titubeó al definir
    y ubicar la oficina (escrito de acusación, p.13); según Libertad Digital (28-05-2026), preguntado por dónde
    se encontraba respondió «No le podría decir, vamos, imagino que será en el despacho donde estoy alojado yo ahora»,
    y la juez instructora Beatriz Biedma apuntó que la Diputación había creado un puesto ad hoc para él. En el juicio,
    iniciado el 28 de mayo de 2026, varios testigos —directores de conservatorios y responsables de la Diputación—
    declararon ignorar qué era la oficina o dónde estaba ubicada (sentencia, p.128, p.130 y p.133-134). La Fiscalía
    no apreció delito y no formuló acusación; las acusaciones populares pidieron tres años de prisión e inhabilitación
    (Libertad Digital, 28-05-2026). La sentencia de 14 de julio de 2026 condenó a David Sánchez, como autor por
    cooperación necesaria de un delito de prevaricación administrativa por el cambio de nomenclatura de la plaza
    —que, según el tribunal, «enmascaraba la creación de una plaza de alta dirección con funciones radicalmente
    diferentes»—, a nueve años de inhabilitación especial para empleo o cargo público, y consideró prescrito el
    delito relativo a la creación del puesto inicial y no acreditado el tráfico de influencias (sentencia, p.357,
    p.360 y p.374). La condena no es firme: según Libertad Digital y EFE (vía Infobae, 23-07-2026), las defensas
    anunciaron recurso ante el TSJ de Extremadura. Rige la presunción de inocencia.'
  sources:
  - https://www.libertaddigital.com/espana/2026-05-28/las-claves-del-primer-dia-de-juicio-a-david-sanchez-donde-esta-la-oficina-de-artes-escenicas-7411250/
