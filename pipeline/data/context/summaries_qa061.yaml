- entity_id: Person:ignacio-mariscal
  name: Ignacio Mariscal
  resumen: 'Ignacio Mariscal es el consejero delegado de la aseguradora Reale Seguros (auto de 11 de abril de 2026,
    p.25). Fue citado por el juez Juan Carlos Peinado (Juzgado de Instrucción nº 41 de Madrid) para el 26 de agosto
    de 2024 (eldiario.es, 19-08-2024) y declaró ese mes como testigo en la causa que investiga a Begoña Gómez (Europa
    Press vía El Debate, 10-09-2024; auto de 20 de junio de 2026, p.34), por ser Reale patrocinadora fundacional
    de la cátedra que codirigía Gómez en la Universidad Complutense (auto de 20-06-2026, p.11). Según Europa Press
    (vía El Debate, 10-09-2024), Mariscal declaró que el contacto se produjo en agosto de 2020 a través de David
    Sanza, corredor de seguros amigo de Pedro Sánchez, que puso a Gómez en contacto con la aseguradora para que
    financiara la cátedra, y que fue Gómez quien planteó las condiciones del convenio: cuatro años y 15.000 euros
    anuales, 60.000 euros en total; el auto de 20 de junio de 2026 recoge esa intermediación de Sanza, «amigo personal
    del Presidente del Gobierno» (p.34). Declara como testigo; no consta investigado ni imputado, y rige la presunción
    de inocencia respecto de todas las personas de la causa.'
  sources:
  - https://www.hispanidad.com/politica/espana/caso-begona-gomez-juez-llama-declarar-como-testigos-consejero-delegado-reale-seguros-ignacio-mariscal-subdirector-fundacion-caixa-marc-simon_12053260_102.html
