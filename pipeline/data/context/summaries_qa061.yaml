- entity_id: Person:ion-fernando-antolin-llorente
  name: Ion Fernando Antolín Llorente
  resumen: 'Ion Fernando Antolín Llorente, periodista nacido en 1977 en Villalón de Campos (Valladolid), fue nombrado
    jefe de prensa y director de Comunicación del PSOE en 2022, según El Español (29-05-2026). Según el mismo medio,
    en diciembre de 2024 Pedro Sánchez lo nombró secretario de Estado de Comunicación y presentó su dimisión unos
    20 días después; no se trata, por tanto, de un cargo que ostente de forma continuada
    desde entonces. En el marco del llamado ''caso Leire Díez'', instruido por el juez Santiago Pedraz en la Audiencia
    Nacional, el auto de 26 de mayo de 2026 lo sitúa, como director de Comunicación del PSOE, en la reunión del
    26 de abril de 2024 en Ferraz que la investigación considera el punto de inflexión de la actividad investigada
    (p.7), le atribuye haber gestionado, por disposición de Santos Cerdán, el pago de una cantidad cercana a 20.000
    euros a la periodista Patricia López a través de una campaña de publicidad (p.11), y requiere el volcado de
    su buzón corporativo y de sus carpetas de red en el partido (p.38-39). No figura entre las personas a las que
    ese auto atribuye indicios de responsabilidad penal (p.19) y no consta en los documentos analizados que haya sido citado como
    investigado; según El Español (29-05-2026), el auto no lo presenta como coordinador de la maniobra y el papel
    que le atribuye se limita al ámbito de la comunicación. Rige la presunción de inocencia: es una investigación
    en curso y no hay hechos probados. El correo corporativo asociado a su antiguo cargo figura entre los que la
    UCO debía examinar.'
  sources:
  - https://www.elespanol.com/castilla-y-leon/region/valladolid/20260529/ion-antolin-periodista-villalon-campos-dircom-psoe-ahora-investiga-audiencia-nacional/1003744263996_0.html
