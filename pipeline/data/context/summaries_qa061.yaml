  - https://es.wikipedia.org/wiki/Ana_Mar%C3%ADa_Fuentes
  - https://www.libertaddigital.com/espana/2026-07-14/caso-cloacas-pedraz-cita-como-investigados-a-la-gerente-del-psoe-y-al-ex-abogado-de-koldo-7435287/
  - https://www.infobae.com/espana/agencias/2026/09/09/la-gerente-del-psoe-declara-que-seguia-ordenes-de-cerdan-al-autorizar-pagos-del-caso-leire/
