- entity_id: Person:pedro-sanchez
  name: Pedro Sánchez
  resumen: 'Pedro Sánchez Pérez-Castejón es presidente del Gobierno de España desde junio de 2018 y secretario general
    del PSOE desde 2017. Figura en esta base por su posición institucional y partidista al frente del PSOE, formación
    a la que pertenecían varios investigados en el caso Koldo/Cerdán: el exministro de Transportes José Luis Ábalos,
    el exsecretario de Organización Santos Cerdán (en prisión provisional entre el 30 de junio y el 19 de noviembre
    de 2025, según Infobae) y el exasesor Koldo García. Pedro Sánchez NO está imputado ni investigado en estas causas;
    aparece como referencia política y como responsable público de la dirección del partido, y su mención en esta
    ficha no implica responsabilidad penal alguna. Su entorno familiar es objeto de causas separadas: el auto del
    juez Peinado de 11 de abril de 2026 acordó continuar el procedimiento contra su esposa Begoña Gómez por los
    trámites del Tribunal del Jurado; el auto de apertura de juicio oral de 20 de junio de 2026 quedó retrotraído
    por la Audiencia Provincial de Madrid (auto de 16 de julio, según Infobae y EFE) y, según EFE, Peinado prevé
    dictar uno nuevo antes del 27 de septiembre de 2026; Gómez ha sido citada como testigo por la Fiscalía Europea
    por los contratos de Red.es adjudicados al empresario Juan Carlos Barrabés (The Objective); su hermano David
    Sánchez fue condenado el 14 de julio de 2026 por la Audiencia Provincial de Badajoz (sentencia 152/2026) como
    cooperador necesario de prevaricación administrativa a 9 años de inhabilitación —y absuelto de tráfico de influencias—
    por su contratación en la Diputación de Badajoz; la sentencia NO es firme y cabe apelación ante el TSJ de Extremadura.
    Estas causas siguen su curso y rige la presunción de inocencia para todos los implicados.'
