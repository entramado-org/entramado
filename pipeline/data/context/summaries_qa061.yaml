- entity_id: Company:grupo-cueto
  name: Grupo Cueto
  resumen: Grupo Cueto es el conglomerado familiar de empresas dirigido por Juan Carlos Cueto, al que la Fiscalía
    describe como titular real de Soluciones de Gestión y Ayuda a las Empresas SL (calificación fiscal, p.8). Según
    el informe de la Inspección de Hacienda (ONIF) que recoge la exposición razonada elevada al Tribunal Supremo
