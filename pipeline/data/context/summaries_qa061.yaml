- entity_id: Organization:wakalua
  name: Wakalua
  resumen: Wakalua (Wakalua Innovation Hub SL, constituida el 16 de enero de 2019) es un hub de innovación turística
    lanzado el 22 de enero de 2019 por el grupo Globalia en colaboración con la Organización Mundial del Turismo
    (OMT/UNWTO) y presentado como el primer hub global de innovación en turismo, ubicado en el Barrabés Growth Space
    de Madrid, espacio de la consultora de Juan Carlos Barrabés (nota de prensa de la
    OMT de 22 de enero de 2019; informe UCO sobre Barrabés, p.49-50); al acto de lanzamiento asistieron el secretario
    general de la OMT, Zurab Pololikashvili, el consejero delegado de Globalia, Javier Hidalgo, y Juan Carlos Barrabés
    (informe UCO, p.51). Es filial del grupo Globalia, del que también forma parte Air Europa (p.45 y p.49). Aparece
    en la causa de Begoña Gómez instruida por el juez Peinado porque el 17 de enero de 2020 se firmó un acuerdo
    entre el IE Africa Center, que ella dirigía, y Wakalua, proyecto en el que colaboraba Barrabés (auto de 11 de
    abril de 2026, p.2); según prensa citada por la UCO, era un contrato de 40.000 euros al año, cuya ejecución
    se interrumpió con la pandemia y del que solo se emplearon 1.716,53 euros en billetes a Londres para un evento
    del Africa Center de marzo de 2020 patrocinado por Wakalua (informe UCO, p.46); el IE afirmó no haber recibido
    aportación dineraria de Globalia ni de Wakalua (p.46). La denuncia origen de la causa apuntaba a Barrabés como
    quien puso en contacto a Begoña Gómez con Air Europa, pero la UCO no observó indicios de que Barrabés fuese
    la vía por la que ella inició su relación con Wakalua (p.44-45). La entidad no está investigada ni tiene responsabilidad
    penal acreditada; rige la presunción de inocencia.
  sources:
  - https://www.untourism.int/global/press-release/2019-01-24/wakalua-first-global-tourism-innovation-hub-launched-globalia-collaboration
  - https://www.libertaddigital.com/espana/politica/2025-05-12/los-tres-hechos-que-unen-a-begona-gomez-y-air-europa-y-ya-investiga-el-juez-wakalua-una-cita-y-una-llamada-de-hidalgo-7252753/
