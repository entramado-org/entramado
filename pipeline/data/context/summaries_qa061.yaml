- entity_id: Organization:policia-judicial
  name: Policía Judicial
  resumen: La Policía Judicial es la función policial de auxilio a la autoridad judicial y al Ministerio Fiscal
    en la averiguación de los delitos y el descubrimiento de sus responsables, regulada en la Ley de Enjuiciamiento
    Criminal (arts. 282-283), que incluye entre quienes la constituyen a las autoridades y agentes de la policía
    de seguridad y a la Guardia Civil. En estas causas la ejercen unidades de la Guardia Civil, como la UCO, órgano
    central de su servicio de Policía Judicial (según Wikipedia; DS_C_15_756, p.16), y del Cuerpo Nacional de Policía,
    como la UDEF, dependiente de la Comisaría General de Policía Judicial (según Newtral, 22 de febrero de 2022).
    En el auto de entrada y registro de la causa de Plus Ultra (auto-zapatero), la UDEF solicitó registros, volcados
    in situ de los teléfonos de los investigados y la habilitación de funcionarios de Policía Judicial para abrir
    comunicaciones en presencia del Letrado de la Administración de Justicia (p.5 y p.7); el juez recuerda que la
    Policía Judicial ejecuta el registro por delegación del juez (p.77), rechaza habilitarla para abrir correspondencia
    escrita, reservada al juez (p.78), y autoriza el acceso, volcado y copia de los dispositivos para su análisis
    por la UDEF, señalando que la ley procesal no impone la presencia del Letrado en el volcado (p.84). No es una
    entidad imputable, sino el brazo operativo de la instrucción.
  sources:
  - https://www.boe.es/buscar/act.php?id=BOE-A-1882-6036
  - https://es.wikipedia.org/wiki/Unidad_Central_Operativa
