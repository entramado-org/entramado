- entity_id: Organization:plataforma-de-contratacion-del-sector-publico
  name: Plataforma de Contratación del Sector Público
  resumen: 'La Plataforma de Contratación del Sector Público (PLACSP, antes Plataforma de Contratación del Estado
    o PLACE, dominio contrataciondelestado.es) es, según Gobierto, la plataforma que concentra la mayor parte de
    la información de contratación pública en España y sirve de punto de encuentro entre compradores públicos y
    operadores económicos, con la contratación de la Administración General del Estado y su sector público, la mayoría
    de entes locales, comunidades autónomas y otras entidades. No es un actor de la trama, sino una fuente documental:
    en el informe de la UCO sobre la trama Cerdán/Ábalos se consulta el portal para acreditar las licitaciones de
    obra pública investigadas (de él «se extrae que, salvo un contrato de emergencia, las licitaciones investigadas
    fueron sometidas a procedimiento abierto», informe UCO, p.23), para localizar los expedientes de ADIF Alta Velocidad
    compatibles con las adjudicaciones aludidas por Koldo (p.69) y el expediente de la autovía A-68 de la Dirección
    General de Carreteras (p.73); la auditoría interna del Ministerio de Transportes de 19 de agosto de 2024 señala
    que la adjudicación de Puertos del Estado a Soluciones de Gestión se publicó en la PLACSP el 27 de abril de
    2020 (p.41). Es un registro consultado por los investigadores, no una entidad imputable.'
  sources:
  - https://www.gobierto.es/blog/plataforma-de-contratacion-del-sector-publico-placsp
