- entity_id: Person:ana-maria-fuentes-pacheco
  name: Ana María Fuentes Pacheco
  resumen: 'Ana María Fuentes Pacheco (Ronda, Málaga, 1 de mayo de 1972, según Wikipedia) es licenciada en Derecho
    y dirigente del PSOE. Según Wikipedia, fue diputada por Málaga en el Congreso (2004-2011), trabajó en cumplimiento
    normativo en la empresa privada (Atento, SegurCaixa Adeslas), fue profesora de Derecho Constitucional en la
    Universidad Carlos III y profesora asociada en la Complutense, dirigió la Oficina de Cumplimiento Normativo
    del PSOE (2018-2021) y es directora gerente del partido desde el 19 de octubre de 2021 a propuesta de Santos
    Cerdán (el informe de la UCO, p.370, recoge que Cerdán declaró haber propuesto su nombramiento); según Demócrata
    (27-05-2026), desde la gerencia supervisaba contratos, facturación, presupuestos y pagos internos del partido.
    Tras la dimisión de Cerdán, el 16 de junio de 2025 fue nombrada miembro de la Secretaría de Organización del
    PSOE con carácter provisional, hasta el Comité Federal del 5 de julio, según Wikipedia. En el caso Leire Díez
    (Audiencia Nacional, DP 150/2025), el auto de 26 de mayo de 2026 del juez Santiago Pedraz que autorizó la entrada
    de la UCO en Ferraz describe su «indiciaria responsabilidad», al menos como cómplice, y «en todo caso, como
    autora del posible delito de falsedad en documento mercantil», por emitir las órdenes de encargo sobre las que
    se elaboraron facturas que el auto califica de mendaces para transferir fondos a Leire Díez (p.19); una de esas
    notas de encargo, suscrita por ella como directora gerente federal, amparó un pago del PSOE de 27.225 € a Estudio
    Jurídico I. Oliver & Partners (p.11). Según Demócrata (27-05-2026) y Vozpópuli (28-05-2026), quedó investigada
    tras el registro de la UCO en Ferraz; según Libertad Digital (14-07-2026), Pedraz la citó a declarar como investigada
    el 9 de septiembre de 2026, y según EFE (vía Infobae, 09-09-2026) declaró ese día que autorizó los pagos a los
    abogados Jacobo Teijelo e Ismael Oliver después de que Cerdán validara sus servicios y que no conocía a Leire
    Díez. Es una instrucción en curso: no está acusada ni condenada y rige plenamente la presunción de inocencia.'
  sources:
