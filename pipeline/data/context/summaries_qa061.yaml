- entity_id: Organization:otri
  name: OTRI
  resumen: 'OTRI son las siglas de la Oficina de Transferencia de Resultados de Investigación (hoy Oficina de Transferencia
    de Conocimiento) de la Universidad Complutense de Madrid, la unidad encargada de gestionar la propiedad intelectual
    e industrial y el registro de los resultados generados en la universidad. Aparece en la causa de Begoña Gómez
    instruida por el juez Peinado: según el auto de 11 de abril de 2026, el software o plataforma desarrollado para
    la Cátedra de Transformación Social Competitiva, por ser una obra creada por y para la UCM, debía registrarse
    a través de la OTRI (p.4); entre el 6 de septiembre y el 7 de octubre de 2022 Begoña Gómez y Cristina Álvarez
    se interesaron por ese registro y el personal de la OTRI les remitió información dirigiéndose a ellas como «autoras»
    (p.28-29); el 6 de octubre de 2022 la OTRI les envió el contrato de cesión de derechos sobre el software a favor
    de la UCM y, según el auto, tras ello se interrumpió la comunicación con la oficina (p.28 y p.31), retomando
    la OTRI las gestiones en febrero de 2023 sin respuesta (p.29); el auto de apertura de juicio oral de 20 de junio
    de 2026 señala que el procedimiento no llegó a culminarse por no remitirse la documentación requerida por la
    universidad (p.50). Según el juez, tras la remisión de la cesión de derechos se solicitó a título personal el
    registro de una marca que incorporaba el dominio en el que se alojaba el software (p.28-29). La defensa sostiene
    que no se registró porque el programa no estaba terminado (p.7 y p.11). Personal de la OTRI declaró como testigo;
    la OTRI no es investigada.'
  sources:
  - https://www.ucm.es/otri/quienes-somos-
  - https://www.libertaddigital.com/espana/politica/2026-04-26/la-prueba-que-acorrala-a-begona-gomez-en-el-software-eludio-el-registro-del-programa-en-la-complutense-1b-7394002/
  - https://www.eldebate.com/espana/20250925/juez-peinado-encarga-uco-investigue-adjudicacion-software-begona-gomez-mails-complutense_338120.html
  updated: '2026-09-15'
  reason: '061 revisión humana T0d 2026-09-15 (Fable, dueño): 8b38b83c: «enlaces» retirado (solo alegación de defensa
    sobre el dominio, auto 11-04-2026 p.7); titularidad reformulada como envío del contrato de cesión a favor de
    la UCM (p.28, p.31); cronología y páginas del auto añadidas; «organismo perjudicado» sustituido por «su personal
    declaró como testigo»; añadida la tesis de la defensa (p.7, p.11) por equilibrio.'
