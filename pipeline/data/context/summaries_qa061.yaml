- entity_id: Person:francisco-flores
  name: Francisco Flores
  resumen: 'Francisco Flores es el contacto grabado como ''Fco Flores'' en la agenda de Julio Martínez Martínez
    con el que este intercambió los borradores del contrato entre Softgestor y Análisis Relevante; el informe de
    la UDEF (nº 1907, p.158) y el auto de la Audiencia Nacional de 18 de mayo de 2026 (p.72) señalan que «podría
    corresponderse» con el empresario venezolano Francisco Enrique Flores Suárez, ajeno formalmente a Softgestor.
    Según ese auto, Softgestor ordenó dos transferencias a Análisis Relevante por un total de 145.200 euros (p.71)
    y la gestión de esos pagos no la realizaba su administrador sino Flores Suárez, lo que lleva al instructor a
    calificar la sociedad de mero vehículo instrumental (p.72). Tanto la UDEF (informe 1907, p.164) como el auto
    (p.46) aprecian indicios de artificiosidad en la configuración formal de contratos y facturas (facturas con
    numeración idéntica y fechas distintas), sin que conste acreditada la prestación efectiva de los servicios (auto,
    p.72). Según Infobae (25-05-2026), era dueño del grupo empresarial y la fundación ligados a la entidad Sofitasa;
    informaciones periodísticas recogidas por la UDEF (p.158) y por El Independiente (25-05-2026) lo vinculan con
    una investigación del Tribunal Central de Instancia nº 2 sobre presunta financiación irregular del PSOE y de
    la Internacional Socialista, sin que en los documentos analizados conste resolución que lo declare investigado en esa causa.
    Falleció el 6 de febrero de 2026, según informaciones periodísticas recogidas en el informe de la UDEF (p.158)
    y por El Independiente (25-05-2026). Todo se halla en fase de instrucción: rige la presunción de inocencia y
    no le ha sido atribuida responsabilidad penal firme.'
  sources:
  - https://www.infobae.com/espana/2026/05/25/los-hermanos-amaro-chacon-y-francisco-flores-quienes-son-los-empresarios-venezolanos-vinculados-al-entorno-de-zapatero-en-el-caso-plus-ultra/
