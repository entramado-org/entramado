- entity_id: Organization:finance-boutique
  name: Finance Boutique
  resumen: '«Finance boutique» (o «boutique financiera») es la denominación con la que, según el auto de 18 de mayo
    de 2026 del instructor del caso Plus Ultra, los propios investigados se referían a la estructura mercantil montada
    en torno a Julio Martínez Martínez para su presunta actividad de tráfico de influencias: el 18 de mayo de 2020
    Roberto Roselli comentó a Rodolfo Reyes que «montaron su finance boutique. Así que por ahí vendrá la mordida»,
    y el 16 de junio de 2020 Reyes preguntó si «la boutique financiera» había puesto precio a sus servicios (auto
    de 18 de mayo de 2026, p.14-15); el auto señala que «los propios investigados se refieren como “equipo” y “boutique
    financiera” a este grupo» (p.29) y el informe de la UDEF 1907/26, de 22 de abril de 2026, también habla de «la
    boutique» para designar esas sociedades (informe UDEF, p.35 y p.79-80). Según el auto, los pagos al entorno
    societario se habrían formalizado mediante contratos, generalmente de asesoría o consultoría, «utilizados como
    mera justificación documental frente a terceros»; el «principal beneficiario final» de los ingresos sería José
    Luis Rodríguez Zapatero, y la gestión cotidiana de la red correspondería a un tercer nivel integrado por María
    Gertrudis Alcázar Jiménez, «secretaria de la oficina de José Luis Rodríguez Zapatero», y Cristóbal Cano Quiles
    (auto, p.28), a quienes atribuye «funciones de coordinación, elaboración y cobertura formal de la documentación
    que sustenta las actuaciones de la red —también denominada Finance Boutique—» (auto, p.66); el informe de la
    UDEF sitúa la red «bajo el liderazgo de José Luis Rodríguez Zapatero», con Julio Martínez Martínez y Manuel
    Aaron Fajardo como «lugartenientes» (informe UDEF, p.79). Son hechos en fase de instrucción en las diligencias
    previas 77/2024 de la Sección de Instrucción del Tribunal Central de Instancia, plaza nº 2 (juez José Luis Calama);
    todos los implicados están amparados por la presunción de inocencia. El término designa la red, no una sociedad
    concreta.'
  sources: []
  updated: '2026-09-15'
