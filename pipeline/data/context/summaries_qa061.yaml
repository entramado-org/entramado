- entity_id: Person:tatiana-abalos
  name: Tatiana Ábalos
  resumen: Tatiana Ábalos es una de las hijas del exministro de Transportes y exsecretario de Organización del PSOE
    José Luis Ábalos. Según el informe de la UCO de 5 de junio de 2025 incorporado a la causa del Tribunal Supremo
