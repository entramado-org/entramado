- entity_id: Organization:presidencia-del-gobierno
  name: Presidencia del Gobierno
  resumen: La Presidencia del Gobierno (Moncloa) es el órgano que asiste al presidente del Gobierno de
    España. En el caso Begoña Gómez aparece porque María Cristina Álvarez Rodríguez fue contratada por
    la Presidencia del Gobierno en julio de 2018 como personal eventual de su Secretaría General, con
    sueldo público, y sus funciones quedaron ligadas a la agenda de Begoña Gómez (auto de 20 de junio
    de 2026, pp. 29 y 38). El juez Peinado investiga si parte del tiempo y los medios públicos de ese
    puesto se dedicaron a gestiones privadas de la esposa del presidente, lo que fundamentaría el presunto
    delito de malversación. La organización figura como contexto institucional del empleo público investigado,
    sin que ello implique atribución de responsabilidad a la institución; rige la presunción de inocencia.
  sources: []
  updated: '2026-09-09'
  reason: '061 revisión humana T0 2026-09-09 (Fable, dueño): fe8a53d1: el auto habla de Presidencia/Secretaría
    General, no de «Gabinete»'
- entity_id: Person:maria-cristina-alvarez-rodriguez
  name: María Cristina Álvarez Rodríguez
  resumen: María Cristina Álvarez Rodríguez es la asesora de Begoña Gómez, contratada en julio de 2018 por la Presidencia
    del Gobierno como personal eventual de su Secretaría General (Moncloa), según el auto de 20 de junio de 2026.
    Desde el auto de apertura de juicio oral de 21 de septiembre de 2026 (p.65) está acusada en el caso Begoña Gómez solo de presunta malversación de caudales públicos, como cooperadora necesaria y exclusivamente en relación con el desvío del software. Durante la instrucción el juez Peinado la investigó por malversación al sospecharse que, cobrando un sueldo público, dedicó tiempo y medios a gestiones privadas de la
    esposa del presidente vinculadas a la cátedra y el máster de la UCM. El juez propuso juicio con jurado y, según
    El Español (26 de mayo de 2026), la citó junto a Begoña Gómez y al empresario Juan Carlos Barrabés a la audiencia
    previa convocada para el 9 de junio de 2026; según el auto de 20 de junio, la audiencia preliminar se celebró
    finalmente el 15 de junio. Según Infobae (16 de julio de 2026), un auto de la Sección 23 de la Audiencia Provincial de Madrid limitó el juicio con jurado a los presuntos delitos de tráfico de influencias y malversación,
    y según EFE (6 de septiembre de 2026) reordenó el procedimiento retrotrayéndolo a abril, por lo que las partes
    volvieron a presentar sus escritos. Según Libertad Digital y Vozpópuli, el 28 de julio de 2026 la Fiscalía comunicó
