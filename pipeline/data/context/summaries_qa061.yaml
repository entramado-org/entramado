- entity_id: Person:angel-contreras
  name: Ángel Contreras
  resumen: 'Ángel Contreras Marín (Torrent, Valencia, 1975) es ingeniero de caminos, canales y puertos que ha desarrollado
    su carrera en Adif desde 2011, donde fue director general de Conservación y Mantenimiento (2018-2023) y, entre
    el 8 de diciembre de 2023 (Real Decreto 1049/2023) y el 17 de septiembre de 2024 (Real Decreto 935/2024), presidente
    de Adif y Adif Alta Velocidad, según Wikipedia; el ministro Óscar Puente desvinculó su cese del caso Koldo,
    según EFE (16-09-2024, citado por Wikipedia). En el informe de la UCO del caso Koldo/Cerdán, un mensaje de WhatsApp
    de 19 de febrero de 2024 del empresario Daniel Fernández Menéndez (Obras Públicas y Regadíos, OPR) a Koldo García
    pide que una obra de emergencia de Adif se adjudique a OPR y afirma que «Ángel» —«en presumible referencia a
    Ángel Contreras, presidente de Adif en esa fecha», según la UCO— sabía que les habían detraído 600.000 euros
    del expediente original y debía ayudarles (informe UCO, p.141; El Independiente, 20-05-2024). El 27 de noviembre
    de 2023 Koldo había reenviado a los hermanos Fernández Menéndez la noticia de su nombramiento como presidente
    de Adif (informe UCO, p.120). Compareció ante la comisión de investigación del Senado sobre el caso Koldo el
    4 de junio de 2024 (Wikipedia; DS Senado 233, p.31). No consta que haya sido investigado ni imputado y rige
    plenamente la presunción de inocencia: las fuentes lo describen como mencionado en informes de la UCO, no como
    investigado, imputado ni condenado.'
  sources:
  - https://es.wikipedia.org/wiki/%C3%81ngel_Contreras
  - https://www.elindependiente.com/espana/tribunales/2024/05/20/la-uco-ubica-al-presidente-de-adif-en-amanos-de-la-trama-del-caso-koldo/
  updated: '2026-09-15'
  reason: '061 revisión humana T0d 2026-09-15 (Fable, dueño): Retirada la frase sin fuente sobre la relación ''social''
