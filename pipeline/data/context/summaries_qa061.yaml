- entity_id: Organization:direccion-general-de-aviacion-civil
  name: Dirección General de Aviación Civil
  resumen: 'La Dirección General de Aviación Civil (DGAC) es un órgano integrado en el Ministerio de Transportes
    y Movilidad Sostenible (informe UDEF 1908/2026, p.115). Aparece en la causa del rescate de Plus Ultra (Diligencias
    Previas 77/2024 del Tribunal Central de Instancia; auto de 18 de mayo de 2026 firmado por el juez José Luis
    Calama) porque emitió el informe «Análisis de la actividad de la compañía aérea Plus Ultra», fechado el 18 de
    febrero de 2021 y firmado electrónicamente por su director general, Raúl Medina Caballero, el 24 de febrero
    de 2021; la Agencia Estatal de Seguridad Aérea (AESA), también del Ministerio, emitió a petición de la SEPI
    otro informe sobre la situación económico-financiera de la aerolínea (informe UDEF 1908, p.115 y nota 126; informe
    UDEF 1907, p.47). La ayuda de la SEPI ascendió a 53 millones de euros (auto de 18 de mayo de 2026, p.24). En
    la comisión de investigación del Senado sobre la SEPI, el senador Hernando García sostuvo que, según el Tribunal
    de Cuentas, solo dos informes —el de AESA y el de la DGAC— acreditaban el carácter estratégico de Plus Ultra
    y que ambos dependían del Ministerio de Transportes (Diario de Sesiones del Senado, DS 754, p.12). Los informes
    policiales recogen además un mensaje de Julio Martínez Sola del 1 de septiembre de 2020: «Será o no casualidad,
    me llamaron de la DGAC esta mañana ref a esto» (informe UDEF 1908, p.18 y p.80). La DGAC no consta investigada;
    figura como organismo cuyo informe se cita en el procedimiento en el que el expresidente José Luis Rodríguez
    Zapatero está investigado, rigiendo plenamente la presunción de inocencia.'
