- entity_id: Person:koldo-garcia
  name: Koldo García
  resumen: Koldo García Izaguirre fue chófer, escolta y luego asesor de confianza de José Luis Ábalos durante su
    etapa como ministro de Transportes (2018-2021) y da nombre al 'caso Koldo', investigación sobre una trama de
    comisiones por contratos públicos, en particular la adjudicación de contratos de mascarillas durante la pandemia.
    Según Wikipedia, fue detenido en febrero de 2024 por la Guardia Civil en la Operación Delorme y el juez instructor
    lo dejó en libertad el 22 de febrero; el auto del Juzgado Central de Instrucción nº 2 de 22 de febrero
    de 2024 le impuso medidas cautelares. El 27 de noviembre de 2025 el juez instructor del Tribunal Supremo Leopoldo
    Puente acordó su prisión provisional por riesgo de fuga. El 22 de junio de 2026 la Sala Segunda del Tribunal
    Supremo, en la sentencia núm. 418/2026 (Causa Especial 20775/2020), lo CONDENA como autor —y, en la malversación,
    como cooperador necesario— de un delito de pertenencia a organización criminal (art. 570 bis CP), cohecho continuado
    (art. 419 CP), tráfico de influencias y malversación de caudales públicos, con penas de prisión e inhabilitación,
    y lo ABSUELVE de los delitos de prevaricación, uso de información privilegiada y falsedad de los que también
    venía acusado. Junto a José Luis Ábalos debe indemnizar conjunta y solidariamente a INECO (34.450 €) y a TRAGSATEC
    (9.500,54 €); el decomiso de 430.298 € de ganancias del cohecho se acuerda respecto de los tres condenados.
    La sentencia, dictada en instancia única ante el Supremo, es firme.
