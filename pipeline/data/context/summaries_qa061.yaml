- entity_id: Person:juan-carlos-doadrio
  name: Juan Carlos Doadrio
  resumen: Juan Carlos Doadrio Villarejo fue vicerrector de Relaciones Institucionales de la Universidad Complutense
    de Madrid (auto de 11 de abril de 2026, p.2) y participó en la tramitación de la Cátedra de Transformación Social
    Competitiva codirigida por Begoña Gómez. Declaró como testigo ante el juez y, el 10 de diciembre de 2025, ante
    la comisión de investigación del Senado sobre el caso Koldo, donde, según elDiario.es y El Independiente (10-12-2025),
    afirmó que se sintió «obligado por el cargo», aunque no presionado, a crear la cátedra («las cátedras las tengo
    que hacer yo. Si está bien la documentación, me da igual que se llame Begoña Gómez o que se llame Pedro Sánchez»),
    reiteró que la documentación presentada «estaba correcta», sostuvo que la asesoría jurídica de la universidad
    avaló que Gómez codirigiera esos estudios sin ser licenciada o graduada, y dijo que el rector Joaquín Goyache
    «estaba muy contento con Begoña Gómez». Figura como testigo, no como investigado. Rige la presunción de inocencia.
