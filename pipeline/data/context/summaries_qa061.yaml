- entity_id: Company:whathefav-sl
  name: Whathefav SL
  resumen: 'Whathefav SL es una agencia de marketing y comunicación (Infobae, 24 de mayo de 2026) cuyas administradoras
    y socias son Alba y Laura Rodríguez Espinosa, hijas del expresidente José Luis Rodríguez Zapatero (auto de 18
    de mayo de 2026, p.28 y p.69); según Infobae, la sociedad comenzó sus operaciones en 2019 con un capital de
    3.000 euros. En la instrucción del caso Plus Ultra (diligencias previas 77/2024, juez José Luis Calama, Audiencia
    Nacional), el auto de 18 de mayo de 2026 concluye que la sociedad «actúa como elemento finalista del entramado»,
    «opera como centro de redistribución de flujos económicos, canalizando pagos hacia José Luis Rodríguez Zapatero
    y su entorno» y «genera facturación ad hoc destinada a dotar de cobertura formal movimientos financieros carentes
    de actividad económica real» (p.69-70). Según el mismo auto, las cuentas de Análisis Relevante reflejan pagos
    a Whathefav por 239.755,01 euros entre el 9 de junio de 2020 y el 2 de diciembre de 2025 (p.31 y p.48) e Inteligencia
    Prospectiva le pagó 561.440 euros (p.44); según El Independiente (25 de mayo de 2026), la UDEF sostiene que
    la sociedad habría recibido en total más de 985.000 euros de distintas empresas vinculadas al entorno de Zapatero.
    Según El Independiente (18 de junio de 2026), el juez Calama acordó citar como investigadas a Alba y Laura Rodríguez
    Espinosa; según The Objective (21 de julio de 2026), Julio Martínez Martínez admitió ante el juez que Análisis
    Relevante siguió abonando a Whathefav una iguala de 3.000 euros mensuales hasta 2025 aunque desde 2022 no realizaban
    trabajo alguno. Las caracterizaciones proceden de una instrucción en curso: no existe sentencia ni culpabilidad
    probada, y la sociedad, sus administradoras y Zapatero están amparados por la presunción de inocencia.'
