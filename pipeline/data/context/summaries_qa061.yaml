- entity_id: Company:instalibero-district-sl
  name: Instalibero District SL
  resumen: 'Instalibero District SL es una sociedad administrada por Manuel Sallés Carceller (exposición razonada
    de 23 de octubre de 2024, p.23, citando el informe UCO 107/23), a quien la prensa sitúa como investigado en
    la trama de los hidrocarburos (El Español, 24-01-2025: imputado en el caso Gaslow y citado a declarar como investigado
    en la Audiencia Nacional; Libertad Digital, 15-12-2025). Según la exposición razonada (p.23) y el escrito de
    la defensa de Aldama (p.27), Koldo García consta como empleado por cuenta ajena de la sociedad en 2022, con
    20.416,67 euros percibidos ese año, y Sallés y Koldo montaron un despacho conjunto en la calle Velázquez de
    Madrid, donde la sociedad tiene también su domicilio social. Según un informe de la UCO al que tuvo acceso Libertad
    Digital (15-12-2025), la contratación consta acreditada desde el 27 de enero de 2022, con un sueldo de 1.950,50
    euros mensuales, «bajo la apariencia de un puesto de consultor en seguridad». La UCO investiga esa contratación
    como presuntamente ''fantasma'', al no constar ''prestación efectiva de servicios'', y consta que Koldo recibió
    además transferencias adicionales (entre ellas 5.000 euros como ''anticipo'' en febrero de 2022) (Libertad Digital,
    15-12-2025). Todo ello se enmarca en una investigación en curso, con presunción de inocencia para las personas
    y sociedades implicadas.'
  sources:
