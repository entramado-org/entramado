- entity_id: Person:luis-diaz-olivero
  name: Luis Díaz Olivero
  resumen: Luis Díaz Olivero figura en el informe UDEF nº 2910/26 como vicepresidente de la División de Cementos,
    Concretos y Cal del Grupo Gloria (según «fuentes abiertas» que recoge el informe, p.50; «vicepresidente de Grupo
    Gloria», p.14 y 63), conglomerado industrial de capitales peruanos (p.7) al que pertenece la cementera boliviana
    SOBOCE (p.61). Según el informe, participó en una videoconferencia con José Luis Rodríguez Zapatero el 28 de
    mayo de 2024 (p.14) y mantuvo con él una reunión presencial en Madrid el 25 de octubre de 2024 (p.17 y 50);
    además, el 3 de diciembre de 2024 se le señala, junto a Ana María Ospina y Francisco Shwortshik, como asistente
    previsto a una reunión que se habría conseguido fijar con el ministro de Justicia de Bolivia, César Siles (p.17
    y 51), sin que el informe acredite su celebración ni su fecha. La UDEF investiga estos contactos como parte
    de una presunta dinámica de intermediación e influencia ante el Gobierno boliviano; rige la presunción de inocencia.
