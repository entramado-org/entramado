- entity_id: Person:jose-luis-calama-teixeira
  name: Jose Luis Calama Teixeira
  resumen: 'José Luis Calama Teixeira es magistrado de la Audiencia Nacional. Según Vozpópuli, nació en Salamanca
    el 20 de mayo de 1959, ingresó en la carrera judicial en 1988 y desde 2018 es titular del Juzgado Central de
    Instrucción nº 4, donde sucedió a Fernando Andreu; en sus resoluciones de 2026 firma como magistrado-juez de
    la plaza nº 2 de la Sección de Instrucción del Tribunal Central de Instancia (auto de 18 de mayo de 2026, p.87).
    Según Vozpópuli, ha instruido el caso Pegasus, que sobreseyó provisionalmente por segunda vez en enero de 2026
    ante la falta de cooperación de Israel, y el caso Banco Popular, cuya instrucción cerró en marzo de 2024 proponiendo
    juzgar a Ángel Ron. Es el juez instructor del caso Plus Ultra (diligencias previas 77/2024): en auto de 18 de
    mayo de 2026 citó como investigado al expresidente José Luis Rodríguez Zapatero para el 2 de junio (auto, p.87)
    y el 19 de mayo levantó el secreto de las actuaciones (nota del Consejo General del Poder Judicial, 19-05-2026);
    el auto describe a Zapatero como «el núcleo decisor y estratégico de la red» (p.58) en una presunta trama de
    tráfico de influencias en torno al rescate de 53 millones de euros que la SEPI concedió a la aerolínea (p.24
    y p.28). Según El Español y The Objective (25-05-2026), dictó órdenes internacionales de detención contra Rodolfo
    José Reyes Rojas, principal accionista de Plus Ultra, su esposa María Aurora López y Simon Leendert Verhaoeven.
    Su papel es estrictamente jurisdiccional: instruye la causa, no es parte investigada.'
  sources:
  - https://www.vozpopuli.com/tribunales/quien-es-jose-luis-calama-el-juez-que-ha-imputado-a-jose-luis-rodriguez-zapatero-por-el-caso-plus-ultra.html
  - https://www.poderjudicial.es/cgpj/es/Poder-Judicial/Noticias-Judiciales/----La-Audiencia-Nacional-cita-al-expresidente-Jose-Luis-Rodriguez-Zapatero-como-investigado-por-delitos-de-trafico-de-influencias-y-otros-conexos
