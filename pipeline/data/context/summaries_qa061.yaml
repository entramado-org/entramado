- entity_id: Person:antonio-fernandez-menendez
  name: Antonio Fernández Menéndez
  resumen: 'Antonio Fernández Menéndez es un empresario granadino vinculado a la empresa Obras Públicas y Regadíos
    (OPR), de la que es apoderado desde el 24 de agosto de 2023 (informe UCO, p.106). El Tribunal Supremo abrió
    una pieza separada por presuntas comisiones a cambio de adjudicaciones de obra pública en el marco del caso
    Koldo, que afecta también a Santos Cerdán, José Luis Ábalos y Koldo García. Según el informe de la UCO de la
    Guardia Civil (p.107), Antonio y su hermano Daniel Fernández Menéndez están unidos por lazos familiares (cuñados)
    con Fernando Merino, exdirectivo de Acciona en Navarra, quien habría sido quien los introdujo ante Koldo García;
    Antonio habría actuado como mediador entre la empresa OPR y cargos públicos. Según COPE (04-07-2025), el Supremo
    ordenó registrar su domicilio y el de su hermano y los citó a declarar en julio de 2025 (la UCO había solicitado
    el mandamiento de entrada y registro en su domicilio de Baza: informe UCO, p.414); según Infobae (04-07-2025),
    los tres empresarios citados —José Ruz y los hermanos Fernández Menéndez— negaron haber pagado comisiones a
    Ábalos y Koldo García. Rige la presunción de inocencia: figura como investigado y no consta condena.'
  sources:
