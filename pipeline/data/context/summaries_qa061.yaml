    del think tank Gate Center (auto de 18 de mayo de 2026, p.49). En el marco del caso Plus Ultra, el auto del
    juez José Luis Calama y el informe UDEF 1907 examinan los pagos del grupo a la cuenta del expresidente José
    Luis Rodríguez Zapatero: 37 transferencias por 649.552 euros de Thinking Heads Group SL y 2 transferencias por
    31.766,04 euros de Thinking Heads Americas LLC, 681.318,04 euros en total, que según esas fuentes procederían
    del pago de facturas por la prestación de servicios profesionales derivados de la actividad actual del expresidente,
    «centrada en la participación en conferencias internacionales, labores de mediación, asesoramiento estratégico,
    así como actividades de análisis, reflexión y docencia» (auto, p.49-50; informe UDEF 1907, p.172); Thinking
    Heads Group habría remitido además 12.297 euros a Whathefav SL, la sociedad de las hijas del expresidente (auto,
    p.49-50). Ni el grupo ni su administrador figuran como investigados en el auto; rige la presunción de inocencia
    y no consta resolución judicial que declare irregularidad alguna en esos pagos.'
