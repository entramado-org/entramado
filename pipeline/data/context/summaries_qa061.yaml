- entity_id: Person:carlos-alberto-parra-delgado
  name: Carlos Alberto Parra Delgado
  resumen: Carlos Alberto Parra Delgado es administrador único y titular del 65% de Softgestor SL, sociedad señalada
    en el auto de 18 de mayo de 2026 de las Diligencias Previas 77/2024 de la Sección de Instrucción del Tribunal
    Central de Instancia (Audiencia Nacional, juez José Luis Calama; 'caso Plus Ultra') (pp.45 y 71) y que figura
    en la causa «en calidad de investigada», según Estrella Digital (23-05-2026). Es también administrador único
    de Apamate Corporate and Trust SL, participada al 99,6% por Softgestor, lo que según el auto configura un grupo
    societario bajo su control efectivo (auto de 18 de mayo de 2026, p.71). El auto califica a Softgestor de vehículo
    instrumental de canalización de fondos mediante contratos de asesoría internacional sin contenido real, con
    dos transferencias de 72.600 euros (30-10-2020 y 16-09-2021; 145.200 euros en total) a Análisis Relevante SL,
    y concluye que la gestión de esos pagos no la realizaba su administrador sino un contacto grabado en la agenda
    de Julio Martínez Martínez como «Fco Flores», «no identificado» (auto de 18 de mayo de 2026, p.46), que el auto
    dice que «podría corresponderse» con el empresario venezolano Francisco Enrique Flores Suárez, ajeno formalmente
    a la sociedad (p.72). El informe UDEF 1907/26 recoge, «según fuentes abiertas», que Apamate estaría relacionada
    con un pago de 300.000 euros el 3 de enero de 2020 a Deluxe Fortune SL, empresa relacionada con Víctor de Aldama
    (informe UDEF 1907/26, p.160). No debe confundirse con Carlos Alfonso Parra Delgado, su hermano, a quien el
    informe UDEF y el auto identifican como perceptor de pagos de Softgestor por 86.756,83 euros en 2020-2024 (informe
    UDEF 1907/26, p.157; auto, p.45). No consta su imputación personal; la causa sigue en instrucción y rige la
    presunción de inocencia.
