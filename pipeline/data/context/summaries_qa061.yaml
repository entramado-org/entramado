- entity_id: Person:begona-gomez
  name: Begoña Gómez
  resumen: 'María Begoña Gómez Fernández es la esposa de Pedro Sánchez, presidente del Gobierno de España (auto
    de 20 de junio de 2026, p.29). Profesionalmente fue directora de consultoría en el Grupo Inmark (informe de
    la Guardia Civil), directora del IE Africa Center entre agosto de 2018 y junio de 2022 (informe UCO), codirectora
    desde el curso 2014/15 del Máster Propio en Dirección de Fundraising de la Universidad Complutense de Madrid,
    suspendido el 7 de octubre de 2024 (auto de 11 de abril de 2026, p.2), y directora de la Cátedra Extraordinaria
    de Transformación Social Competitiva de la UCM, constituida en octubre de 2020 y que, según Wikipedia, la universidad
    comunicó en septiembre de 2024 que no renovaría. Está acusada, por el auto de apertura de juicio oral de 21 de septiembre de 2026, en la causa instruida por el juez Juan Carlos Peinado en el Juzgado de Instrucción nº 41 de Madrid, incoada el 16 de abril de 2024 a raíz de una denuncia de la asociación Manos Limpias. A lo largo de la instrucción se le atribuyeron presuntos
    delitos de tráfico de influencias, corrupción en los negocios, malversación, apropiación indebida e intrusismo,
    en relación con su actividad vinculada a la Complutense y con contactos empresariales. En 2026 el juez cerró
    la fase de instrucción y propuso enviarla a juicio con jurado popular por cuatro presuntos delitos (corrupción
    en los negocios, malversación, tráfico de influencias y apropiación indebida), descartando el de intrusismo;
    el auto de apertura de juicio oral de 20 de junio de 2026 quedó después sin recorrido: según Infobae (16 de
    julio de 2026), un auto de la Sección 23 de la Audiencia Provincial de Madrid limitó el juicio
    con jurado a los presuntos delitos de tráfico de influencias y malversación, y según EFE (6 de septiembre de
    2026) ese auto «reordenó» el procedimiento y lo retrotrajo a abril, de modo que las partes tuvieron que presentar
    de nuevo sus escritos. Según Libertad Digital y Vozpópuli, el 28 de julio de 2026 la Fiscalía comunicó al juzgado
    que no formulará escrito de conclusiones en sentido acusatorio contra ella ni contra su asesora Cristina Álvarez
    y que presentará un escrito de conclusiones absolutorias; la acusación la sostiene la acusación popular unificada
    (13 años de prisión solicitados, rebajados desde 24, según Libertad Digital), y la UCM, sin formular acusación
    penal, reclama como perjudicada 113.509,32 euros de responsabilidad civil en caso de condena (según Infobae).
    Según Libertad Digital, elDiario.es y EFE, las defensas de ambas presentaron sus escritos de conclusiones
    provisionales los días 3 y 4 de septiembre de 2026; según Infobae y The Objective, el 8 de septiembre se celebró
    la audiencia preliminar de la Ley del Jurado. El 21 de septiembre de 2026 Peinado dictó un nuevo auto de
    apertura de juicio oral ante el Tribunal del Jurado contra ella por presuntos tráfico de influencias y
    malversación, y contra Cristina Álvarez solo por malversación (auto de 21 de septiembre de 2026, p.65); la
    Fiscalía mantiene su petición de sobreseimiento y acusa la acusación popular unificada. No hay fecha de juicio. Rige plenamente la presunción
    de inocencia: no hay condena y la defensa niega los hechos.'
