- entity_id: LegalCase:servicios-de-apoyo-a-la-direccion-general-de-innovacion-y-em
  name: Servicios de apoyo a la Dirección General de Innovación y Emprendimiento en la gestión del centro de innovación
    "La Nave"
  resumen: Se trata del objeto de un contrato publico del Ayuntamiento de Madrid (Area de Economia, Innovacion y
    Empleo) para servicios de apoyo a la Direccion General de Innovacion y Emprendimiento en la gestion del centro
    municipal de innovacion 'La Nave'. Segun ElPlural.com (24-05-2024), el Ayuntamiento adjudico el contrato en
    diciembre de 2021 a Innova Next SLU, sociedad perteneciente al empresario Juan Carlos Barrabes, por 1.795.668,37
    euros; segun Servimedia (29-05-2024), el delegado municipal Angel Nino afirmo que la licitacion se gano por
    "criterios tecnicos" y por "valoracion objetiva", la "referente a lo economico". Segun Servimedia (29-05-2024),
    la Unidad Central Operativa de la Guardia Civil solicito este contrato al Ayuntamiento en el marco de la investigacion
    sobre los negocios de Begona Gomez, esposa del presidente del Gobierno, y segun ElPlural.com (24-05-2024) el
    juez instructor Juan Carlos Peinado pidio los contratos adjudicados por el Ayuntamiento a Barrabes; la denuncia
    que origino la causa atribuia a Begona Gomez un presunto delito de trafico de influencias (informe UCO, p.12).
    Todos los implicados gozan de presuncion de inocencia. El identificador 300/2020/00884 corresponde al numero
    de expediente administrativo del contrato, no a una causa penal.
