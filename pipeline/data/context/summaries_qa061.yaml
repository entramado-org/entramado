- entity_id: Company:grupo-gloria
  name: Grupo Gloria
  resumen: 'Grupo Gloria es un conglomerado industrial peruano con inversiones en Bolivia, Colombia, Ecuador,
    Argentina y Chile. Según el informe de la UDEF incorporado en junio de 2026 a las diligencias del
    Juzgado Central de Instrucción que investiga el caso, sería el beneficiario final de la presunta mediación
    de José Luis Rodríguez Zapatero ante el Gobierno de Bolivia para favorecer a su filial cementera SOBOCE
    en litigios millonarios. La UDEF sostiene que el grupo habría canalizado 200.000 euros a Zapatero
    a través de un contrato de asesoría con la empresa peruana Focus Social Research SAC, que los investigadores
    consideran sociedad interpuesta. Su presidente ejecutivo es Claudio Rodríguez Huaco y su directora
    de Asuntos Corporativos y Relaciones Institucionales, Ana María Ospina. Todos los implicados gozan
    de presunción de inocencia: la causa está abierta y no hay condena en España.'
