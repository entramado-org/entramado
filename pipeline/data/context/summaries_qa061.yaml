- entity_id: Company:innova-next-slu
  name: Innova Next SLU
  resumen: Innova Next SLU (NIF B86413689) es una sociedad constituida el 15 de febrero de 2012 cuyo objeto social
    incluye la «consultoría tecnológica y estratégica» y la consultoría e investigación en proyectos de innovación,
    integrada en el grupo empresarial de Juan Carlos Barrabés (informe de la Guardia Civil, p.18 y p.76; auto de
    apertura de juicio oral de 20 de junio de 2026, p.31). Figura en la causa del juez Peinado sobre Begoña Gómez
    porque formó con The Valley Digital Business School las UTE adjudicatarias de dos expedientes de Red.es, el
    30 de julio de 2021 por 7.778.926,45 euros y el 2 de agosto de 2021 por unos 4,4 millones (auto de 20-06-2026,
    p.31); el informe de la Guardia Civil cifra las adjudicaciones públicas percibidas por Innova Next en 12.577.711,51
    euros en 2021 y 7.685.322,32 euros en 2022, unos 20,2 millones en conjunto, concentrados en ocho expedientes
    (informe de la Guardia Civil, p.80). La instrucción investiga si las cartas de apoyo firmadas por Begoña Gómez
    como codirectora del Máster de Fundraising de la UCM sirvieron para favorecer esas ofertas (auto de 11 de abril
    de 2026, p.22); un informe de la Intervención General del Estado (IGAE) elaborado para la Fiscalía Europea calificó
    algunos contratos de Red.es de presuntamente 'injustos', 'ilegales' y 'arbitrarios' y advirtió de posible 'fraude
    de ley' (según El Español, 29-09-2025). Además integró, con un 40,64 %, la UTE con KPMG Asesores SL (59,36 %)
    que resultó adjudicataria el 18 de marzo de 2021 del expediente 044/20-ED de Red.es, «Servicios de oficina Acelera
    PYME», por 2.149.200 euros (informe de la Guardia Civil, p.80 y p.179); según COPE y OKDiario (19-06-2026), esa
    licitación tuvo un presupuesto base de 4.053.500 euros y se financió con fondos FEDER. El juez Juan Carlos Peinado
    abrió el 18 de junio de 2026 una pieza separada sobre el contrato de Acelera Pyme a partir de un informe de la UCO
    trasladado por la Fiscalía Europea (según El Español, 19-06-2026) y, el 4 de agosto de 2026, acordó remitir esa
    pieza a la Fiscalía Europea y archivar sus actuaciones «sin más trámite», después de que la Audiencia Provincial
