  resumen: Las Diligencias Previas n.º 597/2021 son el procedimiento penal conocido como 'caso Plus Ultra'. Se incoaron
    el 29 de abril de 2021 en el Juzgado de Instrucción nº 15 de Madrid (jueza Esperanza Collazos) en relación con
    la ayuda pública de 53 millones de euros concedida a la aerolínea Plus Ultra a través del Fondo de Apoyo a la
    Solvencia de Empresas Estratégicas gestionado por la SEPI (informe UDEF 1908, p.150; informe 1907, p.7 y p.56).
    Según Libertad Digital (13-12-2025), la causa se abrió a raíz de una denuncia de Vox, la investigación sobre
    el rescate fue archivada en 2023 «por plazos procesales» y reabierta parcialmente en distintas fases, y la investigación
    posterior se centra en el destino de los fondos (presunto blanqueo y fraude fiscal). De la causa dimana la Pieza
    Separada 62/2025, declarada secreta (informe UDEF 1907, p.11), en cuyo marco la UDEF elaboró los informes 1907
    y 1908, que describen dos vías de influencia («vía Zapatero» y «vía Ábalos», informe 1908, p.31) y una operativa
    de compraventa de petróleo venezolano canalizada, según los investigadores, a través de la red de influencia
    atribuida a José Luis Rodríguez Zapatero (informe 1907, p.151-152; auto de 18 de mayo de 2026, p.44-45). El
    3 de marzo de 2026 la Audiencia Nacional (Sección de Instrucción del Tribunal Central de Instancia de Madrid,
    Plaza nº 2, juez José Luis Calama; DP 77/2024) aceptó la inhibición y asumió la competencia (auto de 18-05-2026,
    p.1 y p.4; informe UDEF 1907, p.7); mediante auto de 18 de mayo de 2026 el instructor acordó comunicar las actuaciones
    a José Luis Rodríguez Zapatero para que se personara en calidad de investigado (auto, p.2 y p.87) por presuntos
    delitos de tráfico de influencias y blanqueo de capitales. Rige la presunción de inocencia respecto de todos
    los investigados.
  sources:
