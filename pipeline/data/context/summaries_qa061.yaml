- entity_id: Organization:estado-mayor-del-ejercito-de-tierra
  name: Estado Mayor del Ejército de Tierra
  resumen: 'El Estado Mayor del Ejército de Tierra (EME) es el principal órgano auxiliar de mando del Jefe de Estado
    Mayor del Ejército de Tierra (JEME), al que asiste en el ejercicio de sus competencias, dentro del Ministerio
    de Defensa (Orden DEF/708/2020, de 27 de julio, art. 2). En la documentación del caso aparece a través de unidades
    económicas del Ejército de Tierra que figuran como órganos de contratación en el informe de la Guardia Civil
    que analiza la contratación pública de Barrabés e Innova Next en las diligencias previas 1146/2024: la Jefatura
    de Asuntos Económicos del Estado Mayor del Ejército adjudicó a Innova Next SLU, el 19 de agosto de 2020, un
    contrato menor para un curso de «Integración de la programación y el desarrollo web» por 14.800 euros sin impuestos
    (informe de la Guardia Civil, p.179), y la Jefatura de Asuntos Económicos de la Fuerza Terrestre, que el informe
    adscribe al Estado Mayor del Ejército de Tierra, consta como órgano de contratación de otros expedientes (p.163
    y p.168); la Jefatura de Asuntos Económicos del Mando de Apoyo Logístico, que adjudicó en 2023 a Barrabés Ski
    Montaña SLU un lote de equipo especial para especialistas de montaña (p.166), es un órgano distinto adscrito
    directamente al Ejército de Tierra. Estas menciones son de carácter administrativo-contractual; no consta imputación
    ni atribución de conducta ilícita al organismo ni a esas unidades.'
