- entity_id: Organization:catedra-extraordinaria-de-transformacion-social-competitiva
  name: Cátedra Extraordinaria de Transformación Social Competitiva
  resumen: 'Cátedra Extraordinaria de Transformación Social Competitiva, creada en la UCM (convenio de
    octubre de 2020) y codirigida por Begoña Gómez, esposa del presidente Pedro Sánchez. Es el núcleo
    del ''caso Begoña Gómez'' que instruye el juez Juan Carlos Peinado: el magistrado sostiene que su
    creación no siguió un ''cauce académico ordinario'' y que presuntamente sirvió para favorecer intereses
    privados (investigación por tráfico de influencias y corrupción en los negocios). Tuvo patrocinadores
    y colaboradores como Reale Seguros (60.000 €) y Fundación La Caixa (15.000 € anuales) y la colaboración
    de Google, Indra y Telefónica, y un software desarrollado en su seno cuya titularidad Begoña Gómez
    presuntamente registró a su nombre (apropiación indebida, según el juez). La UCM decidió no renovar
    la cátedra en septiembre de 2024. Todo bajo presunción de inocencia.'
