- entity_id: Person:leopoldo-puente-segura
  name: Leopoldo Puente Segura
  resumen: 'Leopoldo Puente Segura (Madrid, 1964) es magistrado de la Sala Segunda (de lo Penal) del Tribunal Supremo
    desde noviembre de 2020, plaza a la que fue promovido por el Pleno del CGPJ con 19 de 21 votos (RD 911/2020,
    de 13 de octubre). Fue el juez instructor de la causa especial 20775/2020 del caso Koldo ante el Tribunal Supremo,
    sobre presuntas irregularidades en contratos de emergencia de la pandemia y comisiones, en la que José Luis
    Ábalos, Koldo García y Víctor de Aldama fueron procesados y, tras el juicio ante la Sala Segunda, condenados
    por la sentencia 418/2026 de 22 de junio de 2026. En el ejercicio de su función ha dictado autos relevantes
    y, el 27 de noviembre de 2025, acordó la prisión provisional de Ábalos y Koldo García al apreciar un riesgo
    ''extremo'' de fuga, remitiendo posteriormente la causa hacia juicio. Su papel es estrictamente jurisdiccional:
    dirigió la instrucción; no es parte ni investigado.'
