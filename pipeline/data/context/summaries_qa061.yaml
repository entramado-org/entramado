- entity_id: Person:luis-carrero
  name: Luis Carrero
  resumen: 'Luis María Carrero Pérez es un exasesor del Palacio de la Moncloa (Unidad de Mensaje del Departamento
    de Asuntos Políticos, del 2 de marzo de 2020 al 31 de diciembre de 2023, según la sentencia de la Audiencia
    Provincial de Badajoz 152/2026, p.17) y colaborador cercano de David Sánchez, hermano del presidente del Gobierno,
    a quien se dirigía como «hermanito» (p.17). El 14 de julio de 2026, la Audiencia Provincial de Badajoz lo condenó
    (sentencia 152/2026, p.374) como cooperador necesario de un delito de prevaricación administrativa (Bloque C
    de los hechos probados) a nueve años de inhabilitación especial, y lo absolvió del resto de las infracciones
    que se le imputaban, entre ellas el tráfico de influencias (p.375). El tribunal declara probado que en 2023
    la Diputación de Badajoz creó la Jefatura de Sección de Coordinación de Centros y Programas de Actividades Transfronterizas
    y la cubrió en comisión de servicios con Carrero, único aspirante (solicitud de 27 de noviembre y nombramiento
    de 26 de diciembre de 2023, p.16-17), cuando aún trabajaba en Moncloa y ya vivía en Badajoz auxiliando a David
    Sánchez en el programa Ópera Joven (p.17 y p.19); en correos de 30 de octubre de 2023, antes de publicarse las
    bases, David Sánchez le escribía sobre su futura incorporación (p.19 y p.241). Renunció a su puesto en la Diputación
    en junio de 2025: presentó un escrito el 20 de junio y un decreto provincial de 30 de junio puso fin a la comisión
    de servicios (según El Español, 18-07-2025; sentencia p.214). La sentencia NO es firme: cabe recurso de apelación
    ante el TSJ de Extremadura (p.376) y, según The Objective (30-07-2026), Vox presentó apelación pidiendo su condena
    también por tráfico de influencias. Rige la presunción de inocencia. NO debe confundirse con Luis Carrero Blanco,
    almirante y presidente del Gobierno franquista asesinado en 1973.'
  sources:
