- entity_id: Person:camilo-ibrahim-issa
  name: Camilo Ibrahim Issa
  resumen: Camilo Ibrahim Issa es un empresario venezolano (según Vozpópuli, 05-02-2026) al que la UDEF identifica
    como accionista de Plus Ultra Líneas Aéreas a través de la sociedad Snip Aviation (informe UDEF 1907, p.180;
    auto de 18 de mayo de 2026, p.54); según la orden de detención recogida por El Español (25-05-2026), la titularidad
    real y la gestión de la aerolínea pasaron en 2017 a Rodolfo Reyes y su esposa. En la instrucción del caso Plus
    Ultra (DP 77/2024, Audiencia Nacional), el auto de 18 de mayo de 2026 recoge que el 6 de febrero de 2021 Rodolfo
    Reyes dijo a Julio Martínez Sola que Camilo había estado con Zapatero y que hablaron sobre que todo iba bien
    (p.22), y que el 26 de febrero de 2021, antes de la reunión del Consejo Gestor del FASEE (2 de marzo) y de la
    aprobación definitiva del rescate de 53 millones de euros por el Consejo de Ministros (9 de marzo), Julio Martínez
    Martínez le comunicó por mensaje la obtención de la ayuda pública y él le agradeció «tu asesoría y tu guía al
    equipo» (p.23 y p.29). Según El Periódico (vía que.es, 16-08-2026), un informe de la UDEF fechado el 9 de junio
    rastrea 290.400 euros abonados entre 2024 y 2025 a Julio Martínez Martínez en virtud de un contrato de asesoramiento
    entre Análisis Relevante y Thabeh Iberian, representada por Ibrahim; según la misma información, Zapatero declaró
    ante el juez Calama que su relación con él fue «estrictamente personal» y negó haber hablado de Plus Ultra con
    él. Todo ello procede de una investigación en curso, sin sentencia ni culpabilidad probada; rige la presunción
    de inocencia.
  sources:
