- entity_id: Person:sergio-sanchez
  name: Sergio Sánchez
  resumen: Sergio Sánchez Benítez es, según Infobae (19-05-2026), excargo del CNI y directivo de Movistar. En el
    'caso Plus Ultra', el auto de la Audiencia Nacional de 18 de mayo de 2026 lo identifica, a partir de la información
    de la ONIF, como titular del 25% de la consultora Análisis Relevante SL, cuyo administrador único desde el 10
