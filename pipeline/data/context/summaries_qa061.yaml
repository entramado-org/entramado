- entity_id: Organization:correos
  name: Correos
  resumen: 'Correos (Sociedad Estatal Correos y Telégrafos, S.A., S.M.E.) es el operador postal público de España.
    En el caso Koldo/mascarillas figura como destinataria y distribuidora, no como adjudicadora: la orden ministerial
    de 20 de marzo de 2020 le asignó 2.000.000 de las 8 millones de mascarillas que el Ministerio de Transportes
    compró a través de Puertos del Estado (auditoría interna del MITMA de 19 de agosto de 2024, p.27), y el reparto
    a los transportistas se hizo a través de sus oficinas (p.48); la auditoría señala que no hay acta de recepción
    por parte de Correos ni actas de entrega individualizadas a los transportistas, y estima en 1.836.124 las mascarillas
    que entregó (p.48-49). Según The Objective (21 de octubre de 2024), el exsecretario general de Correos Julio
    González García declaró como testigo que Correos había acordado adquirir mascarillas por 7,2 millones de euros
    a Soluciones de Gestión, pero que la compra decayó porque ya tenían suficientes; según el mismo medio, sostuvo
    que los albaranes de las entregas constan en los archivos de la empresa. Su expresidente Juan Manuel Serrano
    está investigado en el caso Leire (Audiencia Nacional, DP 150/2025), según EFE (vía Infobae, 18 de agosto de
    2026), y Leire Díez fue directora de Relaciones Institucionales de Correos (DS_C_15_727, p.4). Correos no está
    imputada ni acusada; rige la presunción de inocencia.'
  sources:
