- entity_id: Company:marco-infraestructuras-y-medio-ambiente-sa
  name: Marco Infraestructuras y Medio Ambiente SA
  resumen: Marco Infraestructuras y Medio Ambiente SA (Mainsa), con sede en Zaragoza, es una empresa constructora
    especializada en obra civil, carreteras y conservación/mantenimiento de infraestructuras para distintas administraciones.
    Aparece en el informe de la UCO sobre el caso Koldo/Ábalos en relación con un contrato de conservación y explotación
    de carreteras en Teruel (sector TE-02, por 5.770.068,18 euros) adjudicado a una UTE formada por Marco Infraestructuras
    y Levantina, Ingeniería y Construcción (LIC), cuya oferta económica fue la decimotercera y decimocuarta más
