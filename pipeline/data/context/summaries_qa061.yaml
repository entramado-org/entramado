    sin impuestos. Con impuestos, la cifra es de 3.684.317,51 euros según Vozpópuli. Ese mismo medio informó (29/05/2024)
    de que el procedimiento tuvo tramitación urgente y de que la memoria justificativa indica que el contrato se
    financia con fondos Next Generation de la Unión Europea. Según El Español (11/07/2024), un informe de la UCO
    fechado el 2 de julio de 2024 analizó seis contratos adjudicados a Barrabés, entre ellos este del CSD, y concluyó
    que se desarrollaron «con normalidad» y «bajo los principios que rigen la contratación pública», sin consignar
    ningún dato incriminatorio contra Begoña Gómez. Esa conclusión se refiere a los contratos examinados en ese informe.
