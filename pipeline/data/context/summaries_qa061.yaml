- entity_id: Company:barrabes-ski-montana-s-l-u
  name: Barrabes Ski Montana S.L.U.
  resumen: 'Barrabés Ski Montaña, S.L.U. es una sociedad del grupo empresarial familiar Barrabés: según el informe
    de la UCO de la Guardia Civil, fue constituida el 3 de febrero de 1994, con domicilio social en Benasque (Huesca)
    y objeto social el comercio al por menor y al por mayor de artículos relacionados con la práctica de actividades
    deportivas y el alquiler y reparación de material deportivo (informe de la UCO, p.13-14); Juan Carlos Barrabés
    fue su administrador solidario desde la constitución y es consejero desde el 2 de enero de 2011, y su socio
    único es Grupo Barrabés Cónsul SL, matriz del grupo familiar (p.14, p.27). Junto con Innova Next figura entre
    las sociedades del entorno de Barrabés cuyas adjudicaciones públicas analizó la UCO en el llamado ''caso Begoña
    Gómez'': según ese informe, seis sociedades vinculadas a Juan Carlos Barrabés obtuvieron entre 2015 y 2024 un
    total de 99 expedientes de contratación por 24.923.443,60 euros (IVA no incluido), de los que a Barrabés Ski
    Montaña corresponden 65 contratos por 1.824.834,16 euros (7,3 % del total) y a Innova Next 28 contratos por
    22.857.805,49 euros (91,7 %), concentrando Innova Next en 2021 y 2022 unos 20,2 millones, aproximadamente el
    90 % de sus adjudicaciones (p.69, p.125-127). Según Libertad Digital (24-06-2024), Barrabés Ski Montaña obtuvo
    además del Ministerio de Economía 4,274 millones de euros en ayudas del ICO entre 2020 y 2024 (4,308 millones
    sumando pequeñas ayudas de otras administraciones). Según El Independiente (28-05-2024), los investigadores
    «no han podido acreditar delito alguno» en la actuación de Begoña Gómez. El juez Juan Carlos Peinado acordó
    la apertura de juicio oral con jurado contra Begoña Gómez, Cristina Álvarez y Juan Carlos Barrabés por presuntos
    delitos de tráfico de influencias y corrupción en los negocios, entre otros (auto de 20 de junio de 2026); según
    Infobae (16-07-2026), la Sección 23 de la Audiencia Provincial de Madrid excluyó del procedimiento a Barrabés
    por falta de pruebas directas y mantuvo el jurado para Gómez solo por tráfico de influencias y malversación,
    y, según EFE (vía Infobae, 06-09-2026), esa resolución retrotrajo el procedimiento a abril de 2026, de modo
    que Peinado prevé dictar un nuevo auto de apertura de juicio oral antes del 27 de septiembre; según Europa Press
    (vía The Objective, 04-08-2026), el juez remitió a la Fiscalía Europea la pieza sobre el contrato de Red.es
    a la UTE Innova Next-KPMG. Todas las personas y entidades están amparadas por la presunción de inocencia y no
    existe sentencia firme.'
