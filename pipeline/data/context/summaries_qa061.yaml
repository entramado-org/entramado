- entity_id: Person:daniel-romero-abreu-kaup
  name: Daniel Romero-Abreu Kaup
  resumen: 'Daniel Romero-Abreu Kaup es un empresario, administrador único de Thinking Heads Group SL —de la que
    Thinking Heads Americas LLC es su sucursal en Estados Unidos— y fundador y presidente del think tank Gate Center
    (The Global Analysis & Trends in Emerging Regions), cuyo consejo asesor preside José Luis Rodríguez Zapatero
    (informe UDEF 1907, p.173-174 y p.182; auto de 18 de mayo de 2026, p.49-50); según Libertad Digital (21-05-2026),
    que cita la web de la entidad, Gate Center es un proyecto de tres emprendedores impulsado por Romero-Abreu,
    Tomás Ferradas y Eduardo Fernández, gestionado por Thinking Heads y relacionado con China. En el auto del juez
    José Luis Calama (Audiencia Nacional, 18-05-2026) sus sociedades figuran entre los pagadores de Zapatero: 37
    transferencias por 649.552 euros de Thinking Heads Group y dos por 31.766,04 euros de Thinking Heads Americas,
    por una actividad «centrada en la participación en conferencias internacionales, labores de mediación, asesoramiento
    estratégico» y análisis geopolítico (p.49); en conjunto, «sociedades del grupo Thinking Heads, vinculado a Daniel
    Romero-Abreu Kaup, habrían remitido 681.318 euros a José Luis Rodríguez Zapatero y 12.297 euros a Whathefav»,
    la sociedad de las hijas del expresidente, y Gate Center otros 352.980 euros a Zapatero y 171.727 euros a Whathefav
    (p.55; informe UDEF 1907, p.174-176 y p.183). El auto no le atribuye la condición de investigado ni consta su
    imputación; su mención no implica responsabilidad penal y rige la presunción de inocencia.'
