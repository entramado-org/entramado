- entity_id: Organization:inac
  name: INAC
  resumen: 'El Instituto Nacional de Aeronáutica Civil de Venezuela (INAC) es el organismo regulador de la aviación
    civil de Venezuela. En el auto de 18 de mayo de 2026 de la causa del «caso Plus Ultra» (Diligencias Previas
    77/2024 del Tribunal Central de Instancia) se le cita en el contexto de la operativa de la aerolínea Plus Ultra
    y de las gestiones del entorno investigado sobre permisos y vuelos: el auto dedica un epígrafe a las «influencias
    con el presidente del INAC de Venezuela», con conversaciones desde el 5 de marzo de 2021 entre Julio Martínez
    Martínez y el presidente del organismo, Juan Manuel Teixeira Díaz, sobre un convenio de pago de una deuda de
    Plus Ultra con el INAC de 258.618 dólares y sobre la autorización de vuelos, y recoge que el presidente del
    INAC atribuyó a la aerolínea la responsabilidad por «comercializar vuelos sin contar con la autorización del
    país de destino» (p.35-36); el juez describe estas gestiones como una «segunda línea de influencia» dirigida
    a intervenir ante el INAC para asegurar la autorización de vuelos de la compañía (p.56). Es un organismo público
    venezolano, no un sujeto investigado.'
