    (8-7-2026), relató que fue Leire Díez quien se puso en contacto con él, que ella se reunía en nombre de Pedro
    Sánchez, que le trasladaba que tenía acceso a los fiscales y que se pretendía que cambiara a su abogado por
    uno «Pro-PSOE», Jacobo Teijelo; la describió como 'el tonto útil' del Gobierno. Son manifestaciones de un testigo
