- entity_id: Person:eudoro-antonio-gonzalez-dellan
  name: Eudoro Antonio González Dellán
  resumen: Eudoro Antonio González Dellán es un abogado y político venezolano (informe UDEF, p.107); según TalCual
    (21-09-2024) y The Objective (22-05-2026), exdiputado de la oposición por la Mesa de la Unidad Democrática que
    perteneció a Primero Justicia. El auto de la Audiencia Nacional de 18 de mayo de 2026 recoge conversaciones
    suyas con Julio Martínez Martínez con mensajes destinados a José Luis Rodríguez Zapatero (marzo de 2023 y 16
    de julio de 2024) sobre Edmundo González, «Ocariz» (identificado solo indiciariamente en el auto) y Delcy Rodríguez,
    en las que se le señala como interlocutor —«la interlocución corresponde a Aveledo y a usted»— y en las que
    Zapatero celebra «esa relación con Delcy» (auto, p.34); según The Objective (22-05-2026), que interpreta esos
    mensajes, actuó como enlace de Zapatero entre Delcy Rodríguez y el candidato opositor Edmundo González antes
    de las elecciones de julio de 2024, y tanto The Objective como TalCual lo sitúan en la negociación de la salida
    de Edmundo González de la embajada española en Caracas en septiembre de 2024. Según The Objective (22-05-2026),
    la relación con Zapatero databa de las negociaciones entre el chavismo y la oposición de diciembre de 2017 a
    febrero de 2018 en República Dominicana, en las que Zapatero medió y González Dellán participó como delegado
    opositor. No consta que esté investigado en la causa española; no consta condena y rige la presunción de inocencia.
  sources:
