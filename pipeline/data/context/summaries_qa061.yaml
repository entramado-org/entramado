- entity_id: Person:oscar-puente
  name: Óscar Puente
  resumen: 'Óscar Puente Santiago (Valladolid, 1968) es político del PSOE y ministro de Transportes y Movilidad
    Sostenible del Gobierno de España desde el 21 de noviembre de 2023, en sustitución de Raquel Sánchez (según
    Wikipedia y la biografía oficial de La Moncloa); la cartera es sucesora del Ministerio de Transportes, Movilidad
    y Agenda Urbana que dirigió José Luis Ábalos, en el que se sitúan hechos investigados en el caso Koldo. Fue
    concejal en Valladolid (2007-2023) y alcalde de la ciudad (2015-2023), y es diputado por Valladolid tras las
    elecciones de julio de 2023 (según Wikipedia y La Moncloa). Su vínculo con el caso Koldo es el de titular actual
    del departamento: según el informe 96/2025 de la UCO, de 5 de junio de 2025 (pp.389-390), en audios de conversaciones
    con Ábalos grabados por Koldo García, este insistía en que Ábalos consiguiera que Santos Cerdán le recibiera
    para que, «en virtud de su relación con Óscar Puente», le consiguiese dos obras —«una en ADIF y otra en Carreteras»—
    de las que obtener un beneficio económico; la UCO recoge también que, según Koldo, Cerdán habría intentado nombrar
    a dos personas de Acciona en la nueva estructura del ministerio tras la toma de posesión de Puente (p.389).
    Son afirmaciones de Koldo García recogidas por la UCO; no consta que Puente esté investigado ni imputado por
    ello y rige plenamente la presunción de inocencia.'
  sources:
  - https://es.wikipedia.org/wiki/%C3%93scar_Puente_Santiago
