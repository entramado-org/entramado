- entity_id: Organization:organizacion-mundial-del-turismo
  name: Organización Mundial del Turismo
  resumen: La Organización Mundial del Turismo (OMT, hoy ONU Turismo) es el organismo especializado de las Naciones
    Unidas para la promoción del turismo, con sede en Madrid; entre 2018 y 2025 la dirigió el georgiano Zurab Pololikashvili
    (informe de la UDEF sobre Focus Social Research, p.9; según Casa África, en el cargo desde el 1 de enero de
    2018; según El Español, 18-02-2026, su intento de un tercer mandato descarriló en 2025). Aparece en el caso
    porque su XXIII Asamblea General en San Petersburgo fue el escenario en que Begoña Gómez coincidió con Víctor
    de Aldama y Javier Hidalgo (Globalia) (escrito de Víctor de Aldama incorporado a la causa especial del Tribunal
    Supremo, p.14; según Libertad Digital, 25-05-2024, en septiembre de 2019), y por su colaboración con Globalia,
    que el propio Pololikashvili destacó públicamente («Gracias a la colaboración entre la OMT y Globalia, con el
    inestimable respaldo de Barrabés…», informe de la UCO, p.52). Según Libertad Digital (25-05-2024), Pololikashvili
    puso en contacto a Gómez con ministros africanos en esa asamblea y la respaldó en noviembre de 2019 en el congreso
    regional de la OMT en Accra (Ghana), donde el IE y la OMT anunciaron una academia en línea conjunta, y Wakalua
    —sociedad lanzada por la OMT y Globalia— patrocinó con 40.000 euros el IE Africa Center que dirigía Gómez; según
    El Español (07-05-2024), la OMT dio por terminado después su acuerdo con ese centro. Según Libertad Digital
    (25-05-2024), Pedro Sánchez anunció en enero de 2019 la cesión gratuita a la OMT de una sede en Madrid por 75
    años; según El Español (18-02-2026), el acuerdo se formalizó en 2022 (Palacio de Congresos de la Castellana)
    y Pololikashvili negó que la cesión tuviera relación con proyectos del entorno de Gómez. El organismo no está
    acusado de ningún delito; su mención sirve para contextualizar la red de contactos empresariales y personales
    que el caso Koldo/Aldama y la causa de Begoña Gómez examinan.
  sources:
  - https://www.libertaddigital.com/espana/2024-05-25/begona-gomez-exploto-su-alianza-con-globalia-y-la-omt-acuerdos-academias-conjuntas-y-actos-en-africa-7130278/
