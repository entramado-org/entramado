    hermanos habrían usado su proximidad a Koldo para influir en ADIF y la Dirección General de Carreteras y resultar
    adjudicatarios de las obras que el informe define (p.411). Estos son indicios de la instrucción (Tribunal Supremo),
    no hechos probados: no hay sentencia firme. Está amparado por la presunción de inocencia. Es persona distinta
    de su hermano Antonio Fernández Menéndez, otra persona que figura en esta base, ligada a OPR.'
