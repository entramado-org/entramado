    participando en obras como el desdoblamiento del túnel de Belate. Es una de las empresas centrales del informe
    de la UCO en la causa que investiga a Santos Cerdán: en un registro vinculado al entorno se halló un contrato
    privado —de 2016, según elDiario.es— que atribuiría a Cerdán 1.350 de las 3.000 participaciones de la sociedad
    (45 %, auto de prisión p.11); Cerdán reconoció ante el Tribunal Supremo haber firmado ese documento —un contrato
    privado que, según el auto de prisión de 30 de junio de 2025, «no llegó a elevarse a público» (p.11-12)— y sostiene
    que no se ejecutó, y según elDiario.es y Crónica Vasca (El Español) Antxon Alonso también niega ante el Supremo
    que Cerdán fuera socio y que la operación se formalizara. La investigación maneja la hipótesis de que Servinabar
    habría servido para canalizar presuntas comisiones (vinculadas a Acciona) a cambio de favorecer adjudicaciones
    de obra pública; según elDiario.es, la investigación la relaciona también con pagos a familiares de Cerdán.
    Todo ello corresponde a la fase de instrucción y rige la presunción de inocencia.'
