- entity_id: Person:felipe-baca
  name: Felipe Baca
  resumen: 'Luis Felipe Baca Arbulu aparece en la investigación del caso Plus Ultra (Audiencia Nacional, juez José
    Luis Calama) por el rescate de 53 millones de euros que la SEPI concedió a la aerolínea en marzo de 2021. Los
    informes de la UDEF recogen que, el 31 de diciembre de 2020, Baca dijo a Miguel Palomero que en «ese paquete»
    había 50.000 euros en efectivo —a lo que Palomero respondió «hay que cuidar a los jueces, policías y funcionarios
    jeje»— y le encargó dos pagos, de 3.000 euros a «Alejandra» y de 2.000 euros a «Jessica» (informe UDEF 1907,
    p.39); el 8 de enero de 2021 Palomero y Rodolfo Reyes hablaron de la entrega de 20.000 euros en efectivo a Reyes
    «por indicaciones de Felipe BACA», fondos que, según el propio Reyes, tenían por destinatario a un tercero,
    y la UDEF señala que «se desconoce por cuenta de quién hace Felipe BACA el encargo» (p.42); Palomero comunicó
    las entregas los días 19 y 20 de enero de 2021 (p.45-46). El auto de 18 de mayo de 2026 recoge los mismos hechos
    (p.21-22). En la comisión de investigación del Senado un senador afirmó, citando al auditor de Plus Ultra, que
    un préstamo de Felipe Baca a la aerolínea figura en su contabilidad (DS Senado 717, p.3). Según The Objective
    y El Español (25-05-2026), al ordenar la detención internacional de Rodolfo Reyes y de Simon Leendert Verhoeven,
    el juez Calama sostuvo que este último, junto con Baca —«ya detenido en la isla caribeña de Aruba»—, gestionaba
    una presunta organización criminal dedicada al blanqueo de capitales, y la defensa de Baca comunicó al juez
    que no se opondrá a la extradición. Rige la presunción de inocencia: se trata de una investigación en curso,
    sin acusación ni condena.'
  sources:
  - https://theobjective.com/espana/tribunales/2026-05-25/juez-orden-internacional-detencion-dueno-plus-ultra/
  - https://www.elespanol.com/espana/tribunales/20260525/juez-calama-emite-orden-internacional-detener-rodolfo-reyes-principal-accionista-plus-ultra/1003744259618_0.html
