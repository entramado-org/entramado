- entity_id: Person:joaquin-goyache
  name: Joaquín Goyache
  resumen: Joaquín Goyache Goñi es rector de la Universidad Complutense de Madrid (El Español, 18-05-2026, lo describe
    como «actual rector»). En el caso Begoña Gómez fue investigado por el juez Juan Carlos Peinado en relación con
    la creación de la cátedra extraordinaria que codirigió Begoña Gómez, por los supuestos delitos de tráfico de
    influencias y corrupción en los negocios según El Español (11-09-2024); declaró como testigo el 5 de julio de
    2024 y como investigado el 29 de julio de 2024 (auto de 20 de junio de 2026, p.33). Según ese auto, reconoció
    en sus declaraciones que en julio de 2020, tras una llamada de la secretaria de Gómez, acudió al Palacio de
    la Moncloa y se reunió a solas con ella sin conocerla en persona, reunión en la que el instructor sitúa el origen
    de la cátedra (p.32-33). En un auto de 13 de mayo de 2025 (Auto 413/2025), la Sección 23.ª de la Audiencia Provincial
    de Madrid estimó parcialmente los recursos de apelación de la Fiscalía, Begoña Gómez, Juan Carlos Barrabés y
    las acusaciones particulares y revocó y dejó sin efecto su imputación y la de Juan José Güemes «por carecer
    de fundamento», destacando «la ausencia de datos objetivos incriminatorios», según Diario de Pontevedra y Moncloa.com
    (16-05-2025); el auto de 20 de junio de 2026 cita esa resolución (p.30). La UCM está personada en la causa como
    actor civil perjudicado en relación con el software de la cátedra (auto de 20-06-2026, p.17 y p.26). Todo bajo
    presunción de inocencia; Goyache no es parte investigada desde mayo de 2025.
  sources:
  - https://www.moncloa.com/2025/05/16/caso-begona-gomez-2-3230822
  - https://www.diariodepontevedra.es/articulo/espana/desimputan-rector-complutense-guemes-caso-begona-gomez/202505162015361391155.html
