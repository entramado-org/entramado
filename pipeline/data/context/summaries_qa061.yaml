- entity_id: Person:rodolfo-reyes
  name: Rodolfo Reyes
  resumen: 'Rodolfo José Reyes Rojas es un empresario de origen venezolano al que los investigadores consideran
    el principal accionista de Plus Ultra Líneas Aéreas, controlada a través de FlySpain (de la que es administrador
    único) y de la participación de su esposa, María Aurora López; la otra sociedad accionista, Snip Aviation, corresponde
    según la UDEF a Camilo Ibrahim Issa. La investigación del ''caso Plus Ultra'' le atribuye haber sido uno de
    los principales impulsores de las gestiones para lograr el rescate público de 53 millones de la SEPI en 2021;
    según COPE, habría desviado dinero a paraísos fiscales a través de una red de blanqueo. Según informaron El
    Español, COPE y The Objective, en mayo de 2026 el juez José Luis Calama de la Audiencia Nacional emitió una
    orden internacional de detención contra él —y otra contra su esposa, María Aurora López, por los mismos delitos—
    por presuntos delitos de apropiación indebida, tráfico de influencias, pertenencia a organización criminal y
    blanqueo de capitales; según esa orden, recogida por El Español, en 2017 la titularidad real y la gestión de
    Plus Ultra pasaron a manos de Reyes y su esposa. Rige la presunción de inocencia: se trata de imputaciones no
    juzgadas.'
