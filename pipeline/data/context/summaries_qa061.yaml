- entity_id: Company:transforma-tsc-s-l
  name: Transforma TSC, S.L.
  resumen: Transforma TSC, S.L. es una sociedad limitada constituida el 21 de noviembre de 2023 por Begoña Gómez,
    socia y administradora única (auto de 11 de abril de 2026, p.29; auto de 20 de junio de 2026, p.46), con el
    mismo nombre que la marca «TSC. Transformación Social Competitiva» y que la cátedra que ella dirigía en la Universidad
    Complutense de Madrid. Según El Independiente y The Objective (25-05-2026), que citan un informe de la UCO remitido
    al juez Peinado, Gómez pagó los 206,57 euros del registro de la marca TSC con una tarjeta asociada a una cuenta
    bancaria que comparte con su marido, Pedro Sánchez, más 23,19 euros en efectivo; el escrito de la acusación
    popular reproducido en el auto de 20 de junio de 2026 recoge esos mismos importes y cifra en 6.687,85 euros
    los abonos que la mercantil recibió el 14 de marzo de 2024 de la sociedad Innovación Hexagonal, S.L. (p.10-11).
    Según Infobae/EFE y El Independiente (25-05-2026), la UCO concluye que la sociedad, con vida operativa de noviembre
    de 2023 a junio de 2024, «efectivamente llegó a mantener una actividad comercial» y aprecia «analogías» entre
    la mercantil y la plataforma desarrollada en el seno de la cátedra, sin haber encontrado «elementos que la vinculen
    oficialmente con la cátedra»; de ahí la sospecha, sostenida por las acusaciones, de que la sociedad privada
    pudo beneficiarse de una herramienta financiada con medios de la universidad. La instrucción investiga estos
    hechos en el «caso Begoña Gómez»; rige la presunción de inocencia.
