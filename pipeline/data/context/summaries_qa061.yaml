- entity_id: Person:gonzalez-fernandez
  name: Mercedes González Fernández
  resumen: 'Mercedes González Fernández fue diputada socialista por Madrid en la XV legislatura del Congreso (número
    diez de la lista del PSOE en las elecciones del 23 de julio de 2023, según Público). En el Congreso presidió
    la Comisión de Educación y fue secretaria primera de la comisión de investigación sobre la compra de material
    sanitario durante la pandemia, vinculada al caso Koldo (según Público y Artículo 14, septiembre de 2024). En
    septiembre de 2024 dejó su escaño para reincorporarse como directora general de la Guardia Civil —nombramiento
    del 18 de septiembre de 2024, según declaró ella misma ante el Senado (Diario de Sesiones del Senado 727, p.5)—,
    cargo que ya había ocupado durante unos meses en 2023, tras la dimisión de María Gámez y hasta su inclusión
    en la lista al Congreso (según Público y Artículo 14). Según The Objective (02-07-2026), el 2 de julio de 2026
    el juez Santiago Pedraz (Audiencia Nacional, DP 150/2025) la citó como investigada en la causa de las ''cloacas''/Leire
    Díez, junto al DAO Manuel Llamas, a petición de la Fiscalía Anticorrupción, por presuntos delitos de prevaricación
    y obstrucción a la justicia; declaró como investigada el 17 de julio de 2026 y, según The Objective (17-07-2026),
    negó todo vínculo con la trama y afirmó estar «en el listado de víctimas de Santos Cerdán». Según El Debate
    (29-07-2026), el 29 de julio de 2026 Pedraz rechazó («no ha lugar») en una providencia la medida cautelar de
    la acusación popular de apartarla, junto al DAO, del mando sobre la UCO mientras dura la instrucción. Según
    EFE (vía Infobae, 10-09-2026), seguía en el cargo. Rige plenamente la presunción de inocencia: está investigada,
    no condenada, y son diligencias de instrucción en curso.'
