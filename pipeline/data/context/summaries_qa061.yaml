- entity_id: Organization:fundacion-la-caixa
  name: Fundación la Caixa
  resumen: 'La Fundación ''la Caixa'' es la fundación bancaria del grupo CaixaBank, dedicada a obra social, cultural
    y científica. Figura en la causa de Begoña Gómez como patrocinadora de la Cátedra Extraordinaria de Transformación
    Social Competitiva de la Universidad Complutense: en el convenio de creación se comprometió a una aportación
    anual de 15.000 euros, junto a los 60.000 euros de Reale Seguros (auto de 11 de abril de 2026, p.3; auto de
    20 de junio de 2026, p.34). Su subdirector general, Marc Simón, declaró como testigo ante el juez Juan Carlos
    Peinado el 26 de agosto de 2024 que Begoña Gómez le contactó en 2020 para exponerle la cátedra y que patrocinaron
    el proyecto porque encajaba con su programa de inserción sociolaboral de jóvenes ''ninis'' y expresidiarios,
    y que abonaron 60.000 euros en cuatro pagos de 15.000 euros (según El Español, 26-08-2024; El Debate, 27-08-2024;
    Infobae, 10-09-2024). Su papel documentado es el de patrocinador; no consta que la Fundación esté investigada.
    Rige la presunción de inocencia para todas las personas investigadas en la causa.'
  sources:
