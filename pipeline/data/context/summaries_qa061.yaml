    Ramón Alzórriz, ex 'número dos' de Chivite (Diario de Sesiones del Senado nº 745, 30-06-2026, p.7). Según The
    Objective (15-01-2026), la del piso fue una reforma integral de más de 150.000 euros; Alzórriz declaró en el
    Senado que las obras de su casa le costaron 180.000 euros (p.72). En el marco del 'caso Sendaviva' (Juzgado
    de Instrucción nº 5 de Pamplona, querella de Vox admitida a trámite por presuntos cohecho y tráfico de influencias)
    se investiga un presunto fraccionamiento de contratos públicos a favor de la empresa por unos 790.000 euros
    en total; según The Objective, dos de los contratos, de 198.640 y 198.262 euros, se firmaron el mismo día (15-nov-2023),
    ambos por debajo del umbral de 200.000 euros. Según The Objective (08-12-2025), Martín Vidaurre, hijo de Carlos
    Vidaurre, fue contratado en septiembre de 2024 como asistente parlamentario del grupo del PSN en el Parlamento
    de Navarra; Alzórriz declaró en el Senado que fue su grupo quien propuso la incorporación y que el contrato
    se firma con el Parlamento de Navarra (Diario de Sesiones del Senado n.º 745, 30-06-2026). Se trata de una investigación
    en curso, sin condena.
