- entity_id: Person:juan-manuel-serrano-quintana
  name: Juan Manuel Serrano Quintana
  resumen: 'Juan Manuel Serrano Quintana (''Juanma Serrano'') fue jefe de gabinete de Pedro Sánchez en la Comisión
    Ejecutiva del PSOE entre 2014 y 2018 —The Objective (27-12-2023) lo describe como su «mano derecha en el PSOE»
    y amigo del presidente— y presidente de la Sociedad Estatal Correos y Telégrafos desde 2018 hasta finales de
    diciembre de 2023, cuando fue relevado por Pedro Saura (The Objective; Vozpópuli). Su gestión dejó a Correos
    en lo que Vozpópuli califica de «su peor crisis», con «pérdidas récord»: The Objective (27-12-2023) y El Independiente
    (03-08-2024) cifran el ''agujero'' en más de 1.000 millones de euros, y Vozpópuli, recogiendo la denuncia de
    CCOO y UGT de abril de 2024, lo eleva a 1.200 millones. Según las cuentas citadas por Vozpópuli, entre 2017
    —último ejercicio antes de su llegada— y 2023 el pasivo de la empresa pública pasó de 562,7 a 1.411,7 millones
    (+151%) y el patrimonio neto cayó de 1.615,9 a 851,2 millones; en 2022 perdió 217 millones de euros, según The
    Objective (27-12-2023), que preveía unos 300 millones para 2023, y fracasaron apuestas de diversificación como
    Correos Cargo (carga aérea, que según El Independiente fracasó un año después de su inicio) o Correos Frío.
    En el caso Leire (Diligencias Previas 150/2025, Audiencia Nacional), el auto de entrada y registro de la sede
    del PSOE en Ferraz, de 26 de mayo de 2026, ya apreciaba «indicios que revelan su colaboración con los investigados
    en la ejecución de concretos y aislados actos en auxilio de su ilícito plan» y su participación en la reunión
    del 26 de abril de 2024 en la Secretaría de Organización, pero concluía que «en este momento… no se les puede
    atribuir la condición de investigados» (auto de 26 de mayo de 2026, p.19; su nombre figura en la tabla de personas
    de la p.41). Un informe posterior de la UCO —fechado el 8 de julio de 2026 según Moncloa.com— le atribuye, según
    El Español (09-07-2026), una «participación preeminente» en las dos patas de la causa: las presuntas irregularidades
    en la contratación de empresas públicas —habría pactado con el también investigado Vicente Fernández (expresidente
    de la SEPI) la colocación de Leire Díez en Correos, cuyos requisitos del puesto se habrían modificado para ajustarlos
    a su perfil («Me ha dicho ''Ok, vamos hablando''. No te preocupes, lo tuyo sale», escribió Fernández a Díez
    en mayo de 2021), un ''enchufe'' al que, según Vozpópuli (10-07-2026), la UCO asocia comisiones de más de 200.000
    euros a través de un despacho de abogados vinculado a Fernández— y las presuntas maniobras para desestabilizar
    causas judiciales que afectan al PSOE y al Gobierno. Según Vozpópuli y Libertad Digital (10-07-2026), ese día
    el juez Santiago Pedraz acordó su imputación a petición de la Fiscalía Anticorrupción y autorizó el acceso,
    volcado y análisis de su teléfono móvil; fuentes fiscales citadas por Libertad Digital situaban la imputación
    en un presunto delito de organización criminal, aunque «Pedraz no aclara el delito» y «podría tratarse de tráfico
    de influencias». Vozpópuli anticipó una citación como investigado para el 28 de julio que no llegó a producirse:
    según El Debate (29-07-2026), Pedraz decidió no citarle todavía a la espera del volcado de su teléfono, que
    la UCO practicó el 14 y 15 de julio y que, rechazado por la defensa por haberse hecho sin su presencia, se repitió
    en la Audiencia Nacional el 18 y 19 de agosto (EFE vía Infobae); su defensa ha pedido la nulidad de la incautación
    y de los clonados (Europa Press vía Infobae, 01-09-2026). Es una instrucción en curso, sin juicio ni condena;
    rige plenamente la presunción de inocencia.'
  sources:
