- entity_id: Organization:deloitte
  name: Deloitte
  resumen: 'Deloitte es una de las grandes firmas multinacionales de servicios profesionales (consultoría, auditoría
    y asesoramiento legal). Aparece vinculada a dos investigaciones diferentes. En el caso Plus Ultra
    (DP 77/2024), Deloitte actuó como asesora jurídica de la SEPI en el proceso del rescate: según El Español (27-05-2026), que tuvo acceso a los informes, presentó su documento final el 26 de febrero de 2021, dos días hábiles antes de que el expediente llegara al Consejo Gestor del FASEE.
    En el caso de la cátedra de Begoña Gómez en la Universidad Complutense, según el atestado de la UCO recogido
    por El Independiente, Euronews y OKDiario (25-may-2026), las adjudicaciones a Deloitte para desarrollar el software
    habrían sido ''premeditadas'': dos contratos (un contrato menor y un procedimiento abierto simplificado, 64.999
    euros en total según OKDiario) cuyos expedientes se habrían confeccionado como ''un mero marco administrativo''
    para ''dotar de apariencia de legalidad'' a la contratación, y la consultora habría empezado a trabajar antes
    de la adjudicación formal; el auto del juez Peinado de 11 de abril de 2026 recoge que 78.648,00 euros del gasto
    de la UCM corresponden a servicios facturados por Deloitte Consulting. Deloitte no figura como investigada en
    estas piezas, que se centran en los responsables públicos y en la promotora de la cátedra; todo procede de actuaciones
    de instrucción sin sentencia, y rige la presunción de inocencia.'
  sources:
