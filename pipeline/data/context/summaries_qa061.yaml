- entity_id: Company:aquaterra-servicios-infraestructuras-sl
  name: Aquaterra Servicios Infraestructuras SL
  resumen: Aquaterra Servicios Infraestructuras S.L. es una empresa constructora que formó una unión temporal de
    empresas (UTE) con Acciona Construcción para concurrir a obra pública analizada en el caso Koldo, en concreto
    la Variante de Logroño (autovía A-68, tramo Arrúbal-Navarrete), adjudicada a esa UTE el 11 de septiembre de
    2019 por 92.416.975,61 euros (informe de la UCO en la causa especial del Tribunal Supremo, p.75). Según ese
    informe, la obra de Logroño es una de las tres adjudicaciones a Acciona a las que Koldo García asociaba, en
    conversaciones grabadas, 450.000 euros pendientes de abono de las contraprestaciones que presuntamente procedían
    de Acciona, eran percibidas por Ábalos y Koldo y gestionadas por Santos Cerdán (p.15-16); según Europa Press
    (vía Infobae, 18-11-2025), citando el mismo informe, la UTE firmó con Servinabar —sociedad vinculada a Cerdán—
    un contrato de prestación de servicios de 2.028.257 euros. La UTE de Logroño la integraron Acciona y Aquaterra.
    Según The Objective (24-11-2025), Aquaterra puso fin a la UTE con Acciona por la gestión de la obra de Logroño
    a finales de 2024. La empresa no ha sido condenada y rige la presunción de inocencia.
