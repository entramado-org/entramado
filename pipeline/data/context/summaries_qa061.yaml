- entity_id: Company:villafuel
  name: VILLAFUEL
  resumen: 'Villafuel SL es una sociedad inscrita como operador al por mayor de productos petrolíferos, de la que
    Claudio Rivas era accionista y que controlaba a través de Still Growing SL (sentencia del Tribunal Supremo de
    22-06-2026, p.43). Según EFE (vía Infobae, 21-01-2025), la Fiscalía Anticorrupción presentó una querella, admitida
    por el Juzgado Central de Instrucción nº 5 de la Audiencia Nacional (juez Santiago Pedraz), contra 34 personas
    físicas y 49 jurídicas por una presunta organización criminal dedicada a defraudar el IVA de los hidrocarburos,
    en cuya «cúspide» la UCO sitúa a Víctor de Aldama y Claudio Rivas como «codirectores», con una cuota defraudada
    calculada por la Fiscalía en 182.513.923,15 euros entre 2022 y 2024, cifra que el juez recoge en un auto de
    3 de junio de 2025 «por el momento» (según Moncloa.com, 04-06-2025); la red operaría mediante sociedades «suministradoras/subcuentas»
    como Salamanca Fuel Center, Obaoil, Canary Islands Fuel Company, Carburantes Jalón Plaza, Casmar Hidrocarburos,
    Skyward Tech y Espaeventos. Según El Español (11-10-2024), los autos de prisión de Aldama y Rivas describen
    la estructura societaria como «encabezada por la operadora petrolífera al por mayor Villafuel SL», «una sociedad
    creada para lograr sustentar el título de operador» que facultaba a la organización para operar en el mercado.
    La sentencia del Tribunal Supremo del caso mascarillas recoge que a finales de 2020 Aldama realizó gestiones
    ante Koldo García para que se concediera a Villafuel una licencia de mayorista de hidrocarburos y que el 28
    de diciembre de 2020 se celebró una reunión en el despacho del jefe de gabinete de la ministra de Industria
    con Claudio Rivas, Carmen Pano, dos técnicos de Villafuel y Koldo García, aunque la competencia correspondía
    al Ministerio para la Transición Ecológica (sentencia TS 22-06-2026, p.43). La causa del fraude del IVA está
    en instrucción: los investigados no han sido juzgados y rige la presunción de inocencia.'
