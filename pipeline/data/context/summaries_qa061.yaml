    en abril de 2026 ante una comisión de investigación del Senado, donde defendió la legalidad de la ayuda a Air
    Europa. Según Vozpópuli y Libertad Digital (8 de junio de 2026), el magistrado José María Escribano (Sección
    de Instrucción del Tribunal de Instancia de Madrid, Plaza 49) admitió a trámite una querella de PP y Vox, incoó
    diligencias previas por un presunto delito de prevaricación administrativa en relación con dicho rescate y lo
    citó a declarar como investigado el 3 de julio de 2026. La querella se enmarca en la investigación del caso
    Koldo, en la que se examinan las gestiones de Ábalos, Koldo García y Aldama para impulsar el rescate de Air
    Europa; no ha sido juzgado y rige la presunción de inocencia.
