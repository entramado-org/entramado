    por presuntos delitos de organización criminal, tráfico de influencias y falsedad documental, en la
    que está investigado (imputado) el expresidente del Gobierno José Luis Rodríguez Zapatero, citado a declarar como investigado el 2 de junio de 2026 según elDiario.es (19-05-2026). Según la instrucción y el informe de la UDEF, los responsables
    de la compañía habrían articulado una estructura para retribuir presuntas influencias, con ramificaciones
    vinculadas a Venezuela. Se trata de indicios en una causa abierta y todos los implicados están amparados
    por la presunción de inocencia.
