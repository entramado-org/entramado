- entity_id: Person:claudio-rivas-ruiz-capillas
  name: Claudio Rivas Ruiz Capillas
  resumen: 'Claudio Rivas Ruiz Capillas es un empresario del sector de los hidrocarburos: accionista y
    controlador, a través de Still Growing SL, de Villafuel SL, sociedad para la que buscaba la licencia de operador
    de productos petrolíferos al por mayor (calificación fiscal del caso Ábalos-Aldama-García, p.12; sentencia del
    Tribunal Supremo de 22 de junio de 2026, p.43). La exposición razonada del juez Ismael Moreno de 23 de octubre
    de 2024 señala que Villafuel «se encuentra investigada en el marco del posible fraude como operador en el sector
    del hidrocarburo», que el título de operadora era «totalmente necesaria» para ese eventual fraude (p.20 y p.23)
    y que las conversaciones analizadas vinculan a Aldama con Claudio a través de Villafuel y a ambos con José Luis
    Ábalos a través del pago del chalet (p.24). Según ese mismo documento, Aldama «se vale de Claudio Rivas Ruiz
    Capillas y su estructura societaria –Have Got Time–» para comprar el 10 de junio de 2021 el chalet de La Alcaidesa
    (Cádiz) que después se alquiló al entonces ministro Ábalos (p.20); la sentencia del Supremo declara probado
    que Have Got Time estaba controlada por Rivas (p.142) y que este ordenó resolver el contrato cuando el 9 de
    diciembre de 2021 se denegó la licencia a Villafuel (p.44). Según la calificación fiscal, Aldama compartía con
    él intereses en los negocios de hidrocarburos y aprovechó su afán por obtener el título de operador para que
    corriera con los gastos del chalet (p.12). Según EFE (vía Infobae, 09-07-2026), está investigado junto a Víctor
    de Aldama por un presunto fraude de IVA en hidrocarburos y declaró como testigo ante la Guardia Civil en el
    caso Leire, negando conocer a Leire Díez. Rige la presunción de inocencia.'
  sources:
