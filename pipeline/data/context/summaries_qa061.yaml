- entity_id: Company:inteligencia-prospectiva
  name: Inteligencia Prospectiva
  resumen: 'Inteligencia Prospectiva, S.L. es una mercantil española (informe UDEF 2910, p.40) participada por los
    hermanos Guillermo Alfredo (62%) y Domingo Arnaldo Amaro Chacón (38%) (auto del juez Calama de 18 de mayo de
    2026, p.43), empresarios venezolanos según Público (26-05-2026) e Infobae (25-05-2026). En la causa del rescate
    público de la aerolínea Plus Ultra (53 millones de euros aprobados vía SEPI en marzo de 2021), que instruye
    el juez José Luis Calama en la Sección de Instrucción del Tribunal Central de Instancia de Madrid, Plaza nº
    2 (Audiencia Nacional), la UDEF (informe 2910, p.40) y el auto de 18 de mayo de 2026, a partir del informe de
    la ONIF (pp.73-74), la describen como presunta sociedad instrumental sin actividad real que habría movido fondos
    y los habría canalizado, mediante presuntos contratos y facturas, hacia sociedades del entorno del expresidente
    José Luis Rodríguez Zapatero: según el auto (p.54) y el informe UDEF 1907 (pp.149 y 182) habría pagado 561.440
    euros a Whathefav, S.L. (empresa de las hijas de Zapatero), 368.258,72 euros a Análisis Relevante (de Julio
    Martínez; 380.208 euros según la información fiscal de la ONIF) y 266.200 euros a Gate Center. La investigación
    la sitúa junto a otras mercantiles (Softgestor, Grupo Aldesa) en un presunto esquema de blanqueo. Todo se enmarca
    en una investigación judicial en curso y no juzgada; rige la presunción de inocencia para la sociedad y sus
    administradores.'
  sources:
  - https://www.publico.es/politica/inteligencia-prospectiva-destino-92-pagos-empresas-vinculadas-zapatero-martinez.html
  - https://www.infobae.com/espana/2026/05/25/los-hermanos-amaro-chacon-y-francisco-flores-quienes-son-los-empresarios-venezolanos-vinculados-al-entorno-de-zapatero-en-el-caso-plus-ultra/
