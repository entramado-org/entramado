  name: Air Europa
  resumen: Air Europa (Air Europa Holding, S.L.) es la aerolínea del Grupo Globalia, cuyo presidente ejecutivo es
    Juan José Hidalgo Acera; su hijo Javier Hidalgo fue consejero delegado del grupo y segundo máximo accionista
    de Air Europa (informe de la Guardia Civil en las DP 1146/2024, p.49 y p.134; calificación de la Fiscalía, p.11).
