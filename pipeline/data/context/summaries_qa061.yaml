- entity_id: Organization:fiscalia-anticorrupcion
  name: Fiscalía Anticorrupción
  resumen: La Fiscalía Especial contra la Corrupción y la Criminalidad Organizada («Fiscalía Anticorrupción») es
    el órgano del Ministerio Fiscal que interviene como acusación pública en estas causas; su Fiscal de Sala Jefe
    es Alejandro Luzón Cánovas (sentencia del Tribunal Supremo de 22 de junio de 2026, p.2; auto de citación de
    Ábalos, p.5). La Causa Especial 20775/2020 (caso Ábalos/Koldo/Aldama) tiene su origen en las diligencias de
    investigación 10/2022 de esta Fiscalía, incoadas el 22 de abril de 2022 por una denuncia de un particular, que
    sirvieron de base a la querella que dio lugar a las Diligencias Previas 65/2023 del Juzgado Central de Instrucción
    nº 2 (exposición razonada de 23 de octubre de 2024, p.1; ATS 8919/2025, p.1); la Fiscalía tuvo abiertas diversas
    diligencias sobre contratos de compra de material sanitario de emergencia durante la pandemia (ATS 2566/2026,
    p.20). La Unidad Central Operativa de la Guardia Civil que informa en la causa está adscrita a esta Fiscalía
    (ATS 8919/2025, p.2). Según Europa Press (vía Infobae, 1 de septiembre de 2026), Luzón pidió al Supremo desestimar
    los incidentes de nulidad de Ábalos y Koldo contra la sentencia. Es parte acusadora, no investigada; su intervención
    no implica culpabilidad de nadie (presunción de inocencia).
  sources:
