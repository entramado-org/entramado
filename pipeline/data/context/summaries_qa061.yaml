- entity_id: Person:domingo-arnaldo-amaro-chacon
  name: Domingo Arnaldo Amaro Chacón
  resumen: 'Domingo Arnaldo Amaro Chacón es un empresario nacido en Venezuela que, junto a su hermano Guillermo
    Alfredo (los «hermanos Amaro Chacón»), es propietario, según Infobae (25-05-2026), de la consultora Inteligencia
    Prospectiva SL, de la que es administrador (informe UDEF nº 2910/26, p.41). Según ese informe (p.41), Inteligencia
    Prospectiva habría pagado 561.440 euros a Whathefav y 266.200 euros a Gate Center, sociedades vinculadas a José
    Luis Rodríguez Zapatero; el auto del juez José Luis Calama de 18 de mayo de 2026 la cita entre las sociedades
    cuyos fondos canalizaba Análisis Relevante (p.10) y entre los «clientes de la red» que abonaban cantidades por
    servicios de asesoría inexistentes (p.12), y ordenó el registro de su domicilio social (p.1 y 5). Según Infobae
    (25-05-2026), habría transferido en torno a un millón de euros a tres entidades cercanas a Zapatero; según Mundiario
    (25-05-2026), movió más de 2,5 millones de euros en apenas cinco años pese a su escasa actividad, lo que los
    investigadores consideran llamativo. Según Infobae (25-05-2026), que cita a El Mundo, los hermanos son hijos
    de Domingo Amaro, asegurador de Petróleos de Venezuela (PDVSA). Según Mundiario (25-05-2026), que cita a la
    UDEF, Domingo Amaro Chacón habría actuado como enlace entre empresarios chinos interesados en adquirir crudo
    venezolano y la red investigada. El informe UDEF nº 2910/26 (p.3 y 15) sitúa a ambos hermanos en la comitiva
    del viaje de Zapatero a Bolivia de septiembre de 2024. Rige la presunción de inocencia: son indicios, sin condena.'
