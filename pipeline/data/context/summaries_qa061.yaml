- entity_id: Organization:gobierno-de-espana
  name: Gobierno de España
  resumen: 'El Gobierno de España es el poder ejecutivo del Estado. Durante el periodo cubierto por las causas (caso
    Koldo/mascarillas, Cerdán, Ábalos, Plus Ultra) ha estado presidido por Pedro Sánchez, presidente del Gobierno
    desde el 2 de junio de 2018 según Wikipedia (auto del Juzgado de Instrucción nº 41 de Madrid de 8 de enero de
    2025, p.2). Varios investigados o condenados ocuparon cargos ministeriales o de partido vinculados al ejecutivo:
    José Luis Ábalos fue nombrado ministro de Fomento por Real Decreto 357/2018, de 6 de junio (informe UCO, p.20),
    cartera renombrada en enero de 2020 como Transportes, Movilidad y Agenda Urbana, y su cese se publicó en el
    BOE de 10 de julio de 2021 (exposición razonada de 23 de octubre de 2024, p.20). El Gobierno como institución
    no está imputado; lo están, en su caso, personas concretas por hechos presuntamente cometidos en el ejercicio
    o aprovechamiento de cargos públicos, rigiendo la presunción de inocencia.'
  sources:
