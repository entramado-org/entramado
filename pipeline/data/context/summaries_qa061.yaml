- entity_id: Company:geoalcali
  name: GEOALCALI
  resumen: 'Geoalcali S.L. (B37508900) es la sociedad española titular del proyecto de minería de potasa Mina Muga,
    entre Navarra y Aragón, y filial de Highfield Resources, a la que un correo intervenido llama «la matriz de
    geoalcali» (informe UCO, p.29) y que elDiario.es y Vozpópuli describen como minera australiana. Según el informe
    de la UCO sobre Santos Cerdán, Koldo García mantenía relación con Acciona desde al menos 2015 «con ocasión de
    una explotación minera de potasa entre Navarra y Aragón vinculada a la mercantil GEOALCALI», que «contrató los
    servicios de ACCIONA en UTE con otra pequeña mercantil de nombre SERVINABAR 2000» (informe UCO, p.14), la sociedad
    de Antxon Alonso; la UCO sitúa ahí el origen de los contactos entre Cerdán, Koldo García y Fernando Merino,
    entonces responsable de Acciona en Navarra y La Rioja (elDiario.es). Sobre la adjudicación las fuentes difieren:
    elDiario.es afirma que Geoalcali adjudicó a la UTE Acciona-Servinabar la elaboración del proyecto por 56,9 millones
    de euros; Vozpópuli (14 de junio de 2025) que adjudicó a Acciona la obra civil en abril de 2024 por 56,9 millones;
    y la propia Geoalcali, en un comunicado recogido por okdiario Navarra (20 de noviembre de 2025), niega haber
    adjudicado «ninguna obra de construcción a la UTE de Servinabar-Acciona por 57 millones de euros», afirma que
    adjudicó a Acciona la obra civil en abril de 2024 por 57 millones y que en 2016 negoció con la UTE un acuerdo
    no vinculante que no prosperó. En ese comunicado la empresa sostiene que el informe policial «sitúa a Mina Muga
    únicamente como contexto y no atribuye a la empresa ninguna participación en los hechos investigados ni conductas
