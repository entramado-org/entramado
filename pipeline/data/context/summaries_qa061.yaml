- entity_id: Person:david-cierco-jimenez-de-parga
  name: David Cierco Jiménez de Parga
  resumen: 'David Cierco Jiménez de Parga fue director general de la entidad pública empresarial Red.es desde julio
    de 2018, nombrado por su Consejo de Administración el 24 de julio de 2018 (informe de la Guardia Civil, p.118),
    hasta su cese posterior, en el que le sucedió Alberto Martínez Lacambra (p.118 y p.121); según Zonamovilidad
    (24-07-2018), llegó al cargo en sustitución de José Manuel Leceta y era hasta entonces consejero delegado de
    Truphone Digital. Según el informe de la Guardia Civil (UCO) en las diligencias por presunto tráfico de influencias
    (p.2), Cierco rubricó el 3 de junio de 2020, en su condición de director general, los pliegos (PPT y PCAP) de
    los tres expedientes de Red.es que el informe examina (p.110): los de formación 014/20-ED y 016/20-ED, adjudicados
    en 2021 a la UTE The Valley-Innova Next, y el 044/20-ED (Oficina Acelera Pyme), adjudicado a la UTE Innova Next-KPMG
    Asesores (p.80-81), en el marco de la investigación sobre las cartas de declaración de interés y apoyo firmadas
    por Begoña Gómez en favor de esa UTE (p.61 y p.132). El informe no le atribuye, más allá de esa intervención
    en los expedientes, otras vinculaciones con Begoña Gómez (p.132). Su mención en la causa deriva de esa función
    de máxima responsabilidad sobre las licitaciones; según el propio informe, citando a Dircomfidencial (09-02-2024),
    no ostentaría ya cargo público y se habría incorporado a la consultora Acento (p.85). No consta que esté investigado
    ni imputado y rige la presunción de inocencia.'
