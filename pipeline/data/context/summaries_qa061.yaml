- entity_id: Organization:dxc-technology-servicios-espana-s-l-u
  name: Dxc Technology Servicios España S.L.U.
  resumen: 'DXC Technology Servicios España, S.L.U. es una sociedad española del grupo tecnológico DXC Technology;
    según DatosCIF, fue constituida el 30 de junio de 2016 (antes denominada IT Corporate Solutions Spain SL), tiene
