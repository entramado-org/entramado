- entity_id: Person:ramon-alzorriz-goni
  name: Ramón Alzórriz Goñi
  resumen: Considerado el 'número dos' de María Chivite en el PSN, era vicesecretario general y portavoz parlamentario
    cuando dimitió de sus cargos orgánicos el 18 de junio de 2025, tras conocerse que su pareja trabajó en Servinabar
