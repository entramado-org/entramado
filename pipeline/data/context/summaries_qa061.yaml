- entity_id: Organization:universidad-complutense-de-madrid
  name: Universidad Complutense de Madrid
  resumen: La Universidad Complutense de Madrid es una universidad pública (auto de 20 de junio de 2026, p.33).
    Figura en la causa instruida por el juez Juan Carlos Peinado (Juzgado de Instrucción nº 41 de Madrid) porque
    en ella Begoña Gómez, esposa del presidente Pedro Sánchez, dirigía la cátedra extraordinaria 'Transformación
    Social Competitiva' (constituida en octubre de 2020 y, según Wikipedia, no renovada en 2024) y codirigía el
    Máster de Fundraising (suspendido en octubre de 2024, según el auto de 11 de abril de 2026). La instrucción
    examina la financiación y explotación de la plataforma digital desarrollada en el entorno de la cátedra, los
    contratos relacionados con Deloitte y las cartas de apoyo que Gómez firmó como codirectora del máster; el auto
    de 20 de junio de 2026 (p.44-45) describe el registro de marcas y la transferencia de un dominio a nombre de
    Gómez y señala que el registro universitario del software no llegó a culminarse. La UCM está personada como
    actor civil, en condición de perjudicada, sin formular acusación penal (auto de 20 de junio de 2026, p.25 y
    p.78); según Infobae (28 de julio de 2026), reclama 113.509,32 euros de responsabilidad civil solidaria a Gómez
    y a su asesora en caso de condena por malversación, además de la restitución del software. Según Euronews y
    OKDiario, informes de la UCO de mayo de 2026 concluyeron que la creación de la cátedra se ajustó a la normativa
    universitaria, pero cuestionan el software. Rige la presunción de inocencia para todas las personas investigadas,
    sin que ello prejuzgue responsabilidad alguna de la institución.
