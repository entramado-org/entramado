    (el informe de la Guardia Civil lo data en octubre de 2018, p.122; El Independiente, en septiembre); según El
    Independiente (01-10-2025), antes fue subdirector general en los ministerios de Hacienda, Educación e Industria
    y, desde 2012, asesor en la Dirección General de Fondos Europeos de Hacienda. Según ese mismo diario, la Fiscalía
    Europea (EPPO) le mantiene imputado, junto al empresario Juan Carlos Barrabés, por la presunta adjudicación
    irregular de contratos financiados con fondos europeos a la consultora de Barrabés, la parte del caso Begoña
    Gómez que asumió la Fiscalía Europea: el auto de 11 de abril de 2026 recuerda que esta «está investigando solo
    lo relativo al uso de fondos europeos» (p.22) y que las cartas de apoyo de Gómez figuran en los expedientes
    de Red.es 014/20 y 016/20 (p.13). El informe de la Guardia Civil documenta que Prieto suscribió, como director
    de Economía Digital, los informes de valoración de los criterios sujetos a juicio de valor en los tres expedientes
    analizados (9 de febrero, 9 y 12 de abril de 2021), en los que la oferta mejor valorada fue la de la UTE participada
    por Innova Next (Barrabés): con KPMG en el expediente 044/20-ED (p.87) y con The Valley en los expedientes 014/20-ED
    y 016/20-ED (p.81; informes de valoración, pp.95, 103 y 115), y que el 21 de junio de 2021 emitió el informe
    que consideró no justificada la baja de la UTE Awakelab (p.106). Según El Independiente, un informe de la IGAE
    aportado a la causa sostiene que esa exclusión «no está razonablemente fundamentada» y que, de no haberse producido,
    Awakelab —con una oferta 1.363.899 euros inferior— habría sido la adjudicataria, y que se valoraron factores
    ajenos a los pliegos, como las dos cartas de recomendación firmadas por Begoña Gómez; el exdirector general
    de Red.es David Cierco (2018-2021) le señaló en el Senado en noviembre de 2024 como responsable de redactar
    los pliegos. Las adjudicaciones a la UTE de Barrabés y The Valley sumaron 10,2 millones de euros y los delitos
    investigados son apropiación indebida, tráfico de influencias y prevaricación, según El Independiente. Rige
