- entity_id: Person:federico-lledo-soria
  name: Federico Lledo Soria
  resumen: Federico Lledó Soria fue administrador único de Summer Wind SL entre el 23 de noviembre de 2009 y el
    22 de abril de 2014 y socio único entre 2011 y 2014, según el informe UDEF 1907 (p.120); el auto de la Audiencia
    Nacional de 18 de mayo de 2026 lo describe como «que fue administrador de Summer Wind» (p.40) y El Correo Gallego
    (22-05-2026) como exdirectivo y «responsable de Summer Wind SL». Según ese mismo informe (p.120 y p.138), desde
    el 18 de marzo de 2023 la administradora única de la sociedad es su hija, María Elena Lledó Gómez, apoderada
    desde 2015. Según el auto (p.41), en 2023 Summer Wind SL recibió ingresos de Plus Ultra por importe de 3.979.182
    euros y efectuó pagos a Afitta SL, sociedad del entorno de Julio Martínez Martínez, por un importe total de
    213.202 euros, correspondientes a una factura emitida el 30 de diciembre de 2023 por Martínez Martínez a través
    de Afitta «para justificar el flujo de fondos declarado»; el 14 de febrero de 2024 Julio Martínez Sola le pidió
    «el concepto de la factura de Julio Martínez Martínez» y al día siguiente Lledó le remitió un audio pidiendo
    que preguntara «a la gente de Afitta si han pagado» para poder cambiar el concepto (p.41-42). El auto recoge
    además que el 19 de abril de 2024 Martínez Martínez reprochó a Martínez Sola que Lledó no hubiera firmado el
    contrato ni pagado, y que el 10 de julio de 2024 Lledó comunicó un nuevo pago (p.42). Según El Correo Gallego
    (22-05-2026), la empresa se ha desvinculado de su exdirectivo y afirma en un comunicado que «la gestión y propiedad
    actuales de la compañía son plenamente independientes de anteriores administradores o accionistas». No consta
    en los documentos analizados que Lledó Soria tenga la condición de investigado; los hechos están en fase de instrucción y rige
    la presunción de inocencia.
