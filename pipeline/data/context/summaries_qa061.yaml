- entity_id: Organization:procuraduria-general-del-estado
  name: Procuraduría General del Estado
  resumen: La Procuraduría General del Estado es la institución boliviana encargada de la representación y defensa
    jurídica de los intereses del Estado en acciones judiciales, extrajudiciales y administrativas. Figura en el
    contexto de la causa que investiga a José Luis Rodríguez Zapatero (diligencias previas 77/2024, auto de 18 de
    mayo de 2026, p.2) porque uno de los contactos institucionales señalados por el informe 2910/26 de la UDEF (22
    de junio de 2026) fue César Adalid Siles Bazán, Procurador General del Estado de Bolivia entre septiembre de
    2023 y septiembre de 2024 y después ministro de Justicia hasta junio de 2025 (p.9), con quien Zapatero habría
    gestionado en diciembre de 2024 una reunión para directivos del Grupo Gloria (p.63); la Notificación de Controversia
    presentada por el Grupo Gloria el 17 de enero de 2024 se dirigió al Procurador General del Estado, entonces
    Siles Bazán (p.30), y Ricardo Condori Tola, Procurador General del Estado entre diciembre de 2024 y noviembre
    de 2025, aparece asimismo como contacto solicitado por indicación de Zapatero en mayo de 2025 (p.56 y p.64).
    Según el informe UDEF 2910 (pp.8-11 y 62-64), la actividad investigada buscaba influir ante autoridades bolivianas
    en el litigio que enfrentaba a SOBOCE (filial del Grupo Gloria) con la cementera estatal FANCESA. Es un organismo
    público boliviano, no un investigado; se cita como entorno institucional de la causa.
