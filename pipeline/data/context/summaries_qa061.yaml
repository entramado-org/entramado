- entity_id: Person:ruben-goni-urroz
  name: Ruben Goñi Urroz
  resumen: Ruben Goñi Urroz fue director del Instituto Navarro de Deporte y Juventud (INDJ) (según Wikipedia), organismo
    que, según el informe de la UCO sobre Santos Cerdán, estaba «presidido en ese momento» por él cuando anunció
    en 2017 el pliego de los lotes 4 y 5 de adecuación del pabellón Navarra Arena en Pamplona; el 10 de octubre
    de 2017 la mesa de contratación propuso adjudicar esas obras a la UTE de Acciona y Servinabar por 3,7 millones
    de euros, y la UTE Pabellón Navarra Arena resultó adjudicataria ese mismo mes (informe UCO, p.34). El informe
    destaca un mensaje de WhatsApp enviado por Koldo García a Santos Cerdán el 3 de octubre de 2017, una semana
    antes de esa propuesta, que la UCO considera «compatible temporalmente» con la constitución de la UTE (informe
    UCO, p.46), lo que sitúa esta licitación entre las analizadas en Navarra. No consta que esté imputado y rige
    la presunción de inocencia; su papel es el de responsable del órgano contratante de la época.
