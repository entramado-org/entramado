- entity_id: LegalCase:causa-especial-20775-2020
  name: Causa Especial 20775/2020
  resumen: La Causa Especial 20775/2020 es el procedimiento que tramita la Sala Segunda del Tribunal Supremo,
    instruido por el magistrado Leopoldo Puente, en el marco del llamado caso Koldo. En ella fueron acusados
    el exministro de Transportes José Luis Ábalos —cuya condición de aforado como diputado determinó la
    competencia del Supremo—, su exasesor Koldo García y el empresario Víctor de Aldama por delitos vinculados
    al cobro de comisiones en la adjudicación de contratos públicos. Tras el juicio oral ante la Sala
    Segunda (abril-mayo de 2026), la sentencia núm. 418/2026, de 22 de junio de 2026, condenó a los tres
    por organización criminal y cohecho —y a Ábalos y García también por tráfico de influencias y malversación—,
    y los absolvió de prevaricación, uso de información privilegiada y falsedad; dictada en instancia
    única, no prevé recurso ordinario. El exsecretario de Organización del PSOE Santos Cerdán declaró
    como investigado en la causa el 30 de junio de 2025 y la instrucción respecto de él continúa; a su
    favor rige la presunción de inocencia. El instructor acordó prórrogas de la instrucción y abrió piezas
    separadas.
