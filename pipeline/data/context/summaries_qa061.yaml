    en 2020 de ocho contratos de suministro de material sanitario (exposición razonada, p.2). Según Vozpópuli y
    El Diario Alerta (02-03-2024), que citan a la UCO, el holding familiar de Cueto se habría quedado con el 35
    % de los fondos públicos obtenidos y los habría movido entre seis sociedades del grupo para evitar su rastreo.
    Según Moncloa.com (10-09-2026), el juez Ismael Moreno citó a Juan Carlos Cueto a declarar como investigado el
    11 de septiembre de 2026 en la pieza de las mascarillas de la Audiencia Nacional, atribuyéndole el auto «control
    de hecho sobre todas las sociedades que conforman el grupo Cueto». Todo se enmarca en una investigación judicial
    en curso; rige la presunción de inocencia y no hay condena contra el grupo ni contra Cueto.
