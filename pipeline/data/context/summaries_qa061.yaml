- entity_id: Person:jose-ruz
  name: José Ruz
  resumen: José Ruz Martínez ('Pepe Ruz') es propietario de la constructora Levantina Ingeniería y Construcción
    (LIC), una de las tres empresas cuyas adjudicaciones de obra pública investiga el Tribunal Supremo en el 'caso
    Koldo/Cerdán' (informe UCO). Según The Objective (5 de julio de 2025), el magistrado del Supremo aprecia «indicios
    bastantes» de que el constructor se benefició de adjudicaciones a cambio de pagos de comisiones a Koldo García
    y José Luis Ábalos y cree que podría haber incurrido en delitos de cohecho activo y pertenencia a organización
    criminal. Según OKDiario e Infobae (4 de julio de 2025), reconoció ante el Supremo haber pedido, a través de
    Koldo García, reunirse con Santos Cerdán para resolver problemas con contratos, y negó haber pagado comisiones;
    Anticorrupción solicitó la retirada de su pasaporte y comparecencias quincenales, medidas que, según Infobae
    y The Objective, el magistrado acordó. Rige la presunción de inocencia. No confundir con el magistrado Pablo
    Ruz, otra persona.
