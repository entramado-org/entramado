- entity_id: Person:alba-rodriguez-espinosa
  name: Alba Rodríguez Espinosa
  resumen: 'Alba Rodríguez Espinosa es una de las hijas del expresidente del Gobierno José Luis Rodríguez Zapatero
    y, junto con su hermana Laura, administra solidariamente la mercantil Whathefav SL (auto del juez José Luis
    Calama de 18 de mayo de 2026, p.69). Según el informe de la UDEF (nº 1907, p.92) y ese auto (p.31), las cuentas
    de Análisis Relevante SL —sociedad controlada formalmente por Julio Martínez Martínez— reflejan pagos a Whathefav
    por 239.755,01 euros entre el 9 de junio de 2020 y el 2 de diciembre de 2025, amparados en facturas emitidas
    entre 2020 y 2024 bajo el concepto genérico «servicios agencia», «sin detalle alguno sobre la prestación real»;
    el auto considera indiciariamente que la sociedad actúa como «vehículo instrumental para la generación de facturación
    ad hoc» dentro del entramado investigado por el rescate de Plus Ultra (p.69). Ese mismo auto acordó la entrada
    y registro en la sede de Whathefav y el acceso al contenido de los dispositivos intervenidos (p.1, p.3 y p.71);
    según Infobae (26-05-2026), en el registro se descargaron buzones corporativos asociados a Laura y Alba. El
    18 de junio de 2026 Calama acordó citarla como investigada, junto a su hermana Laura y a la secretaria personal
    de Zapatero, María Gertrudis Alcázar, al apreciar en Whathefav un «papel instrumental en la canalización, ocultación
    o facilitación de operaciones» relevantes para la causa, según El Independiente (18-06-2026); según Wikipedia,
    la citación se acordó a petición de la Fiscalía Anticorrupción. Según The Objective y Vozpópuli (21-07-2026),
    Julio Martínez Martínez declaró como investigado que siguió pagando a Whathefav una iguala de 3.000 euros al
    mes hasta 2025 aunque desde 2022 las hermanas ya no realizaban trabajo alguno; y según elDiario.es (29-07-2026),
    Calama autorizó a la UDEF el acceso a más de 60 cuentas bancarias, entre ellas las de Alba, Laura y Whathefav.
    Se trata de una instrucción en curso y le ampara plenamente la presunción de inocencia: no hay acusación, juicio
    ni condena, y ser citada como investigada no implica culpabilidad.'
