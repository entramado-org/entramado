- entity_id: Company:landside-holding-ltd
  name: Landside Holding Ltd
  resumen: 'Landside Holding Ltd (también ''Landside Holdings Limited'') es una mercantil offshore radicada en las
    Islas Vírgenes Británicas (RG Hodge Plaza, Road Town, Tortola) que, según el informe de la UDEF (informe-udef-1907),
    preside y representa Julio Martínez Martínez (investigado), señalado por los agentes como presunto canalizador
    de fondos en la trama del rescate de Plus Ultra. En el ordenador intervenido a Martínez se halló un documento
    ''MANDATE LANDSIDE HOLDING'' (acuerdo de negociación, con honorarios del 8,75% de los fondos recaudados) y constancia
    de activos de la sociedad en 2016 (cuenta de broker MORA WM SECURITIES LLC). El informe de la UDEF la presenta
    como una de las sociedades radicadas en territorios offshore de las que dispondría la red de influencia investigada
    (informe UDEF 1907, p.100). Debe distinguirse de ''Landside Middle East FZCO / Landside Dubai Fzco'', la sociedad
    de Dubái creada en 2021 y 100% participada por Idella Consulenza Strategica. Presunción de inocencia: hechos
    atribuidos según informe policial, sin sentencia.'
