- entity_id: LegalCase:diligencias-previas-numero-147-2024
  name: Diligencias Previas número 147/2024
  resumen: Diligencias Previas 147/2024 es la causa instruida por el Juzgado Central de Instrucción nº 5 de la Audiencia
    Nacional (magistrado Santiago Pedraz), incoada por auto de 21 de junio de 2024, por presuntos delitos contra
    la Hacienda Pública, organización criminal y blanqueo de capitales en torno a la operadora de hidrocarburos
    Villafuel SL (auto de 21 de octubre de 2024; auto citado por Moncloa.com, 04-06-2025). La Fiscalía Anticorrupción
    cifró el presunto fraude a la Hacienda Pública en más de 182 millones de euros en dos años (Diario de Castilla
    y León, 07-10-2024). Entre los investigados figuran Víctor de Aldama y el empresario Claudio Rivas (Villafuel),
    querellados por el Partido Popular junto con Koldo García (auto de 21-10-2024); Aldama fue detenido el 7 de
    octubre de 2024 (Diario de Castilla y León, 07-10-2024), fecha del registro ordenado por este juzgado (escrito
    de la defensa de Aldama, p.16), y Rivas también fue detenido en esa operación (El Español, 24-01-2025). El teléfono
    de Aldama incautado en esa causa contiene, según su propia defensa, información relevante para la causa especial
    del Tribunal Supremo sobre José Luis Ábalos (escrito de la defensa de Aldama, p.3 y p.16). La instrucción ha
    sido objeto de sucesivas prórrogas. Todos los investigados están amparados por la presunción de inocencia.
