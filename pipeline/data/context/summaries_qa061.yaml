    cátedra (auto de 11 de abril de 2026, p.24), y el 11 de julio de 2022 Álvarez remitió al vicerrector Doadrio
    el borrador de una carta de solicitud de colaboración económica a Google por 80.000 euros (auto de 20 de junio
    de 2026, p.36). Declaró como testigo en noviembre de 2025 (El Español, 17-11-2025) y, según el auto de 11 de
    abril de 2026 (p.26), manifestó que coincidió con Cristina Álvarez en reuniones relacionadas con la cátedra
    y que esta se presentó como integrante del equipo de trabajo. Comparece como testigo, sin que conste imputación
    penal contra él; rige la presunción de inocencia.'
