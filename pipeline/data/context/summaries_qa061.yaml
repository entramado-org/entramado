- entity_id: Person:eugenio-pereiro-blanco
  name: Eugenio Pereiro Blanco
  resumen: Comisario principal de la Policía Nacional (nacido en 1959, ingresó en 1980; comisario principal desde
    2015, según Europa Press vía Infobae, 15-09-2025) que fue comisario general de Extranjería y Fronteras (nombrado
    en diciembre de 2017, según la misma agencia) y comisario general de Información desde noviembre de 2018 (Orden
    INT/1177/2018 de 12-nov-2018, BOE 14-nov-2018) hasta su jubilación policial en octubre de 2024, tras 44 años
    de servicio (Europa Press vía Infobae, 15-09-2025). En septiembre de 2025 el ministro del Interior, Fernando
    Grande-Marlaska, le eligió como director general de Coordinación y Estudios del Ministerio del Interior, «uno
    de los puestos más relevantes y sensibles dentro del organigrama de la cartera» según Europa Press (vía Infobae,
    15-09-2025); preguntado en la comisión del caso Koldo del Senado por ese nombramiento, Marlaska afirmó que el
    expediente «lo determinó la Secretaría de Estado de Seguridad» y que respondió a razones profesionales (Diario
    de Sesiones del Senado DS_C_15_745, 30-06-2026, p.96-97). Aparece en esta base por el contexto de la comparecencia
    de Marlaska y la cúpula de Interior en la comisión del caso Koldo del Senado. No consta que esté investigado
    en ninguna causa de la trama; rige la presunción de inocencia.
