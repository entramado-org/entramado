    UDEF 1907 (p.36) y 1908 (p.83) aparece como remitente a Koldo García del mensaje «Está zapatero reunido ahora
    mismo con el ministro de inclusion y seguridad social en ministerio de trabajo», que este reenvió a Ábalos,
    dentro de una secuencia de comunicaciones reproducida en el análisis de los dispositivos intervenidos. Su mención
    es contextual dentro del caso Koldo/Ábalos; rige la presunción de inocencia y no consta que esté investigado
    ni imputado.
