    Infobae (27-05-2026), en su declaración judicial narró dos pagos de 45.000 € cada uno en la sede del partido.
    Según El Español (29-06-2026), el 29 de junio de 2026 reiteró ante Pedraz, como testigo, que entregó los 90.000
