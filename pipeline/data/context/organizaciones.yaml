# Curated context layer — ORGANIZATIONS, COMPANIES and COURTS: neutral public
# descriptions ("what this institution/company is"), plus a couple of public
# corporate ownership facts. No alleged conduct — only what the body publicly is.
#
# Types MUST match the existing node's label (Organization / Company / Court) or
# a new node would be created instead of enriching the real one.
#
# ⚠️ FUENTE OBLIGATORIA EN `relations:` (spec 061) — desde la auditoría dual, una
# relación de contexto SOLO se carga si trae `source_url:` (https) y, si consta,
# `source_date:`. Las filas sin fuente se quedan aquí como backlog («documentar o
# retirar») pero el loader las salta y las cuenta
# (`context_skip_rel_unsourced` / `context_relations_unsourced_skipped`): las 49
# aristas sin fuente retiradas del grafo por Path A no pueden resucitar en el
# siguiente `make context`. Ejemplo:
#   - {source: "Fulana de Tal", target: "PSOE", type: MEMBER_OF,
#      source_url: "https://www.boe.es/…", source_date: '2024-01-02'}

entities:
  # --- State / public bodies ---
  - {name: "Gobierno de España",                                  type: Organization, role: "Poder ejecutivo del Reino de España"}
  - {name: "Ministerio de Transportes, Movilidad y Agenda Urbana", type: Organization, role: "Ministerio del Gobierno de España responsable de transportes e infraestructuras"}
  - {name: "Ministerio de Fomento",                               type: Organization, role: "Denominación anterior (hasta 2020) del Ministerio de Transportes"}
  - {name: "ADIF",                                                type: Organization, role: "Administrador de Infraestructuras Ferroviarias (entidad pública empresarial)"}
  - {name: "Puertos del Estado",                                  type: Organization, role: "Organismo público que coordina las Autoridades Portuarias (Mº de Transportes)"}
