# Curated context layer — PEOPLE: public roles, family ties and party/office links.
#
# GROUND RULES (keep the presumption-of-innocence model intact):
#   - Only well-known, verifiable PUBLIC facts (offices held, party membership,
#     family relationships, founding/ownership of a company). NEVER alleged
#     wrongdoing — that belongs to the documents, with their own provenance.
#   - `name` must match the canonical name already in the graph so it MERGEs.
#   - Optional `aliases: [..]` on an entity: curated extra names (e.g. the BOE
#     registral name of a public figure). ADDITIVE union onto n.aliases, deduped,
#     never subtracts. Add entries INSIDE this `entities:` section — an entity
#     appended at the end of the file lands under `relations:` and is silently lost.
#   - Org/company endpoints used in relations here are declared in
#     organizaciones.yaml (all context files are loaded together).
#
# ⚠️ FUENTE OBLIGATORIA EN `relations:` (spec 061) — desde la auditoría dual, una
# relación de contexto SOLO se carga si trae `source_url:` (https) y, si consta,
# `source_date:`. Las filas sin fuente se quedan aquí como backlog («documentar o
# retirar») pero el loader las salta y las cuenta
# (`context_skip_rel_unsourced` / `context_relations_unsourced_skipped`): las 49
# aristas sin fuente retiradas del grafo por Path A no pueden resucitar en el
# siguiente `make context`. Ejemplo:
#   - {source: "Fulana de Tal", target: "PSOE", type: MEMBER_OF,
#      source_url: "https://www.boe.es/…", source_date: '2024-01-02'}
#
# Re-run `make context` after editing (idempotent).

