# Curated context layer — ENRICHED ROLES (swarm-generated, web-sourced, verified).
#
# Produced by the enrich-entity-descriptions Workflow: each role was drafted from
# public sources and passed an adversarial fact-check; high-profile figures got a
# 3-vote review. Loaded by `make context` alongside the hand-curated figures.yaml /
# organizaciones.yaml. This file sorts AFTER them, so its `role` wins on shared
# entities (the curated files are left untouched; delete this file to revert).
#
# GROUND RULE (updated 2026-05-30, per user): unlike figures.yaml's "never alleged
# wrongdoing" rule, these roles MAY state the person's ROLE IN THE CASE, but ONLY
# with presumption-of-innocence language ("investigado", "imputado", "presunta
# trama", "según la UCO") and backed by the `sources` listed. Never assert guilt.
#
# `sources` is provenance only — context_loader ignores it (reads name/type/role).
# Re-run `make context` after editing.

