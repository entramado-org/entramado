# Retiradas y correcciones de ROLES curados de la auditoría dual (spec 061).
#
# Lo llena `make qa-dual-patches` y lo revisa un humano; se carga EL ÚLTIMO del
# overlay de contexto (los `*_qa061.yaml` van al final), así que pisa a
# `roles_enriched.yaml` para una misma entidad.
#
# ⚠️ Un fichero de contexto tiene DOS claves de primer nivel, `entities:` y
# `relations:`. Añadir una persona al final del fichero la mete bajo `relations:` y
# su rol NO se carga nunca, en silencio (gotcha de figures.yaml). Añade SIEMPRE
# dentro de `entities:`.
#
# Formas por entrada de `entities:`:
#   - {type: Person, name: <nombre exacto>, role: <rol corregido>}
#   - {type: Person, name: <nombre exacto>, role: remove}   # borra el rol (MATCH-only)
# `relations:` admite además `source_url:` (https) y `source_date:` — ojo, la clave es
# `source_url` porque `source:`/`target:` ya son los EXTREMOS. Una afirmación
# de contexto sin fuente es candidata a retirada por el lint L17.
#
# NUNCA se aplica al grafo vivo: Path A (efímero sobre el seed → `make context` →
# diff-gate → re-tar → bump del seed).
