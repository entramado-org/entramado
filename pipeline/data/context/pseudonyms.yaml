# Seudónimos de anonimización judicial — cargado por `make context`
# (context_loader.load_pseudonyms → SET n.is_pseudonym=true, n.pseudonym_note).
#
# Los autos del Tribunal Supremo (ficheros ATS_*.pdf) sustituyen el nombre real de
# cada investigado por un nombre de pila ficticio de un roster fijo (Paulino, Romulo,
# Roman, Alejo, Desiderio…). Cada uno es una PERSONA REAL DISTINTA: no se fusionan ni
# se les atribuye nombre civil (la fuente no lo da). Se marcan para que la UI/MCP los
# distingan y NO se lean como hubs reales ni se confundan con homónimos.
#
# Algunos nodos (felix, jaime, tomas, yolanda, mercedes, fatima) eran CONFLACIONES:
# el seudónimo + una persona real con nombre. La persona real se separa en
# relations.yaml (splits); el REMANENTE de cada uno es el seudónimo, marcado aquí.
# Orden de aplicación: `make relations` (splits) ANTES de `make context` (este flag),
# para que el flag caiga sobre el nodo ya limpio. Ver
# findings/resolucion-entidades-2026-06-15.
#
# Verificado por swarm de triaje + verificación adversarial (sesión 30).
# 2026-09-09 (spec 061, Fase 1): retiradas del fichero las entradas de 33 seudónimos que no tenían ninguna
# arista de dominio (solo menciones) y fueron borrados del grafo como huérfanas (diario retiradas-20260908T231139Z.json).
# Si una ingesta futura los recrea, volver a declararlos aquí ANTES de `make context` (guard F1).
# 2026-09-09 (spec 061 F1): `note` es AHORA un texto neutro fijo (sin cargo, sin descripción de conducta) porque
# la API/MCP lo sirven como pseudonym_note y un cargo identifica. La curación original (splits, triaje,
# referencias) se conserva en `curacion:` — el loader NO la lee.
