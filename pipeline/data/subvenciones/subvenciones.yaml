# Overlay SUBVENCIONES (BDNS/SNPSAP) — data file CURADO (spec 042, Fase 2).
# Cargado por `make subvenciones` (subvenciones_loader.py). NO confundir con
# matches.candidate.yaml (semilla del recon 041, no se carga).
#
# Reglas (spec/plan 042 + decisiones dueño 2026-07-11):
#   * Una arista RECEIVED_GRANT por concesión curada: (beneficiaria)-[:RECEIVED_GRANT]->(convocante),
#     clave de MERGE {source_kind:'subvencion', bdns_key} — el NIF es ATRIBUTO, nunca clave.
#   * `en_flujos: true` SOLO en los 4 rescates SEPI → llevan `amount` y entran en /flujos.
#     El resto lleva `importe` y NO aparece en la vista dinero.
#   * `beneficiario` SIEMPRE debe existir (MATCH = gate ≤1 salto); los stubs de `convocantes:`
#     solo se crean si faltan Y los referencia una concesión con beneficiaria viva.
#   * Recibir una subvención o aval es LEGAL: la señal editorial es el cruce con la trama
#     (y la consecuencia: avales públicos → concurso), nunca la ayuda en sí. Presunción de inocencia.
#   * Gate 3 dudosos (Anfersa/Aquaterra/OPR) RESUELTO 2026-07-11: aprobados por el dueño con
#     anclaje documental verificado (ver specs/042-overlay-subvenciones/tasks.md Log).
# Fuente: API pública SNPSAP (infosubvenciones.es); crudos completos en _raw_sweep.jsonl.

convocantes:   # stubs — creados solo si no existen. SEPI / ICO / M. Industria / Junta de
