# Curated RELATIONS-correction overlay — loaded by `make relations`
# (pipeline/src/relations_loader.py). Durable & idempotent; survives re-ingest.
#
# Two sections:
#   splits: — separate two real people the resolver merged because they share a
#             name. All edges + mentions sourced from `by_doc` move to `namesake`.
#             (None currently — see the note below about auto-zapatero.pdf.)
#   deny:   — delete misleading/hallucinated EXTRACTED edges (source_kind
#             null/'judicial'); curated/contexto/prensa/acusacion edges are kept.
#             Matches BOTH directions of (source,target,type); narrow with
#             optional `doc` and/or `quote_contains`. Endpoints default to Person
#             (override with source_type/target_type, or give source_id/target_id).
#
# Correct identities, roles, family/party ties live in ../context/*.yaml, not here.
#
# NOTE — do NOT split José Luis Rodríguez Zapatero. `auto-zapatero.pdf` (Diligencias
# Previas 77/2024, Tribunal Central de Instancia, 18-05-2026) investiga al PROPIO
# expresidente en la trama de Plus Ultra / Análisis Relevante / Venezuela (tráfico
# de influencias, blanqueo): es él, no un homónimo. (Una sesión anterior asumió por
# error que era un empresario homónimo y se llegó a separar; revertido.)

# Resolución de entidades (sesión 30): el extractor fusionó por NOMBRE DE PILA varias
# personas reales distintas bajo un mismo nodo. Cada split crea el `namesake` y le mueve
# las aristas + menciones cuyo `source_doc`/`doc_id` == `by_doc`. El REMANENTE se queda en
# el canónico (en estos casos = el seudónimo judicial, marcado aparte en context/pseudonyms.yaml).
# NB del mecanismo: by_doc separa POR DOCUMENTO; dos personas en el MISMO doc no se separan
# (para eso está by_quote, spec 014). Alejandro/Eduardo escindidos por by_quote el 2026-07-16
# (enmienda spec 049); Alfonso sigue diferido — ver findings/resolucion-entidades-2026-06-15.
