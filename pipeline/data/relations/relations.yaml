  # Reglas sobre seudónimos judiciales retiradas: la política vive en el loader + seudonimos_permitidos.yaml (spec 070).
  # (1) El nodo-evento «Comisión … covid» era un imán de 111 alias que fundía la comisión
  #     del Congreso con la pandemia-tema, comités administrativos, la investigación UCO,
  #     categorías de contrato y verbos/fragmentos (spec 025:24-39). keep_only = los 19 que
  #     nombran la comisión (= keep-set vivo tras s82). "máximas Cámaras" es borde pero fue
  #     el conjunto que bendijo el dueño en s82; se reproduce tal cual (no re-litigar aquí).
  - id: "Event:comision-de-investigacion-sobre-los-contratos-publicos-duran"
    reason: "spec 025 (enfoque A) — des-conflar el imán de alias covid; conservar sólo los alias que nombran la Comisión del Congreso"
    # 2026-08-28 (pasada de contexto s88, OK dueño): los 12 alias GENÉRICOS salen del
    # keep-set — s86 demostró que «la Comisión»/«una comisión de investigación»/etc.
    # imantaron 86 menciones falsas en 17 docs vía el resolver (comisión de delitos,
    # Comisión Europea, comisión judicial…); cualquier ingesta futura re-imantaba.
    # Quedan solo los 5 alias que nombran la comisión por su objeto.
    keep_only:
      - "Comisión de Investigación sobre contratos públicos durante la pandemia"
      - "Comisión de Investigación sobre los contratos públicos"
      - "Comisión de Investigación sobre los contratos públicos durante la pandemia"
      - "Comisión de Investigación sobre los contratos públicos realizados durante la pandemia de covid-19"
      # 2026-07-29 (triaje pass2b): el nombre oficial de la comisión DEL SENADO y el alias
      # "comisión del Senado" salen del keep-set — viven en el Event propio del Senado
      # (split nh_triage_pass2b); mantenerlos aquí re-absorbería la conflación en re-ingest.
      - "Comisión sobre contratos públicos"

