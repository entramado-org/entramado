  #  · 62/2025 — dimanante de las DP 597/2021 (informe-udef-1907/1908), Tribunal de Instancia de
  #    Madrid Plaza nº15 → se queda en el canónico.
  #  · 8/2025 (08/2025) — del caso Begoña Gómez (DP 1146/2024), auto-begona-jurado: la investigada
  #    Begoña Gómez y el coinvestigado Martín Aguirre son PARTY_TO, declaración testifical de Bolaños.
  # Separan limpiamente por documento (todo lo de Begoña viene de auto-begona-jurado-2025-09-23.pdf).
  - canonical: {type: LegalCase, name: "Pieza Separada 62/2025"}
    namesake: {type: LegalCase, name: "Pieza Separada 8/2025",
               role: "Pieza separada 8/2025 (art. 762.6 LECrim, DP 1146/2024) del caso Begoña Gómez, Tribunal de Instancia de Madrid"}
    by_doc: "auto-begona-jurado-2025-09-23.pdf"
  - canonical: {type: Person, name: "Felix"}
