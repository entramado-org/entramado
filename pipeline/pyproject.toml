[project]
name = "entramado-pipeline"
version = "0.1.0"
description = "Host-side ingestion: PDF -> entities/relations (MLX) -> Neo4j knowledge graph"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Local LLM serving (host, Metal)
    "mlx-lm>=0.28.0",
    # PDF extraction + OCR fallback (Apple Vision, macOS host)
    "pymupdf>=1.24.0",
    "ocrmac>=1.0.0",
    # Orchestration
    "langgraph>=0.2.50",
    "langgraph-checkpoint-sqlite>=2.0.0",
    # Graph DB + integrations
    "langchain-neo4j>=0.4.0",
    "neo4j>=5.26.0",
    # LLM client (points at MLX OpenAI-compatible server)
    "openai>=1.50.0",
    # Embeddings (BGE-m3 on MPS)
    "sentence-transformers>=3.0.0",
    "torch>=2.3.0",
    # Schema / validation
    "pydantic>=2.7.0",
    # Tokenizer for chunk sizing + entity resolution helpers
    "transformers>=4.44.0",
    "rapidfuzz>=3.9.0",
    # Logging / config
    "structlog>=24.1.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "dateparser>=1.4.0",
    # Curated context layer + Obsidian export read/write YAML
    "pyyaml>=6.0",
    # Offline network metrics (betweenness/closeness/Louvain) — spec 012
    "igraph>=0.11",
    # Jev (TypeSafe System One) as the second blind reader of the dual audit — addendum 061-B
    "typesafe-sdk>=0.6,<1",
]

[tool.uv]
# torch needs the CPU/MPS wheels from PyPI on macOS arm64 (default index is fine).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
